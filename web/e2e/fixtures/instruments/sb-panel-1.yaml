schema: simubench.instrument/1
id: sb-panel-1
manufacturer: SimuBench
model: SB-PANEL-1
class: multimeter
version: 1
description: >-
  端到端测试用的万用表：声明了自己的面板（display.panel），界面按声明画出分组与控件，
  不用万用表的类别默认布局（instrument-authoring.md 7.3）。
state:
  sense.function:
    type: enum
    options: [DC, AC]
    default: DC
    label: 测量功能
    label_en: Function
  sense.range:
    type: float
    unit: V
    min: 0.0
    max: 100.0
    default: 0.0
    label: 量程
    label_en: Range
  sense.range_auto:
    type: bool
    default: true
    label: 自动量程
    label_en: Autorange
  sense.nplc:
    type: float
    min: 0.1
    max: 10.0
    default: 1.0
    label: 积分时间（PLC）
    label_en: Integration time (PLC)
  input.impedance:
    type: enum
    options: [TENMeg, HIGH]
    option_labels: {TENMeg: 10 MΩ, HIGH: ">10 GΩ"}
    default: TENMeg
    label: 输入阻抗
    label_en: Input impedance
  beeper:
    type: bool
    default: true
    label: 蜂鸣器
    label_en: Beeper
components:
  - name: meter
    type: dmm_core
    params:
      function: $sense.function
      ranges: [1, 10, 100]
      range: $sense.range
      autorange: $sense.range_auto
      overrange: 1.2
      overload_value: 9.9e37
      z_in: 1.0e7
      z_in_high: 1.0e10
      high_z: {from: $input.impedance, map: {TENMeg: false, HIGH: true}}
ports:
  instrument:
    IN: meter.in
display:
  summary: [sense.function, sense.range]
  panel:
    readouts:
      - {reading: meter.DC, label: 直流, label_en: DC, unit: V, digits: 6, when: {sense.function: DC}}
      - {reading: meter.AC, label: 交流, label_en: AC, unit: V, digits: 6, when: {sense.function: AC}}
    groups:
      - label: 功能
        label_en: Function
        controls:
          - {state: sense.function, control: buttons, keys: [{value: DC, label: DCV}, {value: AC, label: ACV}]}
      - label: 量程
        label_en: Range
        controls:
          - state: sense.range
            control: buttons
            keys:
              - {value: 1, label: 1 V, sets: {sense.range_auto: false}}
              - {value: 10, label: 10 V, sets: {sense.range_auto: false}}
              - {value: 100, label: 100 V, sets: {sense.range_auto: false}}
              - {value: 0, label: AUTO, sets: {sense.range_auto: true}}
      - label: 高级
        label_en: Advanced
        controls:
          - {state: sense.nplc, control: number, step: 0.5, label: NPLC}
          - {state: input.impedance, control: select}
          - {state: beeper, control: switch}
    softkeys:
      - {label: 快速, label_en: Fast, state: sense.nplc, value: 0.1}
      - {label: 精确, label_en: Precise, state: sense.nplc, value: 10}
capabilities: [multimeter]
commands:
  - header: "[:SENSe]:FUNCtion"
    state: sense.function
  - header: "[:SENSe]:VOLTage:RANGe"
    state: sense.range
  - header: "[:SENSe]:VOLTage:NPLC"
    state: sense.nplc
  - header: ":READ"
    op: meter.measure
    set: false
