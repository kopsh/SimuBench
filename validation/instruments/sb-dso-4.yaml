schema: simubench.instrument/1
id: sb-dso-4
manufacturer: SimuBench
model: SB-DSO-4
class: oscilloscope
version: 1
description: 四通道数字示波器，200 MHz，16 位波形传输，输入 1 MΩ / 50 Ω 可选。
identity:
  serial: SBDSO000001
  firmware: "1.0.0"
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  timebase.scale:
    type: float
    unit: S
    min: 1.0e-9
    max: 50.0
    default: 1.0e-3
    ladder: 1-2-5
    label: 时基
    label_en: Timebase
  trigger.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4}
    default: CHANnel1
    label: 触发源
    label_en: Trigger source
  trigger.level:
    type: float
    unit: V
    min: -1000.0
    max: 1000.0
    default: 0.0
    label: 触发电平
    label_en: Trigger level
  trigger.slope:
    type: enum
    options: [POSitive, NEGative, EITHer]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  trigger.mode:
    type: enum
    options: [AUTO, NORMal]
    default: AUTO
    label: 触发方式
    label_en: Trigger mode
  waveform.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, FUNCtion1, FUNCtion2]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4, FUNCtion1: F1, FUNCtion2: F2}
    default: CHANnel1
    label: 波形传输源
    label_en: Waveform source
  waveform.format:
    type: enum
    options: [WORD, BYTE, ASCii]
    default: WORD
    label: 波形格式
    label_en: Waveform format
  waveform.byteorder:
    type: enum
    options: [LSBFirst, MSBFirst]
    default: LSBFirst
    label: 字节序
    label_en: Byte order
  waveform.unsigned:
    type: bool
    default: false
    label: 无符号
    label_en: Unsigned
  waveform.points:
    type: int
    min: 100
    max: 10000
    default: 1000
    ladder: [100, 250, 500, 1000, 2000, 5000, 10000]
    label: 记录长度
    label_en: Record length
  # ---- 数学函数（#1074，Infiniium 第 22 章的方言）----
  function1.operator:
    type: enum
    options: [NONE, ADD, SUBTract, MULTiply, DIVide, COMMonmode, ABSolute, INVert, SQUare, SQRT,
              MAGNify, DELay, GATing, DIFF, INTegrate, SMOoth, AVERage, HIGHpass, LOWPass,
              MAXimum, MINimum, FFTMagnitude, FFTPhase, PSDensity]
    default: NONE
    label: 函数 1 运算
    label_en: Function 1 operator
  function1.source1:
    type: string
    default: ""
    label: 函数 1 信源 1
    label_en: Function 1 source 1
  function1.source2:
    type: string
    default: ""
    label: 函数 1 信源 2
    label_en: Function 1 source 2
  function1.display:
    type: bool
    default: false
    label: 函数 1 显示
    label_en: Function 1 display
  function1.range:
    type: float
    unit: V
    min: -100.0e15
    max: 100.0e15
    default: 8.0
    label: 函数 1 量程
    label_en: Function 1 range
  function1.offset:
    type: float
    unit: V
    default: 0.0
    label: 函数 1 偏置
    label_en: Function 1 offset
  function1.vertical:
    type: enum
    options: [AUTO, MANual]
    default: AUTO
    label: 函数 1 垂直方式
    label_en: Function 1 vertical
  function1.smooth:
    type: int
    min: 3
    max: 4001
    default: 5
    label: 函数 1 平滑点数
    label_en: Function 1 smoothing points
  function1.hp_bw:
    type: float
    unit: HZ
    min: 50.0
    max: 50.0e9
    default: 1.0e6
    label: 函数 1 高通带宽
    label_en: Function 1 high-pass bandwidth
  function1.lp_bw:
    type: float
    unit: HZ
    min: 50.0
    max: 50.0e9
    default: 1.0e6
    label: 函数 1 低通带宽
    label_en: Function 1 low-pass bandwidth
  function1.window:
    type: enum
    options: [RECTangular, HANNing, HAMMing, BHARris, FLATtop]
    default: HANNing
    label: 函数 1 FFT 窗
    label_en: Function 1 FFT window
  function1.vunits:
    type: enum
    options: [DB, DBMV, DBUV, WATT, VRMS, DBMHZ, WATTHZ, VRTHZ]
    default: DB
    label: 函数 1 FFT 纵轴单位
    label_en: Function 1 FFT vertical unit
  function1.span:
    type: float
    unit: HZ
    min: 1.0
    max: 1.0e12
    label: 函数 1 FFT 跨度
    label_en: Function 1 FFT span
  function1.center:
    type: float
    unit: HZ
    min: -1.0e12
    max: 1.0e12
    label: 函数 1 FFT 中心频率
    label_en: Function 1 FFT center
  function1.peak_level:
    type: float
    unit: DBM
    default: -60.0
    label: 函数 1 峰值门限
    label_en: Function 1 peak level
  function1.peak_count:
    type: int
    min: 1
    max: 100
    default: 5
    label: 函数 1 峰值数
    label_en: Function 1 peak count
  function.peak_sort:
    type: enum
    options: [DMAGnitude, IMAGnitude, IFRequency, DFRequency]
    default: DMAGnitude
    label: FFT 峰值排序
    label_en: FFT peak sort
  function2.operator:
    type: enum
    options: [NONE, ADD, SUBTract, MULTiply, DIVide, COMMonmode, ABSolute, INVert, SQUare, SQRT,
              MAGNify, DELay, GATing, DIFF, INTegrate, SMOoth, AVERage, HIGHpass, LOWPass,
              MAXimum, MINimum, FFTMagnitude, FFTPhase, PSDensity]
    default: NONE
    label: 函数 2 运算
    label_en: Function 2 operator
  function2.source1:
    type: string
    default: ""
    label: 函数 2 信源 1
    label_en: Function 2 source 1
  function2.source2:
    type: string
    default: ""
    label: 函数 2 信源 2
    label_en: Function 2 source 2
  function2.display:
    type: bool
    default: false
    label: 函数 2 显示
    label_en: Function 2 display
  function2.range:
    type: float
    unit: V
    min: -100.0e15
    max: 100.0e15
    default: 8.0
    label: 函数 2 量程
    label_en: Function 2 range
  function2.offset:
    type: float
    unit: V
    default: 0.0
    label: 函数 2 偏置
    label_en: Function 2 offset
  function2.vertical:
    type: enum
    options: [AUTO, MANual]
    default: AUTO
    label: 函数 2 垂直方式
    label_en: Function 2 vertical
  function2.smooth:
    type: int
    min: 3
    max: 4001
    default: 5
    label: 函数 2 平滑点数
    label_en: Function 2 smoothing points
  function2.hp_bw:
    type: float
    unit: HZ
    min: 50.0
    max: 50.0e9
    default: 1.0e6
    label: 函数 2 高通带宽
    label_en: Function 2 high-pass bandwidth
  function2.lp_bw:
    type: float
    unit: HZ
    min: 50.0
    max: 50.0e9
    default: 1.0e6
    label: 函数 2 低通带宽
    label_en: Function 2 low-pass bandwidth
  function2.window:
    type: enum
    options: [RECTangular, HANNing, HAMMing, BHARris, FLATtop]
    default: HANNing
    label: 函数 2 FFT 窗
    label_en: Function 2 FFT window
  function2.vunits:
    type: enum
    options: [DB, DBMV, DBUV, WATT, VRMS, DBMHZ, WATTHZ, VRTHZ]
    default: DB
    label: 函数 2 FFT 纵轴单位
    label_en: Function 2 FFT vertical unit
  function2.span:
    type: float
    unit: HZ
    min: 1.0
    max: 1.0e12
    label: 函数 2 FFT 跨度
    label_en: Function 2 FFT span
  function2.center:
    type: float
    unit: HZ
    min: -1.0e12
    max: 1.0e12
    label: 函数 2 FFT 中心频率
    label_en: Function 2 FFT center
  function2.peak_level:
    type: float
    unit: DBM
    default: -60.0
    label: 函数 2 峰值门限
    label_en: Function 2 peak level
  function2.peak_count:
    type: int
    min: 1
    max: 100
    default: 5
    label: 函数 2 峰值数
    label_en: Function 2 peak count
  # ---- 光标（:MARKer，#1074）----
  marker.mode:
    type: enum
    options: ["OFF", MANual, WAVeform, MEASurement, XONLy, YONLy]
    default: "OFF"
    label: 光标方式
    label_en: Marker mode
  marker.x1:
    type: float
    unit: S
    default: 0.0
    label: 光标 Ax
    label_en: Marker Ax
  marker.x2:
    type: float
    unit: S
    default: 0.0
    label: 光标 Bx
    label_en: Marker Bx
  marker.y1:
    type: float
    unit: V
    default: 0.0
    label: 光标 Ay
    label_en: Marker Ay
  marker.y2:
    type: float
    unit: V
    default: 0.0
    label: 光标 By
    label_en: Marker By
  marker.source1:
    type: string
    default: CHANnel1
    label: 光标 AB 信源
    label_en: Marker AB source
  marker.source2:
    type: string
    default: CHANnel1
    label: 光标 CD 信源
    label_en: Marker CD source
  marker.meas:
    type: int
    min: 1
    max: 20
    default: 1
    label: 跟踪的测量
    label_en: Tracked measurement
channel_state:
  scale:
    type: float
    unit: V
    min: 1.0e-3
    max: 100.0
    default: 1.0
    ladder: 1-2-5
    label: 垂直档位
    label_en: Scale
  offset:
    type: float
    unit: V
    min: -1000.0
    max: 1000.0
    default: 0.0
    label: 偏置
    label_en: Offset
  coupling:
    type: enum
    options: [DC, AC]
    default: DC
    label: 耦合
    label_en: Coupling
  impedance:
    type: enum
    options: [ONEMeg, FIFTy]
    option_labels: {ONEMeg: "1 MΩ", FIFTy: "50 Ω"}
    default: ONEMeg
    electrical: true
    label: 输入阻抗
    label_en: Input impedance
  probe:
    type: float
    display_unit: "×"
    min: 0.001
    max: 10000.0
    default: 1.0
    label: 探头衰减设定
    label_en: Probe ratio
  bwlimit:
    type: bool
    default: false
    label: 带宽限制
    label_en: Bandwidth limit
  display:
    type: bool
    default: false
    label: 显示
    label_en: Display
components:
  # 示波器由模块组成（instrument-authoring.md 8.4）：采集按名称引用时基、触发、ADC 组，以及每通道的
  # 垂直与探头模块。sb-* 不加噪声、不量化（D42）。
  - name: acq
    type: scope_acquisition
    params:
      horizontal: timebase
      trigger: trigger
      adc: adc
      vertical: front
      probe: probe
  - name: timebase
    type: scope_timebase
  - name: trigger
    type: scope_trigger
  - name: adc
    type: scope_adc
  # :MEASure:VPP? 等：在 :WAVeform:SOURce（或命令给出的信源）的记录上测量；光标读数走同一处。
  - name: meas
    type: scope_measurements
    params:
      source: $waveform.source
      math: math
      marker_mode: $marker.mode
      marker_x1: $marker.x1
      marker_x2: $marker.x2
      marker_y1: $marker.y1
      marker_y2: $marker.y2
      marker_source1: $marker.source1
      marker_source2: $marker.source2
      marker_measurement: $marker.meas
      markers: 12
  # 数学函数（#1074）：F1/F2 的定义在 function1/function2.* 设置里，读的时候才算。
  - name: math
    type: scope_math
    params:
      record: acq
      prefix: function
      functions: 2
      channels: 4
      peak_sort: $function.peak_sort
      resolution_scale: timebase.scale
  - name: xfer
    type: waveform_transfer
    params:
      # :WAVeform:DATA? 按 :WAVeform:FORMat：BYTE / WORD 为 ADC 码的定长块，ASCii 为伏特的 NR3 列表。
      source: $waveform.source
      math: math
      encoding: {from: $waveform.format, map: {BYTE: block, WORD: block, ASCii: ascii}}
      values: {from: $waveform.format, map: {ASCii: volts}, default: codes}
      codes_per_div: {from: $waveform.format, map: {BYTE: 32.0, WORD: 8192.0}, default: 32.0}
      adc_bits: {from: $waveform.format, map: {BYTE: 8, WORD: 16}, default: 8}
      width: {from: $waveform.format, map: {BYTE: 8, WORD: 16}, default: 8}
      unsigned: $waveform.unsigned
      byteorder: $waveform.byteorder
      # :WAVeform:PREamble? 是 Keysight 的十个字段（格式, 类型, 点数, 次数, X 增量, X 起点,
      # X 参考, Y 增量, Y 偏置, Y 参考），声明出来而非编码在采集里。
      header:
        encoding: text
        separator: ","
        fields:
          - {setting: waveform.format, map: {BYTE: 0, WORD: 1, ASCii: 4}}
          - {value: 0}
          - {figure: points}
          - {value: 1}
          - {figure: x_increment, format: "%+.6E"}
          - {figure: x_start, format: "%+.6E"}
          - {value: 0}
          - {figure: y_increment, format: "%+.6E"}
          - {figure: y_origin, format: "%+.6E"}
          - {figure: y_reference}
      no_record: "no acquisition for this source; send :DIGitize first"
channel_components:
  - name: inp
    type: input_port
    params:
      z_in: $ch.impedance
      c_in: 0.0
  - name: front
    type: scope_vertical
    params:
      coupling: $ch.coupling
      bw_limit: $ch.bwlimit
      bandwidth: 200.0e6
      probe_ratio: $ch.probe  # the per-V/div errors are at the input connector
  - name: probe
    type: scope_probe
wiring:
  channel:
    - [inp.out, front.in]
    - [front.out, probe.in]
  instrument:
    - ["ch{n}.probe.out", "acq.in{n}"]
ports:
  channel:
    "CH{n}": inp.pin
display:
  template: oscilloscope
  summary: [timebase.scale, trigger.source, trigger.level, trigger.slope]
  channel_summary: [display, scale, offset, coupling, impedance, probe]
capabilities: [oscilloscope]
commands:
  - header: ":CHANnel<ch>:SCALe"
    state: ch.scale
  - header: ":CHANnel<ch>:OFFSet"
    state: ch.offset
  - header: ":CHANnel<ch>:COUPling"
    state: ch.coupling
  - header: ":CHANnel<ch>:IMPedance"
    state: ch.impedance
  - header: ":CHANnel<ch>:PROBe"
    state: ch.probe
  - header: ":CHANnel<ch>:BWLimit"
    state: ch.bwlimit
  - header: ":CHANnel<ch>:DISPlay"
    state: ch.display
  - header: ":TIMebase[:MAIN]:SCALe"
    state: timebase.scale
  - header: ":TRIGger[:EDGE]:SOURce"
    state: trigger.source
  - header: ":TRIGger[:EDGE]:LEVel"
    state: trigger.level
  - header: ":TRIGger[:EDGE]:SLOPe"
    state: trigger.slope
  - header: ":TRIGger:SWEep"
    state: trigger.mode
  - header: ":DIGitize"
    op: acq.digitize
    query: false
    params:
      - {name: sources, type: raw}
  - header: ":SINGle"
    op: acq.digitize
    query: false
  - header: ":WAVeform:SOURce"
    state: waveform.source
  - header: ":WAVeform:FORMat"
    state: waveform.format
  - header: ":WAVeform:BYTeorder"
    state: waveform.byteorder
  - header: ":WAVeform:UNSigned"
    state: waveform.unsigned
  - header: ":WAVeform:POINts"
    state: waveform.points
  - header: ":WAVeform:PREamble"
    op: xfer.header
    set: false
  - header: ":WAVeform:DATA"
    op: xfer.data
    set: false
  - header: ":MEASure:VPP"
    op: meas.measure
    set: false
    args: {what: VPP}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:VMAX"
    op: meas.measure
    set: false
    args: {what: VMAX}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:VMIN"
    op: meas.measure
    set: false
    args: {what: VMIN}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:VAMPlitude"
    op: meas.measure
    set: false
    args: {what: VAMPlitude}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:VRMS"
    op: meas.measure
    set: false
    args: {what: VRMS}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:VAVerage"
    op: meas.measure
    set: false
    args: {what: VAVerage}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:FREQuency"
    op: meas.measure
    set: false
    args: {what: FREQuency}
    params: [{name: source, type: string, optional: true}]
  - header: ":MEASure:PERiod"
    op: meas.measure
    set: false
    args: {what: PERiod}
    params: [{name: source, type: string, optional: true}]
  # ---- FUNCtion（#1074，Infiniium 第 22 章的方言）----
  # :FUNCtion<f>:ADD <operand>,<operand>：算子写进 function{f}.operator，两个信源各归各位。
  - header: ":FUNCtion<f>:ADD"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": ADD}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: source2, type: string, optional: true, state: "function{f}.source2"}
  - header: ":FUNCtion<f>:SUBTract"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": SUBTract}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: source2, type: string, optional: true, state: "function{f}.source2"}
  - header: ":FUNCtion<f>:MULTiply"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": MULTiply}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: source2, type: string, optional: true, state: "function{f}.source2"}
  - header: ":FUNCtion<f>:DIVide"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": DIVide}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: source2, type: string, optional: true, state: "function{f}.source2"}
  - header: ":FUNCtion<f>:ABSolute"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": ABSolute}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:INVert"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": INVert}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:SQUare"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": SQUare}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:SQRT"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": SQRT}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:DIFF"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": DIFF}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:INTegrate"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": INTegrate}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:SMOoth"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": SMOoth}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: points, type: int, optional: true, state: "function{f}.smooth"}
  - header: ":FUNCtion<f>:HIGHpass"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": HIGHpass}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: bandwidth, type: float, unit: HZ, optional: true, state: "function{f}.hp_bw"}
  - header: ":FUNCtion<f>:LOWPass"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": LOWPass}
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: bandwidth, type: float, unit: HZ, optional: true, state: "function{f}.lp_bw"}
  - header: ":FUNCtion<f>:FFTMagnitude"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": FFTMagnitude}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:FFTPhase"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": FFTPhase}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>:PSDensity"
    suffixes: {f: [1, 2]}
    writes: {"function{f}.operator": PSDensity}
    params: [{name: source1, type: string, state: "function{f}.source1"}]
  - header: ":FUNCtion<f>"
    suffixes: {f: [1, 2]}
    set: false
    params:
      - {name: source1, type: string, state: "function{f}.source1"}
      - {name: source2, type: string, optional: true, state: "function{f}.source2"}
  - {header: ":FUNCtion<f>:DISPlay", suffixes: {f: [1, 2]}, state: "function{f}.display"}
  - {header: ":FUNCtion<f>:RANGe", suffixes: {f: [1, 2]}, state: "function{f}.range"}
  - {header: ":FUNCtion<f>:OFFSet", suffixes: {f: [1, 2]}, state: "function{f}.offset"}
