schema: simubench.instrument/1
id: sb-dmm-1
manufacturer: SimuBench
model: SB-DMM-1
class: multimeter
version: 1
description: 数字万用表（电压功能），输入阻抗 10 MΩ；DC 为平均值，AC 为真有效值。测量通道有隐藏的增益与零点误差，可经 :CALibration 命令校准（安全码保护）。
identity:
  serial: SBDMM000001
  firmware: "1.0.0"
state:
  cal.secured:
    type: bool
    default: true
    readonly: true
    label: 校准保护
    label_en: Calibration secured
  cal.value:
    type: float
    unit: V
    min: -1000.0
    max: 1000.0
    default: 10.0
    label: 校准值
    label_en: Calibration value
  cal.gain:
    type: float
    default: 1.0
    readonly: true
    label: 增益系数
    label_en: Gain coefficient
  cal.offset:
    type: float
    unit: V
    default: 0.0
    readonly: true
    label: 零点系数
    label_en: Offset coefficient
  cal.count:
    type: int
    min: 0
    default: 0
    readonly: true
    label: 校准次数
    label_en: Calibration count
  cal.date:
    type: string
    default: ""
    readonly: true
    label: 校准日期
    label_en: Calibration date
  cal.string:
    type: string
    default: ""
    label: 校准信息
    label_en: Calibration message
components:
  - name: input
    type: input_port
    params: {z_in: 10.0e6}
  - name: meter
    type: dmm_core
    params:
      cal_gain: $cal.gain
      cal_offset: $cal.offset
      cal_value: $cal.value
      cal_secured: $cal.secured
wiring:
  instrument:
    - [input.out, meter.in]
ports:
  instrument:
    IN: input.pin
display:
  template: multimeter
capabilities: [multimeter]
commands:
  - header: ":MEASure:VOLTage[:DC]"
    op: meter.measure
    set: false
    args: {what: DC}
    params: [{name: range, type: raw}]
  - header: ":MEASure:VOLTage:AC"
    op: meter.measure
    set: false
    args: {what: AC}
    params: [{name: range, type: raw}]
  - header: ":CALibration:SECure:STATe"
    op: meter.cal_secure
    params: [{name: values, type: raw}]
  - header: ":CALibration:VALue"
    state: cal.value
  - header: ":CALibration:ZERO"
    op: meter.cal_zero
    set: false
  - header: ":CALibration[:GAIN]"
    op: meter.cal_gain
    set: false
  - header: ":CALibration:STORe"
    op: meter.cal_store
    query: false
  - header: ":CALibration:COUNt"
    state: cal.count
  - header: ":CALibration:DATE"
    state: cal.date
  - header: ":CALibration:STRing"
    state: cal.string
# Individual deviations (个体偏差): a bench instance with deviation: from_specs draws them from its seed.
deviations:
  - param: meter.gain_error_ppm
    limit: 20.0
    distribution: uniform
  - param: meter.offset
    limit: 5.0e-6
    distribution: normal
    coverage: 2
