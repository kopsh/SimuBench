schema: simubench.bench/1
name: smu
description: SMU 的 HI 端接 1 kΩ 对地电阻，同一网络上挂一台万用表；终端看到 999.9 Ω。初始强制 5 V、电流限值 10 mA、输出开启。
instruments:
  smu:
    model: sb-smu-1
    label: 源测量单元
    address: TCPIP0::192.168.1.60::5025::SOCKET
    state:
      source.voltage.level: 5.0
      compliance.current.limit: 0.01
      output.enabled: true
      sweep.mode: LINear
      sweep.start: 0.0
      sweep.stop: 8.0
      sweep.points: 9
  dmm: {model: sb-dmm-1, label: 万用表}
duts:
  r1: {type: load_resistor, params: {r: 1000.0}}
wires:
  - {from: smu.HI, to: r1.A}
  - {from: smu.HI, to: dmm.IN}
run: {seed: 5, clock: command}
