schema: simubench.bench/2
name: optical_sweep
description: >-
  插损随波长（#1103）：可调激光源扫 1500–1600 nm（10 nm/s），经可变光衰减器（10 dB）到光功率计，功率计按 100 Hz
  记录，每一点对应扫描中那一时刻的波长。
instruments:
  tls:
    model: sb-tls-1
    label: 可调激光源
    address: "TCPIP0::192.168.1.40::5025::SOCKET"
    state: {output: true}
  voa:
    model: sb-voa-1
    label: 可变光衰减器
    address: "TCPIP0::192.168.1.41::5025::SOCKET"
    state: {att: 10.0}
  opm:
    model: sb-opm-1
    label: 光功率计
    address: "TCPIP0::192.168.1.42::5025::SOCKET"
wires:
  - {from: tls.OUT, to: voa.IN}
  - {from: voa.OUT, to: opm.IN}
run:
  seed: 13
  clock: command
  idle: "off"
