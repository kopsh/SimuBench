    manual: ":ACQuire Commands > :ACQuire:SEGMented:COUNt; :ACQuire:SEGMented:INDex; :WAVeform Commands > :WAVeform:SEGMented:COUNt?; :WAVeform:SEGMented:TTAG?; :WAVeform:SEGMented:XLISt?; :WAVeform:SEGMented:POINts?; :WAVeform:SEGMented:ALL"
