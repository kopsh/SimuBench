# R&S SMA100B 的手册用例：User Manual 1178.3834.02 v14 第 15 章各命令条目（参数范围、*RST 值与示例）。
# 每个用例在刚上电的 examples/benches/rs-sma100b.bench.yaml 上运行（RF_OUT 接 DSO-X 2024A）。数值应答
# 是 R&S 的最短十进制写法（FREQ? → 1000000000），枚举回短格式。
model: rs-sma100b
bench: ../../../examples/benches/rs-sma100b.bench.yaml
instrument: sg
cases:
  - name: "*IDN? 与 *RST 后的各项默认值"
    manual: "15.4 Common commands > *IDN? / *RST；各命令条目的 *RST"
    steps:
      - query: "*IDN?"
        expect: "Rohde&Schwarz,SMA100B,1419.8888K02/101234,5.40.102.48"
      - send: "FREQ 2 GHz;:POW -10;:OUTP ON;:AM 50;:FM 5 kHz;:LFO:FREQ 3 kHz;:MOD ON"
      - send: "*RST"
      - query: "FREQ?"
        expect: "1000000000"
      - query: "POW?"
        expect: "-30"
      - query: "OUTP?"
        expect: "0"
      - query: "AM?"
        expect: "30"
      - query: "AM:STAT?"
        expect: "0"
      - query: "AM:SOUR?"
        expect: "LF1"
      - query: "FM?"
        expect: "1000"
      - query: "FM:STAT?"
        expect: "0"
      - query: "FM:SOUR?"
        expect: "LF1"
      - query: "PM?"
        expect: "1"
      - query: "PM:STAT?"
        expect: "0"
      - query: "PM:SOUR?"
        expect: "LF1"
      - query: "LFO:FREQ?"
        expect: "1000"
      - query: "MOD?"
        expect: "0"
      - query: "FREQ:MODE?"
        expect: "CW"
      - query: "POW:MODE?"
        expect: "CW"
      - query: "UNIT:POW?"
        expect: "DBM"

  - name: "频率、电平与 RF 输出；CW 与 FIXed 同义；只有一条 RF 通路"
    manual: "SOURce:FREQuency > [:SOURce<hw>]:FREQuency[:CW|FIXed]; SOURce:POWer > [:SOURce<hw>]:POWer[:LEVel][:IMMediate][:AMPLitude]; OUTPut > :OUTPut<hw>[:STATe]"
    steps:
      - send: "SOURce1:FREQuency:CW 2.5 GHz"
      - query: "SOUR1:FREQ?"
        expect: "2500000000"
      - send: "FREQ:FIX 100 MHz"
      - query: "FREQ:CW?"
        expect: "100000000"
      - send: "SOURce1:POWer:LEVel:IMMediate:AMPLitude -12.5"
      - query: "POW?"
        expect: "-12.5"
      - send: ":OUTPut1 ON"
      - query: ":OUTP1:STAT?"
        expect: "1"
      - send: "SOUR2:FREQ 1 GHz"
      - query: "SYST:ERR?"
        expect: '-114,"Header suffix out of range"'
      - send: "POW 30"
      - query: "SYST:ERR?"
        expect: '-222,"Data out of range"'

  - name: "AM：深度、调制源 LF1、开关；调制总开关；LF1 频率"
    manual: "SOURce:AM > [:SOURce<hw>]:AM<ch>[:DEPTh] / :SOURce / :STATe; SOURce:MODulation > [:SOURce<hw>]:MODulation[:ALL][:STATe]; SOURce:LFOutput > [:SOURce]:LFOutput<ch>:FREQuency（示例 Creating an amplitude modulated RF signal）"
    steps:
      - send: "SOURce1:AM1:DEPTh 30"
      - send: "SOURce1:AM1:SOURce LF1"
      - send: "SOURce1:AM1:STATe 1"
      - query: "SOUR1:AM1:STAT?"
        expect: "1"
      - send: "SOURce1:LFOutput1:FREQuency 5 kHz"
      - query: "LFO1:FREQ?"
        expect: "5000"
      - send: "SOURce1:MODulation:ALL:STATe 1"
      - query: "MOD:STAT?"
        expect: "1"
      - send: "AM:SOUR EXT1"
      - query: "SYST:ERR?"
        expect: '-224,"Illegal parameter value"'
      - send: "SOUR1:AM2:STAT 1"
      - query: "SYST:ERR?"
        expect: '-114,"Header suffix out of range"'

  - name: "FM 与 PM：频偏、相偏、调制源；FM 与 PM 互斥"
    manual: "SOURce:FM > [:SOURce<hw>]:FM<ch>[:DEViation] / :SOURce / :STATe; SOURce:PM > [:SOURce]:PM<ch>[:DEViation] / [:SOURce<hw>]:PM<ch>:SOURce / :STATe"
    steps:
      - send: "SOURce1:FM1:DEViation 1000"
      - send: "SOUR:FM:SOUR LF1"
      - send: "SOURce1:FM1:STATe 1"
      - query: "FM:STAT?"
        expect: "1"
      - send: "PM:DEV 0.5"
      - query: "PM?"
        expect: "0.5"
      - send: "PM:SOUR LF1"
      - send: "PM:STAT 1"
      - query: "SYST:ERR?"
        expect: '-221,"Settings conflict"'
      - query: "FM:STAT?"
        expect: "0"
      - query: "PM:STAT?"
        expect: "1"

  - name: "频率扫描与电平扫描的设置、执行与触发"
    manual: "SOURce:SWEep > [:SOURce<hw>]:SWEep[:FREQuency]:MODE / :POINts / :SPACing / :DWELl / :EXECute, :SWEep:POWer:*, :SWEep:RESet[:ALL]; SOURce:FREQuency > :STARt / :STOP / :MODE; SOURce:POWer > :STARt / :STOP / :MODE; TRIGger > :TRIGger<hw>:FSWeep|PSWeep:SOURce / [:IMMediate], :TRIGger<hw>[:SWEep][:IMMediate]（示例 Setting up an RF frequency or power sweep）"
    steps:
      - query: "FREQ:STAR?"
        expect: "100000000"
      - query: "FREQ:STOP?"
        expect: "500000000"
      - query: "SWE:DWEL?"
        expect: "0.01"
      - query: "SWE:MODE?"
        expect: "AUTO"
      - query: "SWE:SPAC?"
        expect: "LIN"
      - query: "TRIG:FSW:SOUR?"
        expect: "AUTO"
      - query: "POW:STAR?"
        expect: "-30"
      - query: "POW:STOP?"
        expect: "-10"
      - send: "SOUR1:FREQ:STAR 100 MHz;:SOUR1:FREQ:STOP 200 MHz;:SOUR1:SWE:FREQ:POIN 11"
      - send: "SOUR1:SWE:FREQ:SPAC LOG;:SOUR1:SWE:FREQ:DWEL 0.05;:SOUR1:SWE:FREQ:MODE STEP"
      - send: "TRIG1:FSW:SOUR SING;:SOUR1:FREQ:MODE SWE"
      - query: "SWE:POIN?"
        expect: "11"
      - send: "SOUR1:SWE:FREQ:EXEC"
      - send: "TRIG1:FSW"
      - send: "*TRG"
      - send: "SOUR1:SWE:RES"
      - send: "SOUR1:POW:STAR -20;:SOUR1:POW:STOP 0;:SOUR1:SWE:POW:POIN 5;:SOUR1:SWE:POW:DWEL 0.02;:SOUR1:SWE:POW:MODE AUTO"
      - send: "TRIG1:PSW:SOUR SING;:SOUR1:POW:MODE SWE"
      - query: "SWE:POW:POIN?"
        expect: "5"
      - send: "SOUR1:SWE:POW:EXEC"
      - send: "TRIG1:PSW"
      - send: "TRIG1"
      - query: "SYST:ERR?"
        expect: '0,"No error"'
      - send: "FREQ:MODE LIST"
      - query: "SYST:ERR?"
        expect: '-224,"Illegal parameter value"'

  - name: "参考源、电平单位、预置与状态命令"
    manual: "SOURce:ROSCillator > [:SOURce]:ROSCillator:SOURce; UNIT > :UNIT:POWer; SYSTem > :SYSTem:PRESet / :SYSTem:ERRor[:NEXT]?; 15.4 Common commands"
    steps:
      - send: "ROSC:SOUR EXT"
      - query: "ROSC:SOUR?"
        expect: "EXT"
      - send: "UNIT:POW V"
      - query: "SYST:ERR?"
        expect: '-224,"Illegal parameter value"'
      - send: "UNIT:POW DBM"
      - query: "UNIT:POW?"
        expect: "DBM"
      - send: "*CLS"
      - send: "FREQ 3 GHz;:SYST:PRES"
      - query: "FREQ?"
        expect: "1000000000"
      - send: "*ESE 1;*SRE 32"
      - query: "*ESE?"
        expect: "1"
      - query: "*SRE?"
        expect: "32"
      - send: "*OPC;*WAI"
      - query: "*ESR?"
        expect: "1"
      - query: "*STB?"
        expect: "0"
      - send: "*CLS"
      - query: "*OPC?"
        expect: "1"
