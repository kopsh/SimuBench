# Manual cases for the Keysight DSO-X 2024A: InfiniiVision 2000 X-Series Programmer's Guide
# 02.66.0000. Settings answer as the guide's *RST sample replies write them (engineering exponent,
# signed, the sample's digits); booleans as 1/0; enumerations in the short form.
model: keysight-dsox2024a
bench: bench.yaml
instrument: scope
cases:
  - name: "*IDN? 按手册的格式"
    manual: "Common (*) Commands > *IDN"
    steps:
      - query: "*IDN?"
        expect: "AGILENT TECHNOLOGIES,DSO-X 2024A,MY58260001,02.66.0000"
  - name: "*RST 后的通道设置与手册的 :CHANnel<n>? 样例一致"
    manual: "Common (*) Commands > *RST; :CHANnel<n> Commands"
    steps:
      - send: ":CHANnel1:SCALe 0.2;:CHANnel1:COUPling AC;*RST"
      - query: ":CHANnel1:RANGe?"
        expect: "+40.0E+00"
      - query: ":CHANnel1:OFFSet?"
        expect: "+0.00000E+00"
      - query: ":CHANnel1:COUPling?"
        expect: "DC"
      - query: ":CHANnel1:IMPedance?"
        expect: "ONEM"
      - query: ":CHANnel1:DISPlay?"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "0"
      - query: ":CHANnel1:BWLimit?"
        expect: "0"
      - query: ":CHANnel1:PROBe?"
        expect: "+10E+00"
  - name: "*RST 后的时基与触发与手册样例一致"
    manual: "Common (*) Commands > *RST; :TIMebase Commands; :TRIGger Commands"
    steps:
      - send: "*RST"
      - query: ":TIMebase:MODE?"
        expect: "MAIN"
      - query: ":TIMebase:REFerence?"
        expect: "CENT"
      - query: ":TIMebase:RANGe?"
        expect: "+1.00E-03"
      - query: ":TIMebase:POSition?"
        expect: "+0.0E+00"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
      - query: ":TRIGger:SWEep?"
        expect: "AUTO"
      - query: ":TRIGger:NREJect?"
        expect: "0"
      - query: ":TRIGger:HFReject?"
        expect: "0"
      - query: ":TRIGger:EDGE:SOURce?"
        expect: "CHAN1"
      - query: ":TRIGger:EDGE:LEVel?"
        expect: "+0.00000E+00"
      - query: ":TRIGger:EDGE:SLOPe?"
        expect: "POS"
      - query: ":TRIGger:EDGE:REJect?"
        expect: "OFF"
      - query: ":TRIGger:EDGE:COUPling?"
        expect: "DC"
  - name: "*RST 后的采集与波形设置与手册样例一致"
    manual: "Common (*) Commands > *RST; :ACQuire Commands; :WAVeform Commands"
    steps:
      - send: "*RST"
      - query: ":ACQuire:MODE?"
        expect: "RTIM"
      - query: ":ACQuire:TYPE?"
        expect: "NORM"
      - query: ":ACQuire:COMPlete?"
        expect: "100"
      - query: ":ACQuire:COUNt?"
        expect: "8"
      - query: ":WAVeform:UNSigned?"
        expect: "1"
      - query: ":WAVeform:BYTeorder?"
        expect: "MSBF"
      - query: ":WAVeform:FORMat?"
        expect: "BYTE"
      - query: ":WAVeform:POINts?"
        expect: "+1000"
      - query: ":WAVeform:SOURce?"
        expect: "CHAN1"
      - query: ":MEASure:SOURce?"
        expect: "CHAN1,CHAN2"
  - name: "垂直：档位与量程是同一设置（量程 = 8 格）；改探头比时档位随之缩放"
    manual: ":CHANnel<n> Commands > :CHANnel<n>:SCALe, :CHANnel<n>:RANGe, :CHANnel<n>:PROBe"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1"
      - query: ":CHANnel1:SCALe?"
        expect: "+500E-03"
      - send: ":CHANnel1:RANGe 8"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00E+00"
      - send: ":CHANnel1:SCALe 200mV"
      - query: ":CHANnel1:RANGe?"
        expect: "+1.60E+00"
      - send: ":CHANnel1:PROBe X10"
      - query: ":CHANnel1:SCALe?"
        expect: "+2.00E+00"
      - query: ":CHANnel1:PROBe?"
        expect: "+10E+00"
  - name: "偏置超出范围时取最近的合法值"
    manual: ":CHANnel<n> Commands > :CHANnel<n>:OFFSet"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.1"
      - send: ":CHANnel1:OFFSet 10"
      - query: ":CHANnel1:OFFSet?"
        expect: "+2.00000E+00"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: "耦合、带宽限制、显示与输入阻抗"
    manual: ":CHANnel<n> Commands > :COUPling, :BWLimit, :DISPlay, :IMPedance"
    steps:
      - send: ":CHANnel2:COUPling AC;:CHANnel2:BWLimit ON;:CHANnel2:DISPlay 1;:CHANnel2:IMPedance ONEMeg"
      - query: ":CHANnel2:COUPling?"
        expect: "AC"
      - query: ":CHANnel2:BWLimit?"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "1"
      - query: ":CHANnel2:IMPedance?"
        expect: "ONEM"
  - name: "时基：档位、量程（10 格）、位置、参考与模式"
    manual: ":TIMebase Commands > :SCALe, :RANGe, :POSition, :REFerence, :MODE"
    steps:
      - send: ":TIMebase:SCALe 2E-4"
      - query: ":TIMebase:RANGe?"
        expect: "+2.00E-03"
      - send: ":TIMebase:RANGe 5E-3"
      - query: ":TIMebase:SCALe?"
        expect: "+500E-06"
      - send: ":TIMebase:POSition 1E-3;:TIMebase:REFerence LEFT;:TIMebase:MODE MAIN"
      - query: ":TIMebase:POSition?"
        expect: "+1.0E-03"
      - query: ":TIMebase:REFerence?"
        expect: "LEFT"
      - query: ":TIMebase:MODE?"
        expect: "MAIN"
  - name: "触发：方式、抑制、释抑、电平、沿、信源、耦合"
    manual: ":TRIGger Commands > :SWEep, :NREJect, :HFReject, :HOLDoff, :MODE; :TRIGger[:EDGE] Commands"
    steps:
      - send: ":TRIGger:SWEep NORMal;:TRIGger:NREJect ON;:TRIGger:HFReject 1;:TRIGger:HOLDoff 1E-6;:TRIGger:MODE EDGE"
      - query: ":TRIGger:SWEep?"
        expect: "NORM"
      - query: ":TRIGger:NREJect?"
        expect: "1"
      - query: ":TRIGger:HFReject?"
        expect: "1"
      - query: ":TRIGger:HOLDoff?"
        expect: "+1.00000000000000E-06"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
      - send: ":TRIGger:LEVel 0.25;:TRIGger:SLOPe NEGative;:TRIGger:SOURce CHANnel2;:TRIGger:COUPling LFReject;:TRIGger:REJect HFReject"
      - query: ":TRIGger:LEVel?"
        expect: "+250.000E-03"
      - query: ":TRIGger:SLOPe?"
        expect: "NEG"
      - query: ":TRIGger:SOURce?"
        expect: "CHAN2"
      - query: ":TRIGger:COUPling?"
        expect: "LFR"
      - query: ":TRIGger:REJect?"
        expect: "HFR"
  - name: "采集：类型、平均次数、模式、完成条件、点数与采样率"
    manual: ":ACQuire Commands"
    steps:
      - send: "*RST;:ACQuire:TYPE AVERage;:ACQuire:COUNt 64;:ACQuire:MODE RTIMe;:ACQuire:COMPlete 100"
      - query: ":ACQuire:TYPE?"
        expect: "AVER"
      - query: ":ACQuire:COUNt?"
        expect: "64"
      - query: ":ACQuire:POINts?"
        expect: "100000"
      # 100 us/div：100 kpts / 1 ms = 100 MSa/s（1-2-5 档，不超过 2 GSa/s）。
      - query: ":ACQuire:SRATe?"
        expect: "+100E+06"
  - name: "运行控制：停止、单次、运行"
    manual: "Root (:) Commands > :RUN, :STOP, :SINGle"
    steps:
      - send: ":STOP;:SINGle;:RUN"
      - query: "*OPC?"
        expect: "1"
  - name: ":DIGitize 后读前导与数据（BYTE，1000 点）"
    manual: "Root (:) Commands > :DIGitize; :WAVeform Commands > :PREamble, :DATA, :POINts"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1"
      - query: ":WAVeform:PREamble?"
        expect_match: '0,0,1000,1,\+1\.00000000000E-05,-4\.99\d{9}E-03,0,\+1\.56250E-02,\+0\.00000E\+00,128'
      - query: ":WAVeform:DATA?"
        binary: true
        expect_match: '#800001000.{1000}\n'
  - name: "波形格式、字节序、有无符号、点数方式与单项查询"
    manual: ":WAVeform Commands > :FORMat, :BYTeorder, :UNSigned, :POINts:MODE, :SOURce, :TYPE, :XINCrement, :XORigin, :XREFerence, :YINCrement, :YORigin, :YREFerence"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1"
      - send: ":WAVeform:SOURce CHANnel1;:WAVeform:FORMat WORD;:WAVeform:BYTeorder LSBFirst;:WAVeform:UNSigned 0;:WAVeform:POINts:MODE MAXimum;:WAVeform:POINts 100000"
      - query: ":WAVeform:FORMat?"
        expect: "WORD"
      - query: ":WAVeform:BYTeorder?"
        expect: "LSBF"
      - query: ":WAVeform:UNSigned?"
        expect: "0"
      - query: ":WAVeform:POINts:MODE?"
        expect: "MAXimum"
      - query: ":WAVeform:SOURce?"
        expect: "CHAN1"
      - query: ":WAVeform:TYPE?"
        expect: "NORM"
      - query: ":WAVeform:XINCrement?"
        expect: "+1.00000000000E-07"
      - query: ":WAVeform:XORigin?"
        expect_match: '-4\.99\d{9}E-03'
      - query: ":WAVeform:XREFerence?"
        expect: "0"
      - query: ":WAVeform:YINCrement?"
        expect: "+6.10352E-05"
      - query: ":WAVeform:YORigin?"
        expect: "+0.00000E+00"
      - query: ":WAVeform:YREFerence?"
        expect: "0"
  - name: "自动测量：1 kHz、2 Vpp 正弦"
    manual: ":MEASure Commands > :SOURce, :VPP, :VMAX, :VMIN, :VAMPlitude, :VAVerage, :VRMS, :FREQuency, :PERiod"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1;:MEASure:SOURce CHANnel1"
      - query: ":MEASure:VPP?"
        expect_value: 2.0
        tolerance: 0.04
      - query: ":MEASure:VMAX?"
        expect_value: 1.0
        tolerance: 0.02
      - query: ":MEASure:VMIN?"
        expect_value: -1.0
        tolerance: 0.02
      - query: ":MEASure:VAMPlitude?"
        expect_value: 2.0
        tolerance: 0.04
      - query: ":MEASure:VAVerage? DISPlay,CHANnel1"
        expect_value: 0.0
        tolerance: 0.01
      - query: ":MEASure:VRMS? DISPlay,DC,CHANnel1"
        expect_value: 0.7071
        tolerance: 0.01
      - query: ":MEASure:FREQuency? CHANnel1"
        expect_value: 1000.0
        tolerance: 1.0
      - query: ":MEASure:PERiod?"
        expect_value: 0.001
        tolerance: 1.0e-6
  - name: "测量名带信源时改变默认信源"
    manual: ":MEASure Commands > :MEASure:SOURce"
    steps:
      - send: "*RST"
      - query: ":MEASure:VPP? CHANnel2"
        expect_value: 0.0
        tolerance: 0.01
      - query: ":MEASure:SOURce?"
        expect: "CHAN2,CHAN2"
  - name: "错误队列：未建模的命令报 -113"
    manual: ":SYSTem Commands > :SYSTem:ERRor; Error Messages"
    steps:
      - send: "*CLS;:AUToscale"
      - query: ":SYSTem:ERRor?"
        expect_match: '-113,"Undefined header.*"'
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: "状态寄存器：*ESE、*ESR、*SRE、*STB、*OPC、*WAI、*TST"
    manual: "Common (*) Commands > *ESE, *ESR, *SRE, *STB, *OPC, *WAI, *TST, *CLS"
    steps:
      - send: "*CLS;*ESE 1;*SRE 32;*OPC;*WAI"
      - query: "*ESE?"
        expect: "1"
      - query: "*SRE?"
        expect: "32"
      - query: "*ESR?"
        expect: "1"
      - query: "*STB?"
        expect_match: '\d+'
      - query: "*TST?"
        expect: "0"
