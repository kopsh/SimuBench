# Manual cases for the Keysight DSO-X 2024A: InfiniiVision 2000 X-Series Programmer's Guide
# 02.66.0000. Settings answer as the guide's *RST sample replies write them (engineering exponent,
# signed, the sample's digits); booleans as 1/0; enumerations in the short form.
model: keysight-dsox2024a
bench: bench.yaml
instrument: scope
cases:
  - name: "*IDN? 按手册的格式"
    manual: "Common (*) Commands > *IDN"
    steps:
      - query: "*IDN?"
        expect: "AGILENT TECHNOLOGIES,DSO-X 2024A,MY58260001,02.66.0000"
  - name: "*RST 后的通道设置与手册的 :CHANnel<n>? 样例一致"
    manual: "Common (*) Commands > *RST; :CHANnel<n> Commands"
    steps:
      - send: ":CHANnel1:SCALe 0.2;:CHANnel1:COUPling AC;*RST"
      - query: ":CHANnel1:RANGe?"
        expect: "+40.0E+00"
      - query: ":CHANnel1:OFFSet?"
        expect: "+0.00000E+00"
      - query: ":CHANnel1:COUPling?"
        expect: "DC"
      - query: ":CHANnel1:IMPedance?"
        expect: "ONEM"
      - query: ":CHANnel1:DISPlay?"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "0"
      - query: ":CHANnel1:BWLimit?"
        expect: "0"
      - query: ":CHANnel1:PROBe?"
        expect: "+10E+00"
  - name: "*RST 后的时基与触发与手册样例一致"
    manual: "Common (*) Commands > *RST; :TIMebase Commands; :TRIGger Commands"
    steps:
      - send: "*RST"
      - query: ":TIMebase:MODE?"
        expect: "MAIN"
      - query: ":TIMebase:REFerence?"
        expect: "CENT"
      - query: ":TIMebase:RANGe?"
        expect: "+1.00E-03"
      - query: ":TIMebase:POSition?"
        expect: "+0.0E+00"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
      - query: ":TRIGger:SWEep?"
        expect: "AUTO"
      - query: ":TRIGger:NREJect?"
        expect: "0"
      - query: ":TRIGger:HFReject?"
        expect: "0"
      - query: ":TRIGger:EDGE:SOURce?"
        expect: "CHAN1"
      - query: ":TRIGger:EDGE:LEVel?"
        expect: "+0.00000E+00"
      - query: ":TRIGger:EDGE:SLOPe?"
        expect: "POS"
      - query: ":TRIGger:EDGE:REJect?"
        expect: "OFF"
      - query: ":TRIGger:EDGE:COUPling?"
        expect: "DC"
  - name: "*RST 后的采集与波形设置与手册样例一致"
    manual: "Common (*) Commands > *RST; :ACQuire Commands; :WAVeform Commands"
    steps:
      - send: "*RST"
      - query: ":ACQuire:MODE?"
        expect: "RTIM"
      - query: ":ACQuire:TYPE?"
        expect: "NORM"
      - query: ":ACQuire:COMPlete?"
        expect: "100"
      - query: ":ACQuire:COUNt?"
        expect: "8"
      - query: ":WAVeform:UNSigned?"
        expect: "1"
      - query: ":WAVeform:BYTeorder?"
        expect: "MSBF"
      - query: ":WAVeform:FORMat?"
        expect: "BYTE"
      - query: ":WAVeform:POINts?"
        expect: "+1000"
      - query: ":WAVeform:SOURce?"
        expect: "CHAN1"
      - query: ":MEASure:SOURce?"
        expect: "CHAN1,CHAN2"
  - name: "垂直：档位与量程是同一设置（量程 = 8 格）；改探头比时档位随之缩放"
    manual: ":CHANnel<n> Commands > :CHANnel<n>:SCALe, :CHANnel<n>:RANGe, :CHANnel<n>:PROBe"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1"
      - query: ":CHANnel1:SCALe?"
        expect: "+500E-03"
      - send: ":CHANnel1:RANGe 8"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00E+00"
      - send: ":CHANnel1:SCALe 200mV"
      - query: ":CHANnel1:RANGe?"
        expect: "+1.60E+00"
      - send: ":CHANnel1:PROBe X10"
      - query: ":CHANnel1:SCALe?"
        expect: "+2.00E+00"
      - query: ":CHANnel1:PROBe?"
        expect: "+10E+00"
  - name: "偏置超出范围时取最近的合法值"
    manual: ":CHANnel<n> Commands > :CHANnel<n>:OFFSet"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.1"
      - send: ":CHANnel1:OFFSet 10"
      - query: ":CHANnel1:OFFSet?"
        expect: "+2.00000E+00"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: "耦合、带宽限制、显示与输入阻抗"
    manual: ":CHANnel<n> Commands > :COUPling, :BWLimit, :DISPlay, :IMPedance"
    steps:
      - send: ":CHANnel2:COUPling AC;:CHANnel2:BWLimit ON;:CHANnel2:DISPlay 1;:CHANnel2:IMPedance ONEMeg"
      - query: ":CHANnel2:COUPling?"
        expect: "AC"
      - query: ":CHANnel2:BWLimit?"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "1"
      - query: ":CHANnel2:IMPedance?"
        expect: "ONEM"
  - name: "时基：档位、量程（10 格）、位置、参考与模式"
    manual: ":TIMebase Commands > :SCALe, :RANGe, :POSition, :REFerence, :MODE"
    steps:
      - send: ":TIMebase:SCALe 2E-4"
      - query: ":TIMebase:RANGe?"
        expect: "+2.00E-03"
      - send: ":TIMebase:RANGe 5E-3"
      - query: ":TIMebase:SCALe?"
        expect: "+500E-06"
      - send: ":TIMebase:POSition 1E-3;:TIMebase:REFerence LEFT;:TIMebase:MODE MAIN"
      - query: ":TIMebase:POSition?"
        expect: "+1.0E-03"
      - query: ":TIMebase:REFerence?"
        expect: "LEFT"
      - query: ":TIMebase:MODE?"
        expect: "MAIN"
  - name: "触发：方式、抑制、释抑、电平、沿、信源、耦合"
    manual: ":TRIGger Commands > :SWEep, :NREJect, :HFReject, :HOLDoff, :MODE; :TRIGger[:EDGE] Commands"
    steps:
      - send: ":TRIGger:SWEep NORMal;:TRIGger:NREJect ON;:TRIGger:HFReject 1;:TRIGger:HOLDoff 1E-6;:TRIGger:MODE EDGE"
      - query: ":TRIGger:SWEep?"
        expect: "NORM"
      - query: ":TRIGger:NREJect?"
        expect: "1"
      - query: ":TRIGger:HFReject?"
        expect: "1"
      - query: ":TRIGger:HOLDoff?"
        expect: "+1.00000000000000E-06"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
      - send: ":TRIGger:LEVel 0.25;:TRIGger:SLOPe NEGative;:TRIGger:SOURce CHANnel2;:TRIGger:COUPling LFReject;:TRIGger:REJect HFReject"
      - query: ":TRIGger:LEVel? CHANnel1"
        expect: "+250.000E-03"
      - query: ":TRIGger:SLOPe?"
        expect: "NEG"
      - query: ":TRIGger:SOURce?"
        expect: "CHAN2"
      - query: ":TRIGger:COUPling?"
        expect: "LFR"
      - query: ":TRIGger:REJect?"
        expect: "HFR"
  - name: "采集：类型、平均次数、模式、完成条件、点数与采样率"
    manual: ":ACQuire Commands"
    steps:
      - send: "*RST;:ACQuire:TYPE AVERage;:ACQuire:COUNt 64;:ACQuire:MODE RTIMe;:ACQuire:COMPlete 100"
      - query: ":ACQuire:TYPE?"
        expect: "AVER"
      - query: ":ACQuire:COUNt?"
        expect: "64"
      - query: ":ACQuire:POINts?"
        expect: "100000"
      # 100 us/div：100 kpts / 1 ms = 100 MSa/s（1-2-5 档，不超过 2 GSa/s）。
      - query: ":ACQuire:SRATe?"
        expect: "+100E+06"
  - name: "运行控制：停止、单次、运行"
    manual: "Root (:) Commands > :RUN, :STOP, :SINGle"
    steps:
      - send: ":STOP;:SINGle;:RUN"
      - query: "*OPC?"
        expect: "1"
  - name: ":DIGitize 后读前导与数据（BYTE，1000 点）"
    manual: "Root (:) Commands > :DIGitize; :WAVeform Commands > :PREamble, :DATA, :POINts"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1"
      - query: ":WAVeform:PREamble?"
        expect_fields:
          - "0"
          - "0"
          - "1000"
          - "1"
          - "+1.00000000000E-05"
          - {value: -0.004995, tolerance: 5.0e-06, format: "-d.dddddddddddE-dd"}
          - "0"
          - "+1.56250E-02"
          - "+0.00000E+00"
          - "128"
      - query: ":WAVeform:DATA?"
        binary: true
        expect_block: {header: "#800001000", bytes: 1000, end: "\n"}
  - name: "波形格式、字节序、有无符号、点数方式与单项查询"
    manual: ":WAVeform Commands > :FORMat, :BYTeorder, :UNSigned, :POINts:MODE, :SOURce, :TYPE, :XINCrement, :XORigin, :XREFerence, :YINCrement, :YORigin, :YREFerence"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1"
      - send: ":WAVeform:SOURce CHANnel1;:WAVeform:FORMat WORD;:WAVeform:BYTeorder LSBFirst;:WAVeform:UNSigned 0;:WAVeform:POINts:MODE MAXimum;:WAVeform:POINts 100000"
      - query: ":WAVeform:FORMat?"
        expect: "WORD"
      - query: ":WAVeform:BYTeorder?"
        expect: "LSBF"
      - query: ":WAVeform:UNSigned?"
        expect: "0"
      - query: ":WAVeform:POINts:MODE?"
        expect: "MAXimum"
      - query: ":WAVeform:SOURce?"
        expect: "CHAN1"
      - query: ":WAVeform:TYPE?"
        expect: "NORM"
      - query: ":WAVeform:XINCrement?"
        expect: "+1.00000000000E-07"
      - query: ":WAVeform:XORigin?"
        expect_fields: [{value: -0.004995, tolerance: 5.0e-06, format: "-d.dddddddddddE-dd"}]
      - query: ":WAVeform:XREFerence?"
        expect: "0"
      - query: ":WAVeform:YINCrement?"
        expect: "+6.10352E-05"
      - query: ":WAVeform:YORigin?"
        expect: "+0.00000E+00"
      - query: ":WAVeform:YREFerence?"
        expect: "0"
  - name: "自动测量：1 kHz、2 Vpp 正弦"
    manual: ":MEASure Commands > :SOURce, :VPP, :VMAX, :VMIN, :VAMPlitude, :VAVerage, :VRMS, :FREQuency, :PERiod"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1;:MEASure:SOURce CHANnel1"
      # 记录带 0.5 V/div 档的噪声(specs.noise_per_division,10 mV rms,#745):顶底与峰峰
      # 各含数个 σ,容差按此放宽;跨越类(FREQuency/PERiod)按跨越抖动放宽到 1%。
      - query: ":MEASure:VPP?"
        expect_value: 2.0
        tolerance: 0.12
      - query: ":MEASure:VMAX?"
        expect_value: 1.0
        tolerance: 0.05
      - query: ":MEASure:VMIN?"
        expect_value: -1.0
        tolerance: 0.05
      - query: ":MEASure:VAMPlitude?"
        expect_value: 2.0
        tolerance: 0.12
      - query: ":MEASure:VAVerage? DISPlay,CHANnel1"
        expect_value: 0.0
        tolerance: 0.01
      - query: ":MEASure:VRMS? DISPlay,DC,CHANnel1"
        expect_value: 0.7071
        tolerance: 0.01
      - query: ":MEASure:FREQuency? CHANnel1"
        expect_value: 1000.0
        tolerance: 10.0
      - query: ":MEASure:PERiod?"
        expect_value: 0.001
        tolerance: 1.0e-5
  - name: "测量名带信源时改变默认信源"
    manual: ":MEASure Commands > :MEASure:SOURce"
    steps:
      - send: "*RST"
      # CH2 无信号:读到的峰峰是这一档自己的噪声(specs.noise_per_division,#745)
      # CH2 无信号(*RST 在 5 V/div):读到的峰峰是这一档自己的噪声,10 万个样本的
      # 峰峰到达数个 σ = 0.1 V rms(#745)
      - query: ":MEASure:VPP? CHANnel2"
        expect_value: 0.0
        tolerance: 1.5
      - query: ":MEASure:SOURce?"
        expect: "CHAN2,CHAN2"
  - name: "错误队列：未建模的命令报 -113"
    manual: ":SYSTem Commands > :SYSTem:ERRor; Error Messages"
    steps:
      - send: "*CLS;:AUToscale"
      - query: ":SYSTem:ERRor?"
        expect: "-113,\"Undefined header;not implemented in this definition\""
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: "状态寄存器：*ESE、*ESR、*SRE、*STB、*OPC、*WAI、*TST"
    manual: "Common (*) Commands > *ESE, *ESR, *SRE, *STB, *OPC, *WAI, *TST, *CLS"
    steps:
      - send: "*CLS;*ESE 1;*SRE 32;*OPC;*WAI"
      - query: "*ESE?"
        expect: "1"
      - query: "*SRE?"
        expect: "32"
      - query: "*ESR?"
        expect: "1"
      - query: "*STB?"
        expect_format: "unsigned"
      - query: "*TST?"
        expect: "0"
  - name: "*TRG 与不带参数的 :DIGitize 相同（停止时也采一帧）"
    manual: "Common (*) Commands > *TRG"
    steps:
      - send: ":STOP;*TRG"
      - query: "*OPC?"
        expect: "1"
      - query: ":WAVeform:PREamble?"
        expect_prefix: "0,0,1000,1,"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: ":TRIGger:FORCe 在没有触发时也采一帧"
    manual: ":TRIGger Commands > General :TRIGger Commands > :TRIGger:FORCe"
    steps:
      - send: "*RST;:TRIGger:SWEep NORMal;:TRIGger:LEVel 20;:TRIGger:FORCe"
      - query: "*OPC?"
        expect: "1"
      - query: ":WAVeform:PREamble?"
        expect_prefix: "0,0,1000,1,"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: ":SYSTem:PRESet 与 *RST 的重置条件相同"
    manual: ":SYSTem Commands > :SYSTem:PRESet"
    steps:
      - send: ":CHANnel1:SCALe 0.2;:TIMebase:SCALe 1E-3;:TRIGger:SOURce CHANnel2;:ACQuire:TYPE AVERage;:ACQuire:COUNt 64"
      - send: ":SYSTem:PRESet"
      - query: ":CHANnel1:SCALe?"
        expect: "+5.00E+00"
      - query: ":TIMebase:SCALe?"
        expect: "+100E-06"
      - query: ":TRIGger:SOURce?"
        expect: "CHAN1"
      - query: ":ACQuire:TYPE?"
        expect: "NORM"
      - query: ":ACQuire:COUNt?"
        expect: "8"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: ":SYSTem:DIDentifier? 回带引号的主机 ID"
    manual: ":SYSTem Commands > :SYSTem:DIDentifier"
    steps:
      - query: ":SYSTem:DIDentifier?"
        expect: '"DSO-X 2024A,MY58260001,SIMUBENCH2024A"'
  - name: ":SERial? 回不带引号的序列号（与 *IDN? 同一个值）"
    manual: "Root (:) Commands > :SERial"
    steps:
      - query: ":SERial?"
        expect: "MY58260001"
      - query: "*IDN?"
        expect: "AGILENT TECHNOLOGIES,DSO-X 2024A,MY58260001,02.66.0000"
  - name: ":ACQuire? 的 *RST 示例回复与手册逐字一致"
    manual: ":ACQuire Commands > Introduction to :ACQuire Commands (Reporting the Setup)"
    steps:
      - send: "*RST"
      - query: ":ACQuire?"
        expect: ":ACQ:MODE RTIM;TYPE NORM;COMP 100;COUNT 8;SEGM:COUN 2"
      - send: ":ACQuire:TYPE AVERage;:ACQuire:COUNt 64"
      - query: ":ACQuire?"
        expect: ":ACQ:MODE RTIM;TYPE AVER;COMP 100;COUNT 64;SEGM:COUN 2"
  - name: ":ACQuire:TYPE 的 PEAK 与 HRESolution"
    manual: ":ACQuire Commands > :ACQuire:TYPE"
    steps:
      - send: "*RST;:ACQuire:TYPE PEAK"
      - query: ":ACQuire:TYPE?"
        expect: "PEAK"
      - query: ":WAVeform:TYPE?"
        expect: "PEAK"
      - send: ":ACQuire:TYPE HRESolution"
      - query: ":ACQuire:TYPE?"
        expect: "HRES"
      - query: ":WAVeform:TYPE?"
        expect: "HRES"
  - name: "时基微调开关（*RST 为 OFF）"
    manual: ":TIMebase Commands > :TIMebase:VERNier"
    steps:
      - send: "*RST"
      - query: ":TIMebase:VERNier?"
        expect: "0"
      - send: ":TIMebase:VERNier ON"
      - query: ":TIMebase:VERNier?"
        expect: "1"
      - send: ":TIMebase:VERNier OFF"
      - query: ":TIMebase:VERNier?"
        expect: "0"
  - name: "缩放时基：档位、量程（10 格）与位置（*RST 为 500 ns/div）"
    manual: ":TIMebase Commands > :TIMebase:WINDow:SCALe, :TIMebase:WINDow:RANGe, :TIMebase:WINDow:POSition"
    steps:
      - send: "*RST"
      - query: ":TIMebase:WINDow:SCALe?"
        expect: "+500E-09"
      - query: ":TIMebase:WINDow:RANGe?"
        expect: "+5.00E-06"
      - query: ":TIMebase:WINDow:POSition?"
        expect: "+0.0E+00"
      - send: ":TIMebase:WINDow:SCALe 1E-6"
      - query: ":TIMebase:WINDow:RANGe?"
        expect: "+10.0E-06"
      - send: ":TIMebase:WINDow:RANGe 2E-5"
      - query: ":TIMebase:WINDow:SCALe?"
        expect: "+2.00E-06"
      - send: ":TIMebase:WINDow:POSition 1E-3"
      - query: ":TIMebase:WINDow:POSition?"
        expect: "+1.0E-03"
  - name: "前面板锁定只保存与回读"
    manual: ":SYSTem Commands > :SYSTem:LOCK"
    steps:
      - send: "*RST"
      - query: ":SYSTem:LOCK?"
        expect: "0"
      - send: ":SYSTem:LOCK ON"
      - query: ":SYSTem:LOCK?"
        expect: "1"
      - send: ":SYSTem:LOCK 0"
      - query: ":SYSTem:LOCK?"
        expect: "0"
  - name: "50 Ω 保护锁只保存与回读（本型号只有 1 MΩ）"
    manual: ":SYSTem Commands > :SYSTem:PROTection:LOCK"
    steps:
      - send: "*RST"
      - query: ":SYSTem:PROTection:LOCK?"
        expect: "0"
      - send: ":SYSTem:PROTection:LOCK 1"
      - query: ":SYSTem:PROTection:LOCK?"
        expect: "1"
  - name: ":SYSTem:MENU 选择软键菜单（无查询）"
    manual: ":SYSTem Commands > :SYSTem:MENU"
    steps:
      - send: ":SYSTem:MENU MASK"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
  - name: ":SYSTem:DSP 写显示文本（无查询）"
    manual: ":SYSTem Commands > :SYSTem:DSP"
    steps:
      - send: ':SYSTem:DSP "MEASURING"'
      - send: ':SYSTem:DSP ""'
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'

  - name: "波形形状测量：顶/底、过冲/预冲、上升/下降时间、脉宽与占空比、边沿与脉冲计数（#248）"
    manual: ":MEASure Commands > :VTOP, :VBASe, :OVERshoot, :PREShoot, :RISetime, :FALLtime, :PWIDth, :NWIDth, :DUTYcycle, :NDUTy, :PEDGes, :NEDGes, :PPULses, :NPULses"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:CHANnel1:SCALe 0.5;:TIMebase:SCALe 1E-3;:DIGitize CHANnel1;:MEASure:SOURce CHANnel1"
      # 直方图顶底含噪声的展宽(#745)
      - query: ":MEASure:VTOP?"
        expect_value: 1.0
        tolerance: 0.05
      - query: ":MEASure:VBASe?"
        expect_value: -1.0
        tolerance: 0.05
      # 过冲/预冲 = (极值 − 直方图顶底)/(顶底差)×100(编程手册 02.66.0000 的 :MEASure:OVERshoot
      # 方法,顶底取自全记录直方图)。含噪记录上这不是失真而是真机行为:极值带着 ~4σ 的噪声
      # excursion(0.5 V/div 档 10 mV rms ≈ 40 mV,15.6 mV 码上取整 2 码),直方图众数落在真峰
      # 内 1 码,合计 3 码 46.9 mV ÷ 1.96875 V ≈ 2.4%(#782)。容差 0.5 盖住噪声抽取的码间波动。
      - query: ":MEASure:OVERshoot?"
        expect_value: 2.4
        tolerance: 0.5
      - query: ":MEASure:PREShoot?"
        expect_value: 2.4
        tolerance: 0.5
      # A sine's 10–90 % edge: 2·asin(0.8)/(2π·1 kHz) = 0.295 ms.
      # 10–90% 与中点跨越各带 ~2 µs 的噪声抖动(#745)
      - query: ":MEASure:RISetime?"
        expect_value: 2.95e-4
        tolerance: 2.0e-5
      - query: ":MEASure:FALLtime?"
        expect_value: 2.95e-4
        tolerance: 2.0e-5
      - query: ":MEASure:PWIDth?"
        expect_value: 5.0e-4
        tolerance: 2.0e-5
      - query: ":MEASure:NWIDth?"
        expect_value: 5.0e-4
        tolerance: 2.0e-5
      - query: ":MEASure:DUTYcycle?"
        expect_value: 50.0
        tolerance: 0.5
      - query: ":MEASure:NDUTy?"
        expect_value: 50.0
        tolerance: 0.5
      # 计数是整数：记录按触发对齐，窗口内的边沿/脉冲个数与采集相位无关，精确断言（#352）。
      - query: ":MEASure:PEDGes?"
        expect_value: 9.0
      - query: ":MEASure:NEDGes?"
        expect_value: 10.0
      - query: ":MEASure:PPULses?"
        expect_value: 9.0
      - query: ":MEASure:NPULses?"
        expect_value: 9.0

  - name: "运行与触发状态：:TER?、:AER?、:RSTate?、操作状态寄存器的 WAIT/STOP 路径与 :OPEE（#248、#352）"
    manual: "Root (:) Commands > :TER, :AER, :RSTate, :OPEE, :OPERegister:CONDition, :OPERegister[:EVENt]；*STB?"
    steps:
      - send: "*RST;:CHANnel1:PROBe 1;:DIGitize CHANnel1"
      # :DIGitize 的记录是否推 TRG 事件取决于采集相位（AUTO 的窗口内搜索）；*CLS 把触发锁存
      # 确定性清零，:TER? 与 *STB? 的位 0/位 7 才有固定值（#352）。
      - send: "*CLS"
      - query: ":TER?"
        expect: "0"
      - query: ":RSTate?"
        expect: "STOP"
      - send: ":OPEE 8"
      - query: ":OPEE?"
        expect: "8"
      # 等待触发路径（WAIT，位 5）：NORMal 加带外电平（±1 V 正弦，1.2 V 合法且永远等不到边沿），
      # RUN 与 WAIT 与相位无关地保持置位，*STB 位 7 是 OPER 摘要（#352）。
      - send: ":TRIGger:SWEep NORMal;:TRIGger:LEVel 1.2"
      - send: ":RUN"
      - query: ":RSTate?"
        expect: "RUN"
      - query: ":AER?"
        expect: "1"
      - query: ":AER?"
        expect: "0"
      - query: ":OPERegister:CONDition?"
        expect: "40"
      - query: "*STB?"
        expect: "128"
      - query: ":OPERegister?"
        expect: "40"
      - query: ":OPERegister?"
        expect: "0"
      # :STOP 清条件位；事件锁存已读完，*STB 的 OPER 摘要随之消失（#352）。
      - send: ":STOP"
      - query: ":OPERegister:CONDition?"
        expect: "0"
      - query: "*STB?"
        expect: "0"
      - query: ":OPERegister?"
        expect: "0"

  - name: "按参数选通道：:VIEW/:BLANk/:STATus? 与每个触发源各自的电平（#248）"
    manual: "Root (:) Commands > :VIEW, :BLANk, :STATus；:TRIGger[:EDGE] Commands > :LEVel <level>[,<source>]"
    steps:
      - query: ":STATus? CHANnel2"
        expect: "0"
      - send: ":VIEW CHANnel2"
      - query: ":STATus? CHANnel2"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "1"
      - send: ":BLANk CHANnel2"
      - query: ":STATus? CHANnel2"
        expect: "0"
      - send: ":TRIGger:LEVel 0.2"
      - send: ":TRIGger:LEVel 0.5,CHANnel2"
      - query: ":TRIGger:LEVel?"
        expect: "+200.000E-03"
      - query: ":TRIGger:LEVel? CHANnel2"
        expect: "+500.000E-03"
      - send: ":TRIGger:SOURce CHANnel2"
      - query: ":TRIGger:LEVel?"
        expect: "+500.000E-03"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'

  - name: "时间测量与双电平触发（#350）：相对触发点的时间、中间电平的边沿、两源延迟与相位"
    manual: ":MEASure Commands > XMAX / XMIN / BRATe / VTIMe / TEDGe / TVALue / DELay / PHASe；:TRIGger Commands > :LEVel:HIGH / :LEVel:LOW / :LEVel:ASETup"
    steps:
      # 1 kHz 正弦，200 µs/div：记录为触发点前后各 1 ms；探头 10:1，峰值显示为 10 V。
      - send: ":TIMebase:SCALe 2E-4"
      - send: ":DIGitize CHANnel1"
      # 比特率从两个中点跨越算,带噪声抖动(#745)
      - query: ":MEASure:BRATe? CHANnel1"
        expect_value: 2000.0
        tolerance: 20.0
      # 第一个最大值在 −0.75 ms 附近（8 位量化的平顶取第一个样点），最小值在 −0.25 ms 附近。
      - query: ":MEASure:XMAX? CHANnel1"
        expect_fields: [{value: -0.000775, tolerance: 2.5e-05}]
      - query: ":MEASure:XMIN? CHANnel1"
        expect_fields: [{value: -0.000275, tolerance: 2.5e-05}]
      # 出界取边界样本:现在带上该档的噪声(#745)
      - query: ":MEASure:VTIMe? 2.5E-4,CHANnel1"
        expect_value: 10.0
        tolerance: 0.5
      # 第一个上升沿就是触发点；第一个下降过零在 −0.5 ms。
      - query: ":MEASure:TEDGe? +1,CHANnel1"
        expect_fields: [{prefix: "+", format: "nr3", min: 0.0, max: 1.0e-5}]
      - query: ":MEASure:TVALue? 0,-1,CHANnel1"
        expect_fields: [{value: -0.000495, tolerance: 5.0e-06}]
      - query: ":MEASure:TEDGe? +2,CHANnel1"
        expect: "+9.9E+37"
      - query: ":MEASure:DELay? CHANnel1,CHANnel1"
        expect: "+0.00000E+00"
      - query: ":MEASure:PHASe? CHANnel1,CHANnel1"
        expect: "+0.00000E+00"
      # 欠幅/转换时间触发的高低电平：每个信源各一，保存回读；ASETup 把边沿电平设到波形的 50 %。
      - send: ":TRIGger:LEVel:HIGH 1.5,CHANnel1"
      - query: ":TRIGger:LEVel:HIGH? CHANnel1"
        expect: "+1.50000E+00"
      - send: ":TRIGger:LEVel:LOW -0.5"
      - query: ":TRIGger:LEVel:LOW?"
        expect: "-500.000E-03"
      - send: ":TRIGger:LEVel 0.7"
      - send: ":TRIGger:LEVel:ASETup"
      - query: ":TRIGger:LEVel?"
        expect: "+0.00000E+00"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'

  - name: "屏幕测量列表（#373）：不带 ? 的测量命令上屏，最多 4 个，RESults? 带统计，CLEar 清空，ALL? 是快照"
    manual: ":MEASure Commands > :MEASure:<item> (installs a measurement) / :RESults? / :CLEar / :ALL? / :SHOW / :WINDow"
    steps:
      - send: ":TIMebase:SCALe 2E-4"
      - send: ":DIGitize CHANnel1"
      - query: ":MEASure:RESults?"
        expect: ""
      - send: ":MEASure:FREQuency CHANnel1"
      - send: ":MEASure:VPP CHANnel1"
      # 行结构与量级:频率 ~1.00xE3、VPP ~2.0xE1(含噪声,#745),统计仍同值、计数 1
      - query: ":MEASure:RESults?"
        expect_fields:
          - "FREQuency(1)"
          - {value: 1050.0, tolerance: 50.0, format: "+d.dddddE+dd"}
          - {value: 1050.0, tolerance: 50.0, format: "+d.dddddE+dd", count: 3}
          - "+0.00000E+00"
          - "1"
          - "VPP(1)"
          - {value: 20.5, tolerance: 0.5, format: "+d.dddddE+dd"}
          - {value: 20.5, tolerance: 0.5, format: "+d.dddddE+dd", count: 3}
          - "+0.00000E+00"
          - "1"
      - send: ":MEASure:VMAX CHANnel1;:MEASure:VMIN CHANnel1;:MEASure:VRMS CHANnel1"
      - query: ":MEASure:RESults?"
        expect_fields:  # each measurement: its name, current/min/max/mean/σ as NR3, then the count
          - "VPP(1)"
          - {format: "nr3", count: 5}
          - {format: "unsigned"}
          - "VMAX(1)"
          - {format: "nr3", count: 5}
          - {format: "unsigned"}
          - "VMIN(1)"
          - {format: "nr3", count: 5}
          - {format: "unsigned"}
          - "VRMS(1)"
          - {format: "nr3", count: 5}
          - {format: "unsigned"}
      - query: ":MEASure:ALL? CHANnel1"
        expect_fields:
          - {value: 20.5, tolerance: 0.5, format: "+d.dddddE+dd"}
          - {format: "±d.dddddE±dd", count: 17}
          - {value: 2040.0, tolerance: 60.0, format: "+d.dddddE+dd"}
      - send: ":MEASure:CLEar"
      - query: ":MEASure:RESults?"
        expect: ""
      - query: ":MEASure:SHOW?"
        expect: "1"
      - send: ":MEASure:WINDow ZOOM"
      - query: ":MEASure:WINDow?"
        expect: "ZOOM"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'

  - name: "脉宽触发（#956）：类型、信源与电平、极性、条件与时间；触发点在脉冲结束沿或持续到该时间的时刻"
    manual: ":TRIGger Commands > :TRIGger:MODE；:TRIGger:GLITch Commands > :GREaterthan / :LESSthan / :LEVel / :POLarity / :QUALifier / :RANGe / :SOURce（Programmer's Guide 02.66, ch. 29）"
    steps:
      # *RST 后的条件与时间是 SimuBench 的假设（覆盖表注明）。
      - query: ":TRIGger:GLITch:QUALifier?"
        expect: "LESS"
      - query: ":TRIGger:GLITch:POLarity?"
        expect: "POS"
      - send: ":TRIGger:MODE GLITch;:TRIGger:GLITch:SOURce CHANnel1;:TRIGger:GLITch:LEVel 0.5"
      - query: ":TRIGger:MODE?"
        expect: "GLIT"
      - query: ":TRIGger:EDGE:LEVel? CHANnel1"
        expect: "+500.000E-03"
      - send: ":TRIGger:GLITch:LEVel 0"
      - send: ":TRIGger:GLITch:RANGe 600E-6,400E-6"
      - query: ":TRIGger:GLITch:RANGe?"
        expect: "+600.000E-06,+400.000E-06"
      - query: ":TRIGger:GLITch:LESSthan?"
        expect: "+600.000E-06"
      - query: ":TRIGger:GLITch:GREaterthan?"
        expect: "+400.000E-06"
      # 1 kHz 正弦（探头 10:1，峰值显示为 10 V）过 0 V 的正脉冲宽 500 µs，200 µs/div。
      # 范围 400–600 µs：在脉冲的结束沿（下降过零）触发，其前 250 µs 是正峰、其后 250 µs 是负峰。
      - send: ":TIMebase:SCALe 2E-4;:TRIGger:GLITch:QUALifier RANGe"
      - send: ":DIGitize CHANnel1"
      - query: ":MEASure:VTIMe? -2.5E-4,CHANnel1"
        expect_value: 10.0
        tolerance: 0.5
      - query: ":MEASure:VTIMe? 2.5E-4,CHANnel1"
        expect_value: -10.0
        tolerance: 0.5
      # 大于 250 µs：脉冲持续到 250 µs 的时刻触发，正好是正峰（脉冲还没有结束）。
      - send: ":TRIGger:GLITch:QUALifier GREaterthan;:TRIGger:GLITch:GREaterthan 250E-6"
      - send: ":DIGitize CHANnel1"
      - query: ":MEASure:VTIMe? 0,CHANnel1"
        expect_value: 10.0
        tolerance: 0.5
      # 负极性、小于 600 µs：负脉冲在上升过零处结束，其后 250 µs 是正峰。
      - send: ":TRIGger:GLITch:POLarity NEGative;:TRIGger:GLITch:QUALifier LESSthan"
      - query: ":TRIGger:GLITch:QUALifier?"
        expect: "LESS"
      - send: ":DIGitize CHANnel1"
      - query: ":MEASure:VTIMe? 2.5E-4,CHANnel1"
        expect_value: 10.0
        tolerance: 0.5
      - query: ":TER?"
        expect: "1"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
      # 两个时间的范围按手册（:TRIGger:GLITch:RANGe，#1001）：“小于”15 ns–10 s，“大于”10 ns–9.99 s；
      # 越界的值被拒绝，设置不变。
      - send: ":TRIGger:GLITch:LESSthan 12E-9"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-222"
      - query: ":TRIGger:GLITch:LESSthan?"
        expect: "+600.000E-06"
      - send: ":TRIGger:GLITch:GREaterthan 9.995"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-222"
      - query: ":TRIGger:GLITch:GREaterthan?"
        expect: "+250.000E-06"
      - send: ":TRIGger:GLITch:LESSthan 15E-9;:TRIGger:GLITch:GREaterthan 10E-9"
      - query: ":TRIGger:GLITch:LESSthan?"
        expect: "+15.0000E-09"
      - query: ":TRIGger:GLITch:GREaterthan?"
        expect: "+10.0000E-09"
      - query: ":SYSTem:ERRor?"
        expect: '+0,"No error"'
      # 其余触发类型没有建模。
      - send: ":TRIGger:MODE RUNT"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-224"
      - query: ":TRIGger:MODE?"
        expect: "GLIT"

  - name: "分段存储（#957）：SEGMented 模式一次采集取 COUNt 段，按 INDex 读段，TTAG 为相对第 1 段的触发时刻"
    manual: ":ACQuire Commands > :ACQuire:MODE / :ACQuire:SEGMented:COUNt / :INDex / :ANALyze；:WAVeform Commands > :WAVeform:SEGMented:COUNt? / :TTAG?（Programmer's Guide 02.66, ch. 6、ch. 31）"
    steps:
      - query: ":ACQuire:SEGMented:COUNt?"
        expect: "+2"
      - query: ":WAVeform:SEGMented:COUNt?"
        expect: "0"
      # RTIMe 模式只有第 1 段。
      - send: ":ACQuire:SEGMented:INDex 2"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-222"
      - send: ":ACQuire:MODE SEGMented;:ACQuire:SEGMented:COUNt 3"
      - query: ":ACQuire?"
        expect: ":ACQ:MODE SEGM;TYPE NORM;COMP 100;COUNT 8;SEGM:COUN 3"
      # 1 kHz 正弦，200 µs/div：记录 2 ms，重新布防 19 µs（估计），下一段在 3 ms 后的上升过零触发。
      - send: ":TIMebase:SCALe 2E-4"
      - send: ":DIGitize CHANnel1"
      - query: ":WAVeform:SEGMented:COUNt?"
        expect: "3"
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 0.0
        tolerance: 1.0e-12
      - send: ":ACQuire:SEGMented:INDex 3"
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 6.0e-3
        tolerance: 1.0e-8
      # 所选的段供测量使用：触发点后 250 µs 是正峰（探头 10:1，显示为 10 V）。
      - query: ":MEASure:VTIMe? 2.5E-4,CHANnel1"
        expect_value: 10.0
        tolerance: 0.5
      - send: ":ACQuire:SEGMented:ANALyze"
      - send: ":ACQuire:SEGMented:INDex 4"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-222"
      - send: ":ACQuire:SEGMented:COUNt 26"
      - query: ":SYSTem:ERRor?"
        expect_prefix: "-222"
      - query: ":ACQuire:SEGMented:COUNt?"
        expect: "+3"
