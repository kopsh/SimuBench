  - name: "逐点算子串测：乘除、微积分、平滑、滤波、桶极值、放大、平方根与量程偏置"
    manual: ":FUNCtion<F> Commands > :FUNCtion<F>:MULTiply, :DIVide, :DIFF, :INTegrate, :AVERage, :DELay, :GATing, :HIGHpass, :LOWPass, :SMOoth, :MAXimum, :MINimum, :MAGNify, :INVert, :SQUare, :SQRT, :RANGe, :OFFSet, :LABel, :FUNCtion<F>?"
    steps:
      - send: ":TIMebase:SCALe 1E-5"
      - send: ":FUNCtion1:COMMonmode CHANnel1,CHANnel2"
      - query: ":FUNCtion1?"
        expect: "CHANnel1,CHANnel2"
      - send: ":FUNCtion1:MULTiply CHANnel1,CHANnel1"
      - send: ":FUNCtion1:DIVide FUNCtion1,2"
      - send: ":FUNCtion1:SUBTract FUNCtion1,CHANnel1"
      - send: ":FUNCtion1:SQRT FUNCtion1"
      - send: ":FUNCtion1:INVert FUNCtion1"
      - send: ":FUNCtion1:SQUare CHANnel1"
      - send: ":FUNCtion1:MAGNify CHANnel1"
      - send: ":FUNCtion1:DIFF CHANnel1"
      - send: ":FUNCtion1:INTegrate CHANnel1"
      - send: ":FUNCtion1:AVERage CHANnel1,16"
      - send: ":FUNCtion1:DELay CHANnel1,1e-6"
      - send: ":FUNCtion1:MAXimum CHANnel1"
      - send: ":FUNCtion1:MINimum CHANnel1"
      - send: ":FUNCtion1:SMOoth CHANnel1,9"
      - send: ":FUNCtion1:HIGHpass CHANnel1,1e6"
      - send: ":FUNCtion1:LOWPass CHANnel1,5e6"
      - send: ":FUNCtion1:GATing CHANnel1,-8e-6,-5e-6"
      - query: ":FUNCtion1?"
        expect: "CHANnel1"
      - send: ":FUNCtion1:RANGe 4"
      - query: ":FUNCtion1:RANGe?"
        expect: "+4.00000E+00"
      - send: ":FUNCtion1:OFFSet 0.1"
      - query: ":FUNCtion1:OFFSet?"
        expect: "+1.00000E-01"
      - send: ":FUNCtion1:LABel \"f1\""
      - query: ":FUNCtion1:LABel?"
        expect: "\"f1\""
  - name: "门控窗口的起止单独设置，函数的水平方式在可手动算子上跟随写法变 MANual"
    manual: ":FUNCtion<F> Commands > :FUNCtion<F>:GATing:STARt, :GATing:STOP, :FUNCtion<F>:HORizontal, :HORizontal:POSition"
    steps:
      - send: ":FUNCtion1:GATing CHANnel1,-8e-6,-5e-6"
      - send: ":FUNCtion1:GATing:STARt -7e-6"
      - query: ":FUNCtion1:GATing:STARt?"
        expect: "-7.00000E-06"
      - send: ":FUNCtion1:GATing:STOP -4e-6"
      - query: ":FUNCtion1:GATing:STOP?"
        expect: "-4.00000E-06"
      - send: ":FUNCtion1:HORizontal MANual"
      - query: ":FUNCtion1:HORizontal?"
        expect: "MANual"
      - send: ":FUNCtion1:HORizontal:POSition -6e-6"
      - query: ":FUNCtion1:HORizontal:POSition?"
        expect: "-6.00000E-06"
  - name: "FFT 相位与跨度设置：FFTPhase、STARt/STOP、TDELay、IMPedance、REFerence、HSCale、DETector、PSDensity"
    manual: ":FUNCtion<F> Commands > :FUNCtion<F>:FFTPhase, :PSDensity, :FFT:STARt, :FFT:STOP, :FFT:TDELay, :FFT:IMPedance, :FFT:REFerence, :FFT:HSCale, :FFT:DETector:TYPE, :FFT:DETector:POINts"
    steps:
      - send: ":TIMebase:SCALe 1E-5"
      - send: ":FUNCtion2:FFTPhase CHANnel1"
      - send: ":FUNCtion2:FFT:STARt 0"
      - query: ":FUNCtion2:FFT:STARt?"
        expect: "+0.00000E+00"
      - send: ":FUNCtion2:FFT:STOP 5e6"
      - query: ":FUNCtion2:FFT:STOP?"
        expect: "+5.00000E+06"
      - send: ":FUNCtion2:FFT:FREQuency 2.5E6;:FUNCtion2:FFT:SPAN 5E6"
      - query: ":FUNCtion2:FFT:FREQuency?"
        expect: "+2.50000E+06"
      - query: ":FUNCtion2:FFT:SPAN?"
        expect: "+5.00000E+06"
      - send: ":FUNCtion2:FFT:STOP 5e6"
      - query: ":FUNCtion2:FFT:STOP?"
        expect: "+5.00000E+06"
      - send: ":FUNCtion2:FFT:TDELay 1e-9"
      - query: ":FUNCtion2:FFT:TDELay?"
        expect: "+1.00000E-09"
      - send: ":FUNCtion2:FFT:IMPedance 75"
      - query: ":FUNCtion2:FFT:IMPedance?"
        expect: "+7.50000E+01"
      - send: ":FUNCtion2:FFT:REFerence TRIGger"
      - query: ":FUNCtion2:FFT:REFerence?"
        expect: "TRIG"
      - send: ":FUNCtion2:FFT:HSCale LOG"
      - query: ":FUNCtion2:FFT:HSCale?"
        expect: "LOG"
      - send: ":FUNCtion2:FFT:DETector:TYPE PPOSitive;:FUNCtion2:FFT:DETector:POINts 500"
      - query: ":FUNCtion2:FFT:DETector:TYPE?"
        expect: "PPOS"
      - query: ":FUNCtion2:FFT:DETector:POINts?"
        expect: "500"
      - send: ":FUNCtion1:PSDensity CHANnel1"
      - query: ":FUNCtion1?"
