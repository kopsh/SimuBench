        expect: "CHANnel2"
      - send: ":FUNCtion1:DISPlay ON"
      - query: ":FUNCtion1:DISPlay?"
        expect: "1"
  - name: "数学函数的量程与偏置：VERTical MANual 后 RANGe/OFFSet 可查；算子代换"
    manual: ":FUNCtion<F> Commands > :FUNCtion<F>:VERTical, :FUNCtion<F>:VERTical:RANGe, :FUNCtion<F>:VERTical:OFFSet"
    steps:
