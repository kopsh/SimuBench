# Manual cases for the Keysight Infiniium UXR0334B: Infiniium UXR-Series Oscilloscopes Programmer's
# Guide 11.60.00000 (9018-07723); ranges from the UXR-B data sheet 3123-1313. Numbers answer as the
# guide's sample (+8.00000E-01): NR3, five decimals, signed; booleans 1/0; enumerations short.
# The bench: 10 MHz 400 mVpp sine on CH1, 1 MHz 400 mVpp square on CH2 (50 ohm).
model: keysight-uxr0334b
bench: bench.yaml
instrument: scope
cases:
  - name: "*IDN? 按手册的格式"
    manual: "* (Common) Commands > *IDN?"
    steps:
      - query: "*IDN?"
        expect: "Keysight Technologies,UXR0334B,MY64280101,11.60.00000"
  - name: ":MODel? 与 :SERial? 回不带引号的型号与序列号"
    manual: ": (Root Level) Commands > :MODel?; :SERial"
    steps:
      - query: ":MODel?"
        expect: "UXR0334B"
      - query: ":SERial?"
        expect: "MY64280101"
      - send: ':SERial "US12345678"'
      - query: ":SYSTem:ERRor?"
        expect: "-113"
  - name: "*RST 为默认设置：CH1 开、1 V/div、偏置 0"
    manual: "* (Common) Commands > *RST; :SYSTem Commands > :SYSTem:PRESet (Default Setup)"
    steps:
      - send: ":CHANnel1:SCALe 0.2;:CHANnel1:OFFSet 0.1;:CHANnel2:DISPlay ON;*RST"
      - query: ":CHANnel1:DISPlay?"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "0"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00000E+00"
      - query: ":CHANnel1:OFFSet?"
        expect: "+0.00000E+00"
      - query: ":CHANnel1:INPut?"
        expect: "DC50"
  - name: "*RST 的时基与触发：100 ns/div、位置 0、中心参考、CH1 边沿 0 V 上升、AUTO"
    manual: "* (Common) Commands > *RST; :SYSTem:PRESet (Default Setup)"
    steps:
      - send: ":TIMebase:SCALe 1E-6;:TRIGger:SWEep TRIGgered;:TRIGger:EDGE:SLOPe NEGative;*RST"
      - query: ":TIMebase:SCALe?"
        expect: "+1.00000E-07"
      - query: ":TIMebase:POSition?"
        expect: "+0.00000E+00"
      - query: ":TIMebase:REFerence?"
        expect: "CENT"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
      - query: ":TRIGger:SWEep?"
        expect: "AUTO"
      - query: ":TRIGger:EDGE:SOURce?"
        expect: "CHAN1"
      - query: ":TRIGger:EDGE:SLOPe?"
        expect: "POS"
      - query: ":TRIGger:LEVel? CHANnel1"
        expect: "+0.00000E+00"
      - query: ":RSTate?"
        expect: "RUN"
  - name: ":SYSTem:PRESet 与 *RST 相同；FACTory 未建模"
    manual: ":SYSTem Commands > :SYSTem:PRESet"
    steps:
      - send: ":CHANnel1:SCALe 0.2;:SYSTem:PRESet"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00000E+00"
      - send: ":CHANnel1:SCALe 0.2;:SYSTem:PRESet DEFault"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00000E+00"
      - send: ":SYSTem:PRESet FACTory"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "通道档位、满量程与偏置"
    manual: ":CHANnel<N> Commands > :CHANnel<N>:SCALe; :CHANnel<N>:RANGe; :CHANnel<N>:OFFSet"
    steps:
      - send: ":CHANnel2:SCALe 50E-3"
      - query: ":CHANnel2:SCALe?"
        expect: "+5.00000E-02"
      - query: ":CHANnel2:RANGe?"
        expect: "+4.00000E-01"
      - send: ":CHANnel2:RANGe 800E-3"
      - query: ":CHANnel2:SCALe?"
        expect: "+1.00000E-01"
      - send: ":CHANnel2:OFFSet 125E-3"
      - query: ":CHANnel2:OFFSet?"
        expect: "+1.25000E-01"
  - name: "档位超出 1 mV/div 到 1 V/div 报 -222"
    manual: ":CHANnel<N>:SCALe; UXR-B data sheet 3123-1313 (displayed input sensitivity)"
    steps:
      - send: ":CHANnel1:SCALe 2"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
      - query: ":CHANnel1:SCALe?"
        expect: "+1.00000E+00"
  - name: "偏置范围随档位：50 mV/div 时 ±0.4 V，200 mV/div 时 ±2.25 V"
    manual: ":CHANnel<N>:OFFSet; UXR-B data sheet 3123-1313 (available offset)"
    steps:
      - send: ":CHANnel1:SCALe 50E-3;:CHANnel1:OFFSet 0.5"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
      - query: ":CHANnel1:OFFSet?"
        expect: "+0.00000E+00"
      - send: ":CHANnel1:SCALe 200E-3;:CHANnel1:OFFSet 2"
      - query: ":CHANnel1:OFFSet?"
        expect: "+2.00000E+00"
  - name: "输入只有 DC50（DCFifty 同义）；其他耦合报错"
    manual: ":CHANnel<N> Commands > :CHANnel<N>:INPut"
    steps:
      - send: ":CHANnel1:INPut DCFifty"
      - query: ":CHANnel1:INPut?"
        expect: "DC50"
      - send: ":CHANnel1:INPut DC"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "通道显示与标签"
    manual: ":CHANnel<N> Commands > :CHANnel<N>:DISPlay; :CHANnel<N>:LABel"
    steps:
      - send: ":CHANnel3:DISPlay ON"
      - query: ":CHANnel3:DISPlay?"
        expect: "1"
      - send: ':CHANnel3:LABel "CLK"'
      - query: ":CHANnel3:LABel?"
        expect: '"CLK"'
  - name: ":VIEW、:BLANk 与 :STATus? 按参数开关通道"
    manual: ": (Root Level) Commands > :VIEW; :BLANk; :STATus?"
    steps:
      - send: ":VIEW CHANnel2"
      - query: ":STATus? CHANnel2"
        expect: "1"
      - query: ":CHANnel2:DISPlay?"
        expect: "1"
      - send: ":BLANk CHANnel2"
      - query: ":STATus? CHANnel2"
        expect: "0"
      - send: ":BLANk FUNCtion1"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "时基档位、满量程、位置与参考"
    manual: ":TIMebase Commands > :TIMebase:SCALe; :TIMebase:RANGe; :TIMebase:POSition; :TIMebase:REFerence"
    steps:
      - send: ":TIMebase:SCALe 5E-9"
      - query: ":TIMebase:RANGe?"
        expect: "+5.00000E-08"
      - send: ":TIMebase:RANGe 1E-6"
      - query: ":TIMebase:SCALe?"
        expect: "+1.00000E-07"
      - send: ":TIMebase:POSition 20E-9"
      - query: ":TIMebase:POSition?"
        expect: "+2.00000E-08"
      - send: ":TIMebase:REFerence LEFT"
      - query: ":TIMebase:REFerence?"
        expect: "LEFT"
      - send: ":TIMebase:SCALe 50"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
  - name: "触发：边沿信源、斜率、各信源的电平与释抑"
    manual: ":TRIGger Commands > :TRIGger:EDGE:SOURce; :TRIGger:EDGE:SLOPe; :TRIGger:LEVel; :TRIGger:HOLDoff"
    steps:
      - send: ":TRIGger:EDGE:SOURce CHANnel3"
      - query: ":TRIGger:EDGE:SOURce?"
        expect: "CHAN3"
      - send: ":TRIGger:EDGE1:SLOPe EITHer"
      - query: ":TRIGger:EDGE:SLOPe?"
        expect: "EITH"
      - send: ":TRIGger:LEVel CHANnel3,0.05;:TRIGger:LEVel AUX,1.5"
      - query: ":TRIGger:LEVel? CHANnel3"
        expect: "+5.00000E-02"
      - query: ":TRIGger:LEVel? CHANnel1"
        expect: "+0.00000E+00"
      - query: ":TRIGger:LEVel? AUX"
        expect: "+1.50000E+00"
      - send: ":TRIGger:HOLDoff 1E-6"
      - query: ":TRIGger:HOLDoff?"
        expect: "+1.00000E-06"
      - send: ":TRIGger:HOLDoff 50E-9"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
      - send: ":TRIGger:EDGE:SOURce AUX"
      - query: ":TRIGger:EDGE:SOURce?"
        expect: "AUX"
  - name: "EDGE2（序列触发）报 -114；高级触发模式未建模"
    manual: ":TRIGger:EDGE:SLOPe ([{1 | 2}]); :TRIGger:MODE"
    steps:
      - send: ":TRIGger:EDGE2:SLOPe NEGative"
      - query: ":SYSTem:ERRor?"
        expect: "-114"
      - send: ":TRIGger:MODE GLITch"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
      - query: ":TRIGger:MODE?"
        expect: "EDGE"
  - name: "触发方式 AUTO / TRIGgered；SINGle 未建模"
    manual: ":TRIGger Commands > :TRIGger:SWEep"
    steps:
      - send: ":TRIGger:SWEep TRIGgered"
      - query: ":TRIGger:SWEep?"
        expect: "TRIG"
      - send: ":TRIGger:SWEep SINGle"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "采集设置：模式、平均、次数、完成判据、存储深度与带宽"
    manual: ":ACQuire Commands > :ACQuire:MODE; :ACQuire:AVERage; :ACQuire[:AVERage]:COUNt; :ACQuire:COMPlete; :ACQuire:POINts[:ANALog]; :ACQuire:BANDwidth"
    steps:
      - query: ":ACQuire:MODE?"
        expect: "RTIM"
      - query: ":ACQuire:COMPlete?"
        expect: "90"
      - send: ":ACQuire:AVERage ON;:ACQuire:AVERage:COUNt 64"
      - query: ":ACQuire:AVERage?"
        expect: "1"
      - query: ":ACQuire:COUNt?"
        expect: "64"
      - send: ":ACQuire:COMPlete 100"
      - query: ":ACQuire:COMPlete?"
        expect: "100"
      - send: ":ACQuire:POINts 1000"
      - query: ":ACQuire:POINts:ANALog?"
        expect: "1000"
      - send: ":ACQuire:POINts AUTO"
      - query: ":ACQuire:POINts?"
        expect: "128000"
      - send: ":ACQuire:BANDwidth 16E9"
      - query: ":ACQuire:BANDwidth?"
        expect: "+1.60000E+10"
      - send: ":ACQuire:BANDwidth MAX"
      - query: ":ACQuire:BANDwidth?"
        expect: "+3.30000E+10"
      - send: ":ACQuire:MODE PDETect"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "采样率：128 GSa/s 除以 2 的幂，存储深度限制采样率"
    manual: ":ACQuire:SRATe[:ANALog]; :ACQuire:POINts[:ANALog] (interaction); data sheet (128 GSa/s, configurable in powers of two)"
    steps:
      - query: ":ACQuire:SRATe?"
        expect: "+1.28000E+11"
      - send: ":ACQuire:POINts 1000"
      - query: ":ACQuire:SRATe:ANALog?"
        expect: "+1.00000E+09"
      - send: ":ACQuire:POINts 100000"
      - query: ":ACQuire:SRATe?"
        expect: "+6.40000E+10"
  - name: "设定采样率：取下一个更快的档，优先于存储深度；AUTO 与 MAX"
    manual: ":ACQuire:SRATe[:ANALog] (<rate> rounded to the next fastest; SRATe takes precedence)"
    steps:
      - send: ":ACQuire:POINts 1000;:ACQuire:SRATe 20E9"
      - query: ":ACQuire:SRATe?"
        expect: "+3.20000E+10"
      - send: ":DIGitize CHANnel1"
      - query: ":WAVeform:POINts?"
        expect: "32000"
      - send: ":ACQuire:SRATe AUTO"
      - query: ":ACQuire:SRATe?"
        expect: "+1.00000E+09"
      - send: ":ACQuire:SRATe MAX"
      - query: ":ACQuire:SRATe?"
        expect: "+1.28000E+11"
  - name: ":DIGitize 采完即停，:ADER?、:PDER? 与 :TERegister? 各自读后清零"
    manual: ": (Root Level) Commands > :DIGitize; :ADER?; :PDER?; :TERegister?; :RSTate?; :ASTate?"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:TRIGger:SWEep TRIGgered;:DIGitize CHANnel1"
      - query: ":RSTate?"
        expect: "STOP"
      - query: ":ASTate?"
        expect: "ADONE"
      - query: ":ADER?"
        expect: "1"
      - query: ":ADER?"
        expect: "0"
      - query: ":PDER?"
        expect: "1"
      - query: ":PDER?"
        expect: "0"
      - query: ":TERegister?"
        expect: "1"
      - query: ":TERegister?"
        expect: "0"
      - query: ":ATER?"
        expect: "0"
  - name: "自动触发：没有触发的 AUTO 采集置 :ATER? 与 :ADER?，不置 :TERegister?"
    manual: ": (Root Level) Commands > :ATER?; :ADER?; :TERegister? (the autotrigger does not set this register); :ASTate?"
    steps:
      - query: ":MEASure:VPP? CHANnel1"
        expect_format: "+d.dddddE-0d"
      - query: ":ASTate?"
        expect: "ATRIG"
      - query: ":ATER?"
        expect: "1"
      - query: ":ADER?"
        expect: "1"
      - query: ":TERegister?"
        expect: "0"
      - query: ":ATER?"
        expect: "0"
  - name: ":SINGle 不改触发方式；:RUN 布防（:AER?）后 :STOP"
    manual: ": (Root Level) Commands > :SINGle; :RUN; :STOP; :AER?"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:SINGle"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRIGger:SWEep?"
        expect: "AUTO"
      - query: ":RSTate?"
        expect: "STOP"
      - send: ":RUN"
      - query: ":AER?"
        expect: "1"
      - query: ":RSTate?"
        expect: "RUN"
      - send: ":STOP"
      - query: ":RSTate?"
        expect: "STOP"
  - name: "*TRG 与 :DIGitize 相同；:TRIGger:FORCe 无触发也采一次"
    manual: "* (Common) Commands > *TRG; :TRIGger Commands > :TRIGger:FORCe"
    steps:
      - send: ":STOP;*TRG"
      - query: "*OPC?"
        expect: "1"
      - query: ":RSTate?"
        expect: "STOP"
      - send: ":TRIGger:FORCe"
      - query: ":SYSTem:ERRor?"
        expect: "0"
  - name: "操作状态寄存器：ACQ DONE、PROC DONE、AUTO TRIG 位，使能、读后清零、摘要进 *STB 位 7"
    manual: ": (Root Level) Commands > :OPEEnable; :OPERegister?; Status Reporting > Operation Status Register"
    steps:
      - send: ":OPEEnable 1"
      - query: ":OPEEnable?"
        expect: "1"
      - send: ":CHANnel1:SCALe 0.1;:DIGitize CHANnel1"
      - query: "*STB?"
        expect_fields: [{one_of: ["129", "128", "193", "192", "161", "160", "225", "224"]}]
      - query: ":OPERegister?"
        expect: "3"
      - query: ":OPERegister?"
        expect: "0"
      - send: ":CHANnel1:SCALe 1;:RUN"
      - query: ":MEASure:VPP? CHANnel1"
        expect_format: "+d.dddddE-0d"
      # 位 11 AUTO TRIG（位 5 WAIT TRIG 视触发而定）；ACQ DONE 与 PROC DONE 随 :ADER?、:PDER? 未读而保持，
      # 不再上升，不再置位
      - query: ":OPERegister?"
        expect_fields: [{one_of: ["2048", "2080"]}]
  - name: "波形传输设置：信源、格式（默认 ASCii）、字节序、流式传输"
    manual: ":WAVeform Commands > :WAVeform:SOURce; :WAVeform:FORMat; :WAVeform:BYTeorder; :WAVeform:STReaming"
    steps:
      - query: ":WAVeform:FORMat?"
        expect: "ASC"
      - query: ":WAVeform:BYTeorder?"
        expect: "MSBF"
      - send: ":WAVeform:SOURce CHANnel2;:WAVeform:FORMat WORD;:WAVeform:BYTeorder LSBFirst"
      - query: ":WAVeform:SOURce?"
        expect: "CHAN2"
      - query: ":WAVeform:FORMat?"
        expect: "WORD"
      - query: ":WAVeform:BYTeorder?"
        expect: "LSBF"
      - query: ":WAVeform:STReaming?"
        expect: "0"
      - send: ":WAVeform:STReaming ON"
      - query: ":WAVeform:STReaming?"
        expect: "1"
  - name: "前导：24 个字段，WORD 的 Y 增量为档位 / 8192"
    manual: ":WAVeform Commands > :WAVeform:PREamble? (Table 19)"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:ACQuire:POINts 1000;:WAVeform:FORMat WORD;:DIGitize CHANnel1"
      - query: ":WAVeform:PREamble?"
        expect_fields:
          - "2"
          - "1"
          - "1000"
          - "1"
          - "1.000000E-09"
          - {value: -4.995e-07, tolerance: 5.0e-10, format: "-d.ddddddE-dd"}
          - "0"
          - "1.220703E-05"
          - "0.000000E+00"
          - "0"
          - "2"
          - "1.000000E-06"
          - {value: -4.995e-07, tolerance: 5.0e-10, format: "-d.ddddddE-dd"}
          - "8.000000E-01"
          - "0.000000E+00"
          - "\"01 JAN 2024\""
          - "\"00:00:00:00\""
          - "\"UXR0334B:MY64280101\""
          - "0"
          - "100"
          - "2"
          - "1"
          - "3.300000E+10"
          - "0.000000E+00"
  - name: "前导的单项查询"
    manual: ":WAVeform Commands > :WAVeform:POINts?; :XINCrement?; :XORigin?; :XREFerence?; :YINCrement?; :YORigin?; :YREFerence?"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:CHANnel1:OFFSet 0.05;:ACQuire:POINts 1000;:WAVeform:FORMat BYTE;:DIGitize CHANnel1"
      - query: ":WAVeform:POINts?"
        expect: "1000"
      - query: ":WAVeform:XINCrement?"
        expect: "+1.00000E-09"
      # 触发点在两个样点之间：首点时间离 -5 格不到一个采样间隔（1 ns）。
      - query: ":WAVeform:XORigin?"
        expect_value: -5.0e-7
        tolerance: 1.0e-9
      - query: ":WAVeform:XREFerence?"
        expect: "0"
      - query: ":WAVeform:YINCrement?"
        expect: "+3.12500E-03"
      - query: ":WAVeform:YORigin?"
        expect: "+5.00000E-02"
      - query: ":WAVeform:YREFerence?"
        expect: "0"
  - name: ":WAVeform:DATA? 的 BYTE 定长块"
    manual: ":WAVeform Commands > :WAVeform:DATA? (Streaming Off)"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:ACQuire:POINts 1000;:WAVeform:FORMat BYTE;:DIGitize CHANnel1"
      - query: ":WAVeform:DATA?"
        binary: true
        expect_block: {header: "#41000", bytes: 1000}
  - name: ":WAVeform:DATA? 流式传输为 #0 不定长块"
    manual: ":WAVeform Commands > :WAVeform:DATA? (Streaming On); :WAVeform:STReaming"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:ACQuire:POINts 1000;:WAVeform:FORMat WORD;:WAVeform:STReaming ON;:DIGitize CHANnel1"
      - query: ":WAVeform:DATA?"
        binary: true
        expect_block: {indefinite: true, bytes: 2000}
  - name: ":WAVeform:DATA? 的 ASCii 数据不带块头"
    manual: ":WAVeform Commands > :WAVeform:DATA?; :WAVeform:FORMat (ASCii)"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:ACQuire:POINts 1000;:WAVeform:FORMat ASCii;:DIGitize CHANnel1"
      - query: ":WAVeform:DATA?"
        expect_fields: [{format: "~d.ddddE±dd"}, {format: "~d.ddddE±dd", count: 999}]
  - name: "自动测量：峰峰值、最大最小、幅度、顶底（10 MHz、400 mVpp 正弦）"
    manual: ":MEASure Commands > :MEASure:VPP; :VMAX; :VMIN; :VAMPlitude; :VTOP; :VBASe"
    steps:
      - send: ":CHANnel1:SCALe 0.1"
      # 峰峰含 0.1 V/div 档的噪声峰峰(specs.noise_per_division,#745)
      - query: ":MEASure:VPP? CHANnel1"
        expect_value: 0.4
        tolerance: 0.04
      - query: ":MEASure:VMAX? CHANnel1"
        expect_value: 0.2
        tolerance: 0.03
      - query: ":MEASure:VMIN? CHANnel1"
        expect_value: -0.2
        tolerance: 0.03
      - query: ":MEASure:VAMPlitude? CHANnel1"
        expect_value: 0.4
        tolerance: 0.03
      - query: ":MEASure:VTOP? CHANnel1"
        expect_value: 0.2
        tolerance: 0.02
      - query: ":MEASure:VBASe? CHANnel1"
        expect_value: -0.2
        tolerance: 0.02
  - name: "自动测量：平均值与有效值（整屏、含直流）；AC 与单周期未建模"
    manual: ":MEASure Commands > :MEASure:VAVerage; :MEASure:VRMS"
    steps:
      - send: ":CHANnel1:SCALe 0.1"
      - query: ":MEASure:VAVerage? DISPlay,CHANnel1"
        expect_value: 0.0
        tolerance: 0.01
      - query: ":MEASure:VRMS? DISPlay,DC,CHANnel1"
        expect_value: 0.1414
        tolerance: 0.005
      - query: ":MEASure:VRMS? DISPlay,DC,CHANnel1,VOLT"
        expect_value: 0.1414
        tolerance: 0.005
      - send: ":MEASure:VRMS? DISPlay,AC,CHANnel1"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
  - name: "带宽滤波的响应：平坦幅度截断截止以上的正弦，高斯幅度只衰减"
    manual: ":ACQuire Commands > :ACQuire:RESPonse; :ACQuire:BANDwidth; data sheet (bandwidth filters: brick wall)"
    steps:
      - query: ":ACQuire:RESPonse?"
        expect: "FLAT"
      # 120 MHz、400 mVpp 正弦经 100 MHz 带宽：砖墙截掉，高斯为 2^-(1.2^2/2) = 0.607 倍
      - send: ":SOURce1:FREQuency 1.2E8"
        instrument: awg
      - send: ":CHANnel1:SCALe 0.1;:ACQuire:BANDwidth 1E8"
      - query: ":MEASure:VPP? CHANnel1"
        # 滤波截断后的记录带这一档自己的噪声(specs.noise_per_division,#745)
        expect_value: 0.0
        tolerance: 0.05
      - send: ":ACQuire:RESPonse GAUSsianmag"
      - query: ":ACQuire:RESPonse?"
        expect: "GAUS"
      - query: ":MEASure:VPP? CHANnel1"
        # 衰减后的幅度上叠加这一档的噪声峰峰(#745)
        expect_value: 0.2428
        tolerance: 0.03
  - name: "通道带宽限制：砖墙、4 阶 Bessel、4 阶 Butterworth 对 10 MHz 正弦"
    manual: ":CHANnel<N> Commands > :CHANnel<N>:ISIM:BWLimit; :CHANnel<N>:ISIM:BANDwidth; :CHANnel<N>:ISIM:BWLimit:TYPE"
    steps:
      - query: ":CHANnel1:ISIM:BWLimit?"
        expect: "0"
      - query: ":CHANnel1:ISIM:BWLimit:TYPE?"
        expect: "WALL"
      # 400 mVpp、10 MHz 正弦经 8 MHz 的限制：砖墙截掉；Butterworth |H| = 1/sqrt(1+1.25^8) = 0.379；
      # 4 阶 Bessel 0.566
      - send: ":CHANnel1:SCALe 0.1;:CHANnel1:ISIM:BANDwidth 8E6;:CHANnel1:ISIM:BWLimit ON"
      - query: ":CHANnel1:ISIM:BANDwidth?"
        expect: "+8.00000E+06"
      - query: ":MEASure:VPP? CHANnel1"
        # 滤波截断后的记录带这一档自己的噪声(specs.noise_per_division,#745)
        expect_value: 0.0
        tolerance: 0.05
      - send: ":CHANnel1:ISIM:BWLimit:TYPE BUTTerworth"
      - query: ":CHANnel1:ISIM:BWLimit:TYPE?"
        expect: "BUTT"
      - query: ":MEASure:VPP? CHANnel1"
        expect_value: 0.1516
        tolerance: 0.03
      - send: ":CHANnel1:ISIM:BWLimit:TYPE BESSEL4"
      - query: ":MEASure:VPP? CHANnel1"
        expect_value: 0.2265
        tolerance: 0.03
      - send: ":CHANnel1:ISIM:BWLimit OFF"
      - query: ":MEASure:VPP? CHANnel1"
        # 峰峰含 0.1 V/div 档的噪声峰峰(#745)
        expect_value: 0.4
        tolerance: 0.04
      - send: ":CHANnel1:ISIM:BWLimit:TYPE BP10"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
