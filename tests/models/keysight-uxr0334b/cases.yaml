  - name: "FFT 的两峰差值测量与占用带宽（单音的差值为 0，OBW 是一个 bin 的量级）"
    manual: ":MEASure Commands > :MEASure:FFT:DFRequency, :DMAGnitude, :OBW"
    steps:
      - send: ":TIMebase:SCALe 1E-5"
      - send: ":FUNCtion4:FFTMagnitude CHANnel1"
      - query: ":MEASure:FFT:DFRequency? FUNCtion4,1,1,-30"
        expect: "+0.00000E+00"
      - query: ":MEASure:FFT:DMAGnitude? FUNCtion4,1,1,-30"
        expect: "+0.00000E+00"
      - query: ":MEASure:FFT:OBW? FUNCtion4,99"
        expect_fields: [{min: 0.0, max: 2.0e11, format: "±d.dddddE±0d"}]
  - name: "光标的兼容拼写与补充设置：TSTArt/TSTOp、VSTArt/VSTOp、X2Y2source、跟踪测量、编号光标的名称/颜色/色模式/Y 位置"
    manual: ":MARKer Commands > :MARKer:TSTArt, :TSTOp, :VSTArt, :VSTOp, :X2Y2source, :MEASurement:MEASurement, :MARKer<K>:NAME, :COLor, :CMODe, :Y:POSition"
    steps:
      - send: ":MARKer:MODE MEASurement"
      - send: ":MARKer:MEASurement:MEASurement MEASurement1"
      - query: ":MARKer:MEASurement:MEASurement?"
        expect: "MEAS1"
      - send: ":MARKer:VSTArt 0.1"
      - query: ":MARKer:Y1Position?"
        expect: "+1.00000E-01"
      - send: ":MARKer:VSTOp -0.1"
      - send: ":MARKer:MODE MANual"
      - query: ":MARKer:YDELta?"
        expect: "-2.00000E-01"
      - send: ":MARKer:MODE MANual;:MARKer:TSTArt 1e-6"
      - send: ":MARKer:TSTOp 3e-6"
      - query: ":MARKer:XDELta?"
        expect: "+2.00000E-06"
      - send: ":MARKer:X2Y2source CHANnel2"
      - query: ":MARKer:X2Y2source?"
        expect: "CHAN2"
      - send: ":MARKer5:NAME \"m5\""
      - query: ":MARKer5:NAME?"
        expect: "\"m5\""
      - send: ":MARKer5:CMODe CUSTom"
      - query: ":MARKer5:CMODe?"
        expect: "CUST"
      - send: ':MARKer5:COLor "#FF0000FF"'
      - query: ":MARKer5:COLor?"
        expect: "\"#FF0000FF\""
      - send: ":MARKer6:TYPE YMANual;:MARKer6:Y:POSition 0.05"
      - query: ":MARKer6:Y:POSition?"
        expect: "+5.00000E-02"
  - name: "分段存储：4 段采集后逐段取回，时间标签等间隔（段间隔 = 重布防 3.5 µs + 记录 1 µs）"
    manual: ":ACQuire Commands > :ACQuire:MODE; :ACQuire:SEGMented:COUNt; :ACQuire:SEGMented:INDex; :WAVeform:SEGMented:TTAG; data sheet (Min time between triggers 3.5 µs)"
    steps:
      - send: ":ACQuire:MODE SEGMented;:ACQuire:SEGMented:COUNt 4"
      - query: ":ACQuire:SEGMented:COUNt?"
        expect: "4"
      - send: ":ACQuire:POINts 1000;:DIGitize CHANnel1"
      - query: ":WAVeform:SEGMented:COUNt?"
        expect: "4"
      - query: ":WAVeform:POINts?"
        expect: "1000"
      # 逐段取回：INDex 选段，DATA? 回该段的 1000 点；段间隔 4.5 µs = 重布防 3.5 µs + 记录 1 µs
      # （10 MHz 正弦 100 ns 一周期，段间隔是 45 个整周期，各段等触发相位，时间标签等间隔）
      - send: ":ACQuire:SEGMented:INDex 1"
      - query: ":WAVeform:DATA?"
        expect_fields: [{format: "~d.ddddE±dd"}, {format: "~d.ddddE±dd", count: 999}]
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 0.0
        tolerance: 2e-8
      - send: ":ACQuire:SEGMented:INDex 2"
      - query: ":WAVeform:DATA?"
        expect_fields: [{format: "~d.ddddE±dd"}, {format: "~d.ddddE±dd", count: 999}]
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 4.5e-6
        tolerance: 2e-8
      - send: ":ACQuire:SEGMented:INDex 3"
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 9e-6
        tolerance: 2e-8
      - send: ":ACQuire:SEGMented:INDex 4"
      - query: ":WAVeform:DATA?"
        expect_fields: [{format: "~d.ddddE±dd"}, {format: "~d.ddddE±dd", count: 999}]
      - query: ":WAVeform:SEGMented:TTAG?"
        expect_value: 1.35e-5
        tolerance: 2e-8
      # 手册 p.345：越界报错并把所选段钳到最大段号
      - send: ":ACQuire:SEGMented:INDex 9"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
      - query: ":ACQuire:SEGMented:INDex?"
        expect: "4"
  - name: ":WAVeform:SEGMented:ALL ON：DATA? 回 4 段拼接，前导末尾多段数，XLISt 给各段的起点"
    manual: ":WAVeform Commands > :WAVeform:SEGMented:ALL; :WAVeform:SEGMented:POINts?; :WAVeform:SEGMented:XLISt?; :WAVeform:PREamble? (Table 19)"
    steps:
      - send: ":ACQuire:MODE SEGMented;:ACQuire:SEGMented:COUNt 4;:ACQuire:POINts 1000;:DIGitize CHANnel1"
      # OFF（默认）：只回所选段
      - query: ":WAVeform:SEGMented:POINts?"
        expect: "1000"
      - send: ":WAVeform:SEGMented:ALL ON"
      - query: ":WAVeform:SEGMented:ALL?"
        expect: "1"
      # 前导末尾多段数（手册表 19）：24 个常规字段（1 V/div：Y 增量 = 档位 / 8192）+ 段数 4
      - query: ":WAVeform:PREamble?"
        expect_fields:
          - "0"
          - "1"
          - "1000"
          - "1"
          - "1.000000E-09"
          - {value: -5.0e-07, tolerance: 1.0e-09, format: "-d.ddddddE-dd"}
          - "0"
          - "1.220703E-04"
          - "0.000000E+00"
          - "0"
          - "2"
          - "1.000000E-06"
          - {value: -5.0e-07, tolerance: 1.0e-09, format: "-d.ddddddE-dd"}
          - "8.000000E+00"
          - "0.000000E+00"
          - "\"01 JAN 2024\""
          - "\"00:00:00:00\""
          - "\"UXR0334B:MY64280101\""
          - "0"
          - "100"
          - "2"
          - "1"
          - "3.300000E+10"
          - "0.000000E+00"
          - "4"
      - query: ":WAVeform:DATA?"
        expect_fields: [{format: "~d.ddddE±dd"}, {format: "~d.ddddE±dd", count: 3999}]
      - query: ":WAVeform:SEGMented:POINts?"
        expect: "4000"
      # XLISt：RELX = 各段自己的 X origin（触发在中央：−5.00000E-07）；ABSX = relative origin +
      # time tag（手册原文）；TTAG 等间隔 4.5 µs；OFFSet = 各段在拼接记录里的起点（手册：ALL OFF 时回 0）
      - query: ":WAVeform:SEGMented:XLISt? RELXorigin"
        expect: "-5.0000E-07,-5.0000E-07,-5.0000E-07,-5.0000E-07"
      - query: ":WAVeform:SEGMented:XLISt? ABSXorigin"
        expect: "-5.0000E-07,4.0000E-06,8.5000E-06,1.3000E-05"
      - query: ":WAVeform:SEGMented:XLISt? TTAG"
        expect: "0.0000E+00,4.5000E-06,9.0000E-06,1.3500E-05"
      - query: ":WAVeform:SEGMented:XLISt? OFFSet"
        expect: "0.0000E+00,1.0000E+03,2.0000E+03,3.0000E+03"
      # 手册限定 XLISt 用 ASCii 或 BINary float64；本模型的 FORMat 无 BINary，WORD 报 -224
      - send: ":WAVeform:FORMat WORD"
      - send: ":WAVeform:SEGMented:XLISt? TTAG"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
      - send: ":WAVeform:FORMat ASCii;:WAVeform:SEGMented:ALL OFF"
      - query: ":WAVeform:SEGMented:XLISt? OFFSet"
        expect: "0.0000E+00,0.0000E+00,0.0000E+00,0.0000E+00"
  - name: "波形传输的状态查询：TYPE/COUNt 随平均变化，COMPlete 完成即 100，COUPling 恒 DC，BANDpass 跟滤波"
    manual: ":WAVeform Commands > :WAVeform:TYPE?; :WAVeform:COUNt?; :WAVeform:COMPlete?; :WAVeform:COUPling?; :WAVeform:BANDpass?"
    steps:
      - send: ":ACQuire:POINts 1000;:DIGitize CHANnel1"
      - query: ":WAVeform:TYPE?"
        expect: "RAW"
      - query: ":WAVeform:COUNt?"
        expect: "1"
      - query: ":WAVeform:COMPlete?"
        expect: "100"
      - query: ":WAVeform:COUPling?"
        expect: "DC"
      # 上限 = 数字滤波的 :ACQuire:BANDwidth（硬件 33 GHz）
      - query: ":WAVeform:BANDpass?"
        expect: "0.000000E+00,3.300000E+10"
      - send: ":ACQuire:BANDwidth 1E9"
      - query: ":WAVeform:BANDpass?"
        expect: "0.000000E+00,1.000000E+09"
      - send: ":ACQuire:BANDwidth MAX;:ACQuire:AVERage ON;:ACQuire:AVERage:COUNt 8;:DIGitize CHANnel1"
      - query: ":WAVeform:TYPE?"
        expect: "AVER"
      - query: ":WAVeform:COUNt?"
        expect: "8"
      - send: ":ACQuire:AVERage OFF"
      - query: ":WAVeform:TYPE?"
        expect: "RAW"
  - name: "显示四值与单位：左沿 = 记录起点、跨度 = 时基 10 格、中心 = 偏置、满幅 = 8 格；变换函数 HERTz"
    manual: ":WAVeform Commands > :WAVeform:XDISplay?; :XRANge?; :YDISplay?; :YRANge?; :XUNits?; :YUNits?"
    steps:
      - send: ":CHANnel1:SCALe 0.1;:CHANnel1:OFFSet 0.05;:ACQuire:POINts 1000;:DIGitize CHANnel1"
      # 触发在中央（参考 CENTer）：记录起点 = −5.00000E-07；跨度 = 10 格 × 100 ns/div
      - query: ":WAVeform:XDISplay?"
        expect: "-5.00000E-07"
      - query: ":WAVeform:XRANge?"
        expect: "+1.00000E-06"
      - query: ":WAVeform:YDISplay?"
        expect: "+5.00000E-02"
      # 8 格 × 0.1 V/div
      - query: ":WAVeform:YRANge?"
        expect: "+8.00000E-01"
      - query: ":WAVeform:XUNits?"
        expect: "SECond"
      - query: ":WAVeform:YUNits?"
        expect: "VOLT"
      # 变换函数：X 轴 HERTz；Y 按垂直单位（DB → DECibels，VRMS → VOLT）；相位在手册的单位表里
      # 没有词，回 UNKNown；其余算子仍是时间与电压
      - send: ":FUNCtion1:FFTMagnitude CHANnel1;:WAVeform:SOURce FUNCtion1"
      - query: ":WAVeform:XUNits?"
        expect: "HERTz"
      - query: ":WAVeform:YUNits?"
        expect: "DECibels"
      - send: ":FUNCtion1:FFT:VUNits VRMS"
      - query: ":WAVeform:YUNits?"
        expect: "VOLT"
      - send: ":FUNCtion1:FFTPhase CHANnel1"
      - query: ":WAVeform:XUNits?"
        expect: "HERTz"
      - query: ":WAVeform:YUNits?"
        expect: "UNKNown"
      - send: ":FUNCtion1:ADD CHANnel1,CHANnel2"
      - query: ":WAVeform:XUNits?"
        expect: "SECond"
      - query: ":WAVeform:YUNits?"
        expect: "VOLT"
  - name: ":WAVeform:VIEW 与分段回放设置：ALL/MAIN 同一数据，WINDow/CGRade 报 -224，回放设置存取"
    manual: ":WAVeform Commands > :WAVeform:VIEW; :ACQuire Commands > :ACQuire:SEGMented:AUToplay; :PLAY; :PRATe; :TTAGs"
    steps:
      - query: ":WAVeform:VIEW?"
        expect: "ALL"
      # 记录恒覆盖主时基（存储深度与时基联动），ALL 与 MAIN 取同一数据
      - send: ":WAVeform:VIEW MAIN"
      - query: ":WAVeform:VIEW?"
        expect: "MAIN"
      - send: ":WAVeform:SOURce CHANnel1;:ACQuire:POINts 1000;:DIGitize CHANnel1"
      - query: ":WAVeform:POINts?"
        expect: "1000"
      - send: ":WAVeform:VIEW WINDow"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
      - send: ":WAVeform:VIEW CGRade"
      - query: ":SYSTem:ERRor?"
        expect: "-224"
      - send: ":WAVeform:VIEW ALL"
      # 回放设置：AUToplay/PLAY 开关、PRATe 每段 0.001–1 s、TTAGs 开关；模型的回放是瞬时的，
      # 查询回保存的状态（覆盖表注明）
      - send: ":ACQuire:SEGMented:AUToplay ON;:ACQuire:SEGMented:PLAY ON;:ACQuire:SEGMented:PRATe 0.25;:ACQuire:SEGMented:TTAGs ON"
      - query: ":ACQuire:SEGMented:AUToplay?"
        expect: "1"
      - query: ":ACQuire:SEGMented:PLAY?"
        expect: "1"
      - query: ":ACQuire:SEGMented:PRATe?"
        expect: "+2.50000E-01"
      - query: ":ACQuire:SEGMented:TTAGs?"
        expect: "1"
      - send: ":ACQuire:SEGMented:PRATe 2"
      - query: ":SYSTem:ERRor?"
        expect: "-222"
