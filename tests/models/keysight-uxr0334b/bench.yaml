schema: simubench.bench/2
name: uxr0334b_cases
description: >-
  Keysight 33622A 的 CH1（10 MHz、400 mVpp 正弦）与 CH2（1 MHz、400 mVpp 方波）接 UXR0334B 的 CH1、CH2
  （50 Ω 输入，发生器负载设定 50 Ω），供手册用例使用。
instruments:
  awg:
    model: keysight-33622a
    state:
      ch1.frequency: 1.0e7
      ch1.amplitude: 0.4
      ch1.output: true
      ch2.function: SQUare
      ch2.frequency: 1.0e6
      ch2.amplitude: 0.4
      ch2.output: true
  scope:
    model: keysight-uxr0334b
wires:
  - {from: awg.CH1, to: scope.CH1}
  - {from: awg.CH2, to: scope.CH2}
run: {seed: 1, clock: command, idle: "off"}
