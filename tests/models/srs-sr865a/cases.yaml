# SRS SR865A 的手册用例（#333）：SR865A Operation Manual（Revision 2.11，文档号 9-01715-903）
# 第 4 章 Programming 的命令条目与示例，第 3 章 Standard Settings 给出 *RST 的值。每条用例都在
# 刚上电的 examples/benches/srs-sr865a.bench.yaml 上运行（SINE_OUT → 1 kΩ/100 nF RC → SIG_IN，
# AUX_OUT2 → AUX_IN2；内部参考 1 kHz、0.5 Vrms，时间常数 100 ms，上电即稳态）。RC 后的
# X ≈ 0.348158 V、Y ≈ −0.229489 V、R ≈ 0.416988 V、θ ≈ −33.391°（含输入的 10 MΩ ∥ 25 pF）。
# 枚举参数可写序号或词（大写部分或全写），查询回序号；数值应答为 %g 格式。
model: srs-sr865a
bench: ../../../examples/benches/srs-sr865a.bench.yaml
instrument: lia
cases:
  - name: "*IDN? 按手册的格式返回厂商、型号、序列号与固件"
    manual: "Interface Commands > *IDN?：Stanford_Research_Systems,SR865A,000111,v1.23"
    steps:
      - query: "*IDN?"
        expect: "Stanford_Research_Systems,SR865A,003210,v1.55"
      - query: "*TST?"
        expect: "0"
      - query: "*OPC?"
        expect: "1"

  - name: "*RST 恢复 Standard Settings"
    manual: "Interface Commands > *RST；Chapter 3 > Standard Settings（p.64）"
    steps:
      - send: "*RST"
      - query: "PHAS?"
        expect: "0"
      - query: "RSRC?"
        expect: "0"
      - query: "FREQ?"
        expect: "100000"
      - query: "HARM?"
        expect: "1"
      - query: "RTRG?"
        expect: "0"
      - query: "REFZ?"
        expect: "0"
      - query: "TBMODE?"
        expect: "0"
      - query: "IVMD?"
        expect: "0"
      - query: "ISRC?"
        expect: "0"
      - query: "ICPL?"
        expect: "0"
      - query: "IGND?"
        expect: "0"
      - query: "ICUR?"
        expect: "0"
      - query: "IRNG?"
        expect: "0"
      - query: "OFLT?"
        expect: "10"
      - query: "OFSL?"
        expect: "0"
      - query: "ADVFILT?"
        expect: "1"
      - query: "SYNC?"
        expect: "0"
      - query: "SCAL?"
        expect: "0"
      - query: "COUT? OCH1"
        expect: "0"
      - query: "COUT? OCH2"
        expect: "0"
      - query: "CEXP? X"
        expect: "0"
      - query: "COFA? R"
        expect: "0"
      - query: "AUXV? 0"
        expect: "0"
      - query: "CDSP? DAT1"
        expect: "0"
      - query: "CDSP? DAT4"
        expect: "3"
      - query: "CGRF? DAT3"
        expect: "1"
      - query: "DLAY?"
        expect: "0"
      - query: "DBLK?"
        expect: "0"
      - query: "BLAZEX?"
        expect: "0"
      - query: "KEYC?"
        expect: "0"

  - name: "参考：频率带单位、相位带单位（含弧度）、谐波与参考源"
    manual: "Reference Commands > FREQ / FREQINT / FREQDET? / PHAS / HARM / RSRC / RTRG / REFZ / TBMODE / TBSTAT?"
    steps:
      - send: "FREQ 12.34 KHZ"
      - query: "FREQ?"
        expect: "12340"
      - send: "FREQINT 12.34E3"
      - query: "FREQINT?"
        expect: "12340"
      - send: "FREQ 1000"
      - send: "PHAS 12340 MDEG"
      - query: "PHAS?"
        expect: "12.34"
      - send: "PHAS 1 RAD"
      - query: "PHAS?"
        expect: "57.295779513"
      - send: "PHAS 0"
      - send: "HARM 2"
      - query: "HARM?"
        expect: "2"
      - query: "FREQDET?"
        expect: "2000"
      - query: "FREQEXT?"
        expect: "1000"
      - send: "HARM 1"
      - send: "RSRC EXT"
      - query: "RSRC?"
        expect: "1"
      - send: "RSRC 0"
      - query: "RSRC?"
        expect: "0"
      - send: "RTRG POSTTL"
      - query: "RTRG?"
        expect: "1"
      - send: "RTRG NEG"
      - query: "RTRG?"
        expect: "2"
      - send: "REFZ 1MEG"
      - query: "REFZ?"
        expect: "1"
      - send: "REFZ 50"
      - query: "REFZ?"
        expect: "0"
      - send: "TBMODE INTERNAL"
      - query: "TBMODE?"
        expect: "1"
      - query: "TBSTAT?"
        expect: "1"
      - send: "FREQ 5 MHZ"
      - query: "ERRS?"
        expect: "0"
      - query: "*ESR? 4"
        expect: "1"
      - query: "FREQ?"
        expect: "1000"

  - name: "正弦输出幅度带单位；双参考与斩波器未建模"
    manual: "Reference Commands > SLVL / RSRC（DUAL、CHOP）"
    steps:
      - send: "SLVL 12.3 MV"
      - query: "SLVL?"
        expect: "0.0123"
      - send: "SLVL 0.5"
      - query: "SLVL?"
        expect: "0.5"
      - send: "SLVL 3"
      - query: "*ESR? 4"
        expect: "1"
      - send: "RSRC DUAL"
      - query: "*ESR? 4"
        expect: "1"
      - query: "RSRC?"
        expect: "0"

  - name: "输入：方式、A−B、耦合、接地、量程与电流增益，按序号或词"
    manual: "Signal Commands > IVMD / ISRC / ICPL / IGND / IRNG / ICUR"
    steps:
      - send: "ISRC A-B"
      - query: "ISRC?"
        expect: "1"
      - send: "ISRC 0"
      - send: "ICPL DC"
      - query: "ICPL?"
        expect: "1"
      - send: "ICPL AC"
      - send: "IGND GROUND"
      - query: "IGND?"
        expect: "1"
      - send: "IGND FLO"
      - send: "IRNG 300MVOLT"
      - query: "IRNG?"
        expect: "1"
      - send: "IRNG 1V"
      - query: "IRNG?"
        expect: "0"
      - send: "ICUR 100MEG"
      - query: "ICUR?"
        expect: "1"
      - send: "ICUR 0"
      - send: "IVMD CURR"
      - query: "IVMD?"
        expect: "1"
      - send: "IVMD VOLTAGE"
      - query: "IVMD?"
        expect: "0"
      - send: "IRNG 5"
      - query: "*ESR? 4"
        expect: "1"

  - name: "灵敏度、时间常数、斜率与 ENBW?；同步滤波与关闭高级滤波未建模"
    manual: "Signal Commands > SCAL / OFLT / OFSL / ENBW? / SYNC / ADVFILT"
    steps:
      - send: "SCAL 6"
      - query: "SCAL?"
        expect: "6"
      - send: "SCAL 0"
      - query: "ENBW?"
        expect: "2.5"
      - send: "OFSL 1"
      - query: "OFSL?"
        expect: "1"
      - query: "ENBW?"
        expect: "1.25"
      - send: "OFSL 0"
      - send: "OFLT 12"
      - query: "OFLT?"
        expect: "12"
      - query: "ENBW?"
        expect: "0.25"
      - send: "OFLT 10"
      - send: "OFLT 22"
      - query: "*ESR? 4"
        expect: "1"
      - send: "SYNC OFF"
      - query: "SYNC?"
        expect: "0"
      - send: "SYNC ON"
      - query: "*ESR? 4"
        expect: "1"
      - send: "ADVFILT OFF"
      - query: "*ESR? 4"
        expect: "1"
      - query: "ADVFILT?"
        expect: "1"

  - name: "读数：OUTP? 按序号与词、SNAP? 同一时刻、SNAPD? 与 OUTR?"
    manual: "Data Transfer Commands > OUTP? / SNAP? / SNAPD? / OUTR?"
    steps:
      - query: "OUTP? 0"
        expect_value: 0.348158
        tolerance: 2.0e-6
      - query: "OUTP? X"
        expect_value: 0.348158
        tolerance: 2.0e-6
      - query: "OUTP? Y"
        expect_value: -0.229489
        tolerance: 2.0e-6
      - query: "OUTP? R"
        expect_value: 0.416988
        tolerance: 2.0e-6
      - query: "OUTP? THETA"
        expect_value: -33.3909
        tolerance: 1.0e-3
      - query: "OUTP? TH"
        expect_value: -33.3909
        tolerance: 1.0e-3
      - query: "SNAP? 0,1"
        expect_match: '^0\.348\d+,-0\.229\d+$'
      - query: "SNAP? X, Y, R"
        expect_match: '^0\.348\d+,-0\.229\d+,0\.416\d+$'
      - query: "SNAPD?"
        expect_match: '^0\.348\d+,-0\.229\d+,0\.416\d+,-33\.39\d+$'
      - query: "OUTR? DAT3"
        expect_value: 0.416988
        tolerance: 2.0e-6
      - query: "OUTR? 1"
        expect_value: -0.229489
        tolerance: 2.0e-6
      - query: "OUTP? SAMP"
        expect: "0.5"
      - query: "OUTP? FINT"
        expect: "1000"
      - query: "OUTP? PHA"
        expect: "0"
      - query: "OUTP? LEV"
        expect: "0"
      - send: "SNAP? 0"
      - query: "*ESR? 5"
        expect: "1"
      - send: "OUTP? 17"
      - query: "*ESR? 4"
        expect: "1"

  - name: "数据通道指派：CDSP 按序号或词，SNAPD? 随之改变"
    manual: "Display Commands > CDSP；Data Transfer Commands > SNAPD?"
    steps:
      - send: "CDSP DAT1, SAM"
      - query: "CDSP? DAT1"
        expect: "13"
      - query: "CDSP? 0"
        expect: "13"
      - send: "CDSP 3, 15"
      - query: "CDSP? DAT4"
        expect: "15"
      - query: "SNAPD?"
        expect_match: '^0\.5,-0\.229\d+,0\.416\d+,1000$'
      - query: "OUTR? DAT1"
        expect: "0.5"
      - send: "CDSP DAT1, X"
      - send: "CDSP DAT4, THeta"
      - send: "CGRF DAT2, OFF"
      - query: "CGRF? 1"
        expect: "0"

  - name: "输出：扩展、偏置开关与百分数（R 的偏置只作用于显示）"
    manual: "CH1/CH2 Output Commands > COUT / CEXP / COFA / COFP"
    steps:
      - send: "COUT OCH2, RTHeta"
      - query: "COUT? OCH2"
        expect: "1"
      - query: "COUT? 1"
        expect: "1"
      - send: "COUT 1, XY"
      - send: "COFP X, 10"
      - query: "COFP? X"
        expect: "10"
      - query: "OUTP? X"
        expect_value: 0.348158
        tolerance: 2.0e-6
      - send: "COFA X, ON"
      - query: "COFA? 0"
        expect: "1"
      - query: "OUTP? X"
        expect_value: 0.248158
        tolerance: 2.0e-6
      - send: "CEXP X, X10"
      - query: "CEXP? X"
        expect: "1"
      - query: "OUTP? X"
        expect_value: 2.48158
        tolerance: 2.0e-5
      - send: "COFA X, OFF;CEXP X, OFF"
      - query: "OUTP? X"
        expect_value: 0.348158
        tolerance: 2.0e-6

  - name: "AUX 输出与输入：AUX_OUT2 → AUX_IN2，OUTP? 的 IN2/OUT2"
    manual: "Aux Input and Output Commands > AUXV / OAUX?；Data Transfer Commands > OUTP?（IN1–4、OUT1–2）"
    steps:
      - send: "AUXV 1, 678.9 MV"
      - query: "AUXV? 1"
        expect: "0.6789"
      - query: "OAUX? 1"
        expect_value: 0.678222
        tolerance: 1.0e-5
      - query: "OUTP? IN2"
        expect_value: 0.678222
        tolerance: 1.0e-5
      - query: "OUTP? OUT2"
        expect: "0.6789"
      - query: "OAUX? 0"
        expect: "0"
      - send: "AUXV 2, 11"
      - query: "*ESR? 4"
        expect: "1"

  - name: "自动相位把参考相位设为当前 θ（输出要若干时间常数后才到 0，见 tests/test_srs_sr865a.py）"
    manual: "Auto Function Commands > APHS"
    steps:
      - send: "APHS"
      - query: "PHAS?"
        expect_value: -33.3909
        tolerance: 1.0e-3

  - name: "状态：*ESE/*ESR/*SRE/*STB 的按位读写、ERRE/ERRS、LIAE/LIAS、CUROVLDSTAT?"
    manual: "Status Reporting Commands > *CLS / *ESE / *ESR? / *SRE / *STB? / *PSC / ERRE / ERRS? / LIAE / LIAS? / CUROVLDSTAT?"
    steps:
      - send: "*CLS"
      - send: "*ESE 17"
      - query: "*ESE?"
        expect: "17"
      - send: "*ESE 4, 1"
      - query: "*ESE? 4"
        expect: "1"
      - send: "*SRE 8"
      - query: "*SRE?"
        expect: "8"
      - query: "*STB?"
        expect: "0"
      - send: "ERRE 48"
      - query: "ERRE?"
        expect: "48"
      - query: "ERRS?"
        expect: "0"
      - send: "LIAE 257"
      - query: "LIAE?"
        expect: "257"
      - query: "LIAE? 8"
        expect: "1"
      - query: "CUROVLDSTAT?"
        expect: "0"
      - send: "SCAL 27"
      - query: "CUROVLDSTAT?"
        expect: "1"
      - query: "LIAS? 0"
        expect: "1"
      - query: "LIAS? 0"
        expect: "0"
      - send: "*PSC 0"
      - query: "*PSC?"
        expect: "0"
      - send: "*OPC"
      - query: "*ESR? 0"
        expect: "1"

  - name: "显示、系统与接口类命令保存并回读（不影响测量）"
    manual: "Display Commands > DBLK / DLAY；System Commands > BLAZEX / KEYC；Interface Commands > LOCL / OVRM"
    steps:
      - send: "DBLK ON"
      - query: "DBLK?"
        expect: "1"
      - send: "DLAY HIST"
      - query: "DLAY?"
        expect: "1"
      - send: "BLAZEX UNISYNC"
      - query: "BLAZEX?"
        expect: "2"
      - send: "KEYC MUTE"
      - query: "KEYC?"
        expect: "1"
      - send: "LOCL 1"
      - query: "LOCL?"
        expect: "1"
      - send: "OVRM 0"
      - query: "OVRM?"
        expect: "0"

  - name: "未实现的命令按真实型号规则记 -113 事件（置 CMD 位）"
    manual: "docs/real-models.md 2；Status Byte Definitions > Standard Event Status Byte bit 5 CMD"
    steps:
      - send: "HARMDUAL 2"
      - query: "*ESR? 5"
        expect: "1"
      - send: "STREAM ON"
      - query: "*ESR? 5"
        expect: "1"
      - send: "SCNRUN"
      - query: "*ESR? 5"
        expect: "1"

  - name: "数据捕获：配置、速率、单次捕获的状态、字节数与读出"
    manual: "Data Capture Commands > CAPTURELEN / CAPTURECFG / CAPTURERATE / CAPTURESTART / CAPTURESTOP / CAPTURESTAT? / CAPTUREBYTES? / CAPTUREPROG? / CAPTUREVAL? / CAPTUREGET?"
    steps:
      - query: "CAPTURELEN?"
        expect: "256"
      - send: "CAPTURELEN 2"
      - query: "CAPTURELEN?"
        expect: "2"
      - send: "CAPTURECFG XY"
      - query: "CAPTURECFG?"
        expect: "1"
      - query: "CAPTURERATE?"
        expect: "2441.40625"
      - send: "CAPTURERATE 4"
      - query: "CAPTURERATE?"
        expect: "152.58789062"
      - query: "CAPTURESTAT?"
        expect: "0"
      - send: "CAPTURESTART ONE, IMM"
      - query: "CAPTURESTAT?"
        expect: "3"
      - query: "CAPTUREBYTES?"
        expect: "8"
      - query: "CAPTUREVAL? 0"
        expect_match: '^0\.348\d+,-0\.229\d+$'
      - query: "CAPTUREVAL? 255"
        expect: "0,0"
      - send: "CAPTURESTOP"
      - query: "CAPTURESTAT?"
        expect: "2"
      - query: "CAPTUREPROG?"
        expect: "2"
      - query: "CAPTUREGET? 0,1"
        binary: true
        expect_match: '^#41024[\s\S]{1024}\n$'
      - send: "CAPTURESTART CONT, TRIG"
      - query: "*ESR? 4"
        expect: "1"

  - name: "SOFF：正弦输出直流电平 −5…+5 V，OUTP? LEVel 回读，越界置 EXE，*RST 回 0（#407）"
    manual: "Reference Commands > SOFF(?)（p.109–110：rounded to 3 digits or 0.1 mV，−5.00 V to +5.00 V）；OUTP? LEVel"
    steps:
      - query: "SOFF?"
        expect: "0"
      - send: "SOFF 34.5 MV"
      - query: "SOFF?"
        expect: "0.0345"
      - query: "OUTP? LEVel"
        expect: "0.0345"
      - send: "SOFF -5"
      - query: "SOFF?"
        expect: "-5"
      - send: "SOFF 6"
      - query: "*ESR? 4"
        expect: "1"
      - query: "SOFF?"
        expect: "-5"
      - send: "*RST"
      - query: "SOFF?"
        expect: "0"

  - name: "REFM：直流方式共模/差分，词或数（#407）"
    manual: "Reference Commands > REFM(?) { COMmon | DIFference | i }（p.110）"
    steps:
      - query: "REFM?"
        expect: "0"
      - send: "REFM DIF"
      - query: "REFM?"
        expect: "1"
      - send: "REFM COMMON"
      - query: "REFM?"
        expect: "0"
      - send: "REFM 1"
      - query: "REFM?"
        expect: "1"

