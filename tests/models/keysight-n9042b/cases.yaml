# N9042B 的手册用例：命令、参数、预置值与回复格式按 *X-Series Signal Analyzer Spectrum Analyzer
# Mode User's & Programmer's Reference*（N9060-90027, August 2014；页码以 PDF 为准），频率选件 526。
# 测试台 examples/benches/keysight-n9042b.bench.yaml：R&S SMA100B 的 5.8 GHz、-10 dBm 连续波接到
# RF_IN。每个用例在一个刚上电的测试台上运行；数值查询用容差，格式与枚举用精确回复。
# 测试台是示例测试台加一台输出关闭的 SMA100B（tests/models/keysight-n9042b/bench.yaml），供末尾的前端
# 用例（#960，N9042B Data Sheet 3121-1037.EN，标准路径 1a）使用。噪声读数的容差：采样检波、对数平均
# 100 次的一个迹线点，σ = 5.57 dB / √100 = 0.56 dB，取 4σ = 2.2 dB。
model: keysight-n9042b
bench: bench.yaml
instrument: sa
cases:
  - name: "身份与公共命令：*IDN? 四字段、*OPT?、*TST?、状态寄存器、错误队列"
    manual: "3 Programming the Analyzer > IEEE 488.2 Common Commands > *IDN? (p.220) / *OPT? (p.222) / *RST (p.223) / *TST? (p.224) / *CLS / *ESE / *ESR / *SRE / *STB / *OPC / *WAI; SYSTem:ERRor"
    steps:
      - query: "*IDN?"
        expect: "Keysight Technologies,N9042B,MY00000001,A.25.05"
      - query: "*OPT?"
        expect: "526"
      - query: "*TST?"
        expect: "0"
      - query: "*OPC?"
        expect: "1"
      - send: "*ESE 36"
      - query: "*ESE?"
        expect: "36"
      - send: "*SRE 16"
      - query: "*SRE?"
        expect: "16"
      - query: "*ESR?"
        expect: "0"
      - query: "*STB?"
        expect: "0"
      - send: "*WAI"
      - send: ":FREQ:SPAN 0"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: "*CLS"
      - query: ":SYST:ERR?"
        expect: '+0,"No error"'

  - name: "上电与预置：选件 526 的全跨度（中心 13.255 GHz、止 26.5 GHz）、RBW 3 MHz、衰减 10 dB、检波器自动 Normal、连续扫描"
    manual: "8 Swept SA Measurement > FREQ Channel > Center Frequency Presets (p.601); BW > Res BW (p.584); AMPTD > Attenuation (p.550); Trace/Detector (p.913); Sweep/Control > Cont (p.594)"
    steps:
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"
      - query: ":FREQ:STAR?"
        expect: "+1.00000000E+007"
      - query: ":FREQ:STOP?"
        expect: "+2.65000000E+010"
      - query: ":BAND?"
        expect: "+3.00000000E+006"
      - query: ":BAND:VID?"
        expect: "+3.00000000E+006"
      - query: ":POW:ATT?"
        expect: "+1.00000000E+001"
      - query: ":POW:ATT:AUTO?"
        expect: "1"
      - query: ":DISP:WIND:TRAC:Y:RLEV?"
        expect: "+0.00000000E+000"
      - query: ":DET:TRAC?"
        expect: "NORM"
      - query: ":DET:TRAC:AUTO?"
        expect: "1"
      - query: ":TRAC:TYPE?"
        expect: "WRIT"
      - query: ":SWE:POIN?"
        expect: "1001"
      - query: ":AVER:COUN?"
        expect: "100"
      - query: ":INIT:CONT?"
        expect: "1"
      - query: ":CALC:MARK:MODE?"
        expect: "OFF"

  - name: "*RST 与 :SYSTem:PRESet：同一预置，但 *RST 置 INIT:CONT OFF、SYST:PRES 置 ON"
    manual: "8 Swept SA Measurement > Sweep/Control > Cont (p.594: SYST:PRESet sets INIT:CONT to ON but *RST sets INIT:CONT to OFF); System > Preset (p.722)"
    steps:
      - send: ":FREQ:CENT 1 GHz"
      - send: "*RST"
      - query: ":INIT:CONT?"
        expect: "0"
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"
      - send: ":FREQ:CENT 1 GHz"
      - send: ":SYST:PRES"
      - query: ":INIT:CONT?"
        expect: "1"
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"

  - name: "频率：中心/跨度/起止；上限 27 GHz，超出报 -222；中心放不进跨度时缩跨度"
    manual: "8 Swept SA Measurement > FREQ Channel > Center Freq (p.600) / Start Freq (p.605) / Stop Freq; SPAN X Scale > Span (p.836)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - query: ":FREQ:CENT?"
        expect: "+5.80000000E+009"
      - query: ":FREQ:SPAN?"
        expect: "+1.16000000E+010"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":FREQ:STAR?"
        expect: "+5.79950000E+009"
      - query: ":FREQ:STOP?"
        expect: "+5.80050000E+009"
      - send: ":FREQ:STOP 26.5 GHz"
      - send: ":FREQ:STAR 20 GHz"
      - query: ":FREQ:CENT?"
        expect: "+2.32500000E+010"
      - query: ":FREQ:SPAN?"
        expect: "+6.50000000E+009"
      - send: ":FREQ:STOP 28 GHz"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SENS:FREQ:CENT:STEP 10 MHz"
      - query: ":FREQ:CENT:STEP?"
        expect: "+1.00000000E+007"
      - send: ":FREQ:CENT:STEP:AUTO ON"
      - query: ":FREQ:CENT:STEP:AUTO?"
        expect: "1"

  - name: "RBW：自动 span/106 取最近档（约 10% 步进）、手动 1 Hz–8 MHz 取最近档且平分时向上、BANDwidth 与 BWIDth 两种写法"
    manual: "8 Swept SA Measurement > BW > Res BW (p.583–584: nearest available RBW, rounding up; max 8 MHz) / Span:3 dB RBW (p.586: 106:1)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":BAND?"
        expect: "+9.10000000E+003"
      - query: ":BWID:AUTO?"
        expect: "1"
      - send: ":BAND 4.5 MHz"
      - query: ":BAND?"
        expect: "+5.00000000E+006"
      - query: ":BAND:AUTO?"
        expect: "0"
      - send: ":BWID 1.04 kHz"
      - query: ":BWID?"
        expect: "+1.00000000E+003"
      - send: ":BAND 9 MHz"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":BWID:AUTO ON"
      - query: ":BAND?"
        expect: "+9.10000000E+003"

  - name: "VBW：自动跟随 RBW；手动取最近档，50 MHz 为全开"
    manual: "8 Swept SA Measurement > BW > Video BW (p.585: 1 Hz to 8 MHz in approximately 10% steps, plus 50 MHz)"
    steps:
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":BAND:VID?"
        expect: "+9.10000000E+003"
      - query: ":BAND:VID:AUTO?"
        expect: "1"
      - send: ":BAND:VID 40 MHz"
      - query: ":BAND:VID?"
        expect: "+5.00000000E+007"
      - query: ":BWID:VID:AUTO?"
        expect: "0"
      - send: ":BWID:VID 300 Hz"
      - query: ":BWID:VID?"
        expect: "+3.00000000E+002"
      - send: ":BAND:VID:AUTO ON"
      - query: ":BAND:VID?"
        expect: "+9.10000000E+003"

  - name: "扫描时间：自动随 RBW/VBW；手动 1 ms–4000 s、超出报 -222；扫描点数 1–40001"
    manual: "8 Swept SA Measurement > Sweep/Control > Sweep Time (p.845–846) / Points (p.897)"
    steps:
      - query: ":SWE:TIME:AUTO?"
        expect: "1"
      - send: ":SWE:TIME 2"
      - query: ":SWE:TIME?"
        expect: "+2.00000000E+000"
      - query: ":SWE:TIME:AUTO?"
        expect: "0"
      - send: ":SWE:TIME 5000"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SWE:TIME:AUTO ON"
      - query: ":SWE:TIME:AUTO?"
        expect: "1"
      - send: ":SWE:POIN 5001"
      - query: ":SWE:POIN?"
        expect: "5001"
      - send: ":SWE:POIN 40002"
      - query: ":SYST:ERR?"
        expect_prefix: "-222,"

  - name: "幅度：参考电平与自动衰减（参考电平 +10 dBm → 20 dB）、手动 2 dB 步进、单位只有 dBm"
    manual: "8 Swept SA Measurement > AMPTD Y Scale > Ref Level (p.547) / Attenuation (p.550) / Y Axis Unit (p.567)"
    steps:
      - send: ":DISP:WIND:TRAC:Y:RLEV 10 dBm"
      - query: ":DISP:WIND1:TRAC:Y:SCAL:RLEV?"
        expect: "+1.00000000E+001"
      - query: ":POW:ATT?"
        expect: "+2.00000000E+001"
      - send: ":POW:ATT 15"
      - query: ":POW:ATT?"
        expect: "+1.60000000E+001"
      - query: ":POW:ATT:AUTO?"
        expect: "0"
      - send: ":POW:ATT:AUTO ON"
      - query: ":POW:ATT?"
        expect: "+2.00000000E+001"
      - query: ":UNIT:POW?"
        expect: "DBM"
      - send: ":UNIT:POW V"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"

  - name: "检波器：手动选择关闭自动；自动按迹线类型（最大保持 → 正峰、最小保持 → 负峰）；平均检波器未建模"
    manual: "8 Swept SA Measurement > Trace/Detector > Detector (p.912–913) / Auto (p.916) / Normal (p.916)"
    steps:
      - send: ":DET:TRAC1 SAMP"
      - query: ":DET:TRAC?"
        expect: "SAMP"
      - query: ":DET:TRAC:AUTO?"
        expect: "0"
      - send: ":DET:TRAC:AUTO ON"
      - send: ":TRAC:TYPE MAXH"
      - query: ":DET:TRAC?"
        expect: "POS"
      - send: ":TRAC1:TYPE MINH"
      - query: ":DET:TRAC?"
        expect: "NEG"
      - send: ":DET NEG"
      - query: ":DET?"
        expect: "NEG"
      - query: ":DET:AUTO?"
        expect: "0"
      - send: ":DET:AUTO ON"
      - query: ":DET:AUTO?"
        expect: "1"
      - send: ":DET:TRAC AVER"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":DET:TRAC2 SAMP"
      - query: ":SYST:ERR?"
        expect_prefix: "-114,"

  - name: "迹线类型与平均：WRITe/AVERage/MAXHold/MINHold、平均次数 1–10000、平均类型只有 LOG"
    manual: "8 Swept SA Measurement > Trace/Detector > Trace Type (p.901); Meas Setup > Average/Hold Number (p.676) / Average Type (p.677)"
    steps:
      - send: ":TRAC:TYPE AVER"
      - query: ":TRAC:TYPE?"
        expect: "AVER"
      - send: ":AVER:COUN 10"
      - query: ":AVER:COUN?"
        expect: "10"
      - query: ":AVER:TYPE?"
        expect: "LOG"
      - query: ":AVER:TYPE:AUTO?"
        expect: "1"
      - send: ":AVER:TYPE:AUTO OFF"
      - query: ":AVER:TYPE:AUTO?"
        expect: "0"
      - send: ":AVER:TYPE RMS"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":AVER:CLE"
      - send: ":TRAC:CLE:ALL"
      - send: ":TRAC:TYPE MINH"
      - query: ":TRAC:TYPE?"
        expect: "MINH"
      - send: ":AVER:COUN 10001"
      - query: ":SYST:ERR?"
        expect_prefix: "-222,"

  - name: "单次扫描与迹线读取：INIT:CONT OFF、INIT:IMM 后 *OPC? 同步、:TRAC:DATA? TRACE1 为 1001 个 ASCII 值、峰值 -10 dBm"
    manual: "8 Swept SA Measurement > Sweep/Control > Single (p.760) / Restart; Trace/Detector > Trace data (p.939); FORMat (p.674)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:DATA? TRACE1"
        expect_fields: [{format: "±d.ddddddddE±ddd", count: 1000}, {format: "±d.ddddddddE±ddd"}]
      - send: ":INIT:REST"
      - send: ":ABOR"
      - query: ":FORM?"
        expect: "ASC"
      - send: ":FORM REAL"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":FORM:BORD SWAP"
      - query: ":FORM:BORD?"
        expect: "SWAP"

  - name: "触发：只有自由触发（IMMediate）；视频、外部触发未建模"
    manual: "7 Trigger Functions > Trigger (p.487–489: :TRIGger[:SEQuence]:SOURce for the Swept SA measurement) / RF Trigger Source (p.492)"
    steps:
      - query: ":TRIG:SOUR?"
        expect: "IMM"
      - send: ":TRIG:SEQ:SOUR IMM"
      - query: ":TRIG:RF:SOUR?"
        expect: "IMM"
      - send: ":TRIG:SOUR VID"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":TRIG:RF:SOUR EXT1"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"

  - name: "标记：预置 OFF 时 X?/Y? 回 9.91E+37；峰值搜索打开标记并找到 5.8 GHz、-10 dBm 的载波"
    manual: "8 Swept SA Measurement > Marker > Marker Control Mode (p.612–613) / Setting/Querying the Marker X/Y Axis Value (p.613–615); Peak Search (p.726)"
    steps:
      - query: ":CALC:MARK:X?"
        expect: "+9.91000000E+037"
      - query: ":CALC:MARK:Y?"
        expect: "+9.91000000E+037"
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK1:MAX"
      - query: ":CALC:MARK:MODE?"
        expect: "POS"
      - query: ":CALC:MARK:X?"
        expect_value: 5.8e9
        tolerance: 1000.0
      - query: ":CALC:MARK:Y?"
        expect_value: -10.0
        tolerance: 0.2
      - send: ":CALC:MARK:MIN"
      - query: ":CALC:MARK:Y?"
        expect_value: -120.0
        tolerance: 30.0
      - send: ":CALC:MARK:X 5.8 GHz"
      - query: ":CALC:MARK:X?"
        expect: "+5.80000000E+009"
      - send: ":CALC:MARK:AOFF"
      - query: ":CALC:MARK:MODE?"
        expect: "OFF"
      - send: ":CALC:MARK2:MAX"
      - query: ":SYST:ERR?"
        expect_prefix: "-114,"

  - name: "标记模式：从 OFF 打开时在屏幕中心；差值标记的 X 是相对参考标记的偏移、Y 是 dB 差"
    manual: "8 Swept SA Measurement > Marker > Marker Control Mode (p.613: Delta — X Axis offset from a reference marker; the query returns the offset)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK:MODE POS"
      - query: ":CALC:MARK:X?"
        expect: "+5.80000000E+009"
      - send: ":CALC:MARK:MODE DELT"
      - query: ":CALC:MARK:X?"
        expect: "+0.00000000E+000"
      - query: ":CALC:MARK:Y?"
        expect_value: 0.0
        tolerance: 1.0e-6
      - send: ":CALC:MARK:X 100 kHz"
      - query: ":CALC:MARK:X?"
        expect: "+1.00000000E+005"
      - query: ":CALC:MARK:Y?"
        expect_value: -88.0
        tolerance: 20.0
      - send: ":CALC:MARK:MODE FIX"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"

  - name: "峰值搜索：门限与偏移、下一峰/左右峰找不到时报 -200、搜索方式 MAXimum/PARameter"
    manual: "8 Swept SA Measurement > Peak Search > Next Peak / Next Pk Right / Next Pk Left / Minimum (p.726–731) / Peak Threshold (p.732) / Peak Excursion / Peak Search Mode"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":CALC:MARK:PEAK:SEAR:MODE?"
        expect: "MAX"
      - send: ":CALC:MARK:PEAK:SEAR:MODE PAR"
      - query: ":CALC:MARK:PEAK:SEAR:MODE?"
        expect: "PAR"
      - query: ":CALC:MARK:PEAK:THR?"
        expect: "-9.00000000E+001"
      - send: ":CALC:MARK:PEAK:THR -30"
      - query: ":CALC:MARK:PEAK:EXC?"
        expect: "+6.00000000E+000"
      - send: ":CALC:MARK:PEAK:EXC 10"
      - send: ":CALC:MARK:MAX"
      - query: ":CALC:MARK:X?"
        expect_value: 5.8e9
        tolerance: 1000.0
      - send: ":CALC:MARK:MAX:NEXT"
      - query: ":SYST:ERR?"
        expect_prefix: "-200,"
      - send: ":CALC:MARK:MAX:LEFT"
      - query: ":SYST:ERR?"
        expect_prefix: "-200,"
      - send: ":CALC:MARK:MAX:RIGH"
      - query: ":SYST:ERR?"
        expect_prefix: "-200,"

  - name: "标记计数器：关闭时回 0，打开后读出载波频率"
    manual: "8 Swept SA Measurement > Marker Function > Marker Count (p.629)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK:MAX"
      - query: ":CALC:MARK:FCO?"
        expect: "0"
      - query: ":CALC:MARK:FCO:X?"
        expect: "+0.00000000E+000"
      - send: ":CALC:MARK:FCO ON"
      - query: ":CALC:MARK:FCO:STAT?"
        expect: "1"
      - query: ":CALC:MARK:FCO:X?"
        expect_value: 5.8e9
        tolerance: 1.0

  - name: "显示（接受）：显示开关、每格电平、显示线、迹线注释"
    manual: "1 About the Analyzer > Display Enable (p.118–119); 8 Swept SA Measurement > AMPTD > Scale/Div (p.563); View/Display > Display Line (p.960) / Annotation (p.956)"
    steps:
      - send: ":DISP:ENAB OFF"
      - query: ":DISP:ENAB?"
        expect: "0"
      - send: ":DISP:WIND:TRAC:Y:PDIV 5 dB"
      - query: ":DISP:WIND:TRAC:Y:PDIV?"
        expect: "+5.00000000E+000"
      - send: ":DISP:WIND:TRAC:Y:DLIN -40 dBm"
      - query: ":DISP:WIND:TRAC:Y:DLIN?"
        expect: "-4.00000000E+001"
      - send: ":DISP:WIND:TRAC:Y:DLIN:STAT ON"
      - query: ":DISP:WIND:TRAC:Y:DLIN:STAT?"
        expect: "1"
      - send: ":DISP:ANN:TRAC OFF"
      - query: ":DISP:ANN:TRAC?"
        expect: "0"

  - name: "未实现的命令回复 -113：零跨度以外的测量应用、标记 STATe"
    manual: "3 Programming the Analyzer > List of SCPI Commands (p.131–174)"
    # 前放命令（#1020）已建模：没装选件的整机报 -241，见“内部前放”用例。
    steps:
      - send: ":CONF:ACP"
      - query: ":SYST:ERR?"
        expect_prefix: "-113,"
      - send: ":CALC:MARK:STAT ON"
      - query: ":SYST:ERR?"
        expect_prefix: "-113,"

  # ---- 前端指标（#960）：数据手册的 DANL、相位噪声、三阶截点 ------------------------------------------
  - name: "噪声底随 RBW 与频段变化：100 MHz 处 RBW 1 kHz → 10 kHz 抬高 10 dB，5 GHz 处高 5 dB（DANL）"
    manual: "Data Sheet 3121-1037.EN p.21 > DANL 1a. Standard path, typical: >10 MHz to 1.2 GHz -155 dBm, >3.6 to 6.6 GHz -150 dBm（RBW 1 Hz）"
    # 输入无信号、0 dB 衰减、采样检波、对数平均 100 次。噪声底 = DANL + 10·lg(RBW / 1 Hz)：
    # 100 MHz、RBW 1 kHz 为 -155 + 30 = -125 dBm，RBW 10 kHz 为 -115 dBm；5 GHz、RBW 1 kHz 为 -120 dBm。
    steps:
      - {instrument: sg, send: ":OUTP OFF"}
      - send: ":FREQ:CENT 100 MHz"
      - send: ":FREQ:SPAN 100 kHz"
      - send: ":POW:ATT 0"
      - send: ":BAND 1 kHz"
      - send: ":DET:TRAC SAMP"
      - send: ":AVER:COUN 100"
      - send: ":TRAC:TYPE AVER"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM;*WAI"
      - send: ":CALC:MARK:X 100 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -125.0
        tolerance: 2.2
      - send: ":BAND 10 kHz"
      - send: ":INIT:IMM;*WAI"
      - query: ":CALC:MARK:Y?"
        expect_value: -115.0
        tolerance: 2.2
      - send: ":FREQ:CENT 5 GHz"
      - send: ":BAND 1 kHz"
      - send: ":INIT:IMM;*WAI"
      - send: ":CALC:MARK:X 5 GHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -120.0
        tolerance: 2.2

  - name: "载波旁的相位噪声：1 GHz、-10 dBm 载波旁 100 Hz 与 1 kHz 处的噪声裙边"
    manual: "Data Sheet 3121-1037.EN p.29 > Phase Noise (SSB), CF = 1 GHz, typical: 100 Hz -112 dBc/Hz, 1 kHz -127 dBc/Hz"
    # 自动衰减 10 dB、RBW 10 Hz（噪声带宽 10.645 Hz，+10.27 dB）、采样检波、对数平均 100 次（比功率低
    # 2.51 dB）。100 Hz 处：-10 - 112 + 10.27 = -111.73 dBm，加上接收机噪声（NF 21.24 dB + 衰减：-132.49 dBm）
    # 为 -111.69 dBm，显示 -114.2 dBm；1 kHz 处：-126.73 dBm 加噪声为 -125.70 dBm，显示 -128.2 dBm。
    steps:
      - {instrument: sg, send: ":FREQ 1 GHz"}
      - send: ":FREQ:CENT 1.0000015 GHz"
      - send: ":FREQ:SPAN 3 kHz"
      - send: ":BAND 10 Hz"
      - send: ":DET:TRAC SAMP"
      - send: ":AVER:COUN 100"
      - send: ":TRAC:TYPE AVER"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM;*WAI"
      - query: ":POW:ATT?"
        expect_value: 10.0
        tolerance: 1.0e-9
      - send: ":CALC:MARK:X 1 GHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -10.0
        tolerance: 0.05
      - send: ":CALC:MARK:X 1.0000001 GHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -114.2
        tolerance: 2.2
      - send: ":CALC:MARK:X 1.000001 GHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -128.2
        tolerance: 2.2

  - name: "双音三阶交调：1000/1001 MHz 各 -20 dBm 在混频器处，999 与 1002 MHz 的产物为 3P - 2·TOI"
    manual: "Data Sheet 3121-1037.EN p.27 > Third-Order Intercept (TOI) 1a. Standard path, typical: >350 MHz to 1.1 GHz +19 dBm"
    # 两台信号源各设 -16.48 dBm，共用 RF_IN 的节点后各 -20.0 dBm；0 dB 衰减，混频器处同样 -20 dBm。
    # 三阶产物 3·(-20) - 2·19 = -98.0 dBm。压缩（P1dB +5 dBm，第 19 页）使每个音低 0.01 dB。RBW 100 Hz 使
    # 接收机噪声（-132.5 dBm）在产物下 34 dB；采样检波、平均 100 次，噪声对线读数的影响 < 0.1 dB。
    steps:
      - {instrument: sg, send: ":FREQ 1 GHz"}
      - {instrument: sg, send: ":POW -16.48"}
      - {instrument: sg2, send: ":POW -16.48"}
      - {instrument: sg2, send: ":OUTP ON"}
      - send: ":FREQ:CENT 1000.5 MHz"
      - send: ":FREQ:SPAN 5 MHz"
      - send: ":POW:ATT 0"
      - send: ":BAND 100"
      - send: ":DET:TRAC SAMP"
      - send: ":AVER:COUN 100"
      - send: ":TRAC:TYPE AVER"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM;*WAI"
      - send: ":CALC:MARK:X 1000 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -20.01
        tolerance: 0.05
      - send: ":CALC:MARK:X 999 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -98.0
        tolerance: 0.2
      - send: ":CALC:MARK:X 1002 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -98.0
        tolerance: 0.2

  - name: "内部前放（选件 P26，PA）：前放开时噪声底按 1c 的 DANL；频段 LOW 时 3.6 GHz 以上不放大；没装选件的整机报 -241"
    manual: "Data Sheet 3121-1037.EN p.21 > DANL 1a typical: >10 MHz to 1.2 GHz -155 dBm, >8.4 to 13.6 GHz -149 dBm；p.22 > DANL 1c (PA on) typical: >1 MHz to 2.1 GHz -166 dBm, >3.6 to 17.1 GHz -166 dBm；N9060-90027 p.578-580 > Internal Preamp: [:SENSe]:POWer[:RF]:GAIN[:STATe] (preset OFF), :GAIN:BAND LOW|FULL (preset LOW); p.575 > option not installed: -241"
    # sa_p26 装了 P26、输入端接。0 dB 衰减、RBW 1 kHz、采样检波、对数平均 100 次：噪声底 = DANL（1 Hz）+ 30 dB。
    # 1 GHz：前放关 -125 dBm，开 -136 dBm。10 GHz：频段 LOW 时前放不放大（1a，-119 dBm），FULL 时 1c（-136 dBm）。
    # 没装选件时设置与查询都报 -241 是 SimuBench 的假设（手册对未装的 LNP、MPB 这样写，覆盖表注明）。
    steps:
      - send: ":POW:GAIN ON"
      - query: ":SYST:ERR?"
        expect_prefix: "-241"
      - query: "*OPT?"
        expect: "526"
      - {instrument: sa_p26, query: "*OPT?", expect: "526,P26"}
      - {instrument: sa_p26, query: ":POW:GAIN?", expect: "0"}
      - {instrument: sa_p26, query: ":POW:GAIN:BAND?", expect: "LOW"}
      - {instrument: sa_p26, send: ":POW:ATT 0"}
      - {instrument: sa_p26, send: ":BAND 1 kHz"}
      - {instrument: sa_p26, send: ":DET:TRAC SAMP"}
      - {instrument: sa_p26, send: ":AVER:COUN 100"}
      - {instrument: sa_p26, send: ":TRAC:TYPE AVER"}
      - {instrument: sa_p26, send: ":INIT:CONT OFF"}
      - {instrument: sa_p26, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_p26, send: ":CALC:MARK:X 1 GHz"}
      - {instrument: sa_p26, query: ":CALC:MARK:Y?", expect_value: -125.0, tolerance: 2.2}
      - {instrument: sa_p26, send: ":POW:GAIN ON"}
      - {instrument: sa_p26, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_p26, query: ":CALC:MARK:Y?", expect_value: -136.0, tolerance: 2.2}
      - {instrument: sa_p26, send: ":FREQ:CENT 10 GHz"}
      - {instrument: sa_p26, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_p26, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_p26, query: ":CALC:MARK:Y?", expect_value: -119.0, tolerance: 2.2}
      - {instrument: sa_p26, send: ":POW:GAIN:BAND FULL"}
      - {instrument: sa_p26, query: ":POW:GAIN:BAND?", expect: "FULL"}
      - {instrument: sa_p26, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_p26, query: ":CALC:MARK:Y?", expect_value: -136.0, tolerance: 2.2}
      - {instrument: sa_p26, query: ":SYST:ERR?", expect: '+0,"No error"'}

  # ---- µW 通路（#1039）：MW:PATH / MW:PRESelector 与各通路的前端指标 ------------------------------------
  - name: "µW 通路命令：MW:PATH 四个值与按选件可用、MW:PRES 的互锁；未装选件的值报错（手册 -241，当前 -224 待 #1113）"
    manual: "N9060-90027 8 Swept SA Measurement > AMPTD Y Scale > µW Path Control (p.573-578): [:SENSe]:POWer[:RF]:MW:PATH STD|LNPath|MPBypass|FULL (preset STD, p.573), :MW:PRESelector[:STATe] (preset ON; ON sets STD, OFF sets MPB, p.577-578); option LNP missing: -241 (p.575), option MPB missing: -241 (p.577)"
    # 手册对未装选件的整机写明按值报 -241；SimuBench 当前只有整条命令按选件门控与按值 when 分流（-224），
    # 按值门控是 #1113。STD 与查询任何整机可用。FULL 需要同时装 LNP 与 MPB（数据手册 4a 通路两个旁路开关），
    # 单选件字段按 MPB 门控（假设，覆盖表注明）。
    steps:
      - query: ":POW:MW:PATH?"
        expect: "STD"
      - send: ":POW:MW:PATH LNP"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":POW:MW:PATH MPB"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":POW:MW:PATH FULL"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - query: ":POW:MW:PRES?"
        expect: "1"
      - send: ":POW:MW:PRES OFF"
      - query: ":SYST:ERR?"
        expect_prefix: "-224,"
      - send: ":POW:MW:PATH STD"
      - query: ":SYST:ERR?"
        expect: '+0,"No error"'
      - {instrument: sa_lnp, query: "*OPT?", expect: "526,P26,LNP"}
      - {instrument: sa_lnp, send: ":POW:MW:PATH LNP"}
      - {instrument: sa_lnp, query: ":POW:MW:PATH?", expect: "LNP"}
      - {instrument: sa_lnp, send: ":POW:MW:PATH LNPATH"}
      - {instrument: sa_lnp, query: ":POW:MW:PATH?", expect: "LNP"}
      - {instrument: sa_lnp, query: ":POW:MW:PRES?", expect: "1"}
      - {instrument: sa_lnp, send: ":POW:MW:PATH MPB"}
      - {instrument: sa_lnp, query: ":SYST:ERR?", expect_prefix: "-224,"}
      - {instrument: sa_mpb, send: ":POW:MW:PRES OFF"}
      - {instrument: sa_mpb, query: ":POW:MW:PRES?", expect: "0"}
      - {instrument: sa_mpb, query: ":POW:MW:PATH?", expect: "MPB"}
      - {instrument: sa_mpb, send: ":POW:MW:PRES ON"}
      - {instrument: sa_mpb, query: ":POW:MW:PATH?", expect: "STD"}
      - {instrument: sa_mpb, send: ":POW:MW:PATH MPB"}
      - {instrument: sa_mpb, query: ":POW:MW:PRES?", expect: "0"}
      - {instrument: sa_mpb, send: ":POW:MW:PATH MPBYP"}
      - {instrument: sa_mpb, query: ":POW:MW:PATH?", expect: "MPB"}
      - {instrument: sa_mpb, send: ":POW:MW:PATH FULL"}
      - {instrument: sa_mpb, query: ":POW:MW:PATH?", expect: "FULL"}
      - {instrument: sa_mpb, send: ":POW:MW:PATH LNP"}
      - {instrument: sa_mpb, query: ":SYST:ERR?", expect_prefix: "-224,"}
      - {instrument: sa_fbp, query: "*OPT?", expect: "526,LNP,MPB"}
      - {instrument: sa_fbp, send: ":POW:MW:PATH FULL"}
      - {instrument: sa_fbp, query: ":POW:MW:PATH?", expect: "FULL"}
      - {instrument: sa_fbp, query: ":POW:MW:PRES?", expect: "0"}
      - {instrument: sa_fbp, query: ":SYST:ERR?", expect: '+0,"No error"'}

  - name: "LNP 通路（2a）：噪声底按 DANL 2a；3.6 GHz 以下 LNP 不接入（1a）；前放 FULL 开着时 LNP 不用（回 1c）"
    manual: "Data Sheet 3121-1037.EN p.23 > 2a. Low-noise path DANL, typical: 8.4 to 17.1 GHz -154 dBm, >17.1 to 23 GHz -152（RBW 1 Hz）；p.21 > 1a. Standard path DANL typical: >10 MHz to 1.2 GHz -155；p.22 > 1c. Standard path, PA on DANL typical: >3.6 to 17.1 GHz -166；N9060-90027 p.575 > the Low Noise Path is used only when the sweep is completely in High Band and no preamp is in use（按中心频率判断）"
    # sa_lnp 装了 LNP 与 P26、输入端接。0 dB 衰减、RBW 1 kHz、采样检波、对数平均 100 次：噪声底 = DANL + 30 dB。
    # 10 GHz（2a）：-124 dBm；20 GHz（2a）：-122；1 GHz（LNP 不接入，1a）：-125；前放 FULL（LNP 不用，1c）：-136。
    steps:
      - {instrument: sa_lnp, send: ":POW:ATT 0"}
      - {instrument: sa_lnp, send: ":BAND 1 kHz"}
      - {instrument: sa_lnp, send: ":DET:TRAC SAMP"}
      - {instrument: sa_lnp, send: ":AVER:COUN 100"}
      - {instrument: sa_lnp, send: ":TRAC:TYPE AVER"}
      - {instrument: sa_lnp, send: ":INIT:CONT OFF"}
      - {instrument: sa_lnp, send: ":POW:MW:PATH LNP"}
      - {instrument: sa_lnp, send: ":FREQ:CENT 10 GHz"}
      - {instrument: sa_lnp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_lnp, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_lnp, query: ":CALC:MARK:Y?", expect_value: -124.0, tolerance: 2.2}
      - {instrument: sa_lnp, send: ":FREQ:CENT 20 GHz"}
      - {instrument: sa_lnp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_lnp, send: ":CALC:MARK:X 20 GHz"}
      - {instrument: sa_lnp, query: ":CALC:MARK:Y?", expect_value: -122.0, tolerance: 2.2}
      - {instrument: sa_lnp, send: ":FREQ:CENT 1 GHz"}
      - {instrument: sa_lnp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_lnp, send: ":CALC:MARK:X 1 GHz"}
      - {instrument: sa_lnp, query: ":CALC:MARK:Y?", expect_value: -125.0, tolerance: 2.2}
      - {instrument: sa_lnp, send: ":POW:GAIN ON"}
      - {instrument: sa_lnp, send: ":POW:GAIN:BAND FULL"}
      - {instrument: sa_lnp, send: ":FREQ:CENT 10 GHz"}
      - {instrument: sa_lnp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_lnp, query: ":CALC:MARK:Y?", expect_value: -136.0, tolerance: 2.2}
      - {instrument: sa_lnp, query: ":SYST:ERR?", expect: '+0,"No error"'}

  - name: "MPB 通路（3a）：噪声底按 DANL 3a；旁路预选器后镜像与信号同幅度（差值 ≈ 0 dB）；前放开（3c）噪声底按 1c"
    manual: "Data Sheet 3121-1037.EN p.23 > 3a, 3b. Microwave preselector bypass (MPB) path DANL, nominal: >8.4 to 17.1 GHz -154 dBm（RBW 1 Hz）；p.22 > 1c. Standard path, PA on DANL typical: >3.6 to 17.1 GHz -166（3c 未给整条通路指标，前放按 1c，假设）；N9060-90027 p.577 > the image response and the real signal typically have the same amplitude（旁路后抑制 0 dB；本模型 IF 21.4 MHz，镜像在信号上方 42.8 MHz）"
    # sa_mpb 装了 MPB 与 P26。噪声底：输入端接（sg3 关着），10 GHz、3a：-154+30 = -124 dBm。
    # 镜像：sg3 的 10 GHz、-10 dBm 连续波，MPB 通路上 10.0428 GHz 处出现同幅度的镜像；峰值搜索把标记放在
    # 信号上，差值模式把参考固定在那里，标记移到镜像处，差值 ≈ 0 dB（两线同段频响抵消）。
    # 3c：前放 FULL 开着、通路保持 MPB，10 GHz 噪声底 -136 dBm（1c）。
    steps:
      - {instrument: sa_mpb, send: ":POW:ATT 0"}
      - {instrument: sa_mpb, send: ":BAND 1 kHz"}
      - {instrument: sa_mpb, send: ":DET:TRAC SAMP"}
      - {instrument: sa_mpb, send: ":AVER:COUN 100"}
      - {instrument: sa_mpb, send: ":TRAC:TYPE AVER"}
      - {instrument: sa_mpb, send: ":INIT:CONT OFF"}
      - {instrument: sa_mpb, send: ":POW:MW:PATH MPB"}
      - {instrument: sa_mpb, send: ":FREQ:CENT 10 GHz"}
      - {instrument: sa_mpb, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_mpb, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_mpb, query: ":CALC:MARK:Y?", expect_value: -124.0, tolerance: 2.2}
      - {instrument: sg3, send: ":OUTP ON"}
      - {instrument: sa_mpb, send: ":TRAC:TYPE WRIT"}
      # RBW 放宽到 1 MHz：点距 100 kHz，信号与镜像都落在最近点的滤波器平坦区内，标记读到全功率。
      - {instrument: sa_mpb, send: ":BAND 1 MHz;:FREQ:CENT 10.02 GHz;:FREQ:SPAN 100 MHz"}
      - {instrument: sa_mpb, send: ":INIT:IMM;*WAI"}
      # 峰值搜索找到的是镜像（它比载波还高 0.06 dB），先把标记放在载波上再进差值模式（参考＝载波）。
      - {instrument: sa_mpb, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_mpb, send: ":CALC:MARK:MODE DELT"}
      - {instrument: sa_mpb, send: ":CALC:MARK:X 42.8 MHz"}
      - {instrument: sa_mpb, query: ":CALC:MARK:Y?", expect_value: 0.0, tolerance: 0.5}
      - {instrument: sa_mpb, send: ":CALC:MARK:MODE POS"}
      - {instrument: sg3, send: ":OUTP OFF"}
      - {instrument: sa_mpb, send: ":BAND 1 kHz;:FREQ:CENT 10 GHz;:FREQ:SPAN 100 kHz"}
      - {instrument: sa_mpb, send: ":POW:GAIN ON"}
      - {instrument: sa_mpb, send: ":POW:GAIN:BAND FULL"}
      - {instrument: sa_mpb, send: ":TRAC:TYPE AVER"}
      - {instrument: sa_mpb, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_mpb, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_mpb, query: ":CALC:MARK:Y?", expect_value: -136.0, tolerance: 2.2}
      - {instrument: sa_mpb, query: ":POW:MW:PATH?", expect: "MPB"}
      - {instrument: sa_mpb, query: ":SYST:ERR?", expect: '+0,"No error"'}

  - name: "FULL 通路（4a）：噪声底按 DANL 4a（10 GHz -128 dBm、20 GHz -126 dBm）"
    manual: "Data Sheet 3121-1037.EN p.23-24 > 4a. Full bypass (FBP) path DANL, typical: 3.6 to 13.6 GHz -158 dBm, >17.1 to 22 GHz -156（RBW 1 Hz；sa_fbp 装了 LNP 与 MPB，输入端接）"
    # 0 dB 衰减、RBW 1 kHz、采样检波、对数平均 100 次：噪声底 = DANL + 30 dB。
    steps:
      - {instrument: sa_fbp, send: ":POW:ATT 0"}
      - {instrument: sa_fbp, send: ":BAND 1 kHz"}
      - {instrument: sa_fbp, send: ":DET:TRAC SAMP"}
      - {instrument: sa_fbp, send: ":AVER:COUN 100"}
      - {instrument: sa_fbp, send: ":TRAC:TYPE AVER"}
      - {instrument: sa_fbp, send: ":INIT:CONT OFF"}
      - {instrument: sa_fbp, send: ":POW:MW:PATH FULL"}
      - {instrument: sa_fbp, send: ":FREQ:CENT 10 GHz"}
      - {instrument: sa_fbp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_fbp, send: ":CALC:MARK:X 10 GHz"}
      - {instrument: sa_fbp, query: ":CALC:MARK:Y?", expect_value: -128.0, tolerance: 2.2}
      - {instrument: sa_fbp, send: ":FREQ:CENT 20 GHz"}
      - {instrument: sa_fbp, send: ":INIT:IMM;*WAI"}
      - {instrument: sa_fbp, send: ":CALC:MARK:X 20 GHz"}
      - {instrument: sa_fbp, query: ":CALC:MARK:Y?", expect_value: -126.0, tolerance: 2.2}
      - {instrument: sa_fbp, query: ":SYST:ERR?", expect: '+0,"No error"'}
