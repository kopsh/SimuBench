# N9042B 的手册用例：命令、参数、预置值与回复格式按 *X-Series Signal Analyzer Spectrum Analyzer
# Mode User's & Programmer's Reference*（N9060-90027, August 2014；页码以 PDF 为准），频率选件 526。
# 测试台 examples/benches/keysight-n9042b.bench.yaml：R&S SMA100B 的 5.8 GHz、-10 dBm 连续波接到
# RF_IN。每个用例在一个刚上电的测试台上运行；数值查询用容差，格式与枚举用精确回复。
model: keysight-n9042b
bench: ../../../examples/benches/keysight-n9042b.bench.yaml
instrument: sa
cases:
  - name: "身份与公共命令：*IDN? 四字段、*OPT?、*TST?、状态寄存器、错误队列"
    manual: "3 Programming the Analyzer > IEEE 488.2 Common Commands > *IDN? (p.220) / *OPT? (p.222) / *RST (p.223) / *TST? (p.224) / *CLS / *ESE / *ESR / *SRE / *STB / *OPC / *WAI; SYSTem:ERRor"
    steps:
      - query: "*IDN?"
        expect: "Keysight Technologies,N9042B,MY00000001,A.25.05"
      - query: "*OPT?"
        expect: "526"
      - query: "*TST?"
        expect: "0"
      - query: "*OPC?"
        expect: "1"
      - send: "*ESE 36"
      - query: "*ESE?"
        expect: "36"
      - send: "*SRE 16"
      - query: "*SRE?"
        expect: "16"
      - query: "*ESR?"
        expect: "0"
      - query: "*STB?"
        expect: "0"
      - send: "*WAI"
      - send: ":FREQ:SPAN 0"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: "*CLS"
      - query: ":SYST:ERR?"
        expect: '+0,"No error"'

  - name: "上电与预置：选件 526 的全跨度（中心 13.255 GHz、止 26.5 GHz）、RBW 3 MHz、衰减 10 dB、检波器自动 Normal、连续扫描"
    manual: "8 Swept SA Measurement > FREQ Channel > Center Frequency Presets (p.601); BW > Res BW (p.584); AMPTD > Attenuation (p.550); Trace/Detector (p.913); Sweep/Control > Cont (p.594)"
    steps:
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"
      - query: ":FREQ:STAR?"
        expect: "+1.00000000E+007"
      - query: ":FREQ:STOP?"
        expect: "+2.65000000E+010"
      - query: ":BAND?"
        expect: "+3.00000000E+006"
      - query: ":BAND:VID?"
        expect: "+3.00000000E+006"
      - query: ":POW:ATT?"
        expect: "+1.00000000E+001"
      - query: ":POW:ATT:AUTO?"
        expect: "1"
      - query: ":DISP:WIND:TRAC:Y:RLEV?"
        expect: "+0.00000000E+000"
      - query: ":DET:TRAC?"
        expect: "NORM"
      - query: ":DET:TRAC:AUTO?"
        expect: "1"
      - query: ":TRAC:TYPE?"
        expect: "WRIT"
      - query: ":SWE:POIN?"
        expect: "1001"
      - query: ":AVER:COUN?"
        expect: "100"
      - query: ":INIT:CONT?"
        expect: "1"
      - query: ":CALC:MARK:MODE?"
        expect: "OFF"

  - name: "*RST 与 :SYSTem:PRESet：同一预置，但 *RST 置 INIT:CONT OFF、SYST:PRES 置 ON"
    manual: "8 Swept SA Measurement > Sweep/Control > Cont (p.594: SYST:PRESet sets INIT:CONT to ON but *RST sets INIT:CONT to OFF); System > Preset (p.722)"
    steps:
      - send: ":FREQ:CENT 1 GHz"
      - send: "*RST"
      - query: ":INIT:CONT?"
        expect: "0"
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"
      - send: ":FREQ:CENT 1 GHz"
      - send: ":SYST:PRES"
      - query: ":INIT:CONT?"
        expect: "1"
      - query: ":FREQ:CENT?"
        expect: "+1.32550000E+010"

  - name: "频率：中心/跨度/起止；上限 27 GHz，超出报 -222；中心放不进跨度时缩跨度"
    manual: "8 Swept SA Measurement > FREQ Channel > Center Freq (p.600) / Start Freq (p.605) / Stop Freq; SPAN X Scale > Span (p.836)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - query: ":FREQ:CENT?"
        expect: "+5.80000000E+009"
      - query: ":FREQ:SPAN?"
        expect: "+1.16000000E+010"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":FREQ:STAR?"
        expect: "+5.79950000E+009"
      - query: ":FREQ:STOP?"
        expect: "+5.80050000E+009"
      - send: ":FREQ:STOP 26.5 GHz"
      - send: ":FREQ:STAR 20 GHz"
      - query: ":FREQ:CENT?"
        expect: "+2.32500000E+010"
      - query: ":FREQ:SPAN?"
        expect: "+6.50000000E+009"
      - send: ":FREQ:STOP 28 GHz"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SENS:FREQ:CENT:STEP 10 MHz"
      - query: ":FREQ:CENT:STEP?"
        expect: "+1.00000000E+007"
      - send: ":FREQ:CENT:STEP:AUTO ON"
      - query: ":FREQ:CENT:STEP:AUTO?"
        expect: "1"

  - name: "RBW：自动 span/106 取最近档（约 10% 步进）、手动 1 Hz–8 MHz 取最近档且平分时向上、BANDwidth 与 BWIDth 两种写法"
    manual: "8 Swept SA Measurement > BW > Res BW (p.583–584: nearest available RBW, rounding up; max 8 MHz) / Span:3 dB RBW (p.586: 106:1)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":BAND?"
        expect: "+9.10000000E+003"
      - query: ":BWID:AUTO?"
        expect: "1"
      - send: ":BAND 4.5 MHz"
      - query: ":BAND?"
        expect: "+5.00000000E+006"
      - query: ":BAND:AUTO?"
        expect: "0"
      - send: ":BWID 1.04 kHz"
      - query: ":BWID?"
        expect: "+1.00000000E+003"
      - send: ":BAND 9 MHz"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":BWID:AUTO ON"
      - query: ":BAND?"
        expect: "+9.10000000E+003"

  - name: "VBW：自动跟随 RBW；手动取最近档，50 MHz 为全开"
    manual: "8 Swept SA Measurement > BW > Video BW (p.585: 1 Hz to 8 MHz in approximately 10% steps, plus 50 MHz)"
    steps:
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":BAND:VID?"
        expect: "+9.10000000E+003"
      - query: ":BAND:VID:AUTO?"
        expect: "1"
      - send: ":BAND:VID 40 MHz"
      - query: ":BAND:VID?"
        expect: "+5.00000000E+007"
      - query: ":BWID:VID:AUTO?"
        expect: "0"
      - send: ":BWID:VID 300 Hz"
      - query: ":BWID:VID?"
        expect: "+3.00000000E+002"
      - send: ":BAND:VID:AUTO ON"
      - query: ":BAND:VID?"
        expect: "+9.10000000E+003"

  - name: "扫描时间：自动随 RBW/VBW；手动 1 ms–4000 s、超出报 -222；扫描点数 1–40001"
    manual: "8 Swept SA Measurement > Sweep/Control > Sweep Time (p.845–846) / Points (p.897)"
    steps:
      - query: ":SWE:TIME:AUTO?"
        expect: "1"
      - send: ":SWE:TIME 2"
      - query: ":SWE:TIME?"
        expect: "+2.00000000E+000"
      - query: ":SWE:TIME:AUTO?"
        expect: "0"
      - send: ":SWE:TIME 5000"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SWE:TIME:AUTO ON"
      - query: ":SWE:TIME:AUTO?"
        expect: "1"
      - send: ":SWE:POIN 5001"
      - query: ":SWE:POIN?"
        expect: "5001"
      - send: ":SWE:POIN 40002"
      - query: ":SYST:ERR?"
        expect_match: '^-222,.*'

  - name: "幅度：参考电平与自动衰减（参考电平 +10 dBm → 20 dB）、手动 2 dB 步进、单位只有 dBm"
    manual: "8 Swept SA Measurement > AMPTD Y Scale > Ref Level (p.547) / Attenuation (p.550) / Y Axis Unit (p.567)"
    steps:
      - send: ":DISP:WIND:TRAC:Y:RLEV 10 dBm"
      - query: ":DISP:WIND1:TRAC:Y:SCAL:RLEV?"
        expect: "+1.00000000E+001"
      - query: ":POW:ATT?"
        expect: "+2.00000000E+001"
      - send: ":POW:ATT 15"
      - query: ":POW:ATT?"
        expect: "+1.60000000E+001"
      - query: ":POW:ATT:AUTO?"
        expect: "0"
      - send: ":POW:ATT:AUTO ON"
      - query: ":POW:ATT?"
        expect: "+2.00000000E+001"
      - query: ":UNIT:POW?"
        expect: "DBM"
      - send: ":UNIT:POW V"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'

  - name: "检波器：手动选择关闭自动；自动按迹线类型（最大保持 → 正峰、最小保持 → 负峰）；平均检波器未建模"
    manual: "8 Swept SA Measurement > Trace/Detector > Detector (p.912–913) / Auto (p.916) / Normal (p.916)"
    steps:
      - send: ":DET:TRAC1 SAMP"
      - query: ":DET:TRAC?"
        expect: "SAMP"
      - query: ":DET:TRAC:AUTO?"
        expect: "0"
      - send: ":DET:TRAC:AUTO ON"
      - send: ":TRAC:TYPE MAXH"
      - query: ":DET:TRAC?"
        expect: "POS"
      - send: ":TRAC1:TYPE MINH"
      - query: ":DET:TRAC?"
        expect: "NEG"
      - send: ":DET NEG"
      - query: ":DET?"
        expect: "NEG"
      - query: ":DET:AUTO?"
        expect: "0"
      - send: ":DET:AUTO ON"
      - query: ":DET:AUTO?"
        expect: "1"
      - send: ":DET:TRAC AVER"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'
      - send: ":DET:TRAC2 SAMP"
      - query: ":SYST:ERR?"
        expect_match: '^-114,.*'

  - name: "迹线类型与平均：WRITe/AVERage/MAXHold/MINHold、平均次数 1–10000、平均类型只有 LOG"
    manual: "8 Swept SA Measurement > Trace/Detector > Trace Type (p.901); Meas Setup > Average/Hold Number (p.676) / Average Type (p.677)"
    steps:
      - send: ":TRAC:TYPE AVER"
      - query: ":TRAC:TYPE?"
        expect: "AVER"
      - send: ":AVER:COUN 10"
      - query: ":AVER:COUN?"
        expect: "10"
      - query: ":AVER:TYPE?"
        expect: "LOG"
      - query: ":AVER:TYPE:AUTO?"
        expect: "1"
      - send: ":AVER:TYPE:AUTO OFF"
      - query: ":AVER:TYPE:AUTO?"
        expect: "0"
      - send: ":AVER:TYPE RMS"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'
      - send: ":AVER:CLE"
      - send: ":TRAC:CLE:ALL"
      - send: ":TRAC:TYPE MINH"
      - query: ":TRAC:TYPE?"
        expect: "MINH"
      - send: ":AVER:COUN 10001"
      - query: ":SYST:ERR?"
        expect_match: '^-222,.*'

  - name: "单次扫描与迹线读取：INIT:CONT OFF、INIT:IMM 后 *OPC? 同步、:TRAC:DATA? TRACE1 为 1001 个 ASCII 值、峰值 -10 dBm"
    manual: "8 Swept SA Measurement > Sweep/Control > Single (p.760) / Restart; Trace/Detector > Trace data (p.939); FORMat (p.674)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:DATA? TRACE1"
        expect_match: '^([-+]\d\.\d{8}E[-+]\d{3},){1000}[-+]\d\.\d{8}E[-+]\d{3}$'
      - send: ":INIT:REST"
      - send: ":ABOR"
      - query: ":FORM?"
        expect: "ASC"
      - send: ":FORM REAL"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'
      - send: ":FORM:BORD SWAP"
      - query: ":FORM:BORD?"
        expect: "SWAP"

  - name: "触发：只有自由触发（IMMediate）；视频、外部触发未建模"
    manual: "7 Trigger Functions > Trigger (p.487–489: :TRIGger[:SEQuence]:SOURce for the Swept SA measurement) / RF Trigger Source (p.492)"
    steps:
      - query: ":TRIG:SOUR?"
        expect: "IMM"
      - send: ":TRIG:SEQ:SOUR IMM"
      - query: ":TRIG:RF:SOUR?"
        expect: "IMM"
      - send: ":TRIG:SOUR VID"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'
      - send: ":TRIG:RF:SOUR EXT1"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'

  - name: "标记：预置 OFF 时 X?/Y? 回 9.91E+37；峰值搜索打开标记并找到 5.8 GHz、-10 dBm 的载波"
    manual: "8 Swept SA Measurement > Marker > Marker Control Mode (p.612–613) / Setting/Querying the Marker X/Y Axis Value (p.613–615); Peak Search (p.726)"
    steps:
      - query: ":CALC:MARK:X?"
        expect: "+9.91000000E+037"
      - query: ":CALC:MARK:Y?"
        expect: "+9.91000000E+037"
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK1:MAX"
      - query: ":CALC:MARK:MODE?"
        expect: "POS"
      - query: ":CALC:MARK:X?"
        expect_value: 5.8e9
        tolerance: 1000.0
      - query: ":CALC:MARK:Y?"
        expect_value: -10.0
        tolerance: 0.2
      - send: ":CALC:MARK:MIN"
      - query: ":CALC:MARK:Y?"
        expect_value: -120.0
        tolerance: 30.0
      - send: ":CALC:MARK:X 5.8 GHz"
      - query: ":CALC:MARK:X?"
        expect: "+5.80000000E+009"
      - send: ":CALC:MARK:AOFF"
      - query: ":CALC:MARK:MODE?"
        expect: "OFF"
      - send: ":CALC:MARK2:MAX"
      - query: ":SYST:ERR?"
        expect_match: '^-114,.*'

  - name: "标记模式：从 OFF 打开时在屏幕中心；差值标记的 X 是相对参考标记的偏移、Y 是 dB 差"
    manual: "8 Swept SA Measurement > Marker > Marker Control Mode (p.613: Delta — X Axis offset from a reference marker; the query returns the offset)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK:MODE POS"
      - query: ":CALC:MARK:X?"
        expect: "+5.80000000E+009"
      - send: ":CALC:MARK:MODE DELT"
      - query: ":CALC:MARK:X?"
        expect: "+0.00000000E+000"
      - query: ":CALC:MARK:Y?"
        expect_value: 0.0
        tolerance: 1.0e-6
      - send: ":CALC:MARK:X 100 kHz"
      - query: ":CALC:MARK:X?"
        expect: "+1.00000000E+005"
      - query: ":CALC:MARK:Y?"
        expect_value: -88.0
        tolerance: 20.0
      - send: ":CALC:MARK:MODE FIX"
      - query: ":SYST:ERR?"
        expect_match: '^-224,.*'

  - name: "峰值搜索：门限与偏移、下一峰/左右峰找不到时报 -200、搜索方式 MAXimum/PARameter"
    manual: "8 Swept SA Measurement > Peak Search > Next Peak / Next Pk Right / Next Pk Left / Minimum (p.726–731) / Peak Threshold (p.732) / Peak Excursion / Peak Search Mode"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - query: ":CALC:MARK:PEAK:SEAR:MODE?"
        expect: "MAX"
      - send: ":CALC:MARK:PEAK:SEAR:MODE PAR"
      - query: ":CALC:MARK:PEAK:SEAR:MODE?"
        expect: "PAR"
      - query: ":CALC:MARK:PEAK:THR?"
        expect: "-9.00000000E+001"
      - send: ":CALC:MARK:PEAK:THR -30"
      - query: ":CALC:MARK:PEAK:EXC?"
        expect: "+6.00000000E+000"
      - send: ":CALC:MARK:PEAK:EXC 10"
      - send: ":CALC:MARK:MAX"
      - query: ":CALC:MARK:X?"
        expect_value: 5.8e9
        tolerance: 1000.0
      - send: ":CALC:MARK:MAX:NEXT"
      - query: ":SYST:ERR?"
        expect_match: '^-200,.*'
      - send: ":CALC:MARK:MAX:LEFT"
      - query: ":SYST:ERR?"
        expect_match: '^-200,.*'
      - send: ":CALC:MARK:MAX:RIGH"
      - query: ":SYST:ERR?"
        expect_match: '^-200,.*'

  - name: "标记计数器：关闭时回 0，打开后读出载波频率"
    manual: "8 Swept SA Measurement > Marker Function > Marker Count (p.629)"
    steps:
      - send: ":FREQ:CENT 5.8 GHz"
      - send: ":FREQ:SPAN 1 MHz"
      - send: ":CALC:MARK:MAX"
      - query: ":CALC:MARK:FCO?"
        expect: "0"
      - query: ":CALC:MARK:FCO:X?"
        expect: "+0.00000000E+000"
      - send: ":CALC:MARK:FCO ON"
      - query: ":CALC:MARK:FCO:STAT?"
        expect: "1"
      - query: ":CALC:MARK:FCO:X?"
        expect_value: 5.8e9
        tolerance: 1.0

  - name: "显示（接受）：显示开关、每格电平、显示线、迹线注释"
    manual: "1 About the Analyzer > Display Enable (p.118–119); 8 Swept SA Measurement > AMPTD > Scale/Div (p.563); View/Display > Display Line (p.960) / Annotation (p.956)"
    steps:
      - send: ":DISP:ENAB OFF"
      - query: ":DISP:ENAB?"
        expect: "0"
      - send: ":DISP:WIND:TRAC:Y:PDIV 5 dB"
      - query: ":DISP:WIND:TRAC:Y:PDIV?"
        expect: "+5.00000000E+000"
      - send: ":DISP:WIND:TRAC:Y:DLIN -40 dBm"
      - query: ":DISP:WIND:TRAC:Y:DLIN?"
        expect: "-4.00000000E+001"
      - send: ":DISP:WIND:TRAC:Y:DLIN:STAT ON"
      - query: ":DISP:WIND:TRAC:Y:DLIN:STAT?"
        expect: "1"
      - send: ":DISP:ANN:TRAC OFF"
      - query: ":DISP:ANN:TRAC?"
        expect: "0"

  - name: "未实现的命令回复 -113：前置放大、零跨度以外的测量应用、标记 STATe"
    manual: "8 Swept SA Measurement > AMPTD > Internal Preamp (p.555); 3 Programming the Analyzer > List of SCPI Commands (p.131–174)"
    steps:
      - send: ":POW:GAIN ON"
      - query: ":SYST:ERR?"
        expect_match: '^-113,"Undefined header;not implemented in this definition"'
      - send: ":CONF:ACP"
      - query: ":SYST:ERR?"
        expect_match: '^-113,.*'
      - send: ":CALC:MARK:STAT ON"
      - query: ":SYST:ERR?"
        expect_match: '^-113,.*'
