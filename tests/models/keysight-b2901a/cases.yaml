# Keysight B2901A 的手册用例：Agilent B2900 Series SCPI Command Reference
# （B2910-90030, Edition 2, July 2011）的命令条目、参数与回复格式；前面板与量程说明见
# User's Guide（B2910-90010, Edition 6, March 2019）。
# 测试台 examples/benches/keysight_b2901a.bench.yaml：1 kΩ DUT。电压源读数 I = V/1 kΩ，
# 电流源读数 V = I × 1 kΩ；读数 6 位尾数（+1.000000E+00）。每个用例在刚上电的测试台上运行。
model: keysight-b2901a
bench: ../../../examples/benches/keysight_b2901a.bench.yaml
instrument: smu
cases:
  - name: "*IDN? 按手册返回厂商、型号、序列号与固件；*RST 恢复初始设置"
    manual: "Common Commands > *IDN? / *RST；SOURce、SENSe、OUTPut、TRIGger 各命令的 Reset setting"
    steps:
      - query: "*IDN?"
        expect: "Agilent Technologies,B2901A,MY59000001,1.0.0"
      - send: "*RST"
      - query: ":SOUR:FUNC:MODE?"
        expect: "VOLT"
      - query: ":SOUR:VOLT?"
        expect: "+0.000000E+00"
      - query: ":SOUR:CURR?"
        expect: "+0.000000E+00"
      - query: ":SOUR:VOLT:MODE?"
        expect: "FIX"
      - query: ":SOUR:VOLT:RANG?"
        expect: "+2.000000E+00"
      - query: ":SOUR:VOLT:RANG:AUTO?"
        expect: "1"
      - query: ":SOUR:CURR:RANG?"
        expect: "+1.000000E-04"
      - query: ":SOUR:CURR:RANG:AUTO?"
        expect: "1"
      - query: ":SENS:VOLT:NPLC?"
        expect: "+1.000000E-01"
      - query: ":SENS:VOLT:RANG:AUTO?"
        expect: "1"
      - query: ":SENS:CURR:RANG:AUTO?"
        expect: "1"
      - query: ":SENS:CURR:PROT?"
        expect: "+1.000000E-04"
      - query: ":SENS:VOLT:PROT?"
        expect: "+2.000000E+00"
      - query: ":OUTP?"
        expect: "0"
      - query: ":SENS:REM?"
        expect: "0"
      - query: ":TRIG:SOUR?"
        expect: "AINT"
      - query: ":TRIG:COUN?"
        expect: "1"
      - query: ":TRIG:DEL?"
        expect: "+0.000000E+00"
      - query: ":SYST:LFR?"
        expect: "50"
      - query: ":DISP:ENAB?"
        expect: "1"
      - query: ":SYST:BEEP:STAT?"
        expect: "1"
      - query: ":SYST:ERR?"
        expect: '+0,"No error"'

  - name: "电压源：设定 1 V，输出电流按 1 kΩ 为 1 mA；两级合规查询"
    manual: "SOURce Subsystem > [:SOURce]:VOLTage[:LEVel]；SENSe Subsystem > PROTection[:LEVel] / TRIPped?"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT"
      - send: ":SOUR:VOLT 1"
      - send: ":SENS:CURR:PROT 0.01"
      - send: ":OUTP ON"
      - query: ":MEAS:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档,specs.noise_ppm_of_range,#744)
      - query: ":MEAS:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档)
      - query: ":SENS:CURR:PROT:TRIP?"
        expect: "0"
      - query: ":SENS:VOLT:PROT:TRIP?"
        expect: "0"
      - query: ":OUTP?"
        expect: "1"
      - send: ":OUTP OFF"
      - query: ":OUTP?"
        expect: "0"

  - name: "电流源：设定 1 mA，端电压按 1 kΩ 为 1 V"
    manual: "SOURce Subsystem > [:SOURce]:CURRent[:LEVel]；[:SOURce]:FUNCtion:MODE"
    steps:
      - send: ":SOUR:FUNC:MODE CURR"
      - send: ":SOUR:CURR 0.001"
      - send: ":SENS:VOLT:PROT 10"
      - send: ":OUTP ON"
      - query: ":MEAS:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档,#744)
      - query: ":MEAS:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档)
      - query: ":SENS:VOLT:PROT:TRIP?"
        expect: "0"

  - name: "合规限值：5 V 源、1 mA 限值，1 kΩ 上转 CC，端电压 1 V"
    manual: "SENSe Subsystem > [:SENSe]:CURRent[:DC]:PROTection[:LEVel] / :TRIPped?（D34 限值切换）"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 5"
      - send: ":SENS:CURR:PROT 0.001"
      - send: ":OUTP ON"
      - query: ":MEAS:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档,#744)
      - query: ":MEAS:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档)
      - query: ":SENS:CURR:PROT:TRIP?"
        expect: "1"
      - send: ":OUTP OFF"

  - name: "源量程与自动量程：手动量程关闭自动量程；切换后查询保持"
    manual: "SOURce Subsystem > [:SOURce]:<CURRent|VOLTage>:RANGe / :RANGe:AUTO"
    steps:
      - send: ":SOUR:VOLT:RANG:AUTO OFF"
      - send: ":SOUR:VOLT:RANG 20"
      - query: ":SOUR:VOLT:RANG?"
        expect: "+2.000000E+01"
      - query: ":SOUR:VOLT:RANG:AUTO?"
        expect: "0"
      - query: ":SOUR:CURR:RANG?"  # the voltage range did not move the current one
        expect: "+1.000000E-04"
      - query: ":SOUR:CURR:RANG:AUTO?"
        expect: "1"
      - send: ":SOUR:VOLT:RANG:AUTO ON"
      - query: ":SOUR:VOLT:RANG:AUTO?"
        expect: "1"
      - query: ":SOUR:VOLT:RANG?"
        expect: "+2.000000E+01"
      - send: ":SOUR:CURR:RANG 0.01"
      - query: ":SOUR:CURR:RANG?"
        expect: "+1.000000E-02"
      - query: ":SOUR:CURR:RANG:AUTO?"
        expect: "0"
      - query: ":SOUR:VOLT:RANG?"  # and the current range did not move the voltage one
        expect: "+2.000000E+01"
      - query: ":SOUR:VOLT:RANG:AUTO?"
        expect: "1"
      - send: ":SOUR:CURR:RANG:AUTO ON"

  - name: "测量量程与自动量程"
    manual: "SENSe Subsystem > [:SENSe]:<CURRent|VOLTage>[:DC]:RANGe[:UPPer] / :RANGe:AUTO"
    steps:
      - send: ":SENS:CURR:RANG 0.01"
      - query: ":SENS:CURR:RANG?"
        expect: "+1.000000E-02"
      - query: ":SENS:CURR:RANG:AUTO?"
        expect: "0"
      - send: ":SENS:VOLT:RANG 20"
      - query: ":SENS:VOLT:RANG?"
        expect: "+2.000000E+01"
      - send: ":SENS:VOLT:RANG:AUTO ON"
      - query: ":SENS:VOLT:RANG:AUTO?"
        expect: "1"

  - name: "NPLC 对所有测量项共同生效；线频率 50/60 Hz；超范围报 -222"
    manual: "SENSe Subsystem > :NPLCycles / NPLCycles?；SYSTem Subsystem > :LFRequency"
    steps:
      - send: ":SENS:VOLT:NPLC 1"
      - query: ":SENS:VOLT:NPLC?"
        expect: "+1.000000E+00"
      - query: ":SENS:CURR:NPLC?"
        expect: "+1.000000E+00"
      - query: ":SENS:RES:NPLC?"
        expect: "+1.000000E+00"
      - send: ":SYST:LFR 60"
      - query: ":SYST:LFR?"
        expect: "60"
      - send: ":SYST:LFR 50"
      - send: ":SENS:VOLT:NPLC 200"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SENS:CURR:PROT 5"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SOUR:VOLT 300"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":SOUR:CURR 5"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'
      - send: ":TRIG:COUN 0"
      - query: ":SYST:ERR?"
        expect: '-222,"Data out of range"'

  - name: "线性阶梯扫描：5 点 0…2 V，读数按 1 kΩ 为 0…2 mA"
    manual: "SOURce Subsystem > [:SOURce]:VOLTage:MODE / :STARt / :STOP / :POINts；TRIGger Subsystem > INITiate"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SENS:CURR:PROT 0.01;:OUTP ON"
      - send: ":SOUR:VOLT:MODE SWE"
      - send: ":SOUR:VOLT:STAR 0;:SOUR:VOLT:STOP 2;:SOUR:VOLT:POIN 5"
      - query: ":SOUR:VOLT:MODE?"
        expect: "SWE"
      - query: ":SOUR:VOLT:STAR?"
        expect: "+0.000000E+00"
      - query: ":SOUR:VOLT:STOP?"
        expect: "+2.000000E+00"
      - query: ":SOUR:VOLT:POIN?"
        expect: "5"
      - query: ":SOUR:SWE:POIN?"
        expect: "5"
      - send: ":INIT"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:POIN:ACT?"
        expect: "5"
      - query: ":FETC:ARR:VOLT?"
        # 读数带噪（specs.noise_ppm_of_range，#744）：各点按其自动量程的 4σ 包络
        expect_match: '^[+-][0-9]\.[0-9]{6}E-(?:0[6-9]|1[0-9]),[+-](?:4\.999[0-9]{3}E-01|5\.000[0-9]{3}E-01),[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:1\.499[0-9]{3}E\+00|1\.500[0-1][0-9]{2}E\+00),[+-](?:1\.999[0-9]{3}E\+00|2\.000[0-1][0-9]{2}E\+00)$'
      - query: ":FETC:ARR:CURR?"
        expect_match: '^[+-][0-9]\.[0-9]{6}E-1[2-9],[+-](?:4\.999[5-9][0-9]{2}E-04|5\.000[0-4][0-9]{2}E-04),[+-](?:9\.999[5-9][0-9]{2}E-04|1\.0000[0-4][0-9]E-03),[+-](?:1\.499[5-9][0-9]{2}E-03|1\.500[0-4][0-9]{2}E-03),[+-](?:1\.999[5-9][0-9]{2}E-03|2\.000[0-4][0-9]{2}E-03)$'
      - query: ":TRAC:DATA?"
        expect_match: '^[+-][0-9]\.[0-9]{6}E[+-][0-9]{2}(,[+-][0-9]\.[0-9]{6}E[+-][0-9]{2}){29}$'
      - send: ":TRAC:CLE"
      - query: ":TRAC:POIN:ACT?"
        expect: "0"
      - send: ":SOUR:VOLT:MODE FIX"

  - name: "触发计数 3：每次触发一个读数，缓冲区保留 3 条"
    manual: "TRIGger Subsystem > [:TRIGger]:COUNt；INITiate[:IMMediate]；TRACe Subsystem > :POINts:ACTual?"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON"
      - send: ":TRIG:COUN 3"
      - query: ":TRIG:COUN?"
        expect: "3"
      - send: ":INIT"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:POIN:ACT?"
        expect: "3"
      - query: ":SYST:DATA:QUAN?"
        expect: "3"
      - query: ":FETC:ARR:VOLT?"
        expect_match: '^[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00)$'
      - send: ":TRAC:CLE"
      - query: ":TRAC:POIN:ACT?"
        expect: "0"

  - name: "总线触发：INIT 等待，*TRG 触发一次；不在等待时 *TRG 报 -211"
    manual: "TRIGger Subsystem > :SOURce[:SIGNal]；Common Commands > *TRG；*OPC?"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON"
      - send: ":TRIG:SOUR BUS"
      - query: ":TRIG:SOUR?"
        expect: "BUS"
      - send: ":INIT"
      - query: ":TRAC:POIN:ACT?"
        expect: "0"
      - send: "*TRG"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:POIN:ACT?"
        expect: "1"
      - query: ":FETC:ARR:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档,#744)
      - send: "*TRG"
      - query: ":SYST:ERR?"
        expect: '-211,"Trigger ignored"'
      - send: ":TRIG:SOUR AINT"

  - name: "ACQuire/TRANsient 触发别名：源、计数、延迟写入同一触发模型"
    manual: "TRIGger Subsystem > :TRIGger<:ACQuire|:TRANsient|[:ALL]>:SOURce / :COUNt / :DELay"
    steps:
      - send: ":TRIG:ACQ:SOUR BUS"
      - query: ":TRIG:ACQ:SOUR?"
        expect: "BUS"
      - send: ":TRIG:TRAN:SOUR BUS"
      - query: ":TRIG:TRAN:SOUR?"
        expect: "BUS"
      - query: ":TRIG:SOUR?"
        expect: "BUS"
      - send: ":TRIG:TRAN:COUN 2"
      - query: ":TRIG:TRAN:COUN?"
        expect: "2"
      - query: ":TRIG:ACQ:COUN?"
        expect: "2"
      - send: ":TRIG:TRAN:DEL 0.01"
      - query: ":TRIG:TRAN:DEL?"
        expect: "+1.000000E-02"
      - query: ":TRIG:ACQ:DEL?"
        expect: "+1.000000E-02"
      - send: ":TRIG:ACQ:SOUR AINT"

  - name: "测量读数：MEASure（全部元素）、MEASure 单元素、READ:ARRay 各元素"
    manual: "MEASure Subsystem > :MEASure? / :MEASure:<CURRent|RESistance|VOLTage>?；READ Subsystem > :READ:ARRay:<CURRent|...>?"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON"
      - query: ":MEAS?"
        expect_match: '^[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[5-9][0-9]{2}E-04|1\.0000[0-4][0-9]E-03),[+-][0-9]\.[0-9]{6}E[+-][0-9]{2},\+8\.405000E-03,\+0\.000000E\+00,\+1\.000000E\+00$'
      - query: ":MEAS:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档,#744)
      - query: ":MEAS:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档)
      - query: ":MEAS:RES?"
        expect_value: 1000.0
        tolerance: 0.1  # V/I of the noisy readings (#846): rel 4σ = 6.7e-5 → 0.067 Ω
      - query: ":READ:ARR:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档)
      - query: ":READ:ARR:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档)
      - query: ":READ:ARR:RES?"
        expect_value: 1000.0
        tolerance: 0.1  # V/I of the noisy readings (#846): rel 4σ = 6.7e-5 → 0.067 Ω
      - query: ":READ:ARR:TIME?"
        expect: "+8.405000E-03"
      - query: ":READ:ARR:STAT?"
        expect: "+0.000000E+00"
      - query: ":READ:ARR?"
        expect_match: '^[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[5-9][0-9]{2}E-04|1\.0000[0-4][0-9]E-03),[+-][0-9]\.[0-9]{6}E[+-][0-9]{2},\+8\.405000E-03,\+0\.000000E\+00,\+1\.000000E\+00$'

  - name: "FETCh 取本次运行的数据（数组与单元素）"
    manual: "FETCh Subsystem > :FETCh:ARRay? / :FETCh:ARRay:<CURRent|RESistance|STATus|TIME|VOLTage>?"
    steps:
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON"
      - send: ":INIT"
      - query: "*OPC?"
        expect: "1"
      - query: ":FETC:ARR:VOLT?"
        expect_value: 1.0
        tolerance: 1.0e-4  # 4σ(2 V 档,#744)
      - query: ":FETC:ARR:CURR?"
        expect_value: 0.001
        tolerance: 1.0e-7  # 4σ(1 mA 档)
      - query: ":FETC:ARR:RES?"
        expect_value: 1000.0
        tolerance: 0.1  # V/I of the noisy readings (#846): rel 4σ = 6.7e-5 → 0.067 Ω
      - query: ":FETC:ARR:TIME?"
        expect: "+8.405000E-03"
      - query: ":FETC:ARR:STAT?"
        expect: "+0.000000E+00"
      - query: ":FETC:ARR?"
        expect_match: '^[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[5-9][0-9]{2}E-04|1\.0000[0-4][0-9]E-03),[+-][0-9]\.[0-9]{6}E[+-][0-9]{2},\+8\.405000E-03,\+0\.000000E\+00,\+1\.000000E\+00$'

  - name: "读数元素：*RST 为六个（含 SOUR）；FORM:ELEM:SENS 选择元素，顺序固定（#252）"
    manual: "FORMat Subsystem > :FORMat:ELEMents:SENSe（p.2-41）；FETCh Subsystem > :FETCh:ARRay?"
    steps:
      - query: ":FORM:ELEM:SENS?"
        expect: "VOLT,CURR,RES,TIME,STAT,SOUR"
      - send: ":FORM:ELEM:SENS CURR,VOLT"
      - query: ":FORM:ELEM:SENS?"
        expect: "VOLT,CURR"
      - send: ":SOUR:FUNC:MODE VOLT;:SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON"
      - query: ":MEAS?"
        expect_match: '^[+-](?:9\.999[0-9]{3}E-01|1\.0000[0-9]{2}E\+00),[+-](?:9\.999[5-9][0-9]{2}E-04|1\.0000[0-4][0-9]E-03)$'
      - send: ":FORM:ELEM:SENS SOUR"
      - query: ":READ:ARR?"
        expect: "+1.000000E+00"
      - send: ":FORM:ELEM:SENS POW"
      - query: ":SYST:ERR?"
        expect: '-224,"Illegal parameter value"'
      - send: "*RST"
      - query: ":FORM:ELEM:SENS?"
        expect: "VOLT,CURR,RES,TIME,STAT,SOUR"

  - name: "远端检测设置保存并回读"
    manual: "SENSe Subsystem > :REMote"
    steps:
      - query: ":SENS:REM?"
        expect: "0"
      - send: ":SENS:REM ON"
      - query: ":SENS:REM?"
        expect: "1"
      - send: ":SENS:REM OFF"
      - query: ":SENS:REM?"
        expect: "0"

  - name: "公共命令与状态寄存器：*CLS、*ESE、*ESR?、*SRE、*STB?、*TST?、*WAI、*OPC"
    manual: "Common Commands > *CLS / *ESE / *ESR? / *SRE / *STB? / *TST? / *WAI / *OPC"
    steps:
      - send: "*CLS"
      - send: "*ESE 1;*SRE 32"
      - query: "*ESE?"
        expect: "1"
      - query: "*SRE?"
        expect: "32"
      - query: "*ESR?"
        expect: "0"
      - query: "*STB?"
        expect: "0"
      - send: "NONSUCH"
      - query: "*STB?"
        expect: "4"
      - query: "*ESR?"
        expect: "32"
      - query: ":SYST:ERR?"
        expect: '-113,"Undefined header;not implemented in this definition"'
      - query: "*TST?"
        expect: "0"
      - send: "*WAI"
      - query: "*OPC?"
        expect: "1"
      - send: "*OPC"
      - query: "*OPC?"
        expect: "1"

  - name: "显示、蜂鸣、接口与系统配置类命令保存并回读（不影响测量）"
    manual: "DISPlay Subsystem；SYSTem Subsystem > BEEPer / FAN / COMMunicate；LXI Subsystem > IDENtify；FORMat Subsystem > [:DATA]"
    steps:
      - send: ":DISP:ENAB OFF"
      - query: ":DISP:ENAB?"
        expect: "0"
      - send: ":DISP:DIG 4"
      - query: ":DISP:DIG?"
        expect: "4"
      - send: ":DISP:VIEW GRAP"
      - query: ":DISP:VIEW?"
        expect: "GRAP"
      - send: ":DISP:CSET 2"
      - query: ":DISP:CSET?"
        expect: "2"
      - send: ":DISP:ZOOM ON"
      - query: ":DISP:ZOOM?"
        expect: "1"
      - send: ":SYST:BEEP:STAT OFF"
      - query: ":SYST:BEEP:STAT?"
        expect: "0"
      - send: ":SYST:FAN:MODE RACK"
      - query: ":SYST:FAN:MODE?"
        expect: "RACK"
      - send: ":SYST:COMM:GPIB:ADDR 17"
      - query: ":SYST:COMM:GPIB:ADDR?"
        expect: "17"
      - send: ":SYST:COMM:LAN:DHCP OFF"
      - query: ":SYST:COMM:LAN:DHCP?"
        expect: "0"
      - send: ":LXI:IDEN ON"
      - query: ":LXI:IDEN?"
        expect: "1"
      - send: ":FORM ASC"
      - query: ":FORM?"
        expect: "ASC"
      - send: ":SOUR:FUNC:SHAP DC"
      - query: ":SOUR:FUNC:SHAP?"
        expect: "DC"
      - query: ":SYST:VERS?"
        expect: "1999.0"
      - query: ":SYST:INT:TRIP?"
        expect: "0"

  - name: "定义范围外的命令回复 -113 not implemented in this definition"
    manual: "docs/real-models.md 2；Command Reference > 未建模的 PULSe、FUNCtion 等子系统"
    steps:
      - send: ":SOUR:PULS:WIDT 1E-3"
      - query: ":SYST:ERR?"
        expect: '-113,"Undefined header;not implemented in this definition"'
      - send: ":SENS:FUNC \"CURR\""
      - query: ":SYST:ERR?"
        expect: '-113,"Undefined header;not implemented in this definition"'
      - send: ":SOUR:CURR:MODE SWE"
      - query: ":SYST:ERR?"
        expect: '-113,"Undefined header;not implemented in this definition"'

  - name: "ABORt 停止等待中的运行；INITiate:ACQuire 与 INITiate 等价"
    manual: "TRIGger Subsystem > :ABORt<:ACQuire|:TRANsient|[:ALL]> / :INITiate[:IMMediate]"
    steps:
      - send: ":SOUR:VOLT 1;:SENS:CURR:PROT 0.01;:OUTP ON;:TRIG:SOUR BUS"
      - send: ":INIT"
      - send: ":ABOR"
      - send: "*TRG"
      - query: ":SYST:ERR?"
        expect: '-211,"Trigger ignored"'
      - send: ":INIT:ACQ"
      - send: ":ABOR:ACQ"
      - send: "*TRG"
      - query: ":SYST:ERR?"
        expect: '-211,"Trigger ignored"'
      - send: ":TRIG:SOUR AINT"
      - send: ":INIT:ACQ"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRAC:POIN:ACT?"
        expect: "1"

  - name: "状态系统：错误队列计数与全部读取、日期与时间（引擎内置）"
    manual: "SYSTem Subsystem > :SYSTem:ERRor:COUNt? / :SYSTem:ERRor:ALL? / :SYSTem:DATE / :SYSTem:TIME"
    steps:
      - send: ":TRIG:COUN 0"
      - query: ":SYST:ERR:COUN?"
        expect: "1"
      - query: ":SYST:ERR:ALL?"
        expect: '-222,"Data out of range"'
      - query: ":SYST:DATE?"
        expect_match: '^[0-9]{4},[0-9]{2},[0-9]{2}$'
      - query: ":SYST:TIME?"
        expect_match: '^[0-9]{2},[0-9]{2},[0-9]{2}\.[0-9]{3}$'
