  - name: "双音三阶交调：1000/1001 MHz 各 -20 dBm 在混频器处，999 与 1002 MHz 的产物为 3P - 2·TOI"
    manual: "Data Sheet 5990-8119EN p.4 > Third-order intermodulation (TOI), preamp off, 0 dB RF attenuation: 300 MHz to 3 GHz +13 dBm nominal"
    # 两台信号源各设 -16.48 dBm，共用 RF_IN 的节点后各 -20.0 dBm；0 dB 衰减，混频器处同样 -20 dBm。
    # 三阶产物 3·(-20) - 2·13 = -86.0 dBm。压缩（P1dB 0 dBm，第 4 页）使每个音低 0.03 dB。RBW 100 Hz 使
    # 接收机噪声（-117.5 dBm）在产物下 31 dB；采样检波、平均 100 次，噪声对线读数的影响 < 0.1 dB。
    steps:
      - {instrument: awg, send: "C1:OUTP OFF"}
      - {instrument: sg1, send: ":POW -16.48"}
      - {instrument: sg2, send: ":POW -16.48"}
      - {instrument: sg1, send: ":OUTP ON"}
      - {instrument: sg2, send: ":OUTP ON"}
      - send: ":FREQ:CENT 1000.5 MHz"
      - send: ":FREQ:SPAN 5 MHz"
      - send: ":POW:ATT 0"
      - send: ":BAND 100"
      - send: ":DET SAMP"
      - send: ":AVER:COUN 100"
      - send: ":TRAC:MODE AVER"
      - send: ":INIT:CONT OFF"
      - send: ":INIT:IMM;*WAI"
      - send: ":CALC:MARK:X 1000 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -20.03
        tolerance: 0.05
      - send: ":CALC:MARK:X 999 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -86.0
        tolerance: 0.2
      - send: ":CALC:MARK:X 1002 MHz"
      - query: ":CALC:MARK:Y?"
        expect_value: -86.0
        tolerance: 0.2
