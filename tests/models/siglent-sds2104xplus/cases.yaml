# Manual cases for the Siglent SDS2104X Plus: SDS Series Programming Guide EN11F.
# Numbers come back with 3 significant digits (:FORMat:DATA default), booleans as ON/OFF and
# enumerations as the manual writes them (e.g. RISing, FMDepth, AVERage,16).
model: siglent-sds2104xplus
bench: bench.yaml
instrument: scope
cases:
  - name: "*IDN? 返回 Siglent Technologies、型号、14 位序列号与固件"
    manual: "Common (*) Commands > *IDN"
    steps:
      - query: "*IDN?"
        expect_match: '^Siglent Technologies,SDS2104X Plus,[A-Z0-9]{14},\S+$'
  - name: "*OPC? 返回 1"
    manual: "Common (*) Commands > *OPC"
    steps:
      - query: "*OPC?"
        expect: "1"
  - name: "*RST 恢复默认设置"
    manual: "Common (*) Commands > *RST"
    steps:
      - send: ":CHANnel1:SCALe 2.00E-01;:TRIGger:MODE NORMal"
      - send: "*RST"
      - query: ":CHANnel1:SCALe?"
        expect: "1.00E+00"
      - query: ":TRIGger:MODE?"
        expect: "AUTO"
      - query: ":CHANnel2:SWITch?"
        expect: "OFF"
  - name: "带宽限制 20M"
    manual: "CHANnel Commands > :CHANnel<n>:BWLimit"
    steps:
      - send: ":CHANnel1:BWLimit 20M"
      - query: "CHAN1:BWL?"
        expect: "20M"
  - name: "耦合 AC"
    manual: "CHANnel Commands > :CHANnel<n>:COUPling"
    steps:
      - send: "CHAN1:COUP AC"
      - query: "CHAN1:COUP?"
        expect: "AC"
  - name: "输入阻抗按长格式返回"
    manual: "CHANnel Commands > :CHANnel<n>:IMPedance"
    steps:
      - send: "CHAN2:IMP FIFT"
      - query: ":CHANnel2:IMPedance?"
        expect: "FIFTy"
      - send: "CHAN2:IMP ONEM"
      - query: "CHAN2:IMP?"
        expect: "ONEMeg"
  - name: "偏置 -3.8 V（3 位有效数字）"
    manual: "CHANnel Commands > :CHANnel<n>:OFFSet"
    steps:
      - send: ":CHANnel2:OFFSet -3.8E+00"
      - query: "CHAN2:OFFS?"
        expect: "-3.80E+00"
  - name: "探头 100:1；DEFault 回到 1X"
    manual: "CHANnel Commands > :CHANnel<n>:PROBe"
    steps:
      - send: ":CHANnel1:PROBe VALue,1.00E+02"
      - query: "CHAN1:PROB?"
        expect: "1.00E+02"
      - send: "CHAN1:PROB DEF"
      - query: "CHAN1:PROB?"
        expect: "1.00E+00"
  - name: "垂直档位 50 mV/div；10:1 探头时返回 0.5"
    manual: "CHANnel Commands > :CHANnel<n>:SCALe"
    steps:
      - send: ":CHANnel1:SCALe 5.00E-02"
      - query: "CHAN1:SCAL?"
        expect: "5.00E-02"
      - send: "CHAN1:PROB VAL,10"
      - query: "CHAN1:SCAL?"
        expect: "5.00E-01"
  - name: "通道开关"
    manual: "CHANnel Commands > :CHANnel<n>:SWITch"
    steps:
      - send: ":CHANnel1:SWITch ON"
      - query: "CHAN1:SWIT?"
        expect: "ON"
  - name: "通道偏斜、单位、可见性、垂直参考被接受"
    manual: "CHANnel Commands > :CHANnel<n>:SKEW, :CHANnel<n>:UNIT, :CHANnel<n>:VISible, :CHANnel:REFerence"
    steps:
      - send: ":CHANnel1:SKEW 1.52E-09"
      - query: "CHAN1:SKEW?"
        expect: "1.52E-09"
      - send: ":CHANnel1:UNIT A"
      - query: "CHAN1:UNIT?"
        expect: "A"
      - send: ":CHANnel1:VISible OFF"
      - query: "CHAN1:VIS?"
        expect: "OFF"
      - send: "CHAN:REF OFFS"
      - query: "CHAN:REF?"
        expect: "OFFSet"
  - name: "采集设置被接受并按手册格式返回"
    manual: "ACQUire Commands > :ACQuire:AMODe, :ACQuire:INTerpolation, :ACQuire:MMANagement, :ACQuire:MODE"
    steps:
      - send: "ACQ:AMOD FAST"
      - query: "ACQ:AMOD?"
        expect: "FAST"
      - send: "ACQ:INT ON"
      - query: "ACQ:INT?"
        expect: "ON"
      - send: "ACQ:MMAN FMD"
      - query: "ACQ:MMAN?"
        expect: "FMDepth"
      - send: "ACQ:MODE YT"
      - query: "ACQ:MODE?"
        expect: "YT"
  - name: "存储深度决定记录长度与采样率"
    manual: "ACQUire Commands > :ACQuire:MDEPth, :ACQuire:POINts, :ACQuire:SRATe"
    steps:
      - send: "TIM:SCAL 1E-3;:ACQ:MDEP 100k"
      - query: "ACQ:MDEP?"
        expect: "100k"
      - query: "ACQ:SRAT?"
        expect: "1.00E+07"
      - query: "ACQ:POIN?"
        expect: "1.00E+05"
  - name: "10 位分辨率"
    manual: "ACQUire Commands > :ACQuire:RESolution"
    steps:
      - send: ":ACQuire:RESolution 10Bits"
      - query: "ACQ:RES?"
        expect: "10Bits"
  - name: "平均 16 次"
    manual: "ACQUire Commands > :ACQuire:TYPE"
    steps:
      - send: "ACQ:TYPE AVER,16"
      - query: "ACQ:TYPE?"
        expect: "AVERage,16"
      - send: "ACQ:TYPE NORM"
      - query: "ACQ:TYPE?"
        expect: "NORMal"
  - name: "时基 100 ns/div 与 10 us 延迟"
    manual: "TIMebase Commands > :TIMebase:SCALe, :TIMebase:DELay"
    steps:
      - send: ":TIMebase:SCALe 1.00E-07"
      - query: "TIM:SCAL?"
        expect: "1.00E-07"
      - send: "TIM:SCAL 1E-5;:TIMebase:DELay 1.00E-05"
      - query: "TIM:DEL?"
        expect: "1.00E-05"
  - name: "水平参考策略被接受"
    manual: "TIMebase Commands > :TIMebase:REFerence, :TIMebase:REFerence:POSition"
    steps:
      - send: "TIM:REF DEL"
      - query: "TIM:REF?"
        expect: "DELay"
      - send: "TIM:REF:POS 20"
      - query: "TIM:REF:POS?"
        expect: "20"
  - name: "边沿触发：类型、耦合、电平、斜率、信源"
    manual: "TRIGger Commands > :TRIGger:TYPE, :TRIGger:EDGE Commands"
    steps:
      - send: ":TRIGger:TYPE EDGE"
      - query: "TRIG:TYPE?"
        expect: "EDGE"
      - send: ":TRIGger:EDGE:COUPling DC"
      - query: "TRIG:EDGE:COUP?"
        expect: "DC"
      - send: ":TRIGger:EDGE:LEVel 5.00E-01"
      - query: "TRIG:EDGE:LEV?"
        expect: "5.00E-01"
      - send: "TRIG:EDGE:SLOP RIS"
      - query: "TRIG:EDGE:SLOP?"
        expect: "RISing"
      - send: "TRIG:EDGE:SOUR C1"
      - query: "TRIG:EDGE:SOUR?"
        expect: "C1"
  - name: "单次采集触发后停止；运行与停止"
    manual: "TRIGger Commands > :TRIGger:MODE, :TRIGger:STATus, :TRIGger:STOP, :TRIGger:RUN"
    steps:
      - send: "TIM:SCAL 1E-3;:CHAN1:SCAL 0.5"
      # 单次采集在虚拟时间中完成：触发后的记录未填满时状态为 Ready；运行中的最后一帧算一次采集。
      - send: ":TRIGger:MODE SINGle"
      - query: ":TRIGger:STATus?"
        expect: "Ready"
      - query: "*OPC?"
        expect: "1"
      - query: ":TRIGger:STATus?"
        expect: "Stop"
      - query: "ACQ:NUMA?"
        expect: "2"
      - send: ":TRIGger:MODE NORMal"
      - query: "TRIG:MODE?"
        expect: "NORMal"
      - query: "TRIG:STAT?"
        expect: "Trig'd"
      - send: ":TRIGger:STOP"
      - query: "TRIG:STAT?"
        expect: "Stop"
      - send: ":TRIGger:RUN"
      - query: "TRIG:STAT?"
        expect: "Trig'd"
  - name: "波形传输参数"
    manual: "WAVeform Commands > :WAVeform:SOURce, :WAVeform:STARt, :WAVeform:INTerval, :WAVeform:POINt, :WAVeform:MAXPoint, :WAVeform:WIDTh"
    steps:
      - send: ":WAVeform:SOURce C2"
      - query: "WAV:SOUR?"
        expect: "C2"
      - send: ":WAVeform:STARt 1000"
      - query: "WAV:STAR?"
        expect: "1000"
      - send: ":WAVeform:INTerval 200"
      - query: "WAV:INT?"
        expect: "200"
      - send: ":WAVeform:POINt 20000"
      - query: "WAV:POIN?"
        expect: "20000"
      - query: ":WAV:MAXPoint?"
        expect: "10000000"
      - send: ":WAVeform:WIDTh BYTE"
      - query: "WAV:WIDT?"
        expect: "BYTE"
  - name: "波形描述块：#9 头与 WAVEDESC"
    manual: "WAVeform Commands > :WAVeform:PREamble (Table 1)"
    steps:
      - send: "TIM:SCAL 1E-3;:TRIG:MODE SINGle;:WAV:SOUR C1"
      - query: ":WAVeform:PREamble?"
        binary: true
        expect_match: '^#9000000346WAVEDESC.{8}WAVEACE.*Siglent SDS.*\n\n$'
  - name: "波形数据：块头按实际长度给出位数，并以 0A 0A 结束"
    manual: "WAVeform Commands > :WAVeform:DATA"
    steps:
      - send: "TIM:SCAL 1E-3;:TRIG:MODE SINGle;:WAV:SOUR C1;:WAV:WIDT BYTE"
      - query: ":WAVeform:DATA?"
        binary: true
        expect_match: '^#510000.{10000}\n\n$'
  - name: "简单测量：峰峰值与频率"
    manual: "MEASure Commands > :MEASure, :MEASure:MODE, :MEASure:SIMPle:SOURce, :MEASure:SIMPle:VALue"
    steps:
      - send: ":MEASure ON;:MEASure:MODE SIMPle;:MEASure:SIMPle:SOURce C1"
      - query: "MEAS?"
        expect: "ON"
      - query: "MEAS:MODE?"
        expect: "SIMPle"
      - query: "MEAS:SIMP:SOUR?"
        expect: "C1"
      - send: "TIM:SCAL 1E-3;:CHAN1:SCAL 0.5"
      - query: "MEAS:SIMP:VAL? PKPK"
        expect: "2.00E+00"
      - query: "MEAS:SIMP:VAL? FREQ"
        expect: "1.00E+03"
  - name: "没有建模的命令回复 -113（自动设置）"
    manual: "Root(:) Commands > :AUToset"
    steps:
      - send: ":AUToset"
      - query: "*OPC?"
        expect: "1"
