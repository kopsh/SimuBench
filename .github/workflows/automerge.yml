# Every non-draft pull request merges itself once the required CI checks pass (no review).
# Needs: Settings → General → "Allow auto-merge", and a rule on main requiring the CI checks.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash --delete-branch "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
