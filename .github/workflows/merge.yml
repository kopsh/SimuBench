# Merge a pull request into main once CI has passed on it: no review, and no repository settings
# needed (it does not rely on branch protection). Drafts are left alone, and so is a pull request
# whose head does not contain the latest main: two that each pass on an older main can break main
# together, so it is merged only after main has been merged into it and CI has passed again.
name: Merge when CI passes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          for n in $(jq -r '.workflow_run.pull_requests[] | select(.base.ref == "main") | .number' "$GITHUB_EVENT_PATH"); do
            if [ "$(gh pr view "$n" --repo "$REPO" --json isDraft -q .isDraft)" = true ]; then continue; fi
            behind=$(gh api "repos/$REPO/compare/main...$SHA" -q .behind_by)
            if [ "$behind" != 0 ]; then
              gh pr comment "$n" --repo "$REPO" --body "main has $behind commit(s) this branch does not contain: merge the latest main into it and push; it merges once CI passes again (AGENTS.md)."
              continue
            fi
            # Only the commit CI tested: a newer push waits for its own CI run.
            gh pr merge "$n" --repo "$REPO" --squash --delete-branch --match-head-commit "$SHA"
            # A merge by the workflow token is skipped by GitHub's closing-keyword step, so Closes
            # #n in the description closes nothing: close the issues the pull request lists itself.
            for i in $(gh pr view "$n" --repo "$REPO" --json closingIssuesReferences -q '.closingIssuesReferences[]?.number'); do
              gh issue close "$i" --repo "$REPO" --comment "Closed by #$n"
            done
            # The merge's push starts no workflow (it is the workflow token's): run main's checks now.
            gh workflow run ci.yml --repo "$REPO" --ref main
          done
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
