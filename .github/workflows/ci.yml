# Pull requests run the fast checks only (ubuntu: Python and web); merge.yml merges on them. The slow
# ones (Windows, the wheel, end-to-end and visual tests) run after a merge, on main, and do not hold
# up merging: when one is red on main, fixing it is the next task.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests acceptance refcalc
      - run: uv run ruff format --check src tests acceptance refcalc
      - name: Unit, service and acceptance tests
        run: uv run pytest -q
      - name: Interface schemas are up to date (D21)
        shell: bash
        run: |
          uv run simubench schemas --out schemas
          git diff --exit-code -- schemas

  web:
    name: Web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated interface types are up to date (D21)
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  package:
    name: Wheel with the UI installs and runs
    if: github.event_name != 'pull_request'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: ./scripts/build-wheel.sh
      - name: The wheel ships real-model definitions only, no sb-* (D42)
        run: |
          python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); bad = [n for n in names if '/instruments/sb-' in n]; assert not bad, bad; assert any('/instruments/siglent-' in n for n in names)" dist/simubench-*.whl
      - name: Install into a clean environment, outside the checkout
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/simubench-*.whl
          cd /tmp && /tmp/wheel-env/bin/simubench doctor --workspace "$GITHUB_WORKSPACE/examples"
          /tmp/wheel-env/bin/python -c "import simubench.server.app as a; assert (a.WEB_DIST / 'index.html').exists(), a.WEB_DIST"

  e2e:
    name: End-to-end (Chromium)
    if: github.event_name != 'pull_request'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - name: Component library builds and matches its screenshots (Storybook, visual regression)
        run: pnpm build-storybook && pnpm visual
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/visual-report
            web/test-results
