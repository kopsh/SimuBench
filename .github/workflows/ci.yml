# Pull requests run the fast checks (ubuntu: Python and web), the browser end-to-end/visual tests
# (#848) and the Textual-boot tier — screens, keys, snapshots, real-server scenarios (#858); merge.yml
# merges on them. The slow ones (Windows, the wheel, the wall-clock budgets) run after a merge, on
# main, and do not hold up merging: when one is red on main, fixing it is the next task. A merge by merge.yml pushes with
# the workflow token, which starts no workflow, so merge.yml dispatches this one on main itself.
# The tier is picked by ref, not by event: anything that is not refs/heads/main — a pull_request's
# merge ref, and merge.yml's self-heal dispatch on a pull-request branch (#485) — runs the fast
# checks; only refs/heads/main runs the full tier.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse:
        description: "red: on main, add a job that fails on purpose, to watch main-status react (#817)"
        type: choice
        options: ["", red]
        default: ""
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.ref != 'refs/heads/main' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check_progress_log counts progress-log sections against the merge base (issue #380).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests acceptance refcalc
      - run: uv run ruff format --check src tests acceptance refcalc
      - name: The type check against its only-shrinking baseline (#897)
        run: uv run python scripts/check_ty.py
      - name: The D49 test rules (budgets, e2e assertions, environment reuse)
        run: uv run python scripts/check_test_rules.py
      - name: progress-log keeps its appended history (issue #380)
        run: uv run python scripts/check_progress_log.py
      - name: Unit, service and acceptance tests
        # tui_boot (Textual boot; runs on main) and load_sensitive (the wall-clock budgets, red
        # on a busy machine by design) stay out of the fast tier.
        run: uv run pytest -n 4 --dist loadscope -q -m "not tui_boot and not load_sensitive"
      - name: Interface schemas are up to date (D21)
        shell: bash
        run: |
          uv run simubench schemas --out schemas
          git diff --exit-code -- schemas

  # requires-python is ">=3.11", the job above runs 3.12: the oldest supported Python gets the
  # fast tests too (issue 725: a TLS handshake race that only showed on 3.11).
  python311:
    name: Python 3.11 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-extras
      - name: Unit, service and acceptance tests
        run: uv run pytest -n 4 --dist loadscope -q -m "not tui_boot and not load_sensitive"

  web:
    name: Web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.ref != 'refs/heads/main' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated interface types are up to date (D21)
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  package:
    name: Wheel with the UI installs and runs
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version and changelog come from the commit history (D58): the full history.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: ./scripts/build-wheel.sh
      - name: The wheel ships real-model definitions only, no sb-* (D42)
        run: |
          python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); bad = [n for n in names if '/instruments/sb-' in n]; assert not bad, bad; assert any('/instruments/siglent-' in n for n in names)" dist/simubench-*.whl
      - name: Install into a clean environment, outside the checkout
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/simubench-*.whl
          cd /tmp && /tmp/wheel-env/bin/simubench doctor --workspace "$GITHUB_WORKSPACE/examples"
          /tmp/wheel-env/bin/python -c "import simubench.server.app as a; assert (a.WEB_DIST / 'index.html').exists(), a.WEB_DIST"
      - name: The wheel carries the git version and its commit (D58)
        run: |
          /tmp/wheel-env/bin/python -c "import simubench as s, sys; print(s.__version__, s.__commit_id__); assert s.__version__ != '0+unknown'; assert s.__commit_id__ == sys.argv[1]" "$GITHUB_SHA"
      - name: The changelog is beside the wheel and inside it (D58)
        run: |
          test -s dist/CHANGELOG.md
          cd /tmp && /tmp/wheel-env/bin/simubench changelog | cmp - "$GITHUB_WORKSPACE/dist/CHANGELOG.md"

  tui:
    # Gates pull requests (#858): a changed TUI snapshot baseline or screen is checked before the
    # merge, not only on main. The load-sensitive wall-clock budgets stay on main (slow, below).
    name: TUI screens and snapshots (Textual boot)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Screens, keys, snapshots and real-server scenarios
        run: uv run pytest -n 4 --dist loadscope -q -m "tui_boot and not load_sensitive"
      - name: The snapshot differences report of a failed capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report-${{ github.run_id }}
          path: snapshot_report.html
          if-no-files-found: ignore

  slow:
    name: Slow tests (Textual boot, load-sensitive)
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Screens, keys, snapshots, real-server scenarios and performance budgets
        run: uv run pytest -n 4 --dist loadscope -q -m "tui_boot or load_sensitive"

  e2e:
    # Gates pull requests too (#848): the browser scenarios and the Storybook visual baselines
    # are verified before the merge, so a stale baseline cannot turn main red (#618, #645, #841).
    name: End-to-end (Chromium)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is counted from the commit history (D58): a shallow clone gets a wrong number
          # and the About dialog would not show the version the e2e test expects.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - name: Component library builds and matches its screenshots (Storybook, visual regression)
        run: pnpm build-storybook && pnpm visual
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/visual-report
            web/test-results

  rehearsal:
    # `gh workflow run ci.yml --ref main -f rehearse=red`: a red main on purpose, so the red and green
    # paths of main-status can be seen working on the real thing (#817). A normal run afterwards
    # turns main green again.
    name: Rehearsal (red on purpose)
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.rehearse == 'red'
    runs-on: ubuntu-latest
    steps:
      - run: echo "failing on purpose (rehearse=red)" && exit 1

  main-status:
    # What main's result means for everyone else (#810, #815). It lives here, not in merge.yml:
    # main's CI is the third workflow_run level (PR CI -> merge.yml -> this run), whose end starts
    # no workflow. Red: one `main红了` issue with the run (AGENTS.md: red on main is fixed first),
    # and merge.yml holds the other pull requests. Green: close it and start the merge of the
    # pull requests that waited. A cancelled run says nothing and leaves things as they are; a
    # re-run of a failed job runs this job again.
    name: Main status
    if: always() && github.ref == 'refs/heads/main'
    needs: [python, python311, web, package, slow, e2e, rehearsal]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      issues: write
      pull-requests: write
    steps:
      - run: |
          retry() { local i; for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $1 $2 $3" >&2; sleep $((i * 10)); done; "$@"; }
          RESULTS="${{ join(needs.*.result, ' ') }}"
          # Green is every real job passing; the rehearsal job is skipped in a normal run. A job
          # that was skipped because one it needs failed is not green either.
          REAL="${{ needs.python.result }} ${{ needs.python311.result }} ${{ needs.web.result }} ${{ needs.package.result }} ${{ needs.slow.result }} ${{ needs.e2e.result }}"
          case " $RESULTS " in
            *" failure "*) STATE=red ;;
            *" cancelled "*) exit 0 ;;
            *) if [ "$(echo $REAL | tr ' ' '\n' | grep -vc '^success$')" = 0 ]; then STATE=green; else STATE=red; fi ;;
          esac
          OPEN=$(retry gh issue list --repo "$REPO" --state open --label "main红了" --json number --jq '.[].number')
          if [ "$STATE" = red ]; then
            if [ -z "$OPEN" ]; then
              retry gh label create "main红了" --repo "$REPO" --force --color b60205 --description "main's CI is red (opened by ci.yml)"
              retry gh issue create --repo "$REPO" --label "main红了" --label "核心" \
                --title "main 红了（${SHA:0:7}）" \
                --body "main 的 CI 红了：[the run]($RUN)（提交 $SHA）。先修它（AGENTS.md）；其余 PR 暂停合并，修复 PR 加标签 \`修复main\` 即可合并。main 变绿后本 issue 自动关闭。"
            fi
            exit 0
          fi
          for i in $OPEN; do
            retry gh issue close "$i" --repo "$REPO" --comment "main is green again ([the run]($RUN))."
          done
          # The pull requests merge.yml held: take the label off and start their merge, if the CI on
          # their head passed (a red one was reported on the pull request already).
          for n in $(retry gh pr list --repo "$REPO" --state open --base main --label "等main变绿" --json number --jq '.[].number'); do
            HEAD=$(retry gh pr view "$n" --repo "$REPO" --json headRefOid -q .headRefOid)
            # A failed query is an error of this job, not "nothing passed": the label stays on until
            # the pull request has been looked at (#817).
            if ! PASSED=$(retry gh run list --repo "$REPO" --workflow ci.yml --commit "$HEAD" --status completed --json conclusion --jq 'map(select(.conclusion == "success")) | length'); then
              echo "::error::could not read the CI runs of pull request $n; its label stays"
              FAILED=1
              continue
            fi
            retry gh pr edit "$n" --repo "$REPO" --remove-label "等main变绿"
            if [ "${PASSED:-0}" -gt 0 ]; then
              retry gh workflow run merge.yml --repo "$REPO" --ref main -f sha="$HEAD"
            fi
          done
          exit "${FAILED:-0}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

