# Pull requests run the fast checks only (ubuntu: Python and web); merge.yml merges on them. The slow
# ones (Windows, the wheel, end-to-end and visual tests) run after a merge, on main, and do not hold
# up merging: when one is red on main, fixing it is the next task. A merge by merge.yml pushes with
# the workflow token, which starts no workflow, so merge.yml dispatches this one on main itself.
# The tier is picked by ref, not by event: anything that is not refs/heads/main — a pull_request's
# merge ref, and merge.yml's self-heal dispatch on a pull-request branch (#485) — runs the fast
# checks; only refs/heads/main runs the full tier.
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.ref != 'refs/heads/main' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check_progress_log counts progress-log sections against the merge base (issue #380).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests acceptance refcalc
      - run: uv run ruff format --check src tests acceptance refcalc
      - name: The D49 test rules (budgets, e2e assertions, environment reuse)
        run: uv run python scripts/check_test_rules.py
      - name: progress-log keeps its appended history (issue #380)
        run: uv run python scripts/check_progress_log.py
      - name: Unit, service and acceptance tests
        # tui_boot (Textual screens, snapshots, real-server scenarios) runs on main; see the job below.
        run: uv run pytest -n 4 --dist loadscope -q -m "not tui_boot and not load_sensitive"
      - name: Interface schemas are up to date (D21)
        shell: bash
        run: |
          uv run simubench schemas --out schemas
          git diff --exit-code -- schemas

  web:
    name: Web (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.ref != 'refs/heads/main' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated interface types are up to date (D21)
        run: pnpm check:api
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  package:
    name: Wheel with the UI installs and runs
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the date tags (D58): the full history with its tags.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: ./scripts/build-wheel.sh
      - name: The wheel ships real-model definitions only, no sb-* (D42)
        run: |
          python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); bad = [n for n in names if '/instruments/sb-' in n]; assert not bad, bad; assert any('/instruments/siglent-' in n for n in names)" dist/simubench-*.whl
      - name: Install into a clean environment, outside the checkout
        run: |
          uv venv /tmp/wheel-env
          VIRTUAL_ENV=/tmp/wheel-env uv pip install dist/simubench-*.whl
          cd /tmp && /tmp/wheel-env/bin/simubench doctor --workspace "$GITHUB_WORKSPACE/examples"
          /tmp/wheel-env/bin/python -c "import simubench.server.app as a; assert (a.WEB_DIST / 'index.html').exists(), a.WEB_DIST"
      - name: The wheel carries the git version and its commit (D58)
        run: |
          /tmp/wheel-env/bin/python -c "import simubench as s, sys; print(s.__version__, s.__commit_id__); assert s.__version__ != '0+unknown'; assert s.__commit_id__ == sys.argv[1]" "$GITHUB_SHA"

  tag:
    # Every commit on main gets its date tag vYYYY.M.D.N, which is the version a build of it carries
    # (D58, scripts/release_tags.py). Not gated on the tests: the tag names the commit, it does not
    # vouch for it. Idempotent, and a run cancelled by a newer push is caught up by the next one.
    # A tag whose commits change the product gets a GitHub Release with those changes (cliff.toml).
    name: Date tag and release notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Tag the untagged commits of main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release_tags.py --push | tee new-tags.txt
          while read -r tag sha; do
            prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$sha^" 2>/dev/null || true)
            range=${prev:+$prev..}$tag
            uvx -q --from git-cliff==2.14.2 git-cliff -c cliff.toml --strip header "$range" > notes.md
            if grep -q '^- ' notes.md; then
              gh release create "$tag" --title "${tag#v}" --notes-file notes.md --verify-tag
            fi
          done < new-tags.txt

  slow:
    name: Slow tests (Textual boot, load-sensitive)
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Screens, keys, snapshots, real-server scenarios and performance budgets
        run: uv run pytest -n 4 --dist loadscope -q -m "tui_boot or load_sensitive"

  e2e:
    name: End-to-end (Chromium)
    if: github.ref == 'refs/heads/main'
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - name: Component library builds and matches its screenshots (Storybook, visual regression)
        run: pnpm build-storybook && pnpm visual
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/visual-report
            web/test-results
