schema: simubench.bench/2
name: hello
description: >-
  Hello World：Siglent SDG2042X 的两路输出同一个 1 MHz、1 Vpp 方波，CH1 接 Keysight Infiniium UXR1104B
  示波器（110 GHz、50 Ω 输入）看时域，CH2 接 Keysight N9320B 频谱分析仪看频域（1、3、5、7 MHz 奇次谐波）。
  脚本连接：pyvisa.ResourceManager("hello.bench.yaml@simubench")。
instruments:
  awg:
    model: siglent-sdg2042x
    label: 函数发生器
    state:
      ch1.function: SQUARE
      ch1.frequency: 1.0e6
      ch1.amplitude: 1.0
      # UXR 是 50 Ω 输入：发生器的负载设定 50 Ω，示波器上看到的就是设定的 1 Vpp。
      ch1.load: 50.0
      ch1.output: true
      ch2.function: SQUARE
      ch2.frequency: 1.0e6
      ch2.amplitude: 1.0
      # 频谱分析仪也是 50 Ω 输入：两路负载都设 50 Ω，两台仪表收到的是同一个 1 Vpp。
      ch2.load: 50.0
      ch2.output: true
  scope:
    model: keysight-uxr1104b
    label: 示波器
    state:
      # 屏幕上 5 个周期：频率、周期的自动测量需要至少两个上升沿（#745）。
      timebase.scale: 5.0e-7
      ch1.scale: 0.25
  sa:
    model: keysight-n9320b
    label: 频谱分析仪
    state:
      freq.center: 4.0e6
      freq.span: 8.0e6
      # 1 Vpp 方波在 50 Ω 上的基波约 +6 dBm、总功率约 +7 dBm：参考电平 10 dBm 留出余量，
      # 自动衰减随之加到 30 dB，混频器不过载。
      display.ref_level: 10.0
      # 标记放在 1 MHz 基波上：打开屏幕第一眼读到的是信号，不是噪底。
      marker.enabled: true
      marker.x: 1.0e6
wires:
  - {from: awg.CH1, to: scope.CH1}
  - {from: awg.CH2, to: sa.RF_IN}
run:
  seed: 7
  # 墙钟：打开就看到频谱仪连续扫频、示波器持续刷新（#1660）。要逐条命令精确计时（脚本调试、
  # 截图、测试），点顶栏的“暂停”回到命令时钟，或把这里改成 command。
  clock: wall
layout:
  awg: {x: 0, y: 120}
  scope: {x: 420, y: 0}
  sa: {x: 420, y: 240}
