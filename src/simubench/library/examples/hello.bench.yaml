schema: simubench.bench/2
name: hello
description: >-
  Hello World：Siglent SDG2042X 的两路输出同一个 1 MHz、1 Vpp 方波，CH1 接 Siglent SDS2104X Plus
  示波器看时域，CH2 接 Keysight N9320B 频谱分析仪看频域（1、3、5、7 MHz 奇次谐波）。
  脚本连接：pyvisa.ResourceManager("hello.bench.yaml@simubench")。
instruments:
  awg:
    model: siglent-sdg2042x
    label: 函数发生器
    state:
      ch1.function: SQUARE
      ch1.frequency: 1.0e6
      ch1.amplitude: 1.0
      ch1.output: true
      ch2.function: SQUARE
      ch2.frequency: 1.0e6
      ch2.amplitude: 1.0
      ch2.output: true
  scope:
    model: siglent-sds2104xplus
    label: 示波器
    state:
      # 屏幕上 5 个周期：频率、周期的自动测量需要至少两个上升沿（#745）。
      timebase.scale: 5.0e-7
      ch1.scale: 0.25
  sa:
    model: keysight-n9320b
    label: 频谱分析仪
    state:
      freq.center: 4.0e6
      freq.span: 8.0e6
      # 方波的总功率约 +1 dBm：参考电平留 10 dB 余量，自动衰减随之加到 30 dB，混频器不过载。
      display.ref_level: 10.0
wires:
  - {from: awg.CH1, to: scope.CH1}
  - {from: awg.CH2, to: sa.RF_IN}
run:
  seed: 7
  clock: command
layout:
  awg: {x: 0, y: 120}
  scope: {x: 420, y: 0}
  sa: {x: 420, y: 240}
