- section: :ABOrt Commands
  commands:
  - header: :ABORt<ch>
    level: implemented
    note: 停止信号产生；后缀 1–4 都停止所有通道（手册）。运行状态只保存，不门控输出（输出由 :OUTPut 控制）。查询形式 :ABORt<ch>? 未建模。
- section: :INITiate Commands
  commands:
  - header: :INITiate:IMMediate<ch>
    level: implemented
    note: 开始信号产生（所有通道）；运行状态只保存，不门控输出。
  - header: :INITiate:ASYNc<ch>
    level: implemented
    note: 同 IMMediate；手册说它是重叠命令，模型即刻完成，*OPC? 立即回 1。
- section: :INSTrument Commands
  commands:
  - header: :INSTrument:DACMode
    level: implemented
    note: SINGle|DUAL|FOUR|MARKer|DCMarker，保存并回读；手册未给 *RST 值，取 FOUR。模式不改变通道可用性，标记输出未建模。
  - header: :INSTrument:HWRevision
    level: implemented
    note: 硬件版本，回带引号的 "1"（手册示例）。
  - header: :INSTrument:IDENtify
    level: implemented
    note: 前面板 Access 灯闪烁；模型只置标志；可选的秒数参数接受并忽略（不计时，没有 LED）。
  - header: :INSTrument:IDENtify:STOP
    level: implemented
    note: 停止闪烁，清标志。
  - header: :INSTrument:SLOT[:NUMBer]
    level: implemented
    note: AXIe 槽号，回带引号的数字（手册示例 "2"）。
