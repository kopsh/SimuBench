- section: :OUTPut Commands
  commands:
  - header: :OUTPut<ch>:DIOFfset
    level: implemented
    note: 差分偏置：手册只说范围取决于校准结果，不给数值，模型不限制范围；MIN/MAX 未建模。
  - header: :OUTPut<ch>[:STATe]
    level: implemented
    note: 通道输出放大器开关，OFF|ON|0|1，查询回 0/1，开机关。
  - header: :OUTPut:ROSCillator[:STATe]
    level: implemented
    note: Sync Out B 输出开关；“只能在使用内部参考时打开”未检查。
- section: '[:SOURce] Commands'
  commands:
  - header: '[:SOURce]:CHARacteris<ch>[:VALue]'
    level: not_modeled
    note: 逐通道频率与相位响应数据（校准数据）未建模。手册把头写成 CHARacteris（缺末尾字符），此处照抄。
  - header: '[:SOURce]:FREQuency:RASTer'
    level: implemented
    note: 采样频率 95.6–120.2 GSa/s（数据手册：三档范围之间的空隙不检查）；MIN/MAX 取整体范围的端点，不随 :FREQuency:RANGe 变化。
  - header: '[:SOURce]:FREQuency:RANGe'
    level: implemented
    note: LOW|MEDium|HIGH，保存并回读；与 :FREQuency:RASTer 互不联动（三档对应 95.6–100.2、107.2–112.2、115.2–120.2 GSa/s）。
  - header: '[:SOURce]:VOLTage<ch>[:LEVel][:IMMediate][:AMPLitude]'
    level: implemented
    note: 单端 Vpp，75 mV–0.8 V（数据手册 Out 1–4），范围外 -222；负载按 50 Ω 定义。手册示例 :VOLT 0.685。
  - header: '[:SOURce]:VOLTage<ch>[:LEVel][:IMMediate]:HIGH'
    level: implemented
    note: 高电平 = 偏置 + 幅度/2；改它同时改幅度与偏置，受 -1.0…+2.5 V 电压窗与幅度范围限制。
  - header: '[:SOURce]:VOLTage<ch>[:LEVel][:IMMediate]:LOW'
    level: implemented
    note: 低电平 = 偏置 - 幅度/2；规则同 HIGH。
  - header: '[:SOURce]:VOLTage<ch>[:LEVel][:IMMediate]:OFFSet'
    level: implemented
    note: 偏置 -1.0…+2.5 V（数据手册电压窗）。
  - header: '[:SOURce]:VOLTage<ch>[:LEVel][:IMMediate]:TERMination'
    level: implemented
    note: 终端电压 -1.5…+3.5 V（数据手册）；只保存并回读，不影响输出电平。
  - header: '[:SOURce]:ROSCillator:SOURce'
    level: implemented
    note: INTernal|EXTernal，保存并回读；“只能在停止（:ABORt）时切换”未检查，外部参考不影响输出。
  - header: '[:SOURce]:ROSCillator:SOURce:CHECk'
    level: not_modeled
    note: 外部参考是否可用的检查未建模（没有外部信号模型）。
  - header: '[:SOURce]:ROSCillator:EXTernal:FREQuency'
    level: implemented
    note: 外部参考频率 200–300 MHz（手册）；只保存并回读。
  - header: '[:SOURce]:ROSCillator:INTernal:FREQuency'
    level: implemented
    note: 覆盖时假定的内部参考频率，保存并回读；不改变振荡器。
  - header: '[:SOURce]:ROSCillator:INTernal:FREQuency:OVERride'
    level: implemented
    note: 0|1，保存并回读。手册说明查询在选中 Override 复选框时回 0，与命令相反，模型按命令一致（回 1 表示覆盖）。
  - header: '[:SOURce]:ROSCillator:CALibration[:FREQuency]'
    level: implemented
    note: 回 2.85000000000000E+08（手册示例）。
