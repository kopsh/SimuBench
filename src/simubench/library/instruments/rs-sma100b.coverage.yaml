# R&S SMA100B 的覆盖表：命令按 User Manual 1178.3834.02 v14 的 List of Commands 逐条列出（<ch> 记作 <n>：
# 本平台的 <ch> 指仪表通道）；程度与说明手写。只实现输出、频率、电平、参考、AM/FM/PM（LF1）、调制总开关、
# 频率/电平扫描、触发、状态与公共命令；其余逐条标未实现。
# 噪声（#744/#861）：射频源没有测量读数，读数噪声不适用；相位噪声与宽带噪声底（频谱纯度）未建模，
# 超出读数噪声机制的范围；NOISe 调制源同样未建模（见 specs.noise_status）。
schema: simubench.coverage/1
model: rs-sma100b
sections:
- section: Common Commands
  commands:
  - header: '*CLS'
    level: implemented
    note: 清状态与错误队列。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器。
  - header: '*IDN'
    level: implemented
    note: Rohde&Schwarz,SMA100B,<物料号/序列号>,<固件>（15.4 *IDN? 示例的四字段）。
  - header: '*IST'
    level: not_modeled
  - header: '*OPC'
    level: implemented
    note: 操作完成。
  - header: '*OPT'
    level: not_modeled
  - header: '*PRE'
    level: not_modeled
  - header: '*PSC'
    level: not_modeled
  - header: '*RCL'
    level: not_modeled
  - header: '*RST'
    level: implemented
    note: 按各命令的 *RST 值复位：1 GHz（依选件）、−30 dBm、RF 关、AM 30 %、FM 1 kHz、PM 1 rad、LF 1 kHz、调制关。
  - header: '*SAV'
    level: not_modeled
  - header: '*SRE'
    level: implemented
    note: 服务请求使能。
  - header: '*STB'
    level: implemented
    note: 状态字节。
  - header: '*TRG'
    level: implemented
    note: 触发扫描（触发源为 SINGle/BUS 时开始一次扫描或走一步）。
  - header: '*TST'
    level: not_modeled
  - header: '*WAI'
    level: implemented
    note: 等待操作完成。
