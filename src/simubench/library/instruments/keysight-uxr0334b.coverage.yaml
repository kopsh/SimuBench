- section: :DISK Commands (Programmer's Guide 11.60, ch. 20)
  commands:
  - header: :DISK:CDIRectory
    level: implemented
    note: 'file_system component (#1069): the directory must exist; names are not case sensitive. The present working directory is not part of the setup, so *RST leaves it.'
  - header: :DISK:COPY
    level: implemented
    note: 'file_system component (#1069): a destination that is a directory keeps the file name; an existing file is replaced.'
  - header: :DISK:DELete
    level: implemented
    note: 'file_system component (#1069): deletes a file (* and ? match several); a missing file is -256.'
  - header: :DISK:DIRectory
    level: implemented
    note: 'file_system component (#1069): the number of entries, then one name per line (a directory ends with \); the guide''s fixed 63-byte entry width is not modeled.'
  - header: :DISK:GETFILE
    level: implemented
    note: 'file_system component (#1069): the file as a definite-length block.'
  - header: :DISK:LOAD
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): the instrument''s file system (a virtual file system, #1069).'
    gap: blocked
    blocked_by: file-system
  - header: :DISK:MDIRectory
    level: implemented
    note: 'file_system component (#1069): in the present working directory or at a full path; the parent must exist.'
  - header: :DISK:PUTFILE
    level: implemented
    note: 'file_system component (#1069): writes the block to the path, replacing the file; the directory must exist.'
  - header: :DISK:PWD
    level: implemented
    note: 'file_system component (#1069): quoted; an empty string until :DISK:CDIRectory changes the default C:\Users\Public\Documents\Infiniium, as the guide says.'
  - header: :DISK:SAVE:COMPosite
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): setup save/recall to a file (#1070).'
    gap: blocked
    blocked_by: setup-memory
  - header: :DISK:SAVE:IMAGe
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): screen images and hardcopies (#1072).'
    gap: blocked
    blocked_by: screenshot
  - header: :DISK:SAVE:JITTer
    level: not_modeled
    note: 'Out of scope: saves the results of an application-layer analysis (jitter, noise, PrecisionProbe, lister; product-plan.md section 6).'
    gap: out_of_scope
  - header: :DISK:SAVE:LISTing
    level: not_modeled
    note: 'Out of scope: saves the results of an application-layer analysis (jitter, noise, PrecisionProbe, lister; product-plan.md section 6).'
    gap: out_of_scope
  - header: :DISK:SAVE:MEASurements
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): waveforms and results saved as files (#1071).'
    gap: blocked
    blocked_by: data-file
  - header: :DISK:SAVE:MREPort
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): waveforms and results saved as files (#1071).'
    gap: blocked
    blocked_by: data-file
  - header: :DISK:SAVE:NOISe
    level: not_modeled
    note: 'Out of scope: saves the results of an application-layer analysis (jitter, noise, PrecisionProbe, lister; product-plan.md section 6).'
    gap: out_of_scope
  - header: :DISK:SAVE:PRECprobe
    level: not_modeled
    note: 'Out of scope: saves the results of an application-layer analysis (jitter, noise, PrecisionProbe, lister; product-plan.md section 6).'
    gap: out_of_scope
  - header: :DISK:SAVE:SETup
    level: implemented
    note: 'setup_memory component (#1070): saves the setup to a file (.set added when the name has none) in the present working directory or at the path given. The setup is SimuBench''s JSON (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: :DISK:SAVE:WAVeform
    level: implemented
    note: 'data_file component (#1071): a channel''s record, the same record :WAVeform:DATA? transfers. CSV, TSV and TXT are ''time<sep>volts'' lines (comma, tab, space) with CR LF; header ON writes SimuBench''s own key,value lines first (Source, Points, XOrigin, XIncrement, XUnits, YUnits) — the guide does not give the layout. BIN is the Keysight oscilloscope binary file (AG10 file header, 140-byte waveform header, one float32 buffer). The format comes from the parameter, else the extension, else INTernal (.wfm). INTernal, H5, H5INt and MATlab are not written (-257); sources other than CHANnel<N> (ALL, FUNCtion, WMEMory ...) are -224.'
  - header: :DISK:SEGMented
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): waveforms and results saved as files (#1071).'
    gap: blocked
    blocked_by: data-file
