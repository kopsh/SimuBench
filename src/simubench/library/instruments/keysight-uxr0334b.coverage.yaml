- section: :FUNCtion<F> Commands (Programmer's Guide 11.60, ch. 22)
  commands:
  - header: :FUNCtion<F>
    level: implemented
    note: 'The function''s operands as set ("CHAN1,CHAN2" with headers off).'
  - header: :FUNCtion<F>:ABSolute
    level: implemented
    note: 'f = |source1|, computed from the record when read (#1074).'
  - header: :FUNCtion<F>:ADD
    level: implemented
    note: 'f = source1 + source2, computed from the records when read (#1074); operands: CHANnel<N>, FUNCtion<F>, a constant.'
  - header: :FUNCtion<F>:ADEMod
    level: not_modeled
    note: 'Blocked by C9 (product-plan.md 4.2): band-pass (carrier + complex envelope) signals.'
    gap: blocked
    blocked_by: C9
  - header: :FUNCtion<F>:AVERage
    level: implemented
    note: 'f = the running mean of source1 over the averages setting (#1074); the manual gives no default, SimuBench takes 16.'
  - header: :FUNCtion<F>:COMMonmode
    level: implemented
    note: 'f = (source1 + source2) / 2, computed from the records when read (#1074); the DIFF<D> and COMMonmode<C> operand words (the differential and common-mode channel inputs) are not modeled.'
  - header: :FUNCtion<F>:DELay
    level: implemented
    note: 'f = source1 shifted by the delay setting in time (#1074).'
  - header: :FUNCtion<F>:DIFF
    level: implemented
    note: 'f = d(source1)/dt (central differences), computed from the record when read (#1074).'
  - header: :FUNCtion<F>:DISPlay
    level: implemented
    note: 'Function <f> shown on screen.'
  - header: :FUNCtion<F>:DIVide
    level: implemented
    note: 'f = source1 / source2, computed from the records when read (#1074); a division by 0 leaves a hole.'
  - header: :FUNCtion<F>:FFT:DETector:POINts
    level: implemented
    note: 'Buckets the detector decimates to; 0 keeps every point.'
  - header: :FUNCtion<F>:FFT:DETector:TYPE
    level: implemented
    note: 'The trace decimation applied to the transform trace (OFF, SAMPle, PPOSitive, PNEGative, NORMal, AVERage).'
  - header: :FUNCtion<F>:FFT:FREQuency
    level: implemented
    note: 'The transform''s centre frequency (with :FFT:SPAN). The four window settings store independently (see :FFT:SPAN).'
  - header: :FUNCtion<F>:FFT:HSCale
    level: implemented
    note: 'Stores the horizontal scale word (LINear/LOG); the log-frequency FFT trace is not modeled.'
  - header: :FUNCtion<F>:FFT:IMPedance
    level: implemented
    note: 'The power units'' reference impedance (AUTO is 50 Ω, the single-ended input''s).'
  - header: :FUNCtion:FFT:PEAK:SORT
    level: implemented
    note: 'The order the annotated peaks list in.'
  - header: :FUNCtion<F>:FFT:PEAK:COUNt
    level: implemented
    note: 'At most this many peaks are annotated. The manual gives no default, SimuBench takes 3.'
  - header: :FUNCtion<F>:FFT:PEAK:FREQuency
    level: implemented
    note: 'The transform''s centre frequency (with :FFT:SPAN). The four window settings store independently (see :FFT:SPAN).'
  - header: :FUNCtion<F>:FFT:PEAK:LEVel
    level: implemented
    note: 'Peaks above this level (dBm) are annotated.'
  - header: :FUNCtion<F>:FFT:PEAK:MAGNitude
    level: implemented
    note: 'The annotated peaks'' magnitudes, comma-separated in the PEAK:SORT order; none: 9.99999E+37.'
  - header: :FUNCtion<F>:FFT:PEAK:STATe
    level: implemented
    note: 'Whether the FFT peaks are annotated; OFF makes the peak queries answer 9.99999E+37.'
  - header: :FUNCtion<F>:FFT:REFerence
    level: implemented
    note: 'The phase reference of the FFTPhase function; both words store, the phase is computed from the transform''s own origin.'
  - header: :FUNCtion<F>:FFT:RESolution
    level: implemented
    note: 'Query: the bin width times the window''s equivalent noise bandwidth. A write moves the timebase''s scale (the instrument reaches a resolution by sampling longer).'
  - header: :FUNCtion<F>:FFT:SPAN
    level: implemented
    note: 'The transform''s frequency span, with :FFT:FREQuency as its centre; 0 spans the whole record band. The four window settings store independently (the instrument links STARt/STOP to a FREQuency/SPAN write); the trace reads the span/centre first, then start/stop.'
  - header: :FUNCtion<F>:FFT:STARt
    level: implemented
    note: 'The transform''s start frequency (with :FFT:STOP); 0 with STOP 0 spans the whole record band.'
  - header: :FUNCtion<F>:FFT:STOP
    level: implemented
    note: 'The transform''s stop frequency (with :FFT:STARt).'
  - header: :FUNCtion<F>:FFT:TDELay
    level: implemented
    note: 'The time delay the FFTPhase function''s phase is turned by.'
  - header: :FUNCtion<F>:FFT:VUNits
    level: implemented
    note: 'The transform''s vertical units (DB, DBMV, DBUV, WATT, VRMS; the PSDensity family: DBMHZ, WATTHZ, VRTHZ).'
  - header: :FUNCtion<F>:FFT:WINDow
    level: implemented
    note: 'The transform''s window; applies when function <f> is a transform. The manual gives no default, SimuBench takes HANNing.'
  - header: :FUNCtion<F>:FFTMagnitude
    level: implemented
    note: 'f = the windowed one-sided FFT of source1 in the vunits setting, over the span the FFT settings name; the transform length is the effective memory depth (the highest power of two ≤ the record, capped at 1 Mpt) and a longer record is refused, not truncated (#1074). The manual gives no window default, SimuBench takes HANNing.'
  - header: :FUNCtion<F>:FFTPhase
    level: implemented
    note: 'f = the transform''s phase in degrees, turned by the FFT:TDELay setting (#1074).'
  - header: :FUNCtion<F>:GATing
    level: implemented
    note: 'f = source1 over the gating window (the gate_start/gate_stop settings, #1074); the global gates (:GATing:GLOBal) are not modeled.'
  - header: :FUNCtion<F>:GATing:GLOBal
    level: not_modeled
    note: 'The global gates are not modeled; the function''s own gate (:FUNCtion<F>:GATing) is. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:GATing:STARt
    level: implemented
    note: 'The transform''s start frequency (with :FFT:STOP); 0 with STOP 0 spans the whole record band.'
  - header: :FUNCtion<F>:GATing:STOP
    level: implemented
    note: 'The transform''s stop frequency (with :FFT:STARt).'
  - header: :FUNCtion<F>:HIGHpass
    level: implemented
    note: 'f = source1 through a single-pole high pass at the bandwidth setting (#1074).'
  - header: :FUNCtion<F>:HORizontal
    level: implemented
    note: 'Horizontal scaling mode of function <f>; a write of POSition/RANGe turns it MANual. The operators whose horizontal scaling follows the source''s timebase (ADD, SUBTract, MULTiply, DIVide, COMMonmode, ABSolute, DIFF, INTegrate, INVert, HIGHpass, LOWPass, MAXimum, MINimum, SMOoth, AVERage, SQUare, SQRT) refuse the write with -221, as the manual notes.'
  - header: :FUNCtion<F>:HORizontal:POSition
    level: implemented
    note: 'Time at centre screen of function <f> (the centre frequency of an FFTMagnitude); -221 on the timebase-bound operators.'
  - header: :FUNCtion<F>:HORizontal:RANGe
    level: implemented
    note: 'Time span of function <f> (the span of an FFTMagnitude); -221 on the timebase-bound operators.'
  - header: :FUNCtion<F>:INTegrate
    level: implemented
    note: 'f = the cumulative trapezoid integral of source1, in V·s (#1074).'
  - header: :FUNCtion<F>:INVert
    level: implemented
    note: 'f = −source1, computed from the record when read (#1074).'
  - header: :FUNCtion<F>:LABel
    level: implemented
    note: 'The function''s label (an on-screen text).'
  - header: :FUNCtion<F>:LOWPass
    level: implemented
    note: 'f = source1 through a 4th-order Bessel-Thompson low pass at the bandwidth setting (#1074).'
  - header: :FUNCtion<F>:MAGNify
    level: implemented
    note: 'f = source1 under the function''s own scale and offset (#1074).'
  - header: :FUNCtion<F>:MATLab
    level: not_modeled
    note: 'Out of scope in the platform: user code runs only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :FUNCtion<F>:MATLab:CONTrol<N>
    level: not_modeled
    note: 'Out of scope in the platform: user code runs only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :FUNCtion<F>:MATLab:OPERator
    level: not_modeled
    note: 'Out of scope in the platform: user code runs only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :FUNCtion<F>:MAXimum
    level: implemented
    note: 'f = source1 as it is (#1074): the per-bucket extremes are the display''s decimation, not a record change.'
  - header: :FUNCtion<F>:MHIStogram
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): waveform and measurement histograms.'
    gap: blocked
    blocked_by: histogram
  - header: :FUNCtion<F>:MINimum
    level: implemented
    note: 'f = source1 as it is (#1074): the per-bucket extremes are the display''s decimation, not a record change.'
  - header: :FUNCtion<F>:MLOG
    level: not_modeled
    note: 'The scrolling record of measurement values is not modeled. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:MTRend
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): measurement statistics and limit testing.'
    gap: blocked
    blocked_by: measurement-statistics
  - header: :FUNCtion<F>:MULTiply
    level: implemented
    note: 'f = source1 · source2, computed from the records when read (#1074).'
  - header: :FUNCtion<F>:OFFSet
    level: implemented
    note: 'Voltage at centre screen of function <f>.'
  - header: :FUNCtion<F>:PAVerage
    level: not_modeled
    note: 'The pattern average (needs clock recovery and pattern detection) is not modeled. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:PSDensity
    level: implemented
    note: 'f = the transform as a power spectral density (the bin spread over the window''s equivalent noise bandwidth, #1074).'
  - header: :FUNCtion<F>:RANGe
    level: implemented
    note: 'Full-scale range of function <f>; a division is an eighth of it. AUTO keeps the source''s.'
  - header: :FUNCtion<F>:SMOoth
    level: implemented
    note: 'f = the centred running mean of source1 over the points setting (3..4001, #1074); the manual gives no default, SimuBench takes 5.'
  - header: :FUNCtion<F>:SQRT
    level: implemented
    note: 'f = √source1, computed from the record when read (#1074); negative samples leave a hole.'
  - header: :FUNCtion<F>:SQUare
    level: implemented
    note: 'f = source1², computed from the record when read (#1074).'
  - header: :FUNCtion<F>:SUBTract
    level: implemented
    note: 'f = source1 − source2, computed from the records when read (#1074).'
  - header: :FUNCtion<F>:VERSus
    level: not_modeled
    note: 'The X-versus-Y display is not modeled. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:VERTical
    level: implemented
    note: 'Vertical scaling mode of function <f>: AUTO follows the source, MANual uses the RANGe/OFFSet settings.'
  - header: :FUNCtion<F>:VERTical:OFFSet
    level: implemented
    note: 'Voltage at centre screen of function <f>.'
  - header: :FUNCtion<F>:VERTical:RANGe
    level: implemented
    note: 'Full-scale range of function <f>; a division is an eighth of it. AUTO keeps the source''s.'
  - header: :FUNCtion<F>:VERTical:SIZE
    level: not_modeled
    note: 'Belongs to the measurement histogram function (:FUNCtion<F>:MHIStogram), which is not modeled. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:XYZ
    level: not_modeled
    note: 'The X-versus-Y display with a qualifier is not modeled. (#1074)'
    gap: out_of_scope
  - header: :FUNCtion<F>:XYZI
    level: not_modeled
    note: 'The X-versus-Y display with intensity grading is not modeled. (#1074)'
    gap: out_of_scope
  - header: :HARDcopy:AREA
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): screen images and hardcopies (#1072).'
    gap: blocked
    blocked_by: screenshot
  - header: :HARDcopy:DPRinter
    level: not_modeled
    note: 'Model work: changes only the instrument''s own configuration or front panel, not the data; candidate accepted (affects_data: false).'
    gap: model_work
