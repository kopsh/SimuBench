- section: :WAVeform Commands (Programmer's Guide 11.60, ch. 40)
  commands:
  - header: :WAVeform:BANDpass
    level: implemented
    note: "p. 1594: the acquisition path's lower and upper cutoff - the coupling's high-pass corner (0: the input is DC-coupled only) and the :ACQuire:BANDwidth digital filter"
  - header: :WAVeform:BYTeorder
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :WAVeform:CGRade:HEIGht
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:CGRade:WIDTh
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:COMPlete
    level: implemented
    note: "p. 1598: the percent of time buckets complete. A finished acquisition's buckets are all complete: 100; nothing read yet: 0"
  - header: :WAVeform:COUNt
    level: implemented
    note: "p. 1599: the fewest hits in all of the time buckets - the :ACQuire:COUNt averages one averaging completed with, one hit otherwise; 0 with nothing read yet. The model's records have no holes, so the zero the guide gives for holes is the no-record case only"
  - header: :WAVeform:COUPling
    level: implemented
    note: "p. 1600: always DC, as the manual says (provided for compatibility with other Infiniium oscilloscopes); the input is DC-coupled only (data sheet)"
  - header: :WAVeform:DATA
    level: implemented
    note: 'BYTE: signed 8-bit codes; WORD: signed 16-bit codes (the 10-bit ADC code shifted up 6 bits,
      8192 per division), in a definite-length block; ASCii: comma-separated volts (%.4E, two exponent
      digits; the guide''s sample shows one). <start>[,<size>]: the points from <start>, <size> of them, cut
      to the record''s end (the guide); a <start> past the record is -222. At most 2^26 points per read: a deeper
      record is read in parts this way, each part computed as it is read (#1012, real-models.md 10)'
  - header: :WAVeform:FORMat
    level: implemented
    note: ASCii (default, the guide), BYTE, WORD; BINary and FLOat are not modeled
  - header: :WAVeform:PNOise:FREQuency
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:POINts
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :WAVeform:PREamble
    level: implemented
    note: 'the guide''s 24 fields; date and time are fixed values (the bench has no calendar), the frame
      model is UXR0334B:<serial>, coupling 2 (DCFIFTY), units 2 and 1, max bandwidth the :ACQuire:BANDwidth
      setting, min 0. With ASCii data the Y increment is still the WORD code''s (the guide: the ADC''s
      full scale; known deviation)'
  - header: :WAVeform:SEGMented:ALL
    level: implemented
    note: "p. 1624: ON, the data read returns every segment of the latest acquisition as one record (<start>,<size> still work, on the combined record) and the preamble gains the segment count; OFF, the current segment only. A function source always transfers the current segment (the manual)"
  - header: :WAVeform:SEGMented:COUNt
    level: implemented
    note: "p. 1626: the index of the last captured segment, 0 when :ACQuire:MODE is not SEGMented (all channels acquire together, so the per-channel counts the guide mentions for VLSC do not differ here)"
  - header: :WAVeform:SEGMented:POINts
    level: implemented
    note: "p. 1627: the points the data read sends - every segment with :WAVeform:SEGMented:ALL ON, the current segment otherwise"
  - header: :WAVeform:SEGMented:TTAG
    level: implemented
    note: "p. 1628: the selected segment's trigger minus the first segment's"
  - header: :WAVeform:SEGMented:XLISt
    level: implemented
    note: "p. 1629: one x value per segment - RELXorigin (the segment's own X origin), ABSXorigin (relative origin + time tag, as the manual words it), TTAG (its trigger minus the first's) or OFFSet (where the segment begins in the ALL-ON data; zeros with ALL OFF). The guide supports the ASCii and BINary float64 formats for it; this model's :WAVeform:FORMat has no BINary, so a WORD/BYTE selection errors -224, as does a function source (the guide: channels and pods only)"
  - header: :WAVeform:SOURce
    level: implemented
    note: CHANnel<N> only
  - header: :WAVeform:STReaming
    level: implemented
    note: 'ON: :WAVeform:DATA? sends a #0 indefinite-length block (Streaming On); OFF: a definite-length
      block. OFF after power-on is a SimuBench value'
  - header: :WAVeform:TYPE
    level: implemented
    note: "p. 1632: how the source's waveform was acquired - the averaged record AVER, the raw one RAW; PDETect (mode not modeled) and INTerpolate are not modeled"
  - header: :WAVeform:VIEW
    level: implemented
    note: "p. 1633: the view the data and preamble read. The record always covers the main time base (memory depth and timebase are linked, the :ACQuire:SRATe/POINts interaction), so ALL and MAIN reference the same data; WINDow waits for the zoom window, CGRade is out of scope (C17)"
  - header: :WAVeform:XDISplay
    level: implemented
    note: "p. 1640: the X at the left edge of the display - the record's first point (the record covers the display)"
  - header: :WAVeform:XINCrement
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :WAVeform:XORigin
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :WAVeform:XRANge
    level: implemented
    note: "p. 1639: the time across the display - 10 divisions of the timebase scale"
  - header: :WAVeform:XREFerence
    level: implemented
    note: always 0 (the guide)
  - header: :WAVeform:XUNits
    level: implemented
    note: "p. 1641: the X-axis units in the guide's words - SECond for a channel, HERTz for a transform function (the math block says)"
  - header: :WAVeform:YDISplay
    level: implemented
    note: "p. 1642: the Y at the center of the display - the channel's offset"
  - header: :WAVeform:YINCrement
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :WAVeform:YORigin
    level: implemented
    note: 'the channel offset: the voltage at code 0'
  - header: :WAVeform:YRANge
    level: implemented
    note: "p. 1645: the voltage across the display - 8 divisions of the channel's scale"
  - header: :WAVeform:YREFerence
    level: implemented
    note: always 0 (the guide)
  - header: :WAVeform:YUNits
    level: implemented
    note: "p. 1647: the Y-axis units in the guide's words - VOLT for a channel; a transform by its vertical unit (the dB family DECibels, the Watt family WATT, the volt family VOLT); the phase trace has no word in the guide's list, so UNKNown"
