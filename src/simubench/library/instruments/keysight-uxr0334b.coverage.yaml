    note: 'p. 585: sets a bookmark (source or NONE, label, and color, content, grid or time). The model stores the label of one global bookmark, not 1-100 of them; the other parameters parse and are not stored'
  - header: :DISPlay:BOOKmark<N>:VERTical?
    level: not_modeled
    note: 'Model work: the query returns the waveform''s vertical value at the bookmark''s horizontal position (p. 586) - a data readout needing the bookmark''s source-bound time, not a display-only setting.'
    gap: model_work
