- section: :TIMebase Commands (Programmer's Guide 11.60, ch. 38)
  commands:
  - header: :TIMebase:POSition
    level: implemented
    note: -200 s to 200 s (data sheet delay range)
  - header: :TIMebase:RANGe
    level: implemented
    note: 10 divisions of :TIMebase:SCALe
  - header: :TIMebase:REFClock
    level: implemented
    note: 'p. 1470: the 10 MHz In BNC on or off. ON, the sampling clock follows a 10 MHz on the scope''s
      REF IN within +-10 ppm (the timebase''s external-reference mechanism) and keeps the internal clock when
      nothing usable is on it - this bench wires no reference, so the clock error stays the internal one
      (specs-timebase deviation, at most 0.025 ppm) either way.'
  - header: :TIMebase:REFerence
    level: implemented
    note: 'p. 1472: LEFT, CENTer or RIGHt - 10, 50 or 90 percent of screen, the same setting
      :TIMebase:REFerence:PERCent writes; the query answers the word, PERC once a percent position is set.'
  - header: :TIMebase:REFerence:PERCent
    level: implemented
    note: 'p. 1473: the reference position as 0-100 percent of screen; the trigger sits there and the
      :TIMebase:POSition delay still moves it.'
  - header: :TIMebase:ROLL:ENABLE
    level: implemented
    note: 'p. 1474: OFF is the only valid setting on the UXR and the query answers 0; anything else is -224.'
  - header: :TIMebase:SCALe
    level: implemented
    note: 5 ps/div to 20 s/div (the guide)
  - header: :TIMebase:VIEW
    level: implemented
    note: 'p. 1476: MAIN or WINDow (the horizontal zoom on or off). The record keeps the main time base''s
      samples, so the view is a display state that changes no data.'
  - header: :TIMebase:VLSCapture:POSTtrigger
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :TIMebase:VLSCapture:PRETrigger
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :TIMebase:WINDow:DELay
    level: implemented
    note: 'p. 1479: the delayed view''s position - the same setting :TIMebase:WINDow:POSition writes (the
      manual''s compatibility command).'
  - header: :TIMebase:WINDow:POSition
    level: implemented
    note: 'p. 1480: the delayed view''s position in seconds; the value stores (the zoom''s data read is not
      modeled).'
  - header: :TIMebase:WINDow:RANGe
    level: implemented
    note: 'p. 1481: the delayed view''s full-scale range, ten :WINDow:SCALe (at most the main range, at
      least 10 ps); the value stores (the zoom''s data read is not modeled).'
  - header: :TIMebase:WINDow:SCALe
    level: implemented
    note: 'p. 1482: the delayed view''s time per division, 1 ps/div to the main scale; the value stores (the
      zoom''s data read is not modeled).'
