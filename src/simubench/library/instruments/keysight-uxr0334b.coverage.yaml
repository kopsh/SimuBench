# Generated from the table of contents of the Infiniium UXR-Series Programmer's Guide 11.60.00000 (9018-07723); levels and notes by hand.
# 噪声与抖动（#744/#774/#786/#859）：每档通道噪声取数据手册 3123-1313 的值（specs.noise_per_division）；触发抖动取
# 数据手册的 25 fs 固有抖动（specs.trigger_jitter_s_rms）；逐次独立抽样、同种子逐位复现；统计测试见
# tests/test_keysight_uxr.py。#859 复核：通道噪声表 + 触发抖动两项均已满足 #744 的约定。
schema: simubench.coverage/1
model: keysight-uxr0334b
sections:
- section: '* (Common) Commands (Programmer''s Guide 11.60, ch. 13)'
  commands:
  - header: '*CLS'
    level: implemented
  - header: '*ESE'
    level: implemented
  - header: '*ESR'
    level: implemented
  - header: '*IDN'
    level: implemented
    note: Keysight Technologies,UXR0334B,<serial>,<software version> as the guide writes it (no options
      field); serial MY64280101 and version 11.60.00000 are SimuBench values
  - header: '*LRN'
    level: implemented
    note: 'setup_memory component (#1070): ":SYST:SET " and a definite-length block, whatever :SYSTem:HEADer is; sent back as it is, it restores the setup. The setup is SimuBench''s JSON (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: '*OPC'
    level: implemented
    note: '*OPC? waits for a :DIGitize or :SINGle in progress; without a trigger it does not answer (the
      guide: abort a :DIGitize with a device clear)'
  - header: '*OPT'
    level: not_modeled
    note: 'Model work: option handling exists (#1007); declare the installed options.'
    gap: model_work
  - header: '*PSC'
    level: not_modeled
    note: 'Model work: status register on the existing status system.'
    gap: model_work
  - header: '*RCL'
    level: implemented
    note: 'setup_memory component (#1070): puts every setting back as saved; an empty register changes nothing and queues no error (the guide: a message on the display).'
  - header: '*RST'
    level: implemented
    note: 'the guide''s Default Setup (:SYSTem:PRESet): run, CH1 on at 1 V/div and 0 offset, 100 ns/div,
      position 0, centre reference, edge trigger on CH1 at 0 V rising, AUTO sweep; :ACQuire:COMPlete 90.
      Values the guide does not list are SimuBench defaults: CH2-CH4 off, holdoff 100 ns, average off
      with 16 averages, memory depth AUTO (128 kpts), sample rate AUTO, bandwidth MAX, waveform source
      CHAN1, ASCii, MSBFirst, streaming off, headers and long form off'
  - header: '*SAV'
    level: implemented
    note: 'setup_memory component (#1070): registers 0-9, shared with :STORe:SETup; kept across runs of a saved bench, untouched by *RST. The setup is SimuBench''s JSON (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: '*SRE'
    level: implemented
  - header: '*STB'
    level: implemented
  - header: '*TRG'
    level: implemented
    note: the same as :DIGitize without parameters
  - header: '*TST'
    level: implemented
  - header: '*WAI'
    level: implemented
- section: ': (Root Level) Commands (Programmer''s Guide 11.60, ch. 14)'
  commands:
  - header: :ADER
    level: implemented
    note: set by every acquisition that completes, triggered or auto-triggered; read and cleared by the
      query
  - header: :AER
    level: implemented
    note: set when :RUN or :SINGle arms the trigger; read and cleared by the query
  - header: :ASTate
    level: implemented
    note: ARM (waiting for the trigger), TRIG (triggered), ATRIG (auto-triggered, running), ADONE (stopped,
      acquisition done)
  - header: :ATER
    level: implemented
    note: set by an acquisition an AUTO sweep took without its trigger; read and cleared by the query
  - header: :AUToscale
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): autoscale (settings derived from the input signal).'
    gap: blocked
    blocked_by: autoscale
  - header: :AUToscale:CHANnels
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): autoscale (settings derived from the input signal).'
    gap: blocked
    blocked_by: autoscale
  - header: :AUToscale:PLACement
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): autoscale (settings derived from the input signal).'
    gap: blocked
    blocked_by: autoscale
  - header: :AUToscale:VERTical
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): autoscale (settings derived from the input signal).'
    gap: blocked
    blocked_by: autoscale
  - header: :BEEP
    level: accepted
    affects_data: false
    note: 'p. 291: beeps at <frequency> Hz for <duration> ms. The bench is silent; both parameters are parsed and stored, nothing else changes'
  - header: :BLANk
    level: implemented
    note: CHANnel<N> only; ALL, functions, histograms and memories are not modeled
  - header: :CDISplay
    level: implemented
    note: 'p. 293: the display clears and the associated measurements reset - the stored records
      go (a stopped scope shows nothing; a read re-acquires, this model''s missing-record policy). Waveform
      memories are not erased.'
  - header: :DIGitize
    level: implemented
    note: acquires the displayed channels (or the channels named) and stops. Channels named are turned
      on; the guide turns their display off (known deviation)
  - header: :MODel
    level: implemented
    note: UXR0334B without quotes, as the guide's table writes the reply with headers off
  - header: :MTEEnable
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): mask testing.'
    gap: blocked
    blocked_by: mask-test
  - header: :MTERegister
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): mask testing.'
    gap: blocked
    blocked_by: mask-test
  - header: :OPEEnable
    level: implemented
    note: the enable mask of the Operation Status Register (bits 0 ACQ DONE, 1 PROC DONE, 5 WAIT TRIG,
      11 AUTO TRIG); summary in *STB bit 7 (OPER)
  - header: :OPERegister
    level: implemented
    note: 'read and cleared by the query: bit 0 ACQ DONE and bit 1 PROC DONE (set when :ADER? and :PDER?
      become set), bit 5 WAIT TRIG, bit 11 AUTO TRIG (:ATER?). MASK (bit 9) and OVLR (bit 12) are not
      modeled'
  - header: :OVLRegister
    level: not_modeled
    note: 'Model work: ADC clipping exists in the signal chain; report and clear it.'
    gap: model_work
  - header: :PDER
    level: implemented
    note: measurements are computed when queried, so processing is done when the acquisition is; its own
      register, read and cleared by the query
  - header: :PRINt
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): screen images and hardcopies (#1072).'
    gap: blocked
    blocked_by: screenshot
  - header: :RECall:SETup
    level: implemented
    note: 'setup_memory component (#1070): the same registers 0-9 as *RCL; an empty one changes nothing.'
  - header: :RSTate
    level: implemented
    note: RUN, STOP or SING
  - header: :RUN
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :SERial
    level: implemented
    note: 'query only: the serial number of *IDN? without quotes, as the guide''s sample. Setting the
      serial number is not modeled'
  - header: :SINGle
    level: implemented
    note: one acquisition on the next trigger; :TRIGger:SWEep is not changed (the guide)
  - header: :STATus
    level: implemented
    note: CHANnel<N> only
  - header: :STOP
    level: implemented
    note: 草稿：定义中已有，确认程度与说明
  - header: :STORe:JITTer
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :STORe:SETup
    level: implemented
    note: 'setup_memory component (#1070): the same registers 0-9 as *SAV. The setup is SimuBench''s JSON (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: :STORe:WAVeform
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): reference waveform memories.'
    gap: blocked
    blocked_by: waveform-memory
  - header: :TERegister
    level: implemented
    note: set when an acquisition that met the trigger is stored (auto triggers do not set it); read and
      cleared by the query; summary in *STB bit 0
  - header: :VIEW
    level: implemented
    note: CHANnel<N> only; functions, histograms, memories and the like are not modeled
- section: :ACQuire Commands (Programmer's Guide 11.60, ch. 15)
  commands:
  - header: :ACQuire:ADC:CLIPped:CLEar
    level: not_modeled
    note: 'Model work: ADC clipping exists in the signal chain; report and clear it.'
    gap: model_work
  - header: :ACQuire:AVERage
    level: implemented
    note: 'ON: each record is the mean of :ACQuire:COUNt acquisitions, each noisy and quantized (D46)'
  - header: :ACQuire[:AVERage]:COUNt
    level: implemented
    note: '2 to 1 048 575 (the data sheet; the guide''s 10,486,575 is a misprint); 16 after a default setup
      is a SimuBench value. An acquisition whose count x record points is beyond 2^28 is a deep record
      (#1012, real-models.md 10): it is taken, and each read may ask for at most 2^28 samples (points read x
      count); a read or a measurement beyond that is -221 (until #1012 such an acquisition was refused, #986).
      No peak detect is mapped'
  - header: :ACQuire:BANDwidth
    level: implemented
    note: 'MAX or 100 MHz to 33 GHz: the -3 dB frequency of the acquisition''s DSP filter, shaped by :ACQuire:RESPonse
      (#607). AUTO is not modeled; the lower limit is a SimuBench value'
  - header: :ACQuire:BANDwidth:FRAMe
    level: implemented
    note: 'p. 323: the model''s maximum bandwidth, 33 GHz (specs.bandwidth_hz).'
  - header: :ACQuire:BANDwidth:TESTLIMITS
    level: not_modeled
    note: 'Model work: query of the limits declared in the definition.'
    gap: model_work
  - header: :ACQuire:COMPlete
    level: implemented
    note: 0 to 100, 90 after a default setup (the guide). In real-time sampling it has no effect on the
      record (the guide)
  - header: :ACQuire:COMPlete:STATe
    level: implemented
    note: 'p. 327: whether function averaging completes before measurements. The model''s measurements
      compute on the completed record a read brings, so the flag changes no value; the *RST value is not in
      the manual, ON is a SimuBench value.'
  - header: :ACQuire:DIFFerential:PARTner
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): differential and common-mode channel inputs.'
    gap: blocked
    blocked_by: differential-input
  - header: :ACQuire:FPLot
    level: accepted
    affects_data: false
    note: "p. 329: the fast-plot scheduling flag (analysis synchronous or asynchronous with acquisitions). The model analyzes the current record at every read, so no reply value changes; the *RST value is not in the manual, ON is a SimuBench value"
  - header: :ACQuire:HISTory:COUNt
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:INDex
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:PLAY
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HRESolution
    level: implemented
    note: 'p. 333: the minimum bit resolution of the HRESolution/SEGHres acquire modes, which are not
      modeled - the setting stores and cannot change data while the modes do not exist.'
  - header: :ACQuire:INTerpolate
    level: not_modeled
    note: 'Model work: the sin(x)/x interpolation adds points between acquired samples in the real-time
      modes (the record and the display change, the data sheet''s "adds points"); the model''s record keeps
      the acquired samples, and storing the ratio without the filter would not be the command the guide
      documents.'
    gap: model_work
  - header: :ACQuire:MODE
    level: implemented
    note: RTIMe and SEGMented; PDETect, HRESolution, SEGPdetect and SEGHres are not modeled
  - header: :ACQuire:POINts[:ANALog]
    level: implemented
    note: 'AUTO (SimuBench: 128 kpts) or 16 to 500 Mpts (the UXR''s standard memory). Records deeper than 2^22 points are computed where they are read (real-models.md 10, #1012): the acquisition computes
      nothing, a read computes what it reads, at most 2^26 points at a time. Without a set sample rate the rate is the fastest of 128 GSa/s
      / 2^n not above points / 10 div'
  - header: :ACQuire:POINts:AUTO
    level: implemented
    note: 'p. 339: whether the memory depth follows AUTO. ON selects the AUTO depth (128 kpts), OFF keeps
      the present depth as a manual one; the query answers whether the setting sits at the AUTO value. The
      model stores one number: a depth that happens to equal the AUTO value reads back as AUTO (an OFF at
      the AUTO value is indistinguishable from it).'
  - header: :ACQuire:POINts:TESTLIMITS
    level: not_modeled
    note: 'Model work: query of the limits declared in the definition.'
    gap: model_work
  - header: :ACQuire:REDGe
    level: implemented
    note: 'p. 341: OFF is the only valid setting on the UXR and the query answers 0; anything else is -224.'
  - header: :ACQuire:RESPonse
    level: implemented
    note: 'FLATmag (default, the guide): flat magnitude, linear phase, a brick wall at :ACQuire:BANDwidth
      with its delay removed, so a step rings; GAUSsianmag: a Gaussian magnitude -3 dB at the same frequency,
      no ringing. The guide''s narrower Gaussian bandwidth is not given in figures: the simulation keeps
      the -3 dB point (#607)'
  - header: :ACQuire:SEGMented:AUToplay
    level: implemented
    note: "p. 343: whether segments play back automatically after a segmented acquisition. Playback is instantaneous here: the query replies the stored setting, not a playback in progress"
  - header: :ACQuire:SEGMented:COUNt
    level: implemented
    note: "p. 344: the segments one acquisition takes. At most 25,680 (data sheet Max # of segments, high-bandwidth trigger enabled; the disabled column 134,885 needs that trigger option, not modeled) and each segment is a full record (the real one divides its points among segments, not modeled); the acquisition errors -221 when the segments exceed the memory. The *RST count is not in the manual: 2 is a SimuBench value"
  - header: :ACQuire:SEGMented:INDex
    level: implemented
    note: "p. 345: the segment the reads and the display use. An index beyond the segments the latest acquisition has errors -222 and sets the index to the maximum segment number, as the manual says"
  - header: :ACQuire:SEGMented:PLAY
    level: implemented
    note: "p. 346: plays or stops the acquired segments. Playback is instantaneous here: the query replies the stored setting, not a playback in progress"
  - header: :ACQuire:SEGMented:PRATe
    level: implemented
    note: "p. 347: the navigation play rate, 0.001 to 1 s per segment. The power-on value is not in the manual: 0.1 is a SimuBench value"
  - header: :ACQuire:SEGMented:TTAGs
    level: implemented
    note: "p. 348: the time tags feature on or off. The manual does not gate :WAVeform:SEGMented:TTAG? on it, so the query answers whatever this is"
  - header: :ACQuire:SEGMented:VLSCapture
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :ACQuire:SRATe[:ANALog]
    level: implemented
    note: AUTO (the rate follows the memory depth), MAX or <rate> rounded to the next fastest of 128 GSa/s
      divided by a power of two (the data sheet); a set rate takes precedence over the memory depth (the
      guide's table) and the record holds rate x 10 div points, at most the memory depth (the rate
      steps down to fit). The query answers the rate in use
  - header: :ACQuire:SRATe[:ANALog]:AUTO
    level: implemented
    note: 'p. 352: whether the sample rate follows AUTO. ON selects AUTO, OFF keeps the present rate as a
      manual one; the query answers whether the setting sits at the AUTO value.'
  - header: :ACQuire:SRATe:TESTLIMITS
    level: not_modeled
    note: 'Model work: query of the limits declared in the definition.'
    gap: model_work
  - header: :ACQuire:VLSCapture:DURation
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
