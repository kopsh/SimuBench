# Rigol DSG815 的覆盖表：命令按 DSG800 系列编程指南（PGG02104-1110，Sept. 2018，软件版本
# 00.01.07）第 2 章的命令索引逐条列出；程度与说明手写。与手册的已知偏差写在对应命令的说明里：
#   * 频率/时间类回读按工程记数、但没有手册的 SI 前缀单位后缀（手册示例 4.00000000MHz，本定义
#     回 4.00000000E+06）；引擎的数字格式还不支持带前缀的单位后缀，能力 issue 见 #197 的留言。
#   * 只实现手册里与输出有关的常用子集：频率、电平、AM/FM/ΦM、步进频率扫描、触发、输出与
#     系统显示；其余按命令逐条标未实现（任意波/IQ、脉冲、LF 输出、列表与电平扫描、文件系统、
#     状态寄存器、通信配置）。
