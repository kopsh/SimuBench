#   * 频率类回读按手册带 SI 前缀与单位（4.00000000MHz，格式 number: si，#289）。
#   * 只实现手册里与输出有关的常用子集：频率、电平、AM/FM/ΦM、步进频率扫描、触发、输出与
#     系统显示；其余按命令逐条标未实现（任意波/IQ、脉冲、LF 输出、列表与电平扫描、文件系统、
#     状态寄存器、通信配置）。
