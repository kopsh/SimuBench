# Keysight 34970A 的覆盖表：按 34970A/34972A 用户指南（34972-90001, Edition 6, November 2019）
# 第 4 章 Features and Functions 的命令条目与命令索引逐条列出，程度与说明手写。
# 范围：固定配置 34970A + 槽 1 的 34901A（60 个号 101–120/201–220/301–320，槽 2/3 空）；
# DCV、继电器、扫描表、触发与读数缓冲；CONFigure/MEASure 的通道列表形式被 #300 阻塞，
# 电阻/电流被 #301 阻塞。未实现命令一律回复 -113,"Undefined header;not implemented in this definition"。
schema: simubench.coverage/1
model: keysight-34970a
sections:
- section: Common commands
  commands:
  - {header: '*CLS', level: implemented, note: '清错误队列、状态字节与标准事件寄存器（引擎内置）。'}
  - {header: '*ESE', level: implemented, note: '标准事件使能寄存器（引擎内置，整数回复）。'}
  - {header: '*ESR', level: implemented, note: '标准事件寄存器（引擎内置，读取后清）。'}
  - {header: '*IDN', level: implemented, note: 'Keysight Technologies,34970A,0,1.0-1.0-1.0（手册 p.176 的三段固件版本）。'}
  - {header: '*OPC', level: implemented, note: '*OPC 置 ESR 位 0；*OPC? 等扫描/读数完成后回 1。'}
  - {header: '*RCL', level: not_modeled, note: '状态存储（0–5）未建模。'}
  - {header: '*RST', level: implemented, note: '恢复手册的出厂状态：功能 DCV、量程自动、5½ 位（1 PLC）、10 MΩ、扫描表空、计数 1、间隔 0 s、触发源 IMMediate、继电器全开、显示开。'}
  - {header: '*SAV', level: not_modeled, note: '状态存储（0–5）未建模。'}
  - {header: '*SRE', level: implemented, note: '服务请求使能寄存器（引擎内置）。'}
  - {header: '*STB', level: implemented, note: '状态字节（引擎内置）：错误队列非空置位 2，输出缓冲有数据置位 4。'}
  - {header: '*TRG', level: implemented, note: '总线触发：触发等待中的扫描（触发源 BUS 时）；否则 -211。'}
  - {header: '*TST', level: implemented, note: '自检通过，回复 0。'}
  - {header: '*WAI', level: implemented, note: '等待扫描与读数完成。'}
