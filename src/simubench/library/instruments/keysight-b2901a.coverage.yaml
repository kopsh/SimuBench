# Keysight B2901A 的覆盖表：命令按 Agilent B2900 Series SCPI Command Reference
# （B2910-90030, Edition 2, July 2011）的命令索引逐条列出，程度与说明手写；第 6 章
# “Using Your Existing Programs”的 conventional 命令集是兼容层，不在本定义范围。
# 说明：源量程 V/I 共用一组设置（按当前源功能解释）；FETCh/READ/TRACe 固定输出
# VOLT,CURR,RES,TIME,STAT 五个元素（元素选择与 SOUR、标量“最新一条”未实现）。
schema: simubench.coverage/1
model: keysight-b2901a
sections:
- section: Common Commands
  commands:
  - header: '*CAL?'
    level: not_modeled
    note: 自校验是硬件流程；仿真的仪表无漂移可校准。
  - header: '*CLS'
    level: implemented
    note: 清状态字节、标准事件寄存器与错误队列；不清使能寄存器。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器（引擎内置，整数回复）。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器（引擎内置，整数回复）。
  - header: '*IDN'
    level: implemented
    note: Agilent Technologies,B2901A,<serial>,<firmware>。
  - header: '*OPC'
    level: implemented
    note: '*OPC 置 ESR 位 0；*OPC? 等全部待完成操作结束后回 1（等待按 NPLC 计的运行）。'
  - header: '*RCL'
    level: not_modeled
    note: 状态存储（0–9）未实现。
  - header: '*RST'
    level: implemented
    note: 恢复本定义的初始设置（值见各命令的 default/rst）。
  - header: '*SAV'
    level: not_modeled
    note: 状态存储（0–9）未实现。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器（引擎内置，整数回复）。
  - header: '*STB'
    level: implemented
    note: 状态字节寄存器（引擎内置，整数回复）。
  - header: '*TRG'
    level: implemented
    note: 总线触发：仅触发源 BUS 且等待触发时接受，否则 -211。
  - header: '*TST'
    level: implemented
    note: 自检通过，回复 0。
  - header: '*WAI'
    level: implemented
    note: 等待全部待完成操作。
