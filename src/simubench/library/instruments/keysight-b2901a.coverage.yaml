    level: implemented
    note: 本次运行全部读数的电压元素。
  - header: :FETCh:ARRay:CURRent
    level: implemented
    note: 本次运行全部读数的电流元素。
  - header: :FETCh:ARRay:RESistance
    level: implemented
    note: 本次运行全部读数的电阻元素（V/I 计算，无电流时为 +9.91E+37）。
  - header: :FETCh:ARRay:TIME
    level: implemented
    note: 本次运行全部读数的时刻元素。
  - header: :FETCh:ARRay:STATus
    level: implemented
    note: 本次运行全部读数的状态元素（按数字格式回复，手册为 NR1）。
  - header: :FETCh:ARRay:SOURce?
    level: not_modeled
    note: 源输出值元素未实现（测量组件只给出 V/I/R/TIME/STAT）。
