- section: 3.3 Measurement Commands
  commands:
  - header: :FETCh:VOLTage
    level: implemented
    note: The live reading (no buffered acquisition).
  - header: :FETCh:CURRent
    level: implemented
    note: The live reading.
  - header: :FETCh:POWer[:DC]
    level: implemented
    note: The live reading.
  - header: :MEASure:VOLTage[:DC]
    level: implemented
    note: Takes 117 ms (NPLC 7 of the *RST table at 60 Hz; the manual gives no time — a SimuBench value); the reply is the reading at the start.
  - header: :MEASure:CURRent[:DC]
    level: implemented
    note: Takes 117 ms, as :MEASure:VOLTage.
  - header: :SENSe:AVERage:COUNt
    level: accepted
    affects_data: false
    note: '2–16, *RST 8: the readings have no noise model.'
