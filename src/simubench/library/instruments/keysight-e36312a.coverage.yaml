  - {header: '*SRE', level: implemented, note: 服务请求使能寄存器（引擎内置）。}
  - {header: '*STB', level: implemented, note: 状态字节（引擎内置）。}
  - {header: '*TRG', level: not_modeled, note: 触发系统不在首波。}
  - {header: '*TST', level: implemented, note: 自检通过，回复 0。}
  - {header: '*WAI', level: implemented, note: 等待全部待完成操作（输出继电器的 0.01 s 动作计入虚拟时间）。}
