  - {header: 'OUTPut:PAIR', level: implemented, note: '内部串联（输出 2 为 50 V/1 A）与并联（25 V/2 A），输出 3 停止工作；改组合需输出 2、3 关闭（-221）。组合下输出 2 的 VOLT/CURR/OVP 上限与 MIN/MAX 随之变化（#259）。'}
  - {header: 'OUTPut:PON:STATe', level: accepted, note: 接受：上电状态（RST 或 RCL0–9）保存并回读；状态存储本身未实现。, affects_data: false}
