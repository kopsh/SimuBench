# Keysight E36312A 的覆盖表：按 E36300 系列编程指南（E36311-90008, Edition 12, June 2025）
# 的命令索引与命令条目逐条列出，程度与说明手写。范围：三路独立输出的设定/回读、OVP、远端检测、
# 显示/蜂鸣/系统接受命令与公共命令；组合/跟踪按手册实现（#259），OCP 与状态寄存器被 #271 阻塞。
# 未实现命令一律回复 -113,"Undefined header;not implemented in this definition"。
schema: simubench.coverage/1
model: keysight-e36312a
