  - {header: 'STATus:QUEStionable[:EVENt]', level: implemented, note: 事件寄存器，读后清零；位 13（8192，ISUM）汇总 QUEStionable:INSTrument，其余位恒 0（E36311-90008 Edition 3（2017） Status Tutorial > The Questionable Status register，p.31，#379）。}
  - {header: 'STATus:QUEStionable:ENABle', level: implemented, note: 使能掩码；QUEStionable 的汇总进状态字节位 3（E36311-90008 Edition 3（2017） Status Tutorial，#379）。}
  - {header: 'STATus:QUEStionable:INSTrument[:EVENt]', level: implemented, note: 事件寄存器，读后清零；位 1/2/3 汇总输出 1（+6 V）/2（+25 V）/3（−25 V）的 ISUMmary<n>（E36311-90008 Edition 3（2017） The Questionable Instrument register，p.31，#379）。}
  - {header: 'STATus:QUEStionable:INSTrument:ENABle', level: implemented, note: 使能掩码（手册示例 STAT:QUES:INST:ENAB 14 使能位 1–3，E36311-90008 Edition 3（2017） p.31，#379）。}
  - {header: 'STATus:QUEStionable:INSTrument:ISUMmary<n>[:EVENt]', level: implemented, note: 每路的事件寄存器：位 0 CC（电压未调节）、位 1 CV（电流未调节），条件位变为真时置位，读后清零（E36311-90008 Edition 3（2017） The Questionable Instrument Summary register，p.32，#379）。}
