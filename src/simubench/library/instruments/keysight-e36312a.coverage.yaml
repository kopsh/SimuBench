  - {header: 'STATus:QUEStionable:INSTrument:ISUMmary<n>:ENABle', level: implemented, note: 每路的使能掩码（手册示例 STAT:QUES:INST:ISUM<n>:ENAB 3，E36311-90008 Edition 3（2017） p.31，#379）。}
