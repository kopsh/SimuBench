- section: CURRent Subsystem
  commands:
  - {header: '[:SOURce]:CURRent[:LEVel][:IMMediate][:AMPLitude]', level: implemented, note: 每路的立即电流限值；通道列表展开，省略时按通道 1。量程 0.001–5.15 A（CH1）/1.03 A（CH2、CH3）。查询的 MIN/MAX/DEF 形式按该路的量程下限/上限/默认值回答（#297）。}
  - {header: '[SOURce:]CURRent[:LEVel]:TRIGgered[:AMPLitude]', level: not_modeled}
  - {header: '[SOURce:]CURRent:MODE', level: not_modeled}
  - {header: '[:SOURce]:CURRent:PROTection:CLEar', level: implemented, note: 只清除 OCP 锁定并恢复故障前的输出状态（#271）；OVP 锁定不受影响。}
  - {header: '[:SOURce]:CURRent:PROTection:DELay[:TIME]', level: implemented, note: '输出处于 CC 超过该时间即跳闸（#271）；0–3600 s。*RST 0.050 s（50 ms），按 E36311-90008 Edition 3（2017） 的 [SOURce:]CURRent:PROTection:DELay 一节（p.46）与 Factory Reset State 表（p.26）核实（#379）。计时从仿真看到 CC 起（下一条命令或查询），不早于此。'}
  - {header: '[:SOURce]:CURRent:PROTection:DELay:STARt', level: implemented, note: SCHange：进入 CC 或在 CC 中改设定（电压、电流、输出）都重新计时；CCTRans：只在进入 CC 时计时（#271）。}
  - {header: '[:SOURce]:CURRent:PROTection:STATe', level: implemented, note: OCP 使能，*RST 关（#271）；手册没有电流阈值命令，跳闸按 CC 持续时间。}
  - {header: '[:SOURce]:CURRent:PROTection:TRIPped', level: implemented, note: 只回 OCP 锁定（#271）；VOLT:PROT:TRIP? 只回 OVP。}
