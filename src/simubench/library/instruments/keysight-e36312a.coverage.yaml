  - {header: 'MEASure[:SCALar]:VOLTage[:DC]', level: implemented, note: 每路回读电压，来自输出端口的电路求解；通道列表按顺序逗号拼接。回读由 supply_readback 写成 7 位尾数。手册可选的 P6V/P25V/N25V/CH1… 输出标识前缀未实现。}
