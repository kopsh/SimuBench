# Keysight DAQ970A 的覆盖表：按 DAQ970A/DAQ973A Programming Guide（DAQ97-90002, Edition 3, March 2020）
# 的目录（第 2 章 SCPI Programming，各子系统的命令条目）逐条列出，程度与说明手写。
# 范围：固定配置 DAQ970A + 槽 1 的 DAQM901A（101–122；槽 2/3 号域存在但无模块）；直流/交流电压、两线/四线
# 电阻、直流/交流电流（121/122）、继电器、扫描表、触发与读数存储器、CONFigure/MEASure 的通道列表形式。
# 未实现命令一律回复 -113,"Undefined header;not implemented in this definition"。
