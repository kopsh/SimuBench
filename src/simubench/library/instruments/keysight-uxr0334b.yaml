schema: simubench.instrument/1
id: keysight-uxr0334b
manufacturer: Keysight Technologies
model: UXR0334B
class: oscilloscope
version: 1
description: >-
  Keysight Infiniium UXR0334B, 4 channels, 33 GHz, 128 GSa/s, 10-bit ADC, 50 ohm inputs. Real model
  (D42): commands, replies and default-setup values follow the Infiniium UXR-Series Oscilloscopes
  Programmer's Guide 11.60.00000 (9018-07723); ranges follow the UXR-B data sheet 3123-1313. The
  Infiniium dialect next to the InfiniiVision DSO-X 2024A (#338). Values neither document gives are
  SimuBench defaults, listed in the coverage table.
reference:
  title: Keysight Infiniium UXR-Series Oscilloscopes Programmer's Guide
  document: 9018-07723
  version: "Version 11.60.00000, March 2024"
  firmware: "Infiniium UXR-Series software 11.60"
identity:
  # *IDN? per the guide: Keysight Technologies,<Model #>,<USXXXXXXXX>,<Rev #>[,<Options>].
  idn: "Keysight Technologies,UXR0334B,{serial},{firmware}"
  serial: MY64280101
  firmware: "11.60.00000"
# :SYSTem:ERRor? is the model's own command (a number, or with STRing the number and the text).
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST"]
# The guide: the error queue is 30 errors deep.
error_queue: 30
# The guide's sample reply for :CHANnel1:RANGe? is +8.00000E-01: NR3, five decimals, signed.
format:
  number: nr3
  digits: 5
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  # The guide's example programs test an empty queue with "0," at the start of the reply.
  error_code: plain
errors:
  0: "No error"
# 应答头与长格式（手册 :SYSTem:HEADer、:SYSTem:LONGform、:MODel? 的表 13）。
dialect:
  echo_header: $system.header
  long_form: $system.longform
specs:
  source: Infiniium UXR-B Series Oscilloscopes Data Sheet 3123-1313 (2024-04-25), 3.5 mm input models
  bandwidth_hz: 3.3e10
  warranted_bandwidth_hz: 3.2e10
  sample_rate: 1.28e11
  memory_depth_pts: 5.0e8
  vertical_resolution_bits: 10
  input_sensitivity_v_div: [1.0e-3, 1.0]
  input: {r_ohm: 50.0, r_tolerance: 0.03, coupling: DC}
  offset_range_v: {"1 mV to 54 mV/div": 0.4, "55 mV to 93 mV/div": 0.7, "94 mV to 172 mV/div": 1.25, "173 mV to 306 mV/div": 2.25, "307 mV to 1 V/div": 4.0}
  dc_gain_accuracy: "±1.5% of full scale"
  offset_accuracy: "±(1% of channel offset + 1% of full scale + 400 µV)"
  timebase_s_div: [2.0e-12, 20.0]
  timebase_delay_s: [-200.0, 200.0]
  time_scale_accuracy: "±(25 ppb initial + 100 ppb/year aging) first year"
  trigger_sensitivity: "1 div p-p"
  trigger_level_range: "±4 div from center screen or ±4 V, whichever is smaller; AUX ±5 V"
  trigger_holdoff_s: [4.0e-8, 10.0]
  trigger_jitter_s_rms: 2.5e-14
  noise_floor: >-
    published per division: the Infiniium UXR-B Series data sheet 3123-1313's "RMS Noise Floor –
    Performance Characteristics (Measured)" table, UXR0334B column (page 8): 266 µV rms at
    4 mV/div (32 mV full scale) rising to 28.8 mV rms at 1 V/div (8 V full scale). The A-series
    sheet's UXR0334A column is identical, so the B revision kept the measured table (#786).
  noise_per_division: >-
    the data sheet's measured RMS Noise Floor table per full scale (4 mV/div to 1 V/div, #786).
    The table's most sensitive setting is 4 mV/div (32 mV full scale): the 1 and 2 mV/div rows
    hold that 266 µV (the preamp floor), and 5 mV/div interpolates 4 and 10 mV/div on log-log
    (291 µV). About 3.7 codes rms at 10 bits (128 codes per division) at 0.1 V/div. Per-division
    values in the scope_vertical noise_table.
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  # 操作状态使能（:OPEEnable）：位 0 ACQ DONE、位 1 PROC DONE、位 5 WAIT TRIG、位 11 AUTO TRIG；摘要进 *STB 位 7。
  status.opee:
    type: int
    min: 0
    max: 65535
    default: 0
    label: 操作状态使能
    label_en: Operation status enable
  # 应答头（:SYSTem:HEADer）与长格式（:SYSTem:LONGform）两个开关（dialect，#602）；上电值是用户偏好，
  # 手册未给，SimuBench 取 OFF。
  system.header:
    type: bool
    default: false
    label: 应答头
    label_en: Response headers
  system.longform:
    type: bool
    default: false
    label: 长格式应答
    label_en: Long-form responses
  timebase.scale:
    type: float
    unit: S
    min: 5.0e-12
    max: 20.0
    default: 1.0e-7
    label: 时基
    label_en: Timebase
  timebase.position:
    type: float
    unit: S
    min: -200.0
    max: 200.0
    default: 0.0
    label: 水平位置
    label_en: Position
  timebase.reference:
    type: enum
    options: [LEFT, CENTer, RIGHt]
    default: CENTer
    label: 时间参考
    label_en: Reference
  trigger.mode:
    type: enum
    options: [EDGE]
    default: EDGE
    not_modeled:
      GLITch: glitch trigger is not modeled
      PWIDth: pulse width trigger is not modeled
      PATTern: pattern trigger is not modeled
      STATe: state trigger is not modeled
      RUNT: runt trigger is not modeled
      SHOLd: setup and hold trigger is not modeled
      TRANsition: transition trigger is not modeled
      DELay: delay trigger is not modeled
      TIMeout: timeout trigger is not modeled
      WINDow: window trigger is not modeled
      OR: ORed edges trigger is not modeled
      EBURst: burst trigger is not modeled
      SEQuence: sequence trigger is not modeled
      IFMagn: IF magnitude trigger is not modeled
    label: 触发类型
    label_en: Trigger type
  trigger.sweep:
    type: enum
    options: [AUTO, TRIGgered]
    default: AUTO
    not_modeled: {SINGle: "the single sweep (the guide: do not use in new programs; use :SINGle)"}
    label: 触发方式
    label_en: Trigger sweep
  trigger.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, AUXiliary]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4, AUXiliary: AUX}
    default: CHANnel1
    label: 触发源
    label_en: Trigger source
  # 每个信源一个触发电平（手册 :TRIGger:LEVel {CHANnel<N> | AUX},<level>）；默认设置为 0 V。
  trigger.level1: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH1, label_en: Trigger level CH1}
  trigger.level2: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH2, label_en: Trigger level CH2}
  trigger.level3: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH3, label_en: Trigger level CH3}
  trigger.level4: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH4, label_en: Trigger level CH4}
  # AUX 输入 ±5 V（数据手册）。
  trigger.level5: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.0, label: 触发电平 AUX, label_en: Trigger level AUX}
  trigger.slope:
    type: enum
    options: [POSitive, NEGative, EITHer, ALTernate]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  # 手册：释抑 100 ns 到 10 s（数据手册写 40 ns 起，按编程手册）。
  trigger.holdoff:
    type: float
    unit: S
    min: 1.0e-7
    max: 10.0
    default: 1.0e-7
    label: 释抑时间
    label_en: Holdoff
  acquire.mode:
    type: enum
    options: [RTIMe]
    default: RTIMe
    not_modeled:
      PDETect: real-time peak detect is not modeled
      HRESolution: real-time high resolution is not modeled
      SEGMented: segmented memory is not modeled
      SEGPdetect: segmented memory is not modeled
      SEGHres: segmented memory is not modeled
    label: 采集模式
    label_en: Acquire mode
  acquire.average:
    type: bool
    default: false
    label: 平均
    label_en: Averaging
  acquire.count:
    type: int
    min: 2
    max: 1048575
    default: 16
    label: 平均次数
    label_en: Averages
  acquire.complete:
    type: int
    min: 0
    max: 100
    default: 90
    label: 采集完成判据
    label_en: Acquire complete
  # 存储深度：AUTO 由示波器选择（SimuBench 取 128 kpts，默认时基下正好 128 GSa/s）；手动值到 500 Mpts
  # （真机标配 500 Mpts）。超过 2^22 点的记录读的时候才算（#1012，real-models.md“深存储是怎样仿真的”）。
  acquire.points:
    type: int
    min: 16
    max: 500000000
    default: 128000
    special: {AUTO: 128000}
    label: 存储深度
    label_en: Memory depth
  # 采样率（:ACQuire:SRATe[:ANALog]）：AUTO（0）随存储深度；设定值取下一个更快的档（128 GSa/s 除以
  # 2 的幂，手册），优先于存储深度。
  acquire.srate:
    type: float
    unit: HZ
    min: 0.0
    max: 1.28e11
    default: 0.0
    special: {AUTO: 0.0, MAX: 1.28e11}
    label: 采样率设定
    label_en: Sample rate setting
  # 带宽滤波（:ACQuire:BANDwidth）：MAX 为硬件带宽 33 GHz；AUTO 未建模。
  acquire.bandwidth:
    type: float
    unit: HZ
    min: 1.0e8
    max: 3.3e10
    default: 3.3e10
    special: {MAX: 3.3e10}
    not_modeled: {AUTO: the automatic bandwidth selection is not modeled}
    label: 带宽
    label_en: Bandwidth
  # 带宽滤波的幅度响应（:ACQuire:RESPonse）：FLATmag（默认，平坦幅度、线性相位，阶跃有振铃）或
  # GAUSsianmag（高斯幅度，无振铃），-3 dB 点都在 :ACQuire:BANDwidth（#607）。
  acquire.response:
    type: enum
    options: [FLATmag, GAUSsianmag]
    default: FLATmag
    label: 带宽滤波响应
    label_en: Filter response
  waveform.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, FUNCtion1, FUNCtion2, FUNCtion3, FUNCtion4, FUNCtion5, FUNCtion6, FUNCtion7, FUNCtion8, FUNCtion9, FUNCtion10, FUNCtion11, FUNCtion12, FUNCtion13, FUNCtion14, FUNCtion15, FUNCtion16]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4, FUNCtion1: F1, FUNCtion2: F2, FUNCtion3: F3, FUNCtion4: F4, FUNCtion5: F5, FUNCtion6: F6, FUNCtion7: F7, FUNCtion8: F8, FUNCtion9: F9, FUNCtion10: F10, FUNCtion11: F11, FUNCtion12: F12, FUNCtion13: F13, FUNCtion14: F14, FUNCtion15: F15, FUNCtion16: F16}
    default: CHANnel1
    label: 波形传输源
    label_en: Waveform source
  # 手册：默认格式为 ASCii。
  waveform.format:
    type: enum
    options: [ASCii, BYTE, WORD]
    default: ASCii
    not_modeled: {BINary: the BINary format is not modeled, FLOat: color grade data is not modeled}
    label: 波形格式
    label_en: Waveform format
  waveform.byteorder:
    type: enum
    options: [MSBFirst, LSBFirst]
    default: MSBFirst
    label: 波形字节序
    label_en: Waveform byte order
  # 流式传输：ON 时 :WAVeform:DATA? 回 #0 不定长块（手册 Streaming On）；默认 OFF 为 SimuBench 值。
  waveform.streaming:
    type: bool
    default: false
    label: 流式传输
    label_en: Streaming
  measure.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 测量信源
    label_en: Measure source
  measure.source2:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel2
    label: 测量信源 2
    label_en: Measure source 2
  # 界面与身份：前面板锁定、隐藏指示灯、屏幕文字、标签显示与网格亮度都不改变数据。
  system.lock: {type: bool, default: false, label: 前面板锁定, label_en: Front panel lock}
  system.hled: {type: bool, default: false, label: 隐藏指示灯, label_en: Hide LEDs}
  system.dsp: {type: string, default: "", label: 屏幕文字, label_en: Display text}
  display.label: {type: bool, default: false, label: 显示标签, label_en: Labels}
  display.intensity: {type: int, min: 0, max: 100, default: 50, label: 网格亮度, label_en: Grid intensity}
  # ---- 数学函数（#1074，手册第 22 章）：FUNCtion1-16 的定义存放在 function<f>.* 设置里，
  # 波形在读的时候从源记录算出（scope_math）。手册未给默认值的条目为 SimuBench 值，覆盖表注明。
  function.peak_sort:
    type: enum
    options: [DMAGnitude, IMAGnitude, DFRequency, IFRequency]
    default: DMAGnitude
    label: FFT 峰值排序
    label_en: FFT peak sort
  # 函数 1。
  function1.operator: {type: enum, options: [NONE, ADD, SUBTract, MULTiply, DIVide, COMMonmode, ABSolute, INVert, SQUare, SQRT, MAGNify, DIFF, INTegrate, AVERage, DELay, GATing, SMOoth, HIGHpass, LOWPass, MAXimum, MINimum, FFTMagnitude, FFTPhase, PSDensity], default: NONE, label: 函数1 operator, label_en: 'Function 1 operator'}
  function1.source1: {type: string, default: "", label: 函数1 source1, label_en: 'Function 1 source1'}
  function1.source2: {type: string, default: "", label: 函数1 source2, label_en: 'Function 1 source2'}
  function1.display: {type: bool, default: false, label: 函数1 display, label_en: 'Function 1 display'}
  function1.vertical: {type: enum, options: [AUTO, MANual], default: AUTO, label: 函数1 vertical, label_en: 'Function 1 vertical'}
  function1.range: {type: float, unit: V, min: -100.0e15, max: 100.0e15, default: 8.0, label: 函数1 range, label_en: 'Function 1 range'}
  function1.offset: {type: float, unit: V, default: 0.0, label: 函数1 offset, label_en: 'Function 1 offset'}
  function1.horizontal: {type: enum, options: [AUTO, MANual], default: AUTO, label: 函数1 horizontal, label_en: 'Function 1 horizontal'}
  function1.h_position: {type: float, unit: S, default: 0.0, label: 函数1 h_position, label_en: 'Function 1 h_position'}
  function1.h_range: {type: float, unit: S, default: 0.0, label: 函数1 h_range, label_en: 'Function 1 h_range'}
  function1.delay: {type: float, unit: S, default: 0.0, label: 函数1 delay, label_en: 'Function 1 delay'}
  function1.gate_start: {type: float, unit: S, default: 0.0, label: 函数1 gate_start, label_en: 'Function 1 gate_start'}
  function1.gate_stop: {type: float, unit: S, default: 0.0, label: 函数1 gate_stop, label_en: 'Function 1 gate_stop'}
  function1.smooth: {type: int, min: 3, max: 4001, default: 5, label: 函数1 smooth, label_en: 'Function 1 smooth'}
  function1.average: {type: int, min: 2, max: 65534, default: 16, label: 函数1 average, label_en: 'Function 1 average'}
  function1.hp_bw: {type: float, unit: HZ, min: 50.0, max: 50.0e9, default: 1.0e6, label: 函数1 hp_bw, label_en: 'Function 1 hp_bw'}
  function1.lp_bw: {type: float, unit: HZ, min: 50.0, max: 50.0e9, default: 1.0e6, label: 函数1 lp_bw, label_en: 'Function 1 lp_bw'}
  function1.window: {type: enum, options: [RECTangular, HANNing, HAMMing, BHARris, FLATtop], default: HANNing, label: 函数1 window, label_en: 'Function 1 window'}
  function1.vunits: {type: enum, options: [DB, DBMV, DBUV, WATT, VRMS, DBMHZ, WATTHZ, VRTHZ], default: DB, label: 函数1 vunits, label_en: 'Function 1 vunits'}
  function1.span: {type: float, unit: HZ, min: 0.0, max: 1.0e12, default: 0.0, label: 函数1 span, label_en: 'Function 1 span'}
  function1.center: {type: float, unit: HZ, min: -1.0e12, max: 1.0e12, default: 0.0, label: 函数1 center, label_en: 'Function 1 center'}
  function1.start: {type: float, unit: HZ, default: 0.0, label: 函数1 start, label_en: 'Function 1 start'}
  function1.stop: {type: float, unit: HZ, default: 0.0, label: 函数1 stop, label_en: 'Function 1 stop'}
  function1.impedance: {type: float, unit: OHM, min: 20.0, max: 200.0, default: 50.0, label: 函数1 impedance, label_en: 'Function 1 impedance'}
  function1.tdelay: {type: float, unit: S, default: 0.0, label: 函数1 tdelay, label_en: 'Function 1 tdelay'}
  function1.fft_ref: {type: enum, options: [DISPlay, TRIGger], default: DISPlay, label: 函数1 fft_ref, label_en: 'Function 1 fft_ref'}
  function1.hsc: {type: enum, options: [LINear, LOG], default: LINear, label: 函数1 hsc, label_en: 'Function 1 hsc'}
  function1.detector: {type: enum, options: ["OFF", SAMPle, PPOSitive, PNEGative, NORMal, AVERage], default: "OFF", label: 函数1 detector, label_en: 'Function 1 detector'}
  function1.detector_points: {type: int, min: 0, max: 1000000, default: 0, label: 函数1 detector_points, label_en: 'Function 1 detector_points'}
  function1.peak_state: {type: bool, default: false, label: 函数1 peak_state, label_en: 'Function 1 peak_state'}
  function1.peak_count: {type: int, min: 1, max: 100, default: 3, label: 函数1 peak_count, label_en: 'Function 1 peak_count'}
  function1.peak_level: {type: float, unit: DBM, default: -30.0, label: 函数1 peak_level, label_en: 'Function 1 peak_level'}
  function1.label: {type: string, default: "", label: 函数1 label, label_en: 'Function 1 label'}
  # 函数 2。
  function2.operator: {type: enum, options: [NONE, ADD, SUBTract, MULTiply, DIVide, COMMonmode, ABSolute, INVert, SQUare, SQRT, MAGNify, DIFF, INTegrate, AVERage, DELay, GATing, SMOoth, HIGHpass, LOWPass, MAXimum, MINimum, FFTMagnitude, FFTPhase, PSDensity], default: NONE, label: 函数2 operator, label_en: 'Function 2 operator'}
  function2.source1: {type: string, default: "", label: 函数2 source1, label_en: 'Function 2 source1'}
  function2.source2: {type: string, default: "", label: 函数2 source2, label_en: 'Function 2 source2'}
  function2.display: {type: bool, default: false, label: 函数2 display, label_en: 'Function 2 display'}
  function2.vertical: {type: enum, options: [AUTO, MANual], default: AUTO, label: 函数2 vertical, label_en: 'Function 2 vertical'}
  function2.range: {type: float, unit: V, min: -100.0e15, max: 100.0e15, default: 8.0, label: 函数2 range, label_en: 'Function 2 range'}
  function2.offset: {type: float, unit: V, default: 0.0, label: 函数2 offset, label_en: 'Function 2 offset'}
  function2.horizontal: {type: enum, options: [AUTO, MANual], default: AUTO, label: 函数2 horizontal, label_en: 'Function 2 horizontal'}
  function2.h_position: {type: float, unit: S, default: 0.0, label: 函数2 h_position, label_en: 'Function 2 h_position'}
  function2.h_range: {type: float, unit: S, default: 0.0, label: 函数2 h_range, label_en: 'Function 2 h_range'}
  function2.delay: {type: float, unit: S, default: 0.0, label: 函数2 delay, label_en: 'Function 2 delay'}
  function2.gate_start: {type: float, unit: S, default: 0.0, label: 函数2 gate_start, label_en: 'Function 2 gate_start'}
  function2.gate_stop: {type: float, unit: S, default: 0.0, label: 函数2 gate_stop, label_en: 'Function 2 gate_stop'}
  function2.smooth: {type: int, min: 3, max: 4001, default: 5, label: 函数2 smooth, label_en: 'Function 2 smooth'}
  function2.average: {type: int, min: 2, max: 65534, default: 16, label: 函数2 average, label_en: 'Function 2 average'}
  function2.hp_bw: {type: float, unit: HZ, min: 50.0, max: 50.0e9, default: 1.0e6, label: 函数2 hp_bw, label_en: 'Function 2 hp_bw'}
  function2.lp_bw: {type: float, unit: HZ, min: 50.0, max: 50.0e9, default: 1.0e6, label: 函数2 lp_bw, label_en: 'Function 2 lp_bw'}
  function2.window: {type: enum, options: [RECTangular, HANNing, HAMMing, BHARris, FLATtop], default: HANNing, label: 函数2 window, label_en: 'Function 2 window'}
  function2.vunits: {type: enum, options: [DB, DBMV, DBUV, WATT, VRMS, DBMHZ, WATTHZ, VRTHZ], default: DB, label: 函数2 vunits, label_en: 'Function 2 vunits'}
  function2.span: {type: float, unit: HZ, min: 0.0, max: 1.0e12, default: 0.0, label: 函数2 span, label_en: 'Function 2 span'}
  function2.center: {type: float, unit: HZ, min: -1.0e12, max: 1.0e12, default: 0.0, label: 函数2 center, label_en: 'Function 2 center'}
  function2.start: {type: float, unit: HZ, default: 0.0, label: 函数2 start, label_en: 'Function 2 start'}
  function2.stop: {type: float, unit: HZ, default: 0.0, label: 函数2 stop, label_en: 'Function 2 stop'}
  function2.impedance: {type: float, unit: OHM, min: 20.0, max: 200.0, default: 50.0, label: 函数2 impedance, label_en: 'Function 2 impedance'}
  function2.tdelay: {type: float, unit: S, default: 0.0, label: 函数2 tdelay, label_en: 'Function 2 tdelay'}
  function2.fft_ref: {type: enum, options: [DISPlay, TRIGger], default: DISPlay, label: 函数2 fft_ref, label_en: 'Function 2 fft_ref'}
