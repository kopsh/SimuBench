channel_state:
  display:
    type: bool
    default: false
    label: 显示
    label_en: Display
  # 反相（:CHANnel<N>:INVert，#1067）：波形绕 0 V 反射——记录样点取负，测量随读数翻转（用例证明）。
  invert:
    type: bool
    default: false
    label: 反相
    label_en: Invert
  # 通道垂直单位（:CHANnel<N>:UNITs，#1067）：VOLT/AMPere/WATT/UNKNown；单位的换算显示未建模，
  # :WAVeform:YUNits? 随之回答（覆盖表注明）。
  units:
    type: enum
    options: [VOLT, AMPere, WATT, UNKNown]
    default: VOLT
    label: 垂直单位
    label_en: Vertical units
  # 探头衰减（:CHANnel<N>:PROBe:ATTenuation DIV1|DIV10，#1067）：显示假设的探头衰减比（DIV1=1、
  # DIV10=10），读数随之改变（用例证明）。手册限定 1154A 探头（未接报 settings conflict）；
  # 模型按通用探头建模，无探头识别（覆盖表注明）。
  probe:
    type: float
    min: 1.0e-9
    max: 1.0e9
    default: 1.0
    label: 探头衰减比
    label_en: Probe attenuation
  # 探头通道间偏斜（:CHANnel<N>:PROBe:SKEW，#1067）：该通道记录滞后这么多秒（采样提前），读数的
  # 时间原点随之移动（用例证明）。
  probe_skew:
    type: float
    unit: S
    min: -1.0e-3
    max: 1.0e-3
    default: 0.0
    label: 探头偏斜
    label_en: Probe skew
  # 1154A 探头的放大器增益与探头耦合（#1067）：探头硬件未建模，设定存值（覆盖表注明）。
  probe_gain:
    type: enum
    options: [X1, X10]
    default: X1
    label: 探头增益
    label_en: Probe gain
    readonly:
  probe_coupling:
    type: enum
    options: [DC, AC]
    default: DC
    label: 探头耦合
    label_en: Probe coupling
  # 外部探头模式及其增益/偏置/单位（#1067）：外部信号调理未建模，设定存值（覆盖表注明）。
  probe_external:
    type: bool
    default: false
    label: 外部探头
    label_en: External probe
  probe_ext_gain: {type: float, default: 1.0, label: 外部探头增益, label_en: External gain}
  probe_ext_offset: {type: float, unit: V, default: 0.0, label: 外部探头偏置, label_en: External offset}
  probe_ext_units:
    type: enum
    options: [VOLT, AMPere, WATT, UNKNown]
    default: VOLT
    label: 外部探头单位
    label_en: External units
  # 1 mV/div 到 1 V/div（3.5 mm 输入型号的显示灵敏度，数据手册）；默认设置 1 V/div。
  scale:
    type: float
    unit: V
    min: 1.0e-3
    max: 1.0
    default: 1.0
    label: 垂直档位
    label_en: Scale
  offset:
    type: float
    unit: V
    min: -4.0
    max: 4.0
    default: 0.0
    label: 偏置
    label_en: Offset
  # 手册：UXR 的输入只有 DC50（DCFifty 为同义词）。
  input:
    type: enum
    options: [DC50, DCFifty]
    replies: {DCFifty: DC50}
    option_labels: {DC50: "DC 50 Ω", DCFifty: "DC 50 Ω"}
    default: DC50
    label: 输入
    label_en: Input
  label:
    type: string
    default: ""
    label: 通道标签
    label_en: Label
  # 通道的带宽限制（:CHANnel<N>:ISIM:BWLimit / :BANDwidth / :BWLimit:TYPE，#609）：在前端之后再滤一级。
  # 截止频率 1 kHz 起（手册），上限取 128 GSa/s 的一半；上电值 OFF、10 GHz、WALL 为 SimuBench 值。
  isim_bwlimit:
    type: bool
    default: false
    label: 通道带宽限制
    label_en: Channel BW limit
  isim_bandwidth:
    type: float
    unit: HZ
    min: 1.0e3
    max: 6.4e10
    default: 1.0e10
    label: 通道带宽限制频率
    label_en: Channel BW limit frequency
  isim_type:
    type: enum
    options: [WALL, BESSEL4, BUTTerworth]
    default: WALL
    not_modeled:
      BANDpass: the bandpass filter (phase noise analysis) is not modeled
      BP5: the Frequency Extension bandpass filters are not modeled
      BP10: the Frequency Extension bandpass filters are not modeled
      BP20: the Frequency Extension bandpass filters are not modeled
      BP30: the Frequency Extension bandpass filters are not modeled
      P802P3DJ: the raised cosine reference receiver filters are not modeled
      OIFCEI6: the raised cosine reference receiver filters are not modeled
    label: 通道带宽限制类型
    label_en: Channel BW limit type
  # 通道频谱视图（SPECtral 信号类型，手册 p.551）的窗口设置：数据路径是 :FUNCtion FFT（#1074），
  # 视图本身未建模。
  spectral_center: {type: float, unit: HZ, min: -1.0e12, max: 1.0e12, default: 0.0, unset: 0.0, label: 频谱中心频率, label_en: Spectral center}
  spectral_span: {type: float, unit: HZ, min: 0.0, max: 1.0e12, default: 0.0, unset: 0.0, label: 频谱跨度, label_en: Spectral span}
  probe_attenuation:
  ext_gain:
  ext_gain_unit:
  skew:
  grid:
  grid_area:
  grid_view:
# 个体偏差（数据手册 3123-1313，按种子抽取，metrology-authoring.md 7）：直流增益精度 ±1.5% 满量程；
# 偏置精度 ±(1% 偏置设定 + 1% 满量程 + 400 µV)（满量程 = 8 格）；时基 25 ppb。
deviations:
  - param: front.gain_error_ppm
    limit: 15000.0
    distribution: uniform
  - param: front.offset_error
    by: {scale: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1]}
    limit: {0.001: 0.00072, 0.002: 0.00056, 0.005: 0.0008, 0.01: 0.0012, 0.02: 0.002, 0.05: 0.0044, 0.1: 0.0084, 0.2: 0.0164, 0.5: 0.0404, 1: 0.0804}
    distribution: uniform
  - param: front.dac_error_ppm
    limit: 10000.0
    distribution: uniform
  - param: timebase.clock_ppm
    limit: 0.025
    distribution: uniform
components:
  # 磁盘（:DISK，手册第 20 章，#1069）：C:\ 为本机一个文件夹；默认路径 C:\Users\Public\Documents\Infiniium；
  # 文件名不区分大小写；:DISK:PWD? 在 :DISK:CDIRectory 改过之前回空字符串。
  - name: disk
    type: file_system
    params:
      drives: [C]
      home: "C:\\Users\\Public\\Documents\\Infiniium"
      reset_home: false
      catalog: lines
  # 设置存取（#1070）：*SAV/*RCL 与 :STORe/:RECall:SETup 共用寄存器 0–9（手册第 13、14 章）；空寄存器只在
  # 屏幕上提示，不进错误队列。*LRN? 回 ":SYST:SET " 加定长块，原样发回即恢复；:DISK:SAVE:SETup 存 .set 文件。
  - name: setups
    type: setup_memory
    params:
      storage: disk
      registers: 10
      first: 0
      extension: .set
      empty_error: 0
      bad_setup: -161
      learn_prefix: ":SYST:SET "
  # 波形存成文件（:DISK:SAVE:WAVeform，#1071）：通道的记录与 :WAVeform:DATA? 同一份；CSV/TSV/TXT 为“时间,伏特”
  # 行（header ON 时前面加 SimuBench 的键值行），BIN 为 Keysight 示波器二进制文件；INTernal、H5、H5INt、
  # MATlab 未建模，报 -257。
  - name: datafile
    type: data_file
    params:
      storage: disk
      record: acq
  # 状态寄存器（手册第 7 章），每个事件寄存器读后清零：触发（:TERegister?，只在满足触发条件的采集完成时
  # 置位，摘要进 *STB 位 0）、布防（:AER?）、采集完成（:ADER?，每次采集完成）、处理完成（:PDER?，仿真的
  # 测量随查询即时算出，与采集同时完成）、自动触发（:ATER?）。
  - name: ter
    type: status_register
    params: {bits: {TRG: 0}, enable: 1, summary_bit: 0, width: 1}
  - name: aer
    type: status_register
    params: {bits: {ARM: 0}, width: 1}
  - name: ader
    type: status_register
    params: {bits: {DONE: 0}, enable: 1, width: 1}
  - name: pder
    type: status_register
    params: {bits: {DONE: 0}, enable: 1, width: 1}
  - name: ater
    type: status_register
    params: {bits: {AUTO: 0}, enable: 1, width: 1}
  # 操作状态（:OPERegister?，读后清零）：位 0 ACQ DONE、位 1 PROC DONE、位 5 WAIT TRIG、位 11 AUTO TRIG。
  - name: oper
    type: status_register
    params: {bits: {ADER: 0, PDER: 1, WAIT: 5, ATER: 11}, enable: $status.opee, summary_bit: 7, width: 16}
  - name: acq
    type: scope_acquisition
    params:
      digitize_stops: true  # 手册 :DIGitize：采完即停
      horizontal: timebase
      trigger: trigger
      adc: adc
      vertical: front
      probe: probe
      mode: $trigger.sweep
      auto: [AUTO]
      normal: [TRIGgered]
      reacquire: every_read
      missing: acquire
      untriggered: record
      # :DIGitize 在采完后返回；*OPC? 等待它（手册：用 device clear 中止进行中的 :DIGitize）。
      completion: pending
      opc_waits: true
      while_waiting: previous
      no_trigger: wait
      # :ASTate? 的四种状态（手册）：ARM 布防等触发、TRIG 已触发、ATRIG 自动触发、ADONE 采集完成。
      status_text: {stopped: ADONE, waiting: ARM, triggered: TRIG, auto: ATRIG}
      decimator: dec
      trigger_jitter_s: 2.5e-14  # specs.trigger_jitter_s_rms: the data sheet's 25 fs intrinsic jitter (#745)
      # 分段存储（#1066）：MODE SEGMented 时一次采集连续取 COUNt 段（每段一整条记录），全部采满才
      # 完成；INDex 选的段供波形传输与测量。最小触发间隔 3.5 µs（数据手册 Min time between triggers，
      # 高带宽触发禁用列；使能列 5.0 µs，该触发选项未建模）。
      segmented: {from: $acquire.mode, map: {SEGMented: true}, default: false}
      segments: $acquire.segmented_count
      segment_index: $acquire.segmented_index
      rearm_s: 3.5e-6
      memory_points: 500000000
  # 时基：采样率为 128 GSa/s 除以 2 的幂（数据手册 "configurable in powers of two"），取不超过
  # 存储深度 / 10 格的最快一档；设了采样率时取它（记录至多 500 Mpts）。参考位置 LEFT / CENTer / RIGHt
  # 取屏幕 10% / 50% / 90%。
  - name: timebase
    type: scope_timebase
    params:
      scale: $timebase.scale
      delay: $timebase.position
      reference_percent: $timebase.reference_percent
      record_length: rate_pow2
      points: $acquire.points
      sample_rate: $acquire.srate
      max_points: 500000000
  # 边沿触发：电平在信源屏幕中心 ±4 格内（数据手册）；灵敏度 1 格峰峰，迟滞取其一半。
  - name: trigger
    type: scope_trigger
    params:
      # 触发通路（#1263）：从模拟前端分出（ADC 之前，不经 :ACQuire:BANDwidth 与 InfiniiSim 的数字滤波）。
      # 边沿触发带宽等于采集的模拟带宽（数据手册 3123-1313 Trigger System：Equal to acquisition analog
      # bandwidth），前端已限，不另加。触发噪声手册未给，估计：与该档的通道噪声相同（同一前端，D46 通则），
      # 按信源的档位取 front 的 noise_table。
      # 与通道前端同一张表（同一前端，D46），随通道的噪声带宽一起换算（#1427）。
      noise_table: {same_as: channel_components.1.params.noise_table}
      source: $trigger.source
      level: $trigger.level1
      level_by_source:
        CHANnel1: trigger.level1
        CHANnel2: trigger.level2
        CHANnel3: trigger.level3
        CHANnel4: trigger.level4
        AUXiliary: trigger.level5
      slope: $trigger.slope
      rising: [POSitive, EITHer, ALTernate]
      falling: [NEGative, EITHer, ALTernate]
      mode: $trigger.mode
      level_range_divs: 4.0
      hysteresis_divs: 0.5
      holdoff: $trigger.holdoff
      external: [AUXiliary]
      # ---- 高级触发族（#1184）：每族自己的信源与参数；欠幅/过渡/窗口用每源阈值对 ----
      high_by_source:
        CHANnel1: trigger.hth1
        CHANnel2: trigger.hth2
        CHANnel3: trigger.hth3
        CHANnel4: trigger.hth4
        AUXiliary: trigger.hth5
      low_by_source:
        CHANnel1: trigger.lth1
        CHANnel2: trigger.lth2
        CHANnel3: trigger.lth3
        CHANnel4: trigger.lth4
      hysteresis_setting: $trigger.hysteresis
      runt_source: $trigger.runt_source
      runt_polarity: $trigger.runt_polarity
      runt_qualified: $trigger.runt_qualified
      runt_time: $trigger.runt_time
      transition_source: $trigger.transition_source
      transition_type: $trigger.transition_type
      transition_mode: $trigger.transition_mode
      transition_time: $trigger.transition_time
      transition_range_low: $trigger.transition_range_low
      transition_range_high: $trigger.transition_range_high
      window_source: $trigger.window_source
      window_condition: $trigger.window_condition
      window_qualifier: $trigger.window_qualifier
      window_time: $trigger.window_time
      window_tpoint: $trigger.window_tpoint
      timeout_source: $trigger.timeout_source
      timeout_condition: $trigger.timeout_condition
      timeout_time: $trigger.timeout_time
      nedge_source: $trigger.nedge_source
      nedge_slope: $trigger.nedge_slope
      nedge_count: $trigger.nedge_count
  # ADC：10 位；1024 个码对应屏幕 8 格（数据手册：10 位分辨率 = 满量程的 0.1%，满量程 8 格）。
  - name: adc
    type: scope_adc
    params:
      bits: {same_as: specs.vertical_resolution_bits}
      # 每格码数不写：取 2^位数 / 8 格（10 位为 128），改位数时随之变（#1445）。
      divs: 8.0
      offset_sign: subtract
      # 非线性（#1266）：数据手册只给了 1 mm / 1.85 mm 型号的测量值（p.10），3.5 mm 型号未给。估计：取同页 1 GHz
      # 一列折算到满量程的值（HD2/HD3 -62/-49 dBc 于小量程、-54.1/-48.2 dBc 于 87.5 mV/div 起），D46 通则。
      distortion_table: [[1.0e-3, -62.0, -49.0], [8.75e-2, -54.1, -48.2]]
      # 交织：估计，取 1 mm 型号的失配（keysight-uxr1104b 的注释，#1422）：增益失配的像 -65 dBc、时延失配为余弦图样
      # 幅度 4.40 fs、偏置失配的杂散 -65 dBFS；128 GSa/s / 16 GHz = 8 个子 ADC。较慢的记录取全速采样的每第 M 个，
      # 保留各采样的子 ADC，像与杂散折叠进记录的频带（#1422）。
      interleave: 8
      interleave_image_dbc: -65.0
      interleave_spur_dbfs: -65.0
      interleave_skews_s: [4.402e-15, 3.113e-15, 0.0, -3.113e-15, -4.402e-15, -3.113e-15, 0.0, 3.113e-15]
      # 孔径抖动：数据手册 Intrinsic jitter（< 1 µs 采集 15 fs rms，所有接头型号）。
      aperture_jitter_s: 1.5e-14
      # 记录的噪声经过与记录相同的响应（平坦幅度：砖墙，高斯幅度：高斯，在前端带宽处）：DSP 修正后的噪声谱止于
      # 带宽，不平到奈奎斯特（#1446）；总 rms 仍是噪声表的值。只在记录的奈奎斯特高于带宽时起作用。
      shape_noise: true
      # 硬件最小量程 32 mV 满量程（数据手册 3123-1313 Hardware sensitivity）：4 mV/div 以下是该量程的放大，
      # 码宽保持 32 mV / 1024，削波在量程边缘而不在屏幕边缘（#1265）。
      min_full_scale: 0.032
      max_rate: {same_as: specs.sample_rate}
      vertical: front
      probe: probe
  # :ACQuire:BANDwidth（#1262）：ADC 之后的数字带宽滤波，平坦幅度为砖墙、高斯幅度为高斯形，零相位；带宽设到
  # 模拟带宽（上电值、MAX）时直通。噪声在 ADC 处按满带宽加入，经它随 √带宽 下降（D46）。慢于 ADC 的记录
  # 按 ADC 采样率（至多 16 倍记录采样率）滤波再抽取。
  - name: bwf
    type: scope_dsp_filter
    label: 带宽滤波（ACQuire:BANDwidth）
    params:
      bandwidth: $acquire.bandwidth
      response: {from: $acquire.response, map: {FLATmag: brickwall, GAUSsianmag: gaussian}}
      passthrough_hz: {same_as: specs.bandwidth_hz}
      adc: adc
  # 通道带宽限制（:CHANnel<N>:ISIM:BWLimit / :BANDwidth / :BWLimit:TYPE，#609）：InfiniiSim 的数字滤波，
  # WALL 砖墙、BESSEL4 4 阶 Bessel、BUTTerworth 4 阶 Butterworth（手册），关时直通。手册说 Bessel 与
  # Butterworth 能设的最高频率约为砖墙的 2/3 与 80%，在砖墙的上限处由砖墙接管，这一组合未建模（覆盖表注明）。
  - name: isim
    type: scope_dsp_filter
    label: InfiniiSim 滤波
    description: 通道的数字带宽限制（砖墙 / Bessel / Butterworth），在 ADC 之后，关时直通。
    params:
      enabled: $ch{n}.isim_bwlimit
      bandwidth: $ch{n}.isim_bandwidth
      response: {from: "$ch{n}.isim_type", map: {WALL: brickwall, BESSEL4: bessel4, BUTTerworth: butterworth4}}
      adc: adc
  # 抽取与采集方式：:ACQuire:AVERage ON 时取 :ACQuire:COUNt 次量化采集的均值（D46）。
  - name: dec
    type: scope_decimator
    params:
      adc: adc
      horizontal: timebase
      processing: {from: $acquire.average, map: {"True": average}, default: normal}
      averages: $acquire.count
  # 校准输出（:CALibrate:OUTPut 组，#1067/#1170）：前面板 AUX OUT / CAL OUT 的信号源与 50 Ω 输出级；
  # 输出阻抗与除 ZERO（-440 mV）、750 Hz 外的电平为模型值（覆盖表）。
  - name: auxsrc
    type: cal_output
    params: {selection: $calibrate.output_signal, port: aux, rise: $calibrate.output_aux_rtime}
  - name: auxout
    type: output_stage
    params: {z_out: 50.0, load_setting: 50.0, enabled: $calibrate.output_aux}
  - name: calsrc
    type: cal_output
    params: {selection: $calibrate.output_signal, port: cal}
  - name: calout
    type: output_stage
    params: {z_out: 50.0, load_setting: 50.0, enabled: $calibrate.output_cal}
  # AUX 触发输入：50 Ω（数据手册）。
  - name: auxin
    type: input_port
    params:
      z_in: 50.0
  # 自动设置（:AUToscale，手册 pp. 295-298）：与 UXR1104B 相同（scope_autoscale）。
  - name: autoscale
    type: scope_autoscale
    params:
      channels: $autoscale.channels
      placement: $autoscale.placement
      trigger_order: DESCending
      writes: {trigger.mode: EDGE, trigger.sweep: AUTO, trigger.slope: POSitive, trigger.hysteresis: NORMal, trigger.holdoff: 1.0e-7, marker.mode: MEASurement, function1.display: false, function2.display: false, function3.display: false, function4.display: false, function5.display: false, function6.display: false, function7.display: false, function8.display: false, function9.display: false, function10.display: false, function11.display: false, function12.display: false, function13.display: false, function14.display: false, function15.display: false, function16.display: false}
  - name: meas
    type: scope_measurements
    params:
      source: $measure.source
      # 手册：无法测量时回 9.99999E+37。
      invalid_value: "9.99999E+37"
      # 手册（:MEASure:RISetime/FALLtime）：边沿上至少 4 个采样点（低阈值下 1 个、高阈值上 1 个、之间 2 个），否则不可测；
      # :MEASure:OVERshoot/PREShoot 取屏幕上第一个边沿与其局部极值（#1332）。
      edge_min_samples: 4
      shoot: first_edge
      sources: [measure.source, measure.source2]
      # 光标（#1074）：方式与位置是 marker.* 设置，60 个编号光标（手册 :MARKer<K> 1-60）。
      math: math
      marker_mode: $marker.mode
      marker_x1: $marker.x1
      marker_x2: $marker.x2
      marker_y1: $marker.y1
      marker_y2: $marker.y2
      marker_source1: $marker.source1
      marker_source2: $marker.source2
      marker_measurement: $marker.meas
      markers: 60
  # 数学函数（#1074，手册第 22 章）：FUNCtion1-16 的定义在 function<f>.* 设置里，读的时候才算。
  - name: math
    type: scope_math
    params:
      record: acq
      prefix: function
      functions: 16
      channels: 4
      invalid_value: "9.99999E+37"
      peak_sort: $function.peak_sort
      resolution_scale: timebase.scale
  - name: sys
    type: system
  - name: xfer
    type: waveform_transfer
    params:
      source: $waveform.source
      # FUNCtion<F> 信源从 math 块取记录（#1074）。
      math: math
      # :WAVeform:SEGMented:ALL（#1066）：ON 时 DATA? 回全部段拼接的记录（start/size 仍在拼接记录上取）。
      seg_all: $waveform.seg_all
      # :WAVeform:COUPling?（#1066）：本型号输入恒为直流 50 Ω（数据手册），查询恒回 DC（手册 p.1600）。
      coupling: "DC"
      # :WAVeform:DATA?：BYTE 为有符号 8 位、WORD 为有符号 16 位（10 位码左移 6 位），定长块；ASCii 为
      # 逗号分隔的伏特数，不带块头（手册）。
      encoding: {from: $waveform.format, map: {ASCii: text}, default: block}
      values: {from: $waveform.format, map: {ASCii: volts}, default: codes}
      format: "%.4E"
      separator: ","
      # 位数与每格码数取采集链 ADC 的（adc，#1445）。
      codes_per_div: adc
      adc_bits: adc
      width: {from: $waveform.format, map: {BYTE: 8}, default: 16}
      offset: subtract
      unsigned: false
      byteorder: $waveform.byteorder
      indefinite: $waveform.streaming
      # :WAVeform:PREamble?（手册表 19）：format, type, points, count, X increment, X origin,
      # X reference, Y increment, Y origin, Y reference, coupling, X display range, X display origin,
      # Y display range, Y display origin, date, time, frame model #, acquisition mode, completion,
      # X units, Y units, max bandwidth limit, min bandwidth limit。日期与时间为固定值（仿真台没有日历）。
      header:
        encoding: text
        separator: ","
        fields:
          - {setting: waveform.format, map: {ASCii: 0, BYTE: 1, WORD: 2}}
          - {setting: acquire.average, map: {"True": 2, "False": 1}}
          - {figure: points}
          - {setting: acquire.count, when: {acquire.average: "True"}, else: 1}
          - {figure: x_increment, format: "%.6E"}
          - {figure: x_start, format: "%.6E"}
          - {value: 0}
          - {figure: y_increment, format: "%.6E"}
          - {figure: y_origin, format: "%.6E"}
          - {value: 0}
          - {value: 2}
          - {figure: timebase, scale: 10.0, format: "%.6E"}
          - {figure: x_start, format: "%.6E"}
          - {figure: scale, scale: 8.0, format: "%.6E"}
          - {figure: offset, format: "%.6E"}
          - {value: '"01 JAN 2024"'}
          - {value: '"00:00:00:00"'}
          - {setting: [system.model, system.serial], format: '"%s:%s"'}  # 型号:序列号，随定义（#1441）
          - {value: 0}
          - {value: 100}
          - {value: 2}
          - {value: 1}
          - {setting: acquire.bandwidth, format: "%.6E"}
          - {value: "0.000000E+00"}
          # 末尾的 <segment count>（手册表 19）：仅当 SEGMented:ALL ON 且信源通道确有分段采集时出现
          # （transfer 对不适用状态回 None，此处跳过）。
          - {figure: segments}
channel_components:
  # 50 Ω 直流耦合输入（数据手册）。
  - name: inp
    type: input_port
    params:
      z_in: 50.0
  # 模拟前端：带宽 33 GHz，幅频按 :ACQuire:RESPonse 校正为平坦（砖墙）或高斯形，零相位（#607）；
  # :ACQuire:BANDwidth 的限带宽是 ADC 之后的数字滤波（组件 bwf，#1262）。偏置范围按档位
  # （数据手册）；超出范围报 -222。
  - name: front
    type: scope_vertical
    label: 垂直前端（档位/偏置/带宽）
    params:
      coupling: DC
      invert: $ch.invert
      bandwidth: {same_as: specs.bandwidth_hz}
      response: {from: $acquire.response, map: {FLATmag: brickwall, GAUSsianmag: gaussian}}
      # 模拟前端自身的滚降（#1423）：平坦幅度 / 高斯幅度是 ADC 之后 DSP 修正的结果，触发从 ADC 之前的模拟通路
      # 分出，看到的是这一形状、不带修正。形状手册未给：同 UXR1104B 取 4 阶 Bessel、-3 dB 在同一带宽（SimuBench
      # 估计，覆盖表注明）。记录照旧是修正后的形状。
      analog_response: bessel4
      scale: $ch.scale
      offset: $ch.offset
      probe_ratio: 1.0
      scale_range: [1.0e-3, 1.0]
      offset_ranges: [[0.0545, 0.4], [0.0935, 0.7], [0.1725, 1.25], [0.3065, 2.25], [1.0, 4.0]]
      out_of_range: error
      # 最大输入（数据手册 3123-1313 Vertical System 的 Maximum Input Range 表，#1264）：输入在偏置两侧各 8 格
      # （满量程的两倍，Maximum input power +6 dB）以内；超出时该通道过载（:OVLRegister? 置位）。表头写明
      # 对地不超过 ±6.5 V：超过时给出“可能损坏”的警告（事件与问题栏）。仿真不断开输入（手册没有输入保护动作）。
      max_input_divs: 8.0
      max_input_v: 6.5
      # 每档噪声（specs.noise_per_division，#786）：Infiniium UXR-B 数据手册 3123-1313 的
      # "RMS Noise Floor – Performance Characteristics (Measured)" 表，UXR0334B 列（p.8），按
      # 满量程 32 mV–8 V（4 mV/div–1 V/div）逐档：266 µV、388 µV、702 µV、1.48 mV、2.91 mV、
      # 6.48 mV、14.7 mV、28.8 mV。1/2 mV/div（zoom）取最灵敏档 4 mV/div 的 266 µV，
      # 5 mV/div 为 4 与 10 mV/div 的对数-对数插值（291 µV）。A 系列手册同列同值。
      # 噪声表是在数据手册带宽（3.3e10 Hz）下测得的：子定义改了 bandwidth，表按 √(bandwidth/3.3e10) 换算（#1427）。
      # 写字面值而不是 same_as：引用了 specs.bandwidth_hz 的话，子定义改带宽时两者一起变、换算不起作用。
      noise_bandwidth: 3.3e10
      noise_table: [[1.0e-3, 2.66e-4], [2.0e-3, 2.66e-4], [5.0e-3, 2.91e-4], [1.0e-2, 3.88e-4], [2.0e-2, 7.02e-4], [5.0e-2, 1.48e-3], [1.0e-1, 2.91e-3], [2.0e-1, 6.48e-3], [5.0e-1, 1.47e-2], [1.0, 2.88e-2]]
  - name: probe
    type: scope_probe
    label: 探头换算（倍率/偏斜/反相）
    description: 物理探头在面板端口之外，本块只做探头设置值对应的换算：倍率、偏斜、反相和外部缩放增益。
    params:
      ratio: $ch.probe
      skew: $ch.probe_skew
wiring:
  channel:
    - [inp.out, front.in]
    - [front.out, probe.in]
  instrument:
    # 采样链（#1262）：ADC 之后依次是 :ACQuire:BANDwidth 的数字滤波、InfiniiSim 的通道滤波与抽取。
    - ["ch{n}.probe.out", "adc.in{n}"]
    - ["adc.out{n}", "bwf.in{n}"]
    - ["bwf.out{n}", "isim.in{n}"]
    - ["isim.out{n}", "dec.in{n}"]
    - ["dec.out{n}", "acq.in{n}"]
    - [auxin.out, trigger.ext]
    - [auxsrc.out, auxout.in]
    - [calsrc.out, calout.in]
ports:
  channel:
    "CH{n}": inp.pin
  instrument:
    AUX: auxin.pin
    AUX_OUT: auxout.pin
    CAL_OUT: calout.pin
    REF_IN:
display:
  template: oscilloscope
  summary: [timebase.scale, trigger.source, trigger.slope]
  channel_summary: [display, scale, offset, input]
  # 检查器面板（D74）：前面板先给的设置。触发按触发类型只放该类型的条件，触发电平随触发源；
  # 其余设置在检查器里查找或在“全部设置”里改。示波器屏幕自己画，不用这里的分组。
  panel:
    groups:
      - label: 水平
        label_en: Horizontal
        controls:
          - {state: timebase.scale}
          - {state: timebase.position}
          - {state: timebase.reference}
      - label: 触发
        label_en: Trigger
        controls:
          - {state: trigger.mode}
          - {state: trigger.sweep}
          - {state: trigger.source, when: {trigger.mode: EDGE}}
          - {state: trigger.slope, when: {trigger.mode: EDGE}}
          - {state: trigger.level1, when: {trigger.mode: EDGE, trigger.source: CHANnel1}}
          - {state: trigger.level2, when: {trigger.mode: EDGE, trigger.source: CHANnel2}}
          - {state: trigger.level3, when: {trigger.mode: EDGE, trigger.source: CHANnel3}}
          - {state: trigger.level4, when: {trigger.mode: EDGE, trigger.source: CHANnel4}}
          - {state: trigger.level5, when: {trigger.mode: EDGE, trigger.source: AUXiliary}}
          - {state: trigger.runt_source, when: {trigger.mode: RUNT}}
          - {state: trigger.runt_polarity, when: {trigger.mode: RUNT}}
          - {state: trigger.runt_qualified, when: {trigger.mode: RUNT}}
          - {state: trigger.runt_time, when: {trigger.mode: RUNT}}
          - {state: trigger.transition_source, when: {trigger.mode: TRANsition}}
          - {state: trigger.transition_type, when: {trigger.mode: TRANsition}}
          - {state: trigger.transition_mode, when: {trigger.mode: TRANsition}}
          - {state: trigger.transition_time, when: {trigger.mode: TRANsition}}
          - {state: trigger.timeout_source, when: {trigger.mode: TIMeout}}
          - {state: trigger.timeout_condition, when: {trigger.mode: TIMeout}}
          - {state: trigger.timeout_time, when: {trigger.mode: TIMeout}}
          - {state: trigger.window_source, when: {trigger.mode: WINDow}}
          - {state: trigger.window_condition, when: {trigger.mode: WINDow}}
          - {state: trigger.window_qualifier, when: {trigger.mode: WINDow}}
          - {state: trigger.window_time, when: {trigger.mode: WINDow}}
          - {state: trigger.nedge_source, when: {trigger.mode: NEDGe}}
          - {state: trigger.nedge_slope, when: {trigger.mode: NEDGe}}
          - {state: trigger.nedge_count, when: {trigger.mode: NEDGe}}
          - {state: trigger.holdoff}
      - label: 采集
        label_en: Acquisition
        controls:
          - {state: acquire.mode}
          - {state: acquire.srate}
          - {state: acquire.points}
          - {state: acquire.average}
          - {state: acquire.count, when: {acquire.average: true}}
          - {state: acquire.bandwidth}
    channel_groups:
      - label: 垂直
        label_en: Vertical
        controls:
          - {state: display}
          - {state: scale}
          - {state: offset}
          - {state: input}
          - {state: isim_bwlimit}
          - {state: isim_bandwidth, when: {isim_bwlimit: true}}
          - {state: probe_coupling}
options:
constraints:

command_overrides:
  # 与 1104B 同头的差异按头整组覆盖（值 = 本型号的命令，不含 header）；仅 1104B 有的头删除。
  ":CDISplay": {op: acq.clear_display, query: false}
  "*PSC": {state: status.psc}
  ":BEEP": {op: sys.accept, query: false, params: [{name: frequency, type: float, unit: HZ, state: system.beep_frequency}, {name: duration, type: float, unit: MS, state: system.beep_duration}]}
  ":ACQuire:POINts[:ANALog]": {state: acquire.points}
  ":ACQuire:SRATe[:ANALog]": {op: acq.figure, args: {what: sample_rate}, params: [{name: rate, type: float, unit: HZ, optional: true, state: acquire.srate}]}
  ":ACQuire:BANDwidth:FRAMe": {op: sys.accept, set: false, reply: '3.300000E+10'}
  ":ACQuire:HRESolution": {state: acquire.hres, format: {enum: as_defined}}
  ":ACQuire:REDGe": {state: acquire.redge, reply: '0'}
  ":ACQuire:POINts:AUTO": {op: acq.points_auto, params: [{name: 'on', type: bool, optional: true}]}
  ":ACQuire:SRATe[:ANALog]:AUTO": {op: acq.srate_auto, params: [{name: 'on', type: bool, optional: true}]}
  ":ACQuire:BANDwidth:TESTLIMITS": {op: sys.limits, set: false, args: {path: acquire.bandwidth}}
  ":ACQuire:POINts:TESTLIMITS": {op: sys.limits, set: false, args: {path: acquire.points}}
  ":ACQuire:SRATe:TESTLIMITS": {op: sys.limits, set: false, args: {path: acquire.srate}}
  ":ACQuire:ADC:CLIPped:CLEar": {op: acq.clear_clip, query: false}
  ":ACQuire:SEGMented:INDex": {op: acq.set_segment_index, params: [{name: index, type: int, min: 1, optional: true}]}
  ":ACQuire:SEGMented:PLAY": {state: acquire.segmented_play}
  ":CHANnel<ch>:PROBe:ATTenuation": {op: ch.probe.set_attenuation, params: [{name: word, type: string, optional: true}], args: {words: {DIV1: 1.0, DIV10: 10.0}}}
  ":CHANnel<ch>:PROBe:EXTernal:GAIN": {state: ch.probe_ext_gain}
  ":CHANnel<ch>:PROBe:EXTernal:OFFSet": {state: ch.probe_ext_offset}
  ":CHANnel<ch>:PROBe:EXTernal:UNITs": {state: ch.probe_ext_units, format: {enum: as_defined}}
  ":CHANnel<ch>:PROBe:SKEW": {state: ch.probe_skew}
  ":CHANnel<ch>:ADC:CLIPped": {op: acq.adc_clip_status, set: false}
  ":CHANnel<ch>:CLIPped": {op: acq.clipped_status, set: false}
  ":DISPlay:GRATicule:AREA<n>:HSCale": {suffixes: {n: [1, 2, 3, 4, 5, 6, 7, 8]}, state: display.area_hscale}
  ":DISPlay:GRATicule:AREA<n>:STATe": {suffixes: {n: [1, 2, 3, 4, 5, 6, 7, 8]}, state: display.area_state}
  ":DISPlay:GRATicule:AREA<n>:VSCale": {suffixes: {n: [1, 2, 3, 4, 5, 6, 7, 8]}, state: display.area_vscale}
  ":DISPlay:GRATicule:GLAYout": {state: display.graticule_glayout}
  ":DISPlay:GRATicule:NUMBer": {state: display.graticule_number}
