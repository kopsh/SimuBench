schema: simubench.instrument/2
id: keysight-uxr0334b
manufacturer: Keysight Technologies
model: UXR0334B
# 命令表继承 keysight-uxr1104b（同一程序员指南的命令体系）：差异在文末 command_overrides（#1471）。
extends: keysight-uxr1104b
class: oscilloscope
version: 1
description: >-
  Keysight Infiniium UXR0334B, 4 channels, 33 GHz, 128 GSa/s, 10-bit ADC, 50 ohm inputs. Real model
  (D42): commands, replies and default-setup values follow the Infiniium UXR-Series Oscilloscopes
  Programmer's Guide 11.80.00012 (9018-07723); ranges follow the UXR-B data sheet 3123-1313. The
  Infiniium command set next to the InfiniiVision DSO-X 2024A (#338). Values neither document gives are
  SimuBench defaults, listed in the coverage table. The command table extends the UXR1104B's
  (same programmer's guide): the differences are the command_overrides at the end of this file.
identity:
  # *IDN? per the guide: Keysight Technologies,<Model #>,<USXXXXXXXX>,<Rev #>[,<Options>].
  idn: "Keysight Technologies,UXR0334B,{serial},{firmware}"
  serial: MY64280101
  firmware: "11.80.00012"
  # builtins、error_queue、options_reply 继承父定义；本型号没有硬件选件（options 为 null）。
  options_reply: null
specs:
  source: Infiniium UXR-B Series Oscilloscopes Data Sheet 3123-1313 (2024-04-25), 3.5 mm input models
  bandwidth_hz: 3.3e10
  warranted_bandwidth_hz: 3.2e10
  sample_rate: 1.28e11
  memory_depth_pts: 5.0e8
  vertical_resolution_bits: 10
  input_sensitivity_v_div: [1.0e-3, 1.0]
  input: {r_ohm: 50.0, r_tolerance: 0.03, coupling: DC, connector: null}
  offset_range_v: {"1 mV to 54 mV/div": 0.4, "55 mV to 93 mV/div": 0.7, "94 mV to 172 mV/div": 1.25, "173 mV to 306 mV/div": 2.25, "307 mV to 1 V/div": 4.0, 1 mV to 59 mV/div: null, 60 mV to 127 mV/div: null, 128 mV to 279 mV/div: null, 280 mV to 500 mV/div: null}
  dc_gain_accuracy: "±1.5% of full scale"
  offset_accuracy: "±(1% of channel offset + 1% of full scale + 400 µV)"
  timebase_s_div: [2.0e-12, 20.0]
  timebase_delay_s: [-200.0, 200.0]
  time_scale_accuracy: "±(25 ppb initial + 100 ppb/year aging) first year"
  trigger_sensitivity: "1 div p-p"
  trigger_level_range: "±4 div from center screen or ±4 V, whichever is smaller; AUX ±5 V"
  trigger_holdoff_s: [4.0e-8, 10.0]
  trigger_jitter_s_rms: 2.5e-14
  noise_floor: >-
    published per division: the Infiniium UXR-B Series data sheet 3123-1313's "RMS Noise Floor –
    Performance Characteristics (Measured)" table, UXR0334B column (page 8): 266 µV rms at
    4 mV/div (32 mV full scale) rising to 28.8 mV rms at 1 V/div (8 V full scale). The A-series
    sheet's UXR0334A column is identical, so the B revision kept the measured table (#786).
  # p.5 Maximum Input Range (Not Exceed GND ± 6.5 V): offset ± 8 divisions; Maximum input power +6 dB
  # (twice the amplitude) at all ranges; ±5 V at the front panel recommended for standard use (#1264).
  max_input: {range: "offset ± 8 div", absolute_v: 6.5, recommended_v: 5.0}
  noise_per_division: >-
    the data sheet's measured RMS Noise Floor table per full scale (4 mV/div to 1 V/div, #786).
    The table's most sensitive setting is 4 mV/div (32 mV full scale): the 1 and 2 mV/div rows
    hold that 266 µV (the preamp floor), and 5 mV/div interpolates 4 and 10 mV/div on log-log
    (291 µV). About 3.7 codes rms at 10 bits (128 codes per division) at 0.1 V/div. Per-division
    values in the scope_vertical noise_table.
  rise_time_10_90_s:
  enob_typical:
  memory_depth_options_pts:
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  # 操作状态使能（:OPEEnable）：位 0 ACQ DONE、位 1 PROC DONE、位 5 WAIT TRIG、位 11 AUTO TRIG；摘要进 *STB 位 7。
  status.opee:
    type: int
    min: 0
    max: 65535
    default: 0
    label: 操作状态使能
    label_en: Operation status enable
  # 应答头（:SYSTem:HEADer）与长格式（:SYSTem:LONGform）两个开关（报文写法 syntax，#602）；上电值是用户偏好，
  # 手册未给，SimuBench 取 OFF。
  system.header:
    type: bool
    default: false
    label: 应答头
    label_en: Response headers
  system.longform:
    type: bool
    default: false
    label: 长格式应答
    label_en: Long-form responses
  timebase.scale:
    type: float
    unit: S
    min: 5.0e-12
    max: 20.0
    default: 1.0e-7
    label: 时基
    label_en: Timebase
  timebase.position:
    type: float
    unit: S
    min: -200.0
    max: 200.0
    default: 0.0
    label: 水平位置
    label_en: Position
  timebase.reference:
    type: enum
    options: [LEFT, CENTer, RIGHt]
    default: CENTer
    label: 时间参考
    label_en: Reference
  # 参考位置的百分比（:TIMebase:REFerence:PERCent，#1067）：0-100%。LEFT/CENTer/RIGHt 即 10/50/90；
  # 参考被设为百分比位置时 :TIMebase:REFerence? 回 PERC（手册）。
  timebase.reference_percent:
    type: int
    min: 0
    max: 100
    default: 50
    rst: 50
    label: 时间参考百分比
    label_en: Reference percent
  # 缩放拉窗（:TIMebase:VIEW 与 :WINDow:*，#1067）：延迟视图的档位与位置；记录不变（主时基的样点
  # 全在），视图是显示状态。手册未给上电默认：档位取主时基默认、位置 0 为 SimuBench 值。
  timebase.view:
    type: enum
    options: [MAIN, WINDow]
    default: MAIN
    label: 时基视图
    label_en: Time base view
  timebase.window_scale:
    type: float
    unit: S
    min: 1.0e-12
    max: 20.0
    default: 1.0e-7
    label: 缩放时基档位
    label_en: Zoom time/div
  timebase.window_position:
    type: float
    unit: S
    min: -200.0
    max: 200.0
    default: 0.0
    label: 缩放时基位置
    label_en: Zoom position
  # 外参考（:TIMebase:REFClock，#1067）：ON 时采样时钟跟随 REF_IN 上的 10 MHz（组件的 rosc 机制：
  # 频率在 ±10 ppm 内才接管，REF_IN 无输入时保持内参考——本台未接参考源）。
  timebase.refclock:
    type: bool
    default: false
    label: 外参考时钟
    label_en: Reference clock
  # 滚动模式（:TIMebase:ROLL:ENABLE，手册 p.1474）：UXR 上唯一有效的设定是 OFF，查询回 0。
  timebase.roll_enable:
    type: enum
    options: ["OFF", "0"]
    default: "OFF"
    label: 滚动模式
    label_en: Roll mode
  trigger.mode:
    type: enum
    options: [EDGE, RUNT, TRANsition, TIMeout, WINDow, NEDGe]
    default: EDGE
    not_modeled:
      GLITch: glitch trigger is not modeled
      PWIDth: pulse width trigger is not modeled
      PATTern: pattern trigger is not modeled
      STATe: state trigger is not modeled
      SHOLd: setup and hold trigger is not modeled
      DELay: delay trigger is not modeled
      OR: ORed edges trigger is not modeled
      EBURst: burst trigger is not modeled
      SEQuence: sequence trigger is not modeled
      IFMagn: IF magnitude trigger is not modeled
    label: 触发类型
    label_en: Trigger type
  trigger.sweep:
    type: enum
    options: [AUTO, TRIGgered]
    default: AUTO
    not_modeled: {SINGle: "the single sweep (the guide: do not use in new programs; use :SINGle)"}
    label: 触发方式
    label_en: Trigger sweep
  trigger.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, AUXiliary]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4, AUXiliary: AUX}
    default: CHANnel1
    label: 触发源
    label_en: Trigger source
  # 每个信源一个触发电平（手册 :TRIGger:LEVel {CHANnel<N> | AUX},<level>）；默认设置为 0 V。
  trigger.level1: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH1, label_en: Trigger level CH1}
  trigger.level2: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH2, label_en: Trigger level CH2}
  trigger.level3: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH3, label_en: Trigger level CH3}
  trigger.level4: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH4, label_en: Trigger level CH4}
  # AUX 输入 ±5 V（数据手册）。
  trigger.level5: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.0, label: 触发电平 AUX, label_en: Trigger level AUX}
  trigger.slope:
    type: enum
    options: [POSitive, NEGative, EITHer, ALTernate]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  # ---- 高级触发族（手册 pp.1533–1590，#1184）：欠幅、过渡、窗口、超时与第 N 边沿。各族
  # 记自己的信源（与 EDGE 的主信源并存，默认 CH1）；[{1 | 2}] 后缀的第二项（序列触发的
  # TERM2）未建模，后缀 2 报 -114。
  trigger.runt_source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 欠幅触发源
    label_en: Runt trigger source
  trigger.runt_polarity:
    type: enum
    options: [POSitive, NEGative]
    default: POSitive
    label: 欠幅极性
    label_en: Runt polarity
  trigger.runt_qualified:
    type: bool
    default: false
    label: 欠幅时间限定
    label_en: Runt time qualified
  # 时间限定 250 ps 到 30 ns（手册 p.1553）。
  trigger.runt_time:
    type: float
    unit: s
    min: 250.0e-12
    max: 30.0e-9
    default: 250.0e-12
    label: 欠幅宽度下限
    label_en: Runt width qualifier
  trigger.transition_source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 过渡触发源
    label_en: Transition trigger source
  trigger.transition_type:
    type: enum
    options: [RISetime, FALLtime]
    default: RISetime
    label: 过渡类型
    label_en: Transition type
  trigger.transition_mode:
    type: enum
    options: [GTHan, LTHan, RANGe, ORANge]
    default: GTHan
    label: 过渡限定
    label_en: Transition qualifier
  trigger.transition_time:
    type: float
    unit: s
    min: 0.0
    default: 1.0e-9
    label: 过渡时间限定
    label_en: Transition time bound
  trigger.transition_range_low:
    type: float
    unit: s
    min: 0.0
    default: 10.0e-9
    label: 过渡时间范围下限
    label_en: Transition range minimum
  trigger.transition_range_high:
    type: float
    unit: s
    min: 0.0
    default: 20.0e-9
    label: 过渡时间范围上限
    label_en: Transition range maximum
  trigger.window_source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 窗口触发源
    label_en: Window trigger source
  trigger.window_condition:
    type: enum
    options: [ENTer, EXIT, INSide, OUTSide]
    default: ENTer
    label: 窗口条件
    label_en: Window condition
  # 时长限定属于 INSIDE/OUTSIDE（手册 p.1587）。
  trigger.window_qualifier:
    type: enum
    options: [GTHan, LTHan]
    default: GTHan
    label: 窗口时长限定
    label_en: Window duration qualifier
  trigger.window_time:
    type: float
    unit: s
    min: 0.0
    default: 1.0e-6
    label: 窗口时长
    label_en: Window time
  trigger.window_tpoint:
    type: enum
    options: [BOUNdary, TIMeout]
    default: BOUNdary
    label: 窗口触发点
    label_en: Window trigger point
  trigger.timeout_source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 超时触发源
    label_en: Timeout trigger source
  trigger.timeout_condition:
    type: enum
    options: [HIGH, LOW, UNCHanged]
    default: UNCHanged
    label: 超时条件
    label_en: Timeout condition
  trigger.timeout_time:
    type: float
    unit: s
    min: 0.0
    default: 1.0e-3
    label: 超时时间
    label_en: Timeout time
  trigger.nedge_source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 第N边沿触发源
    label_en: Nth edge trigger source
  trigger.nedge_slope:
    type: enum
    options: [POSitive, NEGative]
    default: POSitive
    label: 第N边沿斜率
    label_en: Nth edge slope
  trigger.nedge_count:
    type: int
    min: 1
    max: 65000000000
    default: 1
    label: 边沿计数
    label_en: Edge count
  # 每个信源一对高/低阈值（手册 :TRIGger:HTHReshold p.1495、:TRIGger:LTHReshold p.1499），
  # 欠幅、过渡与窗口三族共用；高阈值允许 AUX，低阈值仅通道。默认 ±0.5 V。
  trigger.hth1: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.5, label: 高阈值 CH1, label_en: High threshold CH1}
  trigger.hth2: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.5, label: 高阈值 CH2, label_en: High threshold CH2}
  trigger.hth3: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.5, label: 高阈值 CH3, label_en: High threshold CH3}
  trigger.hth4: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.5, label: 高阈值 CH4, label_en: High threshold CH4}
  trigger.hth5: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.5, label: 高阈值 AUX, label_en: High threshold AUX}
  trigger.lth1: {type: float, unit: V, min: -5.0, max: 5.0, default: -0.5, label: 低阈值 CH1, label_en: Low threshold CH1}
  trigger.lth2: {type: float, unit: V, min: -5.0, max: 5.0, default: -0.5, label: 低阈值 CH2, label_en: Low threshold CH2}
  trigger.lth3: {type: float, unit: V, min: -5.0, max: 5.0, default: -0.5, label: 低阈值 CH3, label_en: Low threshold CH3}
  trigger.lth4: {type: float, unit: V, min: -5.0, max: 5.0, default: -0.5, label: 低阈值 CH4, label_en: Low threshold CH4}
  # 触发迟滞选择（手册 p.1496）：NREJect 噪声抑制最宽、HSENsitivity 最窄（≥4 GHz 用）。
  trigger.hysteresis:
    type: enum
    options: [NORMal, NREJect, HSENsitivity]
    default: NORMal
    label: 触发迟滞
    label_en: Trigger hysteresis
  # 手册：释抑 100 ns 到 10 s（数据手册写 40 ns 起，按编程手册）。
  trigger.holdoff:
    type: float
    unit: S
    min: 1.0e-7
    max: 10.0
    default: 1.0e-7
    label: 释抑时间
    label_en: Holdoff
  acquire.mode:
    type: enum
    options: [RTIMe, SEGMented]
    default: RTIMe
    not_modeled:
      PDETect: real-time peak detect is not modeled
      HRESolution: real-time high resolution is not modeled
      SEGPdetect: segmented memory is not modeled
      SEGHres: segmented memory is not modeled
    label: 采集模式
    label_en: Acquire mode
  acquire.average:
    type: bool
    default: false
    label: 平均
    label_en: Averaging
  acquire.count:
    type: int
    min: 2
    max: 1048575
    default: 16
    label: 平均次数
    label_en: Averages
  acquire.complete:
    type: int
    min: 0
    max: 100
    default: 90
    label: 采集完成判据
    label_en: Acquire complete
  # 存储深度：AUTO 由示波器选择（SimuBench 取 128 kpts，默认时基下正好 128 GSa/s）；手动值到 500 Mpts
  # （真机标配 500 Mpts）。超过 2^22 点的记录读的时候才算（#1012，real-models.md“深存储是怎样仿真的”）。
  acquire.points:
    type: int
    min: 16
    max: 500000000
    default: 128000
    special: {AUTO: 128000}
    label: 存储深度
    label_en: Memory depth
  # 采样率（:ACQuire:SRATe[:ANALog]）：AUTO（0）随存储深度；设定值取下一个更快的档（128 GSa/s 除以
  # 2 的幂，手册），优先于存储深度。
  acquire.srate:
    type: float
    unit: HZ
    min: 0.0
    max: {same_as: specs.sample_rate}
    default: 0.0
    special: {AUTO: 0.0, MAX: {same_as: specs.sample_rate}}
    label: 采样率设定
    label_en: Sample rate setting
  # 带宽滤波（:ACQuire:BANDwidth）：MAX 为硬件带宽 33 GHz；AUTO 未建模。
  acquire.bandwidth:
    type: float
    unit: HZ
    min: 1.0e8
    max: {same_as: specs.bandwidth_hz}
    default: {same_as: specs.bandwidth_hz}
    special: {MAX: {same_as: specs.bandwidth_hz}}
    not_modeled: {AUTO: the automatic bandwidth selection is not modeled}
    label: 带宽
    label_en: Bandwidth
  # 带宽滤波的幅度响应（:ACQuire:RESPonse）：FLATmag（默认，平坦幅度、线性相位，阶跃有振铃）或
  # GAUSsianmag（高斯幅度，无振铃），-3 dB 点都在 :ACQuire:BANDwidth（#607）。
  acquire.response:
    type: enum
    options: [FLATmag, GAUSsianmag]
    default: FLATmag
    label: 带宽滤波响应
    label_en: Filter response
  # 快速绘图（:ACQuire:FPLot，#1068）：分析随采集异步进行的调度开关。模型的分析始终在读的当下对
  # 当前记录做，开关不改变任何回复的数值（覆盖表注明）。手册未给上电默认，ON 为 SimuBench 值。
  acquire.fplot: {type: bool, default: true, label: 快速绘图, label_en: Fast plot}
  # 函数平均等待（:ACQuire:COMPlete:STATe，#1067）：测量前等函数平均完成。模型的测量总在读的当下
  # 对已完成平均的记录算，开关不改变数值。手册未给上电默认，ON 为 SimuBench 值。
  acquire.complete_state: {type: bool, default: true, label: 等待函数平均, label_en: Wait for average}
  # 高分辨率位数（:ACQuire:HRESolution，#1067）：HRESolution/SEGHres 模式下的最小位分辨率；该两种
  # 采集模式未建模，设定存值不影响数据。
  acquire.hres:
    type: enum
    options: [AUTO, BITS11, BITS12]
    default: AUTO
    label: 高分辨率位数
    label_en: HRES bits
  # 实时边沿扩展（:ACQuire:REDGe，手册 p.341）：UXR 上唯一有效的设定是 OFF，查询回 0。
  acquire.redge:
    type: enum
    options: ["OFF", "0"]
    default: "OFF"
    label: 实时边沿扩展
    label_en: Realtime edge
  # 分段存储（:ACQuire:MODE SEGMented，#1066）：一次采集连续取 COUNt 段（每段一整条记录），各等一次
  # 触发。段数上限 25,680 取数据手册 Max # of segments 的高带宽触发使能列（UXR0334B 列；禁用列
  # 134,885，该触发选项未建模）；段数 × 记录深超出内存由采集报 -221。手册未给 *RST 后的段数：2 为
  # SimuBench 值。
    replies:
    not_modeled:
  acquire.segmented_count:
    type: int
    min: 2
    max: 25680
    default: 2
    label: 分段数
    label_en: Segments
  # 所选段（:ACQuire:SEGMented:INDex）：波形传输与测量读它；手册 p.345：越界报错并钳到最大段号。
  acquire.segmented_index:
    type: int
    min: 1
    max: 25680
    default: 1
    label: 所选段
    label_en: Segment index
  # 时间标签（:ACQuire:SEGMented:TTAGs）：手册未给上电默认，OFF 为 SimuBench 值。
  acquire.segmented_ttags:
    type: bool
    default: false
    label: 分段时间标签
    label_en: Segment time tags
  # 段回放（:ACQuire:SEGMented:AUToplay / :PLAY）：采集后自动逐段回放 / 播放或停止。模型的回放是
  # 瞬时的：查询回保存的状态，不是进行中的回放（覆盖表注明）。
  acquire.segmented_autoplay:
    type: bool
    default: false
    label: 分段自动回放
    label_en: Segment autoplay
  acquire.segmented_play:
    type: bool
    default: false
    label: 分段回放
    label_en: Segment play
  # 回放速率（:ACQuire:SEGMented:PRATe，每段 0.001–1 s）。手册未给上电默认，0.1 为 SimuBench 值。
  acquire.segmented_prate:
    type: float
