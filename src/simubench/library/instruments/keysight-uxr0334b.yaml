  # ---- :MEASure:FFT（手册第 32 章）：结果即查即算。THDistortion 的 PEAK 方式以第一个过门限的
  # 峰为基波。
  - header: ":MEASure:FFT:FREQuency"
    op: math.fft_measure
    set: false
    args: {kind: FREQuency}
    params:
      - {name: source, type: string}
      - {name: peak, type: int, optional: true}
      - {name: level, type: float, optional: true}
  - header: ":MEASure:FFT:MAGNitude"
    op: math.fft_measure
    set: false
    args: {kind: MAGNitude}
    params:
      - {name: source, type: string}
      - {name: peak, type: int, optional: true}
      - {name: level, type: float, optional: true}
  - header: ":MEASure:FFT:DFRequency"
    op: math.fft_measure
    set: false
    args: {kind: DFRequency}
    params:
      - {name: source, type: string}
      - {name: peak1, type: int, optional: true}
      - {name: peak2, type: int, optional: true}
      - {name: level, type: float, optional: true}
  - header: ":MEASure:FFT:DMAGnitude"
    op: math.fft_measure
    set: false
    args: {kind: DMAGnitude}
    params:
      - {name: source, type: string}
      - {name: peak1, type: int, optional: true}
      - {name: peak2, type: int, optional: true}
      - {name: level, type: float, optional: true}
  - header: ":MEASure:FFT:CPOWer"
    op: math.fft_measure
    set: false
    args: {kind: CPOWer}
    params:
      - {name: source, type: string}
      - {name: center, type: float, optional: true}
      - {name: bandwidth, type: float, optional: true}
  - header: ":MEASure:FFT:PSD"
    op: math.fft_measure
    set: false
    args: {kind: PSD}
    params:
      - {name: source, type: string}
      - {name: center, type: float, optional: true}
      - {name: bandwidth, type: float, optional: true}
  - header: ":MEASure:FFT:OBW"
    op: math.fft_measure
    set: false
    args: {kind: OBW}
    params:
      - {name: source, type: string}
      - {name: percent, type: float, optional: true}
  - header: ":MEASure:FFT:THDistortion"
    op: math.fft_measure
    set: false
    args: {kind: THDistortion}
    params:
      - {name: source, type: string}
      - {name: mode, type: enum, options: [MANual, PEAK], optional: true}
      - {name: fundamental, type: float, optional: true}
      - {name: level, type: float, optional: true}
  # ---- :MARKer（手册第 31 章）：MODE 选择方式，X/Y1、X/Y2 与 TST/VST 是同一对光标的两套写法；
  # :MARKer:CURSor? 在非跟踪方式下会把方式改成 WAVeform（手册 CAUTION），由 op 完成。
