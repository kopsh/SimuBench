- section: Interface Commands
  commands:
  - header: '*RST'
    level: implemented
    note: 恢复 Standard Settings（p.64）。
  - header: '*IDN'
    level: implemented
    note: Stanford_Research_Systems,SR865A,<序列号>,<固件>，格式按手册示例 000111、v1.23。
  - header: '*TST'
    level: implemented
    note: 恒回 0。
  - header: '*OPC'
    level: implemented
    note: '*OPC 置标准事件位 0；*OPC? 回 1。'
  - header: LOCL
    level: accepted
    note: 本地/远程/本地锁定保存并回读；仿真没有前面板锁定。
    affects_data: false
  - header: OVRM
    level: accepted
    note: 覆盖远程保存并回读；仿真没有前面板锁定。
    affects_data: false
- section: Status Reporting Commands
  commands:
  - header: '*CLS'
    level: implemented
    note: 清全部状态寄存器，不清使能寄存器。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能：整字节或 j, i 按位写，*ESE? j 读一位。
  - header: '*ESR'
    level: implemented
    note: 标准事件字节：读整字节清零，读一位只清该位。
  - header: '*SRE'
    level: implemented
    note: 串行轮询使能：整字节或按位。
  - header: '*STB'
    level: implemented
    note: 串行轮询字节（ERR/LIA/MAV/ESB/SRQ）：读取不改变它。
  - header: '*PSC'
    level: implemented
    note: 上电状态清除位保存并回读。
  - header: ERRE
    level: implemented
    note: 错误状态使能：整字节或按位。
  - header: ERRS
    level: implemented
    note: 错误状态字节（CLK/BACKUP/VXI…硬件位，仿真恒 0）：读后清零。
  - header: LIAE
    level: implemented
    note: LIA 状态使能 0–4095：整字或按位。
  - header: LIAS
    level: implemented
    note: LIA 状态字：位 0 CH1 输出过载（模型为输出过载）、位 3 失锁、位 4 输入量程过载、位 7 触发；同步滤波、数据通道与扫描位未建模。读整字清零，读一位只清该位。
  - header: CUROVLDSTAT
    level: implemented
    note: 当前过载状态（不锁存）：位 0 输出过载、位 3 失锁、位 4 输入量程；数据通道位未建模。
