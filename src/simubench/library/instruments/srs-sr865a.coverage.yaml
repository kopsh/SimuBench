- section: Data Transfer Commands
  commands:
  - header: OUTR
    level: implemented
    note: 数据通道 j（DAT1–4 或 0–3）当前指派的参数。
  - header: OUTP
    level: implemented
    note: 参数表（0–16，词或序号，#383）的一项：X/Y/R/θ、AUX 输入、噪声、AUX 输出、相位、正弦幅度、直流电平（恒 0）、内部/外部频率；%g 格式。XNOise/YNOise 为前端噪声密度的模型估计，两者读同一个值（模型不分别估计 X、Y 两路的噪声；手册中为两个独立参数，已知偏差，#401）。
  - header: SNAP
    level: implemented
    note: 参数表的 2–3 项，同一时刻求值，按请求顺序逗号分隔。
  - header: SNAPD
    level: implemented
    note: 四个数据通道（CDSP 的指派），同一时刻求值。
- section: Data Capture Commands
  commands:
  - header: CAPTURELEN
    level: implemented
    note: 缓冲长度 n kB（1–4096），每 kB 256 个数据点，按 CAPTURECFG 的参数个数分给各曲线；手册的奇数进位到偶数未建模（按写入值），复位值手册未给，取 256。
  - header: CAPTURECFG
    level: implemented
    note: 捕获 X / XY / Rθ / XYRθ（0–3）；R 为显示值（含 R 的偏置与扩展），θ 为度。
  - header: CAPTURERATEMAX
    level: not_modeled
    note: 最大捕获率查询未建模（可由 CAPTURERATE 0 后的 CAPTURERATE? 得到）。
  - header: CAPTURERATE
    level: implemented
    note: 写 n：速率 = 当前时间常数下的最大捕获率 / 2^n（0–20，手册的时间常数–最大速率表；100 µs 一行手册印作 325 kHz，按 1.25 MHz / 4 = 312.5 kHz）；查询回实际速率 Hz。
  - header: CAPTURESTART
    level: implemented
    note: ONEshot/CONTinuous（单次存满停止 / 连续绕回）与 IMMediate：清空后立即开始；TRIGstart、SAMPpertrig（后面板 TRIG IN）未建模，报 EXE。
  - header: CAPTURESTOP
    level: implemented
    note: 停止捕获，已存数据保留。
  - header: CAPTURESTAT
    level: implemented
    note: 位 0 进行中、位 1 已开始、位 2 已绕回（单次存满或连续开始覆盖）。
  - header: CAPTUREBYTES
    level: implemented
    note: 已存数据字节数（点数 × 曲线数 × 4）。
  - header: CAPTUREPROG
    level: implemented
    note: 本次捕获写入的 kB，按 2 kB 块向上取整。
  - header: CAPTUREVAL
    level: implemented
    note: 第 n 个样本（0 为最旧）的 1/2/4 个值，逗号分隔；缓冲内尚未写到的位置读 0。
  - header: CAPTUREGET
    level: implemented
    note: i kB 起 j kB（1–64）的定长块（#ncccc），单精度小端、曲线逐点交织；须停止后读，超出数据补 0。
