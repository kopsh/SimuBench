# SRS SR865A 的覆盖表（#333）：命令按 SR865A Operation Manual（Revision 2.11，文档号 9-01715-903）
# 卷首的 SR865A Command List 逐条列出（同一命令在两节出现时只收一次）；程度与说明手写。
schema: simubench.coverage/1
model: srs-sr865a
sections:
- section: Reference Commands
  commands:
  - header: TBMODE
    level: accepted
    note: 10 MHz 时基 AUTO/INternal 保存并回读；仿真时基理想，不影响测量。
    affects_data: false
  - header: TBSTAT
    level: implemented
    note: 当前时基：没有外部 10 MHz 输入，恒为内部（1）。
  - header: PHAS
    level: implemented
    note: 参考相位，度；接受 UDEG/MDEG/DEG/URAD/MRAD/RAD（#383），查询回度。手册允许 ±360000° 并回绕到 ±180°，模型只接受 −180…180°，超出报 EXE（回绕未建模）。
  - header: APHS
    level: implemented
    note: 自动相位：把参考相位设为当前 θ，输出经若干时间常数后 θ → 0。
  - header: FREQ
    level: implemented
    note: 内部参考频率 1 mHz–4 MHz，接受 HZ/KHZ/MHZ；查询回 Hz。外部参考时手册回测得的外部频率，模型回设定值（外部参考锁定到输入频率）。
  - header: FREQINT
    level: implemented
    note: 内部参考频率（与 FREQ 同一设置）。
  - header: FREQEXT
    level: implemented
    note: 参考块当前频率；外部参考时为锁定的输入频率。内部参考时手册回 REF IN 上测得的频率，模型回内部频率。
  - header: FREQDET
    level: implemented
    note: 检测频率 = 谐波 × 参考频率（双参考未建模）。
  - header: HARM
    level: implemented
    note: 检测谐波 1–99。
  - header: HARMDUAL
    level: not_modeled
    note: 双参考未建模。
  - header: BLADESLOTS
    level: not_modeled
    note: 斩波器（SR540）参考未建模。
  - header: BLADEPHASE
    level: not_modeled
    note: 斩波器（SR540）参考未建模。
  - header: SLVL
    level: implemented
    note: 正弦输出幅度 1 nV–2 V rms，接受 NV/UV/MV/V。Standard Settings 显示 0.00 Vrms，模型的复位值为下限 1 nV（3 位显示下同为 0.00）。
  - header: SOFF
    level: implemented
    note: 正弦输出直流电平 −5…+5 V（p.109），叠加在 SINE_OUT 上（lockin_reference.dc_level，#407）；OUTP? LEVel 回读；越界置 EXE；*RST 0。舍入到 3 位/0.1 mV 未建模（保存原值）。
  - header: REFM
    level: implemented
    note: 直流方式 COMmon(0)/DIFference(1)（p.110）保存并回读；台架只有 SINE_OUT（+）一路，两种方式下都带 +SOFF，差分方式只影响 − 输出（未建模，#407）。
  - header: RSRC
    level: implemented
    note: 参考源 INT/EXT（0/1）；DUAL、CHOP 未建模，写这两个词报 EXE。
  - header: RTRG
    level: implemented
    note: 外部参考触发 SIN/POSttl/NEGttl：正弦过零与上升沿同为零相位点，下降沿晚半个周期。
  - header: REFZ
    level: implemented
    note: 外部参考输入阻抗 50 Ω / 1 MΩ，进入电路。
  - header: PSTF
    level: not_modeled
    note: 前面板预置频率键未建模。
  - header: PSTA
    level: not_modeled
    note: 前面板预置幅度键未建模。
  - header: PSTL
    level: not_modeled
    note: 前面板预置直流电平键未建模。
- section: Signal Commands
  commands:
  - header: IVMD
    level: implemented
    note: 电压/电流输入；电流时 SIG_IN（与 I_IN 同一节点，真机为单独的 I 接头）为 100 Ω（1 µA 档）或 1 kΩ（10 nA 档）虚地，读数以 A 计。
  - header: ISRC
    level: implemented
    note: 电压输入 A 或 A−B。
  - header: ICPL
    level: implemented
    note: 输入耦合 AC（160 mHz 高通）/DC。
  - header: IGND
    level: implemented
    note: 屏蔽浮地/接地保存并回读：台架的网络共用一个地，不改变读数（同 SR830）。
  - header: IRNG
    level: implemented
    note: 电压输入量程 1 V/300 mV/100 mV/30 mV/10 mV：峰值超过量程置输入过载（LIA 位 4）。
  - header: ICUR
    level: implemented
    note: 电流增益 1 MΩ（1 µA）/100 MΩ（10 nA）：换算与输入阻抗；两档的噪声与带宽差别未建模。
  - header: ILVL
    level: not_modeled
    note: 信号强度指示（0–4）未建模；输入过载见 CUROVLDSTAT? 位 4。
  - header: SCAL
    level: implemented
    note: 灵敏度 0（1 V）–27（1 nV），1-2-5 序列；电流输入时按 µA…fA 读。只决定输出过载，不缩放 X/Y/R。
  - header: DUALREFSYNC
    level: not_modeled
    note: 双参考未建模。
  - header: OFLT
    level: implemented
    note: 时间常数 0（1 µs）–21（30 ks）。
  - header: OFSL
    level: implemented
    note: 滤波斜率 6/12/18/24 dB/oct。
  - header: SYNC
    level: implemented
    note: 同步滤波：只接受 OFF（复位值）；ON 报 EXE（同步滤波未建模）。
  - header: ADVFILT
    level: implemented
    note: 高级滤波：只接受 ON（复位值，模型的滤波器即理想的高级滤波）；OFF 报 EXE（输出纹波未建模）。
  - header: ENBW
    level: implemented
    note: 输出滤波器的等效噪声带宽，Hz。
- section: CH1/CH2 Output Commands
  commands:
  - header: COUT
    level: accepted
    note: CH1/CH2 后面板模拟输出选 XY 或 Rθ：保存并回读；台架上没有 CH1/CH2 输出端口，不影响读数。
    affects_data: false
  - header: CEXP
    level: implemented
    note: X/Y/R 的扩展 OFF/X10/X100（R 只作用于显示与读数表的 R 显示值，同 SR830）。
  - header: COFA
    level: implemented
    note: X/Y/R 偏置开关：开时偏置为 COFP 的百分数（映射取值引用设置，#400）。
  - header: COFP
    level: implemented
    note: X/Y/R 偏置百分数 −999.99…999.99，满量程的百分数。
  - header: OAUT
    level: not_modeled
    note: 自动偏置未建模。
  - header: CRAT
    level: not_modeled
    note: 以 Aux In 3/4 为分母的比值未建模。
- section: Aux Input and Output Commands
  commands:
  - header: OAUX
    level: implemented
    note: AUX 输入 1–4（j = 0–3）的电压，电路层。
  - header: AUXV
    level: implemented
    note: AUX 输出 1–4（j = 0–3）电压 −10.5…10.5 V，接受 NV/UV/MV/V；电路层。
- section: Auto Function Commands
  commands:
  - header: ARNG
    level: not_modeled
    note: 自动量程未建模。
  - header: ASCL
    level: not_modeled
    note: 自动定标（灵敏度）未建模。
- section: Display Commands
  commands:
  - header: DBLK
    level: accepted
    note: 前面板消隐保存并回读；不影响测量。
    affects_data: false
  - header: DLAY
    level: accepted
    note: 屏幕布局保存并回读；不影响测量。
    affects_data: false
  - header: DCAP
    level: not_modeled
    note: 截屏到 U 盘未建模（无文件系统）。
  - header: CDSP
    level: implemented
    note: 数据通道 DAT1–DAT4（j = 0–3）的参数指派（0–16，词或序号），决定 SNAPD?/OUTR? 的读数。
  - header: CGRF
    level: accepted
    note: 数据通道的曲线开关保存并回读；不影响测量。
    affects_data: false
  - header: GETSCREEN
    level: not_modeled
    note: 截屏图像未建模。
- section: Strip Chart Commands
  commands:
