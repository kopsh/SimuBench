  measure.thr.general{n}.abs_middle: {type: float, unit: V, min: -1000000.0, max: 1000000.0, default: 0.0, each: {n: {first: 1, last: 5}}, label: "通用中阈值 V {n}", label_en: "General middle V {n}"}
  measure.thr.general{n}.abs_lower: {type: float, unit: V, min: -1000000.0, max: 1000000.0, default: -0.1, each: {n: {first: 1, last: 5}}, label: "通用下阈值 V {n}", label_en: "General lower V {n}"}
