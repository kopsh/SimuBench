  measure.thr.general{n}.tb_top: {type: float, unit: V, min: -1000000.0, max: 1000000.0, default: 0.2, each: {n: {first: 1, last: 5}}, label: "通用绝对顶 {n}", label_en: "General absolute top {n}"}
