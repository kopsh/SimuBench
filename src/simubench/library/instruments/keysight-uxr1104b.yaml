  - {header: ":ACQuire:BANDwidth:TESTLIMITS", op: sys.none, set: false, reply: "1,<numeric>+1.00000E+08:+1.13000E+11"}
  - {header: ":ACQuire:POINts:TESTLIMITS", op: sys.none, set: false, reply: "1,<numeric>16:10000000"}
  - {header: ":ACQuire:SRATe:TESTLIMITS", op: sys.none, set: false, reply: "1,<numeric>+0.00000E+00:+2.56000E+11"}
  # 四个通道都能打开：1,<enum>0|1（手册的例子）。
  - {header: ":CHANnel<ch>:DISPlay:TESTLIMITS", op: sys.none, set: false, reply: "1,<enum>0|1"}
