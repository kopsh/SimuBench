  - {header: ":DISPlay:GRATicule:AREA<n>:VSCale", state: "display.area{n}.vscale", suffixes: {n: [1, 2, 3, 4, 5, 6, 7, 8]}}
  # 波形区 1 总是开着，不能关（手册）：AREA1:STATe? 回 1，写它报错（只读）。
  - {header: ":DISPlay:GRATicule:AREA<n>:STATe", state: "display.area{n}.state", suffixes: {n: [1, 2, 3, 4, 5, 6, 7, 8]}}
