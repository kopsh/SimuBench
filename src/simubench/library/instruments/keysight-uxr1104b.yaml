  # 显示开关不改变数据，未分开保存，覆盖表注明）；PERSistence 的 <source> 手册说只为兼容旧语法，总是作用于全部。
  - header: ":DISPlay:CONNect"
    params:
      - {name: "on", type: bool, state: display.connect}
      - {name: source, type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], index: true, index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}, index_default: 1, echo: false, not_modeled: {DIFF: differential channels are not modeled, COMMonmode: common-mode channels are not modeled, FUNCtion: math functions are not modeled (C5), WMEMory: waveform memories are not modeled, EQUalized: equalization is out of scope, MTRend: measurement trends are not modeled, MSPectrum: measurement spectra are not modeled, XT: crosstalk is out of scope, PNOise: phase noise is out of scope, INPut: SNDR waveforms are out of scope, CORRected: SNDR waveforms are out of scope, ERRor: SNDR waveforms are out of scope, LFPR: SNDR waveforms are out of scope, NREDuced: noise reduction is out of scope}}
  - header: ":DISPlay:MAIN"
    params:
      - {name: "on", type: bool, state: display.main}
      - {name: source, type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], index: true, index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}, index_default: 1, echo: false, not_modeled: {DIFF: differential channels are not modeled, COMMonmode: common-mode channels are not modeled, FUNCtion: math functions are not modeled (C5), WMEMory: waveform memories are not modeled, EQUalized: equalization is out of scope, MTRend: measurement trends are not modeled, MSPectrum: measurement spectra are not modeled, XT: crosstalk is out of scope, PNOise: phase noise is out of scope, INPut: SNDR waveforms are out of scope, CORRected: SNDR waveforms are out of scope, ERRor: SNDR waveforms are out of scope, LFPR: SNDR waveforms are out of scope, NREDuced: noise reduction is out of scope}}
  - header: ":DISPlay:PERSistence"
    params:
      - {name: time, type: float, unit: S, state: display.persistence}
      - {name: source, type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], index: true, index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}, index_default: 1, echo: false, not_modeled: {DIFF: differential channels are not modeled, COMMonmode: common-mode channels are not modeled, FUNCtion: math functions are not modeled (C5), WMEMory: waveform memories are not modeled, EQUalized: equalization is out of scope, MTRend: measurement trends are not modeled, MSPectrum: measurement spectra are not modeled, XT: crosstalk is out of scope, PNOise: phase noise is out of scope, INPut: SNDR waveforms are out of scope, CORRected: SNDR waveforms are out of scope, ERRor: SNDR waveforms are out of scope, LFPR: SNDR waveforms are out of scope, NREDuced: noise reduction is out of scope}}
  - {header: ":DISPlay:GRATicule", state: display.graticule}
