      - {name: view, type: enum, options: [MAIN, CGRade], optional: true, state: "ch{source}.grid_view"}
  - {header: ":DISPlay:LAYout", state: display.layout}
  # :DISPlay:PROPortion：查询在 10.20 版已废弃（手册），只有设置；串行、抖动等窗格不在仿真范围内。
  - header: ":DISPlay:PROPortion"
    query: false
