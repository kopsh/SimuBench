    query: false
    params:
      - name: source
        type: enum
        options: [CHN1, CHN2, CHN3, CHN4]
        index: true
        index_words: {CHN1: 1, CHN2: 2, CHN3: 3, CHN4: 4}
        not_modeled: {DIFF1: differential channels are not modeled, DIFF2: differential channels are not modeled, COMM3: common-mode channels are not modeled, COMM4: common-mode channels are not modeled, MEM1: waveform memories are not modeled, MEM2: waveform memories are not modeled, MEM3: waveform memories are not modeled, MEM4: waveform memories are not modeled, HIST: histograms are not modeled, INPut: SNDR waveforms are out of scope, CORRected: SNDR waveforms are out of scope, ERRor: SNDR waveforms are out of scope, LFPR: SNDR waveforms are out of scope, NREDuced: noise reduction is out of scope}
