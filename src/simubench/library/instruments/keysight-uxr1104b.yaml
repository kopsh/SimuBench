schema: simubench.instrument/1
id: keysight-uxr1104b
manufacturer: Keysight Technologies
model: UXR1104B
class: oscilloscope
version: 1
description: >-
  Keysight Infiniium UXR1104B, 4 channels, 110 GHz, 256 GSa/s, 10-bit ADC, 1 mm 50 ohm inputs. Real
  model (D42): the same command set as the UXR0334B (Infiniium UXR-Series Oscilloscopes Programmer's
  Guide 11.60.00000, 9018-07723); ranges, noise and accuracies follow the 1 mm input columns of the
  UXR-B data sheet 3123-1313 (#1092). Values neither document gives are SimuBench defaults, listed
  in the coverage table.
reference:
  title: Keysight Infiniium UXR-Series Oscilloscopes Programmer's Guide
  document: 9018-07723
  version: "Version 11.60.00000, March 2024"
  firmware: "Infiniium UXR-Series software 11.60"
identity:
  # *IDN? per the guide: Keysight Technologies,<Model #>,<USXXXXXXXX>,<Rev #>[,<Options>].
  # :SYSTem:PERSona 改厂商与型号两段。
  idn: "{$system.persona_manufacturer},{$system.persona_model},{serial},{firmware}"
  # *OPT?：内置命令按测试台实例的选件回答（手册表 10），没有选件回 0。
  options_reply: "{options}"
  serial: MY64310101
  firmware: "11.60.00000"
# :SYSTem:ERRor? is the model's own command (a number, or with STRing the number and the text).
# 选件（*OPT?，手册表 10；数据手册 3123-1313 的存储深度选件）：01G 为 1 Gpts、02G 为 2 Gpts。仿真的记录
# 至多 10 Mpts（#1012），选件只改 *OPT? 的回答。
options:
  - id: 01G
    label: 存储深度 1 Gpts（1 GPts memory）
  - id: 02G
    label: 存储深度 2 Gpts（2 GPts memory）
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST"]
# The guide: the error queue is 30 errors deep.
error_queue: 30
# The guide's sample reply for :CHANnel1:RANGe? is +8.00000E-01: NR3, five decimals, signed.
format:
  number: nr3
  digits: 5
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  # The guide's example programs test an empty queue with "0," at the start of the reply.
  error_code: plain
errors:
  0: "No error"
# 应答头与长格式（手册 :SYSTem:HEADer、:SYSTem:LONGform、:MODel? 的表 13）。
dialect:
  echo_header: $system.header
  long_form: $system.longform
specs:
  source: Infiniium UXR-B Series Oscilloscopes Data Sheet 3123-1313 (2024-04-25), 1 mm input models
  # p.7 "Vertical System – Performance Characteristics by Model - 1 mm Input Models", UXR1104B column.
  bandwidth_hz: 1.13e11
  warranted_bandwidth_hz: 1.1e11
  rise_time_10_90_s: 4.0e-12
  enob_typical: {"≥ 400 mVfs": 5.0, "60 mVfs": 4.2}
  # p.2 model table and p.5 "Vertical System Specifications – 1mm & 1.85 mm Input Models".
  sample_rate: 2.56e11
  # "Memory depth per channel": 500 Mpts standard, up to 2 Gpts with options (UXR0000-02G).
  memory_depth_pts: 5.0e8
  memory_depth_options_pts: [1.0e9, 2.0e9]
  vertical_resolution_bits: 10
  # p.5: displayed sensitivity 1 mV/div to 500 mV/div; hardware 60 mV to 4.0 V full scale
  # (magnification below 7.5 mV/div, where full scale counts as 60 mV).
  input_sensitivity_v_div: [1.0e-3, 0.5]
  input: {r_ohm: 50.0, r_tolerance: 0.03, coupling: DC, connector: 1 mm}
  offset_range_v: {"1 mV to 59 mV/div": 0.4, "60 mV to 127 mV/div": 0.86, "128 mV to 279 mV/div": 1.85, "280 mV to 500 mV/div": 4.0}
  dc_gain_accuracy: "±2% of full scale (typical ±1%)"
  offset_accuracy: "±(2% of channel offset + 1% of full scale + 600 µV) (typical 1% of channel offset)"
  # p.11: 1 ps/div for the 40 GHz to 110 GHz models; the programmer's guide gives 5 ps/div as the
  # :TIMebase:SCALe limit, which the definition follows (coverage table).
  timebase_s_div: [1.0e-12, 20.0]
  timebase_delay_s: [-200.0, 200.0]
  time_scale_accuracy: "±(25 ppb initial + 100 ppb/year aging) first year"
  trigger_sensitivity: "1 div p-p"
  trigger_level_range: "±4 div from center screen or ±4 V, whichever is smaller; AUX ±5 V"
  trigger_holdoff_s: [4.0e-8, 10.0]
  trigger_jitter_s_rms: 2.5e-14
  noise_floor: >-
    published per full scale: the Infiniium UXR-B Series data sheet 3123-1313's "RMS Noise Floor –
    Performance Characteristics (Measured)" table, UXR1104B / UXR1102B column (page 8): 860 µV rms
    at 60 mV full scale (7.5 mV/div) rising to 29 mV rms at 4.0 V full scale (500 mV/div).
  noise_per_division: >-
    the data sheet's table per full scale (60 mV to 4.0 V, 7.5 to 500 mV/div). Below 7.5 mV/div the
    scope magnifies the 60 mV range, so 1 to 7.4 mV/div hold its 860 µV. Each division takes the row
    of the largest listed division not above it (scope_vertical noise_table).
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  # 操作状态使能（:OPEEnable）：位 0 ACQ DONE、位 1 PROC DONE、位 5 WAIT TRIG、位 11 AUTO TRIG；摘要进 *STB 位 7。
  status.opee:
    type: int
    min: 0
    max: 65535
    default: 0
    label: 操作状态使能
    label_en: Operation status enable
  # 应答头（:SYSTem:HEADer）与长格式（:SYSTem:LONGform）两个开关（dialect，#602）；上电值是用户偏好，
  # 手册未给，SimuBench 取 OFF。
  system.header:
    type: bool
    default: false
    label: 应答头
    label_en: Response headers
  system.longform:
    type: bool
    default: false
    label: 长格式应答
    label_en: Long-form responses
  timebase.scale:
    type: float
    unit: S
    min: 5.0e-12
    max: 20.0
    default: 1.0e-7
    label: 时基
    label_en: Timebase
  timebase.position:
    type: float
    unit: S
    min: -200.0
    max: 200.0
    default: 0.0
    label: 水平位置
    label_en: Position
  # PERCent：参考位置由 :TIMebase:REFerence:PERCent 给出（手册：查询回 PERC）。
  timebase.reference:
    type: enum
    options: [LEFT, CENTer, RIGHt, PERCent]
    default: CENTer
    label: 时间参考
    label_en: Reference
  trigger.mode:
    type: enum
    options: [EDGE, GLITch, PWIDth]
    default: EDGE
    not_modeled:
      PATTern: pattern trigger is not modeled
      STATe: state trigger is not modeled
      RUNT: runt trigger is not modeled
      SHOLd: setup and hold trigger is not modeled
      TRANsition: transition trigger is not modeled
      DELay: delay trigger is not modeled
      TIMeout: timeout trigger is not modeled
      WINDow: window trigger is not modeled
      OR: ORed edges trigger is not modeled
      EBURst: burst trigger is not modeled
      SEQuence: sequence trigger is not modeled
      IFMagn: IF magnitude trigger is not modeled
    label: 触发类型
    label_en: Trigger type
  trigger.sweep:
    type: enum
    options: [AUTO, TRIGgered]
    default: AUTO
    not_modeled: {SINGle: "the single sweep (the guide: do not use in new programs; use :SINGle)"}
    label: 触发方式
    label_en: Trigger sweep
  trigger.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, AUXiliary]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4, AUXiliary: AUX}
    default: CHANnel1
    label: 触发源
    label_en: Trigger source
  # 每个信源一个触发电平（手册 :TRIGger:LEVel {CHANnel<N> | AUX},<level>）；默认设置为 0 V。
  trigger.level1: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH1, label_en: Trigger level CH1}
  trigger.level2: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH2, label_en: Trigger level CH2}
  trigger.level3: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH3, label_en: Trigger level CH3}
  trigger.level4: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, label: 触发电平 CH4, label_en: Trigger level CH4}
  # AUX 输入 ±5 V（数据手册）。
  trigger.level5: {type: float, unit: V, min: -5.0, max: 5.0, default: 0.0, label: 触发电平 AUX, label_en: Trigger level AUX}
  trigger.slope:
    type: enum
    options: [POSitive, NEGative, EITHer, ALTernate]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  # 手册：释抑 100 ns 到 10 s（数据手册写 40 ns 起，按编程手册）。
  trigger.holdoff:
    type: float
    unit: S
    min: 1.0e-7
    max: 10.0
    default: 1.0e-7
    label: 释抑时间
    label_en: Holdoff
  acquire.mode:
    type: enum
    options: [RTIMe, SEGMented]
    default: RTIMe
    not_modeled:
      PDETect: real-time peak detect is not modeled
      HRESolution: real-time high resolution is not modeled
      SEGPdetect: segmented memory with peak detect is not modeled
      SEGHres: segmented memory with high resolution is not modeled
    label: 采集模式
    label_en: Acquire mode
  acquire.average:
    type: bool
    default: false
    label: 平均
    label_en: Averaging
  acquire.count:
    type: int
    min: 2
    max: 1048575
    default: 16
    label: 平均次数
    label_en: Averages
  acquire.complete:
    type: int
    min: 0
    max: 100
    default: 90
    label: 采集完成判据
    label_en: Acquire complete
  # 存储深度：AUTO 由示波器选择（SimuBench 取 256 kpts，默认时基下正好 256 GSa/s）；手动值到 10 Mpts
  # （仿真上限，真机标配 500 Mpts、选件到 2 Gpts，#1012，覆盖表注明）。
  acquire.points:
    type: int
    min: 16
    max: 10000000
    default: 256000
    special: {AUTO: 256000}
    label: 存储深度
    label_en: Memory depth
  # 采样率（:ACQuire:SRATe[:ANALog]）：AUTO（0）随存储深度；设定值取下一个更快的档（256 GSa/s 除以
  # 2 的幂，手册与数据手册），优先于存储深度。
  acquire.srate:
    type: float
    unit: HZ
    min: 0.0
    max: 2.56e11
    default: 0.0
    special: {AUTO: 0.0, MAX: 2.56e11}
    label: 采样率设定
    label_en: Sample rate setting
  # 带宽滤波（:ACQuire:BANDwidth）：MAX 为硬件带宽 113 GHz（数据手册典型值，保证 110 GHz）；AUTO 未建模。
  acquire.bandwidth:
    type: float
    unit: HZ
    min: 1.0e8
    max: 1.13e11
    default: 1.13e11
    special: {MAX: 1.13e11}
    not_modeled: {AUTO: the automatic bandwidth selection is not modeled}
    label: 带宽
    label_en: Bandwidth
  # 带宽滤波的幅度响应（:ACQuire:RESPonse）：FLATmag（默认，平坦幅度、线性相位，阶跃有振铃）或
  # GAUSsianmag（高斯幅度，无振铃），-3 dB 点都在 :ACQuire:BANDwidth（#607）。
  acquire.response:
    type: enum
    options: [FLATmag, GAUSsianmag]
    default: FLATmag
    label: 带宽滤波响应
    label_en: Filter response
  waveform.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4}
    default: CHANnel1
    label: 波形传输源
    label_en: Waveform source
  # 手册：默认格式为 ASCii。
  waveform.format:
    type: enum
    options: [ASCii, BYTE, WORD]
    default: ASCii
    not_modeled: {BINary: the BINary format is not modeled, FLOat: color grade data is not modeled}
    label: 波形格式
    label_en: Waveform format
  waveform.byteorder:
    type: enum
    options: [MSBFirst, LSBFirst]
    default: MSBFirst
    label: 波形字节序
    label_en: Waveform byte order
  # 流式传输：ON 时 :WAVeform:DATA? 回 #0 不定长块（手册 Streaming On）；默认 OFF 为 SimuBench 值。
  waveform.streaming:
    type: bool
    default: false
    label: 流式传输
    label_en: Streaming
  measure.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
    label: 测量信源
    label_en: Measure source
  measure.source2:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel2
    label: 测量信源 2
    label_en: Measure source 2
  # 界面与身份：前面板锁定、隐藏指示灯、屏幕文字、标签显示与网格亮度都不改变数据。
  system.lock: {type: bool, default: false, label: 前面板锁定, label_en: Front panel lock}
  system.hled: {type: bool, default: false, label: 隐藏指示灯, label_en: Hide LEDs}
  system.dsp: {type: string, default: "", label: 屏幕文字, label_en: Display text}
  display.label: {type: bool, default: false, label: 显示标签, label_en: Labels}
  display.intensity: {type: int, min: 0, max: 100, default: 50, label: 网格亮度, label_en: Grid intensity}
  # 只读身份：只有一个取值的枚举使 :SERial? / :MODel? 回不带引号的字符串（手册的样例）。
  system.serial:
    type: enum
    options: [MY64310101]
    default: MY64310101
    readonly: true
    label: 序列号
    label_en: Serial number
  system.model:
    type: enum
    options: [UXR1104B]
    default: UXR1104B
    readonly: true
    label: 型号
    label_en: Model
  # ---- 触发：毛刺与脉宽（scope_trigger 的 glitch 模式，#956）、释抑、迟滞与门限 ------------------------------
  # 毛刺：比宽度窄的脉冲（手册 :TRIGger:GLITch）；脉宽：大于、小于、范围内、范围外（:TRIGger:PWIDth）。宽度
  # 250 ps 到 10 s（手册 :TRIGger:PWIDth:WIDTh；毛刺“从可检测的最小脉宽到 10 s”，取同一下限）；上电值手册未给，
  # SimuBench 取毛刺 1 ns、脉宽 1 ns、范围 1–2 ns，正极性，GTHan，EPULse。
  trigger.glitch_source: {type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], default: CHANnel1, label: 毛刺触发源, label_en: Glitch source}
  trigger.glitch_polarity: {type: enum, options: [POSitive, NEGative], default: POSitive, label: 毛刺极性, label_en: Glitch polarity}
  trigger.glitch_width: {type: float, unit: S, min: 2.5e-10, max: 10.0, default: 1.0e-9, label: 毛刺宽度, label_en: Glitch width}
  trigger.pwidth_source: {type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], default: CHANnel1, label: 脉宽触发源, label_en: Pulse width source}
  trigger.pwidth_polarity: {type: enum, options: [NEGative, POSitive], default: POSitive, label: 脉宽极性, label_en: Pulse width polarity}
  trigger.pwidth_mode: {type: enum, options: [GTHan, LTHan, RANGe, ORANge], default: GTHan, label: 脉宽条件, label_en: Pulse width mode}
  trigger.pwidth_width: {type: float, unit: S, min: 2.5e-10, max: 10.0, default: 1.0e-9, label: 脉宽, label_en: Pulse width}
  trigger.pwidth_gt: {type: float, unit: S, min: 2.5e-10, max: 10.0, default: 1.0e-9, label: 脉宽范围下限, label_en: Pulse width greater than}
  trigger.pwidth_lt: {type: float, unit: S, min: 2.5e-10, max: 10.0, default: 2.0e-9, label: 脉宽范围上限, label_en: Pulse width less than}
  trigger.pwidth_tpoint: {type: enum, options: [EPULse, TIMeout], default: EPULse, label: 脉宽触发点, label_en: Pulse width trigger point}
  # 释抑方式：FIXed；RANDom（随机释抑）未建模。随机释抑的上下限只在 RANDom 下起作用，保存与回读。
  trigger.holdoff_mode: {type: enum, options: [FIXed], not_modeled: {RANDom: random holdoff is not modeled}, default: FIXed, label: 释抑方式, label_en: Holdoff mode}
  trigger.holdoff_min: {type: float, unit: S, min: 1.0e-7, max: 10.0, default: 1.0e-7, label: 随机释抑下限, label_en: Random holdoff min}
  trigger.holdoff_max: {type: float, unit: S, min: 1.0e-7, max: 10.0, default: 1.0e-6, label: 随机释抑上限, label_en: Random holdoff max}
  # 高带宽触发（:TRIGger:HIGH）：手册说上升/下降沿触发时自动打开；仿真的触发没有带宽限制，保存与回读。
  trigger.high: {type: bool, default: true, label: 高带宽触发, label_en: High-bandwidth trigger}
  # 迟滞：NORMal（半格，数据手册 1 格峰峰的灵敏度）、NREJect（加大到 1 格）、HSENsitivity（减到 1/4 格）；
  # 后两档的数值手册未给，为 SimuBench 值。
  trigger.hysteresis: {type: enum, options: [NORMal, NREJect, HSENsitivity], default: NORMal, label: 触发迟滞, label_en: Trigger hysteresis}
  # 高、低门限（矮脉冲、跳变、建立保持等触发用，这些触发未建模）：按信源保存与回读。
  trigger.hth{n}: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, each: {n: {first: 1, last: 5}}, label: "高门限 {n}", label_en: "High threshold {n}"}
  trigger.lth{n}: {type: float, unit: V, min: -1.0e6, max: 1.0e6, default: 0.0, each: {n: {first: 1, last: 4}}, label: "低门限 {n}", label_en: "Low threshold {n}"}
  # ---- 时基：百分比参考位置、10 MHz 参考输入、缩放窗口 ----------------------------------------------------
  timebase.reference_percent: {type: int, min: 0, max: 100, default: 50, label: 参考位置百分比, label_en: Reference percent}
  timebase.refclock: {type: bool, default: false, label: 10 MHz 参考输入, label_en: 10 MHz reference in}
  # 滚动模式：UXR 没有，只能 OFF（手册）。
  timebase.roll: {type: enum, options: ["OFF", "0"], replies: {"OFF": "0"}, not_modeled: {"ON": the UXR-Series has no roll mode, "1": the UXR-Series has no roll mode}, default: "OFF", label: 滚动模式, label_en: Roll mode}
  # 缩放（:TIMebase:VIEW WINDow）：只改显示，采集与 :WAVeform:VIEW ALL/MAIN 的数据不变；窗口 1 ps/div（手册：
  # 最小 10 ps 满量程）到主时基，位置 ±200 s；上电值 SimuBench 取 10 ps/div、0 s。
  timebase.view: {type: enum, options: [MAIN, WINDow], default: MAIN, label: 缩放, label_en: Zoom}
  timebase.window_scale: {type: float, unit: S, min: 1.0e-12, max: 20.0, default: 1.0e-11, label: 缩放时基, label_en: Zoom scale}
  timebase.window_position: {type: float, unit: S, min: -200.0, max: 200.0, default: 0.0, label: 缩放位置, label_en: Zoom position}
  # ---- 采集 --------------------------------------------------------------------------------------------------
  acquire.points_auto: {type: bool, default: true, label: 自动存储深度, label_en: Auto memory depth}
  acquire.srate_auto: {type: bool, default: true, label: 自动采样率, label_en: Auto sample rate}
  # 以下四项不改变仿真的数据：函数平均（函数未建模）、快速绘图、高分辨率位数（高分辨率模式未建模）、显示插值。
  acquire.complete_state: {type: bool, default: true, label: 等函数平均完成, label_en: Wait for function average}
  acquire.fplot: {type: bool, default: true, label: 快速绘图, label_en: Fast plot}
  acquire.hresolution: {type: enum, options: [AUTO, BITS11, BITS12], default: AUTO, label: 高分辨率位数, label_en: High resolution bits}
  acquire.interpolate: {type: enum, options: ["ON", "OFF", "1", "0", INT1, INT2, INT4, INT8, INT16, INT32], replies: {"ON": "1", "OFF": "0"}, default: "ON", label: 插值, label_en: Interpolation}
  # :ACQuire:REDGe：UXR 只能 OFF（手册）。
  acquire.redge: {type: enum, options: ["OFF", "0"], replies: {"OFF": "0"}, not_modeled: {"ON": the UXR-Series has OFF only, "1": the UXR-Series has OFF only}, default: "OFF", label: REDGe, label_en: REDGe}
  # 分段存储（:ACQuire:MODE SEGMented，#957）：段数 2 起，各段点数之和至多 10 Mpts（仿真上限，#1012）；上电
  # 值 SimuBench 取 2 段、第 1 段。回放（AUToplay、PLAY、PRATe）只改显示：仿真里回放瞬间完成。
  acquire.segmented_count: {type: int, min: 2, max: 65536, default: 2, label: 段数, label_en: Segments}
  acquire.segmented_index: {type: int, min: 1, max: 65536, default: 1, label: 所选的段, label_en: Segment index}
  acquire.segmented_autoplay: {type: bool, default: false, label: 自动回放, label_en: Autoplay}
  acquire.segmented_playing: {type: bool, default: false, readonly: true, label: 正在回放, label_en: Playing}
  acquire.segmented_prate: {type: float, unit: S, min: 0.001, max: 1.0, default: 0.1, label: 回放速率, label_en: Play rate}
  acquire.segmented_ttags: {type: bool, default: true, label: 段时间标签, label_en: Time tags}
