      - {name: hue, type: int, state: "display.color{element}.hue"}
      - {name: saturation, type: int, state: "display.color{element}.saturation"}
      - {name: luminosity, type: int, state: "display.color{element}.luminosity"}
  - {header: ":DISPlay:STATus:COLumn", state: display.status_column}
  - {header: ":DISPlay:STATus:ROW", state: display.status_row}
  - {header: ":DISPlay:THEMe", state: display.theme}
  - header: ":DISPlay:WINDow:MAXimize"
    query: false
    params:
      - name: window
        type: enum
        options: [AREA1, AREA2, AREA3, AREA4, AREA5, AREA6, AREA7, AREA8]
        state: display.maximized
        not_modeled: {SERial: serial decode panes are out of scope, JITTer: jitter panes are out of scope, NOISe: noise panes are out of scope, ISIM: the InfiniiSim pane is not modeled, PRECprobe: the PrecisionProbe pane is not modeled, BUS: bus panes are not modeled, P4Jitter: PAM4 jitter panes are out of scope}
  # 书签（手册 :DISPlay:BOOKmark<N>，N 为 1–100）：SET 写下书签，DELete 删掉；VERTical? 回书签所在波形在其
