  measure.thr.general{n}.tb_method: {type: enum, options: [STANdard, HISTONLY, MINmax, ABSolute], default: STANdard, each: {n: {first: 1, last: 5}}, label: "通用顶底方式 {n}", label_en: "General top-base method {n}"}
  measure.thr.rfall{n}.upper: {type: float, min: -24.8, max: 125.0, default: 90.0, each: {n: {first: 1, last: 5}}, label: "上升下降上阈值 % {n}", label_en: "Rise/fall upper % {n}"}
  measure.thr.rfall{n}.middle: {type: float, min: -24.9, max: 124.9, default: 50.0, each: {n: {first: 1, last: 5}}, label: "上升下降中阈值 % {n}", label_en: "Rise/fall middle % {n}"}
