  - {header: ":SYSTem:MODE", state: system.mode}
  - header: ":SYSTem:PERSona"
    params:
      - name: manufacturer
        type: string
        state: system.persona_manufacturer
        keywords: {DEF: {system.persona_manufacturer: "Keysight Technologies", system.persona_model: "UXR1104B"}}
      - {name: model, type: string, optional: true, state: system.persona_model}
  # :SYSTem:CAPability:*?（手册第 37 章）：数据手册 3123-1313 的能力，带引号的字符串。UXR1104B 没有半通道模式与
  # 数字通道；存储深度标配 500 Mpts，选件 01G / 02G 为 1 / 2 Gpts（仿真的记录至多 10 Mpts，覆盖表注明）。
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, when: {what: HALFchannel}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"0"'}
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, option: 02G, when: {what: MEMory}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"2000000000"'}
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, option: 01G, when: {what: MEMory}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"1000000000"'}
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, when: {what: MEMory}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"500000000"'}
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, when: {what: SRATe}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"256000000000"'}
  - {header: ":SYSTem:CAPability:ACQuire", op: sys.none, set: false, when: {what: BANDwidth}, params: [{name: what, type: enum, options: [HALFchannel, MEMory, SRATe, BANDwidth]}], reply: '"110000000000"'}
  - {header: ":SYSTem:CAPability:CHANnel", op: sys.none, set: false, when: {what: COUNt}, params: [{name: what, type: enum, options: [COUNt]}], reply: '"4"'}
  - {header: ":SYSTem:CAPability:DIGital", op: sys.none, set: false, when: {what: MEMory}, params: [{name: what, type: enum, options: [MEMory, SRATe, CHANnels]}], reply: '"0"'}
  - {header: ":SYSTem:CAPability:DIGital", op: sys.none, set: false, when: {what: SRATe}, params: [{name: what, type: enum, options: [MEMory, SRATe, CHANnels]}], reply: '"0"'}
  - {header: ":SYSTem:CAPability:DIGital", op: sys.none, set: false, when: {what: CHANnels}, params: [{name: what, type: enum, options: [MEMory, SRATe, CHANnels]}], reply: '"0"'}
