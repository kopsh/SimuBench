- section: Chapter 3 Measurements > CONFigure and MEASure
  commands:
  - header: :CONFigure:FREQuency
    level: implemented
    note: 选择频率测量，保存预期值与分辨率，并把触发（立即/1 次/1 读数）与门控（TIME/0.1 s）置为手册默认；分辨率到门时间的换算未建模。
  - header: :MEASure:FREQuency
    level: implemented
    note: 在指定通道（默认 (@1)）立即测一次频率，门时间计入虚拟时间；通道由测量核心选择。预期值与分辨率按范围接受，不改变门时间（分辨率到门时间的换算未建模）。读数按定义的 15 位有效数字格式（定义的 readings 取 format，#366）。
  - header: :CONFigure:PERiod
    level: implemented
    note: 选择周期测量，保存预期值与分辨率，触发与门控置为手册默认；分辨率到门时间的换算未建模。
