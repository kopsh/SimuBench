- section: Chapter 3 Measurements > Reference Oscillator Configuration
  commands:
  - header: '[:SENSe]:ROSCillator:SOURce'
    level: implemented
    note: 内部 10 MHz 或外部参考；外部参考无效时 reference_clock 回落到内部（手册：EXT 需在 Ext Ref In 上有 1/5/10 MHz 信号）。
  - header: '[:SENSe]:ROSCillator:SOURce:AUTO'
    level: accepted
    affects_data: false
    note: 自动选择标志保存并回读；仿真按显式 source 选择，EXT 下按参考信号是否有效自动回落（与手册的 AUTO 行为一致）。
  - header: '[:SENSe]:ROSCillator:EXTernal:FREQuency'
    level: implemented
    note: 外部参考频率 1/5/10 MHz，默认 10 MHz；状态范围校验 1–10 MHz，其它值按 -222 拒绝。
  - header: '[:SENSe]:ROSCillator:EXTernal:CHECk'
    level: not_modeled
    note: 外部参考检测未建模；SOURce EXT 下 reference_clock 自行判断参考是否有效并回落。
    gap: model_work
  - header: '[:SENSe]:ROSCillator:INTernal:POWer:STANdby'
    level: accepted
    affects_data: false
    note: Option 010 保持加温标志保存并回读；温度与稳定度未建模。
