# Keysight 53220A 的覆盖表：命令按 53220A/53230A User's Guide（53220-90001，Edition 4，
# April 2023）第 3–8 章与命令索引逐条列出；程度与说明手写。手册没有单独的 Programmer's Reference
# 章节，未在正文给出语法的命令不收。首波实现频率/周期/门控累加/两通道时间间隔、输入调理、
# 时基、触发与统计；53230A 独有功能与其余命令标未实现。
# 抖动（#744/#861）：每个事件时刻带正态误差 = 通道触发误差（1 ns，模型值，手册无该指标）⊕ 内插器单次分辨率
# 100 ps（Table 5-2 的 Tss）；时间间隔读数约按 √2 倍扩散，同种子逐位复现。
schema: simubench.coverage/1
model: keysight-53220a
sections:
- section: IEEE 488.2 Common Commands
  commands:
  - header: '*IDN'
    level: implemented
    note: 按手册的四字段格式返回厂商、型号、序列号与固件；手册没有示例，序列号与固件串按 S1 回填待真机核对。
  - header: '*RST'
    level: implemented
    note: 上电默认值：频率、0.1 s 门时间、TIME 门控源、立即触发/1 次/1 读数、AC 耦合、1 MΩ、0 V 阈值；统计与运算关闭。
  - header: '*CLS'
    level: implemented
    note: 清除错误队列、标准事件寄存器与状态字节（第 8 章）。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器；查询返回十进制加权和。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器；读后清零。
  - header: '*OPC'
    level: implemented
    note: 操作完成位；查询等待未完成的测量（虚拟时间按门时间推进）。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器；查询返回十进制加权和。
  - header: '*STB'
    level: implemented
    note: 状态字节；错误队列与测量完成状态位。
  - header: '*TRG'
    level: implemented
    note: 总线触发：TRIGger:SOURce BUS 时接受一次触发，取 SAMPle:COUNt 个读数。
  - header: '*TST'
    level: implemented
    note: 自检通过返回 0。
  - header: '*WAI'
    level: implemented
    note: 等待本次触发/测量完成。
  - header: '*SAV'
    level: not_modeled
    note: 仪器状态存储（位置 0–4）未建模；不写文件系统。
    gap: blocked
    blocked_by: setup-memory
  - header: '*RCL'
    level: not_modeled
    note: 仪器状态调用未建模。
    gap: blocked
    blocked_by: setup-memory
- section: Chapter 1 Preparation for Use > Utility Functions (system settings)
  commands:
  - header: :SYSTem:ERRor[:NEXT]
    level: implemented
    note: 错误队列的下一条；空队列返回 +0,"No error"；队列长度 20，满后最后一条为 -350。
  - header: :SYSTem:DATE
    level: implemented
    note: 实时时钟日期 yyyy,mm,dd（IEEE 488.2；按会话日历）。
  - header: :SYSTem:TIME
    level: implemented
    note: 实时时钟时间 hh,mm,ss.sss；短格式 SYST:TIM 与 TIMeout 的短格式相同，定义按长格式区分。
  - header: :SYSTem:PRESet
    level: implemented
    note: 与 *RST 相同的仪器预置。
  - header: :SYSTem:TIMeout
    level: accepted
    affects_data: false
    note: 测量超时 10 ms–2000 s，默认 1 s；仿真中的测量按门时间完成，不会超时。
  - header: :SYSTem:ALEVel:FREQuency
    level: accepted
    affects_data: false
    note: 自动电平的最低频率 50 Hz–10 kHz，默认 50 Hz；自动电平本身未建模。
  - header: :SYSTem:LANGuage
    level: accepted
    affects_data: false
    note: 只接受 53220A/53230A；53132A 仿真模式未建模，设定按 -224 拒绝。
  - header: :SYSTem:BATTery:ENABle
    level: accepted
