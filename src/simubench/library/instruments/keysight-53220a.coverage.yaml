- section: Chapter 5 Triggering and Gating
  commands:
  - header: :ABORt
    level: implemented
    note: 中止测量，已取读数保留。
  - header: :INITiate[:IMMediate]
    level: implemented
    note: 进入等待触发状态并清空上次运行的读数；立即触发时开始测量。
  - header: :FETCh
    level: implemented
    note: 等待本次运行完成后给出全部读数；无读数时按手册报 -230。
  - header: :READ
    level: implemented
    note: INITiate + FETCh?；总线或外部触发时报 -214（触发死锁）。
  - header: :TRIGger:SOURce
    level: implemented
    note: IMMediate/EXTernal/BUS，默认 IMMediate；外部触发（Trig In）未接线，只实现总线触发。
  - header: :TRIGger:SLOPe
    level: not_modeled
    note: 外部触发沿未建模（Trig In 不产生触发）。
    gap: blocked
    blocked_by: counter-measurements
  - header: :TRIGger:DELay
    level: implemented
    note: 触发到第一次测量的延迟 0–10000 s，默认 0；计入虚拟时间。
  - header: :TRIGger:COUNt
    level: implemented
    note: 触发次数 1–1,000,000，默认 1。
  - header: :SAMPle:COUNt
    level: implemented
    note: 每次触发的读数 1–1,000,000，默认 1。
  - header: '[:SENSe]:FREQuency:GATE:SOURce'
    level: implemented
    note: TIME 或 EXTernal，默认 TIME；EXTernal 表示由触发模型开始这一轮，门长仍由门时间给出（component-map 的模型边界）。
  - header: '[:SENSe]:FREQuency:GATE:TIME'
    level: implemented
    note: 频率测量的门时间 100 µs–1000 s，默认 0.1 s；真实门长按 1/(1+时基误差) 计入虚拟时间。
  - header: '[:SENSe]:FREQuency:GATE:POLarity'
