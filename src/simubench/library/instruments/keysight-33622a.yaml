schema: simubench.instrument/1
id: keysight-33622a
manufacturer: Keysight Technologies
model: 33622A
class: function_generator
version: 1
description: >-
  Keysight 33622A Trueform 双通道函数/任意波发生器（120 MHz）。真实型号（D42）：命令、参数、默认值与回复按
  Keysight Trueform Series Operating and Service Guide（33500-90901）核对。每个通道：标准波形（正弦、方波、
  三角/斜波、脉冲、DC）、任意波（易失存储按名装载，#426）、PRBS、高/低电平（#424）、VPP/VRMS/DBM、
  输出负载与极性、AM/FM/PM/FSK/PWM 调制（awg_modulator，同一时刻只开一种）；输出阻抗 50 Ω。
reference:
  title: Keysight Trueform Series Operating and Service Guide
  document: 33500-90901
  version: "© 2013–2015（手册未印版次）"
  firmware: "*IDN? 按手册示例的修订串格式（示例为 33522B）"
identity:
  idn: "Keysight Technologies,33622A,{serial},{firmware}"
  serial: "MY12345678"
  firmware: "0.179-1.19-8.88-52-00"
format:
  number: nr3
  digits: 15
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  error_code: signed
builtins: ["*IDN", "*RST", "*CLS", "*ESE", "*ESR", "*OPC", "*SRE", "*STB", "*TST", "*WAI", ":SYSTem:ERRor[:NEXT]"]
error_queue: 20
errors:
  0: "No error"
  -100: "Command error"
  -101: "Invalid character"
  -102: "Syntax error"
  -103: "Invalid separator"
  -104: "Data type error"
  -105: "GET not allowed"
  -108: "Parameter not allowed"
  -109: "Missing parameter"
  -110: "Command header error"
  -111: "Header separator error"
  -112: "Program mnemonic too long"
  -113: "Undefined header"
  -114: "Header suffix out of range"
  -120: "Numeric data error"
  -121: "Invalid character in number"
  -123: "Numeric overflow"
  -124: "Too many digits"
  -128: "Numeric data not allowed"
  -130: "Suffix error"
  -131: "Invalid suffix"
  -134: "Suffix too long"
  -138: "Suffix not allowed"
  -140: "Character data error"
  -141: "Invalid character data"
  -144: "Character data too long"
  -148: "Character data not allowed"
  -150: "String data error"
  -151: "Invalid string data"
  -158: "String data not allowed"
  -160: "Block data error"
  -161: "Invalid block data"
  -168: "Block data not allowed"
  -170: "Expression error"
  -171: "Invalid expression"
  -178: "Expression data not allowed"
  -200: "Execution error"
  -211: "Trigger ignored"
  -213: "INIT ignored"
  -214: "Trigger deadlock"
  -220: "Parameter error"
  -221: "Settings conflict"
  -222: "Data out of range"
  -223: "Too much data"
  -224: "Illegal parameter value"
  -225: "Out of memory"
  -230: "Data stale"
  -231: "Data questionable"
  -240: "Hardware error"
  -241: "Hardware missing"
  -260: "Expression error"
  -261: "Math error in expression"
  -300: "Device-specific error"
  -310: "System error"
  -350: "Error queue overflow"
  -400: "Query error"
  -410: "Query INTERRUPTED"
  -420: "Query UNTERMINATED"
  -430: "Query DEADLOCKED"
  -440: "Query UNTERMINATED after indefinite response"
  786: "Specified arb waveform already exists"
  -250: "Mass storage error"
  -254: "Media full"
  -256: "File or folder name not found"
  -257: "File name error"
  291: "Not able to recall state: it is empty"
  292: "State file size error"
specs:
  source: 第 1 章 Models and Options（最高频率表）、APPLy 子系统（幅度/偏置/采样率范围）、Factory Reset State
  frequency_hz: "正弦 1 µHz–120 MHz（10 Vpp 以下到 60 MHz、4 Vpp 以下到 120 MHz，按幅度的上限未建模）；方波/脉冲到 100 MHz；三角/斜波 800 kHz（按波形限制，#437）"
  amplitude: "1 mVpp–10 Vpp（50 Ω），2 mVpp–20 Vpp（开路）"
  offset: "±5 V（50 Ω）、±10 V（开路）；|偏置| + Vpp/2 的峰值限制未建模"
  arb: "易失存储每通道按名装载，8 点起；采样率 1 µSa/s–1 GSa/s；*RST 40 kSa/s"
  prbs: "PN7/PN9/PN11/PN15（PN20/PN23 未建模）；比特率到 200 Mbps"
  output_impedance_ohm: 50
state:
  display.state: {type: bool, default: true, label: 显示, label_en: Display}
  display.text: {type: string, default: "", label: 显示文本, label_en: Display text}
  system.version: {type: string, default: "1994.0", label: SCPI 版本, label_en: SCPI version}
  memory.recall_auto: {type: bool, default: false, label: 上电调回, label_en: Power-on recall}
channels:
  count: 2
channel_state:
  function:
    type: enum
    options: [SINusoid, SQUare, TRIangle, RAMP, PULSe, PRBS, NOISe, DC, ARB]
    default: SINusoid
    not_modeled: {NOISe: gaussian noise is not modeled}
    label: 波形
    label_en: Function
  frequency: {type: float, unit: HZ, min: 1.0e-6, max: 1.2e8, default: 1000.0, label: 频率, label_en: Frequency}
  amplitude: {type: float, min: -100.0, max: 40.0, default: 0.1, label: 幅度, label_en: Amplitude}
  unit: {type: enum, options: [VPP, VRMS, DBM], default: VPP, label: 幅度单位, label_en: Voltage unit}
  offset: {type: float, unit: V, min: -10.0, max: 10.0, default: 0.0, label: 偏置, label_en: Offset}
  output: {type: bool, default: false, electrical: true, label: 输出, label_en: Output}
  load:
    type: float
    unit: OHM
    min: 1.0
    max: 10000.0
    default: 50.0
    special: {INF: .inf, INFinity: .inf}
    label: 输出负载设定
    label_en: Output load
  polarity: {type: enum, options: [NORMal, INVerted], default: NORMal, label: 极性, label_en: Polarity}
  sq_duty: {type: float, min: 0.01, max: 99.99, default: 50.0, display_unit: "%", label: 方波占空比, label_en: Square duty cycle}
  pulse_duty: {type: float, min: 0.01, max: 99.99, default: 10.0, display_unit: "%", label: 脉冲占空比, label_en: Pulse duty cycle}
  # 脉冲边沿时间（10–90 %）：33600 系列 2.9 ns（4 Vpp 以下）至 1 µs，默认 10 ns（Edge Times，#437）。
  pulse_lead: {type: float, unit: S, min: 2.9e-9, max: 1.0e-6, default: 1.0e-8, label: 脉冲前沿时间, label_en: Pulse leading edge}
  pulse_trail: {type: float, unit: S, min: 2.9e-9, max: 1.0e-6, default: 1.0e-8, label: 脉冲后沿时间, label_en: Pulse trailing edge}
  ramp_symm: {type: float, min: 0.0, max: 100.0, default: 100.0, display_unit: "%", label: 斜波对称度, label_en: Ramp symmetry}
  srate: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e9, default: 40000.0, label: 任意波采样率, label_en: Arb sample rate}
  prbs_data:
    type: enum
    options: [PN7, PN9, PN11, PN15, PN20, PN23]
    default: PN7
    not_modeled: {PN20: only PN7-PN15 are modeled, PN23: only PN7-PN15 are modeled}
    label: PRBS 序列
    label_en: PRBS sequence
  prbs_rate: {type: float, unit: HZ, min: 1.0e-3, max: 2.0e8, default: 1000.0, label: PRBS 比特率, label_en: PRBS bit rate}
  # 调制（awg_modulator，#327）：每种一个开关，同一时刻只开一种（开一种时关其余，手册各 :STATe 条目）。
  am_state: {type: bool, default: false, label: AM, label_en: AM}
  am_depth: {type: float, min: 0.0, max: 120.0, default: 100.0, display_unit: "%", label: AM 深度, label_en: AM depth}
  am_freq: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e6, default: 100.0, label: AM 调制频率, label_en: AM rate}
  fm_state: {type: bool, default: false, label: FM, label_en: FM}
  fm_dev: {type: float, unit: HZ, min: 1.0e-6, max: 6.0e7, default: 100.0, label: FM 频偏, label_en: FM deviation}
  fm_freq: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e6, default: 10.0, label: FM 调制频率, label_en: FM rate}
  pm_state: {type: bool, default: false, label: PM, label_en: PM}
  pm_dev: {type: float, unit: DEG, min: 0.0, max: 360.0, default: 180.0, label: PM 相偏, label_en: PM deviation}
  pm_freq: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e6, default: 10.0, label: PM 调制频率, label_en: PM rate}
  fsk_state: {type: bool, default: false, label: FSK, label_en: FSK}
  fsk_freq: {type: float, unit: HZ, min: 1.0e-6, max: 1.2e8, default: 100.0, label: FSK 跳频, label_en: FSK hop frequency}
  fsk_rate: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e6, default: 10.0, label: FSK 速率, label_en: FSK rate}
  pwm_state: {type: bool, default: false, label: PWM, label_en: PWM}
  pwm_dev: {type: float, min: 0.0, max: 50.0, default: 1.0, display_unit: "%", label: PWM 占空比偏差, label_en: PWM duty deviation}
  pwm_freq: {type: float, unit: HZ, min: 1.0e-6, max: 1.0e6, default: 10.0, label: PWM 调制频率, label_en: PWM rate}
components:
  # 内部 10 MHz 参考（ROSCillator 的外部参考与选择未建模）：合成的频率误差由它给出（个体偏差为 0 ppm）。
  - name: clock
    type: reference_clock
    params: {source: INTernal}
  # 大容量存储（MMEMory，#1069）：内部闪存 INT:\ 与前面板 USB:\，各为本机一个文件夹；*RST 后当前文件夹回到 INT:\。
  - name: storage
    type: file_system
    params:
      drives: [INTernal, USB]
      home: "INT:\\"
      capacity: 1.0e9
      file_types: {.sta: STAT, .csv: ASC}
  # 状态存取（#1070）：*SAV/*RCL 0–4 存为 INT:\Settings\STATE_n.STA（手册 Instrument State Storage），
  # MMEMory:STORe/LOAD:STATe 存取任意名的 .sta；*RST 不影响已存状态。上电调回不建模（只保存设置）。
  - name: setups
    type: setup_memory
    params:
      storage: storage
      registers: 5
      first: 0
      register_file: "INT:\\Settings\\STATE_{n}.STA"
      names: [AUTO_RECALL, STATE_1, STATE_2, STATE_3, STATE_4]
      extension: .sta
      exclude: [memory.*]
      empty_error: 291
      bad_setup: 292
channel_components:
  # 合成（1 Vpp）→ 调制 → 幅度与偏置（按负载设定，D13）→ 输出级（50 Ω，极性）。任意波与 PRBS 由合成按函数播放（#426）。
  - name: synth
    type: waveform_synth
    params:
      function: $ch.function
      frequency: $ch.frequency
      duty: {from: $ch.function, map: {SQUare: $ch.sq_duty, PULSe: $ch.pulse_duty}, default: 50.0}
      symmetry: $ch.ramp_symm
      bandwidth: 1.2e8
      # 最高频率按波形（33500-90901 第 1 章 Models and Options，33622A：正弦 120 MHz（4 Vpp 以下）、
      # 方波/脉冲 100 MHz（4 Vpp 以下）、斜波/三角 800 kHz，#437）；按幅度的分档未建模。
      max_frequency: {SINusoid: 1.2e8, SQUare: 1.0e8, PULSe: 1.0e8, RAMP: 8.0e5, TRIangle: 8.0e5}
      lead_time: $ch.pulse_lead
      trail_time: $ch.pulse_trail
      # 最小脉宽：33500-90901「Duty Cycle Limitations」——33600 为 5 ns（≤4 Vpp）/ 8 ns（≤10 Vpp）；
      # 按幅度的分档未建模，取 4 Vpp 以下的 5 ns（#504）。
      min_width: 5.0e-9
      arb: arb
      prbs: bits
      clock: clock
  - name: arb
    type: arb_table
    params:
      rate: $ch.srate
      scale: 0.5
      min_points: 8
      max_points: 1000000
      # <arb_name>：不带引号、至多 12 个字符；已载入的名字再载入报 +786（33500-90901 DATA:ARBitrary，#430）。
      # 首字符为字母、只含字母数字下划线的规则见于 33200 系列，Trueform 手册未写，不检查。
      max_name: 12
      exists_error: 786
  - name: bits
    type: prbs_source
    params:
      order: {from: $ch.prbs_data, map: {PN7: 7, PN9: 9, PN11: 11, PN15: 15}, default: 7}
      rate: $ch.prbs_rate
      level: 0.5
  - name: mod
    type: awg_modulator
    params:
      enabled: {from: $ch.am_state, map: {'False': {from: $ch.fm_state, map: {'False': {from: $ch.pm_state, map: {'False': {from: $ch.fsk_state, map: {'False': {from: $ch.pwm_state, map: {'False': false, 'True': true}}, 'True': true}}, 'True': true}}, 'True': true}}, 'True': true}}
      type: {from: $ch.am_state, map: {'False': {from: $ch.fm_state, map: {'False': {from: $ch.pm_state, map: {'False': {from: $ch.fsk_state, map: {'False': PWM, 'True': FSK}}, 'True': PM}}, 'True': FM}}, 'True': AM}}
      int_rate: {from: $ch.am_state, map: {'False': {from: $ch.fm_state, map: {'False': {from: $ch.pm_state, map: {'False': {from: $ch.pwm_state, map: {'False': $ch.am_freq, 'True': $ch.pwm_freq}}, 'True': $ch.pm_freq}}, 'True': $ch.fm_freq}}, 'True': $ch.am_freq}}
      am_depth: $ch.am_depth
      fm_dev: $ch.fm_dev
      pm_dev: $ch.pm_dev
      fsk_hop: $ch.fsk_freq
      fsk_rate: $ch.fsk_rate
      pwm_dev: $ch.pwm_dev
      synth: synth
  - name: level
    type: amplitude_level
    params:
      amplitude: $ch.amplitude
      unit: $ch.unit
      offset: $ch.offset
      load_setting: $ch.load
      vpp_min: 0.001
      # 10 Vpp 进 50 Ω（开路 20 Vpp）；有限负载按 10 Vpp 处理（模型值）。
      vpp_max: {from: $ch.load, table: {0: 10.0, 1000000: 20.0}}
      # 改负载设定时保持实际输出电压，回读的幅度与偏置按比例换算（33500-90901 Output Termination：
      # “does not affect the actual output voltage; it only changes the values displayed and queried”，#436）。
      load_change: output
  - name: out
    type: output_stage
    params:
      z_out: 50.0
      enabled: $ch.output
      invert: {from: $ch.polarity, map: {NORMal: false, INVerted: true}}
wiring:
  channel:
    - [synth.out, mod.in]
    - [mod.out, level.in]
    - [level.out, out.in]
ports:
  channel:
    "CH{n}": out.pin
display:
  template: function_generator
  channel_summary: [function, frequency, amplitude, offset, output, load]
capabilities: [function_generator]
commands:
  # ---- APPLy：一条命令配置波形，打开输出、关闭调制（APPLy 子系统）------------------------------
  - header: "[:SOURce<ch>]:APPLy"
    state: ch.function
    set: false
    reply: '"{value} {ch.frequency},{ch.amplitude},{ch.offset}"'
  - header: "[:SOURce<ch>]:APPLy:SINusoid"
    query: false
    writes: {ch.function: SINusoid, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:SQUare"
    query: false
    writes: {ch.function: SQUare, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:TRIangle"
    query: false
    writes: {ch.function: TRIangle, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:RAMP"
    query: false
    writes: {ch.function: RAMP, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:PULSe"
    query: false
    writes: {ch.function: PULSe, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:DC"
    query: false
    writes: {ch.function: DC, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.frequency, keywords: {DEF: {ch.frequency: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:PRBS"
    query: false
    writes: {ch.function: PRBS, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.prbs_rate, keywords: {DEF: {ch.prbs_rate: 1000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  - header: "[:SOURce<ch>]:APPLy:ARBitrary"
    query: false
    writes: {ch.function: ARB, ch.output: true, ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params:
      - {name: first, type: float, unit: HZ, optional: true, state: ch.srate, keywords: {DEF: {ch.srate: 40000.0}}}
      - {name: amplitude, type: float, optional: true, state: ch.amplitude, keywords: {DEF: {ch.amplitude: 0.1}}}
      - {name: offset, type: float, unit: V, optional: true, state: ch.offset, keywords: {DEF: {ch.offset: 0.0}}}
  # ---- 波形与频率（FUNCtion、FREQuency）------------------------------------------------
  - header: "[:SOURce<ch>]:FUNCtion"
    state: ch.function
  - header: "[:SOURce<ch>]:FREQuency"
    state: ch.frequency
  - header: "[:SOURce<ch>]:FUNCtion:SQUare:DCYCle"
    state: ch.sq_duty
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:DCYCle"
    state: ch.pulse_duty
  # 脉冲宽度与周期（#437）：宽度 = 占空比 × 周期，写宽度即改脉冲占空比；周期即 1/频率。
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:WIDTh"
    op: ch.synth.pulse_width
    args: {target: ch.pulse_duty}
    # a string: the op itself parses the number and resolves the MIN/MAX/DEF words (#478)
    params: [{name: value, type: string, optional: true}]
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:PERiod"
    op: ch.synth.pulse_period
    params: [{name: value, type: string, optional: true}]  # the op parses numbers and words (#478)
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:TRANsition:LEADing"
    state: ch.pulse_lead
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:TRANsition:TRAiling"
    state: ch.pulse_trail
  - header: "[:SOURce<ch>]:FUNCtion:PULSe:TRANsition[:BOTH]"
    op: ch.synth.pulse_edges
    params: [{name: value, type: string, optional: true}]  # the op parses numbers and words (#478)
  - header: "[:SOURce<ch>]:FUNCtion:RAMP:SYMMetry"
    state: ch.ramp_symm
  - header: "[:SOURce<ch>]:FUNCtion:PRBS:BRATe"
    state: ch.prbs_rate
  - header: "[:SOURce<ch>]:FUNCtion:PRBS:DATA"
    state: ch.prbs_data
  # ---- 任意波（#426）：易失存储按名装载、选择、采样率 ------------------------------------
  - header: "[:SOURce<ch>]:DATA:ARBitrary"
    op: ch.arb.load
    query: false
    params:
      - {name: name, type: string}
      - {name: values, type: float_list}
  - header: "[:SOURce<ch>]:DATA:ARBitrary:DAC"
    op: ch.arb.load_dac
    query: false
    params:
      - {name: name, type: string}
      - {name: values, type: float_list}
  - header: "[:SOURce<ch>]:DATA:VOLatile:CATalog"
    op: ch.arb.catalog
    set: false
  - header: "[:SOURce<ch>]:DATA:VOLatile:CLEar"
    op: ch.arb.clear
    query: false
  - header: "[:SOURce<ch>]:FUNCtion:ARBitrary"
    op: ch.arb.select
    params: [{name: name, type: string, optional: true}]
  - header: "[:SOURce<ch>]:FUNCtion:ARBitrary:SRATe"
    state: ch.srate
  - header: "[:SOURce<ch>]:FUNCtion:ARBitrary:POINts"
    op: ch.arb.points
    set: false
  # ---- 幅度、偏置、高/低电平与单位（VOLTage）------------------------------------------------
  - header: "[:SOURce<ch>]:VOLTage"
    state: ch.amplitude
  - header: "[:SOURce<ch>]:VOLTage:OFFSet"
    state: ch.offset
  - header: "[:SOURce<ch>]:VOLTage:HIGH"
    op: ch.level.high
    params: [{name: value, type: float, unit: V, optional: true}]
  - header: "[:SOURce<ch>]:VOLTage:LOW"
    op: ch.level.low
    params: [{name: value, type: float, unit: V, optional: true}]
  - header: "[:SOURce<ch>]:VOLTage:UNIT"
    state: ch.unit
  # ---- 输出（OUTPut）----------------------------------------------------------------------
  - header: ":OUTPut<ch>"
    state: ch.output
    dangerous: true
  - header: ":OUTPut<ch>:LOAD"
    state: ch.load
  - header: ":OUTPut<ch>:POLarity"
    state: ch.polarity
  # ---- 调制：开一种时关其余（各 :STATe 条目）---------------------------------------------
  - header: "[:SOURce<ch>]:AM:STATe"
    writes: {ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params: [{name: state, type: bool, state: ch.am_state}]
  - header: "[:SOURce<ch>]:AM[:DEPTh]"
    state: ch.am_depth
  - header: "[:SOURce<ch>]:AM:INTernal:FREQuency"
    state: ch.am_freq
  - header: "[:SOURce<ch>]:FM:STATe"
    writes: {ch.am_state: false, ch.pm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params: [{name: state, type: bool, state: ch.fm_state}]
  - header: "[:SOURce<ch>]:FM[:DEViation]"
    state: ch.fm_dev
  - header: "[:SOURce<ch>]:FM:INTernal:FREQuency"
    state: ch.fm_freq
  - header: "[:SOURce<ch>]:PM:STATe"
    writes: {ch.am_state: false, ch.fm_state: false, ch.fsk_state: false, ch.pwm_state: false}
    params: [{name: state, type: bool, state: ch.pm_state}]
  - header: "[:SOURce<ch>]:PM:DEViation"
    state: ch.pm_dev
  - header: "[:SOURce<ch>]:PM:INTernal:FREQuency"
    state: ch.pm_freq
  - header: "[:SOURce<ch>]:FSKey:STATe"
    writes: {ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.pwm_state: false}
    params: [{name: state, type: bool, state: ch.fsk_state}]
  - header: "[:SOURce<ch>]:FSKey:FREQuency"
    state: ch.fsk_freq
  - header: "[:SOURce<ch>]:FSKey:INTernal:RATE"
    state: ch.fsk_rate
  - header: "[:SOURce<ch>]:PWM:STATe"
    writes: {ch.am_state: false, ch.fm_state: false, ch.pm_state: false, ch.fsk_state: false}
    params: [{name: state, type: bool, state: ch.pwm_state}]
  - header: "[:SOURce<ch>]:PWM:DEViation:DCYCle"
    state: ch.pwm_dev
  - header: "[:SOURce<ch>]:PWM:INTernal:FREQuency"
    state: ch.pwm_freq
  # ---- 显示与版本（接受：保存并回读，不影响输出）-----------------------------------------------
  - header: "DISPlay[:STATe]"
    state: display.state
  - header: "DISPlay:TEXT"
    state: display.text
  - header: "DISPlay:TEXT:CLEar"
    state: display.text
    set_value: ""
    query: false
  - header: ":SYSTem:VERSion"
    state: system.version
    set: false
    reply: "1994.0"
  # ---- 大容量存储（MMEMory，#1069）：目录、复制移动删除、上传下载 -----------------------------------
  - header: "MMEMory:CATalog[:ALL]"
    op: storage.catalog
    set: false
    params: [{name: name, type: string, optional: true}]
  - header: "MMEMory:CATalog:DATA:ARBitrary"
    op: storage.catalog
    set: false
    args: {extensions: [.arb, .barb, .seq], types: {.arb: ARB, .barb: ARB, .seq: SEQUENCE}}
    params: [{name: name, type: string, optional: true}]
  - header: "MMEMory:CATalog:STATe"
    op: storage.catalog
    set: false
    args: {extensions: [.sta], folders: false}
    params: [{name: name, type: string, optional: true}]
  - header: "MMEMory:CDIRectory"
    op: storage.folder
    params: [{name: name, type: string, optional: true}]
  - header: "MMEMory:MDIRectory"
    op: storage.make_folder
    query: false
    params: [{name: name, type: string}]
  - header: "MMEMory:RDIRectory"
    op: storage.remove_folder
    query: false
    params: [{name: name, type: string}]
  - header: "MMEMory:DELete"
    op: storage.delete
    query: false
    params: [{name: name, type: string}]
  - header: "MMEMory:COPY"
    op: storage.copy
    query: false
    params: [{name: source, type: string}, {name: target, type: string}]
  - header: "MMEMory:MOVE"
    op: storage.move
    query: false
    params: [{name: source, type: string}, {name: target, type: string}]
  - header: "MMEMory:DOWNload:FNAMe"
    op: storage.download_name
    query: false
    params: [{name: name, type: string}]
  - header: "MMEMory:DOWNload:DATA"
    op: storage.download
    query: false
    params: [{name: data, type: block}]
  - header: "MMEMory:UPLoad"
    op: storage.read
    set: false
    params: [{name: name, type: string}]
  - header: "MMEMory:STORe:STATe"
    op: setups.store_file
    query: false
    params: [{name: name, type: string}]
  - header: "MMEMory:LOAD:STATe"
    op: setups.load_file
    query: false
    params: [{name: name, type: string}]
  # ---- 状态存取（*SAV/*RCL 与 MEMory，#1070）------------------------------------------------------
  - header: "*SAV"
    op: setups.save
    query: false
    params: [{name: register, type: int, min: 0, max: 4}]
  - header: "*RCL"
    op: setups.recall
    query: false
    params: [{name: register, type: int, min: 0, max: 4}]
  - header: "MEMory:NSTates"
    op: setups.count
    set: false
    reply: "+{value}"
  - header: "MEMory:STATe:CATalog"
    op: setups.catalog
    set: false
  - header: "MEMory:STATe:DELete"
    op: setups.delete
    query: false
    params: [{name: register, type: int, min: 0, max: 4}]
  - header: "MEMory:STATe:NAME"
    op: setups.name
    params: [{name: register, type: int, min: 0, max: 4}, {name: name, type: string, optional: true}]
  - header: "MEMory:STATe:VALid"
    op: setups.valid
    set: false
    params: [{name: register, type: int, min: 0, max: 4}]
  - header: "MEMory:STATe:RECall:AUTO"
    state: memory.recall_auto
