  - header: :TRIGger:FORCe
    level: implemented
    note: Takes one acquisition without waiting for the trigger.
  - header: :TRIGger:HIGH
    level: accepted
    note: 'Saved and read back (ON at power-on: the guide says it turns on with rising or falling edge triggers).
      The simulated trigger path (#1263) taps the analog front end, so its bandwidth is the acquisition''s analog
      bandwidth, as the data sheet (3123-1313, Trigger System) gives the edge trigger''s; neither document gives
      a bandwidth for OFF, so OFF does not narrow it and the setting changes nothing. The longer Trig Out delay
      is not modeled.'
    affects_data: false
  - header: :TRIGger:HOLDoff
    level: implemented
    note: 100 ns to 10 s (the guide); fixed mode only. 100 ns after a default setup is a SimuBench value
  - header: :TRIGger:HOLDoff:MAX
    level: accepted
    note: 100 ns to 10 s (the holdoff range); used only in RANDom mode, which is not modeled.
    affects_data: false
  - header: :TRIGger:HOLDoff:MIN
    level: accepted
    note: 100 ns to 10 s (the holdoff range); used only in RANDom mode, which is not modeled.
    affects_data: false
  - header: :TRIGger:HOLDoff:MODE
    level: implemented
    note: FIXed (the :TRIGger:HOLDoff time); RANDom (a random holdoff between MIN and MAX) is not modeled (-224).
  - header: :TRIGger:HTHReshold
    level: accepted
    note: Per source CHANnel1-4 and AUXiliary, saved and read back; the triggers that use the thresholds (runt,
      transition, setup and hold, ...) are not modeled.
    affects_data: false
  - header: :TRIGger:HYSTeresis
    level: implemented
    note: 'NORMal: half a division (the data sheet''s 1 div p-p sensitivity); NREJect: one division (the noise reject
      band); HSENsitivity: a quarter division. The NREJect and HSENsitivity figures are SimuBench values, the guide
      gives none. The trigger compares the analog signal at the ADC''s input (not through :ACQuire:BANDwidth or InfiniiSim, which are DSP after the ADC) with its own noise, the channel''s per-division noise table (an estimate: the data sheet gives no trigger noise; its 71 fs display jitter on a 55 GHz, 500 mVpp sine at 100 mV/div is 6.1 mV over the edge''s slope, the table''s 100 mV/div value). Near the band, the noise decides whether an edge counts: a sine just inside the normal band triggers on its noise, NREJect''s does not (#1263)'
  - header: :TRIGger:LEVel
    level: implemented
    note: one level per source (CHANnel<N>, AUX); the query takes the source too. Channel levels within ±4 divisions
      of the screen centre take effect, AUX ±5 V (data sheet)
  - header: :TRIGger:LEVel:FIFTy
    level: implemented
    note: 'The level of the trigger''s current source (edge, glitch or pulse width) to 50 % of its waveform: halfway
      between top and base of the channel''s record.'
  - header: :TRIGger:LTHReshold
