# Generated from the table of contents of the Infiniium UXR-Series Programmer's Guide 11.80.00012 (9018-07723); levels and notes by hand.
# UXR1104B (#1092): the UXR0334B's command set and levels; the model-specific notes (bandwidth, sample rate,
# scale and offset ranges, noise, default setup, identity) follow the 1 mm input columns of data sheet 3123-1313.
# 噪声与抖动（#744/#774/#786/#859）：每档通道噪声取数据手册 3123-1313 的值（specs.noise_per_division）；触发抖动取
# 数据手册的 25 fs 固有抖动（specs.trigger_jitter_s_rms）；逐次独立抽样、同种子逐位复现；统计测试见
# tests/test_keysight_uxr.py。#859 复核：通道噪声表 + 触发抖动两项均已满足 #744 的约定。
schema: simubench.coverage/1
model: keysight-uxr1104b
sections:
- section: '* (Common) Commands (Programmer''s Guide 11.80, ch. 13)'
  commands:
  - header: '*CLS'
    level: implemented
  - header: '*ESE'
    level: implemented
  - header: '*ESR'
    level: implemented
  - header: '*IDN'
    level: implemented
    note: Keysight Technologies,UXR1104B,<serial>,<software version> as the guide writes it (no options field);
      serial MY64310101 and version 11.80.00012 are SimuBench values
  - header: '*LRN'
    level: implemented
    note: 'setup_memory component (#1070): ":SYST:SET " and a definite-length block, whatever :SYSTem:HEADer is;
      sent back as it is, it restores the setup. The setup is SimuBench''s JSON (every setting a command can change),
      not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: '*OPC'
    level: implemented
    note: '*OPC? waits for a :DIGitize or :SINGle in progress; without a trigger it does not answer (the guide:
      abort a :DIGitize with a device clear)'
  - header: '*OPT'
    level: implemented
    note: 'The built-in *OPT? answers the bench instance''s options (01G, 02G: the data sheet''s memory depth options,
      guide table 10), comma-separated; 0 without any. The options change only this reply: the simulated memory is
      the 2 Gpts option''s either way.'
  - header: '*PSC'
    level: accepted
    note: Saved and read back (1 at power-on, a SimuBench value); the power-on SRQ it controls never happens on
      a bench.
    affects_data: false
  - header: '*RCL'
    level: implemented
    note: 'setup_memory component (#1070): puts every setting back as saved; an empty register changes nothing and
      queues no error (the guide: a message on the display).'
  - header: '*RST'
    level: implemented
    note: 'the guide''s Default Setup (:SYSTem:PRESet): run, CH1 on at 1 V/div (the 1 mm models'' largest is 500
      mV/div, which SimuBench uses) and 0 offset, 100 ns/div, position 0, centre reference, edge trigger on CH1
      at 0 V rising, AUTO sweep; :ACQuire:COMPlete 90. Values the guide does not list are SimuBench defaults: CH2-CH4
      off, holdoff 100 ns, average off with 16 averages, memory depth AUTO (256 kpts), sample rate AUTO, bandwidth
      MAX, waveform source CHAN1, ASCii, MSBFirst, streaming off, headers and long form off'
  - header: '*SAV'
    level: implemented
    note: 'setup_memory component (#1070): registers 0-9, shared with :STORe:SETup; kept across runs of a saved
      bench, untouched by *RST. The setup is SimuBench''s JSON (every setting a command can change), not the scope''s
      own byte format; what SimuBench saves it reads back.'
  - header: '*SRE'
    level: implemented
  - header: '*STB'
    level: implemented
  - header: '*TRG'
    level: implemented
    note: the same as :DIGitize without parameters
  - header: '*TST'
    level: implemented
  - header: '*WAI'
    level: implemented
- section: ': (Root Level) Commands (Programmer''s Guide 11.80, ch. 14)'
  commands:
  - header: :ADER
    level: implemented
    note: set by every acquisition that completes, triggered or auto-triggered; read and cleared by the query
  - header: :AER
    level: implemented
    note: set when :RUN or :SINGle arms the trigger; read and cleared by the query
  - header: :ASTate
    level: implemented
    note: ARM (waiting for the trigger), TRIG (triggered), ATRIG (auto-triggered, running), ADONE (stopped, acquisition
      done)
  - header: :ATER
    level: implemented
    note: set by an acquisition an AUTO sweep took without its trigger; read and cleared by the query
  - header: :AUToscale
    level: implemented
    note: scope_autoscale. Searches the channels (all, or the displayed ones), turns off those without a waveform
      (their settings kept), sets each found channel's scale (its spread over at most 6 divisions, 1-2-5) and
      offset (centred), the timebase for 3 periods of the lowest-numbered found channel's fundamental, an edge
      trigger on the first triggerable channel from CH4 down at its waveform's middle, AUTO sweep, positive
      slope, normal hysteresis, minimum holdoff, marker mode MEASurement, auto memory depth and sample rate,
      and turns the functions off; nothing found leaves every setting as it was. The fill, the periods and
      the presence threshold (3 noise rms, from the data sheet's noise table) are SimuBench values; the
      acquisition completion criterion, windows, memories and InfiniiSim autoscale also resets are not
      modeled, measurements on channels it turns off stay listed.
  - header: :AUToscale:CHANnels
    level: implemented
    note: ALL or DISPlayed; kept by Default Setup (a user preference); power-on ALL (SimuBench value).
  - header: :AUToscale:PLACement
    level: implemented
    note: STACk gives each found waveform its own band of the screen, top to bottom in channel order;
      OVERlay and SEParate (each grid the whole range) the whole screen. Kept by Default Setup; power-on
      OVERlay (SimuBench value).
  - header: :AUToscale:VERTical
    level: implemented
    note: CHANnel<N>'s scale and offset as :AUToscale sets them, nothing else; no waveform leaves them.
      DIFF<D> and COMMonmode<C> (differential pairs) are not modeled (-224).
  - header: :BEEP
    level: accepted
    note: Frequency (Hz) and duration (ms) are checked and kept; the guide gives no range, SimuBench takes 0 to
      1E6. No sound.
    affects_data: false
  - header: :BLANk
    level: implemented
    note: CHANnel<N> only; ALL, functions, histograms and memories are not modeled
  - header: :CDISplay
    level: implemented
    note: 'Clears the measurement statistics (the guide: resets all associated measurements). The next acquisition
      fills the screen again; a stopped scope keeps its record for :WAVeform:DATA? (SimuBench keeps the record,
      the guide erases the display only).'
  - header: :DIGitize
    level: implemented
    note: acquires the displayed channels (or the channels named) and stops. Channels named are turned on; the guide
      turns their display off (known deviation)
  - header: :MODel
    level: implemented
    note: UXR1104B without quotes, as the guide's table writes the reply with headers off
  - header: :MTEEnable
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): mask testing.'
    gap: blocked
    blocked_by: mask-test
  - header: :MTERegister
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): mask testing.'
    gap: blocked
    blocked_by: mask-test
  - header: :OPEEnable
    level: implemented
    note: the enable mask of the Operation Status Register (bits 0 ACQ DONE, 1 PROC DONE, 5 WAIT TRIG, 11 AUTO TRIG);
      summary in *STB bit 7 (OPER)
  - header: :OPERegister
    level: implemented
    note: 'read and cleared by the query: bit 0 ACQ DONE and bit 1 PROC DONE (set when :ADER? and :PDER? become
      set), bit 5 WAIT TRIG, bit 11 AUTO TRIG (:ATER?). MASK (bit 9) and OVLR (bit 12) are not modeled'
  - header: :OVLRegister
    level: implemented
    note: 'The Overload Event Register (guide p.309): bit n-1 for each channel n with an overload since the last read;
      the read clears it (bits 4-7 zero). ASSUMPTION (#1304): the guide does not state the condition that sets a bit
      (on older Keysight scopes the OVLR reports a 50 Ω input protection trip, which the UXR has no command for); the
      model sets it when the input goes beyond the data sheet''s Maximum Input Range (3123-1313, Vertical System: the
      offset ± 8 divisions) at an acquisition. Beyond the absolute ±6.5 V to ground the instrument warns of
      possible damage (an event and the problems list; the guide names no protection action, so the input is not
      disconnected). A clipped record is still measured: the guide returns the most accurate value the scaling
      allows and flags it only through :MEASure:SENDvalid''s result states, which are not modeled (#1264)'
  - header: :PDER
    level: implemented
    note: measurements are computed when queried, so processing is done when the acquisition is; its own register,
      read and cleared by the query
  - header: :PRINt
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): screen images and hardcopies (#1072).'
    gap: blocked
    blocked_by: screenshot
  - header: :RECall:SETup
    level: implemented
    note: 'setup_memory component (#1070): the same registers 0-9 as *RCL; an empty one changes nothing.'
  - header: :RSTate
    level: implemented
    note: RUN, STOP or SING
  - header: :RUN
    level: implemented
    note: Continuous acquisitions per :TRIGger:SWEep; :RSTate? then answers RUN.
  - header: :SERial
    level: implemented
    note: 'query only: the serial number of *IDN? without quotes, as the guide''s sample. Setting the serial number
      is not modeled'
  - header: :SINGle
    level: implemented
    note: one acquisition on the next trigger; :TRIGger:SWEep is not changed (the guide)
  - header: :STATus
    level: implemented
    note: CHANnel<N> only
  - header: :STOP
    level: implemented
    note: Stops acquiring; the last record stays for transfers and measurements; :RSTate? answers STOP.
  - header: :STORe:JITTer
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM,
      equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting
      (P4-1).'
    gap: out_of_scope
  - header: :STORe:SETup
    level: implemented
    note: 'setup_memory component (#1070): the same registers 0-9 as *SAV. The setup is SimuBench''s JSON (every
      setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: :STORe:WAVeform
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): reference waveform memories.'
    gap: blocked
    blocked_by: waveform-memory
  - header: :TERegister
    level: implemented
    note: set when an acquisition that met the trigger is stored (auto triggers do not set it); read and cleared
      by the query; summary in *STB bit 0
  - header: :VIEW
    level: implemented
    note: CHANnel<N> only; functions, histograms, memories and the like are not modeled
- section: :ACQuire Commands (Programmer's Guide 11.80, ch. 15)
  commands:
  - header: :ACQuire:ADC:CLIPped:CLEar
    level: implemented
    note: 'Accepted: the clipping status is taken from each channel''s current record when read, so there is nothing
      latched to clear.'
  - header: :ACQuire:AVERage
    level: implemented
    note: 'ON: each record is the mean of :ACQuire:COUNt acquisitions, each noisy and quantized (D46)'
  - header: :ACQuire[:AVERage]:COUNt
    level: implemented
    note: 2 to 1 048 575 (the data sheet; the guide's 10,486,575 is a misprint); 16 after a default setup is a SimuBench
      value. A SimuBench model limit, not the guide's (#986) - an acquisition whose count x record points is beyond
      2^28 (the record's own request counts too, so at most 2^28 // points - 1 averages, 1047 of the default 256
      kpts record, 25 of the deepest 10 Mpts one (#990)) is refused before it starts with -221 and leaves no record.
      No peak detect is mapped
  - header: :ACQuire:BANDwidth
    level: implemented
    note: 'MAX or 100 MHz to 113 GHz (the data sheet''s typical bandwidth; 110 GHz warranted): the -3 dB frequency
      of the acquisition''s DSP filter, shaped by :ACQuire:RESPonse (#607). AUTO is not modeled; the lower limit
      is a SimuBench value. The filter is DSP after the ADC (#1262): the converter''s noise, drawn white to the
      Nyquist frequency of 256 GSa/s at the full-bandwidth table value, falls with it as sqrt(B / 128 GHz) (6 %
      below sqrt(B / 113 GHz)); a record slower than the converter is filtered at up to 16 times its own rate,
      so below 16 GSa/s the noise between that rate''s Nyquist frequency and the analog bandwidth stays'
  - header: :ACQuire:BANDwidth:FRAMe
    level: implemented
    note: '+1.13000E+11: the model''s maximum bandwidth (data sheet: 113 GHz typical), the same as :ACQuire:BANDwidth
      MAX.'
  - header: :ACQuire:BANDwidth:TESTLIMITS
    level: implemented
    note: '1,<numeric>+1.00000E+08:+1.13000E+11: the range :ACQuire:BANDwidth accepts in this definition (the guide
      gives no figures).'
  - header: :ACQuire:COMPlete
    level: implemented
    note: 0 to 100, 90 after a default setup (the guide). In real-time sampling it has no effect on the record (the
      guide)
  - header: :ACQuire:COMPlete:STATe
    level: accepted
    note: 'Wait for function averages: saved and read back (functions are not modeled, C5); ON at power-on (a SimuBench
      value).'
    affects_data: false
  - header: :ACQuire:DIFFerential:PARTner
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): differential and common-mode channel inputs.'
    gap: blocked
    blocked_by: differential-input
  - header: :ACQuire:FPLot
    level: accepted
    note: 'Fast Plot: saved and read back; simulated analysis is always synchronous with the acquisition. ON at
      power-on (a SimuBench value).'
    affects_data: false
  - header: :ACQuire:HISTory:COUNt
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:INDex
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:PLAY
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HRESolution
    level: accepted
    note: AUTO, BITS11 or BITS12, saved and read back; it applies in the high resolution modes, which are not modeled.
    affects_data: false
  - header: :ACQuire:INTerpolate
    level: accepted
    note: 'ON / OFF (answered 1 / 0) or INT1-INT32: the display''s sin(x)/x interpolation; :WAVeform:DATA? sends
      the acquired samples either way. ON at power-on (a SimuBench value).'
    affects_data: false
  - header: :ACQuire:MODE
    level: implemented
    note: 'RTIMe or SEGMented (segmented memory, scope_acquisition segments #957: a :DIGitize takes :ACQuire:SEGMented:COUNt
      segments, each on its own trigger); PDETect, HRESolution, SEGPdetect and SEGHres are not modeled (-224).'
  - header: :ACQuire:POINts[:ANALog]
    level: implemented
    note: 'AUTO (SimuBench: 256 kpts) or 16 to 2 Gpts (the 2 Gpts option, as SimuBench assumes); a depth turns
      :ACQuire:POINts:AUTO off, AUTO turns it on; the query answers the depth in use. Records beyond 2^22 points are
      computed when read, in parts (#1012). Without a set sample rate the rate is the fastest of 256 GSa/s
      divided by a power of two that fills the depth over ten divisions.'
  - header: :ACQuire:POINts:AUTO
    level: implemented
    note: 'ON: the scope picks the memory depth (256 kpts in SimuBench, #1012); OFF: the depth :ACQuire:POINts set.
      Setting a depth turns it OFF, :ACQuire:POINts AUTO turns it ON.'
  - header: :ACQuire:POINts:TESTLIMITS
    level: implemented
    note: '1,<numeric>16:2000000000: the range :ACQuire:POINts accepts in this definition (2 Gpts, the option SimuBench
      assumes).'
  - header: :ACQuire:REDGe
    level: implemented
    note: OFF (0) only on the UXR-Series (guide); ON is refused (-224).
  - header: :ACQuire:RESPonse
    level: implemented
    note: 'FLATmag (default, the guide): flat magnitude, linear phase, a brick wall at :ACQuire:BANDwidth with its
      delay removed, so a step rings; GAUSsianmag: a Gaussian magnitude -3 dB at the same frequency, no ringing.
      The guide''s narrower Gaussian bandwidth is not given in figures: the simulation keeps the -3 dB point (#607)'
  - header: :ACQuire:SEGMented:AUToplay
    level: accepted
    note: Saved and read back; playback only changes the display.
    affects_data: false
  - header: :ACQuire:SEGMented:COUNt
    level: implemented
    note: 'Segments a :DIGitize takes in :ACQuire:MODE SEGMented, each on its own trigger (scope_acquisition segments,
      #957); 2 at power-on (a SimuBench value). All segments together hold at most 2 Gpts (#1012).'
  - header: :ACQuire:SEGMented:INDex
    level: implemented
    note: The segment transfers and measurements read, from 1; an index past the last acquired segment selects the
      last (the out-of-range error the guide mentions is not raised).
  - header: :ACQuire:SEGMented:PLAY
    level: accepted
    note: 'Playback finishes at once on a bench: the query answers 0 (not playing).'
    affects_data: false
  - header: :ACQuire:SEGMented:PRATe
    level: accepted
    note: 0.001 to 1 s per segment (guide); playback only changes the display.
    affects_data: false
  - header: :ACQuire:SEGMented:TTAGs
    level: accepted
    note: Saved and read back; the time tags (:WAVeform:SEGMented:TTAG?, XLISt? TTAG) are always available.
    affects_data: false
  - header: :ACQuire:SEGMented:VLSCapture
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :ACQuire:SRATe[:ANALog]
    level: implemented
    note: AUTO (the rate follows the memory depth), MAX or <rate> rounded to the next fastest of 256 GSa/s divided
      by a power of two (the data sheet); a set rate takes precedence over the memory depth (the guide's table)
      and the record holds rate x 10 div points, at most 2 Gpts (the rate steps down to fit; deep records are computed when read).
      The query answers the rate in use
  - header: :ACQuire:SRATe[:ANALog]:AUTO
    level: implemented
    note: 'ON: the rate follows the memory depth and timebase; OFF: the rate :ACQuire:SRATe set (a set rate turns
      it OFF, :ACQuire:SRATe AUTO turns it ON).'
  - header: :ACQuire:SRATe:TESTLIMITS
    level: implemented
    note: '1,<numeric>+0.00000E+00:+2.56000E+11: the range :ACQuire:SRATe accepts in this definition (0 is AUTO;
      a set rate snaps to 256 GSa/s divided by a power of two).'
  - header: :ACQuire:VLSCapture:DURation
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
