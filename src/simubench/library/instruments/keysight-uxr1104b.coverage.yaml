      which is blocked by C5, so it is refused (-224).
    affects_data: false
  - header: :SYSTem:PERSona
    level: implemented
    note: Sets the manufacturer and model strings *IDN? answers; DEFault restores Keysight Technologies and UXR1104B.
      The 31 and 10 character limits are not checked.
  - header: :SYSTem:PRESet
    level: implemented
    note: 'DEFault or no parameter: the Default Setup, as *RST. FACTory is not modeled'
  - header: :SYSTem:SETup
    level: implemented
    note: 'setup_memory component (#1070): the query answers the setup as a definite-length block; the command puts
      one back (a block that is not a setup of this model: -161, nothing changes). The setup is SimuBench''s JSON
      (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
