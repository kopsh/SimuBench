  - header: :MEASure:FALLtime
    level: implemented
    note: upper to lower level of the source's rise/fall thresholds (:MEASure:THResholds:RFALl, 90 % to 10 % of
      top minus base by default); the PAM-4 level arguments are not modeled; the command form adds it to the screen
      (:MEASure:RESults?). Four or more samples on the edge (one below the lower threshold, one above the upper, two between), else 9.99999E+37 (the guide, #1332); the edge starts at its last lower (upper) crossing before the upper (lower) one, so noise on the base does not stretch it.
  - header: :MEASure:FFT:CPOWer
    level: implemented
    note: The power of the source transform's band <center> ± <bw>/2, in dBm (#1074).
  - header: :MEASure:FFT:DFRequency
    level: implemented
    note: 'The frequency difference between the source transform''s peaks <peak1> and <peak2> above <level> dBm (#1074); the guide gives every argument, an omitted one takes SimuBench''s default: peak1 1, peak2 2, level -60 dBm.'
  - header: :MEASure:FFT:DMAGnitude
    level: implemented
    note: 'The magnitude difference between the source transform''s peaks <peak1> and <peak2> above <level> dBm (#1074); the guide gives every argument, an omitted one takes SimuBench''s default: peak1 1, peak2 2, level -60 dBm.'
  - header: :MEASure:FFT:FREQuency
    level: implemented
    note: 'The frequency of the source transform''s peak <peak> (numbered low to high) above <level> dBm, computed when queried (#1074); no such peak: 9.99999E+37; an omitted peak is 1, an omitted level -60 dBm (SimuBench defaults).'
  - header: :MEASure:FFT:MAGNitude
    level: implemented
    note: 'The magnitude of the source transform''s peak <peak> above <level> dBm (#1074); no such peak: 9.99999E+37; an omitted peak is 1, an omitted level -60 dBm (SimuBench defaults).'
  - header: :MEASure:FFT:OBW
    level: implemented
    note: The bandwidth holding <pct> percent of the source transform's power (#1074).
  - header: :MEASure:FFT:PSD
    level: implemented
    note: The power spectral density of the source transform's band <center> ± <bw>/2, in dBm/Hz (#1074).
  - header: :MEASure:FFT:THDistortion
    level: implemented
    note: '√(Σ harmonics² / fundamental²) of the source transform, in percent (#1074). After the mode the
      number is the fundamental <fund_freq> (MANual) or the peak level in dBm (PEAK): the fundamental is the
      <peak_number>-th peak above it (default 1), numbered as the FFT''s peak annotations sort them (largest
      first by default). The mode and its number are required (-109 without them); a fundamental within the
      first bin (0 Hz included) or a peak that is not there answers 9.99999E+37 (#1362).'
  - header: :MEASure:FREQuency
    level: implemented
    note: rising edge to rising edge (RISing); FALLing is not modeled; the command form adds it to the screen (:MEASure:RESults?)
