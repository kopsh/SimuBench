    level: implemented
    note: 10 divisions of :TIMebase:SCALe
  - header: :TIMebase:REFClock
    level: implemented
    note: 'ON: the sampling clock follows a 10 MHz on the REF_IN port (50 ohm) within the guide''s lock range (10
      MHz +-20 ppm, -5 dBm to +15 dBm); outside it, or without a signal, the internal clock stays in charge (scope_timebase
      rosc).'
  - header: :TIMebase:REFerence
    level: implemented
    note: LEFT, CENTer, RIGHt at 10 %, 50 %, 90 % of the screen (SimuBench reading of the Infiniium screen; the
      guide gives no figures); the query answers PERC after :TIMebase:REFerence:PERCent. Writing PERCent here is
      refused (-224).
  - header: :TIMebase:REFerence:PERCent
    level: implemented
    note: 0-100 % of the screen from the left; :TIMebase:REFerence? then answers PERC. LEFT, CENTer and RIGHt set
      it to 10, 50 and 90 (constraints); the record follows (scope_timebase reference_divs).
  - header: :TIMebase:ROLL:ENABLE
    level: implemented
    note: 'OFF (0) only: the UXR-Series has no roll mode (guide); ON is refused (-224).'
  - header: :TIMebase:SCALe
