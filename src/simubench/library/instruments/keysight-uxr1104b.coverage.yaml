    gap: out_of_scope
  - header: :SYSTem:DATE
    level: not_modeled
    note: 'Out of scope: network services, cloud, repository, LXI and real-time clock are not simulated.'
    gap: out_of_scope
  - header: :SYSTem:DEBug
    level: accepted
    note: "ON/OFF with output mode, file and create mode, kept (defaults FileSCReen, C:\\Users\\Public\\Documents\\Infiniium\\debug.txt, CREate, as the guide gives); no trace file is written. Deviation: OFF answers 0 followed by the kept mode, file and create mode, where the guide answers 0 alone."
    affects_data: false
  - header: :SYSTem:DONTtabmeas
    level: accepted
    note: "User preference, OFF at power-on (a SimuBench value); Default Setup leaves it."
    affects_data: false
  - header: :SYSTem:DSP
    level: accepted
    affects_data: false
    note: the message on the screen; saved and read back
  - header: :SYSTem:ERRor
    level: implemented
    note: 'without a parameter or with NUMBer: the error number alone, 0 when the queue is empty; STRing:
      the number and the quoted text, 0,"No error" (the guide)'
  - header: :SYSTem:GUI
    level: accepted
    note: "ON, OFF or LOCK, read back as a word (guide 6.20); ON at power-on. Remote commands work in every state; Default Setup leaves it."
    affects_data: false
  - header: :SYSTem:HEADer
    level: implemented
    note: 'ON: replies start with the command header (short, or long with :SYSTem:LONGform ON); common
      command queries never have one (the guide). OFF after power-on is a SimuBench value (a user preference
      the guide does not give)'
  - header: :SYSTem:HLED
    level: accepted
    note: "Front panel LEDs hidden or shown; saved and read back."
    affects_data: false
  - header: :SYSTem:LOCK
    level: accepted
    note: "Front panel knobs and keys locked; remote commands still work. Saved and read back."
    affects_data: false
  - header: :SYSTem:LONGform
    level: implemented
    note: 'ON: headers and enumerations in the long form (CENTER, :TIMEBASE:REFERENCE); the guide''s :MODel?
      table'
  - header: :SYSTem:MENU
    level: not_modeled
    note: 'Out of scope: application layer (C17): it lists the GUI menu entries that launch the analysis applications.'
    gap: out_of_scope
  - header: :SYSTem:MODE
    level: accepted
    note: "OSCilloscope only; RTSA (real-time spectral analysis) turns every channel into a spectrum analyzer channel, which is blocked by C5, so it is refused (-224)."
    affects_data: false
  - header: :SYSTem:PERSona
    level: implemented
    note: "Sets the manufacturer and model strings *IDN? answers; DEFault restores Keysight Technologies and UXR1104B. The 31 and 10 character limits are not checked."
  - header: :SYSTem:PRESet
    level: implemented
    note: 'DEFault or no parameter: the Default Setup, as *RST. FACTory is not modeled'
  - header: :SYSTem:SETup
    level: implemented
    note: 'setup_memory component (#1070): the query answers the setup as a definite-length block; the command puts one back (a block that is not a setup of this model: -161, nothing changes). The setup is SimuBench''s JSON (every setting a command can change), not the scope''s own byte format; what SimuBench saves it reads back.'
  - header: :SYSTem:TIME
    level: not_modeled
    note: 'Out of scope: network services, cloud, repository, LXI and real-time clock are not simulated.'
    gap: out_of_scope
  - header: :SYSTem:TOUChscreen
    level: accepted
    note: "ON at power-on (a SimuBench value); Default Setup leaves it."
    affects_data: false
- section: :TIMebase Commands (Programmer's Guide 11.60, ch. 38)
  commands:
  - header: :TIMebase:POSition
    level: implemented
    note: -200 s to 200 s (data sheet delay range)
  - header: :TIMebase:RANGe
    level: implemented
    note: 10 divisions of :TIMebase:SCALe
  - header: :TIMebase:REFClock
    level: implemented
    note: "ON: the sampling clock follows a 10 MHz on the REF IN port (50 ohm) within the guide's lock range (10 MHz +-20 ppm, -5 dBm to +15 dBm); outside it, or without a signal, the internal clock stays in charge (scope_timebase rosc)."
  - header: :TIMebase:REFerence
    level: implemented
    note: "LEFT, CENTer, RIGHt at 10 %, 50 %, 90 % of the screen (SimuBench reading of the Infiniium screen; the guide gives no figures); the query answers PERC after :TIMebase:REFerence:PERCent. Writing PERCent here is refused (-224)."
  - header: :TIMebase:REFerence:PERCent
    level: implemented
    note: "0-100 % of the screen from the left; :TIMebase:REFerence? then answers PERC. LEFT, CENTer and RIGHt set it to 10, 50 and 90 (constraints); the record follows (scope_timebase reference_divs)."
  - header: :TIMebase:ROLL:ENABLE
    level: implemented
    note: "OFF (0) only: the UXR-Series has no roll mode (guide); ON is refused (-224)."
  - header: :TIMebase:SCALe
    level: implemented
    note: 5 ps/div to 20 s/div (the guide; the data sheet gives 1 ps/div for the 40 GHz to 110 GHz models, not modeled)
  - header: :TIMebase:VIEW
    level: accepted
    note: "MAIN or WINDow (zoom); the zoom changes the display only: the acquisition and the ALL / MAIN data are unchanged (the WINDow data view is not modeled)."
    affects_data: false
  - header: :TIMebase:VLSCapture:POSTtrigger
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :TIMebase:VLSCapture:PRETrigger
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :TIMebase:WINDow:DELay
    level: accepted
    note: "The same setting as :TIMebase:WINDow:POSition (the guide: kept for compatibility)."
    affects_data: false
  - header: :TIMebase:WINDow:POSition
    level: accepted
    note: "Zoom position +-200 s (the main position's range; the guide's 'within the main sweep' is not checked); 0 s at power-on."
    affects_data: false
  - header: :TIMebase:WINDow:RANGe
    level: accepted
    note: "Ten times :TIMebase:WINDow:SCALe; 10 ps minimum (guide), the main range at most is not checked."
    affects_data: false
  - header: :TIMebase:WINDow:SCALe
    level: accepted
    note: "1 ps/div to 20 s/div; 10 ps/div at power-on (a SimuBench value)."
    affects_data: false
