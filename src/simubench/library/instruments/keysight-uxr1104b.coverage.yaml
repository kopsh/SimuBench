    note: 5 ps/div to 20 s/div (the guide; the data sheet gives 1 ps/div for the 40 GHz to 110 GHz models, not modeled)
  - header: :TIMebase:VIEW
    level: accepted
    note: 'MAIN or WINDow (zoom); the zoom changes the display only: the acquisition and the ALL / MAIN data are
      unchanged (the WINDow data view is not modeled).'
