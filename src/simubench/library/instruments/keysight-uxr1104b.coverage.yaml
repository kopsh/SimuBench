- section: :CHANnel<N> Commands (Programmer's Guide 11.60, ch. 19)
  commands:
  - header: :CHANnel<N>:ADC:CLIPped
    level: implemented
    note: "Whether the channel's current record reaches the ADC limits: 0, 1 (low), 2 (high), 3 (both). Read from the record when queried (no 200 ms latch)."
  - header: :CHANnel<N>:CLIPped
    level: implemented
    note: "1 when the channel's current record reaches either ADC limit, else 0; independent of :DISPlay:CLIPped (guide)."
  - header: :CHANnel<N>:COMMonmode
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): differential and common-mode channel inputs.'
