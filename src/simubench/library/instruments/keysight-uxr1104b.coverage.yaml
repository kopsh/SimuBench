    gap: model_work
  - header: :ACQuire:SEGMented:PRATe
    level: not_modeled
    note: 'Model work: segmented memory exists in the platform (#957).'
    gap: model_work
  - header: :ACQuire:SEGMented:TTAGs
    level: not_modeled
    note: 'Model work: segmented memory exists in the platform (#957).'
    gap: model_work
  - header: :ACQuire:SEGMented:VLSCapture
    level: not_modeled
    note: 'Blocked by C11 (product-plan.md 4.2): very long sequence capture needs block-wise computation (#1012).'
    gap: blocked
    blocked_by: C11
  - header: :ACQuire:SRATe[:ANALog]
    level: implemented
    note: AUTO (the rate follows the memory depth), MAX or <rate> rounded to the next fastest of 256 GSa/s
      divided by a power of two (the data sheet); a set rate takes precedence over the memory depth (the
      guide's table) and the record holds rate x 10 div points, at most 10 Mpts in the simulation (the
      rate steps down to fit). The query answers the rate in use
  - header: :ACQuire:SRATe[:ANALog]:AUTO
    level: not_modeled
    note: 'Model work: acquisition setting on the existing signal chain.'
    gap: model_work
  - header: :ACQuire:SRATe:TESTLIMITS
