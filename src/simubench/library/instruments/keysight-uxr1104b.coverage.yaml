      Default Setup leaves it (guide).'
  - header: :CHANnel<N>:PROBe:SKEW:AUTO
    level: accepted
    affects_data: false
    note: 'the deskew against the probe''s own compensation signal - the model has no probe identification
      and no compensation signal, so the command parses and the skew keeps its value.'
