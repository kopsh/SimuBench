    blocked_by: differential-input
  - header: :ACQuire:FPLot
    level: not_modeled
    note: 'Model work: display-only setting; candidate for accepted (affects_data: false).'
    gap: model_work
  - header: :ACQuire:HISTory:COUNt
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:INDex
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HISTory:PLAY
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): acquisition history playback.'
    gap: blocked
    blocked_by: C8
  - header: :ACQuire:HRESolution
    level: not_modeled
    note: 'Model work: acquisition setting on the existing signal chain.'
    gap: model_work
  - header: :ACQuire:INTerpolate
    level: not_modeled
    note: 'Model work: acquisition setting on the existing signal chain.'
    gap: model_work
  - header: :ACQuire:MODE
    level: implemented
    note: RTIMe only; PDETect, HRESolution and the segmented modes are not modeled
  - header: :ACQuire:POINts[:ANALog]
    level: implemented
    note: 'AUTO (SimuBench: 256 kpts) or 16 to 10 Mpts; larger depths (the UXR has 500 Mpts, 1 and 2 Gpts as options) are refused
      as out of range in the simulation. Without a set sample rate the rate is the fastest of 256 GSa/s
      / 2^n not above points / 10 div'
  - header: :ACQuire:POINts:AUTO
    level: not_modeled
    note: 'Model work: acquisition setting on the existing signal chain.'
    gap: model_work
  - header: :ACQuire:POINts:TESTLIMITS
    level: not_modeled
    note: 'Model work: query of the limits declared in the definition.'
    gap: model_work
  - header: :ACQuire:REDGe
    level: not_modeled
    note: 'Model work: acquisition setting on the existing signal chain.'
    gap: model_work
  - header: :ACQuire:RESPonse
    level: implemented
    note: 'FLATmag (default, the guide): flat magnitude, linear phase, a brick wall at :ACQuire:BANDwidth
      with its delay removed, so a step rings; GAUSsianmag: a Gaussian magnitude -3 dB at the same frequency,
      no ringing. The guide''s narrower Gaussian bandwidth is not given in figures: the simulation keeps
      the -3 dB point (#607)'
  - header: :ACQuire:SEGMented:AUToplay
    level: not_modeled
    note: 'Model work: segmented memory exists in the platform (#957).'
    gap: model_work
  - header: :ACQuire:SEGMented:COUNt
    level: not_modeled
    note: 'Model work: segmented memory exists in the platform (#957).'
    gap: model_work
  - header: :ACQuire:SEGMented:INDex
    level: not_modeled
