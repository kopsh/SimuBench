- section: :MARKer Commands (Programmer's Guide 11.80, ch. 31)
  commands:
  - header: :MARKer:CURSor
    level: implemented
    note: 'The tracked positions as <x>,<y> (DELTa: the deltas); the query also puts the markers in the waveform-tracking
      mode, as the manual''s CAUTION notes.'
  - header: :MARKer:MEASurement:MEASurement
    level: implemented
    note: Which measurement the MEASurement mode tracks; without the on/off argument the list becomes that one measurement.
  - header: :MARKer:MODE
    level: implemented
    note: OFF, MANual, XONLy, YONLy, WAVeform (the marker reads the value its source has at its x) and MEASurement
      (it tracks the measurement the :MARKer:MEASurement:MEASurement command last named).
  - header: :MARKer:TSTArt
    level: implemented
    note: Sets the same position as :MARKer:X1Position (the manual's compatibility spelling).
  - header: :MARKer:TSTOp
    level: implemented
    note: Sets the same position as :MARKer:X2Position (the manual's compatibility spelling).
  - header: :MARKer:VSTArt
    level: implemented
    note: Same as :MARKer:Y1Position (the manual's compatibility spelling).
  - header: :MARKer:VSTOp
    level: implemented
    note: Same as :MARKer:Y2Position (the manual's compatibility spelling).
  - header: :MARKer:X1Position
    level: implemented
    note: 'The Ax marker''s position, in seconds (a transform''s source: Hz).'
  - header: :MARKer:X2Position
    level: implemented
    note: 'The Bx marker''s position, in seconds (a transform''s source: Hz).'
  - header: :MARKer:X1Y1source
    level: implemented
    note: 'The source the Ax/Ay markers read: a channel or a FUNCtion<F> (#1074).'
  - header: :MARKer:X2Y2source
    level: implemented
    note: 'The source the Bx/By markers read: a channel or a FUNCtion<F> (#1074).'
  - header: :MARKer:XDELta
    level: implemented
    note: Bx − Ax, in the source's x unit.
  - header: :MARKer:Y1Position
    level: implemented
    note: 'The Ay marker''s level: in the WAVeform mode the X1Y1 source''s value at the Ax marker, in the MEASurement mode the level of the tracked measurement (as YDELta reads it; none: the invalid value) — the guide: the level at the marker position; otherwise the level set. A write stores the level and keeps the mode.'
  - header: :MARKer:Y2Position
    level: implemented
    note: 'The By marker''s level: in the WAVeform mode the X2Y2 source''s value at the Bx marker, in the MEASurement mode the level of the tracked measurement (as YDELta reads it; none: the invalid value) — the guide: the level at the marker position; otherwise the level set. A write stores the level and keeps the mode.'
  - header: :MARKer:YDELta
    level: implemented
    note: 'By − Ay: the markers'' levels, or the values at their x in the WAVeform mode; in the MEASurement mode both markers sit on the one tracked result (0).'
  - header: :MARKer<K>:CMODe
    level: implemented
    note: CUSTom uses the :MARKer<K>:COLor colour, SOURce the source's.
  - header: :MARKer<K>:COLor
    level: implemented
    note: 'The marker''s custom colour (a string, #RRGGBBAA or a named colour); stored, colours do not change data.'
  - header: :MARKer<K>:DELTa
    level: implemented
    note: 'Without a MARKer<L> word, the screen''s delta-markers switch; with one, marker <K>''s delta-to relationship
      with marker <L>: <state>,<Δx>,<1/Δx>,<Δy>,<Δy/Δx> (9.99999E+37 where not applicable).'
  - header: :MARKer<K>:ENABle
    level: implemented
    note: Turns numbered marker <K> on or off.
  - header: :MARKer<K>:NAME
    level: implemented
    note: The name of numbered marker <K> (an on-screen text).
  - header: :MARKer<K>:SOURce
    level: implemented
    note: 'The source of numbered marker <K>: a channel or a FUNCtion<F> (#1074).'
  - header: :MARKer<K>:TYPE
    level: implemented
    note: The type of numbered marker <K> (XMANual, YMANual, TRACk, RF); a type change needs the marker off (-221).
  - header: :MARKer<K>:X:POSition
    level: implemented
    note: The horizontal position of marker <K> (seconds, or Hz on a transform); a YMANual marker answers 9.99999E+37.
  - header: :MARKer<K>:Y:POSition
    level: implemented
    note: 'The vertical position of marker <K>; a TRACk or RF marker answers its source''s value at its X position (the guide: that value is marked but cannot be moved, a write is -221); an X-only marker answers 9.99999E+37.'
  - header: :MEASure:AREA
    level: implemented
    note: 'DISPlay (default): the integral of the record over the screen, V*s; CYCLe: over the first complete cycle,
      rising (or FALLing) middle crossing to the next.'
