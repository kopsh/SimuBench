    note: "+0.00000E+00,<:ACQuire:BANDwidth>: DC coupling to the acquisition bandwidth filter; a channel's ISIM bandwidth limit is not included."
  - header: :WAVeform:BYTeorder
    level: implemented
    note: "MSBFirst (default) or LSBFirst for BYTE and WORD data."
  - header: :WAVeform:CGRade:HEIGht
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:CGRade:WIDTh
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:COMPlete
    level: implemented
    note: "100: every time bucket of a simulated record has data."
  - header: :WAVeform:COUNt
    level: implemented
    note: "1 (no holes), or :ACQuire:COUNt while averaging is on (every bucket has had all its averages)."
  - header: :WAVeform:COUPling
    level: implemented
    note: "DC, always (guide)."
  - header: :WAVeform:DATA
    level: implemented
    note: 'BYTE: signed 8-bit codes; WORD: signed 16-bit codes (the 10-bit ADC code shifted up 6 bits,
      8192 per division), in a definite-length block; ASCii: comma-separated volts (%.4E, two exponent
      digits; the guide''s sample shows one). The <start>,<size> arguments are not modeled'
  - header: :WAVeform:FORMat
    level: implemented
    note: ASCii (default, the guide), BYTE, WORD; BINary and FLOat are not modeled
  - header: :WAVeform:PNOise:FREQuency
    level: not_modeled
    note: 'Out of scope: application layer (C17, product-plan.md 4.2; product-plan.md section 6): jitter, eye, PAM, equalization, crosstalk and de-embedding are not rewritten in the platform; only through algorithm hosting (P4-1).'
    gap: out_of_scope
  - header: :WAVeform:POINts
    level: implemented
    note: "Query: the points :WAVeform:DATA? sends for the source's record."
  - header: :WAVeform:PREamble
    level: implemented
    note: 'the guide''s 24 fields; date and time are fixed values (the bench has no calendar), the frame
      model is UXR1104B:<serial>, coupling 2 (DCFIFTY), units 2 and 1, max bandwidth the :ACQuire:BANDwidth
      setting, min 0. With ASCii data the Y increment is still the WORD code''s (the guide: the ADC''s
      full scale; known deviation)'
  - header: :WAVeform:SEGMented:ALL
    level: implemented
    note: "OFF (0) only: :WAVeform:DATA? sends the current segment; ON (all segments in one transfer) is not modeled (-224)."
  - header: :WAVeform:SEGMented:COUNt
    level: implemented
    note: "The segments the latest acquisition has; 0 when it was not segmented (guide)."
  - header: :WAVeform:SEGMented:POINts
    level: implemented
    note: "The points of the current segment (ALL is OFF)."
  - header: :WAVeform:SEGMented:TTAG
    level: implemented
    note: "The selected segment's trigger, seconds after the first segment's."
  - header: :WAVeform:SEGMented:XLISt
    level: implemented
    note: "RELXorigin, ABSXorigin and TTAG for every segment of the waveform source, comma-separated (ASCII, %.10E: SimuBench's digits); OFFSet answers 0 (ALL is OFF, guide). The BINary float64 form is not modeled."
  - header: :WAVeform:SOURce
    level: implemented
    note: CHANnel<N> only
  - header: :WAVeform:STReaming
    level: implemented
    note: 'ON: :WAVeform:DATA? sends a #0 indefinite-length block (Streaming On); OFF: a definite-length
      block. OFF after power-on is a SimuBench value'
  - header: :WAVeform:TYPE
    level: implemented
    note: "RAW, or AVER while averaging is on; INTerpolate, PDETect and histograms are not modeled."
  - header: :WAVeform:VIEW
    level: implemented
    note: "ALL or MAIN: the same data, as the simulated record is the main timebase's screen; WINDow (zoom) and CGRade are not modeled (-224)."
  - header: :WAVeform:XDISplay
    level: implemented
    note: "The time at the left edge of the screen (the preamble's X display origin)."
  - header: :WAVeform:XINCrement
    level: implemented
    note: "The sample interval of the source's record, s."
  - header: :WAVeform:XORigin
    level: implemented
    note: "The time of the first sample sent, from the trigger (with the trigger's sub-sample fraction and jitter)."
  - header: :WAVeform:XRANge
    level: implemented
    note: "Ten divisions of the timebase."
  - header: :WAVeform:XREFerence
    level: implemented
    note: always 0 (the guide)
  - header: :WAVeform:XUNits
    level: implemented
    note: "SEC for channel waveforms."
  - header: :WAVeform:YDISplay
    level: implemented
    note: "The value at center screen: the source channel's offset."
  - header: :WAVeform:YINCrement
    level: implemented
    note: "Volts per code of the data format (the scale over 128 codes per division, shifted to the word width)."
  - header: :WAVeform:YORigin
    level: implemented
    note: 'the channel offset: the voltage at code 0'
  - header: :WAVeform:YRANge
    level: implemented
    note: "Eight divisions of the source channel's scale."
  - header: :WAVeform:YREFerence
    level: implemented
    note: always 0 (the guide)
  - header: :WAVeform:YUNits
    level: implemented
    note: "The source channel's :CHANnel<N>:UNITs: VOLT, AMP, WATT or UNKN."
