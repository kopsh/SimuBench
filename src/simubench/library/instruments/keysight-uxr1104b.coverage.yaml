- section: :SYSTem Commands (Programmer's Guide 11.60, ch. 37)
  commands:
  - header: :SYSTem:CAPability:ACQuire
    level: implemented
    note: "Quoted strings from data sheet 3123-1313: HALFchannel \"0\" (no half-channel mode), MEMory \"500000000\" (500 Mpts standard; \"1000000000\" / \"2000000000\" with option 01G / 02G), SRATe \"256000000000\", BANDwidth \"110000000000\" (the warranted bandwidth). The simulated record holds at most 10 Mpts (#1012)."
  - header: :SYSTem:CAPability:CHANnel
    level: implemented
    note: "COUNt: \"4\"."
  - header: :SYSTem:CAPability:DIGital
    level: implemented
    note: "The UXR1104B has no digital channels: MEMory, SRATe and CHANnels answer \"0\"."
  - header: :SYSTem:CLOud:CONNect:USER
    level: not_modeled
    note: 'Out of scope: network services, cloud, repository, LXI and real-time clock are not simulated.'
    gap: out_of_scope
