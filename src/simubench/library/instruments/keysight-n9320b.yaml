schema: simubench.instrument/1
id: keysight-n9320b
manufacturer: Keysight Technologies
model: N9320B
class: spectrum_analyzer
version: 1
description: >-
  Keysight (Agilent) N9320B RF spectrum analyzer, 9 kHz to 3 GHz. Real model (D42). Commands,
  replies, defaults and settings follow the N9320B RF Spectrum Analyzer Programmer's Guide
  (N9320-90029, Edition 5, December 2020); the receiver chain is the split spectrum-analyzer
  blocks (D1 #187). Limits the guide does not state are SimuBench values, listed in the coverage
  table. Only trace 1 and marker 1 exist, only the positive/sample/average/RMS detectors and the
  write/average/max-hold trace modes are modeled; the coverage table names every remaining gap.
  Delta/fixed-reference markers, marker on/off, minimum and left/right peak search and the marker
  counter state need the capability issue #274 and are not modeled.
  The front end follows the Data Sheet (5990-8119EN, #960): noise figure, second- and third-order
  intercepts and 1 dB compression for the band of the center frequency, and the 1 GHz phase-noise
  table; flatness as a unit deviation and the preamplifier option wait for #1004.
reference:
  title: Keysight N9320B RF Spectrum Analyzer Programmer's Guide
  document: N9320-90029
  version: Edition 5, December 2020
  firmware: "A.01.01, as covered by the guide"
# 前端指标的出处（#960）：N9320B RF Spectrum Analyzer Data Sheet（5990-8119EN，July 29, 2020，
# manuals/5990-8119）。手册原文记在 specs；组件参数由它换算，换算写在各参数旁。
specs:
  datasheet: "Keysight N9320B RF Spectrum Analyzer Data Sheet, 5990-8119EN, July 29, 2020"
  frequency_response: >-
    p.3 Frequency response (10 dB input attenuation, reference 50 MHz): preamp off 200 kHz to
    2.0 GHz ±0.5 dB, 2.0 to 3.0 GHz ±0.7 dB; preamp on 1 MHz to 2.0 GHz ±0.6 dB, 2.0 to 3.0 GHz
    ±0.8 dB (not declared: a deviation of the flatness table needs #1004)
  preamplifier: "p.3 Preamplifier: 1 MHz to 3.0 GHz, gain 18 dB nominal (option; not declared, #1004)"
  gain_compression: >-
    p.4 1 dB gain compression, 50 MHz to 3.0 GHz: preamp off > 0 dBm typical (total power at the
    input mixer); preamp on > -20 dBm typical (total power at the preamp)
  danl: >-
    p.4 DANL, input terminated, 0 dB RF attenuation, RBW 10 Hz, VBW 1 Hz, sample detector, preamp
    off, typical: 9 to 100 kHz -90 dBm nominal; 100 to 500 kHz -106 dBm; 500 kHz to 1 MHz -126 dBm;
    1 to 10 MHz -130 dBm (spec -124 dBm); 10 to 500 MHz -132 dBm; 500 MHz to 1.5 GHz -130 dBm (spec
    -130 dBm + 3 x (f/1 GHz) dB); 1.5 to 2.5 GHz -128 dBm; 2.5 to 3 GHz -125 dBm
  second_harmonic: >-
    p.4 Second harmonic distortion (preamp off, signal input -30 dBm, 0 dB RF attenuation):
    10 to 200 MHz +30 dBm; 200 to 500 MHz +35 dBm; 500 MHz to 3 GHz +43 dBm
  toi: >-
    p.4 Third-order intermodulation (preamp off, signal input -20 dBm, 0 dB RF attenuation):
    300 MHz to 3 GHz +10 dBm; +13 dBm nominal
  spurious: >-
    p.5 Input related spurious < -60 dBc (-30 dBm at the input mixer); residual response
    (inherent) < -83 dBm (input terminated, 0 dB RF attenuation, preamp off). Neither gives the
    response's frequency or mixing order, so neither is declared.
  phase_noise: >-
    p.5 Phase noise, Fc = 1 GHz, RBW 1 kHz, VBW 10 Hz, sample detector, log average > 40:
    10 kHz < -88 dBc/Hz (typical < -90); 100 kHz < -100 (typical < -102); 1 MHz < -110 (typical < -112)
identity:
  # The telnet greeting of the guide: Keysight Technologies,N9320B,<serial>,<software>.
  idn: "Keysight Technologies,N9320B,{serial},{firmware}"
  serial: "A.01.01.CIDKMNEW"
  firmware: "0B.03.03"
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST", ":SYSTem:ERRor[:NEXT]", ":SYSTem:DATE", ":SYSTem:TIME"]
error_queue: 20
# The guide's telnet sample: :CALCulate:MARKer:X? answers +2.5000000000000000E+009 (16 decimals,
# three exponent digits). The same format is used for every numeric setting query.
format:
  number: nr3
  digits: 16
  sign: true
  exponent_digits: 3
  # 标记、迹线与计数器等组件产生的数值也按这一格式（手册的样例回复统一 16 位，#366）。
  readings: format
  boolean: numeric
  enum: short
  error_code: signed
state:
  freq.center:
    type: float
    unit: HZ
    min: 0.0
    max: 3.08e9
    default: 1.5e9
    label: 中心频率
    label_en: Center
  freq.span:
    type: float
    unit: HZ
    min: 10.0
    max: 3.0e9
    default: 3.0e9
    label: 跨度
    label_en: Span
  bw.res:
    type: float
    unit: HZ
    min: 10.0
    max: 3.0e6
    default: 3.0e6
    label: 分辨率带宽（手动）
    label_en: RBW (manual)
  bw.res_auto:
    type: bool
    default: true
    label: RBW 自动
    label_en: RBW auto
  bw.vid:
    type: float
    unit: HZ
    min: 1.0
    max: 3.0e6
    default: 3.0e6
    label: 视频带宽（手动）
    label_en: VBW (manual)
  bw.vid_auto:
    type: bool
    default: true
    label: VBW 自动
    label_en: VBW auto
  sweep.time:
    type: float
    unit: S
    min: 1.0e-3
    max: 10.0e3
    default: 0.1002
    label: 扫描时间（手动）
    label_en: Sweep time (manual)
  sweep.time_auto:
    type: bool
    default: true
    label: 扫描时间自动
    label_en: Sweep time auto
  sweep.points:
    type: int
    min: 101
    max: 40001
    default: 1001
    label: 迹线点数
    label_en: Points
  power.att:
    type: float
    unit: DB
    min: 0.0
    max: 70.0
    default: 20.0
    label: 衰减（手动）
    label_en: Attenuation (manual)
  power.att_auto:
    type: bool
    default: true
    label: 衰减自动
    label_en: Attenuation auto
  display.ref_level:
    type: float
    unit: DBM
    min: -150.0
    max: 30.0
    default: 0.0
    label: 参考电平
    label_en: Reference level
  detector:
    type: enum
    options: [POSitive, SAMPle, AVERage, RMS]
    default: POSitive
    label: 检波器
    label_en: Detector
    option_labels: {POSitive: 正峰值, SAMPle: 采样, AVERage: 平均, RMS: 均方根}
  trace.type:
    type: enum
    options: [WRITe, AVERage, MAXHold]
    default: WRITe
    label: 迹线模式
    label_en: Trace mode
    option_labels: {WRITe: 刷新, AVERage: 平均, MAXHold: 最大保持}
  aver.count:
    type: int
    min: 1
    max: 1000
    default: 1
    label: 平均次数
    label_en: Average count
  marker.x:
    type: float
    unit: HZ
    min: 0.0
    max: 3.08e9
    default: 1.5e9
    label: 标记频率
    label_en: Marker
  # 标记组（#274）：开关、普通/差值模式（差值时固定参考标记在切换那一刻的位置与电平）、
  # 频率计数器开关与峰值搜索方式。
  marker.enabled:
    type: bool
    default: false
    label: 标记
    label_en: Marker
  marker.mode:
    type: enum
    options: [POSition, DELTa]
    default: POSition
    label: 标记模式
    label_en: Marker mode
  marker.ref_x:
    type: float
    unit: HZ
    default: 0.0
    label: 参考标记频率
    label_en: Reference marker
  marker.ref_y:
    type: float
    unit: DBM
    default: 0.0
    label: 参考标记电平
    label_en: Reference marker level
  marker.count:
    type: bool
    default: false
    label: 标记计数器
    label_en: Marker counter
  marker.search:
    type: enum
    options: [PARameter, MAXimum]
    default: PARameter
    label: 峰值搜索方式
    label_en: Peak search mode
  marker.threshold:
    type: float
    unit: DBM
    min: -200.0
    max: 30.0
    default: -130.0
    label: 峰值门限
    label_en: Peak threshold
  marker.excursion:
    type: float
    unit: DB
    min: 0.0
    max: 100.0
    default: 6.0
    label: 峰值偏移
    label_en: Peak excursion
  init.continuous:
    type: bool
    default: true
    label: 连续扫描
    label_en: Continuous
  unit.power:
    type: enum
    options: [DBM]
    default: DBM
    label: 电平单位
    label_en: Amplitude unit
  # ---- display settings (accepted: they change the panel only) ----
  display.afunction:
    type: enum
    options: [CENTer, TOP, BOTTom]
    default: CENTer
    label: 活动功能位置
    label_en: Active function position
  display.clock:
    type: bool
    default: true
    label: 显示日期时间
    label_en: Clock display
  display.clock_format:
    type: enum
    options: [MDY, DMY]
    default: MDY
    label: 日期格式
    label_en: Date format
  display.enable:
    type: bool
    default: true
    label: 显示
    label_en: Display
  display.dline:
    type: float
    unit: DBM
    min: -200.0
    max: 30.0
    default: -25.0
    label: 显示线
    label_en: Display line
  display.dline_on:
    type: bool
    default: false
    label: 显示线开关
    label_en: Display line on
  display.nr_level:
    type: float
    unit: DB
    min: -120.0
    max: 120.0
    default: 0.0
    label: 噪声底参考电平
    label_en: Noise floor reference level
  display.nr_position:
    type: int
    min: 0
    max: 10
    default: 10
    label: 噪声底参考位置
    label_en: Noise floor position
  display.pdiv:
    type: float
    unit: DB
    min: 0.1
    max: 20.0
    default: 10.0
    label: 每格电平
    label_en: Level per division
  display.ref_offset:
    type: float
    unit: DB
    min: -100.0
    max: 100.0
    default: 0.0
    label: 参考电平偏移
    label_en: Reference level offset
  display.spacing:
    type: enum
    options: [LOGarithmic]
    default: LOGarithmic
    label: 幅度刻度
    label_en: Scale spacing
  # ---- system settings (accepted: no effect on a measurement) ----
  system.brightness:
    type: enum
    options: [HIGH, MIDDLE, LOW]
    default: HIGH
    label: 亮度
    label_en: Brightness
  system.gpib_address:
    type: int
    min: 0
    max: 30
    default: 18
    label: GPIB 地址
    label_en: GPIB address
  system.pon_type:
    type: enum
    options: [PRESet, LAST]
    default: PRESet
    label: 上电状态
    label_en: Power-on type
  system.preset_type:
    type: enum
    options: [FACTory, USER, LAST]
    default: FACTory
    label: 预置类型
    label_en: Preset type
  system.vga:
    type: bool
    default: false
    label: VGA 输出
    label_en: VGA output
  system.config_hardware:
    type: bool
    default: false
    label: 显示硬件配置
    label_en: Show hardware
  system.config_software:
    type: bool
    default: false
    label: 显示软件配置
    label_en: Show software
  system.config_system:
    type: bool
    default: false
    label: 显示系统配置
    label_en: Show system
components:
  - name: rf_in
    type: input_port
    params: {z_in: 50.0}
  - name: ref_in
    type: input_port
    params: {z_in: 50.0}
  - name: clock
    type: reference_clock
    params: {source: INTernal, nominal_hz: 10e6}
  - name: input
    type: specan_input
    params:
      z_in: 50.0
      # 自动衰减把参考电平保持在混频器上限：手册 *RST 的参考电平 0 dBm 对应衰减 20 dB（#292），
      # 即上限 -20 dBm。
      max_mixer_level: -20.0
      att: $power.att
      att_auto: $power.att_auto
      ref_level: $display.ref_level
  - name: mixer
    type: specan_mixer
    params:
      lo: lo
      # 整机噪声系数，按中心频率所在频段（数据手册第 4 页 DANL 的 typical 列，前放关）。DANL 的条件
      # 是 0 dB 衰减、RBW 10 Hz、VBW 1 Hz、采样检波（视频滤波即对数平均，比功率低 2.51 dB），
      # 本模型的噪声底 = −174 dBm/Hz + NF + 10·lg(1.0645 × 10 Hz) − 2.51，故 NF = DANL + 166.24 dB。
      # 9–100 kHz 取 nominal 值；频段下沿取不大于中心频率的最大表项（2.3 的 table）。
      noise_figure:
        from: $freq.center
        table: {0: 76.24, 100.0e3: 60.24, 500.0e3: 40.24, 1.0e6: 36.24, 10.0e6: 34.24, 500.0e6: 36.24, 1.5e9: 38.24, 2.5e9: 41.24}
      # 二次谐波截点（第 4 页 Second harmonic distortion，−30 dBm、0 dB 衰减，即混频器处）：本模型的二次
      # 谐波 = 2P − IIP2 − 6.02 dB，SHI = IIP2 + 6.02，故 IIP2 = SHI − 6.02。10 MHz 以下手册没有给，不声明（理想）。
      iip2_dbm:
        from: $freq.center
        table: {0: null, 10.0e6: 23.98, 200.0e6: 28.98, 500.0e6: 36.98}
      # 三阶截点（第 4 页 TOI，−20 dBm、0 dB 衰减，即混频器处）：300 MHz–3 GHz +13 dBm nominal（指标 +10 dBm）；
      # 300 MHz 以下手册没有给，不声明。
      iip3_dbm:
        from: $freq.center
        table: {0: null, 300.0e6: 13.0}
      # 1 dB 压缩点（第 4 页，混频器处的总功率，前放关）：50 MHz–3 GHz > 0 dBm typical，取 0 dBm；
      # 50 MHz 以下手册没有给，不声明。
      p1db_dbm:
        from: $freq.center
        table: {0: null, 50.0e6: 0.0}
  - name: lo
    type: specan_lo
    params:
      clock: clock
      source: INTernal
      if_filter: if_filter
      center: $freq.center
      # 自动扫描时间不快于本振扫速：3 GHz 全跨度 100.2 ms（手册 *RST 值；扫速由该值反推，
      # 手册没有单独给出）。
      lo_rate: 3.0e10
      sweep_overhead: 2.0e-4
      # 单边带相位噪声（第 5 页，Fc = 1 GHz，typical 列）；表外按端点延伸。手册只给 1 GHz 一个载波频率。
      phase_noise: [[1.0e4, -90.0], [1.0e5, -102.0], [1.0e6, -112.0]]
  - name: if_filter
    type: specan_if
    params: {rbw: $bw.res, rbw_auto: $bw.res_auto, span: $freq.span}
  - name: detector
    type: specan_detector
    params: {detector: $detector}
  - name: vbw
    type: specan_vbw
    params: {vid: $bw.vid, vid_auto: $bw.vid_auto, if_filter: if_filter}
  - name: sa
    type: specan_trace
    params:
      input: input
      lo: lo
      if_filter: if_filter
      detector: detector
      vbw: vbw
      max_hold_sweeps: 999
      # 中心频率放不进当前跨度时，保持中心、缩小跨度（#292：*RST 后 :FREQ:CENT 10 MHz 不再被滑走）。
      center_fit: span
  - name: sys
    type: system
wiring:
  instrument:
    - [rf_in.out, input.in]
    - [input.out, mixer.in]
    - [mixer.out, if_filter.in]
    - [ref_in.out, clock.ref]
ports:
  instrument:
    RF_IN: rf_in.pin
    REF_IN: ref_in.pin
  media: {REF_IN: reference}
display:
  template: spectrum_analyzer
  summary: [freq.center, freq.span, display.ref_level, detector, trace.type]
capabilities: [spectrum_analyzer]
commands:
  # ---- frequency -------------------------------------------------------------------------------
  - header: "[:SENSe]:FREQuency:CENTer"
    op: sa.frequency
    args: {what: center}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:SPAN"
    op: sa.frequency
    args: {what: span}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STARt"
    op: sa.frequency
    args: {what: start}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STOP"
    op: sa.frequency
    args: {what: stop}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  # ---- resolution and video bandwidth ----------------------------------------------------------
  # The guide writes BANDwidth|BWIDth; the engine's header patterns have one spelling each, so
  # both spellings are declared (they are one manual command, listed twice in the coverage table).
  - header: "[:SENSe]:BANDwidth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BWIDth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BANDwidth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BANDwidth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BWIDth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BANDwidth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  # ---- sweep -----------------------------------------------------------------------------------
  - header: "[:SENSe]:SWEep:TIME:AUTO"
    state: sweep.time_auto
  - header: "[:SENSe]:SWEep:TIME"
    op: sa.coupled_sweep
    params: [{name: value, type: float, unit: S, optional: true}]
  # ---- input attenuation, reference level ------------------------------------------------------
  - header: "[:SENSe]:POWer[:RF]:ATTenuation:AUTO"
    state: power.att_auto
  - header: "[:SENSe]:POWer[:RF]:ATTenuation"
    op: input.coupled_att
    params: [{name: value, type: float, unit: DB, optional: true}]
  - header: ":DISPlay:WINDow[:TRACe]:Y[:SCALe]:RLEVel"
    state: display.ref_level
  # ---- detector, trace, average ----------------------------------------------------------------
  - header: "[:SENSe]:DETector[:FUNCtion]"
    state: detector
  - header: ":TRACe<t>:MODE"
    state: trace.type
  - header: ":TRACe[:DATA]"
    op: sa.trace_data
    set: false
    params: [{name: name, type: string, optional: true}]
  - header: "[:SENSe]:AVERage:COUNt"
    state: aver.count
  # ---- markers ---------------------------------------------------------------------------------
  - header: ":CALCulate:MARKer<m>:MAXimum[:PEAK]"
    op: sa.marker
    query: false
    args: {what: max}
  - header: ":CALCulate:MARKer<m>:MAXimum:NEXT"
    op: sa.marker
    query: false
    args: {what: next}
  - header: ":CALCulate:MARKer<m>:X"
    op: sa.marker
    args: {what: x}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: ":CALCulate:MARKer<m>:Y"
    op: sa.marker
    set: false
    args: {what: y}
  - header: ":CALCulate:MARKer<m>:FCOunt:X"
    op: sa.marker
    set: false
    args: {what: count}
  - header: ":CALCulate:MARKer<m>:MINimum"
    op: sa.marker
    query: false
    args: {what: min}
  - header: ":CALCulate:MARKer<m>:MAXimum:LEFT"
    op: sa.marker
    query: false
    args: {what: left}
  - header: ":CALCulate:MARKer<m>:MAXimum:RIGHt"
    op: sa.marker
    query: false
    args: {what: right}
  - header: ":CALCulate:MARKer<m>:X:DELTa"
    op: sa.marker
    set: false
    args: {what: dx}
    doc: 差值模式下回标记与固定参考标记的频率差；普通模式回 0。
  - header: ":CALCulate:MARKer<m>:MODE"
    state: marker.mode
    doc: DELTa 把参考标记固定在当前标记处，Y? 回与它的电平差（dB）。
  - header: ":CALCulate:MARKer<m>:STATe"
    state: marker.enabled
  - header: ":CALCulate:MARKer:AOFF"
    op: sa.marker_off
    query: false
  - header: ":CALCulate:MARKer<m>:FCOunt[:STATe]"
    state: marker.count
  - header: ":CALCulate:MARKer:PEAK:SEARch:MODE"
    state: marker.search
  - header: ":CALCulate:MARKer:PEAK:THReshold"
    state: marker.threshold
  - header: ":CALCulate:MARKer:PEAK:EXCursion"
    state: marker.excursion
  # ---- reference oscillator, initiate ----------------------------------------------------------
  - header: ":INITiate:CONTinuous"
    state: init.continuous
  - header: ":INITiate[:IMMediate]"
    op: sa.initiate
    query: false
  # ---- units and preset ------------------------------------------------------------------------
  - header: ":UNIT:POWer"
    state: unit.power
  - header: ":SYSTem:PRESet"
    op: sys.reset
    query: false
  # ---- display (accepted: panel only) ----------------------------------------------------------
  - header: ":DISPlay:AFUnction:POSition"
    state: display.afunction
  - header: ":DISPlay:ANNotation:CLOCk:DATE:FORMat"
    state: display.clock_format
  - header: ":DISPlay:ANNotation:CLOCk[:STATe]"
    state: display.clock
  - header: ":DISPlay:ENABle"
    state: display.enable
  - header: ":DISPlay:WINDow:TRACe:Y:DLINe"
    state: display.dline
  - header: ":DISPlay:WINDow:TRACe:Y:DLINe:STATe"
    state: display.dline_on
  - header: ":DISPlay:WINDow:TRACe:Y[:SCALe]:NRLevel"
    state: display.nr_level
  - header: ":DISPlay:WINDow:TRACe:Y[:SCALe]:NRPosition"
    state: display.nr_position
  - header: ":DISPlay:WINDow:TRACe:Y[:SCALe]:PDIVision"
    state: display.pdiv
