# Keysight B2912B 的覆盖表（#330）：命令按 B2900B/BL Series SCPI Command Reference（B2910-90130,
# Edition 2, May 2023）第 3、4 章各命令的 Syntax 逐条列出（<A|B> 展开为多条，[c] 写作 <ch>）；
# 与 B2901A 同一命令体系，程度与说明沿用 keysight-b2901a 覆盖表并按 B2900B 手册与双通道改写。
# 第 6 章“Using Your Existing Programs”的 conventional 命令集是兼容层，不在本定义范围。
schema: simubench.coverage/1
model: keysight-b2912b
sections:
- section: Common Commands
  commands:
  - header: '*CAL'
    level: not_modeled
    note: 自校验是硬件流程；仿真的仪表无漂移可校准。
  - header: '*CLS'
    level: implemented
    note: 清状态字节、标准事件寄存器与错误队列；不清使能寄存器。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器（引擎内置，整数回复）。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器（引擎内置，整数回复）。
  - header: '*IDN'
    level: implemented
    note: Keysight Technologies,B2912B,<serial>,<firmware>（Common Commands > *IDN?）；序列号与固件串的具体写法手册未给示例，待真机核对。
  - header: '*OPC'
    level: implemented
    note: '*OPC 置 ESR 位 0；*OPC? 等全部待完成操作结束后回 1（等待按 NPLC 计的运行）。'
  - header: '*RCL'
    level: not_modeled
    note: 状态存储（0–9）未实现。
  - header: '*RST'
    level: implemented
    note: 恢复本定义的初始设置（值见各命令的 default/rst）。
  - header: '*SAV'
    level: not_modeled
    note: 状态存储（0–9）未实现。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器（引擎内置，整数回复）。
  - header: '*STB'
    level: implemented
    note: 状态字节寄存器（引擎内置，整数回复）。
  - header: '*TRG'
    level: implemented
    note: 总线触发：触发所有触发源为 BUS 且在等待触发的通道（#382）；没有通道在等时 -211。
  - header: '*TST'
    level: implemented
    note: 自检通过，回复 0。
  - header: '*WAI'
    level: implemented
    note: 等待全部待完成操作。
