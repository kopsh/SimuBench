schema: simubench.instrument/1
id: keysight-dsox2024a
manufacturer: Keysight Technologies
model: DSO-X 2024A
class: oscilloscope
version: 1
description: >-
  Keysight InfiniiVision DSO-X 2024A, 4 channels, 200 MHz, 2 GSa/s. Real model (D42): commands,
  replies and *RST values follow the InfiniiVision 2000 X-Series Programmer's Guide 02.66.0000;
  ranges follow the 2000 X-Series data sheet 5990-6618EN. The scope's development baseline for the
  oscilloscope modules (D45). Values neither document gives are SimuBench defaults, listed in the
  coverage table.
reference:
  title: Keysight InfiniiVision 2000 X-Series Oscilloscopes Programmer's Guide
  version: "02.66.0000, 2024-02-01"
  firmware: "2000 X-Series, as covered by Programmer's Guide 02.66.0000"
identity:
  # *IDN? per the guide: AGILENT TECHNOLOGIES,<model>,<serial number>,X.XX.XX.
  idn: "AGILENT TECHNOLOGIES,DSO-X 2024A,{serial},{firmware}"
  serial: MY58260001
  firmware: "02.66.0000"
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST", ":SYSTem:ERRor[:NEXT]"]
error_queue: 30
# Numbers the guide does not show come back as NR3 with five decimals; settings whose *RST sample
# replies the guide shows set their own (engineering exponent, signed, the sample's digits).
format:
  number: nr3
  digits: 5
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  # :SYSTem:ERRor?：手册的示例程序以 "+0," 判断错误队列为空。
  error_code: signed
specs:
  source: InfiniiVision 2000 X-Series Oscilloscopes Data Sheet 5990-6618EN (2014-04-03)
  bandwidth_hz: 2.0e8
  sample_rate: {half_channel_interleaved: 2.0e9, per_channel: 1.0e9}
  memory_depth_pts: 1.0e5
  vertical_resolution_bits: 8
  input_sensitivity_v_div: [1.0e-3, 5.0]
  input: {r_ohm: 1.0e6, r_tolerance: 0.02, c_f: 1.1e-11}
  offset_range_v: {"1 mV to 200 mV/div": 2.0, "> 200 mV to 5 V/div": 50.0}
  dc_gain_accuracy: "±3% full scale (≥ 10 mV/div); ±4% full scale (< 10 mV/div)"
  dc_offset_accuracy: "±0.1 div ± 2 mV ± 1% of offset setting"
  bandwidth_limit_hz: 2.0e7
  timebase_s_div: [2.0e-9, 50.0]
  timebase_accuracy_ppm: 25
  trigger_sensitivity: "< 10 mV/div: greater of 1 div or 5 mV; ≥ 10 mV/div: 0.6 div"
  trigger_jitter_s_rms: 5.0e-11
  noise_floor: >-
    estimated (the data sheet 5990-6618EN publishes no rms-noise figure and no trigger-jitter
    rms — only the TIE measurement's 500 ps, D46, #745): 0.2 mV rms of white input noise at the
    full 200 MHz, the floor of the sensitive ranges.
  noise_per_division: >-
    estimated (data sheet gives none, D46): max(0.2 mV, 0.02 * v_div) at the input — about 0.6
    code rms at 8 bits (30 codes per division, D46) on the sensitive ranges. Per-division values
    in the scope_vertical noise_table.
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  # 操作状态使能寄存器（:OPEE，#248）：位 3 RUN、位 5 WAIT TRIG；摘要进 *STB 位 7（OPER）。
  status.opee:
    type: int
    min: 0
    max: 32767
    default: 0
    label: 操作状态使能
    label_en: Operation status enable
  timebase.scale:
    type: float
    unit: S
    min: 2.0e-9
    max: 50.0
    default: 1.0e-4
    label: 时基
    label_en: Timebase
  timebase.position:
    type: float
    unit: S
    min: -500.0
    max: 500.0
    default: 0.0
    label: 触发位置
    label_en: Position
  timebase.reference:
    type: enum
    options: [LEFT, CENTer, RIGHt]
    default: CENTer
    label: 时间参考
    label_en: Reference
  timebase.mode:
    type: enum
    options: [MAIN, WINDow, XY, ROLL]
    default: MAIN
    label: 时基模式
    label_en: Time base mode
  # 手册的 *RST 重置条件表：Vernier Off；Delay time/division 500 ns、Delay time base delay 0.00 s。
  timebase.vernier:
    type: bool
    default: false
    label: 时基微调
    label_en: Vernier
  timebase.window_scale:
    type: float
    unit: S
    min: 2.0e-9
    max: 25.0
    default: 5.0e-7
    label: 缩放时基档位
    label_en: Zoom time/div
  timebase.window_position:
    type: float
    unit: S
    min: -500.0
    max: 500.0
    default: 0.0
    label: 缩放时基位置
    label_en: Zoom position
  trigger.mode:
    type: enum
    options: [EDGE, GLITch]
    default: EDGE
    label: 触发类型
    label_en: Trigger type
  trigger.sweep:
    type: enum
    options: [AUTO, NORMal]
    default: AUTO
    label: 触发方式
    label_en: Trigger mode
  trigger.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, EXTernal, LINE, WGEN]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4}
    default: CHANnel1
    label: 触发源
    label_en: Trigger source
  # 每个触发源各有自己的电平（手册 :TRIGger[:EDGE]:LEVel <level>[,<source>]，#248）。
  trigger.level1:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发电平 CH1
    label_en: Trigger level CH1
  trigger.level2:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发电平 CH2
    label_en: Trigger level CH2
  trigger.level3:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发电平 CH3
    label_en: Trigger level CH3
  trigger.level4:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发电平 CH4
    label_en: Trigger level CH4
  trigger.level5:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发电平 EXT
    label_en: Trigger level EXT
  # 双电平触发（欠幅、转换时间）的高/低电平，每个信源各一（#350）；这两种触发未建模，电平只保存回读。
  trigger.high1:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发高电平 CH1
    label_en: Trigger high level CH1
  trigger.high2:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发高电平 CH2
    label_en: Trigger high level CH2
  trigger.high3:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发高电平 CH3
    label_en: Trigger high level CH3
  trigger.high4:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发高电平 CH4
    label_en: Trigger high level CH4
  trigger.low1:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发低电平 CH1
    label_en: Trigger low level CH1
  trigger.low2:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发低电平 CH2
    label_en: Trigger low level CH2
  trigger.low3:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发低电平 CH3
    label_en: Trigger low level CH3
  trigger.low4:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 触发低电平 CH4
    label_en: Trigger low level CH4
  trigger.slope:
    type: enum
    options: [NEGative, POSitive, EITHer, ALTernate]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  # 脉宽（毛刺）触发 :TRIGger:GLITch（#956）：极性、条件与两个时间。时间的范围按手册
  # :TRIGger:GLITch:RANGe（Programmer's Guide 第 690 页，#1001）：“小于”15 ns 到 10 s，“大于”10 ns 到
  # 9.99 s。*RST 后为“小于 30 ns”、大于的时间 20 ns——没有对照手册的重置表，是 SimuBench 的假设
  # （覆盖表注明）。
  trigger.glitch_polarity:
    type: enum
    options: [NEGative, POSitive]
    default: POSitive
    label: 脉宽触发极性
    label_en: Pulse-width polarity
  trigger.glitch_qualifier:
    type: enum
    options: [GREaterthan, LESSthan, RANGe]
    default: LESSthan
    label: 脉宽触发条件
    label_en: Pulse-width qualifier
  trigger.glitch_less:
    type: float
    unit: S
    min: 1.5e-8
    max: 10.0
    default: 3.0e-8
    label: 脉宽小于
    label_en: Pulse width less than
  trigger.glitch_greater:
    type: float
    unit: S
    min: 1.0e-8
    max: 9.99
    default: 2.0e-8
    label: 脉宽大于
    label_en: Pulse width greater than
  trigger.coupling:
    type: enum
    options: [AC, DC, LFReject]
    default: DC
    label: 触发耦合
    label_en: Trigger coupling
  trigger.reject:
    type: enum
    options: ["OFF", LFReject, HFReject]
    default: "OFF"
    label: 触发抑制
    label_en: Trigger reject
  trigger.hfreject:
    type: bool
    default: false
    label: 高频抑制
    label_en: HF reject
  trigger.nreject:
    type: bool
    default: false
    label: 噪声抑制
    label_en: Noise reject
  trigger.holdoff:
    type: float
    unit: S
    min: 4.0e-8
    max: 10.0
    default: 4.0e-8
    label: 释抑时间
    label_en: Holdoff
  acquire.type:
    type: enum
    options: [NORMal, AVERage, HRESolution, PEAK]
    default: NORMal
    label: 采集方式
    label_en: Acquisition type
  acquire.count:
    type: int
    min: 2
    max: 65536
    default: 8
    label: 平均次数
    label_en: Averages
  acquire.mode:
    type: enum
    label: 采集模式
    label_en: Acquire mode
    options: [RTIMe, SEGMented]
    default: RTIMe
  # 分段存储（:ACQuire:MODE SEGMented，#957）：段数 2–25（*RST 后为 2，手册 :ACQuire? 的示例）、所选的段。
  acquire.segmented_count:
    type: int
    min: 2
    max: 25
    default: 2
    label: 分段数
    label_en: Segments
  acquire.segmented_index:
    type: int
    min: 1
    max: 25
    default: 1
    label: 当前段
    label_en: Segment index
  acquire.complete:
    type: int
    label: 采集完成判据
    label_en: Acquire complete
    min: 100
    max: 100
    default: 100
  waveform.source:
    type: enum
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    option_labels: {CHANnel1: CH1, CHANnel2: CH2, CHANnel3: CH3, CHANnel4: CH4}
    default: CHANnel1
    label: 波形传输源
    label_en: Waveform source
  waveform.format:
    type: enum
    options: [WORD, BYTE, ASCii]
    default: BYTE
    label: 波形格式
    label_en: Waveform format
  waveform.byteorder:
    type: enum
    label: 波形字节序
    label_en: Waveform byte order
    options: [LSBFirst, MSBFirst]
    default: MSBFirst
  waveform.unsigned:
    type: bool
    label: 波形无符号
    label_en: Waveform unsigned
    default: true
  waveform.points:
    type: int
    min: 100
    max: 1000000
    default: 1000
    label: 传输点数
    label_en: Waveform points
  waveform.points_mode:
    type: enum
    label: 波形点数模式
    label_en: Waveform points mode
    options: [NORMal, MAXimum, RAW]
    default: NORMal
  measure.source:
    type: enum
    label: 测量信源
    label_en: Measure source
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel1
  measure.show:
    type: bool
    default: true
    label: 测量标记显示
    label_en: Show measurement markers
  measure.window:
    type: enum
    options: [MAIN, ZOOM, AUTO]
    default: AUTO
    label: 测量窗口
    label_en: Measurement window
  measure.source2:
    type: enum
    label: 测量信源 2
    label_en: Measure source 2
    options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
    default: CHANnel2
  # :SYSTem 的界面与身份：前面板锁定、选件保护、软键菜单与显示文本都不改变数据；序列号与主机 ID
  # 是只读的身份串（手册的 *IDN? 与 :SYSTem:DIDentifier?）。
  system.lock:
    type: bool
    label: 前面板锁定
    label_en: Front panel lock
    default: false
  system.protection_lock:
    type: bool
    label: 保护锁定
    label_en: Protection lock
    default: false
  system.menu:
    type: enum
    label: 菜单
    label_en: Menu
    options: [MASK, MEASure, SEGMented, LISTer]
    default: MEASure
  system.display_text:
    type: string
    label: 屏幕文字
    label_en: Display text
    default: ""
  system.serial:
    # 只有一个取值的枚举：:SERial? 才按手册回“不带引号的字符串”（字符串状态会加引号）。
    type: enum
    label: 序列号
    label_en: Serial number
    options: [MY58260001]
    default: MY58260001
    readonly: true
  system.host_id:
    type: string
    label: 主机 ID
    label_en: Host ID
    default: "DSO-X 2024A,MY58260001,SIMUBENCH2024A"
    readonly: true
channel_state:
  display:
    type: bool
    default: false
    label: 显示
    label_en: Display
  # Display volts per division with the probe ratio (*RST: 5 V/div with the 10:1 probe = 40 V range).
  scale:
    type: float
    unit: V
    min: 1.0e-6
    max: 5.0e4
    default: 5.0
    label: 垂直档位
    label_en: Scale
  offset:
    type: float
    unit: V
    min: -1.0e6
    max: 1.0e6
    default: 0.0
    label: 偏置
    label_en: Offset
  coupling:
    type: enum
    options: [AC, DC]
    default: DC
    label: 耦合
    label_en: Coupling
  probe:
    type: float
    min: 0.001
    max: 10000.0
    default: 10.0
    special: {X1: 1.0, X10: 10.0, X20: 20.0, X100: 100.0}
    display_unit: "×"
    label: 探头衰减
    label_en: Probe
  bwlimit:
    type: bool
    default: false
    label: 带宽限制
    label_en: BW limit
  impedance:
    type: enum
    options: [ONEMeg]
    option_labels: {ONEMeg: "1 MΩ"}
    default: ONEMeg
    label: 输入阻抗
    label_en: Impedance
# 个体偏差（数据手册 5990-6618EN，按种子抽取，metrology-authoring.md 7）：直流增益精度 ±3% 满量程
# （≥ 10 mV/div）、±4%（< 10 mV/div）；直流偏置精度 ±0.1 格 ± 2 mV ± 1% 偏置设定；时基精度 25 ppm。
deviations:
  - param: front.gain_error_ppm
    by: {scale: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5]}
    limit: {0.001: 40000, 0.002: 40000, 0.005: 40000, 0.01: 30000, 0.02: 30000, 0.05: 30000, 0.1: 30000, 0.2: 30000, 0.5: 30000, 1: 30000, 2: 30000, 5: 30000}
    distribution: uniform
  - param: front.offset_error
    by: {scale: [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5]}
    limit: {0.001: 0.0021, 0.002: 0.0022, 0.005: 0.0025, 0.01: 0.003, 0.02: 0.004, 0.05: 0.007, 0.1: 0.012, 0.2: 0.022, 0.5: 0.052, 1: 0.102, 2: 0.202, 5: 0.502}
    distribution: uniform
  - param: front.dac_error_ppm
    limit: 10000.0
    distribution: uniform
  - param: timebase.clock_ppm
    limit: 25.0
    distribution: uniform
components:
  # 状态寄存器（#248）：触发事件（:TER?，读后清零，摘要进 *STB 位 0 TRG）、布防事件（:AER?）、
  # 操作状态（RUN / WAIT TRIG）。
  - name: ter
    type: status_register
    params: {bits: {TRG: 0}, enable: 1, summary_bit: 0, width: 1}
  - name: aer
    type: status_register
    params: {bits: {ARM: 0}, width: 1}
  - name: oper
    type: status_register
    params: {bits: {RUN: 3, WAIT: 5}, enable: $status.opee, summary_bit: 7, width: 15}
  # 示波器由通用模块组成（instrument-authoring.md 8.4）。
  - name: acq
    type: scope_acquisition
    params:
      digitize_stops: true  # :DIGitize 采完即停（手册），:RSTate? 回 STOP（#248）
      horizontal: timebase
      trigger: trigger
      adc: adc
      vertical: front
      probe: probe
      mode: $trigger.sweep
      auto: [AUTO]
      normal: [NORMal]
      # :DIGitize（与 :SINGle）采一条记录，完成后停止；运行中每次读取都取新的采集。
      reacquire: every_read
      missing: acquire
      untriggered: record
      trigger_jitter_s: 5.0e-11  # specs.trigger_jitter_s_rms: 0.1 × the 2 GSa/s sample interval (估计, #745)
      # :DIGitize 在记录填满后返回；*OPC? 等待未完成的操作（手册 *OPC）；没有触发时一直等（手册：
      # 用 device clear 中止进行中的 :DIGitize）。
      completion: pending
      opc_waits: true
      while_waiting: previous
      no_trigger: wait
      # :ACQuire:TYPE 的处理级（D46）：NORMal 原样、AVERage 取 count 次量化采集的均值、PEAK 在每个记录
      # 间隔内按 ADC 原生速率取至多 64 个码保留极值（记录速率跨过的窄脉冲进得来）、HRESolution 为
      # 8 个码（4^1.5）的 boxcar。手册只说高分辨率“扫速越慢平均的样点越多”，没有给系数：1.5 位是
      # SimuBench 的默认值（覆盖表注明）。
      processing: {from: $acquire.type, map: {AVERage: average, PEAK: peak, HRESolution: eres}, default: normal}
      # 分段存储（#957）：:ACQuire:MODE SEGMented 时，一次 :SINGle / :DIGitize 连续取 COUNt 次触发各存
      # 一段，全部采满才完成；:ACQuire:SEGMented:INDex 选的段供波形传输与测量使用。
      # 重新布防时间 19 µs 取自 2000 X 数据手册（5990-6618EN 第 18 页，Performance characteristics >
      # Acquisition modes > Segmented：“Re-arm time = 19 µs (minimum time between trigger events)”，#1005）。
      # 每段仍是整条 100 kpts 记录（真机每段的点数随段数减少，未建模）；存储上限取 25 段 × 100 kpts，
      # 与段数上限 25（手册 :ACQuire:SEGMented:COUNt：100K 存储至多 25 段）一致，所以本型号上
      # “超出存储”的 -221 不会出现，段数越界是 -222。
      # 手册 :ACQuire:TYPE（第 215 页）：分段模式下 AVERage 不可用；模型目前仍接受该组合（#1013）。
      segmented: {from: $acquire.mode, map: {SEGMented: true}, default: false}
      segments: $acquire.segmented_count
      segment_index: $acquire.segmented_index
      rearm_s: 1.9e-5
      memory_points: 2500000
      averages: $acquire.count
      eres_bits: 1.5
  # 时基：存储深度 100 kpts，采样率 = min(最高采样率, 存储深度 / 10 格)，取 1-2-5 档；参考位置 LEFT /
  # CENTer / RIGHt 为离左边 1 格、中央、离右边 1 格（手册 :TIMebase:REFerence）。
  - name: timebase
    type: scope_timebase
    params:
      scale: $timebase.scale
      delay: $timebase.position
      reference_divs: {from: $timebase.reference, map: {LEFT: 1.0, CENTer: 5.0, RIGHt: 9.0}}
      record_length: rate_ladder
      points: 100000
  # 边沿触发：AC 耦合为 10 Hz 高通，LFReject 耦合与 LFReject 抑制为 50 kHz 高通，HFReject 抑制与
  # :TRIGger:HFReject 为 50 kHz 低通（手册）；电平在信源屏幕中心 ±0.75 满量程（±6 格）内；释抑
  # 40 ns 到 10 s。迟滞取数据手册的触发灵敏度 0.6 格的一半；噪声抑制的迟滞加宽到 1 格（假设值）。
  # 脉宽触发（:TRIGger:MODE GLITch，#956）与边沿触发共用信源、每个信源的电平、耦合、抑制与释抑；
  # “小于”“范围”在脉冲的结束沿触发，“大于”在脉冲持续到该时间的时刻触发。
  - name: trigger
    type: scope_trigger
    params:
      mode: {from: $trigger.mode, map: {GLITch: glitch}, default: edge}
      polarity: {from: $trigger.glitch_polarity, map: {POSitive: positive, NEGative: negative}}
      qualifier: {from: $trigger.glitch_qualifier, map: {LESSthan: less, GREaterthan: greater, RANGe: range}}
      width_low: $trigger.glitch_greater
      width_high: $trigger.glitch_less
      source: $trigger.source
      level: $trigger.level1
      level_by_source:
        CHANnel1: trigger.level1
        CHANnel2: trigger.level2
        CHANnel3: trigger.level3
        CHANnel4: trigger.level4
        EXTernal: trigger.level5
      slope: $trigger.slope
      rising: [POSitive, EITHer, ALTernate]
      falling: [NEGative, EITHer, ALTernate]
      level_range_divs: 6.0
      coupling: $trigger.coupling
      reject: $trigger.reject
      hf_reject: $trigger.hfreject
      filters:
        AC: [[highpass, 10.0]]
        LFReject: [[highpass, 5.0e4]]
        HFReject: [[lowpass, 5.0e4]]
        HF: [[lowpass, 5.0e4]]
      hysteresis_divs: 0.3
      noise_reject: $trigger.nreject
      reject_hysteresis_divs: 1.0
      holdoff: $trigger.holdoff
      external: [EXTernal]
      line: [LINE]
  # ADC：8 位；BYTE 数据的 256 个码值对应屏幕的 8 格（手册：码值 1 与 255 表示削到屏幕底部与顶部），
  # 偏置为屏幕中心的电压。CH1/CH2 或 CH3/CH4 同开时不交织，最高 1 GSa/s。
  - name: adc
    type: scope_adc
    params:
      bits: 8
      codes_per_div: 32.0
      divs: 8.0
      offset_sign: subtract
      max_rate: 2.0e9
      max_rate_paired: 1.0e9
      rate_pairs: [[1, 2], [3, 4]]
  # 外触发输入 EXT TRIG：1 MΩ（*RST 表：外触发阻抗 1 MΩ，不可改）。
  - name: extin
    type: input_port
    params:
      z_in: 1.0e6
  - name: meas
    type: scope_measurements
    params:
      source: $measure.source
      invalid_value: "+9.9E+37"
      # DELay?/PHASe? 不给信源时用 :MEASure:SOURce 的两个（#350）。
      sources: [measure.source, measure.source2]
      # :TRIGger:LEVel:ASETup 写各通道的边沿触发电平（#350）。
      trigger_levels: {1: trigger.level1, 2: trigger.level2, 3: trigger.level3, 4: trigger.level4}
      # 屏幕测量列表（#373）：不带 ? 的测量命令把测量放上屏幕，最多 4 个，再加时挤出最旧的。
      slots: 4
      # :MEASure:ALL? 按这一顺序回一个信源上全部单源测量的当前值（顺序为模型约定，覆盖表注明）。
      all: [VPP, VMAX, VMIN, VAMPlitude, VTOP, VBASe, OVERshoot, PREShoot, VAVerage, VRMS, PERiod, FREQuency, RISetime, FALLtime, PWIDth, NWIDth, DUTYcycle, NDUTy, BRATe]
  # 系统：:SYSTem:PRESet 与 *RST 相同的预置（手册的 PRESet 重置条件与 *RST 表一致，仅“偏好”不同，
  # 仿真没有偏好设置）。
  - name: sys
    type: system
  - name: xfer
    type: waveform_transfer
    params:
      source: $waveform.source
      # :WAVeform:DATA?：#8 定长块。BYTE 为 8 位码、WORD 为左移到 16 位的码（手册），ASCii 为逗号分隔的伏特数；
      # 码 0 表示没有数据。:WAVeform:POINts 在屏幕记录上均匀取点（1000 取 500 即隔一个取一个，手册）；
      # NORMal 方式最多 1000 点。
      encoding: {from: $waveform.format, map: {WORD: block, BYTE: block, ASCii: ascii_block}}
      values: {from: $waveform.format, map: {ASCii: volts}, default: codes}
      digits: 6
      count: $waveform.points
      count_mode: spread
      max_points: {from: $waveform.points_mode, map: {NORMal: 1000}, default: 0}
      over_limit: truncate
      codes_per_div: 32.0
      adc_bits: 8
      width: {from: $waveform.format, map: {WORD: 16}, default: 8}
      offset: subtract
      unsigned: $waveform.unsigned
      reserve_lowest: true
      byteorder: $waveform.byteorder
      block_digits: 8
      # :WAVeform:PREamble?：format,type,points,count,xincrement,xorigin,xreference,yincrement,yorigin,yreference。
      header:
        encoding: text
        separator: ","
        fields:
          - {setting: waveform.format, map: {BYTE: 0, WORD: 1, ASCii: 4}}
          - {setting: acquire.type, map: {NORMal: 0, PEAK: 1, AVERage: 2, HRESolution: 3}}
          - {figure: points}
          - {setting: acquire.count, when: {acquire.type: AVERage}, else: 1}
          - {figure: x_increment, format: "%+.11E"}
          - {figure: x_start, format: "%+.11E"}
          - {value: 0}
          - {figure: y_increment, format: "%+.5E"}
          - {figure: y_origin, format: "%+.5E"}
          - {figure: y_reference}
channel_components:
  - name: inp
    type: input_port
    params:
      z_in: 1.0e6
      c_in: 1.1e-11
  # 档位 1 mV/div 到 5 V/div（探头 1:1 的输入端），偏置 ±2 V（≤ 200 mV/div）或 ±50 V（数据手册）；
  # 超出范围时取最近的合法值（手册 :CHANnel<n>:OFFSet）。带宽限制约 20 MHz（数据手册）。
  - name: front
    type: scope_vertical
    params:
      coupling: $ch.coupling
      bandwidth: 2.0e8
      bw_limit: $ch.bwlimit
      bw_limit_hz: 2.0e7
      ac_corner: 10.0
      scale: $ch.scale
      offset: $ch.offset
      probe_ratio: $ch.probe
      scale_range: [1.0e-3, 5.0]
      offset_ranges: [[0.2, 2.0], [.inf, 50.0]]
      out_of_range: clamp
      # 每档噪声（specs.noise_per_division，估计，D46/#745）：数据手册未给分档噪声；灵敏档取
      # 0.2 mV 的输入噪声底，高档按 0.02 格线性增大。
      noise_table: [[1.0e-3, 2.0e-4], [2.0e-3, 2.0e-4], [5.0e-3, 2.0e-4], [1.0e-2, 2.0e-4],
                    [2.0e-2, 4.0e-4], [5.0e-2, 1.0e-3], [1.0e-1, 2.0e-3], [2.0e-1, 4.0e-3],
                    [5.0e-1, 1.0e-2], [1.0, 2.0e-2], [2.0, 4.0e-2], [5.0, 1.0e-1]]
  # 改探头比时，刻度与偏置随之乘以探头比（手册 :CHANnel<n>:SCALe）。
  - name: probe
    type: scope_probe
    params:
      ratio: $ch.probe
      rescales: [$ch.scale, $ch.offset]
wiring:
  channel:
    - [inp.out, front.in]
    - [front.out, probe.in]
  instrument:
    - ["ch{n}.probe.out", "acq.in{n}"]
    - [extin.out, trigger.ext]
ports:
  channel:
    "CH{n}": inp.pin
  instrument:
    EXT: extin.pin
display:
  template: oscilloscope
  summary: [timebase.scale, trigger.source, trigger.slope]
  channel_summary: [display, scale, offset, coupling, probe]
capabilities: [oscilloscope]
# 设置之间的约束（#1013，D69）。Programmer's Guide 02.66 :ACQuire:TYPE（第 215 页）：“The AVERage type is
# not available when in segmented memory mode”。手册没给错误码，也没说先 AVERage 再切到 SEGMented 时
# 怎样：两个方向都拒绝、报 -221 Settings conflict，是 SimuBench 的假设（覆盖表注明）。
constraints:
  - when: {acquire.mode: SEGMented}
    forbid: {acquire.type: [AVERage]}
    action: refuse
    error: -221
    source: "Programmer's Guide 02.66, :ACQuire:TYPE, p. 215"
commands:
  # ---- Common ----
  # 手册 *TRG：“与不带参数的 :DIGitize 相同”。
  - {header: "*TRG", op: acq.digitize, query: false}
  # ---- Root ----
  - {header: ":TER", op: ter.event, set: false}
  - {header: ":AER", op: aer.event, set: false}
  - {header: ":RSTate", op: acq.run_state, set: false}
  - {header: ":OPEE", state: status.opee}
  - {header: ":OPERegister:CONDition", op: oper.condition, set: false}
  - {header: ":OPERegister[:EVENt]", op: oper.event, set: false}
  - {header: ":RUN", op: acq.run, query: false}
  - {header: ":STOP", op: acq.stop, query: false}
  - {header: ":SINGle", op: acq.digitize, query: false}
  - header: ":DIGitize"
    op: acq.digitize
    query: false
    params: [{name: sources, type: raw}]
  # 手册 :SERial? 回不带引号的序列号（与 *IDN? 中的同一个值）。
  - {header: ":SERial", state: system.serial, set: false}
  # ---- ACQuire ----
  - {header: ":ACQuire:TYPE", state: acquire.type}
  - {header: ":ACQuire:COUNt", state: acquire.count}
  - {header: ":ACQuire:MODE", state: acquire.mode}
  - {header: ":ACQuire:COMPlete", state: acquire.complete}
  - {header: ":ACQuire:POINts", op: acq.figure, args: {what: points, integer: true}, set: false}
  - {header: ":ACQuire:SRATe", op: acq.figure, args: {what: sample_rate, significant: 3}, set: false}
  - {header: ":ACQuire:SEGMented:COUNt", state: acquire.segmented_count, format: {integer: signed}}
  - {header: ":ACQuire:SEGMented:INDex", state: acquire.segmented_index, format: {integer: signed}}
  - {header: ":ACQuire:SEGMented:ANALyze", op: acq.analyze_segments, query: false}
  # 手册“Reporting the Setup”的 *RST 示例回复。
  - header: ":ACQuire"
    state: acquire.mode
    set: false
    reply: ":ACQ:MODE {acquire.mode};TYPE {acquire.type};COMP {acquire.complete};COUNT {acquire.count};SEGM:COUN {acquire.segmented_count}"
  # ---- CHANnel<n> ----
  - {header: ":CHANnel<ch>:SCALe", state: ch.scale, format: {number: engineering, significant: 3}}
  - {header: ":CHANnel<ch>:RANGe", state: ch.scale, factor: 8.0, format: {number: engineering, significant: 3}}
  - {header: ":CHANnel<ch>:OFFSet", state: ch.offset, format: {number: engineering, significant: 6}}
  - {header: ":CHANnel<ch>:COUPling", state: ch.coupling}
  - {header: ":CHANnel<ch>:PROBe", state: ch.probe, format: {number: engineering, significant: 2}}
  - {header: ":CHANnel<ch>:BWLimit", state: ch.bwlimit}
  - {header: ":CHANnel<ch>:DISPlay", state: ch.display}
  - {header: ":CHANnel<ch>:IMPedance", state: ch.impedance}
  # ---- MEASure ----
  # 屏幕测量列表（#373）
  - {header: ":MEASure:RESults", op: meas.results, set: false}
  - {header: ":MEASure:CLEar", op: meas.clear_list, query: false}
  - {header: ":MEASure:ALL", op: meas.all, set: false, params: [{name: source, type: raw}]}
  - {header: ":MEASure:SHOW", state: measure.show}
  - {header: ":MEASure:WINDow", state: measure.window}
  - header: ":MEASure:SOURce"
    params:
      - {name: source1, type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], state: measure.source}
      - {name: source2, type: enum, options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4], optional: true, state: measure.source2}
    reply: "{measure.source},{measure.source2}"
  - {header: ":MEASure:VPP", op: meas.measure, args: {what: VPP}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VMAX", op: meas.measure, args: {what: VMAX}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VMIN", op: meas.measure, args: {what: VMIN}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VAMPlitude", op: meas.measure, args: {what: VAMPlitude}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VAVerage", op: meas.measure, args: {what: VAVerage}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VRMS", op: meas.measure, args: {what: VRMS}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:FREQuency", op: meas.measure, args: {what: FREQuency}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PERiod", op: meas.measure, args: {what: PERiod}, params: [{name: source, type: raw}]}
  # 波形形状（#248）：顶/底值、过冲/预冲（%）、10–90 % 上升/下降时间、中间电平处的脉宽与占空比、
  # 记录上的边沿与脉冲计数。
  - {header: ":MEASure:VTOP", op: meas.measure, args: {what: VTOP}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VBASe", op: meas.measure, args: {what: VBASe}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:OVERshoot", op: meas.measure, args: {what: OVERshoot}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PREShoot", op: meas.measure, args: {what: PREShoot}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:RISetime", op: meas.measure, args: {what: RISetime}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:FALLtime", op: meas.measure, args: {what: FALLtime}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PWIDth", op: meas.measure, args: {what: PWIDth}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:NWIDth", op: meas.measure, args: {what: NWIDth}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:DUTYcycle", op: meas.measure, args: {what: DUTYcycle}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:NDUTy", op: meas.measure, args: {what: NDUTy}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PEDGes", op: meas.measure, args: {what: PEDGes}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:NEDGes", op: meas.measure, args: {what: NEDGes}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PPULses", op: meas.measure, args: {what: PPULses}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:NPULses", op: meas.measure, args: {what: NPULses}, params: [{name: source, type: raw}]}
  # 时间测量（#350）：相对触发点的时间，中间电平；VTIMe/TEDGe/TVALue 带参数，DELay/PHASe 取两个信源。
  - {header: ":MEASure:XMAX", op: meas.measure, args: {what: XMAX}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:XMIN", op: meas.measure, args: {what: XMIN}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:BRATe", op: meas.measure, args: {what: BRATe}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:VTIMe", op: meas.at, set: false, args: {what: VTIMe}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:TEDGe", op: meas.at, set: false, args: {what: TEDGe}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:TVALue", op: meas.at, set: false, args: {what: TVALue}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:DELay", op: meas.pair, set: false, args: {what: DELay}, params: [{name: source, type: raw}]}
  - {header: ":MEASure:PHASe", op: meas.pair, set: false, args: {what: PHASe}, params: [{name: source, type: raw}]}
  # ---- TIMebase ----
  - {header: ":TIMebase:SCALe", state: timebase.scale, format: {number: engineering, significant: 3}}
  - {header: ":TIMebase:RANGe", state: timebase.scale, factor: 10.0, format: {number: engineering, significant: 3}}
  - {header: ":TIMebase:POSition", state: timebase.position, format: {number: engineering, significant: 2}}
  - {header: ":TIMebase:REFerence", state: timebase.reference}
  - {header: ":TIMebase:MODE", state: timebase.mode}
  - {header: ":TIMebase:VERNier", state: timebase.vernier}
  - {header: ":TIMebase:WINDow:SCALe", state: timebase.window_scale, format: {number: engineering, significant: 3}}
  - {header: ":TIMebase:WINDow:RANGe", state: timebase.window_scale, factor: 10.0, format: {number: engineering, significant: 3}}
  - {header: ":TIMebase:WINDow:POSition", state: timebase.window_position, format: {number: engineering, significant: 2}}
  # ---- TRIGger ----
  - {header: ":TRIGger:MODE", state: trigger.mode}
  - {header: ":TRIGger:FORCe", op: acq.force_trigger, query: false}
  - {header: ":TRIGger:SWEep", state: trigger.sweep}
  - {header: ":TRIGger:NREJect", state: trigger.nreject}
  - {header: ":TRIGger:HFReject", state: trigger.hfreject}
  - {header: ":TRIGger:HOLDoff", state: trigger.holdoff, format: {number: engineering, significant: 15}}
  - {header: ":TRIGger[:EDGE]:SOURce", state: trigger.source}
  - header: ":TRIGger:LEVel:HIGH"
    format: {number: engineering, significant: 6}
    params:
      - {name: level, type: float, unit: V, state: "trigger.high{source}"}
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}
        index_default: $trigger.source
        echo: false
        optional: true
  - header: ":TRIGger:LEVel:LOW"
    format: {number: engineering, significant: 6}
    params:
      - {name: level, type: float, unit: V, state: "trigger.low{source}"}
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}
        index_default: $trigger.source
        echo: false
        optional: true
  - {header: ":TRIGger:LEVel:ASETup", op: meas.auto_trigger_levels, query: false}
  - header: ":TRIGger[:EDGE]:LEVel"
    format: {number: engineering, significant: 6}
    params:
      - {name: level, type: float, unit: V, state: "trigger.level{source}"}
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, EXTernal]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4, EXTernal: 5}
        index_default: $trigger.source
        echo: false
        optional: true
    doc: 不给信源时写当前触发源的电平；每个信源各有自己的电平（#248）。
  - header: ":VIEW"
    params:
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}
    writes: {"ch{source}.display": true}
    query: false
    doc: 打开参数指定的通道（#248）。
  - header: ":BLANk"
    params:
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}
    writes: {"ch{source}.display": false}
    query: false
    doc: 关闭参数指定的通道（#248）。
  - header: ":STATus"
    set: false
    params:
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4}
        echo: false
      - {name: shown, type: bool, state: "ch{source}.display"}
    doc: 参数指定的通道是否显示（#248）。
  - {header: ":TRIGger[:EDGE]:SLOPe", state: trigger.slope}
  - {header: ":TRIGger[:EDGE]:COUPling", state: trigger.coupling}
  - {header: ":TRIGger[:EDGE]:REJect", state: trigger.reject}
  # 脉宽触发（#956）。信源与电平和边沿触发是同一组设置。
  - {header: ":TRIGger:GLITch:SOURce", state: trigger.source}
  - header: ":TRIGger:GLITch:LEVel"
    format: {number: engineering, significant: 6}
    params:
      - {name: level, type: float, unit: V, state: "trigger.level{source}"}
      - name: source
        type: enum
        options: [CHANnel1, CHANnel2, CHANnel3, CHANnel4, EXTernal]
        index: true
        index_words: {CHANnel1: 1, CHANnel2: 2, CHANnel3: 3, CHANnel4: 4, EXTernal: 5}
        index_default: $trigger.source
        echo: false
        optional: true
  - {header: ":TRIGger:GLITch:POLarity", state: trigger.glitch_polarity}
  - {header: ":TRIGger:GLITch:QUALifier", state: trigger.glitch_qualifier}
  - {header: ":TRIGger:GLITch:LESSthan", state: trigger.glitch_less, format: {number: engineering, significant: 6}}
  - {header: ":TRIGger:GLITch:GREaterthan", state: trigger.glitch_greater, format: {number: engineering, significant: 6}}
  - header: ":TRIGger:GLITch:RANGe"
    format: {number: engineering, significant: 6}
    params:
      - {name: less_than, type: float, unit: S, state: trigger.glitch_less}
      - {name: greater_than, type: float, unit: S, state: trigger.glitch_greater}
    # 手册第 690 页：“You can enter the parameters in any order — the smaller value becomes the
    # <greater_than_time> and the larger value becomes the <less_than_time>.”（#1001）
    order: {ascending: [greater_than, less_than]}
    doc: 两个时间顺序任意：较大的写到“小于”（上限），较小的写到“大于”（下限）；就是 :LESSthan 与 :GREaterthan 的设置，查询先回“小于”。
  # ---- WAVeform ----
  - {header: ":WAVeform:SOURce", state: waveform.source}
  - {header: ":WAVeform:FORMat", state: waveform.format}
  - {header: ":WAVeform:BYTeorder", state: waveform.byteorder}
  - {header: ":WAVeform:UNSigned", state: waveform.unsigned}
  - {header: ":WAVeform:POINts", state: waveform.points, format: {integer: signed}}
  - {header: ":WAVeform:POINts:MODE", state: waveform.points_mode, format: {enum: as_defined}}
  - {header: ":WAVeform:PREamble", op: xfer.header, set: false}
  - {header: ":WAVeform:DATA", op: xfer.data, set: false}
  - {header: ":WAVeform:TYPE", state: acquire.type, set: false}
  # 分段存储（#957）：采到的段数、所选的段相对第 1 段的触发时刻。
  - {header: ":WAVeform:SEGMented:COUNt", op: acq.figure, args: {what: segments}, set: false}
  - {header: ":WAVeform:SEGMented:TTAG", op: acq.figure, args: {what: time_tag, format: "%+.11E"}, set: false}
  - {header: ":WAVeform:XINCrement", op: xfer.figure, set: false, args: {what: x_increment, format: "%+.11E"}}
  - {header: ":WAVeform:XORigin", op: xfer.figure, set: false, args: {what: x_start, format: "%+.11E"}}
  - {header: ":WAVeform:XREFerence", op: xfer.figure, set: false, args: {what: x_reference}}
  - {header: ":WAVeform:YINCrement", op: xfer.figure, set: false, args: {what: y_increment, format: "%+.5E"}}
  - {header: ":WAVeform:YORigin", op: xfer.figure, set: false, args: {what: y_origin, format: "%+.5E"}}
  - {header: ":WAVeform:YREFerence", op: xfer.figure, set: false, args: {what: y_reference}}
  # ---- SYSTem ----
  # 手册 PRESet 与 *RST 的重置条件相同，只有“偏好”（仿真没有）不同。
  - {header: ":SYSTem:PRESet", op: sys.reset, query: false}
  # :SYSTem:DIDentifier? 回带引号的主机 ID（手册：格式因产品而异，示例为型号、序列号、主机 ID）。
  - {header: ":SYSTem:DIDentifier", state: system.host_id, set: false}
  # 前面板锁定、50 Ω 保护锁与软键菜单只影响界面：保存并回读，不改变数据。
  - {header: ":SYSTem:LOCK", state: system.lock}
  - {header: ":SYSTem:PROTection:LOCK", state: system.protection_lock}
  - {header: ":SYSTem:MENU", state: system.menu, query: false}
  - {header: ":SYSTem:DSP", state: system.display_text, query: false}
