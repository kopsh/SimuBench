# Fluke 8588A 的覆盖表：命令按 8588A/8558A Remote Programmer's Manual（March 2019）的 Table 3、
# Table 5、Table 6、Table 10、Table 11 与 Trigger Subsystem 逐条列出；程度与说明手写。
schema: simubench.coverage/1
model: fluke-8588a
sections:
- section: IEEE 488.2 common commands
  commands:
  - header: '*IDN'
    level: implemented
    note: FLUKE,8588A,<10 位序列号>,<固件>（手册 GPIB 一节的 Note）。
  - header: '*RST'
    level: implemented
    note: 恢复 *RST 值：DCV、1000 V 量程、自动量程 OFF、Auto 孔径（1 s）、Auto 输入阻抗、INIT:CONT OFF、字节序 SWAPped；错误队列不受影响。
  - header: '*CLS'
    level: implemented
    note: 清事件寄存器与错误队列。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器（Table 9 的位）。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器。
  - header: '*STB'
    level: implemented
    note: 状态字节；QUES/OPER 汇总位无来源（STATus 子系统未实现）。
  - header: '*OPC'
    level: implemented
    note: '*OPC 在操作完成时置 ESR 位 0；*OPC? 等运行结束后回 1。'
  - header: '*WAI'
    level: implemented
    note: 等待全部待完成操作。
  - header: '*TRG'
    level: implemented
    note: 总线触发：TRIGger:SOURce BUS 且等待触发时取一个读数，否则 -211。
  - header: '*TST'
    level: implemented
    note: 自检通过回复 0。
  - header: '*OPT'
    level: not_modeled
    note: 选件串未实现。
  - header: '*PSC'
    level: not_modeled
    note: 上电状态清零未实现。
- section: Measurement commands (CONFigure, MEASure, READ?, FETCh?)
  commands:
  - header: :CONFigure:VOLTage[:DC]
    level: implemented
    note: 选直流电压，量程/分辨率可选（不给量程时量程不变，给了即关自动量程；分辨率 DEF 为 1E-4）；触发系统按 Note 1 置 INIT:CONT OFF、TRIG:SOUR IMM、COUN
      1、DEL 0、DEL:AUTO OFF。ARM 层固定为 IMMediate、计数 1（未实现）。
  - header: :CONFigure:VOLTage:AC
    level: implemented
    note: 同直流电压；交流通路 1 MΩ、RMS 滤波按 VOLT:AC:FILTer。
  - header: :CONFigure:CURRent[:DC]
    level: implemented
    note: 选直流电流；输入并入规格书的输入阻抗（10 µA 量程 100 Ω … 30 A 量程 10 mΩ），读数由电路求解。分辨率 DEF 1E-6。
  - header: :CONFigure:CURRent:AC
    level: implemented
    note: 交流电流（真有效值），分流同直流；分辨率 DEF 1E-5。
  - header: :CONFigure:RESistance
    level: implemented
    note: 两线电阻：按方式、低电流与量程送规格书的测量电流，读 V/I；分辨率 DEF 0.01。
  - header: :CONFigure:FRESistance
    level: implemented
    note: 四线电阻：测量电流经 INPUT HI，电压读 SENSE HI（未接时读 INPUT）。
  - header: :CONFigure:CAPacitance
    level: not_modeled
    note: 该功能未实现。
