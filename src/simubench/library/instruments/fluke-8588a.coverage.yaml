- section: 'SENSe subsystem: DC current'
  commands:
  - header: '[:SENSe]:CURRent[:DC]:APERture'
    level: implemented
    note: 孔径时间（0–10 s）各功能共用一个设定；只在 APERture:MODE MANual 时决定读数时间。设定孔径不自动切到 MANual。
  - header: '[:SENSe]:CURRent[:DC]:APERture:MODE'
    level: implemented
    note: AUTO（默认）/ FAST / MANual：读数时间分别取 1 s、0.2 s（Operators Manual Table 8 的 7 位分辨率一行，不随分辨率变）与手动孔径。各功能共用。
  - header: '[:SENSe]:CURRent[:DC]:NPLC'
    level: implemented
    note: 按 50 Hz 电源周期换算的孔径（NPLC = 孔径 × 50，0–500，*RST 为 50）；与 APERture 是同一设定。
  - header: '[:SENSe]:CURRent[:DC]:RANGe:AUTO[:STATe]'
    level: implemented
    note: 自动量程：超过满度（2.02 倍标称）升档、低于 0.19 倍标称降档；各功能共用一个设定（*RST 为 OFF）。
  - header: '[:SENSe]:CURRent[:DC]:RANGe'
    level: implemented
    note: 10 µA–30 A；要测的最大值：按满度 = 标称 × 2.02 选最小能测的量程（手册：2.03–20.02 选 10 V）；RANGe? [MIN|MAX|DEF]。查询返回设定值（真机返回所选量程）；自动量程开着时设定量程不关闭它（CONFigure
      / MEASure 给量程时才关闭）。
  - header: '[:SENSe]:CURRent[:DC]:RESolution'
    level: implemented
    note: 分辨率保存并由 CONFigure? 返回；读数不按它量化（读数 9 位尾数），也不改变 Auto 孔径。MIN/MAX 取值随量程而定，未建模（-224）。各功能共用一个设定。
