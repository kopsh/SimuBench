  - header: '[:SENSe]:FUNCtion'
    level: implemented
    note: 字符串参数，长短格式与节点混写均可（"VOLT:AC" 与 "VOLTage:AC"）；VOLTage 与 VOLTage:DC 同义，查询回带引号的短格式（"VOLT"）。电容、数字化、频率、周期、功率、温度与外接分流功能报
