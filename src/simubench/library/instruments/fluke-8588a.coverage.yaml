  - header: :READ
    level: implemented
    note: = ABORt; INITiate; FETCh?；BUS/EXTernal 触发源下报 -214。
  - header: :FETCh
    level: implemented
    note: 本次运行的全部读数（TRIG:COUN 个），不删除；FETCh? 1 同主读数。次读数（2）、扫描前/后端子（3、4）与时间戳（5）未实现，报 -222。
  - header: :FNOW
    level: not_modeled
    note: 取出并删除读数存储的读数未实现。
  - header: :TALK
    level: not_modeled
    note: 3458A 兼容的 GPIB 讲模式未实现。
- section: CALCulate subsystem
  commands:
  - header: CALCulate:AVERage[:STATe]
    level: implemented
    note: '读数后处理（#1041，reading_math）的平均：作用于 READ?/FETCh?/MEASure? 的读数；在数学运算之前。'
  - header: CALCulate:AVERage:COUNt
    level: implemented
    note: '1–10000。默认取 Table 6 的 16；Remote Command Examples 的 *RST 状态写“CALCulate:AVERage = 1, OFF”，两处不一致。'
  - header: CALCulate:AVERage:TCONtrol
    level: implemented
    note: 'MOVing：每个读数是最近 N 个的平均，设置改变或新的一次测量（READ?、INITiate、MEASure?）后窗口重新累积；REPeat：每个读数取 N 个新读数的平均（噪声按 √N 下降），一个读数的虚拟时间为 N 倍。'
  - header: CALCulate:LIMit:CLEar[:IMMediate]
    level: implemented
    note: '清除越限标志。'
  - header: CALCulate:LIMit:LOWer
    level: implemented
    note: '默认 -1.99999999E+15（Table 6）。'
  - header: CALCulate:LIMit:LOWer:STATe
    level: implemented
  - header: CALCulate:LIMit:FAIL
    level: implemented
    note: '读数在开启的上/下限之外后为 1，保持到 CLEar；越限时发出状态事件 LIMIT（本定义的状态寄存器未使用它）。超量程读数（±9.9E+37）按其值判定：正超量程超出开启的上限、负超量程低于开启的下限（#1044；手册未写明，模型取此行为）。'
  - header: CALCulate:LIMit[:STATe]
    level: implemented
    note: '限值检查在数学运算与单位换算之后的读数上进行。'
  - header: CALCulate:LIMit:UPPer
    level: implemented
    note: '默认 +1.999999999E+15（Table 6 原文截断为 +1.999999999e，按 LOWer 补全）；9 位尾数回复为 +2.00000000E+15。'
  - header: CALCulate:LIMit:UPPer:STATe
    level: implemented
  - header: CALCulate:MATH:CFACtor
    level: implemented
    note: '默认 1（Table 6）；LREading 取上一个读数（平均后、数学运算前）为因子，写入时取定，之后不随读数变化；上电或 *RST 后尚无读数时报 -230，因子不变（#1043）。'
  - header: CALCulate:MATH:CFACtor:STATe
    level: implemented
  - header: CALCulate:MATH:MFACtor
    level: implemented
    note: '默认 1；LREading 同 CFACtor（#1043）。'
  - header: CALCulate:MATH:MFACtor:STATe
    level: implemented
  - header: CALCulate:MATH:MUNits
    level: implemented
    note: 'PERCent = 100·(mx − c)/z；DB = 20·log10|(mx − c)/z|；DB50/75/600 = 10·log10(y²/R/1 mW)。Table 6 的默认值是排版错误（写成数值），取 PERCent（SimuBench 值）。'
  - header: CALCulate:MATH:MUNits:STATe
    level: implemented
  - header: CALCulate:MATH[:STATe]
    level: implemented
    note: '(m·x − c)/z，各因子由各自的 :STATe 打开。'
  - header: CALCulate:MATH:RESet
    level: implemented
    note: 'm、c、z 回到默认值 1；各因子的 :STATe 不变。'
  - header: CALCulate:MATH:ZFACtor
    level: implemented
    note: '默认 1；LREading 同 CFACtor（#1043）；z = 0 时读数报 -222。'
  - header: CALCulate:MATH:ZFACtor:STATe
    level: implemented
  - header: CALCulate:SSTatistics:AVERage
    level: implemented
    note: '统计的是本次测量（READ?、INITiate、MEASure? 开始一次新的）以来经过后处理的读数，不是对读数存储器重算；FETCh? 再取同一次运行的读数不重复计入；超量程读数不计入；STATe 由关到开时清空。'
  - header: CALCulate:SSTatistics:COUNt
    level: implemented
  - header: CALCulate:SSTatistics:MAXimum
    level: implemented
  - header: CALCulate:SSTatistics:MINimum
    level: implemented
  - header: CALCulate:SSTatistics:SDEViation
    level: implemented
    note: '样本标准差（n − 1）；设置形式 SDEViation PPM（以 ppm 表示）未实现，只有查询。'
  - header: CALCulate:SSTatistics:SPAN
    level: implemented
    note: '最大值 − 最小值。'
  - header: CALCulate:SSTatistics:STATe
    level: implemented
