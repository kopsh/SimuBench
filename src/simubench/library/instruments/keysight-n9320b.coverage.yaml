    note: 'POSition or DELTa; DELTa fixes a reference marker where the marker is, Y? then reads the level difference in dB (#274). A marker that is off turns on first (screen center) and the reference is fixed at that same point, so the delta pair starts at 0/0 (#349). Whether re-sending DELTa while already in DELTa fixes the reference again is not verifiable from the manuals at hand; the model does not re-fix it.'
