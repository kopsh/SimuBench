- section: TRACe Subsystem
  commands:
  - header: :TRACe<t>:MODE
    level: implemented
    note: 'One trace: TRACe1..4 all select trace 1. AVERage, MAXHold and WRITe only; MINHold/VIEW/BLANK are not modeled.'
  - header: :TRACe[:DATA]
    level: implemented
    note: 'Trace 1 only; 1001 points in dBm, seven decimals. Analytic evaluation (specan_trace evaluation: analytic): the trace includes the front end of the data sheet (5990-8119EN p.4-5, #960): noise figure from the typical DANL and second/third-order intercepts and 1 dB compression, each for the band holding the center frequency; SSB phase noise of the 1 GHz table around every line. The frequency response is a per-unit deviation within the band limits of the data sheet (p.3, preamp-off limits, 0 at 50 MHz; deviation: from_specs), and the preamplifier is option P03. Not modeled: input-related spurious and residual responses (the data sheet gives no frequencies or mixing orders).'
  - header: :TRACe:MATH:OFF
    level: not_modeled
    note: 'Blocked by C6 (product-plan.md 4.2): trace math (add/subtract/normalize).'
    gap: blocked
