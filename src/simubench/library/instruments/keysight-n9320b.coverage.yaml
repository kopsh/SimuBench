- section: SENSe Subsystem
  commands:
  - header: '[:SENSe]:FREQuency:CENTer'
    level: implemented
    note: >-
      Numeric value only; UP/DOWN and the negative part of the guide range (-80 MHz) are not
      modeled. A center frequency the window cannot hold at the current span keeps the center and
      narrows the span to fit (#292), so *RST; :FREQ:CENT 10 MHz; :FREQ:SPAN 2 MHz works in that
      order.
  - header: '[:SENSe]:FREQuency:SPAN'
    level: implemented
    note: Zero span (span 0) is not modeled; the state range starts at 10 Hz.
  - header: '[:SENSe]:FREQuency:STARt'
    level: implemented
    note: The negative part of the guide range (-80 MHz) is not modeled.
  - header: '[:SENSe]:FREQuency:STOP'
    level: implemented
    note: Stop frequencies above the center range are accepted as long as the center stays in range.
  - header: '[:SENSe]:BANDwidth[:RESolution]:AUTO'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BWIDth[:RESolution]:AUTO'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BANDwidth[:RESolution]'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BWIDth[:RESolution]'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BANDwidth:VIDeo:AUTO'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BWIDth:VIDeo:AUTO'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BANDwidth:VIDeo'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:BWIDth:VIDeo'
    level: implemented
    note: The guide writes BANDwidth|BWIDth; both spellings are declared.
  - header: '[:SENSe]:SWEep:TIME:AUTO'
    level: implemented
  - header: '[:SENSe]:SWEep:TIME'
    level: implemented
    note: >-
      Automatic sweep time is the larger of the RBW/VBW settling time and the LO sweep rate floor
      (#292): 100.2 ms at the reset full span, as the guide's reset table says. The LO rate is
      derived from that value; the guide does not state it.
  - header: '[:SENSe]:POWer[:RF]:ATTenuation:AUTO'
    level: implemented
  - header: '[:SENSe]:POWer[:RF]:ATTenuation'
    level: implemented
    note: >-
      Automatic attenuation holds the reference level at the -20 dBm mixer limit in 2 dB steps
      (#292): 20 dB at the 0 dBm reset reference level, as the guide's reset table says.
  - header: '[:SENSe]:DETector[:FUNCtion]'
    level: implemented
    note: POSitive/SAMPle/AVERage/RMS; NEGative and NORMAL are not modeled.
  - header: '[:SENSe]:AVERage:COUNt'
    level: implemented
    note: The count of the average trace mode (:TRACe:MODE AVERage).
