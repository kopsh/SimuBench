  - header: '[:SENSe]:SWEep:TIME:AUTO'
    level: implemented
  - header: '[:SENSe]:SWEep:TIME'
    level: implemented
    note: >-
      Automatic sweep time is the larger of the RBW/VBW settling time and the LO sweep rate floor
      (#292): 100.2 ms at the reset full span, as the guide's reset table says. The LO rate is
      derived from that value; the guide does not state it.
  - header: '[:SENSe]:POWer[:RF]:ATTenuation:AUTO'
    level: implemented
  - header: '[:SENSe]:POWer[:RF]:ATTenuation'
    level: implemented
    note: >-
      Automatic attenuation holds the reference level at the -20 dBm mixer limit in 2 dB steps
      (#292): 20 dB at the 0 dBm reset reference level, as the guide's reset table says.
  - header: '[:SENSe]:DETector[:FUNCtion]'
    level: implemented
    note: POSitive/SAMPle/AVERage/RMS; NEGative and NORMAL are not modeled.
