schema: simubench.instrument/1
id: keysight-53230a
manufacturer: Keysight Technologies
model: 53230A
extends: keysight-53220a
class: frequency_counter
description: >-
  Keysight 53230A，350 MHz 双通道通用频率计数器/计时器（53200 系列顶配：20 ps 单次分辨率、
  1 µs 门时间、无间隙连续测量与时间戳）。Real model（D42）：命令、参数范围、*RST 默认值与
  返回格式按 53220A/53230A User's Guide（53220-90001，Edition 3，September 1, 2017）的第 3–8 章；
  与 53220A 同一手册与命令集，定义从 keysight-53220a 出发，差异是 53230A 的门时间下限、单次
  分辨率与 SENSe:FREQuency:MODE（CONTinuous 为无间隙连续测量，由 counter_timebase 承担）。
  时间戳（CONFigure/MEASure:ARRay:TSTamp，比例因子 + 相邻间隔，#385）已实现；派生测量与 Option 150
  脉冲/突发测量在覆盖表中标未实现。
reference:
  title: Keysight 53220A/53230A 350 MHz Universal Frequency Counter/Timer User's Guide
  document: "53220-90001"
  version: Edition 3, September 1, 2017
  firmware: "手册适用于 53230A 固件 3.0 或更高；*IDN? 无示例，序列号与固件串待真机核对"
identity:
  idn: "Keysight Technologies,53230A,{serial},{firmware}"
  # 序列号与固件串按 Keysight 的 *IDN? 四字段格式；手册没有示例（待真机核对）。
  serial: MY53005678
  firmware: "3.00"
specs:
  source: 53220A/53230A User's Guide（53220-90001，Edition 3，September 1, 2017）
  gate_time_s: {53230A: [1.0e-6, 1000.0]}
  single_shot_resolution_s: 2.0e-11
  resolution_digits_53230a:
    auto_continuous: {"1us": 4.7, "10us": 5.7, "100us": 6.7, "1ms": 7.7, "10ms": "up to 10", "100ms": "up to 11", "1s": "up to 12", "10s": "up to 13", "100s": "up to 14", "1000s": "up to 15"}
    reciprocal: {"1us": 4.7, "10us": 5.7, "100us": 6.7, "1ms": 7.7, "10ms": 8.7, "100ms": 9.7, "1s": 10.7, "10s": 11.7, "100s": 12.7, "1000s": 13.7}
  timestamp_rate_hz: [10.0e3, 100.0e3, 800.0e3, 1.0e6]
state:
  function:
    type: enum
    options: [FREQuency, PERiod, TOTalize, TINTerval, TSTamp]
    default: FREQuency
    label: 测量功能
    label_en: Function
    option_labels:
      FREQuency: 频率
      PERiod: 周期
      TOTalize: 累加
      TINTerval: 时间间隔
      TSTamp: 时间戳
  gate.time:
    type: float
    unit: S
    min: 1.0e-6
    max: 1000.0
    default: 0.1
    label: 门时间
    label_en: Gate time
  measure.mode:
    type: enum
    options: [AUTO, RECiprocal, CONTinuous]
    default: AUTO
    label: 测量方式
    label_en: Measurement mode
    option_labels: {AUTO: 自动, RECiprocal: 倒数, CONTinuous: 无间隙连续}
  measure.timestamp_count:
    type: int
    min: 1
    max: 1000000
    default: 1
    label: 时间戳个数
    label_en: Timestamp count
  measure.timestamp_rate:
    type: float
    unit: HZ
    min: 1.0e4
    max: 1.0e6
    default: 1.0e6
    label: 时间戳速率
    label_en: Timestamp rate
  system.language:
    type: enum
    options: ["53220A", "53230A"]
    default: "53230A"
    label: 命令集语言
    label_en: SCPI language
components:
  # 频率计数器的真实功能块（F #192、D50）：每个通道一个输入调理，门控由时基给出真实门长，
  # 两个计数核心共用门控、时基与统计（核心 1 以 A 为起点、核心 2 以 B 为起点，供通道选择与
  # 两通道时间间隔使用），触发模型按测量通道选择采样核心。
  - name: a
    type: counter_input
    params:
      z_in: $ch1.impedance
      coupling: $ch1.coupling
      threshold: $ch1.threshold
      # 灵敏度的模型值：手册没有给出可编程的 p-p 门限，取 0.1 V（见覆盖表）。
      sensitivity: 0.1
  - name: b
    type: counter_input
    params:
      z_in: $ch2.impedance
      coupling: $ch2.coupling
      threshold: $ch2.threshold
      sensitivity: 0.1
  - name: clock
    type: reference_clock
    params:
      source: $timebase.source
      nominal_hz: $timebase.external_frequency
  - name: gate
    type: counter_gate
    params:
      time: $gate.time
      source: {from: $gate.source, map: {TIME: INTernal, EXTernal: EXTernal}}
      clock: clock
  - name: stats
    type: counter_statistics
    params:
      capacity: 1000000
  # 时基（#328）：参考时钟变成仪表的时标，单次分辨率 20 ps（Table 5-2 的 Tss）；CONTinuous 方式下
  # 每个读数从上一门的最后一个沿到本门的最后一个沿，相邻读数共用边界沿（手册 Figure 3-1）。
  - name: tb
    type: counter_timebase
    params:
      clock: clock
      single_shot_s: 2.0e-11
      gap_free: {from: $measure.mode, map: {AUTO: false, RECiprocal: false, CONTinuous: true}}
  - name: ch1.core
    type: counter_core
    params:
      function: $function
      gate: gate
      clock: clock
      a_input: a
      b_input: b
      statistics: stats
      timebase: tb
      single_shot_s: 2.0e-11
      timestamp_rate: $measure.timestamp_rate
  - name: ch2.core
    type: counter_core
    params:
      function: $function
      gate: gate
      clock: clock
      a_input: b
      b_input: a
      statistics: stats
      timebase: tb
      single_shot_s: 2.0e-11
      timestamp_rate: $measure.timestamp_rate
  - name: trig
    type: trigger_model
    params:
      sampler:
        from: $measure.channels
        map:
          "(@1)": ch1.core
          "(@2)": ch2.core
      source: {from: $trigger.source, map: {IMMediate: immediate, EXTernal: external, BUS: bus}}
      trigger_count: $trigger.count
      sample_count:  # 时间戳：比例因子 + count 个间隔（手册 p.100）
        from: $function
        map:
          FREQuency: $sample.count
          PERiod: $sample.count
          TOTalize: $sample.count
          TINTerval: $sample.count
          TSTamp: {from: $measure.timestamp_count, offset: 1}
      delay: $trigger.delay
  - name: ref_in
    type: input_port
    params: {z_in: 50.0}
  - name: system
    type: system
commands:
  # ---- 输入调理（第 4 章，INPut 子系统）----
  - header: "[:INPut<ch>]:IMPedance"
    state: ch.impedance
  - header: "[:INPut<ch>]:COUPling"
    state: ch.coupling
  - header: "[:INPut<ch>]:LEVel[:ABSolute]"
    state: ch.threshold
  # ---- 时基（第 3 章，参考振荡器）----
  - header: "[:SENSe]:ROSCillator:SOURce"
    state: timebase.source
  - header: "[:SENSe]:ROSCillator:SOURce:AUTO"
    state: timebase.auto
  - header: "[:SENSe]:ROSCillator:EXTernal:FREQuency"
    state: timebase.external_frequency
  - header: "[:SENSe]:ROSCillator:INTernal:POWer:STANdby"
    state: timebase.standby
  # ---- 门控（第 5 章）----
  - header: "[:SENSe]:FREQuency:GATE:SOURce"
    state: gate.source
  - header: "[:SENSe]:FREQuency:GATE:TIME"
    state: gate.time
  - header: "[:SENSe]:FREQuency:MODE"
    state: measure.mode
  - header: "[:SENSe]:TOTalize:GATE:SOURce"
    state: gate.source
  - header: "[:SENSe]:TOTalize:GATE:TIME"
    state: gate.time
  # ---- 测量配置（第 3 章，CONFigure）----
  - header: ":CONFigure:FREQuency"
    query: false
    writes:
      function: FREQuency
      trigger.source: IMMediate
      trigger.count: 1
      sample.count: 1
      trigger.delay: 0.0
      gate.source: TIME
      gate.time: 0.1
      measure.channels: "(@1)"
    params:
      - {name: expected, type: float, unit: HZ, min: 0.1, max: 3.5e8, optional: true, state: measure.expected_frequency}
      - {name: resolution, type: float, unit: HZ, min: 0.0, max: 3500.0, optional: true, state: measure.resolution_frequency}
      - {name: channel, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
  - header: ":CONFigure:PERiod"
    query: false
    writes:
      function: PERiod
      trigger.source: IMMediate
      trigger.count: 1
      sample.count: 1
      trigger.delay: 0.0
      gate.source: TIME
      gate.time: 0.1
      measure.channels: "(@1)"
    params:
      - {name: expected, type: float, unit: S, min: 2.8e-9, max: 10.0, optional: true, state: measure.expected_period}
      - {name: resolution, type: float, unit: S, min: 0.0, max: 1.0e-4, optional: true, state: measure.resolution_period}
      - {name: channel, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
  - header: ":CONFigure:TOTalize:TIMed"
    query: false
    writes:
      function: TOTalize
      trigger.source: IMMediate
      trigger.count: 1
      sample.count: 1
      trigger.delay: 0.0
      gate.source: TIME
      measure.channels: "(@1)"
    params:
      - {name: gate_time, type: float, unit: S, min: 1.0e-6, max: 1000.0, optional: true, state: gate.time}
      - {name: channel, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
  - header: ":CONFigure:TINTerval"
    query: false
    writes:
      function: TINTerval
      trigger.source: IMMediate
      trigger.count: 1
      sample.count: 1
      trigger.delay: 0.0
      measure.channels: "(@1)"
      measure.stop_channel: "(@2)"
    params:
      - {name: start, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
      - {name: stop, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.stop_channel}
  - header: ":CONFigure:ARRay:TSTamp"
    query: false
    writes:
      function: TSTamp
      trigger.source: IMMediate
      trigger.count: 1
      trigger.delay: 0.0
      measure.channels: "(@1)"
    params:
      - {name: count, type: float, min: 1, max: 1000000, optional: true, state: measure.timestamp_count}
      - {name: channel, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
  - header: "[:SENSe]:TSTamp:RATE"
    state: measure.timestamp_rate
  # ---- 单次测量（第 3 章，MEASure）----
  - header: ":MEASure:ARRay:TSTamp"
    op: trig.read
    set: false
    writes:
      function: TSTamp
      trigger.source: IMMediate
      trigger.count: 1
      trigger.delay: 0.0
      measure.channels: "(@1)"
    params:
      - {name: count, type: float, min: 1, max: 1000000, optional: true, state: measure.timestamp_count}
      - {name: input, type: enum, options: ["(@1)", "(@2)"], optional: true, state: measure.channels}
  - header: ":MEASure:FREQuency"
    op: ch.core.measure
    set: false
    args: {what: FREQuency}
    params:
      - {name: expected, type: float, unit: HZ, min: 0.1, max: 3.5e8, optional: true}
      - {name: resolution, type: float, unit: HZ, min: 0.0, max: 3500.0, optional: true}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: ":MEASure:PERiod"
    op: ch.core.measure
    set: false
    args: {what: PERiod}
    params:
      - {name: expected, type: float, unit: S, min: 2.8e-9, max: 10.0, optional: true}
      - {name: resolution, type: float, unit: S, min: 0.0, max: 1.0e-4, optional: true}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  # ---- 触发与取数（第 5、7 章）----
  - header: ":ABORt"
    op: trig.abort
    query: false
  - header: ":INITiate[:IMMediate]"
    op: trig.initiate
    query: false
  - header: ":FETCh"
    op: trig.fetch
    set: false
  - header: ":READ"
    op: trig.read
    set: false
  - header: ":TRIGger:SOURce"
    state: trigger.source
  - header: ":TRIGger:COUNt"
    state: trigger.count
  - header: ":TRIGger:DELay"
    state: trigger.delay
  - header: ":SAMPle:COUNt"
    state: sample.count
  # ---- 统计（第 6 章，CALCulate1:AVERage）----
  - header: "CALCulate<ch>[:STATe]"
    state: calculate.enabled
  - header: "CALCulate<ch>:AVERage[:STATe]"
    state: statistics.enabled
  - header: "CALCulate<ch>:AVERage:AVERage"
    op: stats.mean
    set: false
  - header: "CALCulate<ch>:AVERage:MINimum"
    op: stats.minimum
    set: false
  - header: "CALCulate<ch>:AVERage:MAXimum"
    op: stats.maximum
    set: false
  - header: "CALCulate<ch>:AVERage:SDEViation"
    op: stats.sdev
    set: false
  - header: "CALCulate<ch>:AVERage:COUNt:CURRent"
    op: stats.count
    set: false
  - header: "CALCulate<ch>:AVERage:CLEar[:IMMediate]"
    op: stats.clear
    query: false
  # ---- 数据格式（第 7 章）----
  - header: "FORMat[:DATA]"
    state: data_format
  # ---- 显示（第 6 章）----
  - header: "DISPlay[:WINDow]:MODE"
    state: display.mode
  # ---- 系统设置（第 1、3 章）----
  - header: ":SYSTem:TIMeout"
    state: system.timeout
  - header: ":SYSTem:ALEVel:FREQuency"
    state: system.auto_level_frequency
  - header: ":SYSTem:LANGuage"
    state: system.language
    format: {enum: as_defined}
    reply: '"{value}"'
  - header: ":SYSTem:BATTery:ENABle"
    state: system.battery
  - header: ":SYSTem:PRESet"
    op: system.reset
    query: false
