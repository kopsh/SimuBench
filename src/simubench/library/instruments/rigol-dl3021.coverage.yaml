schema: simubench.coverage/1
model: rigol-dl3021
sections:
- section: IEEE 488.2 Common Commands
  commands:
  - header: '*CLS'
    level: implemented
    note: 清事件寄存器与错误队列（内置）。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器（内置）。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器，读后清零（内置）。
  - header: '*IDN'
    level: implemented
    note: RIGOL TECHNOLOGIES,DL3021,DL3000A000001,00.01.00.04.05（手册示例的序列号与固件串格式）。
  - header: '*OPC'
    level: implemented
    note: '*OPC 置位操作完成位；*OPC? 回 1（内置）。'
  - header: '*OPT'
    level: implemented
    note: DL3021 出厂未装选件，四个选件位都回 0；安装选件的 :LIC:SET 未建模。
  - header: '*PSC'
    level: accepted
    note: 上电清状态使能寄存器的开关，保存与回读；跨上电行为不在仿真中体现。
    affects_data: false
  - header: '*RST'
    level: implemented
    note: 恢复附录 A 的默认值；附录以 DL3031A 为例，DL3021 按数据表取值：CC、0 A、4 A 量程、0.001 A/μs、Von 0 V、V_LIMIT 155 V、C_LIMIT 70 A、输入关。
  - header: '*SRE'
    level: implemented
    note: 状态字节使能寄存器（内置）。
  - header: '*STB'
    level: implemented
    note: 状态字节（内置；含错误队列、MAV 与标准事件汇总）。
  - header: '*TRG'
    level: accepted
    note: 总线触发；动态/列表（C2）未建模，触发只置位、不改变静态工作点。
    affects_data: false
  - header: '*TST'
    level: implemented
    note: 手册的自检项与 PASS 写法；返回固定字符串（自检在仿真中恒通过）。
  - header: '*WAI'
    level: implemented
    note: 等待待完成操作（内置）。
