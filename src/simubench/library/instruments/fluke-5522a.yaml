schema: simubench.instrument/1
id: fluke-5522a
manufacturer: Fluke
model: 5522A
class: calibrator
version: 1
description: >-
  Fluke 5522A 多功能校准源（NORMAL 端子的直流与交流电压输出）。Real model (D42)：命令、回复与
  错误文字按 Fluke 5522A Operators Manual 的远程编程章节（第 5、6 章，Fluke 风格命令，非 SCPI 树）。
  输出由 calibrator_setpoint（设定值与量程）+ calibrator_control（输出控制）建模：待机断开、建立时间、过载跳回待机、≥33 V 改变输出回待机；
  电流、电阻、电容、温度与示波器校准选件未实现（覆盖表逐条列出，回复 -113）。
reference:
  title: Fluke 5522A Multi-Product Calibrator Operators Manual
  document: "3795084"
  version: January 2011
  firmware: 手册 *IDN? 示例的 1.0+1.3+1.8（主 CPU+前面板 CPU+inguard PGA）
identity:
  idn: "FLUKE,5522A,{serial},{firmware}"
  serial: "5248101"
  firmware: "1.0+1.3+1.8"
format:
  number: nr3
  digits: 6
  sign: false
  exponent_digits: 2
  boolean: numeric
  enum: short
  error_code: plain
builtins:
  # 手册的公共命令（*TRG 在手册中等价于热电偶测量，未建模；:SYSTem:* 一类 SCPI 头不是
  # 5522A 的命令，错误队列用 ERR?/FAULT?、日期时间用 CLOCK，回复 -113）。
  ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST"]
errors:
  0: No Error
  506: Function not available
  518: Value outside locked range
  519: Must specify an output unit
  1305: Bad parameter unit
  1503: Output current lim exceeded
  1500: Compliance voltage exceeded
specs:
  source: Fluke 5522A Operators Manual (3795084, January 2011) 第 1 章 Detailed Specifications
  settling_time: "小于 5 s（全部功能与量程，另有注明者除外）→ settle 取 5 s"
  output_resistance: "输出端电阻 <5 mΩ（≥0.33 V 的输出）→ z_out 取 5 mΩ"
  high_voltage_threshold: "≥33 V：改变输出（前一电压 <33 V）或换功能（电压 ≥33 V）自动回待机，需再 OPER"
  oper_with_errors: "错误队列非空时 ≥33 V 的 OPER 被禁止（错误 1331）——本模型未实现（能力 issue）"
  dc_voltage_ranges_1year_ppm_plus_uv:
    "0 to 329.9999 mV": {gain: 20, floor_uv: 1, resolution_uv: 0.1, max_burden: "65 Ω"}
    "0 to 3.299999 V": {gain: 11, floor_uv: 2, resolution_uv: 1, max_burden: "10 mA"}
    "0 to 32.99999 V": {gain: 12, floor_uv: 20, resolution_uv: 10, max_burden: "10 mA"}
    "30 V to 329.9999 V": {gain: 18, floor_uv: 150, resolution_uv: 100, max_burden: "5 mA"}
    "100 V to 1020.000 V": {gain: 18, floor_uv: 1500, resolution_uv: 1000, max_burden: "5 mA"}
  ac_voltage_ranges_1year_45hz_10khz_ppm_plus_uv:
    "1.0 mV to 32.999 mV": {gain: 150, floor_uv: 6, resolution_uv: 1}
    "33 mV to 329.999 mV": {gain: 150, floor_uv: 60, resolution_uv: 1}
    "0.33 V to 3.29999 V": {gain: 150, floor_uv: 600, resolution_uv: 10}
    "3.3 V to 32.999 V": {gain: 150, floor_uv: 600, resolution_uv: 100}
    "33 V to 329.999 V": {gain: 300, floor_uv: 10000, resolution_uv: 1000}
    "330 V to 1020 V": {gain: 300, floor_uv: 10000, resolution_uv: 10000}
  ac_voltage_frequency: "10 Hz 到 500 kHz（单输出）"
  ac_current_frequency: "第 1 章 AC Current (Sine Wave) 表（LCOMP Off）：330 µA–330 mA 量程 10 Hz–30 kHz，1.1 A 与 3 A 量程 10 Hz–10 kHz，11 A 与 20.5 A 量程 45 Hz–5 kHz（#580）"
  voltage_limits: "±1020 V（出厂 LIMIT 默认）"
state:
  out.function:
    type: enum
    # FUNC? 的回复：DCV、ACV、DCI、ACI、RES（第 6 章 FUNC?，#569）
    options: [DCV, ACV, DCI, ACI, RES]
    default: DCV
    rst: DCV
    electrical: true
    label: 功能
    label_en: Function
  # 幅值：V、A 或 Ω（单位由 OUT 的单位决定，记在 out.unit）；各功能的范围由量程表限定（#569）。
  out.level:
    type: float
    min: -1020.0
    max: 1.1e9
    default: 0.0
    rst: 0.0
    electrical: true
    label: 幅度设定
    label_en: Level
  out.frequency:
    type: float
    unit: HZ
    min: 0.0
    max: 500000.0
    default: 0.0
    rst: 0.0
    electrical: true
    label: 频率（0 Hz 为直流）
    label_en: Frequency
  out.unit:
    type: enum
    options: [V, A, OHM]
    default: V
    rst: V
    label: 幅值单位
    label_en: Amplitude unit
  out.operate:
    type: bool
    default: false
    rst: false
    electrical: true
    label: 工作
    label_en: Operate
  out.range_lock:
    type: bool
    default: false
    rst: false
    label: 量程锁定
    label_en: Range lock
  earth:
    type: enum
    options: [OPEN, TIED]
    default: OPEN
    rst: OPEN
    label: NORMAL LO 接机壳地
    label_en: NORMAL LO to earth
  extguard:
    type: enum
    options: ["OFF", "ON"]
    default: "OFF"
    rst: "OFF"
    label: 外部保护（guard 接 LO）
    label_en: External guard
  interface:
    type: enum
    options: [LOCAL, REMOTE, LOCKOUT]
    default: LOCAL
    rst: LOCAL
    label: 远程接口状态
    label_en: Remote interface state
  installed_options:
    type: enum
    options: ["0"]
    default: "0"
    readonly: true
    label: 已安装选件
    label_en: Installed options
components:
  # 输出级：输出端电阻 <5 mΩ（手册第 1 章）；电压功能的负载电流上限取最小的 5 mA（手册允许
  # 2–20 mA 按量程与频率，超限跳回待机并报 1503）；建立时间 <5 s；≥33 V 跨越时回待机。
  # 设定值与量程生成（#329）：功能、电平、频率、建立时间与输出级的隐藏误差。
  - name: dac
    type: calibrator_setpoint
    params:
      function: $out.function
      level: $out.level
      frequency: $out.frequency
      settle: 5.0
      control: out
      # 量程（第 1 章 Detailed Specifications 的各功能表；名字按第 6 章 p. 6-32 RANGE? 的示例 DC330MV、
      # DC33MA_A、AC3_3V、AC330MA_A、R110OHM 的写法推出，其余未逐一核实；RANGE?/RANGELCK 见 #560、#583）。电压表给出 ±1020 V
      # 的上限；电流 0–20.5 A（3 A 以上的 20 A 端子未单独建模，同一 OUT 端口）；电阻 0–1.1 GΩ 连续可调
      # （注 1：Continuously variable from 0 Ω to 1.1 GΩ），表中是量程而非离散值（#569）。
      ranges:
        DCV: [[DC330MV, 0.33], [DC3_3V, 3.3], [DC33V, 33.0], [DC330V, 330.0, 30.0], [DC1000V, 1020.0, 100.0]]
        ACV: [[AC33MV, 0.033, 0.001], [AC330MV, 0.33, 0.033], [AC3_3V, 3.3, 0.33], [AC33V, 33.0, 3.3], [AC330V, 330.0, 33.0], [AC1000V, 1020.0, 330.0]]
        DCI: [[DC330UA_A, 0.00033], [DC3_3MA_A, 0.0033], [DC33MA_A, 0.033], [DC330MA_A, 0.33], [DC1_1A_A, 1.1], [DC3A_A, 3.0], [DC11A, 11.0], [DC20A, 20.5]]
        ACI: [[AC330UA_A, 0.00033], [AC3_3MA_A, 0.0033], [AC33MA_A, 0.033], [AC330MA_A, 0.33], [AC1_1A_A, 1.1], [AC3A_A, 3.0], [AC11A, 11.0], [AC20A, 20.5]]
        RES: [[R11OHM, 11.0], [R33OHM, 33.0], [R110OHM, 110.0], [R330OHM, 330.0], [R1_1KOHM, 1100.0], [R3_3KOHM, 3300.0], [R11KOHM, 11000.0], [R33KOHM, 33000.0], [R110KOHM, 110000.0], [R330KOHM, 330000.0], [R1_1MOHM, 1.1e6], [R3_3MOHM, 3.3e6], [R11MOHM, 1.1e7], [R33MOHM, 3.3e7], [R110MOHM, 1.1e8], [R330MOHM, 3.3e8], [R1100MOHM, 1.1e9]]
      ohm_values: continuous
      # 交流电流的频率范围按量程（第 1 章 AC Current (Sine Wave) 表，LCOMP Off），超出报 -222（#580）
      frequency_bands:
        AC330UA_A: [10.0, 30000.0]
        AC3_3MA_A: [10.0, 30000.0]
        AC33MA_A: [10.0, 30000.0]
        AC330MA_A: [10.0, 30000.0]
        AC1_1A_A: [10.0, 10000.0]
        AC3A_A: [10.0, 10000.0]
        AC11A: [45.0, 5000.0]
        AC20A: [45.0, 5000.0]
      range_lock: $out.range_lock
      # 锁定只用于单输出直流电压/直流电流（第 4 章 p. 4-17、第 6 章 p. 6-32 RANGELCK）；交流与电阻下
      # RANGELCK ON 照样记下（RANGELCK? 回 ON），量程仍随幅值自动选择、不报 518（#589）。
      lock_functions: [DCV, DCI]
      # 锁定量程的下限取各 Range 行的跨度起点：DC 330 V/1000 V 量程 30 V/100 V 起，AC 六档
      # 1 mV/33 mV/0.33 V/3.3 V/33 V/330 V 起（第 1 章 Detailed Specifications），低于报 518（#560）。
      over_range_error: 518
      under_range_error: 518
  # 输出控制：工作/待机、端子、过载跳闸与 ≥33 V 跨越回待机（#558）。
  - name: out
    type: calibrator_control
    params:
      operate: $out.operate
      z_out: 0.005
      i_max: 0.005
      standby_above: 33.0
      # 手册第 3、4 章（Operators Manual，Operate and Standby Modes）：前一输出 <33 V 时选中 ≥33 V
      # 回待机（恰好 33 V 也算，即 ≥33 V 且从阈值以下跨越）；交流↔直流电压的切换仅在输出 ≥33 V 时
      # 回待机（#566），其他功能改变总是回待机。
      standby_rule: crossing
      standby_on_function: above
      overload_error: 1503
      setpoint: dac
      # 电流输出的 compliance（第 1 章 DC Current 表 Max Compliance Voltage 列：330 µA、3.3 mA 量程 10 V，
      # 33 mA、330 mA 7 V，1.1 A、3 A 6 V，20 A 量程 4 V；AC Current 表末的 Max Compliance Voltage V rms：
      # 0.33 mA、3.3 mA 7 V，33 mA、330 mA 5 V，0.33–3 A 4 V，3–20.5 A 3 V），超出跳回待机并报 1500（#569）。
      compliance: {DC330UA_A: 10.0, DC3_3MA_A: 10.0, DC33MA_A: 7.0, DC330MA_A: 7.0, DC1_1A_A: 6.0, DC3A_A: 6.0, DC11A: 4.0, DC20A: 4.0, AC330UA_A: 7.0, AC3_3MA_A: 7.0, AC33MA_A: 5.0, AC330MA_A: 5.0, AC1_1A_A: 4.0, AC3A_A: 4.0, AC11A: 3.0, AC20A: 3.0}
      compliance_error: 1500
  - name: sys
    type: system
wiring:
  instrument:
    - [dac.out, out.in]
ports:
  instrument:
    # NORMAL 端子的 HI；LO 是机内地（输出以测试台地为参考），不单独成端口。
    OUT: out.out
display:
  summary: [out.function, out.level, out.frequency, out.operate, earth, extguard]
capabilities: [calibrator]
commands:
  # ---- 输出 ----
  - header: OUT
    params:
      - name: q
        type: quantities
        units:
          V: {state: out.level, sets: {out.unit: V}}
          A: {state: out.level, sets: {out.unit: A}}
          OHM: {state: out.level, sets: {out.unit: OHM, out.frequency: 0.0}}
          HZ: {state: out.frequency}
        combine:
          # 只有幅值 → 直流电压（OUT 10 V）；带频率 → 0 Hz 为直流、非 0 为交流（OUT 1 V, 1 kHz）；
          # 只有频率 → 仅更新频率（OUT 60 HZ）。同一单位两次（OUT 1 V, 2 V）按手册是双电压输出，
          # 双输出未建模，报 506。
          "V": {out.function: DCV}
          "V,HZ": {out.function: {if_zero: out.frequency, then: DCV, else: ACV}}
          # 电流（#569）：OUT 1.2 MA 在同一频率（"current; 1.2 mA @ same frequency"），OUT 1 A, 400 HZ 交流；
          # 电阻没有频率。
          "A": {out.function: {if_zero: out.frequency, then: DCI, else: ACI}}
          "A,HZ": {out.function: {if_zero: out.frequency, then: DCI, else: ACI}}
          "OHM": {out.function: RES}
          "HZ": {}
        missing_unit_error: 519
        unknown_unit_error: 1305
        duplicate_unit_error: 506
        combine_error: 1305
    reply: "{out.level},{out.unit},0E+00,0,{out.frequency}"
    doc: >-
      查询按手册给出 <幅值>,<单位>,<第二输出幅值>,<第二输出单位>,<频率>；单输出第二输出为
      0E+00,0。各数字按本模型的统一格式（nr3，6 位尾数；手册示例中各字段的位数不一）。
  - header: FUNC
    state: out.function
    set: false
    format: {enum: as_defined}
    doc: 返回当前输出功能（DCV / ACV / DCI / ACI / RES；手册还有电容、温度、功率等功能的返回，未建模）。
  - header: OPER
    op: out.operate
    read: out.operate
    args: {value: true}
    doc: >-
      进入工作，输出经建立时间到达设定值；OPER? 回读工作状态（1 = 工作，0 = 待机）。手册的错误
      队列非空时 ≥33 V 禁止 OPER（1331）未实现（能力 issue）。
  - header: STBY
    op: out.operate
    args: {value: false}
    query: false
    doc: 回到待机，输出端与电路断开。
  # ---- 量程（#552、#560） ----
  - header: RANGE
    op: dac.range
    set: false
    reply: "{name},0"
    doc: >-
      当前输出量程的符号名与第二输出（单输出为 0，手册第 6 章 p. 6-32 RANGE?：DC330MV,0、
      DC33MA_A,0、AC3_3V,0、AC330MA_A,0、R110OHM,0 等例子；量程取第 1 章规格表的 Range 行）。
  - header: RANGELCK
    state: out.range_lock
    format: {boolean: word}
    doc: >-
      ON 锁定当前量程，OFF 恢复自动量程（手册第 6 章 p. 6-32 RANGELCK）；锁定时越限/欠限报
      518（附录 D p. D-3：Value outside locked range），改变输出功能自动解锁。RANGELCK? 回
      ON/OFF（p. 6-32/6-33）。只对直流电压/直流电流锁定：交流与电阻下 RANGELCK ON 被记下但量程仍
      自动选择、不报 518（#589）。
  # ---- 错误队列 ----
  - header: ERR
    op: sys.next_error
    set: false
    reply: '{code},"{text}"'
    doc: 取出最早的一条错误（码与文字按手册附录 D）；空队列回 0,"No Error"。
  - header: FAULT
    op: sys.next_error
    set: false
    reply: "{code}"
    doc: 只取错误码；文字用 EXPLAIN? 查询（未建模）。
  # ---- 外部连接（接受：不影响仿真） ----
  - header: EARTH
    state: earth
    doc: NORMAL LO 接/断机壳地；仿真中不影响电路。
  - header: EXTGUARD
    state: extguard
    doc: 内部保护屏蔽接/断 LO 端子；仿真中不影响电路。
  # ---- RS-232 主机口命令（接受：不影响仿真） ----
  - header: LOCAL
    state: interface
    set_value: LOCAL
    query: false
    doc: 回到本地并解除锁定（等价 IEEE-488 GTL）；写入接口状态，仿真中本地/远程不影响行为。
  - header: REMOTE
    state: interface
    set_value: REMOTE
    query: false
    doc: 进入远程状态（等价 IEEE-488 REN）；写入接口状态。
  - header: LOCKOUT
    state: interface
    set_value: LOCKOUT
    query: false
    doc: 前面板锁定（等价 IEEE-488 LLO）；写入接口状态。
  # ---- 选件 ----
  - header: "*OPT"
    state: installed_options
    set: false
    doc: 已安装选件列表；按无选件的 5522A 建模，回 0。
# 个体偏差（#34，metrology-authoring.md 7）：calibrator_setpoint 的隐藏误差是单一标量（无按量程
# 的表），取各量程 1 年指标中最紧的一档，使任何设定值都落在手册的 1 年包络内：直流增益 20 ppm
# （330 mV 档），零点 1 µV（330 mV 档的 floor）；交流按 45 Hz–10 kHz 的 150–300 ppm 建模得更紧
# （ specs 记完整表格）。limit 表按 by 的最后一个键取值，DC/AC 两套限值无法在同一参数上表达，
# 故取直流档（注释于此）。
deviations:
  - param: dac.gain_error_ppm
    limit: 20.0
    distribution: uniform
  - param: dac.offset
    limit: 1.0e-6
    distribution: uniform
