  # CONFigure? (@list)：每个通道一段带引号的「功能 量程,分辨率」，按列表顺序以逗号连接（#365）。
  - header: "CONFigure"
    op: scan.configuration
    set: false
    params: [{name: channels, type: channel_list}]
  # ---- 读数 ------------------------------------------------------------------
  - header: "READ"
    op: rd.read
    set: false
    args: {elements: [READ]}
  - header: "FETCh"
    op: st.fetch
    set: false
    args: {elements: [READ]}
  - header: "INITiate"
    op: st.initiate
    query: false
  - header: "ABORt"
    op: st.abort
    query: false
  - header: "DATA:POINts"
    op: mem.points
    set: false
  - header: "DATA:REMove"
    op: mem.remove
    set: false
    params: [{name: count, type: int, min: 1, max: 50000}]
  # ---- 内部 DMM：直流电压的常用配置（通道列表按 D51/#207 的槽位号域） ----------
  - header: "SENSe:VOLTage:DC:NPLCycles"
    params:
      - {name: nplc, type: float, min: 0.02, max: 200.0, state: ch.nplc}
      - {name: channels, type: channel_list}
  - header: "SENSe:VOLTage:DC:RANGe"
    params:
      - {name: range, type: float, unit: V, state: ch.range}
      - {name: channels, type: channel_list}
  - header: "SENSe:VOLTage:DC:RANGe:AUTO"
    params:
      - {name: auto, type: bool, state: ch.range_auto}
      - {name: channels, type: channel_list}
  - header: "INPut:IMPedance:AUTO"
    params:
      - {name: auto, type: bool, state: ch.imp_auto}
      - {name: channels, type: channel_list}
  # ---- 显示与版本（接受：保存并回读，不影响读数） -----------------------------
  - header: "DISPlay[:STATe]"
    state: display.state
  - header: "DISPlay:TEXT"
    state: display.text
  - header: "DISPlay:TEXT:CLEar"
    state: display.text
    set_value: ""
    query: false
  - header: "SYSTem:VERSion"
    state: system.version
    set: false
    reply: "1994.0"
