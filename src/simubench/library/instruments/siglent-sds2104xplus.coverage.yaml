- section: TRIGger Commands (EN11F)
  commands:
  - header: :TRIGger:FREQuency
    level: not_modeled
    note: '等能力(4.2 未列):触发源的硬件频率计数,内置计数器见 #1122。'
    gap: blocked
    blocked_by: counter
  - header: :TRIGger:MODE
    level: implemented
    note: 'SINGle arms one acquisition that finishes in virtual time, once the record after the trigger is full, then stops; a read meanwhile gets the running scope''s last frame; FTRIG forces one frame, which also takes its record time. No command takes a declared time of its own (the manual gives none): a script that polls without sleeping moves virtual time only on the wall clock or with idle time counted (D47)' 
  - header: :TRIGger:RUN
    level: implemented
  - header: :TRIGger:STATus
    level: implemented
    note: 'Stop, Trig''d, Auto or Ready; during a single acquisition Ready until the trigger, Trig''d while the record after it fills, then Stop' 
  - header: :TRIGger:STOP
    level: implemented
  - header: :TRIGger:TYPE
    level: implemented
    note: EDGE only; other types are not modeled
- section: TRIGger Commands > :TRIGger:EDGE Commands (EN11F)
  commands:
  - header: :TRIGger:EDGE:COUPling
    level: implemented
    note: 'DC / AC / LFReject / HFReject 在触发路径上滤波，采集数据不变：AC 高通 5 Hz（数据手册的交流耦合转折）、LFReject 高通 50 kHz 与 HFReject 低通 1 MHz（数据手册没有给出抑制滤波的转折，取 SimuBench 默认值）。'
  - header: :TRIGger:EDGE:HLDEVent
    level: not_modeled
    note: 释抑类型 EVENts 的事件计数（1–100000000）未实现；OFF / TIME 可用。
    gap: model_work
  - header: :TRIGger:EDGE:HLDTime
    level: implemented
    note: 释抑时间 8 ns–30 s（EN11F p.423–424）；只有 :TRIGger:EDGE:HOLDoff 为 TIME 时生效。复位值 100 ns 是 SimuBench 默认（手册的复位表未给出时按覆盖表说明处理）。
  - header: :TRIGger:EDGE:HOLDoff
    level: implemented
    note: '释抑类型 OFF / TIME，复位 OFF（EN11F p.423–424）；TIME 时按 :HLDTime 推迟下一次触发。EVENts（事件计数）未实现：设置它按值域报错，不静默当作 OFF。'
  - header: :TRIGger:EDGE:HSTart
    level: not_modeled
    gap: model_work
  - header: :TRIGger:EDGE:IMPedance
    level: not_modeled
    gap: model_work
  - header: :TRIGger:EDGE:LEVel
    level: implemented
    note: within +-4.1 div around the offset
  - header: :TRIGger:EDGE:NREJect
    level: implemented
    note: 'ON：触发迟滞带从 0.16 格扩大到 0.5 格，噪声不再产生重复触发；OFF 恢复。'
  - header: :TRIGger:EDGE:SLOPe
    level: implemented
  - header: :TRIGger:EDGE:SOURce
    level: implemented
    note: C1 to C4; EX, EX5 and LINE are stored and never trigger
