# Generated from the command entries of the SDS Series Programming Guide EN11F; levels and notes by hand.
schema: simubench.coverage/1
model: siglent-sds2104xplus
sections:
- section: Common (*) Commands (EN11F)
  commands:
  - header: '*IDN'
    level: implemented
  - header: '*OPC'
    level: implemented
    note: '*OPC? waits for a single acquisition, a forced frame or a digitize in progress, and does not answer while armed for a trigger that does not come (the client times out); not verified on the instrument: the manual does not say whether *OPC? waits for an acquisition'
  - header: '*RST'
    level: implemented
    note: '*RST values the manual does not give use SimuBench defaults: 1 V/div, 0 V offset, DC, 1 MΩ, probe 1X, FULL bandwidth, CH1 on, 1 us/div, delay 0, edge trigger on C1 rising at 0 V, AUTO, NORMal
      acquisition, 8 bits, 10k memory depth'
- section: Root(:) Commands (EN11F)
  commands:
  - header: :AUToset
    level: not_modeled
  - header: :PRINt
    level: not_modeled
  - header: :FORMat:DATA
    level: not_modeled
- section: ACQUire Commands (EN11F)
  commands:
  - header: :ACQuire:AMODe
    level: accepted
    note: waveform capture rate has no effect on the simulation
  - header: :ACQuire:CSWeep
    level: not_modeled
  - header: :ACQuire:INTerpolation
    level: accepted
    note: display interpolation only
  - header: :ACQuire:MMANagement
    level: accepted
    note: 'stored; the record length always follows AUTO: rate = min(maximum rate, depth / 10 div) on a 1-2-5 ladder'
  - header: :ACQuire:MODE
    level: accepted
    note: YT only; XY and ROLL are stored
  - header: :ACQuire:MDEPth
    level: implemented
    note: sets the record length with the timebase; *RST value 10k is a SimuBench default
  - header: :ACQuire:NUMAcq
    level: implemented
    note: acquisitions since the session started or *RST
  - header: :ACQuire:POINts
    level: implemented
  - header: :ACQuire:RESolution
    level: implemented
    note: '8 bits: 30 codes/div; 10 bits: 120 codes/div, left-aligned in WORD data (30 * 256 per div in the preamble); every record is quantized, so measurements see the codes too'
  - header: :ACQuire:SEQuence
    level: not_modeled
  - header: :ACQuire:SEQuence:COUNt
    level: not_modeled
  - header: :ACQuire:SRATe
    level: implemented
    note: query only here; setting a fixed rate (FSRate) is not modeled
  - header: :ACQuire:TYPE
    level: implemented
    note: 'NORMal; AVERage,N gives the noise of N averaged acquisitions (1/sqrt(N)) and takes the time of N; PEAK and ERES are stored (no effect)'
- section: CHANnel Commands (EN11F)
  commands:
  - header: :CHANnel:REFerence
    level: accepted
  - header: :CHANnel<ch>:BWLimit
    level: implemented
    note: first-order low-pass at 20 MHz; 200M has no effect on the 100 MHz model
  - header: :CHANnel<ch>:COUPling
    level: implemented
    note: 'AC: 5 Hz high-pass (data sheet); GND: 0 V'
  - header: :CHANnel<ch>:IMPedance
    level: implemented
    note: 1 MΩ || 17 pF or 50 Ω in the bench circuit; at 50 Ω the scale is limited to 1 V/div
  - header: :CHANnel<ch>:INVert
    level: not_modeled
  - header: :CHANnel<ch>:LABel
    level: not_modeled
  - header: :CHANnel<ch>:LABel:TEXT
    level: not_modeled
  - header: :CHANnel<ch>:OFFSet
    level: implemented
    note: 'range by scale (data sheet); out of range: -222 and the old value stays'
  - header: :CHANnel<ch>:PROBe
    level: implemented
    note: changing the ratio rescales SCALe and OFFSet
  - header: :CHANnel<ch>:SCALe
    level: implemented
    note: '500 uV/div to 10 V/div (1 MΩ) at the input, times the probe ratio; out of range: -222 and the old value stays'
  - header: :CHANnel<ch>:SKEW
    level: accepted
    note: stored; no time shift is applied
  - header: :CHANnel<ch>:SWITch
    level: implemented
    note: channels on decide interleaving (2 or 1 GSa/s)
  - header: :CHANnel<ch>:UNIT
    level: accepted
  - header: :CHANnel<ch>:VISible
    level: accepted
