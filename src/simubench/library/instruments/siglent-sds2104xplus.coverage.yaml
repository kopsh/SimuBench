# Generated from the command entries of the SDS Series Programming Guide EN11F; levels and notes by hand.
schema: simubench.coverage/1
model: siglent-sds2104xplus
sections:
- section: Common (*) Commands (EN11F)
  commands:
  - header: '*IDN'
    level: implemented
  - header: '*OPC'
    level: implemented
    note: '*OPC? waits for a single acquisition, a forced frame or a digitize in progress, and does not answer while armed for a trigger that does not come (the client times out); not verified on the instrument: the manual does not say whether *OPC? waits for an acquisition'
  - header: '*RST'
    level: implemented
    note: '*RST values the manual does not give use SimuBench defaults: 1 V/div, 0 V offset, DC, 1 MΩ, probe 1X, FULL bandwidth, CH1 on, 1 us/div, delay 0, edge trigger on C1 rising at 0 V, AUTO, NORMal
      acquisition, 8 bits, 10k memory depth'
  - header: '*CAL'
    level: implemented
    note: '*CAL? runs the user self-calibration and replies "*CAL 0" (0 = successful). EN11F''s table of contents lists only :SYSTem:SELFCal under SYSTEM, not *CAL?; the reply and the command come from the SDS Series Programming Guide (same family; sibling SDS1000X-E guide and the earlier Digital Oscilloscopes Series guide document it), so not verified on this model. Each channel''s per-V/div coefficients go into its calibration store; inputs are supposed to be disconnected on the instrument, the simulation does not check it.'
- section: Root(:) Commands (EN11F)
  commands:
  - header: :AUToset
    level: not_modeled
    note: 等能力:自动设置(按输入信号定标,#1080)。
    gap: blocked
    blocked_by: autoscale
  - header: :PRINt
    level: not_modeled
    note: 等能力:截图/硬拷贝(#1072)。
    gap: blocked
    blocked_by: screenshot
  - header: :FORMat:DATA
    level: not_modeled
    note: 可做:波形读回格式(waveform_transfer 支持格式);接根级命令,含 CUSTom,7。
    gap: model_work
- section: ACQUire Commands (EN11F)
  commands:
  - header: :ACQuire:AMODe
    level: accepted
    affects_data: false
    note: waveform capture rate has no effect on the simulation
  - header: :ACQuire:CSWeep
    level: not_modeled
    gap: model_work
  - header: :ACQuire:INTerpolation
    level: accepted
    affects_data: false
    note: display interpolation only
  - header: :ACQuire:MMANagement
    level: not_modeled
    note: 记录长度固定按 AUTO（采样率 = min(最高采样率, 深度 / 10 格)，取 1-2-5 档）；FSRate / FMDepth 会改变记录长度与采样率，未实现。
    gap: model_work
  - header: :ACQuire:MODE
    level: implemented
    note: 只在 YT 下采集；XY 与 ROLL 会改变采集方式，设置它们报 -222。
  - header: :ACQuire:MDEPth
    level: implemented
    note: 'sets the record length with the timebase, up to 200M; *RST value 10k is a SimuBench default. Records deeper than 2^22 points are computed where they are read, at most 2^26 points per read (:WAVeform:STARt and :WAVeform:POINt read the rest in parts; real-models.md 10, #1012)'
  - header: :ACQuire:NUMAcq
    level: implemented
    note: acquisitions since the session started or *RST
  - header: :ACQuire:POINts
    level: implemented
  - header: :ACQuire:RESolution
    level: implemented
    note: '8 bits: 30 codes/div; 10 bits: 120 codes/div, left-aligned in WORD data (30 * 256 per div in the preamble); every record is quantized, so measurements see the codes too'
  - header: :ACQuire:SEQuence
    level: not_modeled
    gap: model_work
  - header: :ACQuire:SEQuence:COUNt
    level: not_modeled
    gap: model_work
  - header: :ACQuire:SRATe
    level: implemented
    note: query only here; setting a fixed rate (FSRate) is not modeled
  - header: :ACQuire:TYPE
    level: implemented
    note: >-
      NORMal; AVERage,N is the mean of N quantized acquisitions - noise 1/sqrt(N) with the
      resolution gained, the time of N; PEAK keeps the largest excursion of each record interval
      at up to 64 x the record rate (the native rate, capped for the model), so a pulse the record
      rate would step over shows; ERES,b is a boxcar of 4^b codes - noise 2^-b, b more effective
      bits, at the boxcar's bandwidth (D46). The per-division noise is estimated, the data sheet
      gives none: max(35.8 uV, 0.015 x v_div) at the input (specs.noise_per_division, the
      scope_vertical noise_table). An average whose N x record samples is beyond 2^28 (more than 2683
      averages at 100k, 1341 at 200k, 267 at 1M, 133 at 2M, 25 at 10M, 12 at 20M) is a deep record
      (#1012, real-models.md 10): it is taken, and a read may ask for at most 2^28 samples (points read x N);
      until #1012 it was refused (#986). Peak detect stays within the model at every depth (at most 64
      converter samples a record sample). ERES records up to 2^26 points are computed whole; deeper
      records of every type (100M, 200M) where they are read.
- section: CHANnel Commands (EN11F)
  commands:
  - header: :CHANnel:REFerence
    level: not_modeled
    note: 垂直参考 OFFSet / POSition 只改变显示坐标；本模型不模拟显示参考。
    gap: model_work
  - header: :CHANnel<ch>:BWLimit
    level: implemented
    note: first-order low-pass at 20 MHz; 200M has no effect on the 100 MHz model
  - header: :CHANnel<ch>:COUPling
    level: implemented
    note: 'AC: 5 Hz high-pass (data sheet); GND: 0 V'
  - header: :CHANnel<ch>:IMPedance
    level: implemented
    note: 1 MΩ || 17 pF or 50 Ω in the bench circuit; at 50 Ω the scale is limited to 1 V/div
  - header: :CHANnel<ch>:INVert
    level: not_modeled
    note: 可做:通道信号取反(信号链取反)。
    gap: model_work
  - header: :CHANnel<ch>:LABel
    level: not_modeled
    note: '可做:仅显示的通道标签;候选"接受"(affects_data: false)。'
    gap: model_work
  - header: :CHANnel<ch>:LABel:TEXT
    level: not_modeled
    note: '可做:仅显示的通道标签;候选"接受"(affects_data: false)。'
    gap: model_work
  - header: :CHANnel<ch>:OFFSet
    level: implemented
    note: 'range by scale (data sheet); out of range: -222 and the old value stays'
  - header: :CHANnel<ch>:PROBe
    level: implemented
    note: changing the ratio rescales SCALe and OFFSet
  - header: :CHANnel<ch>:SCALe
    level: implemented
    note: '500 uV/div to 10 V/div (1 MΩ) at the input, times the probe ratio; out of range: -222 and the old value stays'
  - header: :CHANnel<ch>:SKEW
    level: implemented
    note: the channel's delay enters the record as a digital delay (the acquisition samples that much earlier); the trigger path stays on the analog signal. The data sheet gives no deskew accuracy, so the model draws no individual skew error.
  - header: :CHANnel<ch>:SWITch
    level: implemented
    note: channels on decide interleaving (2 or 1 GSa/s)
  - header: :CHANnel<ch>:UNIT
    level: accepted
    affects_data: false
  - header: :CHANnel<ch>:VISible
    level: accepted
    affects_data: false
