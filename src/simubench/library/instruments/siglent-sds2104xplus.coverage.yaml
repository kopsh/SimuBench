- section: TIMebase Commands (EN11F)
  commands:
  - header: :TIMebase:DELay
    level: implemented
    note: '[-5000 div, 5 div]; sample 0 is at delay - 5 div'
  - header: :TIMebase:REFerence
    level: implemented
    note: POSition 时触发位置由 :TIMebase:REFerence:POSition 决定；DELay 时触发在记录中央，由 :TIMebase:DELay 移动。
  - header: :TIMebase:REFerence:POSition
    level: implemented
    note: 0–100 %，决定触发在记录中的位置（记录点数 × 百分比）；改变后记录的时间起点与触发位置随之改变。
  - header: :TIMebase:SCALe
    level: implemented
    note: 1 ns/div to 1000 s/div on 1-2-5 steps
  - header: :TIMebase:WINDow
    level: not_modeled
