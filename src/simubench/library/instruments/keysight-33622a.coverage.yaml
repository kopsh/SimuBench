  - header: '[:SOURce<ch>]:VOLTage:OFFSet'
    level: implemented
    note: 偏置 ±10 V（按负载设定）；|偏置| + Vpp/2 的峰值限制未检查。
  - header: '[:SOURce<ch>]:VOLTage:RANGe:AUTO'
    level: not_modeled
    note: 电压自动量程开关未建模（不影响模型输出）。
  - header: '[:SOURce<ch>]:VOLTage:UNIT'
    level: implemented
    note: VPP/VRMS/DBM；切换时换算幅度值，输出不变。
