# Keysight 33622A 的覆盖表：按 Keysight Trueform Series Operating and Service Guide（33500-90901）的
# Command Quick Reference 逐条列出，程度与说明手写。范围：两个通道的标准波形、任意波（易失存储）、PRBS、
# 幅度/偏置/高低电平与单位、输出负载与极性、AM/FM/PM/FSK/PWM 内部调制。
# 未实现命令一律回复 -113,"Undefined header;not implemented in this definition"。
schema: simubench.coverage/1
model: keysight-33622a
sections:
- section: APPLy Subsystem
  commands:
  - header: '[:SOURce<ch>]:APPLy'
    level: implemented
    note: APPLy?：带引号的「函数 频率,幅度,偏置」，函数用短形式（SIN、SQU…），幅度按 VOLTage:UNIT。
  - header: '[:SOURce<ch>]:APPLy:ARBitrary'
    level: implemented
    note: 设函数并按顺序写采样率、幅度、偏置（各可省略或 DEF），打开输出，关闭所有调制。
  - header: '[:SOURce<ch>]:APPLy:DC'
