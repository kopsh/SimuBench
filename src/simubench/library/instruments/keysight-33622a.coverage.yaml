- section: VOLTage Subsystem
  commands:
  - header: '[:SOURce<ch>]:VOLTage'
    level: implemented
    note: 幅度按 VOLTage:UNIT（VPP/VRMS/DBM），按负载设定定义（D13）；1 mVpp–10 Vpp（50 Ω）或 20 Vpp（开路）外 -222。*RST 100 mVpp。
  - header: '[:SOURce<ch>]:VOLTage:COUPle[:STATe]'
    level: not_modeled
    note: 双通道耦合未建模。
  - header: '[:SOURce<ch>]:VOLTage:HIGH'
    level: implemented
    note: 高电平：偏置 + Vpp/2；设定时保持低电平，幅度与偏置随之改变（#424）。
  - header: '[:SOURce<ch>]:VOLTage:LOW'
    level: implemented
    note: 低电平：偏置 − Vpp/2；设定时保持高电平（#424）。
  - header: '[:SOURce<ch>]:VOLTage:LIMit:HIGH'
    level: not_modeled
    note: 输出电压限制未建模。
  - header: '[:SOURce<ch>]:VOLTage:LIMit:LOW'
    level: not_modeled
