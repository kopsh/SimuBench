- section: Table 6-4 > Output Commands
  commands:
  - header: BOOST
    level: not_modeled
    note: 外部放大器（5725A、52120A）、Wideband 选件与选件查询未实现。
    gap: out_of_scope
  - header: DBMOUT
    level: not_modeled
    note: dBm 单位未实现。
    gap: blocked
    blocked_by: cal-functions
  - header: OPER
    level: implemented
    note: 进入工作，3 s 建立时间（量程或极性改变 +1 s）后到达设定值（*OPC? 等待）。故障队列非空时 ≥22 V 禁止 OPER（2232）未实现。
  - header: OUT
    level: implemented
    note: OUT <幅值> V|A|OHM[, <频率> HZ]：电压 ±1100 V（10 Hz–1.2 MHz）、电流 ±2.2 A（直流或交流；compliance 按第 1 章 DC/AC Current
      Secondary Performance Specifications：直流 10 V、2.2 A 量程 3 V，交流 7 V rms、2.2 A 量程 1.4 V rms，注里 1 A 以上的 2 V/1.5 V
      未按电平分档；超出跳回待机记 210）、电阻取最接近的标称值（0、1、1.9、10 … 100 MΩ，二线；负值 -222，#570）；只给幅值时频率不变，只给频率时直流/交流随之切换；超出该功能最大量程 -222（手册的 815
      Outside Entry Limits 未区分，815 已入 errors 表备查），整条命令不生效。OUT? 回 <幅值>,V|A|OHM,<频率>（nr3，6 位尾数；直流时频率位回
      0.000000E+00，手册示例为 0）。DBM 报 -224（未建模）；缺单位 2206、同一单位两次 2207（#550）；1100 V 量程限载 20 mA 未建模，i_max 全量程 50 mA（#556）。输出读回（面板/组件对端子电压的读数）带噪声（specs.readback_noise_rms：估计值，#809/#744），逐帧独立抽样，同种子逐位复现；端子上被校表读到的输出不加噪；待机时读回恒为 0（输出端无电压，#863）。
  - header: PHASE
    level: not_modeled
    note: 相位输出与锁相未实现。
