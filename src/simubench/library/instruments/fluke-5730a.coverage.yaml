    gap: model_work
  - header: STBY
    level: implemented
    note: 回到待机，端子与电路断开。自动回待机：选中 ≥22 V 且前一输出 <22 V 时，或改变输出功能（直流↔交流）时（第 4 章，#553）；≥22 V 之间的改变保持工作。
