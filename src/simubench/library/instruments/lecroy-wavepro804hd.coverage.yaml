sections:
- section: ACQUISITION — Controlling Waveform Captures
  commands:
  - header: ARM_acquisition
    level: implemented
    note: 单次采集：armed 后触发一次，采完停在 STOP；触发方式本身不变
  - header: AUTO_SETUP
    level: not_modeled
    note: 等能力:自动设置(按输入信号定标,#1080)。
    gap: blocked
    blocked_by: autoscale
  - header: C<ch>:ATTeNuation
    level: implemented
    note: 数值是探头衰减比（1、2、5、10、…、10000）；改档时垂直档位与偏置按比例缩放，使探头尖的读数保持不变
  - header: BANDWIDTH_LIMIT
    level: not_modeled
    note: 可做:前端带宽限制;scope_vertical 的 bw_limit 已有(named filter)。
    gap: model_work
  - header: COMBINE_CHANNELS
    level: not_modeled
    note: 等能力 C15(product-plan.md 4.2):通道交织合并改变前端结构。
    gap: blocked
    blocked_by: C15
  - header: C<ch>:CouPLing
    level: implemented
    note: D1M/A1M 为 1 MΩ，D50 为 50 Ω，GND 接地；GND 时输入仍按 1 MΩ 建模
  - header: FoRce_TRigger
    level: implemented
    note: 无论触发条件是否满足，立即采一帧
  - header: INTERLEAVED
    level: not_modeled
    note: 等能力 C15(product-plan.md 4.2):通道交织合并改变前端结构。
    gap: blocked
    blocked_by: C15
  - header: Memory_SIZe
    level: implemented
    note: 记录长度按存储深度与采样率取最小值；取值按手册的 500、1k、2.5k、…、100M 档取最接近的档；后缀 K = 千、MA = 兆、单独的 M = 毫（手册：1.0M 是 1 毫采样，#888）。超过 2²² 点的记录（到 100M 档）读的时候才算，一次读取至多 2²⁶ 点，更深的用 WaveForm_SetUp 的 FP/NP 分段读（real-models.md 第 10 节，#1012）；本定义不映射平均与峰值检测
  - header: C<ch>:OFfSeT
    level: implemented
    note: 探头尖的偏置；越界按数据手册取最接近的合法值（VAB 状态位没有建模）
  - header: Reference_CLocK
    level: accepted
    note: 内部/外部参考时钟只保存，仿真时间基准不变
    affects_data: false
  - header: SAMPLE_CLOCK
    level: not_modeled
    note: 可做:采样时钟源;采集组件已有采样率参数。
    gap: model_work
  - header: SEQUENCE
    level: not_modeled
    note: 可做:分段采集平台已具备(#957);把 SEQUence 接到 scope_record。
    gap: model_work
  - header: STOP
    level: implemented
  - header: Time_DIV
    level: implemented
    note: 20 ps/div–1 ks/div，任意值；记录长度与采样率由存储深度决定
  - header: TRIG_COUPLING
    level: not_modeled
    note: 可做:触发路径的耦合与延迟;scope_trigger 的滤波与释抑已有。
    gap: model_work
  - header: TRIG_DELAY
    level: not_modeled
    note: 可做:触发路径的耦合与延迟;scope_trigger 的滤波与释抑已有。
    gap: model_work
  - header: '*TRG'
    level: implemented
    note: 与 ARM_acquisition 相同
  - header: C<ch>:TRig_LeVel
    level: implemented
    note: 按触发源分别保存电平；触发使用当前触发源对应通道的电平。手册的 ±4.1 格限制与越界 VAB 没有建模
  - header: TRig_MoDe
    level: implemented
    note: AUTO、NORM、SINGLE、STOP；SINGLE 采一帧后停止；查询回复带头（TRIG_MODE <mode>），随 COMM_HEADER 变化（#887）
  - header: TRIG_PATTERN
    level: not_modeled
    note: 等能力 C8(product-plan.md 4.2):码型触发未建模,且要等 C7 才有可触发的对象。
    gap: blocked
    blocked_by: C8
  - header: TRig_SElect
    level: implemented
    note: 只建模 EDGE 与时间释抑（HT,TI,HV 秒）；脉宽、间隔、事件释抑报 -224
  - header: C<ch>:TRig_SLope
    level: implemented
    note: 按触发源分别保存沿；触发使用当前触发源对应通道的沿
  - header: C<ch>:Volt_DIV
    level: implemented
    note: 探头尖的垂直档位；50 Ω 为 1 mV–1 V/div，1 MΩ 为 1 mV–10 V/div，越界取最接近的合法值（VAB 没有建模）
  - header: WAIT
    level: implemented
    note: 等待当前采集完成；带超时参数时最多等这么久
