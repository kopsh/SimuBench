# Command table for lecroy-wavepro804hd, from the command index of the MAUI Oscilloscopes Remote Control
# and Automation Manual (February 2026); levels and notes by hand.
schema: simubench.coverage/1
model: lecroy-wavepro804hd
sections:
- section: ACQUISITION — Controlling Waveform Captures
  commands:
  - header: ARM_acquisition
    level: implemented
    note: 单次采集：armed 后触发一次，采完停在 STOP；触发方式本身不变
  - header: AUTO_SETUP
    level: not_modeled
  - header: C<ch>:ATTeNuation
    level: implemented
    note: 数值是探头衰减比（1、2、5、10、…、10000）；改档时垂直档位与偏置按比例缩放，使探头尖的读数保持不变
  - header: BANDWIDTH_LIMIT
    level: not_modeled
  - header: COMBINE_CHANNELS
    level: not_modeled
  - header: C<ch>:CouPLing
    level: implemented
    note: D1M/A1M 为 1 MΩ，D50 为 50 Ω，GND 接地；GND 时输入仍按 1 MΩ 建模
  - header: FoRce_TRigger
    level: implemented
    note: 无论触发条件是否满足，立即采一帧
  - header: INTERLEAVED
    level: not_modeled
  - header: Memory_SIZe
    level: implemented
    note: 记录长度按存储深度与采样率取最小值；取值按手册的 500、1k、2.5k、…、100M 档取最接近的档
  - header: C<ch>:OFfSeT
    level: implemented
    note: 探头尖的偏置；越界按数据手册取最接近的合法值（VAB 状态位没有建模）
  - header: Reference_CLocK
    level: accepted
    note: 内部/外部参考时钟只保存，仿真时间基准不变
    affects_data: false
  - header: SAMPLE_CLOCK
    level: not_modeled
  - header: SEQUENCE
    level: not_modeled
  - header: STOP
    level: implemented
  - header: Time_DIV
    level: implemented
    note: 20 ps/div–1 ks/div，任意值；记录长度与采样率由存储深度决定
  - header: TRIG_COUPLING
    level: not_modeled
  - header: TRIG_DELAY
    level: not_modeled
  - header: '*TRG'
    level: implemented
    note: 与 ARM_acquisition 相同
  - header: C<ch>:TRig_LeVel
    level: implemented
    note: 按触发源分别保存电平；触发使用当前触发源对应通道的电平。手册的 ±4.1 格限制与越界 VAB 没有建模
  - header: TRig_MoDe
    level: implemented
    note: AUTO、NORM、SINGLE、STOP；SINGLE 采一帧后停止
  - header: TRIG_PATTERN
    level: not_modeled
  - header: TRig_SElect
    level: implemented
    note: 只建模 EDGE 与时间释抑（HT,TI,HV 秒）；脉宽、间隔、事件释抑报 -224
  - header: C<ch>:TRig_Slope
    level: implemented
    note: 按触发源分别保存沿；触发使用当前触发源对应通道的沿
  - header: C<ch>:Volt_DIV
    level: implemented
    note: 探头尖的垂直档位；50 Ω 为 1 mV–1 V/div，1 MΩ 为 1 mV–10 V/div，越界取最接近的合法值（VAB 没有建模）
  - header: WAIT
    level: implemented
    note: 等待当前采集完成；带超时参数时最多等这么久
