schema: simubench.instrument/1
id: keysight-e36312a
manufacturer: Keysight Technologies
model: E36312A
class: power_supply
version: 1
description: >-
  Keysight E36312A 三路可编程直流电源（CH1 6 V/5 A、CH2 25 V/1 A、CH3 25 V/1 A；常用命令子集）。
  Real model (D42)：命令、参数、默认值与回复按 E36300 系列编程指南（E36311-90008, Edition 12,
  June 2025）核对；每路输出是设定 → 复用 B1 的 CV/CC 控制环 → 功率级 → 输出继电器/sense →
  回读与 OVP 锁定，电压/电流/功率由电路求解得到。三个输出都按 E36312A 的正电压量程
  （-25 V 只属于 E36311A；手册的 N25V 在 E36312A 正常模式下输出 +25 V）。
  列表/任意波、触发、数据记录、校准、数字口与状态寄存器组不在本定义范围（覆盖表逐条列出）。
reference:
  title: Keysight E36300 Series Programmable DC Power Supplies Programming Guide
  document: E36311-90008
  version: Edition 12, June 2025
  firmware: E36312A as covered by Edition 12
identity:
  idn: "Keysight Technologies,E36312A,{serial},{firmware}"
  serial: MY59000001
  firmware: "1.0.0-1.0.0-1.0.0"
format:
  number: nr3
  digits: 8
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  error_code: signed
# 手册有、但本定义不回答的内置命令：*TRG（触发系统不在首波）、*PSC/*RCL/*SAV（状态存储）、
# SYSTem:DATE/TIME（实时时钟；引擎内置的回复格式与手册不同，见覆盖表）、SYSTem:ERRor:COUNt/ALL
# （手册没有）。其余公共命令由引擎内置，见覆盖表。
builtins: ["*IDN", "*RST", "*CLS", "*ESE", "*ESR", "*OPC", "*SRE", "*STB", "*TRG", "*TST", "*WAI", ":SYSTem:ERRor[:NEXT]"]
errors:
  -123: Numeric overflow
  -160: Block data error
  -161: Invalid block data
  -168: Block data not allowed
  -170: Expression error
  -171: Invalid expression
  -178: Expression data not allowed
  -260: Expression error
  -261: Math error in expression
  -400: Query error
  304: Voltage and current cannot be in Step and List mode at the same time
  307: List lengths are not equivalent
  308: This command is not allowed while list is running
  720: CH3 is not allowed when serial/parallel/track is enabled
  721: Calibration is not allowed when serial/parallel is enabled
  722: Multiple channels selection is not allowed during calibration
  729: Not allow to enable output
  735: Cannot change while trigger is initiated
specs:
  source: Command Reference 第 1 章 Programming Ranges and Output Identifiers；Reset and Non-volatile Settings 的 *RST 表
  outputs:
    1: {name: P6V, voltage_v: "0 … 6.18", current_a: "0.001 … 5.15", current_rst_a: 5}
    2: {name: P25V, voltage_v: "0 … 25.75", current_a: "0.001 … 1.03", current_rst_a: 1}
    3: {name: N25V, voltage_v: "0 … 25.75（E36312A 正常模式；-25.75 … 0 仅 E36311A/E3631A persona）", current_a: "0.001 … 1.03", current_rst_a: 1}
  ovp_rst_v: {1: 6.6, 2: 27.5, 3: 27.5}
  ovp_rst_note: 通道 1 的设置范围 0.5–6.6 V，通道 2/3 为 1.5–27.5 V
  resolution: "手册未给出电压/电流的编程或读数分辨率，只给出编程范围与 *RST 值"
  relay_time_s: 0.01
channels:
  count: 3
  # 省略通道列表的命令作用于 INSTrument:SELect / NSELect 选中的输出（#295）。
  selected: instrument.nselect
  overrides:
    1:
      voltage: {max: 6.18}
      current: {max: 5.15, default: 5.0}
      v_triggered: {max: 6.18}
      i_triggered: {max: 5.15}
      ovp: {min: 0.5, max: 6.6, default: 6.6}
      v_max: {default: 6.18}
      i_max: {default: 5.15}
      p_max: {default: 31.827}
      range: {default: P6V}
    2:
      ovp: {min: 1.5, max: 27.5, default: 27.5}
      v_max: {default: 25.75}
      i_max: {default: 1.03}
      p_max: {default: 26.5225}
      range: {default: P25V}
    3:
      ovp: {min: 1.5, max: 27.5, default: 27.5}
      v_max: {default: 25.75}
      i_max: {default: 1.03}
      p_max: {default: 26.5225}
      range: {default: P25V}
channel_state:
  # 输出触发系统（#548，E36311-90008 的 INITiate / TRIGger 子系统与 VOLTage|CURRent:TRIGgered、:MODE）：
  # 触发电平 *RST MIN（0）、模式 *RST FIXed、触发源 *RST BUS、触发延时 0–3600 s（*RST 0）。
  v_triggered:
    type: float
    unit: V
    min: 0.0
    max: 25.75
    default: 0.0
    label: 触发电压
    label_en: Triggered voltage
  i_triggered:
    type: float
    unit: A
    min: 0.0
    max: 1.03
    default: 0.0
    label: 触发电流
    label_en: Triggered current
  v_mode:
    type: enum
    options: [FIXed, STEP]
    default: FIXed
    not_modeled: {LIST: output lists are not modeled}
    label: 电压触发模式
    label_en: Voltage trigger mode
  i_mode:
    type: enum
    options: [FIXed, STEP]
    default: FIXed
    not_modeled: {LIST: output lists are not modeled}
    label: 电流触发模式
    label_en: Current trigger mode
  trig_source:
    type: enum
    options: [BUS, IMMediate]
    default: BUS
    not_modeled:
      EXTernal: digital port trigger inputs are not modeled
      PIN1: digital port trigger inputs are not modeled
      PIN2: digital port trigger inputs are not modeled
      PIN3: digital port trigger inputs are not modeled
    label: 触发源
    label_en: Trigger source
  trig_delay:
    type: float
    unit: S
    min: 0.0
    max: 3600.0
    default: 0.0
    label: 触发延时
    label_en: Trigger delay
  # 可疑仪表汇总寄存器 ISUMmary<n> 的使能（#348）：位 0 CC、位 1 CV（E36311-90008 Ed.3 p.32，#379）。
  isum_enable:
    type: int
    min: 0
    max: 65535
    default: 0
    rst: 0
    label: ISUM 使能
    label_en: ISUM enable
  # OCP（#271）：手册没有电流阈值命令；使能后输出处于 CC 的时间超过延迟即跳闸、关输出。
  ocp_enabled:
    type: bool
    default: false
    label: 过流保护
    label_en: Over-current protection
  ocp_delay:
    type: float
    unit: S
    min: 0.0
    max: 3600.0
    default: 0.05
    label: 过流保护延迟
    label_en: OCP delay
  ocp_start:
    type: enum
    options: [SCHange, CCTRans]
    default: SCHange
    label: 过流延迟起点
    label_en: OCP delay start
  voltage:
    type: float
    unit: V
    min: 0.0
    max: 25.75
    default: 0.0
    label: 电压设定
    label_en: Voltage setting
  current:
    type: float
    unit: A
    min: 0.001
    max: 1.03
    default: 1.0
    label: 电流限值
    label_en: Current limit
  output:
    type: bool
    default: false
    electrical: true
    label: 输出
    label_en: Output
  ovp:
    type: float
    unit: V
    min: 0.5
    max: 27.5
    default: 27.5
    label: 过压保护
    label_en: OVP level
  sense:
    type: enum
    options: [INTernal, EXTernal]
    default: INTernal
    label: 远端检测
    label_en: Remote sense
    option_labels: {INTernal: 内部, EXTernal: 外部}
  range:
    type: enum
    options: [P6V, P25V, LOW, HIGH]
    default: P6V
    label: 电压量程
    label_en: Voltage range
  v_max:
    type: float
    unit: V
    default: 25.75
    readonly: true
    label: 电压上限
    label_en: Voltage maximum
  i_max:
    type: float
    unit: A
    default: 1.03
    readonly: true
    label: 电流上限
    label_en: Current maximum
  p_max:
    type: float
    unit: W
    default: 25.75
    readonly: true
    label: 功率上限
    label_en: Power maximum
state:
  # 可疑状态寄存器组的使能（#348，位号按 E36311-90008 Ed.3 p.31–32 核实，#379）：QUEStionable 的位 13 汇总
  # INSTrument，INSTrument 的位 1–3 汇总
  # 各路 ISUMmary<n>；QUEStionable 的汇总进状态字节位 3。
  status.ques_enable:
    type: int
    min: 0
    max: 65535
    default: 0
    rst: 0
    label: QUES 使能
    label_en: QUES enable
  status.inst_enable:
    type: int
    min: 0
    max: 65535
    default: 0
    rst: 0
    label: QUES:INST 使能
    label_en: QUES:INST enable
  # 选中的输出（INSTrument:SELect 的 CH1/CH2/CH3 与 E3631A 式的 P6V/P25V/N25V，NSELect 的 1–3；
  # *RST 回到输出 1）。
  instrument.nselect:
    type: int
    min: 1
    max: 3
    default: 1
    special: {CH1: 1, CH2: 2, CH3: 3, P6V: 1, P25V: 2, N25V: 3}
    label: 选中的输出
    label_en: Selected output
  # 组合（手册 Specifying the Operation Mode / Using the Tracking Operation，#259）：
  # OUTPut:PAIR 选独立、内部并联或内部串联（由输出 2 输出，输出 3 停用）；跟踪是另一个开关。
  output.pair:
    type: enum
    options: ["OFF", PARallel, SERies]
    default: "OFF"
    label: 组合
    label_en: Pairing
    option_labels: {"OFF": 独立, PARallel: 并联, SERies: 串联}
  output.track:
    type: bool
    default: false
    label: 跟踪
    label_en: Tracking
  display.enabled:
    type: bool
    default: true
    label: 显示
    label_en: Display
  display.text:
    type: string
    default: ""
    label: 显示文本
    label_en: Display text
  display.view:
    type: enum
    options: [METER1, METER3]
    default: METER3
    label: 显示视图
    label_en: Display view
  beeper.state:
    type: bool
    default: true
    label: 蜂鸣器
    label_en: Beeper
  system.pon:
    type: enum
    options: [RST, RCL0, RCL1, RCL2, RCL3, RCL4, RCL5, RCL6, RCL7, RCL8, RCL9]
    default: RST
    label: 上电状态
    label_en: Power-on state
  system.inhibit:
    type: enum
    options: [LATChing, LIVE, "OFF"]
    default: "OFF"
    label: 禁止输入模式
    label_en: Inhibit mode
  system.rlst:
    type: enum
    options: [LOCal, REMote, RWLock]
    default: LOCal
    label: 远程/本地
    label_en: Remote/local state
  system.lxi_identify:
    type: bool
    default: false
    label: LXI 指示灯
    label_en: LXI identify
  system.mdns:
    type: bool
    default: false
    label: mDNS
    label_en: mDNS
  system.scpi_version:
    type: float
    default: 1999.0
    readonly: true
    label: SCPI 版本
    label_en: SCPI version
channel_components:
  # 每路：设定 DAC → B1 控制环（CV，电流限值触发 CC）→ 功率级 → 输出继电器/sense → 回读与 OVP。
  - name: set
    type: power_supply_setpoint
    params: {stage: stage, voltage: $ch.voltage, current: $ch.current}
  - name: stage
    type: power_stage
    params: {v_max: $ch.v_max, i_max: $ch.i_max, p_max: $ch.p_max}
  - name: loop
    type: output_control_loop
    params:
      function: VOLTage
      v_level: $ch.voltage
      i_level: 0.0
      i_limit: $ch.current
      v_limit: 0.0
      output: $ch.output
      channel_envelope: stage
  - name: out
    type: power_output
    params:
      output: $ch.output
      remote_sense: {from: $ch.sense, map: {INTernal: false, EXTernal: true}}
      loop: loop
      stage: stage
      protection: prot
      combination: track
  - name: prot
    type: supply_protection
    params:
      ovp: $ch.ovp
      ocp: 0.0
      output: $ch.output
      ocp_enabled: $ch.ocp_enabled
      ocp_delay: $ch.ocp_delay
      ocp_start: $ch.ocp_start
      voltage: $ch.voltage
      current: $ch.current
  - name: read
    type: supply_readback
    params: {output: out}
  # 每路的可疑仪表汇总寄存器（#348）：条件位来自本路的调节状态，事件位在条件变为真时置位、读后清零。
  # 输出触发系统（#548）：INIT 后一个触发（*TRG 或 IMMediate 源）在触发延时后把 STEP 模式的量改为触发电平。
  # 手册：未初始化时 *TRG "is simply ignored"，错误表没有 -211 → 不报错。手册没有 N6700 那样的
  # "初始化后几毫秒才就绪"的说明，就绪延时取 0；WTG 位（ABORt 一节提到 Questionable Instrument Summary
  # 的 WTG 位）在手册的位表里没有位置，不建模。
  - name: tran
    type: supply_transient
    params:
      voltage: $ch.voltage
      current: $ch.current
      v_triggered: $ch.v_triggered
      i_triggered: $ch.i_triggered
      v_mode: $ch.v_mode
      i_mode: $ch.i_mode
      source: $ch.trig_source
      delay: $ch.trig_delay
      trigger_ignored_error: 0
  - name: isum
    type: status_register
    params:
      bits: {CC: 0, CV: 1}
      enable: $ch.isum_enable
components:
  # 可疑状态寄存器组（#348）：INSTrument 汇总各路 ISUM，QUEStionable 汇总 INSTrument 并进状态字节位 3。
  - name: ques_inst
    type: status_register
    params:
      bits: {CH1.ISUM: 1, CH2.ISUM: 2, CH3.ISUM: 3}
      enable: $status.inst_enable
  - name: ques
    type: status_register
    params:
      bits: {QUES_INST: 13}
      enable: $status.ques_enable
      summary_bit: 3
  # 组合（#259）：内部拓扑——串联时输出 2 为 0–50 V/1 A、并联时 0–25 V/2 A，输出 3 停止工作；
  # 跟踪时输出 3 与输出 2 同电压（同号）。
  - name: track
    type: supply_tracking
    params:
      mode: $output.pair
      track: $output.track
      topology: internal
      voltage2: $ch2.voltage
      voltage3: $ch3.voltage
      current3: $ch3.current
      output2: $ch2.output
      output3: $ch3.output
ports:
  channel:
    "OUT{n}+": out.pos
    "OUT{n}-": out.neg
    "SENSE{n}+": out.sense_pos
    "SENSE{n}-": out.sense_neg
display:
  template: power_supply
  summary: [ch1.voltage, ch1.current, ch2.voltage, ch3.voltage, ch1.output]
capabilities: [power_supply]
commands:
  # ---- 选中的输出（#295）：省略通道列表的命令作用于它 ------------------------------------
  - header: "INSTrument[:SELect]"
    state: instrument.nselect
    reply: "CH{value}"
    doc: 接受 CH1/CH2/CH3 与 P6V/P25V/N25V；查询回 CH1/CH2/CH3。
  - header: "INSTrument:NSELect"
    state: instrument.nselect
  # ---- 设定与回读（通道列表展开，#183） ------------------------------------
  - header: "[:SOURce]:VOLTage[:LEVel][:IMMediate][:AMPLitude]"
    params:
      - {name: level, type: float, unit: V, state: "ch.voltage"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent[:LEVel][:IMMediate][:AMPLitude]"
    params:
      - {name: level, type: float, unit: A, state: "ch.current"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "OUTPut[:STATe]"
    params:
      - {name: state, type: bool, state: "ch.output"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
    dangerous: true
  - header: "MEASure[:SCALar]:VOLTage[:DC]"
    op: ch.read.measure
    set: false
    args: {what: voltage}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - header: "MEASure[:SCALar]:CURRent[:DC]"
    op: ch.read.measure
    set: false
    args: {what: current}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  # ---- 输出触发系统（#548） ----
  - header: "[:SOURce]:VOLTage[:LEVel]:TRIGgered[:AMPLitude]"
    params:
      - {name: level, type: float, unit: V, state: "ch.v_triggered"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent[:LEVel]:TRIGgered[:AMPLitude]"
    params:
      - {name: level, type: float, unit: A, state: "ch.i_triggered"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:VOLTage:MODE"
    params:
      - {name: mode, type: enum, options: [FIXed, STEP], state: "ch.v_mode", not_modeled: {LIST: output lists are not modeled}}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent:MODE"
    params:
      - {name: mode, type: enum, options: [FIXed, STEP], state: "ch.i_mode", not_modeled: {LIST: output lists are not modeled}}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "TRIGger[:SEQuence]:SOURce"
    params:
      - name: source
        type: enum
        options: [BUS, IMMediate]
        state: "ch.trig_source"
        not_modeled:
          EXTernal: digital port trigger inputs are not modeled
          PIN1: digital port trigger inputs are not modeled
          PIN2: digital port trigger inputs are not modeled
          PIN3: digital port trigger inputs are not modeled
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "TRIGger[:SEQuence]:DELay"
    params:
      - {name: delay, type: float, unit: S, state: "ch.trig_delay"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "INITiate[:IMMediate]"
    op: ch.tran.initiate
    query: false
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - header: "ABORt"
    op: ch.tran.abort
    query: false
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  # ---- 保护：OVP 的设定、查询、清除；OCP 按 CC 持续时间（#271） ----------------
  - header: "[:SOURce]:VOLTage:PROTection[:LEVel][:AMPLitude]"
    params:
      - {name: level, type: float, unit: V, state: "ch.ovp"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:VOLTage:PROTection:CLEar"
    op: ch.prot.clear
    query: false
    args: {kind: OVP}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - header: "[:SOURce]:VOLTage:PROTection:TRIPped"
    op: ch.prot.tripped
    set: false
    args: {kind: OVP}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - header: "[:SOURce]:CURRent:PROTection:STATe"
    params:
      - {name: state, type: bool, state: "ch.ocp_enabled"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent:PROTection:DELay[:TIME]"
    params:
      - {name: delay, type: float, unit: S, state: "ch.ocp_delay"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent:PROTection:DELay:STARt"
    params:
      - {name: start, type: enum, options: [SCHange, CCTRans], state: "ch.ocp_start"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
  - header: "[:SOURce]:CURRent:PROTection:TRIPped"
    op: ch.prot.tripped
    set: false
    args: {kind: OCP}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - header: "[:SOURce]:CURRent:PROTection:CLEar"
    op: ch.prot.clear
    query: false
    args: {kind: OCP}
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  - {header: "STATus:QUEStionable[:EVENt]", op: ques.event, set: false}
  - {header: "STATus:QUEStionable:ENABle", op: ques.enable, params: [{name: bit, type: raw, optional: true}]}
  - {header: "STATus:QUEStionable:INSTrument[:EVENt]", op: ques_inst.event, set: false}
  - {header: "STATus:QUEStionable:INSTrument:ENABle", op: ques_inst.enable, params: [{name: bit, type: raw, optional: true}]}
  - {header: "STATus:QUEStionable:INSTrument:ISUMmary<ch>[:EVENt]", op: ch.isum.event, set: false}
  - {header: "STATus:QUEStionable:INSTrument:ISUMmary<ch>:ENABle", op: ch.isum.enable, params: [{name: bit, type: raw, optional: true}]}
  # STATus:PRESet：可疑寄存器组的使能全部清零（SCPI 的 PRESet；事件不变）。
  - {header: "STATus:PRESet", op: ques.preset, query: false}
  - header: "STATus:QUEStionable:INSTrument:ISUMmary<ch>:CONDition"
    op: ch.read.condition
    set: false
    doc: 0 关或未调节、1 恒流、2 恒压（#271）。
    doc: 手册的查询没有通道列表，按 INSTrument:SELect 选中的输出回答（#295）；显式通道列表是额外的写法。
  - header: "OUTPut:PROTection:CLEar"
    op: ch.prot.clear
    query: false
    params: [{name: channels, type: channel_list, optional: true, default: [1]}]
  # ---- 远端检测与量程 --------------------------------------------------------
  - header: "[:SOURce]:VOLTage:SENSe[:SOURce]"
    params:
      - {name: sense, type: enum, options: [INTernal, EXTernal], state: "ch.sense"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
    doc: 选择内部（两线）或外部（四线）检测；外部检测需要测试台把 SENSE 端子接到负载。
  - header: "[:SOURce]:VOLTage:RANGe"
    params:
      - {name: range, type: enum, options: [P6V, P25V, LOW, HIGH], state: "ch.range"}
      - {name: channels, type: channel_list, optional: true, default: [1]}
    doc: >-
      每路只有一个电压量程（手册：接受并回显与该单一量程对应的值）；保存的值不参与仿真，
      覆盖表按“接受”登记。
  # ---- 组合（#259） ----------------------------------------------------------
  - header: "OUTPut:PAIR"
    state: output.pair
    doc: >-
      OFF（独立）、PARallel（输出 2 为 25 V/2 A）、SERies（输出 2 为 50 V/1 A）；输出 3 在串并联时
      停止工作。改组合需要输出 2、3 都关闭（否则 -221）。
  - header: "OUTPut:TRACk[:STATe]"
    state: output.track
    doc: 跟踪开启后输出 3 与输出 2 设为同一电压，改其中一路另一路随之变化。
  # ---- 显示（接受） ----------------------------------------------------------
  - header: ":DISPlay[:WINDow][:STATe]"
    state: display.enabled
  - header: ":DISPlay[:WINDow]:TEXT[:DATA]"
    state: display.text
  - header: ":DISPlay[:WINDow]:VIEW"
    state: display.view
  # ---- 系统配置（接受） ------------------------------------------------------
  - header: "SYSTem:BEEPer:STATe"
    state: beeper.state
  - header: "SYSTem:BEEPer[:IMMediate]"
    query: false
    params: [{name: state, type: bool, optional: true, state: beeper.state}]
    doc: 立即蜂鸣无参数、无回复；蜂鸣在仿真中没有效果。
  - header: "OUTPut:PON:STATe"
    state: system.pon
  - header: "OUTPut:INHibit:MODE"
    state: system.inhibit
  - header: "LXI:IDENtify[:STATe]"
    state: system.lxi_identify
  - header: "LXI:MDNS[:STATe]"
    state: system.mdns
  - header: "SYSTem:COMMunicate:RLSTate"
    state: system.rlst
  - header: "SYSTem:LOCal"
    query: false
    state: system.rlst
    set_value: LOCal
  - header: "SYSTem:REMote"
    query: false
    state: system.rlst
    set_value: REMote
  - header: "SYSTem:RWLock"
    query: false
    state: system.rlst
    set_value: RWLock
  - header: "SYSTem:VERSion"
    state: system.scpi_version
    set: false
    format: {number: nr2, digits: 1, sign: false}
