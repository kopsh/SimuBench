    label: AUX 输出 3
    label_en: AUX output 3
  display.dat3:
    type: int
    min: 0
    max: 16
    default: 3
    rst: 3
    label: 数据通道 4
    label_en: Data channel 4
    special: *id001
  display.graph3:
    type: int
    min: 0
    max: 1
    default: 1
    rst: 1
    label: 数据通道 4 曲线
