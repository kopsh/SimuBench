      TRIGstart: 硬件触发开始/停止未建模（后面板 TRIG IN 不在台架上）
      SAMPpertrig: 每个硬件触发一个样本未建模
components:
- name: osc
  type: lockin_reference
  params:
    source:
      from: $reference.source
      map:
        '0': INTernal
        '1': EXTernal
    frequency: $reference.frequency
    phase: $reference.phase
    harmonic: $reference.harmonic
    amplitude: $sine_out.amplitude
    dc_level: $sine_out.dc_level
    f_max: 4000000.0
    ext_slope:
      from: $reference.trigger
      map:
        '0': SINE
        '1': RISE
        '2': FALL
- name: out
  type: output_stage
  params:
    z_out: 50.0
    enabled: true
- name: sig_in
  type: input_port
  params:
    z_in:
      from: $input.mode
      map:
        '0': 10000000.0
        '1':
          from: $input.current_gain
          map:
            '0': 100.0
            '1': 1000.0
    c_in: 2.5e-11
- name: sig_b
  type: input_port
  params:
    z_in: 10000000.0
    c_in: 2.5e-11
- name: mode
  type: lockin_input_mode
  params:
    mode:
      from: $input.mode
      map:
        '0':
          from: $input.source
          map:
            '0': A
            '1': A-B
        '1': I
    current_z:
      from: $input.current_gain
      map:
        '0': 100.0
        '1': 1000.0
    current_scale:
      from: $input.current_gain
      map:
        '0': 1000000.0
        '1': 100000000.0
- name: ref_in
  type: input_port
  params:
    z_in:
      from: $reference.impedance
      map:
        '0': 50.0
        '1': 1000000.0
- name: front
  type: lockin_input_filter
  params:
    coupling:
      from: $input.coupling
      map:
        '0': AC
        '1': DC
    line_notch: false
    notch_2x: false
- name: amp
  type: lockin_input_amp
  params:
    sensitivity:
      from: $input.sensitivity
      table:
        0: 1.0
        1: 0.5
        2: 0.2
        3: 0.1
        4: 0.05
        5: 0.02
        6: 0.01
        7: 0.005
        8: 0.002
        9: 0.001
        10: 0.0005
        11: 0.0002
        12: 0.0001
        13: 5.0e-05
        14: 2.0e-05
        15: 1.0e-05
        16: 5.0e-06
        17: 2.0e-06
        18: 1.0e-06
        19: 5.0e-07
        20: 2.0e-07
        21: 1.0e-07
        22: 5.0e-08
        23: 2.0e-08
        24: 1.0e-08
        25: 5.0e-09
        26: 2.0e-09
        27: 1.0e-09
    reserve: 1000000000000.0
    input_limit:
      from: $input.range
      table:
        0: 1.0
        1: 0.3
        2: 0.1
        3: 0.03
        4: 0.01
- name: mixer
  type: lockin_mixer
- name: filter
  type: lockin_lowpass
  params:
    time_constant:
      from: $filter.time_constant
      table:
        0: 1.0e-06
        1: 3.0e-06
        2: 1.0e-05
        3: 3.0e-05
        4: 0.0001
        5: 0.0003
        6: 0.001
        7: 0.003
        8: 0.01
        9: 0.03
        10: 0.1
        11: 0.3
        12: 1.0
        13: 3.0
        14: 10.0
        15: 30.0
        16: 100.0
        17: 300.0
        18: 1000.0
        19: 3000.0
        20: 10000.0
        21: 30000.0
    slope:
      from: $filter.slope
      map:
        '0': '6'
        '1': '12'
        '2': '18'
        '3': '24'
    mixer: mixer
- name: demod
  type: lockin_output
  params:
    filter: filter
    amp: amp
    offset_x:
      from: $output.offset_on0
      map:
        '0': 0.0
        '1': $output.offset0
    offset_y:
      from: $output.offset_on1
      map:
        '0': 0.0
        '1': $output.offset1
    offset_r:
      from: $output.offset_on2
      map:
        '0': 0.0
        '1': $output.offset2
    expand_x:
      from: $output.expand0
      table:
        0: 1.0
        1: 10.0
        2: 100.0
    expand_y:
      from: $output.expand1
      table:
        0: 1.0
        1: 10.0
        2: 100.0
    expand_r:
      from: $output.expand2
      table:
        0: 1.0
        1: 10.0
        2: 100.0
    unit_scale:
      from: $input.mode
      map:
        '0': 1.0
        '1':
          from: $input.current_gain
          map:
            '0': 1.0e-06
            '1': 1.0e-08
    readings:
    - word: X
      source: X
    - word: Y
      source: Y
    - word: R
      source: R
    - word: THeta
      source: THETA
    - word: IN1
      source: aux.AUX1
    - word: IN2
      source: aux.AUX2
    - word: IN3
      source: aux.AUX3
    - word: IN4
      source: aux.AUX4
    - word: XNOise
      source: XNOISE
    - word: YNOise
      source: YNOISE
    - word: OUT1
      source: $aux.output1
    - word: OUT2
      source: $aux.output2
    - word: PHAse
      source: $reference.phase
    - word: SAMp
      source: $sine_out.amplitude
    - word: LEVel
      source: $sine_out.dc_level
    - word: FInt
      source: $reference.frequency
    - word: FExt
      source: osc.FREQUENCY
- name: lia
  type: status_register
  params:
    bits:
      OUTPT: 0
      UNLK: 3
      INPUT: 4
      TRIG: 7
    enable: $status.lia_enable
    width: 16
- name: err
  type: status_register
  params:
    bits:
      CLK: 0
      BACKUP: 1
      VXI: 4
    enable: $status.err_enable
    width: 8
- name: esr
  type: status_register
  params:
    mirror: esr
    width: 8
- name: spoll
  type: status_register
  params:
    bits:
      ERR: 2
      LIA: 3
      MAV: 4
      ESB: 5
    enable: $status.sre
    request_bit: 6
    width: 8
- name: aux
  type: lockin_aux
  params:
    dac1: $aux.output1
    dac2: $aux.output2
    dac3: $aux.output3
    dac4: $aux.output4
- name: cap
  type: curve_buffer
  params:
    trace1:
      from: $capture.config
      map:
        '0': demod.X
        '1': demod.X
        '2': demod.R
        '3': demod.X
    trace2:
      from: $capture.config
      map:
        '0': ''
        '1': demod.Y
        '2': demod.THETA
        '3': demod.Y
    trace3:
      from: $capture.config
      map:
        '0': ''
        '1': ''
        '2': ''
        '3': demod.R
    trace4:
      from: $capture.config
      map:
        '0': ''
        '1': ''
        '2': ''
        '3': demod.THETA
    rate:
      from: $filter.time_constant
      table:
        0:
          from: $capture.rate
          map: &id002
            '0': 1.0
            '1': 0.5
            '2': 0.25
            '3': 0.125
            '4': 0.0625
            '5': 0.03125
            '6': 0.015625
            '7': 0.0078125
            '8': 0.00390625
            '9': 0.001953125
            '10': 0.0009765625
            '11': 0.00048828125
            '12': 0.000244140625
            '13': 0.0001220703125
            '14': 6.103515625e-05
            '15': 3.0517578125e-05
            '16': 1.52587890625e-05
            '17': 7.62939453125e-06
            '18': 3.814697265625e-06
            '19': 1.9073486328125e-06
            '20': 9.5367431640625e-07
          scale: 1250000.0
        1:
          from: $capture.rate
          map: *id002
          scale: 1250000.0
        2:
          from: $capture.rate
          map: *id002
          scale: 1250000.0
        3:
          from: $capture.rate
          map: *id002
          scale: 625000.0
        4:
          from: $capture.rate
          map: *id002
          scale: 312500.0
        5:
          from: $capture.rate
          map: *id002
          scale: 156250.0
        6:
          from: $capture.rate
          map: *id002
          scale: 78125.0
        7:
          from: $capture.rate
          map: *id002
          scale: 39062.5
        8:
          from: $capture.rate
          map: *id002
          scale: 39062.5
        9:
          from: $capture.rate
          map: *id002
          scale: 9765.625
        10:
          from: $capture.rate
          map: *id002
          scale: 2441.40625
        11:
          from: $capture.rate
          map: *id002
          scale: 1220.703125
        12:
          from: $capture.rate
          map: *id002
          scale: 305.17578125
        13:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        14:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        15:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        16:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        17:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        18:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        19:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        20:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
        21:
          from: $capture.rate
          map: *id002
          scale: 152.587890625
    end:
      from: $capture.end
      map:
        '0': SHOT
        '1': LOOP
    capacity:
      from: $capture.config
      map:
        '0':
          from: $capture.length
          scale: 256
        '1':
          from: $capture.length
          scale: 128
        '2':
          from: $capture.length
          scale: 128
        '3':
          from: $capture.length
          scale: 64
wiring:
  instrument:
  - - osc.sine
    - out.in
  - - ref_in.out
    - osc.ext
  - - sig_in.out
    - mode.a
  - - sig_b.out
    - mode.b
  - - mode.out
    - front.in
  - - front.out
    - amp.in
  - - amp.out
    - filter.in
  - - osc.ref
    - filter.ref
  - - osc.ref
    - mixer.ref
ports:
  instrument:
    SIG_IN: sig_in.pin
    SIG_B: sig_b.pin
    I_IN: sig_in.pin
    REF_IN: ref_in.pin
    SINE_OUT: out.pin
    AUX_IN1: aux.in1
    AUX_IN2: aux.in2
    AUX_IN3: aux.in3
    AUX_IN4: aux.in4
    AUX_OUT1: aux.out1
    AUX_OUT2: aux.out2
    AUX_OUT3: aux.out3
    AUX_OUT4: aux.out4
  media:
    REF_IN: reference
display:
  template: lockin
  summary:
  - reference.source
  - reference.frequency
  - reference.harmonic
  - input.sensitivity
  - filter.time_constant
  - filter.slope
capabilities:
- lockin
commands:
- header: TBMODE
  state: reference.timebase
- header: TBSTAT
  state: reference.timebase_status
  set: false
- header: PHAS
  state: reference.phase
- header: APHS
  op: demod.auto_phase
  query: false
- header: FREQ
  state: reference.frequency
- header: FREQINT
  state: reference.frequency
- header: FREQEXT
  op: osc.frequency
  set: false
  args:
    what: actual
- header: FREQDET
  op: osc.frequency
  set: false
  args:
    what: detect
- header: HARM
  state: reference.harmonic
- header: SLVL
  state: sine_out.amplitude
- header: SOFF
  state: sine_out.dc_level
- header: REFM
  state: sine_out.dc_mode
- header: RSRC
  state: reference.source
- header: RTRG
  state: reference.trigger
- header: REFZ
  state: reference.impedance
- header: IVMD
  state: input.mode
- header: ISRC
  state: input.source
- header: ICPL
  state: input.coupling
- header: IGND
  state: input.shield_ground
- header: IRNG
  state: input.range
- header: ICUR
  state: input.current_gain
- header: SCAL
  state: input.sensitivity
- header: OFLT
  state: filter.time_constant
- header: OFSL
  state: filter.slope
- header: SYNC
  state: filter.sync
- header: ADVFILT
  state: filter.advanced
- header: ENBW
  op: filter.filter_info
  set: false
  args:
    what: enbw
- header: COUT
  params:
  - name: ch
    type: int
    min: 0
    max: 1
    index: true
    index_words:
      OCH1: 0
      OCH2: 1
    echo: false
    index_numbers: true
  - name: value
    type: int
    state: output.cout{ch}
- header: CEXP
  params:
  - name: q
    type: int
    min: 0
    max: 2
    index: true
    index_words:
      X: 0
      Y: 1
      R: 2
    echo: false
    index_numbers: true
  - name: value
    type: int
    state: output.expand{q}
- header: COFA
  params:
  - name: q
    type: int
    min: 0
    max: 2
    index: true
    index_words:
      X: 0
      Y: 1
      R: 2
    echo: false
    index_numbers: true
  - name: value
    type: int
    state: output.offset_on{q}
- header: COFP
  params:
  - name: q
    type: int
    min: 0
    max: 2
    index: true
    index_words:
      X: 0
      Y: 1
      R: 2
    echo: false
    index_numbers: true
  - name: value
    type: float
    state: output.offset{q}
- header: CDSP
  params:
  - name: ch
    type: int
    min: 0
    max: 3
    index: true
    index_words:
      DAT1: 0
      DAT2: 1
      DAT3: 2
      DAT4: 3
    echo: false
    index_numbers: true
  - name: value
    type: int
    state: display.dat{ch}
- header: CGRF
  params:
  - name: ch
    type: int
    min: 0
    max: 3
    index: true
    index_words:
      DAT1: 0
      DAT2: 1
      DAT3: 2
      DAT4: 3
    echo: false
    index_numbers: true
  - name: value
    type: int
    state: display.graph{ch}
- header: DBLK
  state: display.blank
- header: DLAY
  state: display.layout
- header: OUTP
  op: demod.readout
  set: false
  params:
  - name: names
    type: raw
- header: SNAP
  op: demod.readout
  set: false
  args:
    minimum: 2
    maximum: 3
  params:
  - name: names
    type: raw
- header: SNAPD
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat0
    - $display.dat1
    - $display.dat2
    - $display.dat3
    minimum: 4
    maximum: 4
- header: BLAZEX
  state: system.blazex
- header: KEYC
  state: system.sounds
- header: LOCL
  state: interface.local
- header: OVRM
  state: interface.override_remote
- header: '*ESE'
  op: esr.enable
  params:
  - name: bit
    type: int
    optional: true
  - name: value
    type: int
    optional: true
- header: '*ESR'
  op: esr.event
  set: false
  params:
  - name: bit
    type: int
    optional: true
- header: '*SRE'
  op: spoll.enable
  params:
  - name: bit
    type: int
    optional: true
  - name: value
    type: int
    optional: true
- header: '*STB'
  op: spoll.condition
  set: false
  params:
  - name: bit
    type: int
    optional: true
- header: '*PSC'
  state: status.psc
- header: ERRE
  op: err.enable
  params:
  - name: bit
    type: int
    optional: true
  - name: value
    type: int
    optional: true
- header: ERRS
  op: err.event
  set: false
  params:
  - name: bit
    type: int
    optional: true
- header: LIAE
  op: lia.enable
  params:
  - name: bit
    type: int
    optional: true
  - name: value
    type: int
    optional: true
- header: LIAS
  op: lia.event
  set: false
  params:
  - name: bit
    type: int
    optional: true
- header: CUROVLDSTAT
  op: lia.condition
  set: false
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat0
  when:
    j: DAT1
  params:
  - name: j
    type: raw
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat0
  when:
    j: '0'
  params:
  - name: j
    type: raw
- header: OAUX
  op: aux.read
  set: false
  args:
    index: 1
  when:
    j: '0'
  params:
  - name: j
    type: int
    min: 0
    max: 3
- header: AUXV
  op: aux.set_dac
  read: aux.output1
  args:
    index: 1
  when:
    j: '0'
  params:
  - name: j
    type: int
    min: 0
    max: 3
  - name: voltage
    type: float
    unit: V
    min: -10.5
    max: 10.5
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat1
  when:
    j: DAT2
  params:
  - name: j
    type: raw
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat1
  when:
    j: '1'
  params:
  - name: j
    type: raw
- header: OAUX
  op: aux.read
  set: false
  args:
    index: 2
  when:
    j: '1'
  params:
  - name: j
    type: int
    min: 0
    max: 3
- header: AUXV
  op: aux.set_dac
  read: aux.output2
  args:
    index: 2
  when:
    j: '1'
  params:
  - name: j
    type: int
    min: 0
    max: 3
  - name: voltage
    type: float
    unit: V
    min: -10.5
    max: 10.5
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat2
  when:
    j: DAT3
  params:
  - name: j
    type: raw
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat2
  when:
    j: '2'
  params:
  - name: j
    type: raw
- header: OAUX
  op: aux.read
  set: false
  args:
    index: 3
  when:
    j: '2'
  params:
  - name: j
    type: int
    min: 0
    max: 3
- header: AUXV
  op: aux.set_dac
  read: aux.output3
  args:
    index: 3
  when:
    j: '2'
  params:
  - name: j
    type: int
    min: 0
    max: 3
  - name: voltage
    type: float
    unit: V
    min: -10.5
    max: 10.5
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat3
  when:
    j: DAT4
  params:
  - name: j
    type: raw
- header: OUTR
  op: demod.readout
  set: false
  args:
    names:
    - $display.dat3
  when:
    j: '3'
  params:
  - name: j
    type: raw
- header: OAUX
  op: aux.read
  set: false
  args:
    index: 4
  when:
    j: '3'
  params:
  - name: j
    type: int
    min: 0
    max: 3
- header: AUXV
  op: aux.set_dac
  read: aux.output4
  args:
    index: 4
  when:
    j: '3'
  params:
  - name: j
    type: int
    min: 0
    max: 3
  - name: voltage
    type: float
    unit: V
    min: -10.5
    max: 10.5
- header: CAPTURELEN
  state: capture.length
- header: CAPTURECFG
  state: capture.config
- header: CAPTURESTART
  op: cap.start
  query: false
  args:
    fresh: true
  params:
  - name: mode
    type: float
    state: capture.end
  - name: start
    type: float
    state: capture.start
    not_modeled: *id003
- header: CAPTURESTOP
  op: cap.pause
  query: false
- header: CAPTURESTAT
  op: cap.capture_state
  set: false
- header: CAPTUREBYTES
  op: cap.bytes
  set: false
- header: CAPTUREPROG
  op: cap.progress
  set: false
- header: CAPTUREVAL
  op: cap.sample
  set: false
  params:
  - name: index
    type: int
    min: 0
- header: CAPTUREGET
  op: cap.get
  set: false
  args:
    framed: true
  params:
  - name: offset_kb
    type: int
    min: 0
    max: 4095
  - name: length_kb
    type: int
    min: 1
    max: 64
- header: CAPTURERATE
  op: cap.rate
  params:
  - name: n
    type: float
    optional: true
    state: capture.rate
