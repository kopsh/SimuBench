      X100: 2
  output.offset_on2:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: R 偏置开关
    label_en: R offset
    special:
      'OFF': 0
      'ON': 1
  output.offset2:
    type: float
