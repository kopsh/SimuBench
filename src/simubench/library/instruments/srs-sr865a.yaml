  aux.output2:
    type: float
    unit: V
    min: -10.5
    max: 10.5
    default: 0.0
    rst: 0.0
    label: AUX 输出 2
    label_en: AUX output 2
  display.dat2:
    type: int
    min: 0
    max: 16
    default: 2
