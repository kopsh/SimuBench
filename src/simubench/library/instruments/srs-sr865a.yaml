schema: simubench.instrument/1
id: srs-sr865a
manufacturer: Stanford Research Systems
model: SR865A
class: lockin
version: 1
description: Stanford Research Systems SR865A 4 MHz DSP 锁相放大器（SR860 系列；A/A−B 电压输入或电流输入、双相解调、1 V–1 nV 灵敏度、1 µs–30 ks 时间常数）。Real
  model（D42）：命令、参数、默认值与回复按 SR865A Operation Manual（Revision 2.11，文档号 9-01715-903）第 4 章 Programming；第 3 章的 Standard Settings
  给出 *RST 的值。SR865A 不是 SCPI：助记符 + 逗号分隔的参数，枚举参数可写序号或词（大写部分或全写），查询回序号；数值可带单位（KHZ、MV、MDEG、RAD 等），查询回基本单位，数值应答为 %g 格式。读数 OUTP?/SNAP?/SNAPD?/OUTR?
  走 lockin_output 的参数表（#383）。双参考与斩波器、同步滤波、正弦直流电平、扫描、数据捕获与流、FFT 与截屏不在本定义范围（覆盖表逐条列出）。
reference:
  title: SR865A 4 MHz DSP Lock-in Amplifier Operation Manual
  document: 9-01715-903
  version: Revision 2.11
  firmware: 第 4 章 Programming 的命令集（手册的 Remote Queue 说明适用于固件 1.55 及以上）
identity:
  idn: Stanford_Research_Systems,SR865A,{serial},{firmware}
  serial: '003210'
  firmware: v1.55
dialect:
  echo_header: 'off'
format:
  number: general
  digits: 11
  sign: false
  readings: format
  integer: plain
  boolean: numeric
  enum: short
  error_code: plain
builtins:
- '*IDN'
- '*RST'
- '*CLS'
- '*OPC'
- '*TST'
specs:
  source: Operation Manual Revision 2.11 第 4 章（命令）与第 3 章 Standard Settings
  sensitivity_full_scale_v:
  - 1.0
  - 0.5
  - 0.2
  - 0.1
  - 0.05
  - 0.02
  - 0.01
  - 0.005
  - 0.002
  - 0.001
  - 0.0005
  - 0.0002
  - 0.0001
  - 5.0e-05
  - 2.0e-05
  - 1.0e-05
  - 5.0e-06
  - 2.0e-06
  - 1.0e-06
  - 5.0e-07
  - 2.0e-07
  - 1.0e-07
  - 5.0e-08
  - 2.0e-08
  - 1.0e-08
  - 5.0e-09
  - 2.0e-09
  - 1.0e-09
  time_constant_s:
  - 1.0e-06
  - 3.0e-06
  - 1.0e-05
  - 3.0e-05
  - 0.0001
  - 0.0003
  - 0.001
  - 0.003
  - 0.01
  - 0.03
  - 0.1
  - 0.3
  - 1.0
  - 3.0
  - 10.0
  - 30.0
  - 100.0
  - 300.0
  - 1000.0
  - 3000.0
  - 10000.0
  - 30000.0
  filter_slope_db_per_octave:
  - 6
  - 12
  - 18
  - 24
  reference_frequency_hz: 1 mHz–4 MHz
  harmonic: 1–99
  sine_out_amplitude_vrms: 1 nV–2 V
  voltage_input: 10 MΩ ∥ 25 pF；量程 1 V/300 mV/100 mV/30 mV/10 mV
  current_input: 1 µA 档 100 Ω、10 nA 档 1 kΩ 虚地（手册第 3 章）；噪声 130 fA/√Hz、13 fA/√Hz
state:
  reference.timebase:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 10 MHz 时基
    label_en: 10 MHz timebase
    special:
      AUTO: 0
      IN: 1
      INTERNAL: 1
  reference.timebase_status:
    type: int
    min: 0
    max: 1
    default: 1
    rst: 1
    label: 当前时基（0 外部，1 内部）
    label_en: Timebase in use
    readonly: true
  reference.phase:
    type: float
    unit: DEG
    min: -180.0
    max: 180.0
    default: 0.0
    rst: 0.0
    display_unit: °
    label: 参考相位
    label_en: Reference phase
  reference.frequency:
    type: float
    unit: HZ
    min: 0.001
    max: 4000000.0
    default: 100000.0
    rst: 100000.0
    label: 内部参考频率
    label_en: Internal frequency
  reference.harmonic:
    type: int
    min: 1
    max: 99
    default: 1
    rst: 1
    label: 检测谐波
    label_en: Detection harmonic
  reference.source:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 参考源
    label_en: Reference source
    special:
      INT: 0
      EXT: 1
    not_modeled:
      DUAL: 双参考未建模
      CHOP: 斩波器参考未建模
  reference.trigger:
    type: int
    min: 0
    max: 2
    default: 0
    rst: 0
    label: 外部参考触发
    label_en: External reference trigger
    special:
      SIN: 0
      POS: 1
      POSTTL: 1
      NEG: 2
      NEGTTL: 2
  reference.impedance:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 外部参考输入阻抗
    label_en: External reference impedance
    special:
      '50': 0
      50OHMS: 0
      1M: 1
      1MEG: 1
  sine_out.amplitude:
    type: float
    unit: V
    min: 1.0e-09
    max: 2.0
    default: 1.0e-09
    rst: 1.0e-09
    label: 正弦输出幅度 (Vrms)
    label_en: Sine out amplitude (Vrms)
  # SOFF（#407，手册 p.109）：−5.00…+5.00 V，舍入到 3 位或 0.1 mV；复位 0 V。
  sine_out.dc_level:
    type: float
    unit: V
    min: -5.0
    max: 5.0
    default: 0.0
    rst: 0.0
    label: 正弦输出直流电平
    label_en: Sine out DC level
  # REFM（#407，手册 p.110）：直流方式 0 共模 / 1 差分，复位 0。台架只有 SINE_OUT（+）一路，
  # 它在两种方式下都带 +SOFF；差分只改变 − 输出（未建模），这里保存并回读。
  sine_out.dc_mode:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    special: {COM: 0, COMMON: 0, DIF: 1, DIFFERENCE: 1}
    label: 正弦输出直流方式
    label_en: Sine out dc mode
  input.mode:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 输入方式
    label_en: Input
    special:
      VOLT: 0
      VOLTAGE: 0
      CURR: 1
      CURRENT: 1
    electrical: true
  input.source:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 电压输入方式
    label_en: Voltage input
    special:
      A: 0
      A-B: 1
      A−B: 1
  input.coupling:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 输入耦合
    label_en: Coupling
    special:
      AC: 0
      DC: 1
  input.shield_ground:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 屏蔽接地
    label_en: Shield grounding
    special:
      FLO: 0
      FLOAT: 0
      GRO: 1
      GROUND: 1
  input.range:
    type: int
    min: 0
    max: 4
    default: 0
    rst: 0
    label: 电压输入量程
    label_en: Voltage input range
    special:
      1V: 0
      1VOLT: 0
      300M: 1
      300MVOLT: 1
      100M: 2
      100MVOLT: 2
      30M: 3
      30MVOLT: 3
      10M: 4
      10MVOLT: 4
  input.current_gain:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: 电流输入增益
    label_en: Current input gain
    special:
      1MEG: 0
      100MEG: 1
    electrical: true
  input.sensitivity:
    type: int
    min: 0
    max: 27
    default: 0
    rst: 0
    label: 灵敏度档（0 = 1 V，27 = 1 nV）
    label_en: Sensitivity index (0 = 1 V, 27 = 1 nV)
  filter.time_constant:
    type: int
    min: 0
    max: 21
    default: 10
    rst: 10
    label: 时间常数档（0 = 1 µs，21 = 30 ks）
    label_en: Time constant index (0 = 1 us, 21 = 30 ks)
  filter.slope:
    type: int
    min: 0
    max: 3
    default: 0
    rst: 0
    label: 滤波斜率
    label_en: Filter slope
  filter.sync:
    type: int
    min: 0
    max: 0
    default: 0
    rst: 0
    label: 同步滤波
    label_en: Sync filter
    special:
      'OFF': 0
    not_modeled:
      'ON': 同步滤波未建模
  filter.advanced:
    type: int
    min: 1
    max: 1
    default: 1
    rst: 1
    label: 高级滤波
    label_en: Advanced filter
    special:
      'ON': 1
    not_modeled:
      'OFF': 关闭高级滤波（输出纹波）未建模
  output.cout0:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: CH1 输出
    label_en: CH1 output
    special:
      XY: 0
      RTH: 1
      RTHETA: 1
  output.cout1:
    type: int
    min: 0
    max: 1
    default: 0
    rst: 0
    label: CH2 输出
    label_en: CH2 output
    special:
      XY: 0
      RTH: 1
      RTHETA: 1
  output.expand0:
    type: int
    min: 0
    max: 2
    default: 0
    rst: 0
    label: X 扩展
    label_en: X expand
    special:
      'OFF': 0
      X10: 1
      X100: 2
  output.offset_on0:
    type: int
