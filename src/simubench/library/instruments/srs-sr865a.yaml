    min: 0
    max: 1
    default: 0
    rst: 0
    label: Y 偏置开关
    label_en: Y offset
    special:
      'OFF': 0
      'ON': 1
  output.offset1:
    type: float
    min: -999.99
    max: 999.99
    default: 0.0
