    display_unit: '%'
    label: R 偏置
    label_en: R offset percent
  display.dat0:
    type: int
    min: 0
    max: 16
    default: 0
    rst: 0
    label: 数据通道 1
    label_en: Data channel 1
    special: &id001
      X: 0
