    display_unit: '%'
    label: Y 偏置
    label_en: Y offset percent
  output.expand2:
    type: int
    min: 0
    max: 2
    default: 0
    rst: 0
    label: R 扩展
    label_en: R expand
    special:
      'OFF': 0
