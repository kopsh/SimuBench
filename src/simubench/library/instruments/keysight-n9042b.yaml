schema: simubench.instrument/1
id: keysight-n9042b
manufacturer: Keysight Technologies
model: N9042B
class: spectrum_analyzer
version: 1
description: >-
  Keysight N9042B UXA X-Series signal analyzer, Spectrum Analyzer mode, Swept SA measurement,
  frequency option 526 (2 Hz to 26.5 GHz). Real model (D42). Commands, replies, presets and
  couplings follow the X-Series Spectrum Analyzer Mode User's & Programmer's Reference
  (N9060-90027, August 2014); the receiver chain is the split spectrum-analyzer blocks (D1 #187)
  with the X-Series limits declared on them (#616): 27 GHz tuning limit, RBW 1 Hz to 8 MHz in
  about 10% steps (span:RBW 106 when coupled), VBW to 8 MHz plus the 50 MHz wide-open setting,
  sweep time 1 ms to 4000 s, Normal (Rosenfell) detection with the automatic detector, and
  max/min hold. Only trace 1 and marker 1 exist; the measurement applications (ACP, CHP, OBW,
  TOI, SEM, ...), other modes, zero span, the preamplifier, triggers other than free run and the
  tracking source are not modeled; the coverage table names every remaining gap.
  tracking source are not modeled; the coverage table names every remaining gap. The front end
  follows the Data Sheet (3121-1037.EN, standard path, #960): noise figure, SHI, TOI and 1 dB
  compression for the band of the center frequency, and the CF = 1 GHz phase-noise table;
  flatness as a unit deviation and the LNA/PA options wait for #1004.
reference:
  title: Keysight X-Series Signal Analyzer Spectrum Analyzer Mode User's & Programmer's Reference
  document: N9060-90027
  version: August 2014
  firmware: >-
    X-Series Spectrum Analyzer mode as covered by the reference (the N9042B multi-touch firmware
    keeps the same SA-mode SCPI command set; the manual's 26 GHz values, option 526, are used)
identity:
  # The reference's *IDN? example: Keysight Technologies, N9020A, US01020004, A.01.02 — manufacturer,
  # model, serial number, firmware version.
  idn: "Keysight Technologies,N9042B,{serial},{firmware}"
  serial: "MY00000001"
  firmware: "A.25.05"
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST", ":SYSTem:ERRor[:NEXT]"]
error_queue: 20
# The reference writes numeric values as +1.92000000E+009 (its preset tables): eight decimals,
# three exponent digits, explicit sign. Markers and trace data answer in the same format.
format:
  number: nr3
  digits: 8
  sign: true
  exponent_digits: 3
  readings: format
  boolean: numeric
  enum: short
  error_code: signed
specs:
  frequency_option: "526: 2 Hz to 26.5 GHz; tuning limit 27.0 GHz (Center Frequency Presets table)"
  rbw: "1 Hz to 8 MHz (-3 dB Gaussian), about 10% steps; auto: span/106, at most 3 MHz"
  vbw: "1 Hz to 8 MHz in about 10% steps, plus 50 MHz (wide open)"
  sweep_time: "swept spans 1 ms to 4000 s"
  attenuation: "0 to 70 dB in 2 dB steps (mechanical attenuator)"
  sweep_points: "1 to 40001, preset 1001"
  # 前端指标（#960）：N9042B UXA X-Series Signal Analyzer, Multi-touch Data Sheet（3121-1037.EN，
  # July 1, 2024，manuals/3121-1037）。只用标准路径（1a：swept、preselector on、LNA off、PA off）。
  datasheet: "Keysight N9042B UXA X-Series Signal Analyzer, Multi-touch Data Sheet, 3121-1037.EN, July 1, 2024"
  frequency_response: >-
    p.10 1a. Standard path frequency response (10 dB input attenuation, relative to 50 MHz), full
    range: 9 kHz to 20 MHz ±0.54 dB; >20 to 50 MHz ±0.44 dB; >50 MHz to 3.6 GHz ±0.58 dB; >3.6 to
    5.2 GHz ±2.70 dB; >5.2 to 8.4 GHz ±2.50 dB; >8.4 to 13.6 GHz ±2.00 dB; >13.6 to 17.1 GHz
    ±2.00 dB; >17.1 to 26.5 GHz ±2.32 dB (not declared: a deviation of the flatness table needs #1004)
  preamplifiers: >-
    p.18 LNA (options P44/P4L/P50/P5L) and PA, 40 dB together nominal (options; not declared, #1004)
  gain_compression: >-
    p.19 1 dB gain compression, 1a. PA off (nominal, mixer power): 20 to 40 MHz +2 dBm; >40 MHz to
    3.6 GHz +5 dBm; >3.6 to 13.5 GHz +8 dBm; >13.5 to 26.5 GHz +3 dBm; >26.5 to 50 GHz +6 dBm
  danl: >-
    p.21 DANL 1a. Standard path (input terminated, sample or average detector, log averaging, IF
    gain high, 1 Hz RBW, 0 dB attenuation), typical: 2 to 10 Hz -90 dBm (nominal); >10 to 100 Hz
    -115 (nominal); >100 Hz to 1 kHz -128 (nominal); >1 to 9 kHz -138 (nominal); >9 to 100 kHz -146;
    >100 kHz to 1 MHz -155; >1 to 10 MHz -156; >10 MHz to 1.2 GHz -155; >1.2 to 2.1 GHz -154; >2.1
    to 3.6 GHz -152; >3.6 to 6.6 GHz -150; >6.6 to 8.4 GHz -151; >8.4 to 13.6 GHz -149; >13.6 to
    17.1 GHz -149; >17.1 to 22.5 GHz -146; >22.5 to 26.5 GHz -143; >26.5 to 30 GHz -140 dBm (full
    range at 10 MHz to 1.2 GHz: -150 dBm)
  residuals_images: >-
    p.25 Residual responses (input terminated, 0 dB attenuation) 200 kHz to 8.4 GHz -100 dBm, no
    frequencies given (not declared). Image responses (mixer level -10 dBm) at f+45 MHz, f+645 MHz
    and f+10,245 MHz, -80 dBc (-70 dBc at f+645 MHz above 22 GHz): above the tuned frequency, where
    the model's single image (f - 2·IF, below it) is not — not declared
  shi: >-
    p.26 SHI 1a. Standard path (mixer level -15 dBm): 10 MHz to 1.8 GHz +46 dBm; >1.8 to 3 GHz
    +52 dBm; >3 to 5.2 GHz +55 dBm; >5.2 to 13.25 GHz +64 dBm; >13.25 to 25.0 GHz +53 dBm
  toi: >-
    p.27 TOI 1a. Standard path (two -16 dBm tones at the mixer), typical: 10 to 350 MHz +18 dBm;
    >350 MHz to 1.1 GHz +19; >1.1 to 3.0 GHz +21; >3.0 to 3.6 GHz +22; >3.6 to 13.6 GHz +19; >13.6
    to 21 GHz +16; >21 to 26.5 GHz +18; >26.5 to 34.5 GHz +19 dBm
  phase_noise: >-
    p.29 Phase noise (SSB), CF = 1 GHz, typical: 10 Hz -93 dBc/Hz (wide reference loop); 100 Hz
    -112; 1 kHz -127; 10 kHz -135; 100 kHz -141; 1 MHz -146; 10 MHz -157 dBc/Hz
state:
  freq.center:
    type: float
    unit: HZ
    min: 0.0
    max: 27.0e9
    default: 13.255e9
    label: 中心频率
    label_en: Center
  freq.span:
    type: float
    unit: HZ
    min: 10.0
    max: 27.0e9
    default: 26.49e9
    label: 跨度
    label_en: Span
  freq.step:
    type: float
    unit: HZ
    min: 1.0
    max: 27.0e9
    default: 2.649e9
    label: 中心频率步进
    label_en: CF step
  freq.step_auto:
    type: bool
    default: true
    label: 中心频率步进自动
    label_en: CF step auto
  bw.res:
    type: float
    unit: HZ
    min: 1.0
    max: 8.0e6
    default: 3.0e6
    label: 分辨率带宽（手动）
    label_en: RBW (manual)
  bw.res_auto:
    type: bool
    default: true
    label: RBW 自动
    label_en: RBW auto
  bw.vid:
    type: float
    unit: HZ
    min: 1.0
    max: 50.0e6
    default: 3.0e6
    label: 视频带宽（手动）
    label_en: VBW (manual)
  bw.vid_auto:
    type: bool
    default: true
    label: VBW 自动
    label_en: VBW auto
  sweep.time:
    type: float
    unit: S
    min: 1.0e-3
    max: 4000.0
    default: 0.1
    label: 扫描时间（手动）
    label_en: Sweep time (manual)
  sweep.time_auto:
    type: bool
    default: true
    label: 扫描时间自动
    label_en: Sweep time auto
  sweep.points:
    type: int
    min: 1
    max: 40001
    default: 1001
    label: 迹线点数
    label_en: Points
  power.att:
    type: float
    unit: DB
    min: 0.0
    max: 70.0
    default: 10.0
    label: 衰减（手动）
    label_en: Attenuation (manual)
  power.att_auto:
    type: bool
    default: true
    label: 衰减自动
    label_en: Attenuation auto
  display.ref_level:
    type: float
    unit: DBM
    min: -170.0
    max: 30.0
    default: 0.0
    label: 参考电平
    label_en: Reference level
  detector:
    type: enum
    options: [NORMal, POSitive, SAMPle, NEGative]
    default: NORMal
    not_modeled:
      AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
      QPEak: the CISPR detectors are not modeled
      EAVerage: the CISPR detectors are not modeled
      RAVerage: the CISPR detectors are not modeled
      EPOSitive: the EMI standards are not modeled
      MPOSitive: the EMI standards are not modeled
      RMS: the average detector with RMS averaging is not modeled
    label: 检波器（手动）
    label_en: Detector (manual)
    option_labels: {NORMal: 常态, POSitive: 正峰值, SAMPle: 采样, NEGative: 负峰值}
  detector_auto:
    type: bool
    default: true
    label: 检波器自动
    label_en: Detector auto
  trace.type:
    type: enum
    options: [WRITe, AVERage, MAXHold, MINHold]
    default: WRITe
    label: 迹线类型
    label_en: Trace type
    option_labels: {WRITe: 刷新, AVERage: 平均, MAXHold: 最大保持, MINHold: 最小保持}
  aver.count:
    type: int
    min: 1
    max: 10000
    default: 100
    label: 平均/保持次数
    label_en: Average/hold count
  aver.type:
    type: enum
    options: [LOG]
    default: LOG
    not_modeled:
      RMS: power (RMS) averaging is not modeled
      SCALar: voltage averaging is not modeled
      LINear: voltage averaging is not modeled
      VOLTage: voltage averaging is not modeled
    label: 平均类型
    label_en: Average type
  aver.type_auto:
    type: bool
    default: true
    label: 平均类型自动
    label_en: Average type auto
  marker.x:
    type: float
    unit: HZ
    min: 0.0
    max: 27.0e9
    default: 13.255e9
    label: 标记频率
    label_en: Marker
  marker.mode:
    type: enum
    options: [POSition, DELTa, "OFF"]
    default: "OFF"
    not_modeled:
      FIXed: fixed markers are not modeled
    label: 标记模式
    label_en: Marker mode
  marker.ref_x:
    type: float
    unit: HZ
    default: 0.0
    label: 参考标记频率
    label_en: Reference marker
  marker.ref_y:
    type: float
    unit: DBM
    default: 0.0
    label: 参考标记电平
    label_en: Reference marker level
  marker.count:
    type: bool
    default: false
    label: 标记计数器
    label_en: Marker counter
  marker.search:
    type: enum
    options: [MAXimum, PARameter]
    default: MAXimum
    label: 峰值搜索方式
    label_en: Peak search mode
  marker.threshold:
    type: float
    unit: DBM
    min: -370.0
    max: 30.0
    default: -90.0
    label: 峰值门限
    label_en: Peak threshold
  marker.excursion:
    type: float
    unit: DB
    min: 0.0
    max: 100.0
    default: 6.0
    label: 峰值偏移
    label_en: Peak excursion
  init.continuous:
    type: bool
    default: true
    rst: false
    label: 连续扫描
    label_en: Continuous
  trigger.source:
    type: enum
    options: [IMMediate]
    default: IMMediate
    not_modeled:
      EXTernal: external triggers are not modeled
      EXTernal1: external triggers are not modeled
      EXTernal2: external triggers are not modeled
      LINE: the line trigger is not modeled
      FRAMe: the frame trigger is not modeled
      RFBurst: the RF burst trigger is not modeled
      VIDeo: the video trigger is not modeled
      IF: the IF trigger is not modeled
      ALARm: the alarm trigger is not modeled
      LAN: the LAN trigger is not modeled
      IQMag: the I/Q triggers are not modeled
      IDEMod: the I/Q triggers are not modeled
      QDEMod: the I/Q triggers are not modeled
      IINPut: the I/Q triggers are not modeled
      QINPut: the I/Q triggers are not modeled
      AIQMag: the I/Q triggers are not modeled
      TV: the TV trigger is not modeled
    label: 触发源
    label_en: Trigger source
  format.data:
    type: enum
    options: [ASCii]
    default: ASCii
    not_modeled:
      INTeger: binary trace transfer is not modeled
      REAL: binary trace transfer is not modeled
    label: 数据格式
    label_en: Data format
  format.border:
    type: enum
    options: [NORMal, SWAPped]
    default: NORMal
    label: 字节序
    label_en: Byte order
  unit.power:
    type: enum
    options: [DBM]
    default: DBM
    not_modeled:
      DBMV: amplitude units other than dBm are not modeled
      DBMA: amplitude units other than dBm are not modeled
      V: amplitude units other than dBm are not modeled
      W: amplitude units other than dBm are not modeled
      A: amplitude units other than dBm are not modeled
      DBUV: amplitude units other than dBm are not modeled
      DBUA: amplitude units other than dBm are not modeled
      DBPW: amplitude units other than dBm are not modeled
      DBUVM: amplitude units other than dBm are not modeled
      DBUAM: amplitude units other than dBm are not modeled
      DBPT: amplitude units other than dBm are not modeled
      DBG: amplitude units other than dBm are not modeled
    label: 电平单位
    label_en: Amplitude unit
  system.options:
    type: string
    default: "526"
    readonly: true
    label: 选件
    label_en: Options
  # ---- display settings (accepted: they change the screen only) ----
  display.enable:
    type: bool
    default: true
    label: 显示
    label_en: Display
  display.pdiv:
    type: float
    unit: DB
    min: 0.1
    max: 20.0
    default: 10.0
    label: 每格电平
    label_en: Scale/div
  display.dline:
    type: float
    unit: DBM
    min: -370.0
    max: 30.0
    default: -25.0
    label: 显示线
    label_en: Display line
  display.dline_on:
    type: bool
    default: false
    label: 显示线开关
    label_en: Display line on
  display.annotation:
    type: bool
    default: true
    label: 屏幕注释
    label_en: Screen annotation
components:
  - name: rf_in
    type: input_port
    params: {z_in: 50.0}
  - name: ref_in
    type: input_port
    params: {z_in: 50.0}
  - name: clock
    type: reference_clock
    params: {source: INTernal, nominal_hz: 10e6}
  - name: input
    type: specan_input
    params:
      z_in: 50.0
      # Auto attenuation: the reference's preset is 0 dBm with 10 dB, i.e. a -10 dBm mixer level.
      max_mixer_level: -10.0
      att: $power.att
      att_auto: $power.att_auto
      ref_level: $display.ref_level
  - name: mixer
    type: specan_mixer
    params:
      lo: lo
      # 整机噪声系数，按中心频率所在频段（数据手册第 21 页 DANL 1a 的 typical 列）。DANL 的条件是
      # 0 dB 衰减、RBW 1 Hz、对数平均（比功率低 2.51 dB），本模型的噪声底 = −174 dBm/Hz + NF +
      # 10·lg(1.0645 × 1 Hz) − 2.51，故 NF = DANL + 176.24 dB。100 Hz–9 kHz 各段取 nominal 值；
      # 频段的写法“> a 到 b”取下沿 a 为表项（2.3 的 table：取不大于中心频率的最大表项）。
      noise_figure:
        from: $freq.center
        table: {0: 86.24, 10.0: 61.24, 100.0: 48.24, 1.0e3: 38.24, 9.0e3: 30.24, 100.0e3: 21.24, 1.0e6: 20.24, 10.0e6: 21.24, 1.2e9: 22.24, 2.1e9: 24.24, 3.6e9: 26.24, 6.6e9: 25.24, 8.4e9: 27.24, 17.1e9: 30.24, 22.5e9: 33.24, 26.5e9: 36.24}
      # 二次谐波截点（第 26 页 SHI 1a，混频器电平 −15 dBm）：本模型的二次谐波 = 2P − IIP2 − 6.02 dB，
      # SHI = IIP2 + 6.02，故 IIP2 = SHI − 6.02。10 MHz 以下、25 GHz 以上手册没有给，不声明（理想）。
      iip2_dbm:
        from: $freq.center
        table: {0: null, 10.0e6: 39.98, 1.8e9: 45.98, 3.0e9: 48.98, 5.2e9: 57.98, 13.25e9: 46.98, 25.0e9: null}
      # 三阶截点（第 27 页 TOI 1a，两个 −16 dBm 的音在混频器处，typical 列）；10 MHz 以下不声明。
      iip3_dbm:
        from: $freq.center
        table: {0: null, 10.0e6: 18.0, 350.0e6: 19.0, 1.1e9: 21.0, 3.0e9: 22.0, 3.6e9: 19.0, 13.6e9: 16.0, 21.0e9: 18.0, 26.5e9: 19.0}
      # 1 dB 压缩点（第 19 页 1a PA off，混频器功率，nominal）；20 MHz 以下不声明。
      p1db_dbm:
        from: $freq.center
        table: {0: null, 20.0e6: 2.0, 40.0e6: 5.0, 3.6e9: 8.0, 13.5e9: 3.0, 26.5e9: 6.0}
  - name: lo
    type: specan_lo
    params:
      clock: clock
      source: INTernal
      if_filter: if_filter
      center: $freq.center
      # 单边带相位噪声（第 29 页，CF = 1 GHz，typical 列；10 Hz 取宽参考环路）；表外按端点延伸。
      phase_noise: [[10.0, -93.0], [100.0, -112.0], [1.0e3, -127.0], [1.0e4, -135.0], [1.0e5, -141.0], [1.0e6, -146.0], [1.0e7, -157.0]]
  - name: if_filter
    type: specan_if
    params:
      rbw: $bw.res
      rbw_auto: $bw.res_auto
      span: $freq.span
      steps: "10%"
      rbw_min: 1.0
      rbw_max: 8.0e6
      auto_ratio: 106.0
      auto_max: 3.0e6
  - name: detector
    type: specan_detector
    params: {detector: $detector, auto: $detector_auto, trace_mode: $trace.type}
  - name: vbw
    type: specan_vbw
    params: {vid: $bw.vid, vid_auto: $bw.vid_auto, if_filter: if_filter, steps: "10%", vbw_min: 1.0, vbw_max: 50.0e6}
  - name: sa
    type: specan_trace
    params:
      input: input
      lo: lo
      if_filter: if_filter
      detector: detector
      vbw: vbw
      max_hold_sweeps: 10000
      hold_count: true
      center_fit: span
      f_max: 27.0e9
      span_min: 10.0
      sweep_min: 1.0e-3
      sweep_max: 4000.0
      marker_off_reply: nan
      delta_x: offset
  - name: sys
    type: system
wiring:
  instrument:
    - [rf_in.out, input.in]
    - [input.out, mixer.in]
    - [mixer.out, if_filter.in]
    - [ref_in.out, clock.ref]
ports:
  instrument:
    RF_IN: rf_in.pin
    REF_IN: ref_in.pin
  media: {REF_IN: reference}
display:
  template: spectrum_analyzer
  summary: [freq.center, freq.span, display.ref_level, detector, trace.type]
capabilities: [spectrum_analyzer]
commands:
  # ---- common commands beyond the built-ins ----------------------------------------------------
  - header: "*OPT"
    state: system.options
    set: false
    reply: "526"
    doc: 只装频率选件 526（2 Hz–26.5 GHz）；其余选件未建模。
  # ---- frequency -------------------------------------------------------------------------------
  - header: "[:SENSe]:FREQuency:CENTer"
    op: sa.frequency
    args: {what: center}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:SPAN"
    op: sa.frequency
    args: {what: span}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STARt"
    op: sa.frequency
    args: {what: start}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STOP"
    op: sa.frequency
    args: {what: stop}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:CENTer:STEP[:INCRement]"
    state: freq.step
  - header: "[:SENSe]:FREQuency:CENTer:STEP:AUTO"
    state: freq.step_auto
  # ---- resolution and video bandwidth ----------------------------------------------------------
  # The reference writes BANDwidth|BWIDth; each spelling is its own header pattern.
  - header: "[:SENSe]:BANDwidth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BWIDth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BANDwidth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BANDwidth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BWIDth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BANDwidth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  # ---- sweep -----------------------------------------------------------------------------------
  - header: "[:SENSe]:SWEep:TIME:AUTO"
    state: sweep.time_auto
  - header: "[:SENSe]:SWEep:TIME"
    op: sa.coupled_sweep
    params: [{name: value, type: float, unit: S, optional: true}]
  - header: "[:SENSe]:SWEep:POINts"
    state: sweep.points
  # ---- amplitude -------------------------------------------------------------------------------
  - header: "[:SENSe]:POWer[:RF]:ATTenuation:AUTO"
    state: power.att_auto
  - header: "[:SENSe]:POWer[:RF]:ATTenuation"
    op: input.coupled_att
    params: [{name: value, type: float, unit: DB, optional: true}]
  - header: ":DISPlay:WINDow<n>:TRACe:Y[:SCALe]:RLEVel"
    state: display.ref_level
    suffixes: {n: [1]}
  - header: ":UNIT:POWer"
    state: unit.power
  # ---- detector, trace, averaging --------------------------------------------------------------
  - header: "[:SENSe]:DETector:TRACe<t>"
    op: detector.select
    suffixes: {t: [1]}
    params:
      - name: value
        type: enum
        options: [NORMal, POSitive, SAMPle, NEGative]
        optional: true
        not_modeled:
          AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
          QPEak: the CISPR detectors are not modeled
          EAVerage: the CISPR detectors are not modeled
          RAVerage: the CISPR detectors are not modeled
          EPOSitive: the EMI standards are not modeled
          MPOSitive: the EMI standards are not modeled
          RMS: the average detector with RMS averaging is not modeled
    doc: 查询回当前使用的检波器（自动时为自动规则所选）；设置即手动，关闭自动。
  - header: "[:SENSe]:DETector[:FUNCtion]"
    op: detector.select
    params:
      - name: value
        type: enum
        options: [NORMal, POSitive, SAMPle, NEGative]
        optional: true
        not_modeled:
          AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
          QPEak: the CISPR detectors are not modeled
          EAVerage: the CISPR detectors are not modeled
          RAVerage: the CISPR detectors are not modeled
          EPOSitive: the EMI standards are not modeled
          MPOSitive: the EMI standards are not modeled
          RMS: the average detector with RMS averaging is not modeled
    doc: 旧式命令：对所有迹线设置检波器（只有迹线 1），查询回迹线 1 的检波器。
  - header: "[:SENSe]:DETector:TRACe<t>:AUTO"
    state: detector_auto
    suffixes: {t: [1]}
  - header: "[:SENSe]:DETector:AUTO"
    state: detector_auto
  - header: ":TRACe<t>:TYPE"
    state: trace.type
    suffixes: {t: [1]}
  - header: ":TRACe[:DATA]"
    op: sa.trace_data
    set: false
    params: [{name: name, type: string, optional: true}]
  - header: ":TRACe:CLEar:ALL"
    op: sa.trace_clear
    query: false
  - header: "[:SENSe]:AVERage:COUNt"
    state: aver.count
  - header: "[:SENSe]:AVERage:TYPE"
    state: aver.type
  - header: "[:SENSe]:AVERage:TYPE:AUTO"
    state: aver.type_auto
  - header: "[:SENSe]:AVERage:CLEar"
    op: sa.trace_clear
    query: false
  - header: ":FORMat[:TRACe][:DATA]"
    state: format.data
  - header: ":FORMat:BORDer"
    state: format.border
    doc: 只影响二进制块的字节序；只实现 ASCii，保存并回读。
  # ---- markers ---------------------------------------------------------------------------------
  - header: ":CALCulate:MARKer<m>:MODE"
    state: marker.mode
    suffixes: {m: [1]}
    doc: OFF 关闭标记；从 OFF 打开时标记在屏幕中心；DELTa 把参考标记固定在当前位置。
  - header: ":CALCulate:MARKer<m>:X"
    op: sa.marker
    suffixes: {m: [1]}
    args: {what: x}
    params: [{name: value, type: float, unit: HZ, optional: true}]
    doc: 差值模式下 X 是相对参考标记的偏移；标记关闭时查询回 9.91E+37。
  - header: ":CALCulate:MARKer<m>:Y"
    op: sa.marker
    set: false
    suffixes: {m: [1]}
    args: {what: y}
  - header: ":CALCulate:MARKer<m>:MAXimum"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: max}
  - header: ":CALCulate:MARKer<m>:MAXimum:NEXT"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: next}
  - header: ":CALCulate:MARKer<m>:MAXimum:LEFT"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: left}
  - header: ":CALCulate:MARKer<m>:MAXimum:RIGHt"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: right}
  - header: ":CALCulate:MARKer<m>:MINimum"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: min}
  - header: ":CALCulate:MARKer:AOFF"
    op: sa.marker_off
    query: false
  - header: ":CALCulate:MARKer:PEAK:SEARch:MODE"
    state: marker.search
  - header: ":CALCulate:MARKer:PEAK:THReshold"
    state: marker.threshold
  - header: ":CALCulate:MARKer:PEAK:EXCursion"
    state: marker.excursion
  - header: ":CALCulate:MARKer<m>:FCOunt[:STATe]"
    state: marker.count
    suffixes: {m: [1]}
  - header: ":CALCulate:MARKer<m>:FCOunt:X"
    op: sa.marker
    set: false
    suffixes: {m: [1]}
    args: {what: count}
  # ---- initiate, abort, trigger ----------------------------------------------------------------
  - header: ":INITiate:CONTinuous"
    state: init.continuous
  - header: ":INITiate[:IMMediate]"
    op: sa.initiate
    query: false
  - header: ":INITiate:RESTart"
    op: sa.initiate
    query: false
    doc: 重新开始测量：单次扫描下与 INIT:IMM 相同，取平均/保持次数的扫描。
  - header: ":ABORt"
    op: sa.trace_clear
    query: false
    doc: 中止当前扫描；连续扫描时从头重新开始。
  - header: ":TRIGger[:SEQuence]:SOURce"
    state: trigger.source
  - header: ":TRIGger[:SEQuence]:RF:SOURce"
    state: trigger.source
  # ---- preset ----------------------------------------------------------------------------------
  - header: ":SYSTem:PRESet"
    op: sys.reset
    query: false
    args: {then: {init.continuous: true}}
    doc: 与 *RST 相同的预置，但连续扫描为 ON（手册：SYST:PRES 置 INIT:CONT ON，*RST 置 OFF）。
  # ---- display (accepted: screen only) ---------------------------------------------------------
  - header: ":DISPlay:ENABle"
    state: display.enable
  - header: ":DISPlay:WINDow<n>:TRACe:Y[:SCALe]:PDIVision"
    state: display.pdiv
    suffixes: {n: [1]}
  - header: ":DISPlay:WINDow<n>:TRACe:Y:DLINe"
    state: display.dline
    suffixes: {n: [1]}
  - header: ":DISPlay:WINDow<n>:TRACe:Y:DLINe:STATe"
    state: display.dline_on
    suffixes: {n: [1]}
  - header: ":DISPlay:ANNotation:TRACe[:STATe]"
    state: display.annotation
