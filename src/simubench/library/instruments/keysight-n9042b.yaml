schema: simubench.instrument/1
id: keysight-n9042b
manufacturer: Keysight Technologies
model: N9042B
class: spectrum_analyzer
version: 1
description: >-
  Keysight N9042B UXA X-Series signal analyzer, Spectrum Analyzer mode, Swept SA measurement,
  frequency option 526 (2 Hz to 26.5 GHz). Real model (D42). Commands, replies, presets and
  couplings follow the X-Series Spectrum Analyzer Mode User's & Programmer's Reference
  (N9060-90027, August 2014); the receiver chain is the split spectrum-analyzer blocks (D1 #187)
  with the X-Series limits declared on them (#616): 27 GHz tuning limit, RBW 1 Hz to 8 MHz in
  about 10% steps (span:RBW 106 when coupled), VBW to 8 MHz plus the 50 MHz wide-open setting,
  sweep time 1 ms to 4000 s, Normal (Rosenfell) detection with the automatic detector, and
  max/min hold. Only trace 1 and marker 1 exist; the measurement applications (ACP, CHP, OBW,
  TOI, SEM, ...), other modes, zero span, triggers other than free run and the tracking source
  are not modeled; the coverage table names every remaining gap. The front end
  follows the Data Sheet (3121-1037.EN, standard path, #960): noise figure, SHI, TOI and 1 dB
  compression for the band of the center frequency, and the CF = 1 GHz phase-noise table;
  the standard-path frequency response as a per-unit deviation by band (#960). The internal
  preamp of the reference (POW:GAIN, GAIN:BAND) is the data sheet's PA, option P26 (#1020): path
  1c's figures and response while it amplifies. The microwave paths of POW:MW:PATH — LNP (option
  LNP, path 2a), MPB (option MPB, 3a, and with the PA 3c) and full bypass (FULL, 4a) — follow the
  data sheet the same way (#1039): noise figure, intercepts, compression, frequency response and
  the bypass image (0 dB, the preselector out of circuit). The LNA (paths 1b, 1d, 2b, 3b, 3d, 4b)
  has no command in the reference and is not modeled.
reference:
  title: Keysight X-Series Signal Analyzer Spectrum Analyzer Mode User's & Programmer's Reference
  document: N9060-90027
  version: August 2014
  firmware: >-
    X-Series Spectrum Analyzer mode as covered by the reference (the N9042B multi-touch firmware
    keeps the same SA-mode SCPI command set; the manual's 26 GHz values, option 526, are used)
identity:
  # The reference's *IDN? example: Keysight Technologies, N9020A, US01020004, A.01.02 — manufacturer,
  # model, serial number, firmware version.
  idn: "Keysight Technologies,N9042B,{serial},{firmware}"
  serial: "MY00000001"
  firmware: "A.25.05"
  # *OPT?（参考手册第 222 页）：已装选件的逗号分隔列表，如 "503,P03,PFR"。频率选件 526 总在列，
  # 装了前放（P26）的整机接着列出它（D68，#1007）。手册写明回复带引号，本模型沿用不带引号的写法。
  options_reply: "526,{options}"
  options_none: "526"
builtins: ["*IDN", "*RST", "*CLS", "*OPC", "*WAI", "*ESR", "*ESE", "*SRE", "*STB", "*TST", ":SYSTem:ERRor[:NEXT]"]
error_queue: 20
# The reference writes numeric values as +1.92000000E+009 (its preset tables): eight decimals,
# three exponent digits, explicit sign. Markers and trace data answer in the same format.
format:
  number: nr3
  digits: 8
  sign: true
  exponent_digits: 3
  readings: format
  boolean: numeric
  enum: short
  error_code: signed
specs:
  frequency_option: "526: 2 Hz to 26.5 GHz; tuning limit 27.0 GHz (Center Frequency Presets table)"
  rbw: "1 Hz to 8 MHz (-3 dB Gaussian), about 10% steps; auto: span/106, at most 3 MHz"
  vbw: "1 Hz to 8 MHz in about 10% steps, plus 50 MHz (wide open)"
  sweep_time: "swept spans 1 ms to 4000 s"
  attenuation: "0 to 70 dB in 2 dB steps (mechanical attenuator)"
  sweep_points: "1 to 40001, preset 1001"
  # 前端指标（#960）：N9042B UXA X-Series Signal Analyzer, Multi-touch Data Sheet（3121-1037.EN，
  # July 1, 2024，manuals/3121-1037）。只用标准路径（1a：swept、preselector on、LNA off、PA off）。
  datasheet: "Keysight N9042B UXA X-Series Signal Analyzer, Multi-touch Data Sheet, 3121-1037.EN, July 1, 2024"
  frequency_response: >-
    p.10-11 1a. Standard path frequency response (10 dB input attenuation, relative to 50 MHz),
    full range: 9 kHz to 20 MHz ±0.54 dB; >20 to 50 MHz ±0.44 dB; >50 MHz to 3.6 GHz ±0.58 dB;
    >3.6 to 8.4 GHz ±2.70/2.50 dB (split at 5.2); >8.4 to 13.6 GHz ±2.00 dB; >13.6 to 17.1 GHz
    ±2.00 dB; >17.1 to 26.5 GHz ±2.32 dB (declared in deviations). 2a. LNP (p.11): 3.6 to 8.4 GHz
    ±3.10; >8.4 to 13.6 ±2.12; >13.6 to 17.1 ±2.00; >17.1 to 26.5 ±2.52. 3a. MPB: 3.6 to 8.4
    ±1.50; >8.4 to 13.6 ±1.66; >13.6 to 17.1 ±2.00; >17.1 to 26.5 ±2.52. 3c. MPB, PA on (nominal):
    ±0.30/±0.30/±0.40/±0.40. 4a. FBP (nominal): ±0.20/±0.25/±0.30/±0.30 (#1039)
  preamplifiers: >-
    p.18 LNA (options P44/P4L/P50/P5L) and PA, 40 dB together nominal; PA: 9 kHz up, gain 30 dB,
    noise figure 10 dB (nominal). Declared: the PA as option P26 (the reference's internal preamp)
    with path 1c — p.22 DANL 1c, p.26 SHI 1c, p.27 TOI 1c, p.19 compression 1c, p.10 frequency
    response 1c (#1020). The LNA (paths 1b, 1d, 2b, 3b, 3d, 4b) is not declared: no command in
    the reference, nor in the multi-touch one (9018-04666)
  gain_compression: >-
    p.19 1 dB gain compression, 1a. PA off (nominal, mixer power): 20 to 40 MHz +2 dBm; >40 MHz to
    3.6 GHz +5 dBm; >3.6 to 13.5 GHz +8 dBm; >13.5 to 26.5 GHz +3 dBm. p.20 2a. LNP: >3.6 to 13.5
    +2 dBm; >13.5 to 26.5 +0 dBm. 3a. MPB: 20 to 40 MHz +2; >40 MHz to 3.6 GHz +5; >3.6 to 13.5
    +2; >13.5 to 26.5 +0 dBm. 4a. FBP: >3.6 to 13.5 -4 dBm; >13.5 to 26.5 -5 dBm (#1039)
  danl: >-
    p.21 DANL 1a. Standard path (input terminated, sample or average detector, log averaging, IF
    gain high, 1 Hz RBW, 0 dB attenuation), typical: 2 to 10 Hz -90 dBm (nominal); >10 to 100 Hz
    -115 (nominal); >100 Hz to 1 kHz -128 (nominal); >1 to 9 kHz -138 (nominal); >9 to 100 kHz -146;
    >100 kHz to 1 MHz -155; >1 to 10 MHz -156; >10 MHz to 1.2 GHz -155; >1.2 to 2.1 GHz -154; >2.1
    to 3.6 GHz -152; >3.6 to 6.6 GHz -150; >6.6 to 8.4 GHz -151; >8.4 to 13.6 GHz -149; >13.6 to
    17.1 GHz -149; >17.1 to 22.5 GHz -146; >22.5 to 26.5 GHz -143 dBm. p.23 2a. LNP (typical):
    3.6 to 6 GHz -154; >6 to 8.4 -155; >8.4 to 17.1 -154; >17.1 to 23 -152; >23 to 26.5 -150.
    3a. MPB (nominal): 3.6 to 8.4 -156; >8.4 to 17.1 -154; >17.1 to 22 -151; >22.5 to 26.5 -149.
    p.23-24 4a. FBP (typical): 3.6 to 13.6 -158; >13.6 to 17.1 -157; >17.1 to 22 -156; >22 to
    26.5 -155 (#1039)
  mw_paths: >-
    Front-end paths 2a/3a/3c/4a (p.8) need options LNP / MPB / MPB / LNP+MPB; N9060-90027 p.573-578
    (POW:MW:PATH, POW:MW:PRES). LNP is switched in only above 3.6 GHz with no preamp in use
    (p.575; judged at the center frequency like every front-end figure), else the standard path
    answers; with the PA on band FULL the LNP is not used, so FULL falls back to the MPB+PA path
    3c. MPB bypasses the preselector above 3.6 GHz: the image then appears at the same level as
    the signal (p.577, 0 dB rejection), with the preselector in circuit it is completely rejected
  residuals_images: >-
    p.25 Residual responses (input terminated, 0 dB attenuation) 200 kHz to 8.4 GHz -100 dBm, no
    frequencies given (not declared). Image responses (mixer level -10 dBm) at f+45 MHz, f+645 MHz
    and f+10,245 MHz, -80 dBc (-70 dBc at f+645 MHz above 22 GHz): above the tuned frequency — not
    declared; the model's own image (2·IF below the tuned point, completely rejected with the
    preselector in circuit) appears at full level on the MPB and FULL paths (p.577)
  shi: >-
    p.26 SHI 1a. Standard path (mixer level -15 dBm): 10 MHz to 1.8 GHz +46 dBm; >1.8 to 3 GHz
    +52 dBm; >3 to 5.2 GHz +55 dBm; >5.2 to 13.25 GHz +64 dBm; >13.25 to 25.0 GHz +53 dBm.
    2a. LNP: 1.75 to 2.5 GHz +77 dBm; >2.5 to 5 GHz +82; 5 to 13.25 GHz +87; >13.25 to 25 GHz +77.
    The MPB and FBP paths have no SHI (not declared)
  toi: >-
    p.27 TOI 1a. Standard path (two -16 dBm tones at the mixer), typical: 10 to 350 MHz +18 dBm;
    >350 MHz to 1.1 GHz +19; >1.1 to 3.0 GHz +21; >3.0 to 3.6 GHz +22; >3.6 to 13.6 GHz +19; >13.6
    to 21 GHz +16; >21 to 26.5 GHz +18 dBm. p.28 2a. LNP (nominal): 3.6 to 13.6 GHz +15 dBm;
    >13.6 to 23 GHz +11; >23 GHz +14. The MPB and FBP paths have no TOI (not declared)
  phase_noise: >-
    p.29 Phase noise (SSB), CF = 1 GHz, typical: 10 Hz -93 dBc/Hz (wide reference loop); 100 Hz
    -112; 1 kHz -127; 10 kHz -135; 100 kHz -141; 1 MHz -146; 10 MHz -157 dBc/Hz
state:
  freq.center:
    type: float
    unit: HZ
    min: 0.0
    max: 27.0e9
    default: 13.255e9
    label: 中心频率
    label_en: Center
  freq.span:
    type: float
    unit: HZ
    min: 10.0
    max: 27.0e9
    default: 26.49e9
    label: 跨度
    label_en: Span
  freq.step:
    type: float
    unit: HZ
    min: 1.0
    max: 27.0e9
    default: 2.649e9
    label: 中心频率步进
    label_en: CF step
  freq.step_auto:
    type: bool
    default: true
    label: 中心频率步进自动
    label_en: CF step auto
  bw.res:
    type: float
    unit: HZ
    min: 1.0
    max: 8.0e6
    default: 3.0e6
    label: 分辨率带宽（手动）
    label_en: RBW (manual)
  bw.res_auto:
    type: bool
    default: true
    label: RBW 自动
    label_en: RBW auto
  bw.vid:
    type: float
    unit: HZ
    min: 1.0
    max: 50.0e6
    default: 3.0e6
    label: 视频带宽（手动）
    label_en: VBW (manual)
  bw.vid_auto:
    type: bool
    default: true
    label: VBW 自动
    label_en: VBW auto
  sweep.time:
    type: float
    unit: S
    min: 1.0e-3
    max: 4000.0
    default: 0.1
    label: 扫描时间（手动）
    label_en: Sweep time (manual)
  sweep.time_auto:
    type: bool
    default: true
    label: 扫描时间自动
    label_en: Sweep time auto
  sweep.points:
    type: int
    min: 1
    max: 40001
    default: 1001
    label: 迹线点数
    label_en: Points
  power.att:
    type: float
    unit: DB
    min: 0.0
    max: 70.0
    default: 10.0
    label: 衰减（手动）
    label_en: Attenuation (manual)
  power.att_auto:
    type: bool
    default: true
    label: 衰减自动
    label_en: Attenuation auto
  # 内部前置放大器（Internal Preamp，参考手册第 578–580 页；选件 P26，#1020）：开关的预置为 OFF，
  # 频段的预置为 LOW（只在低频段 0–3.6 GHz 放大）。
  power.gain:
    type: bool
    default: false
    label: 前置放大器
    label_en: Internal preamp
  power.gain_band:
    type: enum
    options: [LOW, FULL]
    default: LOW
    label: 前置放大器频段
    label_en: Preamp band
  # µW 通路（参考手册第 573–578 页，#1039）。STD 预置；LNP（选件 LNP）只在 3.6 GHz 以上且前放不在用
  # 时接入，否则按手册（第 575 页）回落为标准通路；MPB（选件 MPB）在 3.6 GHz 以上旁路预选器；
  # FULL（数据手册 4a：LNP 与 MPB 两个旁路，需要两个选件）在 3.6 GHz 以上同时旁路。通路是否接入
  # 按中心频率判断（与前端指标同一约定，覆盖表注明）。
  power.mw_path:
    type: enum
    options: [STD, LNPath, MPBypass, FULL]
    default: STD
    label: µW 通路
    label_en: µW path
  # µW 预选器开关（参考手册第 577–578 页）：ON 置 STD 通路、OFF 置 MPB 通路（手册 Notes），与
  # power.mw_path 用约束互锁（D69）。查询按预选器是否在链上回 1/0（STD/LNP 在链上）。
  power.mw_preselector:
    type: bool
    default: true
    label: µW 预选器
    label_en: µW preselector
  display.ref_level:
    type: float
    unit: DBM
    min: -170.0
    max: 30.0
    default: 0.0
    label: 参考电平
    label_en: Reference level
  detector:
    type: enum
    options: [NORMal, POSitive, SAMPle, NEGative]
    default: NORMal
    not_modeled:
      AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
      QPEak: the CISPR detectors are not modeled
      EAVerage: the CISPR detectors are not modeled
      RAVerage: the CISPR detectors are not modeled
      EPOSitive: the EMI standards are not modeled
      MPOSitive: the EMI standards are not modeled
      RMS: the average detector with RMS averaging is not modeled
    label: 检波器（手动）
    label_en: Detector (manual)
    option_labels: {NORMal: 常态, POSitive: 正峰值, SAMPle: 采样, NEGative: 负峰值}
  detector_auto:
    type: bool
    default: true
    label: 检波器自动
    label_en: Detector auto
  trace.type:
    type: enum
    options: [WRITe, AVERage, MAXHold, MINHold]
    default: WRITe
    label: 迹线类型
    label_en: Trace type
    option_labels: {WRITe: 刷新, AVERage: 平均, MAXHold: 最大保持, MINHold: 最小保持}
  aver.count:
    type: int
    min: 1
    max: 10000
    default: 100
    label: 平均/保持次数
    label_en: Average/hold count
  aver.type:
    type: enum
    options: [LOG]
    default: LOG
    not_modeled:
      RMS: power (RMS) averaging is not modeled
      SCALar: voltage averaging is not modeled
      LINear: voltage averaging is not modeled
      VOLTage: voltage averaging is not modeled
    label: 平均类型
    label_en: Average type
  aver.type_auto:
    type: bool
    default: true
    label: 平均类型自动
    label_en: Average type auto
  marker.x:
    type: float
    unit: HZ
    min: 0.0
    max: 27.0e9
    default: 13.255e9
    label: 标记频率
    label_en: Marker
  marker.mode:
    type: enum
    options: [POSition, DELTa, "OFF"]
    default: "OFF"
    not_modeled:
      FIXed: fixed markers are not modeled
    label: 标记模式
    label_en: Marker mode
  marker.ref_x:
    type: float
    unit: HZ
    default: 0.0
    label: 参考标记频率
    label_en: Reference marker
  marker.ref_y:
    type: float
    unit: DBM
    default: 0.0
    label: 参考标记电平
    label_en: Reference marker level
  marker.count:
    type: bool
    default: false
    label: 标记计数器
    label_en: Marker counter
  marker.search:
    type: enum
    options: [MAXimum, PARameter]
    default: MAXimum
    label: 峰值搜索方式
    label_en: Peak search mode
  marker.threshold:
    type: float
    unit: DBM
    min: -370.0
    max: 30.0
    default: -90.0
    label: 峰值门限
    label_en: Peak threshold
  marker.excursion:
    type: float
    unit: DB
    min: 0.0
    max: 100.0
    default: 6.0
    label: 峰值偏移
    label_en: Peak excursion
  init.continuous:
    type: bool
    default: true
    rst: false
    label: 连续扫描
    label_en: Continuous
  trigger.source:
    type: enum
    options: [IMMediate]
    default: IMMediate
    not_modeled:
      EXTernal: external triggers are not modeled
      EXTernal1: external triggers are not modeled
      EXTernal2: external triggers are not modeled
      LINE: the line trigger is not modeled
      FRAMe: the frame trigger is not modeled
      RFBurst: the RF burst trigger is not modeled
      VIDeo: the video trigger is not modeled
      IF: the IF trigger is not modeled
      ALARm: the alarm trigger is not modeled
      LAN: the LAN trigger is not modeled
      IQMag: the I/Q triggers are not modeled
      IDEMod: the I/Q triggers are not modeled
      QDEMod: the I/Q triggers are not modeled
      IINPut: the I/Q triggers are not modeled
      QINPut: the I/Q triggers are not modeled
      AIQMag: the I/Q triggers are not modeled
      TV: the TV trigger is not modeled
    label: 触发源
    label_en: Trigger source
  format.data:
    type: enum
    options: [ASCii]
    default: ASCii
    not_modeled:
      INTeger: binary trace transfer is not modeled
      REAL: binary trace transfer is not modeled
    label: 数据格式
    label_en: Data format
  format.border:
    type: enum
    options: [NORMal, SWAPped]
    default: NORMal
    label: 字节序
    label_en: Byte order
  unit.power:
    type: enum
    options: [DBM]
    default: DBM
    not_modeled:
      DBMV: amplitude units other than dBm are not modeled
      DBMA: amplitude units other than dBm are not modeled
      V: amplitude units other than dBm are not modeled
      W: amplitude units other than dBm are not modeled
      A: amplitude units other than dBm are not modeled
      DBUV: amplitude units other than dBm are not modeled
      DBUA: amplitude units other than dBm are not modeled
      DBPW: amplitude units other than dBm are not modeled
      DBUVM: amplitude units other than dBm are not modeled
      DBUAM: amplitude units other than dBm are not modeled
      DBPT: amplitude units other than dBm are not modeled
      DBG: amplitude units other than dBm are not modeled
    label: 电平单位
    label_en: Amplitude unit
  # ---- display settings (accepted: they change the screen only) ----
  display.enable:
    type: bool
    default: true
    label: 显示
    label_en: Display
  display.pdiv:
    type: float
    unit: DB
    min: 0.1
    max: 20.0
    default: 10.0
    label: 每格电平
    label_en: Scale/div
  display.dline:
    type: float
    unit: DBM
    min: -370.0
    max: 30.0
    default: -25.0
    label: 显示线
    label_en: Display line
  display.dline_on:
    type: bool
    default: false
    label: 显示线开关
    label_en: Display line on
  display.annotation:
    type: bool
    default: true
    label: 屏幕注释
    label_en: Screen annotation
components:
  - name: rf_in
    type: input_port
    params: {z_in: 50.0}
  - name: ref_in
    type: input_port
    params: {z_in: 50.0}
  - name: clock
    type: reference_clock
    params: {source: INTernal, nominal_hz: 10e6}
  - name: input
    type: specan_input
    params:
      z_in: 50.0
      # Auto attenuation: the reference's preset is 0 dBm with 10 dB, i.e. a -10 dBm mixer level.
      max_mixer_level: -10.0
      att: $power.att
      att_auto: $power.att_auto
      ref_level: $display.ref_level
      # 自动衰减按参考手册第 550 页（(Mech) Atten 的 Couplings）计入前放增益：Atten = RefLevel + PreAmpGain − MaxMixerLevel。
      preamp_in_mixer_level: true
  - name: mixer
    type: specan_mixer
    params:
      lo: lo
      # 整机噪声系数，按中心频率所在频段（数据手册第 21 页 DANL 1a 的 typical 列）。DANL 的条件是
      # 0 dB 衰减、RBW 1 Hz、对数平均（比功率低 2.51 dB），本模型的噪声底 = −174 dBm/Hz + NF +
      # 10·lg(1.0645 × 1 Hz) − 2.51，故 NF = DANL + 176.24 dB。100 Hz–9 kHz 各段取 nominal 值；
      # 频段的写法“> a 到 b”取下沿 a 为表项（2.3 的 table：取不大于中心频率的最大表项）。
      # µW 通路（#1039）按 $power.mw_path 嵌套取值（D70）：LNP 2a（第 23 页 DANL 2a 的 typical 列）、
      # MPB 3a（nominal 列）、FULL 4a（typical 列）；各表在 3.6 GHz 以下沿用 1a（通路不接入）。
      noise_figure: &nf_by_path
        from: $power.mw_path
        map:
          STD: &nf_1a
            from: $freq.center
            table: {0: 86.24, 10.0: 61.24, 100.0: 48.24, 1.0e3: 38.24, 9.0e3: 30.24, 100.0e3: 21.24, 1.0e6: 20.24, 10.0e6: 21.24, 1.2e9: 22.24, 2.1e9: 24.24, 3.6e9: 26.24, 6.6e9: 25.24, 8.4e9: 27.24, 17.1e9: 30.24, 22.5e9: 33.24, 26.5e9: 36.24}
          LNPath: &nf_2a
            from: $freq.center
            table: {0: 86.24, 10.0: 61.24, 100.0: 48.24, 1.0e3: 38.24, 9.0e3: 30.24, 100.0e3: 21.24, 1.0e6: 20.24, 10.0e6: 21.24, 1.2e9: 22.24, 2.1e9: 24.24, 3.6e9: 22.24, 6.0e9: 21.24, 8.4e9: 22.24, 17.1e9: 24.24, 23.0e9: 26.24}
          MPBypass: &nf_3a
            from: $freq.center
            table: {0: 86.24, 10.0: 61.24, 100.0: 48.24, 1.0e3: 38.24, 9.0e3: 30.24, 100.0e3: 21.24, 1.0e6: 20.24, 10.0e6: 21.24, 1.2e9: 22.24, 2.1e9: 24.24, 3.6e9: 20.24, 8.4e9: 22.24, 17.1e9: 25.24, 22.0e9: 25.24, 22.5e9: 27.24}
          FULL: &nf_4a
            from: $freq.center
            table: {0: 86.24, 10.0: 61.24, 100.0: 48.24, 1.0e3: 38.24, 9.0e3: 30.24, 100.0e3: 21.24, 1.0e6: 20.24, 10.0e6: 21.24, 1.2e9: 22.24, 2.1e9: 24.24, 3.6e9: 18.24, 13.6e9: 19.24, 17.1e9: 20.24, 22.0e9: 21.24}
      # 二次谐波截点（第 26 页 SHI 1a，混频器电平 −15 dBm）：本模型的二次谐波 = 2P − IIP2 − 6.02 dB，
      # SHI = IIP2 + 6.02，故 IIP2 = SHI − 6.02。10 MHz 以下、25 GHz 以上手册没有给，不声明（理想）。
      # 2a 的 SHI（第 26 页，−15 dBm）：1.75–2.5 GHz +77；2.5–5 +82；5–13.25 +87；13.25–25 +77；
      # MPB/FULL 没有给，3.6 GHz 以上不声明（理想），以下沿用 1a。
      iip2_dbm: &ip2_by_path
        from: $power.mw_path
        map:
          STD: &ip2_1a
            from: $freq.center
            table: {0: null, 10.0e6: 39.98, 1.8e9: 45.98, 3.0e9: 48.98, 5.2e9: 57.98, 13.25e9: 46.98, 25.0e9: null}
          LNPath: &ip2_2a
            from: $freq.center
            table: {0: null, 10.0e6: 39.98, 1.8e9: 45.98, 3.0e9: 48.98, 3.6e9: 75.98, 5.0e9: 80.98, 13.25e9: 70.98}
          MPBypass: &ip2_3a
            from: $freq.center
            table: {0: null, 10.0e6: 39.98, 1.8e9: 45.98, 3.0e9: 48.98, 3.6e9: null}
          FULL: *ip2_3a
      # 三阶截点（第 27 页 TOI 1a，两个 −16 dBm 的音在混频器处，typical 列）；10 MHz 以下不声明。
      # 2a 的 TOI（第 28 页，nominal）：3.6–13.6 GHz +15；13.6–23 +11；23 以上 +14；MPB/FULL 没有给。
      iip3_dbm: &ip3_by_path
        from: $power.mw_path
        map:
          STD: &ip3_1a
            from: $freq.center
            table: {0: null, 10.0e6: 18.0, 350.0e6: 19.0, 1.1e9: 21.0, 3.0e9: 22.0, 3.6e9: 19.0, 13.6e9: 16.0, 21.0e9: 18.0, 26.5e9: 19.0}
          LNPath: &ip3_2a
            from: $freq.center
            table: {0: null, 10.0e6: 18.0, 350.0e6: 19.0, 1.1e9: 21.0, 3.0e9: 22.0, 3.6e9: 15.0, 13.6e9: 11.0, 23.0e9: 14.0}
          MPBypass: &ip3_3a
            from: $freq.center
            table: {0: null, 10.0e6: 18.0, 350.0e6: 19.0, 1.1e9: 21.0, 3.0e9: 22.0, 3.6e9: null}
          FULL: *ip3_3a
      # 1 dB 压缩点（第 19–20 页，混频器功率，nominal）；20 MHz 以下不声明。2a 与 3a 的表相同
      #（>3.6–13.5 +2；>13.5–26.5 +0）；4a：>3.6–13.5 −4；>13.5–26.5 −5。
      p1db_dbm: &p1_by_path
        from: $power.mw_path
        map:
          STD: &p1_1a
            from: $freq.center
            table: {0: null, 20.0e6: 2.0, 40.0e6: 5.0, 3.6e9: 8.0, 13.5e9: 3.0, 26.5e9: 6.0}
          LNPath: &p1_2a
            from: $freq.center
            table: {0: null, 20.0e6: 2.0, 40.0e6: 5.0, 3.6e9: 2.0, 13.5e9: 0.0}
          MPBypass: *p1_2a
          FULL:
            from: $freq.center
            table: {0: null, 20.0e6: 2.0, 40.0e6: 5.0, 3.6e9: -4.0, 13.5e9: -5.0}
      # 镜像抑制（#1039）：预选器在链上（STD、LNP）完全抑制（null）；旁路后（MPB、FULL，3.6 GHz
      # 以上）镜像与信号同幅度（第 577 页：“the image response and the real signal typically have
      # the same amplitude”），抑制 0 dB。3.6 GHz 以下低段没有预选器，低通滤波器抑制（完全）。
      image_rejection:
        from: $power.mw_path
        map:
          STD: null
          LNPath: null
          MPBypass: &img_bypass
            from: $freq.center
            table: {0: null, 3.6e9: 0.0}
          FULL: *img_bypass
  - name: lo
    type: specan_lo
    params:
      clock: clock
      source: INTernal
      if_filter: if_filter
      center: $freq.center
      # 单边带相位噪声（第 29 页，CF = 1 GHz，typical 列；10 Hz 取宽参考环路）；表外按端点延伸。
      phase_noise: [[10.0, -93.0], [100.0, -112.0], [1.0e3, -127.0], [1.0e4, -135.0], [1.0e5, -141.0], [1.0e6, -146.0], [1.0e7, -157.0]]
  - name: if_filter
    type: specan_if
    params:
      rbw: $bw.res
      rbw_auto: $bw.res_auto
      span: $freq.span
      steps: "10%"
      rbw_min: 1.0
      rbw_max: 8.0e6
      auto_ratio: 106.0
      auto_max: 3.0e6
  - name: detector
    type: specan_detector
    params: {detector: $detector, auto: $detector_auto, trace_mode: $trace.type}
  - name: vbw
    type: specan_vbw
    params: {vid: $bw.vid, vid_auto: $bw.vid_auto, if_filter: if_filter, steps: "10%", vbw_min: 1.0, vbw_max: 50.0e6}
  - name: sa
    type: specan_trace
    params:
      input: input
      lo: lo
      if_filter: if_filter
      detector: detector
      vbw: vbw
      max_hold_sweeps: 10000
      hold_count: true
      center_fit: span
      f_max: 27.0e9
      span_min: 10.0
      sweep_min: 1.0e-3
      sweep_max: 4000.0
      marker_off_reply: nan
      delta_x: offset
  - name: sys
    type: system
wiring:
  instrument:
    - [rf_in.out, input.in]
    - [input.out, mixer.in]
    - [mixer.out, if_filter.in]
    - [ref_in.out, clock.ref]
ports:
  instrument:
    RF_IN: rf_in.pin
    REF_IN: ref_in.pin
  media: {REF_IN: reference}
display:
  template: spectrum_analyzer
  summary: [freq.center, freq.span, display.ref_level, detector, trace.type]
capabilities: [spectrum_analyzer]
# 频响平坦度的个体偏差（数据手册第 10 页 1a. Standard path frequency response，10 dB 衰减，相对
# 50 MHz，全温度范围）：各频段的 ± 限值，标称曲线为 0（定义不写 flatness），50 MHz 处为 0。
# 手册的频段写作“> a 到 b”，相邻两段共用端点（按较紧的限值抽一次）。
deviations:
  - param: input.flatness
    bands:
      - [9.0e3, 20.0e6]
      - [20.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 5.2e9]
      - [5.2e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.54, 0.44, 0.58, 2.70, 2.50, 2.00, 2.00, 2.32]
    reference: 50.0e6
  # µW 通路的频响（#1039，全温度范围，10 dB 衰减、相对 50 MHz）。各条按 D70 抽一条个体曲线，运行时
  # 取第一条 when 成立的。3.6 GHz 以下通路不接入（LNP、FULL）或不改变低段（MPB），限值沿用 1a（或
  # 前放起作用时的 1c）；MPB 与 FULL 的差异只在 3.6 GHz 以上。各表频段与手册行不同宽时，按手册行
  # 覆盖的区间取该行限值。
  # 3c. MPB, PA on（第 11 页 3b/3c/3d 表的 3c 列，nominal）：前放 FULL 起作用（PA 在链上，其后的
  # 预选器旁路）。
  - param: input.flatness
    option: MPB
    when: {power.mw_path: MPBypass, power.gain: ON, power.gain_band: FULL}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 0.30, 0.30, 0.40, 0.40]
    reference: 50.0e6
  # FULL 通路 + 前放 FULL：手册第 575 页，前放开着时 LNP 不接入，回落为 MPB+PA（3c）。
  - param: input.flatness
    option: MPB
    when: {power.mw_path: FULL, power.gain: ON, power.gain_band: FULL}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 0.30, 0.30, 0.40, 0.40]
    reference: 50.0e6
  # LNP + 前放 LOW（第 11 页 2a）：3.6 GHz 以下前放放大（1c 限值），以上 LNP 接入（2a）。
  - param: input.flatness
    option: LNP
    when: {power.mw_path: LNPath, power.gain: ON, power.gain_band: LOW}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 3.10, 2.12, 2.00, 2.52]
    reference: 50.0e6
  # MPB + 前放 LOW（第 11 页 3a）：3.6 GHz 以上 MPB 接入，前放 LOW 不放大。
  - param: input.flatness
    option: MPB
    when: {power.mw_path: MPBypass, power.gain: ON, power.gain_band: LOW}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 1.50, 1.66, 2.00, 2.52]
    reference: 50.0e6
  # FULL + 前放 LOW（第 11 页 4a，nominal）：FULL 需要 LNP 与 MPB 两个选件，偏差单选件字段按 MPB
  # 门控（#1113，覆盖表注明）。
  - param: input.flatness
    option: MPB
    when: {power.mw_path: FULL, power.gain: ON, power.gain_band: LOW}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 0.20, 0.25, 0.30, 0.30]
    reference: 50.0e6
  # 前放关：各通路自己的限值，3.6 GHz 以下 1a。
  - param: input.flatness
    option: LNP
    when: {power.mw_path: LNPath, power.gain: OFF}
    bands:
      - [9.0e3, 20.0e6]
      - [20.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.54, 0.44, 0.58, 3.10, 2.12, 2.00, 2.52]
    reference: 50.0e6
  - param: input.flatness
    option: MPB
    when: {power.mw_path: MPBypass, power.gain: OFF}
    bands:
      - [9.0e3, 20.0e6]
      - [20.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.54, 0.44, 0.58, 1.50, 1.66, 2.00, 2.52]
    reference: 50.0e6
  - param: input.flatness
    option: MPB
    when: {power.mw_path: FULL, power.gain: OFF}
    bands:
      - [9.0e3, 20.0e6]
      - [20.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.54, 0.44, 0.58, 0.20, 0.25, 0.30, 0.30]
    reference: 50.0e6
  # 前放（PA）开着时的频响（第 10 页 1c. Standard path, PA on，全温度范围；1 MHz 以下手册只给了
  # typical，不声明），每台另抽一条（D70，只有装了 P26 的整机抽）。频段 FULL：1c 覆盖全频段。
  - param: input.flatness
    option: P26
    when: {power.gain: ON, power.gain_band: FULL}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 5.2e9]
      - [5.2e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 2.80, 2.60, 2.30, 2.30, 2.86]
    reference: 50.0e6
  # 频段 LOW：PA 只在 3.6 GHz 以下放大，以上走标准通路，限值用 1a 的。这一条是独立抽取的，所以
  # 3.6 GHz 以上与 PA 关时的曲线不同（同样的限值，另一条个体曲线；简化，覆盖表注明）。
  - param: input.flatness
    option: P26
    when: {power.gain: ON, power.gain_band: LOW}
    bands:
      - [1.0e6, 50.0e6]
      - [50.0e6, 3.6e9]
      - [3.6e9, 5.2e9]
      - [5.2e9, 8.4e9]
      - [8.4e9, 13.6e9]
      - [13.6e9, 17.1e9]
      - [17.1e9, 26.5e9]
    limit: [0.80, 0.68, 2.70, 2.50, 2.00, 2.00, 2.32]
    reference: 50.0e6
options:
  # 前置放大器（数据手册第 18 页：LNA 与 PA 两级，选件 P26/P44/P4L/P50/P5L；本型号的频率选件 526
  # 配 P26）。参考手册（N9060-90027）的 Internal Preamp 只有开关与频段两条命令，对应数据手册的
  # PA（1c 通路：“Allows tuning down to 100 kHz”）；LNA 在参考手册里没有命令，不建模（1b、1d）。
  # 数据手册按通路给出整条通路的指标（DANL、SHI、TOI、1 dB 压缩、频响），所以 PA 起作用时，这些
  # 指标全部写在输入块的前放上，混频器在这条通路上不再计入（null，D70）；PA 不起作用时（关，或
  # 频段 LOW 而中心频率在 3.6 GHz 及以上），前放不在链上，混频器用所在 µW 通路的表（#1039）。
  # 各参数按“开关 → 频段 → 中心频率（LOW 时）→ µW 通路”嵌套取值（D70），在中心频率处求值。
  # MPB 通路上的 PA（3c）手册没有整条通路的指标：前放按 1c（同一硬件，级联时它主导），覆盖表注明。
  - id: P26
    label: 前置放大器 LNA 与 PA，至 26.5 GHz（Preamplifiers, LNA and PA）
    params:
      input:
        # 增益 30 dB（第 18 页 PA，nominal）。与 µW 通路无关：FULL 通路上前放 FULL 开着时 LNP 不接入
        #（第 575 页），前放仍在链上（等效 3c）。
        preamp_gain:
          from: $power.gain
          map:
            "False": 0.0
            "True": {from: $power.gain_band, map: {FULL: 30.0, LOW: {from: $freq.center, table: {0: 30.0, 3.6e9: 0.0}}}}
        # 噪声系数（第 22 页 DANL 1c，typical 列）：NF = DANL + 176.24 dB（换算同混频器的 1a 表）；
        # 100 kHz 以下手册没有给，沿用 > 100–200 kHz 的值（假设）。
        preamp_noise_figure:
          from: $power.gain
          map:
            "False": null
            "True": {from: $power.gain_band, map: {FULL: &nf_1c {from: $freq.center, table: {0: 16.24, 200.0e3: 14.24, 500.0e3: 11.24, 1.0e6: 10.24, 2.1e9: 12.24, 3.6e9: 10.24, 17.1e9: 11.24, 20.0e9: 13.24, 26.5e9: 14.24}}, LOW: {from: $freq.center, table: {0: *nf_1c, 3.6e9: null}}}}
        # 二次谐波截点（第 26 页 SHI 1c，前放电平 −45 dBm，nominal）：IIP2 = SHI − 6.02；10 MHz 以下、
        # 13.25 GHz 以上手册没有给，不声明（理想）。
        iip2_dbm:
          from: $power.gain
          map:
            "False": null
            "True": {from: $power.gain_band, map: {FULL: &ip2_1c {from: $freq.center, table: {0: null, 10.0e6: 21.98, 1.8e9: -1.02, 13.25e9: null}}, LOW: {from: $freq.center, table: {0: *ip2_1c, 3.6e9: null}}}}
        # 三阶截点（第 27 页 TOI 1c，两个 −34 dBm 的音在前放输入，nominal）；10 MHz 以下不声明。
        iip3_dbm:
          from: $power.gain
          map:
            "False": null
            "True": {from: $power.gain_band, map: {FULL: &ip3_1c {from: $freq.center, table: {0: null, 10.0e6: 0.0, 500.0e6: 2.0, 1.6e9: 3.0, 3.6e9: -12.0, 13.6e9: -14.0, 21.0e9: -8.0, 26.5e9: -10.0}}, LOW: {from: $freq.center, table: {0: *ip3_1c, 3.6e9: null}}}}
        # 1 dB 压缩点（第 19 页 1c. PA，混频器功率，nominal）；20 MHz 以下不声明。
        p1db_dbm:
          from: $power.gain
          map:
            "False": null
            "True": {from: $power.gain_band, map: {FULL: &p1_1c {from: $freq.center, table: {0: null, 20.0e6: -14.0, 3.6e9: -22.0, 13.5e9: -24.0, 26.5e9: -23.0}}, LOW: {from: $freq.center, table: {0: *p1_1c, 3.6e9: null}}}}
      mixer:
        # PA 起作用时整条通路的指标在前放上，混频器不再计入；否则按 µW 通路取表（#1039）。
        noise_figure:
          from: $power.gain
          map: {"False": *nf_by_path, "True": {from: $power.gain_band, map: {FULL: null, LOW: {from: $freq.center, table: {0: null, 3.6e9: *nf_by_path}}}}}
        iip2_dbm:
          from: $power.gain
          map: {"False": *ip2_by_path, "True": {from: $power.gain_band, map: {FULL: null, LOW: {from: $freq.center, table: {0: null, 3.6e9: *ip2_by_path}}}}}
        iip3_dbm:
          from: $power.gain
          map: {"False": *ip3_by_path, "True": {from: $power.gain_band, map: {FULL: null, LOW: {from: $freq.center, table: {0: null, 3.6e9: *ip3_by_path}}}}}
        p1db_dbm:
          from: $power.gain
          map: {"False": *p1_by_path, "True": {from: $power.gain_band, map: {FULL: null, LOW: {from: $freq.center, table: {0: null, 3.6e9: *p1_by_path}}}}}
  # µW 通路选件（参考手册第 575、577 页：未装选件发对应命令报 -241；数据手册第 8 页的通路表）。
  # 选件只带来命令的可用性与按通路的个体偏差；通路的参数表在整机定义里（未装选件的整机选不了
  # 那条通路，表不生效）。LNP（2a）：低噪声通路，旁路低/高频段开关与微波前放，预选器仍在链上。
  - id: LNP
    label: 低噪声通路（Low Noise Path）
    params: {}
  # MPB（3a、3c）：µW 预选器旁路；FULL（4a）需要 LNP 与 MPB 两个选件，命令与偏差的单选件字段
  # 表达不了“与”，按 MPB 门控（假设，#1113，覆盖表注明）。
  - id: MPB
    label: µW 预选器旁路（µW Preselector Bypass）
    params: {}
constraints:
  # µW 通路带动预选器开关（单向，D69 coerce）：MPB 与 FULL 旁路预选器（参考手册第 577 页），STD 与
  # LNP（数据手册第 8 页：“Preselector, LNP”）在链上。反方向不用约束：MW:PRES 的条目用 writes 把
  # 通路一起写对（ON 置 STD、OFF 置 MPB，手册第 577 页）。
  - when: {power.mw_path: [MPBypass, FULL]}
    forbid: {power.mw_preselector: [true]}
    action: coerce
    coerce: {power.mw_preselector: false}
    source: "N9060-90027 p.577: the preselector is out of circuit on the MPB path"
  - when: {power.mw_path: [STD, LNPath]}
    forbid: {power.mw_preselector: [false]}
    action: coerce
    coerce: {power.mw_preselector: true}
    source: "N9060-90027 p.573-575: the preselector is in circuit on the standard and LNP paths"
commands:
  # ---- common commands beyond the built-ins ----------------------------------------------------
  # *OPT? is the built-in one (identity.options_reply): the frequency option and the installed ones.
  # ---- frequency -------------------------------------------------------------------------------
  - header: "[:SENSe]:FREQuency:CENTer"
    op: sa.frequency
    args: {what: center}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:SPAN"
    op: sa.frequency
    args: {what: span}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STARt"
    op: sa.frequency
    args: {what: start}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:STOP"
    op: sa.frequency
    args: {what: stop}
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:FREQuency:CENTer:STEP[:INCRement]"
    state: freq.step
  - header: "[:SENSe]:FREQuency:CENTer:STEP:AUTO"
    state: freq.step_auto
  # ---- resolution and video bandwidth ----------------------------------------------------------
  # The reference writes BANDwidth|BWIDth; each spelling is its own header pattern.
  - header: "[:SENSe]:BANDwidth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BWIDth[:RESolution]:AUTO"
    state: bw.res_auto
  - header: "[:SENSe]:BANDwidth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth[:RESolution]"
    op: if_filter.coupled_rbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BANDwidth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BWIDth:VIDeo:AUTO"
    state: bw.vid_auto
  - header: "[:SENSe]:BANDwidth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  - header: "[:SENSe]:BWIDth:VIDeo"
    op: vbw.coupled_vbw
    params: [{name: value, type: float, unit: HZ, optional: true}]
  # ---- sweep -----------------------------------------------------------------------------------
  - header: "[:SENSe]:SWEep:TIME:AUTO"
    state: sweep.time_auto
  - header: "[:SENSe]:SWEep:TIME"
    op: sa.coupled_sweep
    params: [{name: value, type: float, unit: S, optional: true}]
  - header: "[:SENSe]:SWEep:POINts"
    state: sweep.points
  # ---- amplitude -------------------------------------------------------------------------------
  - header: "[:SENSe]:POWer[:RF]:ATTenuation:AUTO"
    state: power.att_auto
  - header: "[:SENSe]:POWer[:RF]:ATTenuation"
    op: input.coupled_att
    params: [{name: value, type: float, unit: DB, optional: true}]
  # 内部前放（参考手册第 578–580 页，选件 P26）。没装前放的整机：手册只说按键不显示；同一手册对
  # 未装的 LNP、MPB 选件写明 SCPI 报 -241 "Hardware missing; Option not installed"，这里照此处理
  # （设置与查询都报 -241，假设，覆盖表注明）。
  - header: "[:SENSe]:POWer[:RF]:GAIN[:STATe]"
    state: power.gain
    option: P26
  - header: "[:SENSe]:POWer[:RF]:GAIN:BAND"
    state: power.gain_band
    option: P26
  # µW 通路（参考手册第 573–578 页，#1039）。STD 任何整机可设（第一条）；LNP 需要选件 LNP、MPB 与
  # FULL 需要选件 MPB（第 575、577 页写明未装报 -241），按值 when + option 分流，LNP/MPBypass 各有
  # 长短两种写法；查询任何整机可用（最后一条，只查询）。没装选件的整机发对应值当前报 -224 而不是
  # 手册的 -241（按值选件门控待 #1113），覆盖表注明。
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    when: {value: STD}
    params: [{name: value, type: enum, options: [STD], optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    option: LNP
    when: {value: LNP}
    params: [{name: value, type: enum, options: [STD, LNPath, MPBypass, FULL], optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    option: LNP
    when: {value: LNPath}
    params: [{name: value, type: enum, options: [STD, LNPath, MPBypass, FULL], optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    option: MPB
    when: {value: MPB}
    params: [{name: value, type: enum, options: [STD, LNPath, MPBypass, FULL], optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    option: MPB
    when: {value: MPBypass}
    params: [{name: value, type: enum, options: [STD, LNPath, MPBypass, FULL], optional: true}]
  # FULL 需要同时装 LNP 与 MPB（数据手册 4a 通路两个旁路开关）；单选件字段按 MPB 门控（假设，
  # #1113）。FULL 的长短写法相同。
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    option: MPB
    when: {value: FULL}
    params: [{name: value, type: enum, options: [STD, LNPath, MPBypass, FULL], optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PATH"
    state: power.mw_path
    set: false
  # µW 预选器开关（参考手册第 577–578 页）：ON/OFF 写 power.mw_preselector，并用 writes 把通路一起
  # 写对（ON 置 STD、OFF 置 MPB，手册 Notes；反方向由上面的约束带动）。OFF 需要选件 MPB（未装报
  # -241；当前按值拒绝报 -224，同上）。查询回 1/0：预选器在链上（STD、LNP）为 1。
  - header: "[:SENSe]:POWer[:RF]:MW:PRESelector[:STATe]"
    when: {value: "ON"}
    writes: {power.mw_path: STD}
    params: [{name: value, type: bool, state: power.mw_preselector, optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PRESelector[:STATe]"
    when: {value: "1"}
    writes: {power.mw_path: STD}
    params: [{name: value, type: bool, state: power.mw_preselector, optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PRESelector[:STATe]"
    option: MPB
    when: {value: "OFF"}
    writes: {power.mw_path: MPBypass}
    params: [{name: value, type: bool, state: power.mw_preselector, optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PRESelector[:STATe]"
    option: MPB
    when: {value: "0"}
    writes: {power.mw_path: MPBypass}
    params: [{name: value, type: bool, state: power.mw_preselector, optional: true}]
  - header: "[:SENSe]:POWer[:RF]:MW:PRESelector[:STATe]"
    state: power.mw_preselector
    set: false
  - header: ":DISPlay:WINDow<n>:TRACe:Y[:SCALe]:RLEVel"
    state: display.ref_level
    suffixes: {n: [1]}
  - header: ":UNIT:POWer"
    state: unit.power
  # ---- detector, trace, averaging --------------------------------------------------------------
  - header: "[:SENSe]:DETector:TRACe<t>"
    op: detector.select
    suffixes: {t: [1]}
    params:
      - name: value
        type: enum
        options: [NORMal, POSitive, SAMPle, NEGative]
        optional: true
        not_modeled:
          AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
          QPEak: the CISPR detectors are not modeled
          EAVerage: the CISPR detectors are not modeled
          RAVerage: the CISPR detectors are not modeled
          EPOSitive: the EMI standards are not modeled
          MPOSitive: the EMI standards are not modeled
          RMS: the average detector with RMS averaging is not modeled
    doc: 查询回当前使用的检波器（自动时为自动规则所选）；设置即手动，关闭自动。
  - header: "[:SENSe]:DETector[:FUNCtion]"
    op: detector.select
    params:
      - name: value
        type: enum
        options: [NORMal, POSitive, SAMPle, NEGative]
        optional: true
        not_modeled:
          AVERage: the average detector with the log-power/RMS/voltage average types is not modeled
          QPEak: the CISPR detectors are not modeled
          EAVerage: the CISPR detectors are not modeled
          RAVerage: the CISPR detectors are not modeled
          EPOSitive: the EMI standards are not modeled
          MPOSitive: the EMI standards are not modeled
          RMS: the average detector with RMS averaging is not modeled
    doc: 旧式命令：对所有迹线设置检波器（只有迹线 1），查询回迹线 1 的检波器。
  - header: "[:SENSe]:DETector:TRACe<t>:AUTO"
    state: detector_auto
    suffixes: {t: [1]}
  - header: "[:SENSe]:DETector:AUTO"
    state: detector_auto
  - header: ":TRACe<t>:TYPE"
    state: trace.type
    suffixes: {t: [1]}
  - header: ":TRACe[:DATA]"
    op: sa.trace_data
    set: false
    params: [{name: name, type: string, optional: true}]
  - header: ":TRACe:CLEar:ALL"
    op: sa.trace_clear
    query: false
  - header: "[:SENSe]:AVERage:COUNt"
    state: aver.count
  - header: "[:SENSe]:AVERage:TYPE"
    state: aver.type
  - header: "[:SENSe]:AVERage:TYPE:AUTO"
    state: aver.type_auto
  - header: "[:SENSe]:AVERage:CLEar"
    op: sa.trace_clear
    query: false
  - header: ":FORMat[:TRACe][:DATA]"
    state: format.data
  - header: ":FORMat:BORDer"
    state: format.border
    doc: 只影响二进制块的字节序；只实现 ASCii，保存并回读。
  # ---- markers ---------------------------------------------------------------------------------
  - header: ":CALCulate:MARKer<m>:MODE"
    state: marker.mode
    suffixes: {m: [1]}
    doc: OFF 关闭标记；从 OFF 打开时标记在屏幕中心；DELTa 把参考标记固定在当前位置。
  - header: ":CALCulate:MARKer<m>:X"
    op: sa.marker
    suffixes: {m: [1]}
    args: {what: x}
    params: [{name: value, type: float, unit: HZ, optional: true}]
    doc: 差值模式下 X 是相对参考标记的偏移；标记关闭时查询回 9.91E+37。
  - header: ":CALCulate:MARKer<m>:Y"
    op: sa.marker
    set: false
    suffixes: {m: [1]}
    args: {what: y}
  - header: ":CALCulate:MARKer<m>:MAXimum"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: max}
  - header: ":CALCulate:MARKer<m>:MAXimum:NEXT"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: next}
  - header: ":CALCulate:MARKer<m>:MAXimum:LEFT"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: left}
  - header: ":CALCulate:MARKer<m>:MAXimum:RIGHt"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: right}
  - header: ":CALCulate:MARKer<m>:MINimum"
    op: sa.marker
    query: false
    suffixes: {m: [1]}
    args: {what: min}
  - header: ":CALCulate:MARKer:AOFF"
    op: sa.marker_off
    query: false
  - header: ":CALCulate:MARKer:PEAK:SEARch:MODE"
    state: marker.search
  - header: ":CALCulate:MARKer:PEAK:THReshold"
    state: marker.threshold
  - header: ":CALCulate:MARKer:PEAK:EXCursion"
    state: marker.excursion
  - header: ":CALCulate:MARKer<m>:FCOunt[:STATe]"
    state: marker.count
    suffixes: {m: [1]}
  - header: ":CALCulate:MARKer<m>:FCOunt:X"
    op: sa.marker
    set: false
    suffixes: {m: [1]}
    args: {what: count}
  # ---- initiate, abort, trigger ----------------------------------------------------------------
  - header: ":INITiate:CONTinuous"
    state: init.continuous
  - header: ":INITiate[:IMMediate]"
    op: sa.initiate
    query: false
  - header: ":INITiate:RESTart"
    op: sa.initiate
    query: false
    doc: 重新开始测量：单次扫描下与 INIT:IMM 相同，取平均/保持次数的扫描。
  - header: ":ABORt"
    op: sa.trace_clear
    query: false
    doc: 中止当前扫描；连续扫描时从头重新开始。
  - header: ":TRIGger[:SEQuence]:SOURce"
    state: trigger.source
  - header: ":TRIGger[:SEQuence]:RF:SOURce"
    state: trigger.source
  # ---- preset ----------------------------------------------------------------------------------
  - header: ":SYSTem:PRESet"
    op: sys.reset
    query: false
    args: {then: {init.continuous: true}}
    doc: 与 *RST 相同的预置，但连续扫描为 ON（手册：SYST:PRES 置 INIT:CONT ON，*RST 置 OFF）。
  # ---- display (accepted: screen only) ---------------------------------------------------------
  - header: ":DISPlay:ENABle"
    state: display.enable
  - header: ":DISPlay:WINDow<n>:TRACe:Y[:SCALe]:PDIVision"
    state: display.pdiv
    suffixes: {n: [1]}
  - header: ":DISPlay:WINDow<n>:TRACe:Y:DLINe"
    state: display.dline
    suffixes: {n: [1]}
  - header: ":DISPlay:WINDow<n>:TRACe:Y:DLINe:STATe"
    state: display.dline_on
    suffixes: {n: [1]}
  - header: ":DISPlay:ANNotation:TRACe[:STATe]"
    state: display.annotation
