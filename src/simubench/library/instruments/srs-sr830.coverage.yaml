# SRS SR830 的覆盖表：按 SR830 DSP Lock-In Amplifier Manual（Revision 2.5，10/2011，
# firmware 6-1）第 1 章的 Command List 与第 5 章的 Detailed Command List 逐条列出。SR830 不是 SCPI，
# 命令是四条助记符，查询回复不带命令头。未实现的命令在 note 中说明原因。
schema: simubench.coverage/1
model: srs-sr830
sections:
  - section: "REFERENCE and PHASE (5-4)"
    commands:
      - header: PHAS
        level: implemented
        note: 相位设定/查询，范围 -360.00…729.99；真机四舍五入到 0.01° 并在 ±180° 回绕，本定义保留写入值（数据按模 360 等价）。
      - header: FMOD
        level: implemented
        note: 参考源 0 外部 / 1 内部；内部振荡器与 REF_IN 锁相接 lockin_reference。
      - header: FREQ
        level: implemented
        note: 参考频率 0.001…102000 Hz。两处偏差：真机只允许在内部参考模式下设置，lockin_reference 在外部模式下也接受；外部参考锁定时真机 FREQ? 回参考频率，本定义回内部振荡器的设定值（实际检测频率见 osc.frequency 读数）。
      - header: RSLP
        level: implemented
        note: 0 正弦过零 / 1 TTL 上升沿 / 2 TTL 下降沿（#273）：正弦过零与上升沿是同一零相位点，下降沿晚半个周期（参考相位移 180°，lockin_reference.ext_slope）；TTL 的阈值与输入要求未建模。
      - header: HARM
        level: implemented
        note: "1…19999；检测频率 n×f 上限 102 kHz，超限时按手册把 n 钳到最大可用值、不报错（lockin_reference 的 f_max 与 over_limit: clamp，#273）。"
      - header: SLVL
        level: implemented
        note: 正弦输出幅度 0.004…5.000 Vrms；真机四舍五入到 0.002 V，本定义保留写入值（偏差）。
  - section: "INPUT and FILTER (5-5)"
    commands:
      - header: ISRC
        level: implemented
        note: 0 A / 1 A-B / 2 I(1 MΩ) / 3 I(100 MΩ)（#273）：A、B 各 10 MΩ∥25 pF（SIG_IN、SIG_B 端子）；电流输入时 A 是 1 kΩ 到虚地，1 µA 对应 1 V 档，X/Y/R 与灵敏度按 A 读（lockin_input_mode、lockin_output.unit_scale）。10^6 与 10^8 两档增益只差噪声与带宽，未建模。
      - header: IGND
        level: accepted
        affects_data: false
        note: 屏蔽浮地/接地只保存回读（#273 的决定）：台架的网络共用一个地，屏蔽接法不改变读数。
      - header: ICPL
        level: implemented
        note: 0 AC（0.16 Hz 高通）/ 1 DC，接到 lockin_input_filter。
      - header: ILIN
        level: implemented
        note: 0 关 / 1 工频 / 2 二次工频 / 3 两者；陷波 Q=10，工频固定 50 Hz（真机在 [Setup] 里设，无远程命令）。
  - section: "GAIN and TIME CONSTANT (5-6, 5-7)"
    commands:
      - header: SENS
        level: implemented
        note: 0…26 档（2 nV…1 V 满量程），经表格映射到 lockin_input_amp 的灵敏度。
      - header: RMOD
        level: implemented
        note: 0 高储备 / 1 正常 / 2 低噪声；实际储备按手册 p.4-8 的表随灵敏度变化（0–174 dB，档间按对数插值，lockin_input_amp.reserve_db，#273），决定输入过载的门限。
      - header: OFLT
        level: implemented
        note: 0…19 档（10 µs…30 ks），经表格映射到 lockin_lowpass 的时间常数。
      - header: OFSL
        level: implemented
        note: 0/1/2/3 = 6/12/18/24 dB/oct。
      - header: SYNC
        level: not_modeled
        note: 同步滤波（检测频率 <200 Hz 时抑制 2f 纹波）在 lockin_lowpass 里没有模型，#273 第 5 节。
        gap: model_work
  - section: "DISPLAY and OUTPUT (5-8)"
    commands:
      - header: DDEF
        level: implemented
        note: CH1/CH2 的显示量与比值，DDEF? i 回 j,k（#273）；数据缓冲按显示量存曲线（X/R/X 噪声/AUX1/AUX2；Y/θ/Y 噪声/AUX3/AUX4）。比值 k（1/2：CH1 除以 AUX In 1/2，CH2 除以 AUX In 3/4）作用于 OUTR? 与存储的曲线（显示值即存储值，#390）；分母为 0 V 时显示 0（手册未写除零行为，平台规则）。
      - header: FPOP
        level: accepted
        note: CH1/CH2 前面板输出源，保存并回读，FPOP? i 只回 j（#273）；前面板 BNC 输出未建模。
        affects_data: false
      - header: OEXP
        level: implemented
        note: X/Y/R 各自的偏置（满量程 %）与扩展（×1/×10/×100），OEXP? i 回 x,j（#273）；X/Y 的作用于 OUTP?，R 的只作用于显示。
      - header: AOFF
        level: not_modeled
        note: 自动偏置（X/Y/R 归零）没有通用操作；手册在 5-8 与 5-11 各列一次，覆盖表只列一条。
        gap: model_work
  - section: "AUX INPUT and OUTPUT (5-9)"
    commands:
      - header: OAUX
        level: implemented
        note: AUX 输入 1…4，读的是测试台上解出的电压（电路层，1 MΩ）。
      - header: AUXV
        level: implemented
        note: AUX 输出 1…4，±10.5 V，1 kΩ 戴维南源；真机取整到 1 mV，本定义不取整（偏差）。
  - section: "SETUP (5-10)"
    commands:
      - header: OUTX
        level: accepted
        affects_data: false
        note: 输出接口选择（0 RS232 / 1 GPIB）只保存/回读；模型只有一种接入。
      - header: OVRM
        level: accepted
        affects_data: false
        note: 覆盖远程只影响前面板锁定，数据无关。
      - header: KCLK
        level: accepted
        affects_data: false
        note: 按键声只保存/回读。
      - header: ALRM
        level: accepted
        affects_data: false
        note: 报警声只保存/回读。
      - header: SSET
        level: not_modeled
        note: 设置缓冲（1…9）的保存未实现。
        blocked_by: setup-memory
        gap: blocked
      - header: RSET
        level: not_modeled
        note: 调用设置缓冲会改变全部设置，需要设置缓冲能力。
        blocked_by: setup-memory
        gap: blocked
  - section: "AUTO FUNCTIONS (5-11)"
    commands:
      - header: AGAN
        level: not_modeled
        note: 自动增益写回的是灵敏度电压，而本定义的 SENS 状态是档位索引；需要按档位写回的能力（#273 第 5 节）。
        gap: model_work
      - header: ARSV
        level: not_modeled
        note: 自动储备没有通用操作。
        gap: model_work
      - header: APHS
        level: implemented
        note: 自动相位，按当前滤波输出把参考相位移到 θ=0（lockin_output.auto_phase）。
  - section: "DATA STORAGE (5-12, 5-13)"
    commands:
      - header: SRAT
        level: implemented
        note: 0…13 = 62.5 mHz…512 Hz，14 = 每个触发一点（curve_buffer.rate，#273）；按虚拟时间采样。
      - header: SEND
        level: implemented
        note: 0 单次（存满 16383 点停止）/ 1 循环（保留最新 16383 点，bin 0 是最旧的一点）（#273）。
      - header: TRIG
        level: implemented
        note: 软件触发：采样率为触发时采一点；TSTR 1 时启动扫描（#273）。LIA 状态位 6（收到触发）不由 TRIG 置位（偏差）。
      - header: TSTR
        level: implemented
        note: 1：触发开始扫描，此后按采样率采样（#273）。
      - header: STRT
        level: implemented
        note: 开始扫描，暂停后从暂停处续采（curve_buffer.start，#273）；第一点在开始时刻。
      - header: PAUS
        level: implemented
        note: 暂停扫描并保留数据（#273）。
      - header: REST
        level: implemented
        note: 停止扫描并丢弃数据（#273）。
  - section: "DATA TRANSFER (5-15, 5-16, 5-17)"
    commands:
      - header: OUTP
        level: implemented
        note: OUTP? 1/2/3/4 = X/Y/R/θ；数值由相敏检波与低通求得。回复格式为引擎的工程记数（真机是 6 位有效数字的裸浮点，偏差）。
      - header: OUTR
        level: implemented
        note: OUTR? 1/2 = CH1/CH2 显示值，随 DDEF 的量（手册 5-16/5-17）：X/R/XNoise 与 AUX1/2、Y/θ/YNoise 与 AUX3/4，与曲线缓冲的取量同一来源；DDEF 的比值 k≠0 时除以对应 AUX 输入（分母 0 V 时为 0，#390）；噪声量是前端噪声密度（模型估计）。
      - header: SNAP
        level: not_modeled
        note: 2…6 个编号（1…11，含 X/Y/R/θ、AUX、频率、显示值）在同一时刻读取；lockin_output.snap 只认名字，需要编号选择能力（#273 第 2 节）。
        gap: model_work
      - header: SPTS
        level: implemented
        note: 已存点数（#273）；循环模式下最多 16383。
      - header: TRCA
        level: implemented
        note: TRCA? i,j,k：曲线 i 从 0 基的 bin j 起 k 点，ASCII，每点后带逗号（#273）；j+k 超过已存点数报 -222。数值格式为引擎的工程记数（偏差同 OUTP）。
      - header: TRCB
        level: implemented
        note: IEEE 单精度二进制，低字节在前，每点 4 字节（#273）；回复后仍带平台的行结束符（偏差：真机只靠 EOI 结束）。
      - header: TRCL
        level: implemented
        note: 手册的 16 位非规格化格式：尾数 m 与指数 e 各 16 位，值 = m × 2^(e−124)，每点 4 字节（#273）；行结束符同 TRCB。
      - header: FAST
        level: not_modeled
        note: GPIB 快速传输（按采样节拍连续推送 X/Y）不在模型里：仿真的传输是请求/应答式（#273 第 2 节允许另评估）。
        gap: out_of_scope
      - header: STRD
        level: not_modeled
        note: 快速传输下延迟 0.5 s 启动扫描，随 FAST 不建模。
        gap: model_work
  - section: "INTERFACE (5-19)"
    commands:
      - header: '*RST'
        level: implemented
        note: 恢复第 4 章默认设置表（引擎内置 reset）；通信与状态寄存器按手册不变。
      - header: '*IDN'
        level: implemented
        note: Stanford_Research_Systems,SR830,s/n00111,ver1.000（手册 5-19 的格式）。
      - header: LOCL
        level: accepted
        affects_data: false
        note: 本地/远程/本地锁定只保存/回读，不影响数据。
  - section: "STATUS (5-20)"
    commands:
      - header: '*CLS'
        level: implemented
        note: 清四个状态字节的事件位与错误（使能寄存器保留，#273）。
      - header: '*ESE'
        level: implemented
        note: "标准事件使能；*ESE j 写整字节，*ESE i,j 设第 i 位（status_register 的 mirror: esr，#273）。"
      - header: '*ESR'
        level: implemented
        note: 标准事件字节，读整字节清零，*ESR? i 只读并清第 i 位（#273）。INP（输入队列溢出）与 PON 在仿真中不会出现。
      - header: '*SRE'
        level: implemented
        note: 串行轮询使能，整字节或 i,j 按位（#273）。
      - header: '*STB'
        level: implemented
        note: 串行轮询字节：SCN（无扫描进行）、IFC（无命令执行，恒 1）、ERR/LIA（使能后的错误/LIA 字节）、MAV、ESB、SRQ（#273）；*STB? i 读第 i 位。
      - header: '*PSC'
        level: accepted
        note: 保存并回读（仿真不经历上电，#273）。
        affects_data: false
      - header: ERRE
        level: implemented
        note: 错误状态使能，整字节或 i,j 按位（#273）。
      - header: ERRS
        level: implemented
        note: 错误状态字节（电池/RAM/ROM/GPIB/DSP/数学），仿真里没有硬件错误，恒 0；读后清零（#273）。
      - header: LIAE
        level: implemented
        note: LIA 状态使能，整字节或 i,j 按位；使能后的位汇总到串行轮询字节位 3（#273）。
      - header: LIAS
        level: implemented
        note: 位 0 输入/储备过载、2 输出过载、3 失锁、4 量程改变、5 时间常数改变、6 收到触发；读后清零，LIAS? i 读并清第 i 位（#273）。位 1 滤波器过载没有模型。
  - section: "Using SR530 Programs (5-31)"
    commands:
      - {header: AX, level: not_modeled, note: SR530 兼容层，不在本定义范围。, gap: out_of_scope}
      - {header: AY, level: not_modeled, note: SR530 兼容层，不在本定义范围。, gap: out_of_scope}
