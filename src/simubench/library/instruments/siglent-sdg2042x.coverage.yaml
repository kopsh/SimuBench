# The commands of the SDG Series Programming Guide PG02_E05C by section; levels and notes by hand.
schema: simubench.coverage/1
model: siglent-sdg2042x
sections:
- section: 3.1 IEEE 488.2 Common Commands (PG02_E05C)
  commands:
  - header: '*IDN'
    level: implemented
    note: 'Format 2 (SDG2000X): Siglent Technologies,<model>,<serial>,<firmware>'
  - header: '*OPC'
    level: implemented
    note: 'Format 2: 1'
  - header: '*RST'
    level: implemented
    note: '*RST values the manual does not give use SimuBench defaults: SINE, 1 kHz, 4 Vpp, 0 V, phase 0, output OFF, load HZ, NOR, duty 50 %, symmetry 50 %'
- section: 3.2 Comm_Header Command (PG02_E05C)
  commands:
  - header: Comm_HeaDeR
    level: not_modeled
    note: not available on the SDG2000X (availability table)
- section: 3.3 Output Command (PG02_E05C)
  commands:
  - header: C<ch>:OUTPut
    level: implemented
    note: ON|OFF, LOAD (50..100000 Ω or HZ), PLRT (NOR|INVT); reply C<n>:OUTP ON,LOAD,HZ,PLRT,NOR. Changing the load keeps the amplitude setting, so the output voltage changes (D13)
  - header: C<ch>:NOISE_ADD
    level: not_modeled
  - header: OUT_BOTHCH
    level: not_modeled
- section: 3.4 Basic Wave Command (PG02_E05C)
  commands:
  - header: C<ch>:BaSic_WaVe
    level: implemented
    note: 'WVTP SINE, SQUARE (DUTY), RAMP (SYM), DC; FRQ, PERI, AMP, AMPVRMS, AMPDBM (finite load), OFST, HLEV, LLEV, PHSE, MAX_OUTPUT_AMP. PULSE, NOISE, ARB, PRBS, IQ and their parameters answer -224 (not
      modeled). Reply in the order of the guide''s example (WVTP, FRQ, PERI, AMP, OFST, HLEV, LLEV, PHSE), then DUTY or SYM; numbers in their shortest form with the unit. Out of the data sheet''s ranges:
      -222 and nothing changes'
