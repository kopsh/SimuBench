    level: implemented
    note: 清事件寄存器与错误队列。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器。
  - header: '*IDN'
    level: implemented
    note: Keysight Technologies,N6705C,<serial>,<firmware>（手册 *IDN? 的四个字段）。
  - header: '*OPC'
    level: implemented
    note: '*OPC? 等输出继电器闭合等待处理完后回 1。'
  - header: '*OPT'
    level: not_modeled
    note: 选件串未实现。
  - header: '*RCL'
    level: not_modeled
    note: 状态存储未实现。
  - header: '*RDT'
    level: not_modeled
    note: 通道描述未实现（型号用 SYSTem:CHANnel:MODel?）。
  - header: '*RST'
    level: implemented
    note: 按 *RST 表：电压/电流 0、输出 OFF、OVP MAX（60 V）、OCP OFF、OCP 延迟 0.020 s、SCHange、内部检测、显示 METER1。
  - header: '*SAV'
    level: not_modeled
    note: 状态存储未实现。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器。
  - header: '*STB'
    level: implemented
    note: 状态字节；OPER/QUES 汇总位无来源（STATus 寄存器组未实现）。
  - header: '*TRG'
    level: not_modeled
    note: 瞬变与测量触发系统未实现。
  - header: '*TST'
    level: implemented
    note: 自检通过回复 0。
  - header: '*WAI'
    level: implemented
    note: 等待全部待完成操作。
