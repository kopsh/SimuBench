schema: simubench.instrument/1
id: keysight-daq970a
manufacturer: Keysight Technologies
model: DAQ970A
class: daq
version: 1
description: >-
  Keysight DAQ970A 数据采集系统（固定配置：主机 + 槽 1 的 DAQM901A 20 通道电枢继电器多路复用卡；
  SCPI 通道号 101–120 电压/电阻、121/122 电流，槽 2/3 号域 201–220、301–320 存在但无模块）。
  真实型号（D42）：命令、参数、默认值与回复按 DAQ970A/DAQ973A Programming Guide（DAQ97-90002,
  Edition 3, March 2020）核对；扫描逐点闭合继电器、经模拟总线交给内部 DMM（直流/交流电压、两线/
  四线电阻、直流/交流电流），读数由电路求解：四线电阻把通道 n 与 n+10 配对，电流只在 21/22 上测量。
  READ? 等于 INITiate 后紧跟 FETCh?，读数进读数存储器（与 34970A 不同）。
reference:
  title: Keysight DAQ970A/DAQ973A Data Acquisition System Programming Guide
  document: DAQ97-90002
  version: Edition 3, March 2020
  firmware: "*IDN? 示例的修订串 A.02.04-00.16-11.29-00.02-02-01"
identity:
  idn: "Keysight Technologies,DAQ970A,{serial},{firmware}"
  serial: "MY12345678"
  firmware: "A.02.04-00.16-11.29-00.02-02-01"
format:
  number: nr3
  digits: 8
  sign: true
  exponent_digits: 2
  boolean: numeric
  enum: short
  error_code: signed
# 手册有、但本定义不回答的内置命令：SYSTem:DATE/TIME（实时时钟，引擎内置回复格式与手册不同）。
# 其余公共命令由引擎内置，见覆盖表。
builtins: ["*IDN", "*RST", "*CLS", "*ESE", "*ESR", "*OPC", "*SRE", "*STB", "*TRG", "*TST", "*WAI", ":SYSTem:ERRor[:NEXT]"]
error_queue: 10
errors:
  0: "No error"
  -100: "Command error"
  -101: "Invalid character"
  -102: "Syntax error"
  -103: "Invalid separator"
  -104: "Data type error"
  -105: "GET not allowed"
  -108: "Parameter not allowed"
  -109: "Missing parameter"
  -110: "Command header error"
  -111: "Header separator error"
  -112: "Program mnemonic too long"
  -113: "Undefined header"
  -114: "Header suffix out of range"
  -120: "Numeric data error"
  -121: "Invalid character in number"
  -123: "Numeric overflow"
  -124: "Too many digits"
  -128: "Numeric data not allowed"
  -130: "Suffix error"
  -131: "Invalid suffix"
  -134: "Suffix too long"
  -138: "Suffix not allowed"
  -140: "Character data error"
  -141: "Invalid character data"
  -144: "Character data too long"
  -148: "Character data not allowed"
  -150: "String data error"
  -151: "Invalid string data"
  -158: "String data not allowed"
  -160: "Block data error"
  -161: "Invalid block data"
  -168: "Block data not allowed"
  -170: "Expression error"
  -171: "Invalid expression"
  -178: "Expression data not allowed"
  -200: "Execution error"
  -211: "Trigger ignored"
  -213: "INIT ignored"
  -214: "Trigger deadlock"
  -220: "Parameter error"
  -221: "Settings conflict"
  -222: "Data out of range"
  -223: "Too much data"
  -224: "Illegal parameter value"
  -225: "Out of memory"
  -230: "Data corrupt or stale"
  -231: "Data questionable"
  -240: "Hardware error"
  -241: "Hardware missing"
  -260: "Expression error"
  -261: "Math error in expression"
  -300: "Device-specific error"
  -310: "System error"
  -350: "Error queue overflow"
  -400: "Query error"
  -410: "Query INTERRUPTED"
  -420: "Query UNTERMINATED"
  -430: "Query DEADLOCKED"
  -440: "Query UNTERMINATED after indefinite response"
specs:
  source: Programming Guide 第 1 章 Factory Reset State、第 2 章 CONFigure/SENSe/TRIGger/DATA、第 4 章 DAQM901A
  slots: 3（固定配置：槽 1 装 DAQM901A，槽 2/3 空）
  channels: "DAQM901A 20 个双线电压/电阻通道（101–120）+ 2 个电流通道（121/122）"
  dcv_ranges_v: [0.1, 1, 10, 100, 300]
  acv_ranges_v: [0.1, 1, 10, 100, 300]
  res_ranges_ohm: [100, 1.0e3, 1.0e4, 1.0e5, 1.0e6, 1.0e7, 1.0e8, 1.0e9]
  dci_ranges_a: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 0.01, 0.1, 1]
  aci_ranges_a: [1.0e-4, 1.0e-3, 0.01, 0.1, 1]
  fres_pairing: "DAQM901A：通道 n（1–10）供电流，通道 n+10 作检测"
  nplc: [0.001, 0.002, 0.006, 0.02, 0.06, 0.2, 1, 2, 10, 20, 100, 200]
  reading_memory: "100,000 readings；溢出后覆盖最旧的"
  trigger_count: "1–1,000,000（或连续 INFinity；连续未建模）"
  scan_interval_s: "0–360,000；默认 10 s（Factory Reset State 表），CONFigure/MEASure 设为 1 s"
  channel_delay_s: "0–60（每通道；未建模）"
  relay_r_ohm: 0.5
  relay_settle_s: 0.003
channels:
  count: 62
  # ROUT:SCAN (@) 清空扫描表（ROUTe:SCAN，#418）。
  lists: {empty: true}
  numbering:
    - {first: 101, count: 22}
    - {first: 201, count: 20}
    - {first: 301, count: 20}
channel_state:
  closed:
    type: bool
    default: false
    label: 通道闭合
    label_en: Channel closed
  # 每通道的测量配置（#365，用户指南：CONFigure 与 SENSe 按通道保存）：扫描到某通道时，扫描表把
  # 这些值装进内部 DMM 的设定（下面的 sense.*），一个扫描表可混合电压、电阻与电流通道。
  function:
    type: enum
    options: [VOLT, "VOLT:AC", RES, FRES, CURR, "CURR:AC"]
    default: VOLT
    rst: VOLT
    label: 测量功能
    label_en: Function
  range:
    type: float
    unit: V
    min: 0.0
    max: 300.0
    default: 0.0
    rst: 0.0
    special: {AUTO: 0.0}
    label: 电压量程设定
    label_en: Voltage range setting
  res_range:
    type: float
    unit: OHM
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    special: {AUTO: 0.0}
    label: 电阻量程设定
    label_en: Resistance range setting
  curr_range:
    type: float
    unit: A
    min: 0.0
    max: 1.0
    default: 0.0
    rst: 0.0
    special: {AUTO: 0.0}
    label: 电流量程设定
    label_en: Current range setting
  range_auto:
    type: bool
    default: true
    rst: true
    label: 自动量程
    label_en: Autorange
  resolution:
    type: float
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 分辨率设定
    label_en: Resolution setting
  # 只接受手册表中的 12 个值；其它值舍入到表中按对数最近的一个（手册第 1 章 Numeric parameters：
  # “If a command accepts only certain specific values, the instrument rounds ... to the accepted
  # values”，方向未写明，#423）。
  nplc:
    type: float
    min: 0.001
    max: 200.0
    ladder: [0.001, 0.002, 0.006, 0.02, 0.06, 0.2, 1, 2, 10, 20, 100, 200]
    default: 1.0
    rst: 1.0
    label: 积分时间（PLC）
    label_en: Integration time (PLC)
  imp_auto:
    type: bool
    default: false
    rst: false
    label: 输入阻抗自动（10 MΩ ↔ >10 GΩ）
    label_en: Input impedance AUTO
state:
  # 内部 DMM 当前的设定：扫描到一个通道时由该通道的配置装入（#365）；组件绑定这些设定。
  sense.function:
    type: enum
    options: [VOLT, "VOLT:AC", RES, FRES, CURR, "CURR:AC"]
    default: VOLT
    rst: VOLT
    label: 测量功能
    label_en: Function
  sense.range:
    type: float
    unit: V
    min: 0.0
    max: 300.0
    default: 0.0
    rst: 0.0
    special: {AUTO: 0.0}
    label: 量程设定
    label_en: Range setting
  sense.res.range:
    type: float
    unit: OHM
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 电阻量程设定
    label_en: Resistance range setting
  sense.curr.range:
    type: float
    unit: A
    min: 0.0
    max: 1.0
    default: 0.0
    rst: 0.0
    label: 电流量程设定
    label_en: Current range setting
  sense.resolution:
    type: float
    unit: V
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 分辨率设定
    label_en: Resolution setting
  sense.range_auto:
    type: bool
    default: true
    rst: true
    label: 自动量程
    label_en: Autorange
  sense.nplc:
    type: float
    min: 0.001
    max: 200.0
    default: 1.0
    rst: 1.0
    label: 积分时间（PLC）
    label_en: Integration time (PLC)
  sense.imp_auto:
    type: bool
    default: false
    rst: false
    label: 输入阻抗自动（10 MΩ ↔ >10 GΩ）
    label_en: Input impedance AUTO
  scan.list:
    type: int_list
    min: 1
    max: 320
    default: []
    rst: []
    label: 扫描表
    label_en: Scan list
  # 查询按实数回（手册 TRIG:COUN? 的示例 +1.00000000E+00）。
  scan.count:
    type: float
    min: 1
    max: 1000000
    default: 1
    rst: 1
    # INFinity（连续扫描）真机接受，模型未实现：报 -224 并标为未建模（#360）。
    not_modeled: {INFinity: continuous scanning is not modeled}
    label: 扫描次数
    label_en: Scan count
  scan.interval:
    type: float
    unit: S
    min: 0.0
    max: 360000.0
    default: 10.0
    rst: 10.0
    label: 扫描间隔
    label_en: Scan interval
  trigger.source:
    type: enum
    options: [IMMediate, BUS, EXTernal, TIMer]
    default: IMMediate
    rst: IMMediate
    label: 触发源
    label_en: Trigger source
  display.state:
    type: bool
    default: true
    rst: true
    label: 显示
    label_en: Display
  display.text:
    type: string
    default: ""
    rst: ""
    label: 显示文本
    label_en: Display text
  system.version:
    type: string
    default: "1994.0"
    label: SCPI 版本
    label_en: SCPI version
  route.done:
    type: int
    min: 1
    max: 1
    default: 1
    label: 继电器动作完成
    label_en: Relay operations done
components:
  # 主机背板：三个槽位，槽 1 装 DAQM901A（20 通道 + 2 个电流通道）。
  - name: bp
    type: daq_backplane
    params:
      slots: 3
      modules: [{slot: 1, model: "DAQM901A", channels: 22}]
  # 多路复用卡：20 路双线输入、模拟总线；扫描时先断后合。
  # close_limit 0：未配置扫描表时手册允许多路同时闭合；「配置扫描表后只能闭一路」未建模。
  - name: mux
    type: mux_card
    params:
      slot: 1
      backplane: bp
      dmm: inp
      close_limit: 0
      relay_settle: 0.003
      # 四线电阻时通道 n（1–10）与 n+10 配对；21/22 是带分流电阻的电流通道（第 4 章 DAQM901A）。
      four_wire_offset: 10
      current_channels: [21, 22]
  # 内部 DMM：同 34970A 的测量链。测试电流与分流电阻 Programming Guide 未给，取与 34970A 相同的
  # 模型值（100 MΩ、1 GΩ 档按 500 nA 建模），小电流档的分流电阻取模型值。
  - name: inp
    type: dmm_input_terminal
    params:
      z_in: 1.0e7
      z_in_high: 1.0e10
      high_z: $sense.imp_auto
      high_z_ranges: [0.1, 1, 10]
      conditioning: path
      mode: {from: $sense.function, map: {VOLT: VOLTage, "VOLT:AC": VOLTage, RES: RESistance, FRES: FRESistance, CURR: CURRent, "CURR:AC": CURRent}}
      test_current: {100: 1.0e-3, 1000: 1.0e-3, 10000: 1.0e-4, 100000: 1.0e-5, 1000000: 5.0e-6, 10000000: 5.0e-7, 100000000: 5.0e-7, 1000000000: 5.0e-7}
      shunt: {0.000001: 1000.0, 0.00001: 1000.0, 0.0001: 1000.0, 0.001: 100.0, 0.01: 5.0, 0.1: 5.0, 1: 0.1}
  - name: path
    type: dmm_conditioning
    params:
      function: {from: $sense.function, map: {VOLT: DC, "VOLT:AC": AC, RES: RES, FRES: FRES, CURR: DCI, "CURR:AC": ACI}}
      ranges:
        DC: [0.1, 1, 10, 100, 300]
        AC: [0.1, 1, 10, 100, 300]
        RES: [100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]
        FRES: [100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]
        DCI: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1]
        ACI: [0.0001, 0.001, 0.01, 0.1, 1]
      range: $sense.range
      range_res: $sense.res.range
      range_curr: $sense.curr.range
      autorange: $sense.range_auto
      autorange_up: 1.2
      autorange_down: 0.1
  # A/D：8 位尾数；分辨率按 [SENSe:]VOLTage[:DC]:NPLCycles 的表（× 量程）；读数时间 = NPLC × 20 ms（50 Hz）
  # 加 1 ms 的模型值。
  - name: meter
    type: dmm_adc
    params:
      conditioning: path
      digits: 8
      overrange: 1.2
      overload_value: 9.9e37
      resolution: {from: $sense.nplc, table: {0.001: 3.0e-5, 0.002: 1.5e-5, 0.006: 6.0e-6, 0.02: 3.0e-6, 0.06: 1.5e-6, 0.2: 7.0e-7, 1: 3.0e-7, 2: 2.2e-7, 10: 1.0e-7, 20: 8.0e-8, 100: 3.0e-8, 200: 2.2e-8}}
      reading_time: {from: $sense.nplc, table: {0.001: 0.00102, 0.002: 0.00104, 0.006: 0.00112, 0.02: 0.0014, 0.06: 0.0022, 0.2: 0.005, 1: 0.021, 2: 0.041, 10: 0.201, 20: 0.401, 100: 2.001, 200: 4.001}}
  # 扫描表：列表、次数与间隔；由触发模型逐点采样，读数带 CHAN 字段。
  - name: scan
    type: scan_table
    params:
      mux: mux
      dmm: meter
      backplane: bp
      list: $scan.list
      count: $scan.count
      interval: $scan.interval
      ascending: true
      channel_settings:
        function: sense.function
        range: sense.range
        res_range: sense.res.range
        curr_range: sense.curr.range
        range_auto: sense.range_auto
        resolution: sense.resolution
        nplc: sense.nplc
        imp_auto: sense.imp_auto
      function_setting: function
  # 读数存储器：INITiate 与 READ? 都存入（READ? = INITiate + FETCh?，p.30）。
  - name: mem
    type: reading_buffer
    params:
      capacity: 100000
      when_full: overwrite
  # INITiate/READ?/FETCh?/DATA 的触发模型：读数写入存储器。
  - name: st
    type: trigger_model
    params:
      sampler: scan
      source: {from: $trigger.source, map: {IMMediate: immediate, TIMer: immediate, BUS: bus, EXTernal: external}}
      buffer: mem
      fetch_from_buffer: true
      waiting_error: -230
wiring:
  instrument:
    - [mux.out, inp.pin]
    - [mux.sense, inp.sense]
    - [inp.out, path.in]
ports:
  instrument:
    H101: mux.ch101H
    L101: mux.ch101L
    H102: mux.ch102H
    L102: mux.ch102L
    H103: mux.ch103H
    L103: mux.ch103L
    H104: mux.ch104H
    L104: mux.ch104L
    H105: mux.ch105H
    L105: mux.ch105L
    H106: mux.ch106H
    L106: mux.ch106L
    H107: mux.ch107H
    L107: mux.ch107L
    H108: mux.ch108H
    L108: mux.ch108L
    H109: mux.ch109H
    L109: mux.ch109L
    H110: mux.ch110H
    L110: mux.ch110L
    H111: mux.ch111H
    L111: mux.ch111L
    H112: mux.ch112H
    L112: mux.ch112L
    H113: mux.ch113H
    L113: mux.ch113L
    H114: mux.ch114H
    L114: mux.ch114L
    H115: mux.ch115H
    L115: mux.ch115L
    H116: mux.ch116H
    L116: mux.ch116L
    H117: mux.ch117H
    L117: mux.ch117L
    H118: mux.ch118H
    L118: mux.ch118L
    H119: mux.ch119H
    L119: mux.ch119L
    H120: mux.ch120H
    L120: mux.ch120L
    # DAQM901A 的电流通道 21/22：I 端子经保险与分流电阻接到内部 DMM 的电流输入。
    I121: mux.ch121H
    L121: mux.ch121L
    I122: mux.ch122H
    L122: mux.ch122L
display:
  template: daq
  summary: [scan.list, scan.count, trigger.source]
  actions:
    run: ":INITiate"
    stop: ":ABORt"
capabilities: [daq]
commands:
  # ---- 通道与继电器（ROUTe 子系统）-----------------------------------------------
  - header: "ROUTe:CLOSe"
    op: mux.close
    params: [{name: channels, type: channel_list}]
  - header: "ROUTe:OPEN"
    op: mux.open
    query: false
    params: [{name: channels, type: channel_list}]
  # 扫描表的查询按定长块返回，空表为 #13(@)（ROUTe:SCAN，#415）。
  - header: "ROUTe:SCAN"
    state: scan.list
    reply: "{value_block}"
  # 继电器动作在命令执行时完成，ROUT:DONE? 总回 1。
  - header: "ROUTe:DONE"
    state: route.done
    set: false
  # ---- 触发（TRIGger 子系统）：触发次数即扫描次数；TIMer 源按间隔扫描（间隔不计入虚拟时间）---------
  - header: "TRIGger:SOURce"
    state: trigger.source
  - header: "TRIGger:COUNt"
    state: scan.count
  - header: "TRIGger:TIMer"
    state: scan.interval
  # ---- CONFigure / MEASure：命令头选功能，量程参数关闭自动量程，通道列表整表写进扫描表（重定义扫描表），
  #      触发次数设 1、间隔设 1 s（TRIGger:TIMer 的说明）；MEASure? 再按扫描表跑一次（同 READ?）。
  #      功能、量程与分辨率写进每个通道自己的配置（ch.*），扫描到该通道时装入内部 DMM。量程 MIN/MAX 是
  #      手册量程表的两端（DCV/ACV 100 mV–300 V，电阻 100 Ω–1 GΩ，DCI 1 µA–1 A，ACI 100 µA–1 A），
  #      分辨率 MIN/MAX 选 NPLC 表的两端（200 / 0.001 PLC），DEF 为 1 PLC。
  - header: "CONFigure[:VOLTage]:DC"
    query: false
    writes: {ch.function: VOLT, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure[:VOLTage]:DC"
    op: st.read
    set: false
    writes: {ch.function: VOLT, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure[:VOLTage]:AC"
    query: false
    writes: {ch.function: "VOLT:AC", ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
