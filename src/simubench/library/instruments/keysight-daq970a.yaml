schema: simubench.instrument/1
id: keysight-daq970a
manufacturer: Keysight Technologies
model: DAQ970A
extends: keysight-34970a
class: daq
description: >-
  Keysight DAQ970A 数据采集系统（固定配置：主机 + 槽 1 的 DAQM901A 20 通道电枢继电器多路复用卡；
  SCPI 通道号 101–120 电压/电阻、121/122 电流，槽 2/3 号域 201–220、301–320 存在但无模块）。
  真实型号（D42）：命令、参数、默认值与回复按 DAQ970A/DAQ973A Programming Guide（DAQ97-90002,
  Edition 3, March 2020）核对；扫描逐点闭合继电器、经模拟总线交给内部 DMM（直流/交流电压、两线/
  四线电阻、直流/交流电流），读数由电路求解：四线电阻把通道 n 与 n+10 配对，电流只在 21/22 上测量。
  READ? 等于 INITiate 后紧跟 FETCh?，读数进读数存储器（与 34970A 不同）。
reference:
  title: Keysight DAQ970A/DAQ973A Data Acquisition System Programming Guide
  document: DAQ97-90002
  version: Edition 3, March 2020
  firmware: "*IDN? 示例的修订串 A.02.04-00.16-11.29-00.02-02-01"
identity:
  idn: "Keysight Technologies,DAQ970A,{serial},{firmware}"
  serial: "MY12345678"
  firmware: "A.02.04-00.16-11.29-00.02-02-01"
errors:
  -230: "Data corrupt or stale"
  # 34970A 的器件错误码(D59 备选三):DAQ970A 不继承
  111: null
  112: null
  113: null
  201: null
  202: null
  203: null
  204: null
  221: null
  222: null
  223: null
  224: null
  225: null
  226: null
  251: null
  261: null
  271: null
  272: null
  281: null
  291: null
  292: null
  301: null
  303: null
specs:
  source: Programming Guide 第 1 章 Factory Reset State、第 2 章 CONFigure/SENSe/TRIGger/DATA、第 4 章 DAQM901A
  slots: 3（固定配置：槽 1 装 DAQM901A，槽 2/3 空）
  channels: "DAQM901A 20 个双线电压/电阻通道（101–120）+ 2 个电流通道（121/122）"
  res_ranges_ohm: [100, 1.0e3, 1.0e4, 1.0e5, 1.0e6, 1.0e7, 1.0e8, 1.0e9]
  dci_ranges_a: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 0.01, 0.1, 1]
  aci_ranges_a: [1.0e-4, 1.0e-3, 0.01, 0.1, 1]
  fres_pairing: "DAQM901A：通道 n（1–10）供电流，通道 n+10 作检测"
  nplc: [0.001, 0.002, 0.006, 0.02, 0.06, 0.2, 1, 2, 10, 20, 100, 200]
  reading_memory: "100,000 readings；溢出后覆盖最旧的"
  trigger_count: "1–1,000,000（或连续 INFinity；连续未建模）"
  scan_interval_s: "0–360,000；默认 10 s（Factory Reset State 表），CONFigure/MEASure 设为 1 s"
channels:
  lists: {empty: true}
channel_state:
  res_range:
    type: float
    unit: OHM
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    special: {AUTO: 0.0}
    label: 电阻量程设定
    label_en: Resistance range setting
  resolution:
    type: float
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 分辨率设定
    label_en: Resolution setting
  # 只接受手册表中的 12 个值；其它值舍入到表中按对数最近的一个（手册第 1 章 Numeric parameters：
  # “If a command accepts only certain specific values, the instrument rounds ... to the accepted
  # values”，方向未写明，#423）。
  nplc:
    type: float
    min: 0.001
    max: 200.0
    ladder: [0.001, 0.002, 0.006, 0.02, 0.06, 0.2, 1, 2, 10, 20, 100, 200]
    default: 1.0
    rst: 1.0
    label: 积分时间（PLC）
    label_en: Integration time (PLC)
state:
  sense.res.range:
    type: float
    unit: OHM
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 电阻量程设定
    label_en: Resistance range setting
  sense.resolution:
    type: float
    unit: V
    min: 0.0
    max: 1.0e9
    default: 0.0
    rst: 0.0
    label: 分辨率设定
    label_en: Resolution setting
  sense.nplc:
    type: float
    min: 0.001
    max: 200.0
    default: 1.0
    rst: 1.0
    label: 积分时间（PLC）
    label_en: Integration time (PLC)
  scan.count:
    type: float
    min: 1
    max: 1000000
    default: 1
    rst: 1
    # INFinity（连续扫描）真机接受，模型未实现：报 -224 并标为未建模（#360）。
    not_modeled: {INFinity: continuous scanning is not modeled}
    label: 扫描次数
    label_en: Scan count
  scan.interval:
    type: float
    unit: S
    min: 0.0
    max: 360000.0
    default: 10.0
    rst: 10.0
    label: 扫描间隔
    label_en: Scan interval
  route.done:
    type: int
    min: 1
    max: 1
    default: 1
    label: 继电器动作完成
    label_en: Relay operations done
components:
  # 主机背板：三个槽位，槽 1 装 DAQM901A（20 通道 + 2 个电流通道）。
  - name: bp
    type: daq_backplane
    params:
      slots: 3
      modules: [{slot: 1, model: "DAQM901A", channels: 22}]
  # 多路复用卡：20 路双线输入、模拟总线；扫描时先断后合。
  # close_limit 0：未配置扫描表时手册允许多路同时闭合；「配置扫描表后只能闭一路」未建模。
  - name: mux
    type: mux_card
    params:
      slot: 1
      backplane: bp
      dmm: inp
      close_limit: 0
      relay_settle: 0.003
      # 四线电阻时通道 n（1–10）与 n+10 配对；21/22 是带分流电阻的电流通道（第 4 章 DAQM901A）。
      four_wire_offset: 10
      current_channels: [21, 22]
  # 内部 DMM：同 34970A 的测量链。测试电流与分流电阻 Programming Guide 未给，取与 34970A 相同的
  # 模型值（100 MΩ、1 GΩ 档按 500 nA 建模），小电流档的分流电阻取模型值。
  - name: inp
    type: dmm_input_terminal
    params:
      z_in: 1.0e7
      z_in_high: 1.0e10
      high_z: $sense.imp_auto
      high_z_ranges: [0.1, 1, 10]
      conditioning: path
      mode: {from: $sense.function, map: {VOLT: VOLTage, "VOLT:AC": VOLTage, RES: RESistance, FRES: FRESistance, CURR: CURRent, "CURR:AC": CURRent}}
      test_current: {100: 1.0e-3, 1000: 1.0e-3, 10000: 1.0e-4, 100000: 1.0e-5, 1000000: 5.0e-6, 10000000: 5.0e-7, 100000000: 5.0e-7, 1000000000: 5.0e-7}
      shunt: {0.000001: 1000.0, 0.00001: 1000.0, 0.0001: 1000.0, 0.001: 100.0, 0.01: 5.0, 0.1: 5.0, 1: 0.1}
  - name: path
    type: dmm_conditioning
    params:
      function: {from: $sense.function, map: {VOLT: DC, "VOLT:AC": AC, RES: RES, FRES: FRES, CURR: DCI, "CURR:AC": ACI}}
      ranges:
        DC: [0.1, 1, 10, 100, 300]
        AC: [0.1, 1, 10, 100, 300]
        RES: [100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]
        FRES: [100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000]
        DCI: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1]
        ACI: [0.0001, 0.001, 0.01, 0.1, 1]
      range: $sense.range
      range_res: $sense.res.range
      range_curr: $sense.curr.range
      autorange: $sense.range_auto
      autorange_up: 1.2
      autorange_down: 0.1
  # A/D：8 位尾数；分辨率按 [SENSe:]VOLTage[:DC]:NPLCycles 的表（× 量程）；读数时间 = NPLC × 20 ms（50 Hz）
  # 加 1 ms 的模型值。
  - name: meter
    type: dmm_adc
    params:
      conditioning: path
      digits: 8
      overrange: 1.2
      overload_value: 9.9e37
      resolution: {from: $sense.nplc, table: {0.001: 3.0e-5, 0.002: 1.5e-5, 0.006: 6.0e-6, 0.02: 3.0e-6, 0.06: 1.5e-6, 0.2: 7.0e-7, 1: 3.0e-7, 2: 2.2e-7, 10: 1.0e-7, 20: 8.0e-8, 100: 3.0e-8, 200: 2.2e-8}}
      reading_time: {from: $sense.nplc, table: {0.001: 0.00102, 0.002: 0.00104, 0.006: 0.00112, 0.02: 0.0014, 0.06: 0.0022, 0.2: 0.005, 1: 0.021, 2: 0.041, 10: 0.201, 20: 0.401, 100: 2.001, 200: 4.001}}
  # 扫描表：列表、次数与间隔；由触发模型逐点采样，读数带 CHAN 字段。
  - name: scan
    type: scan_table
    params:
      mux: mux
      dmm: meter
      backplane: bp
      list: $scan.list
      count: $scan.count
      interval: $scan.interval
      ascending: true
      channel_settings:
        function: sense.function
        range: sense.range
        res_range: sense.res.range
        curr_range: sense.curr.range
        range_auto: sense.range_auto
        resolution: sense.resolution
        nplc: sense.nplc
        imp_auto: sense.imp_auto
      function_setting: function
  # 读数存储器：INITiate 与 READ? 都存入（READ? = INITiate + FETCh?，p.30）。
  - name: mem
    type: reading_buffer
    params:
      capacity: 100000
      when_full: overwrite
  # INITiate/READ?/FETCh?/DATA 的触发模型：读数写入存储器。
  - name: st
    type: trigger_model
    params:
      sampler: scan
      source: {from: $trigger.source, map: {IMMediate: immediate, TIMer: immediate, BUS: bus, EXTernal: external}}
      buffer: mem
      fetch_from_buffer: true
      waiting_error: -230
commands:
  # ---- 通道与继电器（ROUTe 子系统）-----------------------------------------------
  - header: "ROUTe:CLOSe"
    op: mux.close
    params: [{name: channels, type: channel_list}]
  - header: "ROUTe:OPEN"
    op: mux.open
    query: false
    params: [{name: channels, type: channel_list}]
  # 扫描表的查询按定长块返回，空表为 #13(@)（ROUTe:SCAN，#415）。
  - header: "ROUTe:SCAN"
    state: scan.list
    reply: "{value_block}"
  # 继电器动作在命令执行时完成，ROUT:DONE? 总回 1。
  - header: "ROUTe:DONE"
    state: route.done
    set: false
  # ---- 触发（TRIGger 子系统）：触发次数即扫描次数；TIMer 源按间隔扫描（间隔不计入虚拟时间）---------
  - header: "TRIGger:SOURce"
    state: trigger.source
  - header: "TRIGger:COUNt"
    state: scan.count
  - header: "TRIGger:TIMer"
    state: scan.interval
  # ---- CONFigure / MEASure：命令头选功能，量程参数关闭自动量程，通道列表整表写进扫描表（重定义扫描表），
  #      触发次数设 1、间隔设 1 s（TRIGger:TIMer 的说明）；MEASure? 再按扫描表跑一次（同 READ?）。
  #      功能、量程与分辨率写进每个通道自己的配置（ch.*），扫描到该通道时装入内部 DMM。量程 MIN/MAX 是
  #      手册量程表的两端（DCV/ACV 100 mV–300 V，电阻 100 Ω–1 GΩ，DCI 1 µA–1 A，ACI 100 µA–1 A），
  #      分辨率 MIN/MAX 选 NPLC 表的两端（200 / 0.001 PLC），DEF 为 1 PLC。
  - header: "CONFigure[:VOLTage]:DC"
    query: false
    writes: {ch.function: VOLT, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure[:VOLTage]:DC"
    op: st.read
    set: false
    writes: {ch.function: VOLT, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure[:VOLTage]:AC"
    query: false
    writes: {ch.function: "VOLT:AC", ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure[:VOLTage]:AC"
    op: st.read
    set: false
    writes: {ch.function: "VOLT:AC", ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: V, optional: true, state: ch.range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.range: 0.1, ch.range_auto: false}, MAX: {ch.range: 300.0, ch.range_auto: false}, DEF: {ch.range: 0.0}}}
      - {name: resolution, type: float, unit: V, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure:RESistance"
    query: false
    writes: {ch.function: RES, ch.res_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: OHM, optional: true, state: ch.res_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.res_range: 100.0, ch.range_auto: false}, MAX: {ch.res_range: 1.0e9, ch.range_auto: false}, DEF: {ch.res_range: 0.0}}}
      - {name: resolution, type: float, unit: OHM, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure:RESistance"
    op: st.read
    set: false
    writes: {ch.function: RES, ch.res_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: OHM, optional: true, state: ch.res_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.res_range: 100.0, ch.range_auto: false}, MAX: {ch.res_range: 1.0e9, ch.range_auto: false}, DEF: {ch.res_range: 0.0}}}
      - {name: resolution, type: float, unit: OHM, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure:FRESistance"
    query: false
    writes: {ch.function: FRES, ch.res_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: OHM, optional: true, state: ch.res_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.res_range: 100.0, ch.range_auto: false}, MAX: {ch.res_range: 1.0e9, ch.range_auto: false}, DEF: {ch.res_range: 0.0}}}
      - {name: resolution, type: float, unit: OHM, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure:FRESistance"
    op: st.read
    set: false
    writes: {ch.function: FRES, ch.res_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: OHM, optional: true, state: ch.res_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.res_range: 100.0, ch.range_auto: false}, MAX: {ch.res_range: 1.0e9, ch.range_auto: false}, DEF: {ch.res_range: 0.0}}}
      - {name: resolution, type: float, unit: OHM, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure:CURRent:DC"
    query: false
    writes: {ch.function: CURR, ch.curr_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: A, optional: true, state: ch.curr_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.curr_range: 1.0e-6, ch.range_auto: false}, MAX: {ch.curr_range: 1.0, ch.range_auto: false}, DEF: {ch.curr_range: 0.0}}}
      - {name: resolution, type: float, unit: A, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure:CURRent:DC"
    op: st.read
    set: false
    writes: {ch.function: CURR, ch.curr_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: A, optional: true, state: ch.curr_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.curr_range: 1.0e-6, ch.range_auto: false}, MAX: {ch.curr_range: 1.0, ch.range_auto: false}, DEF: {ch.curr_range: 0.0}}}
      - {name: resolution, type: float, unit: A, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "CONFigure:CURRent:AC"
    query: false
    writes: {ch.function: "CURR:AC", ch.curr_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    params:
      - {name: range, type: float, unit: A, optional: true, state: ch.curr_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.curr_range: 1.0e-4, ch.range_auto: false}, MAX: {ch.curr_range: 1.0, ch.range_auto: false}, DEF: {ch.curr_range: 0.0}}}
      - {name: resolution, type: float, unit: A, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  - header: "MEASure:CURRent:AC"
    op: st.read
    set: false
    writes: {ch.function: "CURR:AC", ch.curr_range: 0.0, ch.range_auto: true, scan.count: 1, scan.interval: 1.0}
    args: {elements: [READ]}
    params:
      - {name: range, type: float, unit: A, optional: true, state: ch.curr_range, sets: {ch.range_auto: false}, keywords: {MIN: {ch.curr_range: 1.0e-4, ch.range_auto: false}, MAX: {ch.curr_range: 1.0, ch.range_auto: false}, DEF: {ch.curr_range: 0.0}}}
      - {name: resolution, type: float, unit: A, optional: true, state: ch.resolution, keywords: {MIN: {ch.resolution: 0.0, ch.nplc: 200.0}, MAX: {ch.resolution: 0.0, ch.nplc: 0.001}, DEF: {ch.resolution: 0.0, ch.nplc: 1.0}}}
      - {name: channels, type: channel_list, state: scan.list}
  # CONFigure? (@list)：每个通道一段带引号的「功能 量程,分辨率」，按列表顺序以逗号连接。
  - header: "CONFigure"
    op: scan.configuration
    set: false
    params: [{name: channels, type: channel_list}]
  # ---- 测量配置（SENSe 子系统，按通道保存）-------------------------------------------
  - header: "[:SENSe]:VOLTage[:DC]:NPLCycles"
    params:
      - {name: nplc, type: float, min: 0.001, max: 200.0, state: ch.nplc}
      - {name: channels, type: channel_list, optional: true, default: $scan.list}
  - header: "[:SENSe]:VOLTage:DC:RANGe"
    params:
      - {name: range, type: float, unit: V, state: ch.range, sets: {ch.range_auto: false}}
      - {name: channels, type: channel_list}
  - header: "[:SENSe]:VOLTage:DC:RANGe:AUTO"
    params:
      - {name: auto, type: bool, state: ch.range_auto}
      - {name: channels, type: channel_list}
  - header: "[:SENSe]:VOLTage[:DC]:IMPedance:AUTO"
    params:
      - {name: auto, type: bool, state: ch.imp_auto}
      - {name: channels, type: channel_list}
  - header: "[:SENSe]:RESistance:NPLCycles"
    params:
      - {name: nplc, type: float, min: 0.001, max: 200.0, state: ch.nplc}
      - {name: channels, type: channel_list, optional: true, default: $scan.list}
  - header: "[:SENSe]:RESistance:RANGe"
    params:
      - {name: range, type: float, unit: OHM, state: ch.res_range, sets: {ch.range_auto: false}}
      - {name: channels, type: channel_list}
  - header: "[:SENSe]:CURRent[:DC]:NPLCycles"
    params:
      - {name: nplc, type: float, min: 0.001, max: 200.0, state: ch.nplc}
      - {name: channels, type: channel_list, optional: true, default: $scan.list}
  # ---- 读数（INITiate/READ?/FETCh?、读数存储器）-------------------------------------
  - header: "READ"
    op: st.read
    set: false
    args: {elements: [READ]}
  - header: "FETCh"
    op: st.fetch
    set: false
    args: {elements: [READ]}
  - header: "INITiate[:IMMediate]"
    op: st.initiate
    query: false
  - header: "ABORt"
    op: st.abort
    query: false
  - header: "DATA:POINts"
    op: mem.points
    set: false
  - header: "DATA:REMove"
    op: mem.remove
    set: false
    params:
      - {name: count, type: int, min: 1, max: 100000}
      - {name: wait, type: enum, options: [WAIT], optional: true}
  # R? [<max>]：取出并清除最旧的读数，定长块返回（无读数为 #10）。
  - header: "R"
    op: mem.read_clear
    set: false
    params: [{name: count, type: int, min: 1, max: 100000, optional: true}]
  # ---- 显示与版本（接受：保存并回读，不影响读数）----------------------------------------
  - header: "DISPlay[:STATe]"
    state: display.state
  - header: "DISPlay:TEXT"
    state: display.text
  - header: "DISPlay:TEXT:CLEar"
    state: display.text
    set_value: ""
    query: false
  - header: "SYSTem:VERSion"
    state: system.version
    set: false
    reply: "1994.0"
