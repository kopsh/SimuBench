    level: implemented
    note: '#8 block; BYTE codes over the eight screen divisions (32 per division) with 0 for a hole and 1 and 255 for clipped at the bottom and the top (the guide); WORD codes left-shifted to 16 bits; ASCii values with 6 decimals (a SimuBench choice)'
