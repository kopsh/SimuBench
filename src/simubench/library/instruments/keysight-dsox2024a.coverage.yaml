    level: implemented
  - header: '*ESR'
    level: implemented
  - header: '*IDN'
    level: implemented
    note: 'AGILENT TECHNOLOGIES,DSO-X 2024A,<serial>,<software revision> as the guide writes it; serial MY58260001 and revision 02.66.0000 are SimuBench values'
  - header: '*LRN'
    level: not_modeled
  - header: '*OPC'
    level: implemented
    note: '*OPC? waits for a :DIGitize or :SINGle in progress; without a trigger it does not answer (the guide: use device clear to halt a :DIGitize)'
