    level: not_modeled
  - header: '*RCL'
    level: not_modeled
  - header: '*RST'
    level: implemented
    note: 'the guide''s reset conditions (CH1 on at 5 V/div with the 10:1 probe, offset 0, DC, 100 us/div, centre reference, edge trigger on CH1 at 0 V rising, AUTO, holdoff 40 ns, NORMal acquisition with 8 averages, BYTE unsigned MSBFirst 1000 points). The guide''s :TRIGger? sample after *RST shows HOLD 60 ns; the reset table''s 40 ns is used'
