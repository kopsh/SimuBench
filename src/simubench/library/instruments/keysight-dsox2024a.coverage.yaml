- section: :ACQuire Commands (Programmer's Guide 02.66, ch. 7)
  commands:
  - header: :ACQuire:COMPlete
    level: implemented
    note: '100 only, as the guide says'
  - header: :ACQuire:COUNt
    level: implemented
    note: '2 to 65536; averaging divides the noise by the square root of the count. An acquisition whose count x record samples is beyond 2^28 (more than 2683 averages of the 100 000-point record) is a deep record (#1012, real-models.md 10): it is taken, and a read may ask for at most 2^28 samples (points read x count); reading the whole record or measuring on it is then -221, Settings conflict (until #1012 the acquisition itself was refused, #986)'
  - header: :ACQuire:MODE
    level: implemented
    note: 'RTIMe, or SEGMented: one :SINGle or :DIGitize takes :ACQuire:SEGMented:COUNt records, each on its own trigger (#957). ETIMe is not on this model'
  - header: :ACQuire:POINts
    level: implemented
    note: 'the record length: 100 kpts (standard memory, data sheet), computed whole when acquired (real-models.md 10)'
  - header: :ACQuire:SEGMented:ANALyze
    level: accepted
    note: 'accepted; measurement statistics and infinite persistence over all segments are not modeled: a measurement reads the segment :ACQuire:SEGMented:INDex selects'
    affects_data: false
  - header: :ACQuire:SEGMented:COUNt
    level: implemented
    note: '2 to 25 (2 after *RST, the guide''s :ACQuire? sample). With :ACQuire:MODE SEGMented a :SINGle or :DIGitize is done when the last segment''s record is full; the trigger is armed for the next segment 19 us after a record is full (data sheet 5990-6618EN p. 18: re-arm time 19 us, the minimum time between trigger events; #1005). Every segment is a whole 100 kpts record (on the instrument the points per segment fall with the count: not modeled); the model''s memory is 25 x 100 kpts, so the count range (2 to 25, beyond it -222) is the only limit and the memory-full -221 does not occur on this model. AVERage is not available in segmented mode (guide :ACQuire:TYPE, p. 215): see :ACQuire:TYPE. A segment whose trigger does not come keeps the acquisition waiting (AUTO sweep: taken untriggered after the auto timeout)'
  - header: :ACQuire:SEGMented:INDex
    level: implemented
    note: 'selects the segment that :WAVeform and :MEASure read, 1 to the segment count (beyond it: -222); with :ACQuire:MODE RTIMe only 1'
  - header: :ACQuire:SRATe
    level: implemented
    note: 'min(2 GSa/s, 1 GSa/s with both channels of a pair on, 100 kpts / 10 div) on a 1-2-5 ladder (data sheet); reply digits are a SimuBench choice (the guide shows none)'
  - header: :ACQuire:TYPE
    level: implemented
    note: 'NORMal; AVERage,count is the mean of count quantized acquisitions; PEAK examines each record interval at up to 64 samples (64 x the record rate when the ADC is faster, capped there) and keeps the extreme that departs farther from the interval ends, so a signal the record rate steps over shows (a pulse narrower than the record interval / 64 is not guaranteed to be kept when the cap applies); HRESolution is a boxcar of 8 codes (4^1.5, a SimuBench value: the guide only says slower sweeps average more). AVERage is not available in segmented mode (guide p. 215; #1013): :ACQuire:TYPE AVERage with :ACQuire:MODE SEGMented, and :ACQuire:MODE SEGMented with AVERage, answer -221 and change neither setting (the error code, and refusing rather than switching TYPE back to NORMal, are SimuBench assumptions: the guide only says not available)'
  - header: :ACQuire
    level: implemented
    note: 'the setup query of the chapter''s Reporting the Setup: the guide''s *RST sample ":ACQ:MODE RTIM;TYPE NORM;COMP 100;COUNT 8;SEGM:COUN 2"; SEGM:COUN is :ACQuire:SEGMented:COUNt'
