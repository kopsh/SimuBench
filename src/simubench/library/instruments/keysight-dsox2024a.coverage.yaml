- section: :MEASure Commands (Programmer's Guide 02.66, ch. 20)
  commands:
  - header: :MEASure:ALL
    level: implemented
    note: 'a snapshot of 19 single-source measurements on one source (VPP, VMAX, VMIN, VAMPlitude, VTOP, VBASe, OVERshoot, PREShoot, VAVerage, VRMS, PERiod, FREQuency, RISetime, FALLtime, PWIDth, NWIDth, DUTYcycle, NDUTy, BRATe); the order is the model choice, nothing is installed (#373)'
  - header: :MEASure:BRATe
    level: implemented
    note: '1 / the narrowest pulse (positive or negative) at the middle level (#350)'
  - header: :MEASure:CLEar
    level: implemented
    note: 'empties the screen list and its statistics (#373)'
  - header: :MEASure:DEFine
    level: not_modeled
    note: 'Model work: the measurement values exist; DEFINE adds a named expression over them.'
    gap: model_work
  - header: :MEASure:DELay
    level: implemented
    note: 'first rising edge of source 1 to the first rising edge of source 2 at their middle levels; without sources the two of :MEASure:SOURce. :MEASure:DEFine DELay edges are not modeled (#350)'
  - header: :MEASure:DUTYcycle
    level: implemented
    note: 'positive width over the period, percent, of the first full cycle (#248); query only'
  - header: :MEASure:FALLtime
    level: implemented
    note: '90 %–10 % of the first complete falling edge on the record (#248); query only'
  - header: :MEASure:FREQuency
    level: implemented
    note: 'on the whole record (the guide: the cycle closest to the trigger); query only, the command form is not modeled; unmeasurable: +9.9E+37'
  - header: :MEASure:NDUTy
    level: implemented
    note: 'negative width over the period, percent, of the first full cycle (#248); query only'
  - header: :MEASure:NEDGes
    level: implemented
    note: 'falling edges across the middle level on the record (#248); query only'
  - header: :MEASure:NPULses
    level: implemented
    note: 'negative pulses on the record (#248); query only'
  - header: :MEASure:NWIDth
    level: implemented
    note: 'the first negative pulse''s width at the middle level (#248); query only'
  - header: :MEASure:OVERshoot
    level: implemented
    note: '(VMAX − VTOP) / (VTOP − VBASe), percent, over the record (#248); query only'
  - header: :MEASure:PEDGes
    level: implemented
    note: 'rising edges across the middle level on the record (#248); query only'
  - header: :MEASure:PERiod
    level: implemented
    note: 'as :MEASure:FREQuency'
  - header: :MEASure:PHASe
    level: implemented
    note: 'the DELay over the period of source 1, in degrees (#350)'
  - header: :MEASure:PPULses
    level: implemented
    note: 'positive pulses on the record (#248); query only'
  - header: :MEASure:PREShoot
    level: implemented
    note: '(VBASe − VMIN) / (VTOP − VBASe), percent, over the record (#248); query only'
  - header: :MEASure:PWIDth
    level: implemented
    note: 'the first positive pulse''s width at the middle level (#248); query only'
  - header: :MEASure:RESults
    level: implemented
    note: 'the screen list, oldest first: <name>(<channel>),current,min,max,mean,std dev,count per measurement; a measurement command without ? installs one, up to 4 (a fifth drops the oldest). The label wording and :MEASure:STATistics are not modeled (the statistics are always on) (#373)'
  - header: :MEASure:RISetime
    level: implemented
    note: '10 %–90 % of the first complete rising edge on the record (#248); query only'
  - header: :MEASure:SHOW
    level: accepted
    note: 'kept and read back; the screen markers are not drawn (#373)'
    affects_data: false
  - header: :MEASure:SOURce
    level: implemented
    note: 'CHANnel1 to CHANnel4 (FUNCtion, MATH, WMEMory not modeled)'
  - header: :MEASure:TEDGe
    level: implemented
    note: 'time of the <slope><occurrence> edge at the middle level, counted from the left of the record (#350)'
  - header: :MEASure:TVALue
    level: implemented
    note: 'time the record crosses <value> with <slope><occurrence>, counted from the left of the record (#350)'
  - header: :MEASure:VAMPlitude
    level: implemented
    note: 'top minus base from the record''s histogram; query only'
  - header: :MEASure:VAVerage
    level: implemented
    note: 'on the whole record (<interval> CYCLe is taken as DISPlay); query only'
  - header: :MEASure:VBASe
    level: implemented
    note: 'the base level from the record''s histogram (#248); query only'
  - header: :MEASure:VMAX
    level: implemented
    note: 'query only'
  - header: :MEASure:VMIN
    level: implemented
    note: 'query only'
  - header: :MEASure:VPP
    level: implemented
    note: 'query only'
  - header: :MEASure:VRMS
    level: implemented
    note: 'DC RMS on the whole record (<interval> and <type> AC are taken as DISPlay, DC); query only'
  - header: :MEASure:VTIMe
    level: implemented
    note: 'voltage at a time from the trigger, linear between samples; outside the record 9.9E+37 (#350)'
  - header: :MEASure:VTOP
    level: implemented
    note: 'the top level from the record''s histogram (#248); query only'
  - header: :MEASure:WINDow
    level: accepted
    note: 'MAIN, ZOOM, AUTO kept and read back; measurements are taken on the main record, there is no zoom record (#373)'
    affects_data: false
  - header: :MEASure:XMAX
    level: implemented
    note: 'time of the first maximum, from the trigger (#350)'
  - header: :MEASure:XMIN
    level: implemented
    note: 'time of the first minimum, from the trigger (#350)'
