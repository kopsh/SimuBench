- section: :SYSTem Commands (Programmer's Guide 02.66, ch. 27)
  commands:
  - header: :SYSTem:DATE
    level: not_modeled
    note: 'the scope''s real-time clock is not simulated (only virtual time); the date is not stored'
    gap: out_of_scope
  - header: :SYSTem:DIDentifier
    level: implemented
    note: 'the quoted host ID; the guide''s example is "<model>,<serial>,<host id>" and calls the content product-specific: "DSO-X 2024A,MY58260001,SIMUBENCH2024A" is a SimuBench value'
  - header: :SYSTem:DSP
    level: accepted
    affects_data: false
    note: 'the text written to the middle of the display; parsed and stored, no display shows it (the guide has no query; the 75-character limit is not enforced)'
  - header: :SYSTem:ERRor[:NEXT]
    level: implemented
    note: 'the error queue (30 deep, the guide); the guide''s sample replies write the code with a sign, e.g. +0,"No error"'
  - header: :SYSTem:LOCK
    level: accepted
    affects_data: false
    note: 'front-panel lock (the interface state); parsed, stored and read back, nothing in the simulation is locked. The guide gives no *RST value: OFF is the SimuBench default'
  - header: :SYSTem:MENU
    level: accepted
    affects_data: false
    note: 'the front-panel softkey menu; parsed and stored, no display shows it (the guide gives no query and no *RST value: MEASure is the SimuBench default)'
  - header: :SYSTem:PRESet
    level: implemented
    note: 'the same reset conditions as *RST (the guide''s PRESet list matches the *RST table; only preferences remain, and SimuBench has none), and it makes the scope run again'
  - header: :SYSTem:PROTection:LOCK
    level: accepted
    affects_data: false
    note: 'locks the 50 ohm impedance setting; this model only has 1 MOhm (:CHANnel<n>:IMPedance takes ONEMeg), so it is stored and read back only. The guide gives no *RST value: OFF is the SimuBench default'
  - header: :SYSTem:RLOGger
    level: not_modeled
    note: 'remote command logging needs a log file or the screen; not modeled, and its settings (the :RLOGger sub-commands below) are not stored'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:DESTination
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:DISPlay
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:FNAMe
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:STATe
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:TRANsparent
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:RLOGger:WMODe
    level: not_modeled
    note: 'as :SYSTem:RLOGger'
    gap: blocked
    blocked_by: file-system
  - header: :SYSTem:SETup
    level: not_modeled
    note: 'Capability gap (not in product-plan.md 4.2): the setup (learn) block; setup_memory component (#1070), not wired in this model.'
    gap: blocked
    blocked_by: setup-memory
  - header: :SYSTem:TIME
    level: not_modeled
    note: 'as :SYSTem:DATE: no real-time clock is simulated'
    gap: out_of_scope
- section: :TIMebase Commands (Programmer's Guide 02.66, ch. 28)
  commands:
  - header: :TIMebase:MODE
    level: implemented
    note: 'stored; WINDow, XY and ROLL are not modeled'
  - header: :TIMebase:POSition
    level: implemented
    note: 'time from the trigger to the reference; its limits (the data sheet''s pre- and post-trigger ranges) are not checked'
  - header: :TIMebase:RANGe
    level: implemented
    note: 'ten divisions of :SCALe'
  - header: :TIMebase:REFerence
    level: implemented
    note: 'LEFT and RIGHt are one division from the edge (the guide)'
  - header: :TIMebase:SCALe
    level: implemented
    note: '2 ns/div to 50 s/div (data sheet)'
  - header: :TIMebase:VERNier
    level: accepted
    affects_data: false
    note: 'the time base knob''s fine adjustment; stored and read back, the SCPI-set :TIMebase:SCALe is unchanged. Off after *RST and :SYSTem:PRESet (the guide''s reset tables)'
  - header: :TIMebase:WINDow:POSition
    level: accepted
    affects_data: false
    note: 'the zoomed (delayed) time base is not modeled: stored and read back, the main time base and the acquisition are unchanged. 0 s after *RST (the guide''s reset table); the -500 s to 500 s limit is the main position''s (a SimuBench choice: the guide only says the zoomed window must stay within the main sweep, which is not checked)'
  - header: :TIMebase:WINDow:RANGe
    level: accepted
    affects_data: false
    note: 'ten divisions of :TIMebase:WINDow:SCALe (the guide); as :TIMebase:WINDow:POSition. 5 us after *RST (500 ns/div, the guide''s reset table)'
  - header: :TIMebase:WINDow:SCALe
    level: accepted
    affects_data: false
    note: 'the zoomed (delayed) time base is not modeled: stored and read back, the main time base and the acquisition are unchanged. 500 ns/div after *RST (the guide''s reset table); 2 ns/div to 25 s/div is a SimuBench choice (the guide''s rule, half of the current :TIMebase:SCALe, is not checked)'
- section: :TRIGger Commands (Programmer's Guide 02.66, ch. 29)
  commands:
  - header: :TRIGger:FORCe
    level: implemented
    note: 'takes one frame whatever the trigger condition (the acquisition component''s force_trigger); it does not stop a running acquisition and does not arm a single one'
  - header: :TRIGger:HFReject
    level: implemented
    note: 'a 50 kHz low-pass in the trigger path (the guide)'
  - header: :TRIGger:HOLDoff
    level: implemented
    note: '40 ns to 10 s (the guide)'
  - header: :TRIGger:LEVel:ASETup
    level: implemented
    note: 'the edge level of each displayed channel to the 50 % of its waveform (top/base), 0 V with AC coupling (#350)'
  - header: :TRIGger:LEVel:HIGH
    level: accepted
    note: 'kept per source and read back; the runt and transition triggers that use it are not modeled (#350)'
    affects_data: false
  - header: :TRIGger:LEVel:LOW
    level: accepted
    note: 'kept per source and read back; the runt and transition triggers that use it are not modeled (#350)'
    affects_data: false
  - header: :TRIGger:MODE
    level: implemented
    note: 'EDGE and GLITch (pulse width, #956); the other trigger types answer -224'
  - header: :TRIGger:NREJect
    level: implemented
    note: 'widens the trigger hysteresis from 0.3 div (half the data sheet''s 0.6 div sensitivity) to 1 div (an assumed width)'
  - header: :TRIGger:SWEep
