  - header: :TRIGger[:EDGE]:COUPling
    level: implemented
    note: 'AC: 10 Hz high-pass; LFReject: 50 kHz high-pass (the guide). The coupling with :REJect is not modeled: each keeps its own value'
  - header: :TRIGger[:EDGE]:LEVel
    level: implemented
    note: 'within ±0.75 full scale (6 div) of the source''s centre screen; each source (CHANnel1–4, EXTernal) keeps its own level and the optional <source> names it (#248); without it the current trigger source'
  - header: :TRIGger[:EDGE]:REJect
    level: implemented
    note: 'LFReject: 50 kHz high-pass; HFReject: 50 kHz low-pass (the guide)'
  - header: :TRIGger[:EDGE]:SLOPe
    level: implemented
    note: 'EITHer and ALTernate trigger on either edge'
  - header: :TRIGger[:EDGE]:SOURce
    level: implemented
    note: 'CHANnel1 to 4, EXTernal (the EXT input), LINE (50 Hz); WGEN never triggers (no generator); NONE when all channels are off is not modeled'
  - header: :TRIGger:GLITch:GREaterthan
    level: implemented
    note: 'the time a GREaterthan pulse must exceed, and the lower bound of RANGe; 10 ns to 9.99 s as in the guide (:TRIGger:GLITch:RANGe, p. 690; #1001); 20 ns after *RST is a SimuBench assumption (not checked against the guide)'
  - header: :TRIGger:GLITch:LESSthan
    level: implemented
    note: 'the time a LESSthan pulse stays under, and the upper bound of RANGe; 15 ns to 10 s as in the guide (:TRIGger:GLITch:RANGe, p. 690; #1001), outside answers -222; 30 ns after *RST is a SimuBench assumption (not checked against the guide)'
  - header: :TRIGger:GLITch:LEVel
    level: implemented
    note: 'the same per-source level as :TRIGger[:EDGE]:LEVel, with its optional <source>'
  - header: :TRIGger:GLITch:POLarity
    level: implemented
    note: 'POSitive: the pulse above the level; NEGative: below it'
  - header: :TRIGger:GLITch:QUALifier
    level: implemented
    note: 'LESSthan and RANGe trigger at the edge that ends the pulse, GREaterthan at the instant the pulse has lasted the time (it need not have ended); a pulse that began before the trigger was armed (pre-trigger time, holdoff) does not count. LESSthan after *RST is a SimuBench assumption'
  - header: :TRIGger:GLITch:RANGe
    level: implemented
    note: '<less_than_time>,<greater_than_time> in any order, as in the guide (p. 690; #1001): the larger value becomes :LESSthan, the smaller :GREaterthan; each range is checked after sorting; the query answers the less-than time first'
  - header: :TRIGger:GLITch:SOURce
    level: implemented
    note: 'the same setting as :TRIGger[:EDGE]:SOURce; LINE and WGEN never give a pulse-width trigger; digital channels are not modeled'
  - header: :TRIGger:OR
    level: not_modeled
    note: 'Blocked by C8 (product-plan.md 4.2): the OR''ed edge trigger over several channels is part of the wider trigger family.'
    gap: blocked
    blocked_by: C8
