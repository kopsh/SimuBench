schema: simubench.instrument/2
id: keysight-b2912b
manufacturer: Keysight Technologies
model: B2912B
extends: keysight-b2901a
class: smu
version: 1
description: Keysight B2912B 双通道精密源/测量单元（B2900B 系列高性能型，210 V、3.03 A 直流，10 fA 分辨率；常用命令子集）。Real model（D42）：命令、参数、默认值与回复按
  B2900B/BL Series SCPI Command Reference（B2910-90130, Edition 2, May 2023）；与 B2901A 同一命令体系，每个通道一条完整的 SMU 链（#382），命令用
  [c] 数字后缀（:SOUR2:VOLT）与通道列表（:MEAS:CURR? (@1,2)）。源电压/电流、限值与四线检测进入电路求解；源量程与测量量程按 Table 2-4/2-7/2-9/2-10（含 B2911B/B2912B
  独有的 10 nA 档）。脉冲、列表/对数扫描、两通道合用电流限制（Table 2-6）、程序内存、数字 I/O 与显示/接口以外的高级功能不在本定义范围（覆盖表逐条列出）。
reference:
  title: Keysight B2900B/BL Series Precision Source/Measure Unit SCPI Command Reference
  document: B2910-90130
  version: Edition 2, May 2023
  firmware: B2900B 系列（B2911B/B2912B 的量程按手册 Table 2-4、2-7、2-9、2-10）
identity:
  idn: Keysight Technologies,B2912B,{serial},{firmware}
  serial: MY63000101
  firmware: 5.0.2051.2800
specs:
  compliance_default: null
  current_source_max_voltage_v: null
  nplc: null
  reading_memory: null
  source: SCPI Command Reference Tables 2-4、2-6、2-7、2-9、2-10（B2910-90130, Edition 2）
  current_source_ranges_a:
  - 1.0e-08
  - 1.0e-07
  - 1.0e-06
  - 1.0e-05
  - 0.0001
  - 0.001
  - 0.01
  - 0.1
  - 1.0
  - 1.5
  - 3.0
  voltage_source_setting_resolution_v:
    0.2: 1.0e-07
    2.0: 1.0e-06
    20.0: 1.0e-05
    200.0: 0.0001
  current_source_setting_resolution_a: 10 fA（10 nA 档）… 10 µA（3 A 档）
  measurement_resolution: 电压 0.1 µV（0.2 V 档）…100 µV（200 V 档）；电流 10 fA（10 nA 档）…10 µA（3 A 档）
  noise_ppm_of_range: >-
    7.5 ppm of range（估计，#744/D46）：B2912B 数据手册的测量准确度表与 B2900A 系列逐格相同
    （1 PLC，偏移项/量程 150–2333 ppm），取最小比值——10 µA 档 150 ppm——的 1/20，#748 界限
    σ ≤ 限值/20 在全部电压/电流量程成立；ref_time_s 0.02 s（一个 50 Hz PLC），随 NPLC 的
    reading_time 按平方根下降。
  two_channel_current_limit: Table 2-6：|V1|、|V2| ≤ 6 V 时 I1 + I2 ≤ 4 A 等（未建模，每通道各自按自己的包络）
  pulse: 10.5 A 脉冲档与脉冲输出未建模
state:
  # 单通道 b2901a 的仪器级状态在本型号移到 channel_state(每通道一份):`null` 丢弃继承来的键(D59)
  compliance.current.limit: null
  compliance.voltage.limit: null
  output.enabled: null
  sense.nplc: null
  sense.range_auto: null
  sense.range_current: null
  sense.range_voltage: null
  sense.remote: null
  source.autorange_current: null
  source.autorange_voltage: null
  source.current.level: null
  source.function: null
  source.range_current: null
  source.range_voltage: null
  source.shape: null
  source.voltage.level: null
  sweep.mode: null
  sweep.points: null
  sweep.start: null
  sweep.stop: null
  trigger.count: null
  trigger.delay: null
  trigger.source: null
  display.view:
    type: enum
    options:
    - SINGle1
    - SINGle2
    - DUAL
    - GRAPh
    - ROLL
    default: DUAL
    label: 显示视图
    label_en: Display view
    option_labels:
      SINGle1: 通道 1
      SINGle2: 通道 2
      DUAL: 双通道
      GRAPh: 图形
      ROLL: 滚动
ports:
  instrument: null  # b2901a 的仪器级端口;本型号的端口按通道
  channel:
    HI{n}: out.hi
    LO{n}: out.lo
    SENSE_HI{n}: out.sense_hi
    SENSE_LO{n}: out.sense_lo
display:
  summary:
  - ch1.source.function
  - ch1.source.voltage.level
  - ch1.output.enabled
  - ch2.source.function
  - ch2.source.voltage.level
  - ch2.output.enabled
  # 检查器面板（D74）与 SMU 屏幕共用（#1469）：每个通道的设置在 channel_groups，随源功能：电压源放电压
  # 设定与电流限，电流源放电流设定与电压限；扫描参数随扫描模式（SWEep 与 LIST）。其余设置在检查器里
  # 查找或在“全部设置”里改，SMU 屏幕的“其他设置”框列出的也是面板分组之外的这些。
  panel:
    groups: []  # 本型号的设置都按通道；不沿用 b2901a 的整机分组
    channel_groups:
      - label: 源
        label_en: Source
        controls:
          - {state: source.function}
          - {state: source.voltage.level, when: {source.function: VOLTage}}
          - {state: source.autorange_voltage, when: {source.function: VOLTage}}
          - {state: source.range_voltage, when: {source.function: VOLTage, source.autorange_voltage: false}}
          - {state: compliance.current.limit, when: {source.function: VOLTage}}
          - {state: source.current.level, when: {source.function: CURRent}}
          - {state: source.autorange_current, when: {source.function: CURRent}}
          - {state: source.range_current, when: {source.function: CURRent, source.autorange_current: false}}
          - {state: compliance.voltage.limit, when: {source.function: CURRent}}
          - {state: output.enabled}
      - label: 扫描
        label_en: Sweep
        controls:
          - {state: sweep.mode}
          - {state: sweep.cmode}
          - {state: sweep.start, when: {sweep.mode: SWEep}}
          - {state: sweep.stop, when: {sweep.mode: SWEep}}
          - {state: sweep.cstart, when: {sweep.cmode: SWEep}}
          - {state: sweep.cstop, when: {sweep.cmode: SWEep}}
          - {state: sweep.points, when: {sweep.mode: SWEep}}
          - {state: sweep.spacing, when: {sweep.mode: SWEep}}
          - {state: sweep.direction, when: {sweep.mode: SWEep}}
          - {state: sweep.stair, when: {sweep.mode: SWEep}}
          - {state: sweep.ranging, when: {sweep.mode: SWEep}}
          - {state: list.voltage, when: {sweep.mode: LIST}}
          - {state: list.vstart, when: {sweep.mode: LIST}}
          - {state: list.current, when: {sweep.cmode: LIST}}
          - {state: list.cstart, when: {sweep.cmode: LIST}}
      - label: 测量
        label_en: Measure
        controls:
          - {state: sense.nplc}
          - {state: sense.range_auto}
          - {state: sense.range_voltage, when: {sense.range_auto: false}}
          - {state: sense.range_current, when: {sense.range_auto: false}}
          - {state: sense.remote}
          - {state: sense.func.voltage}
          - {state: sense.func.current}
          - {state: sense.func.resistance}
      - label: 触发
        label_en: Trigger
        controls:
          - {state: trigger.source}
          - {state: trigger.count}
          - {state: trigger.delay}
components: null  # b2901a 的仪器级组件;本型号的组件在 channel_components
commands:
- header: '[:SOURce<ch>]:FUNCtion:MODE'
  state: ch.source.function
- header: '[:SOURce<ch>]:FUNCtion[:SHAPe]'
  state: ch.source.shape
- header: '[:SOURce<ch>]:VOLTage[:LEVel][:IMMediate][:AMPLitude]'
  state: ch.source.voltage.level
- header: '[:SOURce<ch>]:CURRent[:LEVel][:IMMediate][:AMPLitude]'
  state: ch.source.current.level
- header: '[:SOURce<ch>]:VOLTage:RANGe'
  params:
  - name: range
    type: float
    unit: V
    min: 0.2
    max: 200.0
    state: ch.source.range_voltage
  writes:
    ch.source.autorange_voltage: false
- header: '[:SOURce<ch>]:CURRent:RANGe'
  params:
  - name: range
    type: float
    unit: A
    min: 1.0e-07
    max: 3.0
    state: ch.source.range_current
  writes:
    ch.source.autorange_current: false
- header: '[:SOURce<ch>]:VOLTage:RANGe:AUTO'
  state: ch.source.autorange_voltage
- header: '[:SOURce<ch>]:CURRent:RANGe:AUTO'
  state: ch.source.autorange_current
- header: '[:SOURce<ch>]:VOLTage:MODE'
  state: ch.sweep.mode
- header: '[:SOURce<ch>]:VOLTage:STARt'
  state: ch.sweep.start
- header: '[:SOURce<ch>]:VOLTage:STOP'
  state: ch.sweep.stop
- header: '[:SOURce<ch>]:VOLTage:POINts'
  state: ch.sweep.points
- header: '[:SOURce<ch>]:SWEep:POINts'
  state: ch.sweep.points
- header: '[:SOURce<ch>]:CURRent:MODE'
  state: ch.sweep.cmode
- header: '[:SOURce<ch>]:CURRent:STARt'
  state: ch.sweep.cstart
- header: '[:SOURce<ch>]:CURRent:STOP'
  state: ch.sweep.cstop
- header: '[:SOURce<ch>]:CURRent:POINts'
  state: ch.sweep.points
- header: '[:SOURce<ch>]:SWEep:SPACing'
  state: ch.sweep.spacing
- header: '[:SOURce<ch>]:SWEep:DIRection'
  state: ch.sweep.direction
- header: '[:SOURce<ch>]:SWEep:STAir'
  state: ch.sweep.stair
- header: '[:SOURce<ch>]:SWEep:RANGing'
  state: ch.sweep.ranging
- header: '[:SOURce<ch>]:LIST:VOLTage'
  op: ch.source.list
  args: {function: VOLTage}
  params: [{name: values, type: raw, optional: true}]
- header: '[:SOURce<ch>]:LIST:CURRent'
  op: ch.source.list
  args: {function: CURRent}
  params: [{name: values, type: raw, optional: true}]
- header: '[:SOURce<ch>]:LIST:VOLTage:APPend'
  op: ch.source.list_append
  query: false
  args: {function: VOLTage}
  params: [{name: values, type: raw}]
- header: '[:SOURce<ch>]:LIST:CURRent:APPend'
  op: ch.source.list_append
  query: false
  args: {function: CURRent}
  params: [{name: values, type: raw}]
- header: '[:SOURce<ch>]:LIST:VOLTage:POINts'
  op: ch.source.list_points
  set: false
  args: {function: VOLTage}
- header: '[:SOURce<ch>]:LIST:CURRent:POINts'
  op: ch.source.list_points
  set: false
  args: {function: CURRent}
- header: '[:SOURce<ch>]:LIST:VOLTage:STARt'
  state: ch.list.vstart
- header: '[:SOURce<ch>]:LIST:CURRent:STARt'
  state: ch.list.cstart
# 测量功能使能（#397，B2910-90130 p.246–248）：FUNC[:ON] 使能所列功能（其余不变）、FUNC:OFF 关闭；
# 查询回带引号的短格式，无则 ""；*RST 为 "VOLT","CURR" 开、"RES" 关。
- header: :SENSe<ch>:FUNCtion[:ON]
  op: ch.core.function_on
  params: [{name: names, type: raw, optional: true}]
- header: :SENSe<ch>:FUNCtion[:ON]:ALL
  op: ch.core.function_all
  query: false
- header: :SENSe<ch>:FUNCtion[:ON]:COUNt
  op: ch.core.function_count
  set: false
- header: :SENSe<ch>:FUNCtion:OFF
  op: ch.core.function_off
  params: [{name: names, type: raw, optional: true}]
- header: :SENSe<ch>:FUNCtion:OFF:ALL
  op: ch.core.function_all
  query: false
  args: {"on": false}
- header: :SENSe<ch>:FUNCtion:OFF:COUNt
  op: ch.core.function_count
  set: false
  args: {"on": false}
- header: :SENSe<ch>:FUNCtion:STATe
  op: ch.core.function_state
  set: false
  params: [{name: names, type: raw}]
- header: :SENSe<ch>:VOLTage[:DC]:NPLCycles
  state: ch.sense.nplc
- header: :SENSe<ch>:CURRent[:DC]:NPLCycles
  state: ch.sense.nplc
- header: :SENSe<ch>:RESistance:NPLCycles
  state: ch.sense.nplc
- header: :SENSe<ch>:VOLTage[:DC]:RANGe[:UPPer]
  params:
  - name: range
    type: float
    state: ch.sense.range_voltage
  writes:
    ch.sense.range_auto: false
- header: :SENSe<ch>:CURRent[:DC]:RANGe[:UPPer]
  params:
  - name: range
    type: float
    state: ch.sense.range_current
  writes:
    ch.sense.range_auto: false
- header: :SENSe<ch>:VOLTage[:DC]:RANGe:AUTO
  state: ch.sense.range_auto
- header: :SENSe<ch>:CURRent[:DC]:RANGe:AUTO
  state: ch.sense.range_auto
- header: :SENSe<ch>:VOLTage[:DC]:PROTection[:LEVel][:BOTH]
  state: ch.compliance.voltage.limit
- header: :SENSe<ch>:CURRent[:DC]:PROTection[:LEVel][:BOTH]
  state: ch.compliance.current.limit
- header: :SENSe<ch>:VOLTage[:DC]:PROTection:TRIPped
  op: ch.loop.tripped
  set: false
  args:
    kind: voltage
- header: :SENSe<ch>:CURRent[:DC]:PROTection:TRIPped
  op: ch.loop.tripped
  set: false
  args:
    kind: current
- header: :SENSe<ch>:REMote
  state: ch.sense.remote
- header: :MEASure
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements: $format.elements.sense
  params:
  - &id001
    name: channels
    type: channel_list
    optional: true
    default:
    - 1
- header: :MEASure:VOLTage[:DC]
  op: ch.trig.read
  set: false
  args:
    elements:
    - VOLT
  params:
  - *id001
- header: :MEASure:CURRent[:DC]
  op: ch.trig.read
  set: false
  args:
    elements:
    - CURR
  params:
  - *id001
- header: :MEASure:RESistance
  op: ch.trig.read
  set: false
  args:
    elements:
    - RES
  params:
  - *id001
- header: :FETCh:ARRay
  op: ch.trig.fetch
  set: false
  args:
    elements: $format.elements.sense
  params:
  - *id001
- header: :FETCh:ARRay:VOLTage
  op: ch.trig.fetch
  set: false
  args:
    elements:
    - VOLT
  params:
  - *id001
- header: :FETCh:ARRay:CURRent
  op: ch.trig.fetch
  set: false
  args:
    elements:
    - CURR
  params:
  - *id001
- header: :FETCh:ARRay:RESistance
  op: ch.trig.fetch
  set: false
  args:
    elements:
    - RES
  params:
  - *id001
- header: :FETCh:ARRay:TIME
  op: ch.trig.fetch
  set: false
  args:
    elements:
    - TIME
  params:
  - *id001
- header: :FETCh:ARRay:STATus
  op: ch.trig.fetch
  set: false
  args:
    elements:
    - STAT
  params:
  - *id001
- header: :READ:ARRay
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements: $format.elements.sense
  params:
  - *id001
- header: :READ:ARRay:VOLTage
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements:
    - VOLT
  params:
  - *id001
- header: :READ:ARRay:CURRent
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements:
    - CURR
  params:
  - *id001
- header: :READ:ARRay:RESistance
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements:
    - RES
  params:
  - *id001
- header: :READ:ARRay:TIME
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements:
    - TIME
  params:
  - *id001
- header: :READ:ARRay:STATus
  op: ch.trig.read
  set: false
  dangerous: true
  args:
    elements:
    - STAT
  params:
  - *id001
- header: :TRACe<ch>:CLEar
  op: ch.mem.clear
  query: false
- header: :TRACe<ch>:POINts:ACTual
  op: ch.mem.actual
  set: false
- header: :TRACe<ch>:DATA
  op: ch.mem.data
  set: false
  args:
    elements: $format.elements.sense
- header: :TRIGger<ch>[:ALL]:SOURce[:SIGNal]
  state: ch.trigger.source
- header: :TRIGger<ch>:ACQuire:SOURce[:SIGNal]
  state: ch.trigger.source
- header: :TRIGger<ch>:TRANsient:SOURce[:SIGNal]
  state: ch.trigger.source
- header: :TRIGger<ch>[:ALL]:COUNt
  state: ch.trigger.count
- header: :TRIGger<ch>:ACQuire:COUNt
  state: ch.trigger.count
- header: :TRIGger<ch>:TRANsient:COUNt
  state: ch.trigger.count
- header: :TRIGger<ch>[:ALL]:DELay
  state: ch.trigger.delay
- header: :TRIGger<ch>:ACQuire:DELay
  state: ch.trigger.delay
- header: :TRIGger<ch>:TRANsient:DELay
  state: ch.trigger.delay
- header: :INITiate[:IMMediate][:ALL]
  op: ch.trig.initiate
  query: false
  dangerous: true
  params:
  - *id001
- header: :INITiate[:IMMediate]:ACQuire
  op: ch.trig.initiate
  query: false
  dangerous: true
  params:
  - *id001
- header: :ABORt[:ALL]
  op: ch.trig.abort
  query: false
  params:
  - *id001
- header: :ABORt:ACQuire
  op: ch.trig.abort
  query: false
  params:
  - *id001
- header: :OUTPut<ch>[:STATe]
  state: ch.output.enabled
  dangerous: true
- header: :DISPlay:ENABle
  state: display.enabled
- header: :DISPlay:DIGits
  state: display.digits
- header: :DISPlay:VIEW
  state: display.view
- header: :DISPlay:CSET
  state: display.color_set
- header: :DISPlay:ZOOM
  state: display.zoom
- header: :SYSTem:BEEPer:STATe
  state: system.beeper
- header: :SYSTem:FAN:MODE
  state: system.fan
- header: :SYSTem:COMMunicate:GPIB[:SELF]:ADDRess
  state: system.gpib_address
- header: :SYSTem:COMMunicate:LAN:DHCP
  state: system.lan_dhcp
- header: :LXI:IDENtify[:STATe]
  state: system.lxi_identify
- header: :FORMat[:DATA]
  state: format.data
- header: :FORMat:ELEMents:SENSe
  state: format.elements.sense
- header: :SYSTem:LFRequency
  state: system.line_freq
- header: :SYSTem:VERSion
  state: system.scpi_version
  set: false
  format:
    number: nr2
    digits: 1
    sign: false
- header: :SYSTem:INTerlock:TRIPped
  state: system.interlock
  set: false
- header: :SYSTem:DATA:QUANtity
  op: ch.mem.points
  set: false
  params:
  - *id001
# ---- status registers (#1572, one group per channel) ----
- {header: ':STATus:MEASurement[:EVENt]', op: ch.meas.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:MEASurement:CONDition', op: ch.meas.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:MEASurement:ENABle', params: [{name: mask, type: int, state: 'ch.status.meas_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:MEASurement:PTRansition', params: [{name: mask, type: int, state: 'ch.status.meas_ptr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:MEASurement:NTRansition', params: [{name: mask, type: int, state: 'ch.status.meas_ntr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:OPERation[:EVENt]', op: ch.oper.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:OPERation:CONDition', op: ch.oper.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:OPERation:ENABle', params: [{name: mask, type: int, state: 'ch.status.oper_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:OPERation:PTRansition', params: [{name: mask, type: int, state: 'ch.status.oper_ptr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:OPERation:NTRansition', params: [{name: mask, type: int, state: 'ch.status.oper_ntr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable[:EVENt]', op: ch.ques.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CONDition', op: ch.ques.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:ENABle', params: [{name: mask, type: int, state: 'ch.status.ques_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:PTRansition', params: [{name: mask, type: int, state: 'ch.status.ques_ptr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:NTRansition', params: [{name: mask, type: int, state: 'ch.status.ques_ntr'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:VOLTage[:EVENt]', op: ch.ques_volt.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:VOLTage:CONDition', op: ch.ques_volt.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:VOLTage:ENABle', params: [{name: mask, type: int, state: 'ch.status.volt_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CURRent[:EVENt]', op: ch.ques_curr.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CURRent:CONDition', op: ch.ques_curr.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CURRent:ENABle', params: [{name: mask, type: int, state: 'ch.status.curr_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEMPerature[:EVENt]', op: ch.ques_temp.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEMPerature:CONDition', op: ch.ques_temp.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEMPerature:ENABle', params: [{name: mask, type: int, state: 'ch.status.temp_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CALibration[:EVENt]', op: ch.ques_cal.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CALibration:CONDition', op: ch.ques_cal.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:CALibration:ENABle', params: [{name: mask, type: int, state: 'ch.status.cal_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEST[:EVENt]', op: ch.ques_test.event, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEST:CONDition', op: ch.ques_test.condition, set: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:QUEStionable:TEST:ENABle', params: [{name: mask, type: int, state: 'ch.status.test_enable'}, {name: channels, type: channel_list, optional: true, default: [1]}]}
- {header: ':STATus:PRESet', op: ch.ques.preset, query: false, params: [{name: channels, type: channel_list, optional: true, default: [1]}]}
# ---- setup memory (*SAV/*RCL 0-9, #1573) ----
- header: "*SAV"
  op: ch.setups.save
  query: false
  params:
  - {name: register, type: int, min: 0, max: 9}
  - {name: channels, type: channel_list, optional: true, default: [1]}
- header: "*RCL"
  op: ch.setups.recall
  query: false
  params:
  - {name: register, type: int, min: 0, max: 9}
  - {name: channels, type: channel_list, optional: true, default: [1]}
channels:
  count: 2
  lists:
    descending: true
channel_state:
  source.function:
    type: enum
    options:
    - VOLTage
    - CURRent
    default: VOLTage
    electrical: true
    label: 源功能
    label_en: Source function
    option_labels:
      VOLTage: 电压源
      CURRent: 电流源
  source.voltage.level:
    type: float
    unit: V
    min: -210.0
    max: 210.0
    default: 0.0
    label: 电压设定
    label_en: Voltage level
  source.current.level:
    type: float
    unit: A
    min: -3.03
    max: 3.03
    default: 0.0
    label: 电流设定
    label_en: Current level
  source.range_voltage:
    type: float
    unit: V
    min: 0.2
    max: 200.0
    default: 2.0
    label: 电压源量程
    label_en: Voltage source range
  source.range_current:
    type: float
    unit: A
    min: 1.0e-08
    max: 3.0
    default: 0.0001
    label: 电流源量程
    label_en: Current source range
  source.autorange_voltage:
    type: bool
    default: true
    label: 电压源自动量程
    label_en: Voltage source auto range
  source.autorange_current:
    type: bool
    default: true
    label: 电流源自动量程
    label_en: Current source auto range
  source.shape:
    type: enum
    options:
    - DC
    default: DC
    label: 输出波形
    label_en: Output shape
  sweep.mode:
    type: enum
    options:
    - FIXed
    - SWEep
    - LIST
    default: FIXed
    label: 电压源模式
    label_en: Voltage source mode
  # 扫描（#398，B2910-90130 p.256–274）：电流源的模式与起止电平各自一份，点数共用；间隔、方向、
  # 单/双向与量程模式共用；列表扫描的数据与起点按电压/电流各一份。*RST 值按各命令的 default。
  sweep.cmode:
    type: enum
    options: [FIXed, SWEep, LIST]
    default: FIXed
    label: 电流源模式
    label_en: Current source mode
  sweep.cstart:
    type: float
    unit: A
    min: -3.03
    max: 3.03
    default: 0.0
    label: 电流扫描起始
    label_en: Current sweep start
  sweep.cstop:
    type: float
    unit: A
    min: -3.03
    max: 3.03
    default: 0.0
    label: 电流扫描终止
    label_en: Current sweep stop
  sweep.spacing:
    type: enum
    options: [LINear, LOGarithmic]
    default: LINear
    label: 扫描间隔
    label_en: Sweep spacing
  sweep.direction:
    type: enum
    options: [UP, DOWN]
    default: UP
    label: 扫描方向
    label_en: Sweep direction
  sweep.stair:
    type: enum
    options: [SINGle, DOUBle]
    default: SINGle
    label: 单/双向扫描
    label_en: Sweep stair
  sweep.ranging:
    type: enum
    options: [BEST, FIXed, AUTO]
    default: BEST
    label: 扫描量程模式
    label_en: Sweep ranging
  list.voltage:
    type: string
    default: "0"
    label: 电压列表
    label_en: Voltage list
  list.current:
    type: string
    default: "0"
    label: 电流列表
    label_en: Current list
  list.vstart:
    type: int
    min: 1
    max: 2500
    default: 1
    label: 电压列表起点
    label_en: Voltage list start
  list.cstart:
    type: int
    min: 1
    max: 2500
    default: 1
    label: 电流列表起点
    label_en: Current list start
  sweep.start:
    type: float
    unit: V
    min: -210.0
    max: 210.0
    default: 0.0
    label: 扫描起始
    label_en: Sweep start
  sweep.stop:
    type: float
    unit: V
    min: -210.0
    max: 210.0
    default: 0.0
    label: 扫描终止
    label_en: Sweep stop
  sweep.points:
    type: int
    min: 1
    max: 2500
    default: 1
    label: 扫描点数
    label_en: Sweep points
  compliance.current.limit:
    type: float
    unit: A
    min: 0.0
    max: 3.03
    default: 0.0001
    label: 电流限值
    label_en: Current compliance
  compliance.voltage.limit:
    type: float
    unit: V
    min: 0.0
    max: 210.0
    default: 2.0
    label: 电压限值
    label_en: Voltage compliance
  output.enabled:
    type: bool
    default: false
    electrical: true
    label: 输出
    label_en: Output
  sense.func.voltage:
    type: bool
    default: true
    label: 电压测量功能
    label_en: Voltage measurement
  sense.func.current:
    type: bool
    default: true
    label: 电流测量功能
    label_en: Current measurement
  sense.func.resistance:
    type: bool
    default: false
    label: 电阻测量功能
    label_en: Resistance measurement
  sense.remote:
    type: bool
    default: false
    electrical: true
    label: 远端检测
    label_en: Remote sense
  sense.nplc:
    type: float
    min: 0.0004
    max: 100.0
    default: 0.1
    label: 积分时间
    label_en: Integration time
    display_unit: PLC
  sense.range_auto:
    type: bool
    default: true
    label: 测量自动量程
    label_en: Measurement auto range
  sense.range_voltage:
    type: float
    unit: V
    min: 0.2
    max: 200.0
    default: 2.0
    label: 电压测量量程
    label_en: Voltage measurement range
  sense.range_current:
    type: float
    unit: A
    min: 1.0e-08
    max: 3.0
    default: 0.0001
    label: 电流测量量程
    label_en: Current measurement range
  trigger.source:
    type: enum
    options:
    - AINT
    - BUS
    default: AINT
    label: 触发源
    label_en: Trigger source
  trigger.count:
    type: int
    min: 1
    max: 100000
    default: 1
    label: 触发次数
    label_en: Trigger count
  trigger.delay:
    type: float
    unit: S
    min: 0.0
    max: 100.0
    default: 0.0
    label: 触发延迟
    label_en: Trigger delay
  # 状态寄存器组的使能（#1572，B2910-90130 的 STATus Subsystem）：每个通道一组。
  status.meas_enable: {type: int, min: 0, max: 65535, default: 0, label: MEAS 使能, label_en: MEAS enable, keep_on_reset: true}
  status.oper_enable: {type: int, min: 0, max: 65535, default: 0, label: OPER 使能, label_en: OPER enable, keep_on_reset: true}
  status.ques_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 使能, label_en: QUES enable, keep_on_reset: true}
  status.volt_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 电压使能, label_en: QUES voltage enable, keep_on_reset: true}
  status.curr_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 电流使能, label_en: QUES current enable, keep_on_reset: true}
  status.temp_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 温度使能, label_en: QUES temperature enable, keep_on_reset: true}
  status.cal_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 校准使能, label_en: QUES calibration enable, keep_on_reset: true}
  status.test_enable: {type: int, min: 0, max: 65535, default: 0, label: QUES 自检使能, label_en: QUES test enable, keep_on_reset: true}
  status.meas_ptr: {type: int, min: 0, max: 65535, default: 32767, label: MEAS PTR, label_en: MEAS PTR}
  status.meas_ntr: {type: int, min: 0, max: 65535, default: 0, label: MEAS NTR, label_en: MEAS NTR}
  status.oper_ptr: {type: int, min: 0, max: 65535, default: 32767, label: OPER PTR, label_en: OPER PTR}
  status.oper_ntr: {type: int, min: 0, max: 65535, default: 0, label: OPER NTR, label_en: OPER NTR}
  status.ques_ptr: {type: int, min: 0, max: 65535, default: 32767, label: QUES PTR, label_en: QUES PTR}
  status.ques_ntr: {type: int, min: 0, max: 65535, default: 0, label: QUES NTR, label_en: QUES NTR}
channel_components:
- name: source
  type: smu_source
  params:
    source_ranges:
      VOLTage:
      - 0.2
      - 2.0
      - 20.0
      - 200.0
      CURRent:
      - 1.0e-08
      - 1.0e-07
      - 1.0e-06
      - 1.0e-05
      - 0.0001
      - 0.001
      - 0.01
      - 0.1
      - 1.0
      - 1.5
      - 3.0
    range_limits:
      VOLTage:
        0.2: 3.03
        2.0: 3.03
        20.0: 1.515
        200.0: 0.105
      CURRent:
        1.0e-08: 210.0
        1.0e-07: 210.0
        1.0e-06: 210.0
        1.0e-05: 210.0
        0.0001: 210.0
        0.001: 210.0
        0.01: 210.0
        0.1: 210.0
        1.0: 21.0
        1.5: 21.0
        3.0: 6.0
    source_range_voltage: $ch.source.range_voltage
    source_range_current: $ch.source.range_current
    source_autorange_voltage: $ch.source.autorange_voltage
    source_autorange_current: $ch.source.autorange_current
    sweep_mode: $ch.sweep.mode
    sweep_mode_current: $ch.sweep.cmode
    sweep_function: $ch.source.function
    sweep_start: $ch.sweep.start
    sweep_stop: $ch.sweep.stop
    sweep_start_current: $ch.sweep.cstart
    sweep_stop_current: $ch.sweep.cstop
    sweep_points: $ch.sweep.points
    sweep_spacing: $ch.sweep.spacing
    sweep_direction: $ch.sweep.direction
    sweep_stair: $ch.sweep.stair
    list_voltage: $ch.list.voltage
    list_current: $ch.list.current
    list_start: {from: $ch.source.function, map: {VOLTage: $ch.list.vstart, CURRent: $ch.list.cstart}}
- name: loop
  type: output_control_loop
  params:
    function: $ch.source.function
    v_level: $ch.source.voltage.level
    i_level: $ch.source.current.level
    i_limit: $ch.compliance.current.limit
    v_limit: $ch.compliance.voltage.limit
    output: $ch.output.enabled
    envelope: source
- name: out
  type: smu_output
  params:
    output: $ch.output.enabled
    remote_sense: $ch.sense.remote
    floating: false
    loop: loop
- name: core
  type: smu_meter
  params:
    measure_voltage: $ch.sense.func.voltage
    measure_current: $ch.sense.func.current
    measure_resistance: $ch.sense.func.resistance
    source: source
    loop: loop
    output: out
    nplc: $ch.sense.nplc
    autozero: true
    line_freq: $system.line_freq
    delay: 0.0
    buffer: mem
    measure_ranges:
      VOLTage:
      - 0.2
      - 2.0
      - 20.0
      - 200.0
      CURRent:
      - 1.0e-08
      - 1.0e-07
      - 1.0e-06
      - 1.0e-05
      - 0.0001
      - 0.001
      - 0.01
      - 0.1
      - 1.0
      - 1.5
      - 3.0
    measure_range_voltage: $ch.sense.range_voltage
    measure_range_current: $ch.sense.range_current
    measure_autorange: $ch.sense.range_auto
    overrange: 1.06
    overload_value: 9.91e37
    # 读数噪声（specs.noise_ppm_of_range，#744）：与 B2901A 同值，见其依据说明
    noise: {ppm_of_range: 7.5, ref_time_s: 0.02}
- name: trig
  type: trigger_model
  params:
    sampler: core
    source:
      from: $ch.trigger.source
      map:
        AINT: immediate
        BUS: bus
    trigger_count: $ch.trigger.count
    sample_count: 1
    delay: $ch.trigger.delay
    buffer: mem
    fetch_from_buffer: false
- name: mem
  type: reading_buffer
  params:
    capacity: 100000
    when_full: stop
    digits: 6
# 状态寄存器组（#1572）：每通道一组（手册的 MEASurement 寄存器把 Ch1/Ch2 的位放在同一张表里，
# 本型号按通道各一组，命令用通道列表选择；位 0–4 是该通道的位）。
- name: meas
  type: status_register
  params:
    bits: {LIMIT: 0, DATA: 1, OVER: 2, BUF_DATA: 3, BUF_FULL: 4}
    enable: $ch.status.meas_enable
    ptr: $ch.status.meas_ptr
    ntr: $ch.status.meas_ntr
    preset_ptr: 32767
    summary_bit: 0
- name: oper
  type: status_register
  params:
    bits: {CAL: 0, TIDLE: 1, TWTG: 2, TWARM: 3, SCN: 4, WTG: 5, AWARM: 6, LOCK: 13, PROG: 14}
    enable: $ch.status.oper_enable
    ptr: $ch.status.oper_ptr
    ntr: $ch.status.oper_ntr
    preset_ptr: 32767
    summary_bit: 7
- name: ques
  type: status_register
  params:
    bits: {VLIM: 0, ILIM: 1, PROT: 2, TEMP: 4, CAL: 8, TEST: 9, ILOCK: 10}
    enable: $ch.status.ques_enable
    ptr: $ch.status.ques_ptr
    ntr: $ch.status.ques_ntr
    preset_ptr: 32767
    summary_bit: 3
- name: ques_volt
  type: status_register
  params:
    bits: {VLIM: 0}
    enable: $ch.status.volt_enable
    ptr: 32767
    ntr: 0
    preset_ptr: 32767
- name: ques_curr
  type: status_register
  params:
    bits: {ILIM: 0}
    enable: $ch.status.curr_enable
    ptr: 32767
    ntr: 0
    preset_ptr: 32767
- name: ques_temp
  type: status_register
  params:
    bits: {TEMP: 0}
    enable: $ch.status.temp_enable
    ptr: 32767
    ntr: 0
    preset_ptr: 32767
- name: ques_cal
  type: status_register
  params:
    bits: {CAL: 0}
    enable: $ch.status.cal_enable
    ptr: 32767
    ntr: 0
    preset_ptr: 32767
- name: ques_test
  type: status_register
  params:
    bits: {TEST: 0}
    enable: $ch.status.test_enable
    ptr: 32767
    ntr: 0
    preset_ptr: 32767
- name: setups
  type: setup_memory
  params:
    registers: 10
    first: 0
    empty_error: 0
