- section: SENSe Subsystem > Function
  commands:
  - header: '[:SENSe]:FUNCtion[:ON]'
    level: implemented
    note: VOLT / "VOLT:AC"；查询返回带引号的短格式。各功能的量程、积分时间等属性在真机按功能独立记忆；本定义只有一组设定（共用），切换功能不恢复。
- section: SENSe Subsystem > Voltage
  commands:
  - header: '[:SENSe]:VOLTage:AC:BANDwidth'
    level: implemented
    note: 3/20/200 Hz 滤波档：进表的 AC 耦合下限按输入值归档（15 Hz → 3 Hz，190 Hz → 20 Hz）；查询返回输入值（真机返回所选档）。AC 读数的虚拟时间仍按
      DC 的 NPLC 表（平台的读数时间为单一参数）。
  - header: '[:SENSe]:VOLTage:{AC|DC}:NULL[:STATe]'
    level: not_modeled
    note: Null/数学功能未实现（另开 issue）。
  - header: '[:SENSe]:VOLTage:{AC|DC}:NULL:VALue'
    level: not_modeled
    note: Null/数学功能未实现。
  - header: '[:SENSe]:VOLTage:{AC|DC}:NULL:VALue:AUTO'
    level: not_modeled
    note: Null/数学功能未实现。
  - header: '[:SENSe]:VOLTage[:DC]:RANGe'
    level: implemented
    note: 100 mV–1000 V；量程设定查询返回设定值（自动时 0；真机返回实际量程）；AC 与 DC 共用一组设定（真机按功能独立记忆）。设定固定量程不自动关闭自动量程（须再发 RANGe:AUTO
      OFF）。
  - header: '[:SENSe]:VOLTage:AC:RANGe'
    level: implemented
    note: 与直流共用量程设定；手册命令表的量程到 1000 V（数据表的 750 Vrms 是安全限值）。
  - header: '[:SENSe]:VOLTage[:DC]:RANGe:AUTO'
    level: implemented
    note: 自动量程：<10% 降档、>120% 升档；ONCE 未建模（-224）。
  - header: '[:SENSe]:VOLTage:AC:RANGe:AUTO'
    level: implemented
    note: 与直流共用自动量程设定。
  - header: '[:SENSe]:VOLTage[:DC]:APERture'
    level: implemented
    note: 孔径时间（200 µs–1 s）保存；读数的虚拟时间仍按 NPLC 表（孔径模式不改变计时）。发送 APERture 不自动打开孔径模式（真机会，须再发 ENABled ON）。
  - header: '[:SENSe]:VOLTage[:DC]:APERture:ENABled'
    level: implemented
    note: 孔径时间模式开关保存；积分计时按 NPLC 表。
  - header: '[:SENSe]:VOLTage[:DC]:IMPedance:AUTO'
    level: implemented
    note: 10 MΩ（OFF，默认）↔ >10 GΩ（ON，100 mV–10 V 量程）；真实进入电路求解，改变被测电路的负载。手册用 [SENSe:]VOLTage[:DC]:IMPedance:AUTO，不是
      34401A 的 INPut:IMPedance:AUTO。
  - header: '[:SENSe]:VOLTage[:DC]:NPLCycles'
    level: implemented
    note: 0.02/0.06/0.2/1/10/100 PLC，默认 10；设定吸附到最近档（真机拒绝非法值）；分辨率与读数时间随之确定（50 Hz、自动调零开启、含 DC 自动触发延迟）。
  - header: '[:SENSe]:VOLTage[:DC]:RATio:SECondary'
    level: not_modeled
    note: 比值测量的二次测量未实现。
  - header: '[:SENSe]:VOLTage[:DC]:RESolution'
    level: implemented
    note: 分辨率设定保存并回读；实际分辨率由 NPLC 表给出（真机两者互相设定）。
  - header: '[:SENSe]:VOLTage[:DC]:SECondary'
    level: not_modeled
    note: 二次测量未实现。
  - header: '[:SENSe]:VOLTage[:DC]:ZERO:AUTO'
    level: implemented
    note: 自动调零 ON/OFF；ONCE 未建模（-224）。
  - header: '[:SENSe]:VOLTage:AC:SECondary'
    level: not_modeled
    note: 二次测量未实现。
