# Keysight 34465A 的覆盖表：命令按 Truevolt 系列 Operating and Service Guide
# （34460-90901, Edition 13, September 2025）的命令索引逐条列出；程度与说明手写。
schema: simubench.coverage/1
model: keysight-34465a
sections:
- section: SCPI Command Reference > Root Commands
  commands:
  - header: ABORt
    level: implemented
    note: 回到触发空闲态；已取的读数保留在读数存储器。
  - header: FETCh
    level: implemented
    note: 等待本次运行完成并给出全部读数（不删除）；无读数可取时报 -230。
  - header: INITiate[:IMMediate]
    level: implemented
    note: 进入等待触发态并清空读数存储器；测量按 NPLC 计入虚拟时间，INIT 即时返回。
  - header: OUTPut:TRIGger:SLOPe
    level: accepted
    note: VM Comp BNC 的硬件握手信号不在仿真中，设定保存并回读。
  - header: R
    level: implemented
    note: 定长块给出并删除最旧的读数（R? [max]；块内 ASCII，逗号分隔，块后无换行）。
  - header: READ
    level: implemented
    note: INITiate + FETCh?；等待总线/外部触发时按手册报 -214（触发死锁）。
  - header: ROUTe:TERMinals?
    level: not_modeled
    note: 前面板 Front/Rear 开关不是可编程的；仿真中无此开关。
  - header: TEST:ALL?
    level: not_modeled
    note: 整机自检；仿真中的仪表总在正常状态，回复无意义。
  - header: UNIT:TEMPerature
    level: not_modeled
    note: 温度功能未实现（另开 issue）。
- section: CALibration Subsystem
  commands:
  - header: CALibration:ADC?
    level: not_modeled
    note: 低电平 ADC 校准是硬件流程；仿真的 ADC 无需校准。
  - header: CALibration[:ALL]
    level: implemented
    note: 按 :CALibration:VALue 对当前（功能, 量程）调整：参考值为 0 调零点、否则调增益；+0 通过、+1 失败。
  - header: :CALibration:COUNt
    level: implemented
    note: 校准次数（STORe 时加一）；组件按整数回复（真机带 + 号）。
  - header: :CALibration:DATE
    level: implemented
    note: 上次校准日期；组件按 ISO 日期带引号回复（手册为 yyyy,mm,dd）。
  - header: CALibration:SECure:CODE
    level: implemented
    note: 解锁后改安全码；长度与首字母规则未强制（手册的 +704 未实现）。
  - header: CALibration:SECure:STATe
    level: implemented
    note: '{ON|OFF},[code]；出厂码 AT3446XA。组件对''保护中''与''安全码无效''都报 +701（手册为 +702/+703），文字按手册。'
  - header: CALibration:STORe
    level: implemented
    note: 把调整后的系数提交保存，校准计数加一并记日期时间。
  - header: CALibration:STRing
    level: implemented
    note: 带引号的校准信息，跨 *RST 保留。
  - header: CALibration:TEMPerature?
    level: not_modeled
    note: 上次校准温度未记录。
  - header: :CALibration:TIME
    level: implemented
    note: 上次校准时间；组件按 HH:MM:SS 带引号回复（手册为 hh,mm,ss.sss）。
  - header: CALibration:VALue
    level: implemented
    note: 校准参考值，*RST 后回到 0.0；查询按 6 位尾数回复（组件的格式，手册为 8 位）。
