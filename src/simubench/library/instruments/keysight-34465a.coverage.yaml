- section: IEEE 488.2 Common Commands
  commands:
  - header: '*CAL?'
    level: not_modeled
    note: 自动校准（ACAL）：仿真的仪表无漂移可补偿，回复无意义。
  - header: '*CLS'
    level: implemented
    note: 清事件寄存器与错误队列。
  - header: '*ESE'
    level: implemented
    note: 标准事件使能寄存器；查询按整数回复（真机带 + 号）。
  - header: '*ESR'
    level: implemented
    note: 标准事件寄存器；按整数回复（真机带 + 号）。
  - header: '*IDN'
    level: implemented
    note: Keysight Technologies,34465A,<serial>,<firmware>。
  - header: '*LRN?'
    level: not_modeled
    note: 学习串未实现。
  - header: '*OPC'
    level: implemented
    note: '*OPC 在操作完成时置 ESR 位 0；*OPC? 等全部待完成操作结束后回 1（等待按 NPLC 计的运行）。'
  - header: '*OPT?'
    level: not_modeled
    note: 选件串未实现。
  - header: '*PSC'
    level: not_modeled
    note: 上电状态清零未实现。
  - header: '*RCL'
    level: not_modeled
    note: 状态存储未实现。
  - header: '*RST'
    level: implemented
    note: 恢复出厂默认（值见各命令的默认值；错误队列不受 *RST 影响）。
  - header: '*SAV'
    level: not_modeled
    note: 状态存储未实现。
  - header: '*SRE'
    level: implemented
    note: 服务请求使能寄存器；查询按整数回复（真机带 + 号）。
  - header: '*STB'
    level: implemented
    note: 状态字节条件寄存器；按整数回复（真机带 + 号）。
  - header: '*TRG'
    level: implemented
    note: 总线触发：仅 TRIGger:SOURce BUS 且等待触发时接受，否则 -211。
  - header: '*TST'
    level: implemented
    note: 自检通过回复 0（真机为 +0）。
  - header: '*WAI'
    level: implemented
    note: 等待全部待完成操作。
