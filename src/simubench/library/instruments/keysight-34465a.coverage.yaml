- section: TRIGger Subsystem
  commands:
  - header: TRIGger:COUNt
    level: implemented
    note: 1 到 1e9（INFinity 未建模，回复 -104）；查询 nr3 8 位。
  - header: TRIGger:DELay
    level: implemented
    note: 0–3600 s；真机把延迟插在每次测量之间，触发模型放在每次触发的第一读数前。自动延迟已并入读数时间（DC 100/130/160 µs，AC 按滤波档），手动延迟按设定计。
  - header: TRIGger:DELay:AUTO
    level: implemented
    note: 自动延迟开关保存；延迟值并入读数时间（不随本开关改变）。
  - header: TRIGger:LEVel
    level: not_modeled
    note: 电平触发需要 DIG 选项与内部触发源，未实现。
  - header: TRIGger:SLOPe
    level: accepted
    note: 外部触发沿保存；外部触发连线不在本期（按'等待外部触发'处理）。
  - header: TRIGger:SOURce
    level: implemented
    note: IMM/BUS/EXT（短格式回复）；INTernal 需要 DIG 选项，拒绝（-224）。
