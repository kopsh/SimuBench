# 多功能校准源的真实功能块(D50,依据见 docs/component-map.md 的 calibrator 节)。
# #329 拆分:calibrator_setpoint(设定值与量程)+ calibrator_control(输出控制);整块的
# calibrator_output 保留给拆分前写的定义,行为与两块组合相同。
schema: simubench.blocks/1
class: calibrator
blocks:
  - block: setpoint_and_range  # 设定值与量程生成(DAC 与量程放大)
    components: [calibrator_setpoint, calibrator_output]
  - block: output_control      # 输出控制:工作/待机、输出端子
    components: [calibrator_control, calibrator_output]
