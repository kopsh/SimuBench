# 频谱分析仪的真实功能块(D50,依据见 docs/component-map.md 的 spectrum_analyzer 节)。
# 组件由 D1(#187)落地;模拟前端(衰减、混频、中频)在块之间传递信号,本振单列(#952,signal-chain.md 5.1)。
schema: simubench.blocks/1
class: spectrum_analyzer
blocks:
  - block: input_port          # RF 输入(50 Ω)
    components: [input_port]
  - block: input_attenuator    # 输入衰减器
    components: [specan_input]
  - block: mixer               # 混频器(变到中频)
    components: [specan_mixer]
  - block: local_oscillator    # 本振(调谐、参考误差、扫速)
    components: [specan_lo]
  - block: if_filter           # 中频滤波(RBW)
    components: [specan_if]
  - block: log_detector        # 对数检波
    components: [specan_detector]
  - block: vbw_filter          # 视频滤波(VBW)
    components: [specan_vbw]
  - block: trace               # 检波器、迹线模式与标记
    components: [specan_trace]
  - block: reference           # 10 MHz 参考
    components: [reference_clock]
