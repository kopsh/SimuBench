# “找到跳闸”演示（tui-design.md 第 6 节）：
#
#   SIMUBENCH_DEFINITIONS=validation/instruments \
#   simubench tui validation/benches/find-the-trip.bench.yaml --workspace validation \
#     --scpi-base-port 5195 --hislip-port 4899 \
#     --script docs/tui/find-the-trip.steps.yaml --out docs/tui --record-dir runs
#
# 测试台预设了一次跳闸（输出关闭、错误队列 -300），演示只用数字键 + Enter 走到那台仪表，
# 再由另一个客户端读错误队列：TUI 自己说出原因，截图里的状态都能在运行记录里复核。
size: [100, 34]
steps:
  - caption: One SMU on the bench has tripped
    wait: 1.5s
  - key: "1"
    caption: A digit key moves the focus to its card
    wait: 1s
  - key: enter
    caption: "Open it: the trip turned the output off and queued a -300"
    wait: 1.5s
  - highlight: [output.enabled]
    caption: The output stays off; another client reads the error queue
    wait: 1s
    screenshot: find-the-trip
  - scpi: {instrument: smu, command: ":SYSTem:ERRor?", source_port: 5401}
    caption: "-300 is read away: the queue empties, the error history stays"
    wait: 1.5s
  - screenshot: find-the-trip-error
