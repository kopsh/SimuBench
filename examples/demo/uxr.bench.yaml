schema: simubench.bench/2
name: uxr_demo
description: >-
  UXR1104B 演示台：两台 Keysight 33622A 的四路输出接到 Keysight Infiniium UXR1104B（110 GHz、256 GSa/s）的
  CH1–CH4：10 MHz 正弦、1 MHz 方波、500 kHz 三角波、2 MHz 脉冲（20 % 占空比）。UXR 是 50 Ω 输入，发生器的负载
  设定都是 50 Ω。演示脚本 examples/demo/uxr_demo.py 只用 PyVISA 与 Infiniium 编程手册的命令：自动设置、
  逐通道测量、FFT 与波形读取，在真机和 SimuBench 上不改一行。
instruments:
  gen1:
    model: keysight-33622a
    label: 发生器 1
    address: "TCPIP0::192.168.1.50::inst0::INSTR"
    state:
      ch1.frequency: 1.0e7
      ch1.amplitude: 0.4
      ch1.load: 50.0
      ch1.output: true
      ch2.function: SQUare
      ch2.frequency: 1.0e6
      ch2.amplitude: 0.4
      ch2.load: 50.0
      ch2.output: true
  gen2:
    model: keysight-33622a
    label: 发生器 2
    address: "TCPIP0::192.168.1.51::inst0::INSTR"
    state:
      ch1.function: TRIangle
      ch1.frequency: 5.0e5
      ch1.amplitude: 0.3
      ch1.load: 50.0
      ch1.output: true
      ch2.function: PULSe
      ch2.frequency: 2.0e6
      ch2.amplitude: 0.2
      ch2.offset: 0.1
      ch2.pulse_duty: 20.0
      ch2.load: 50.0
      ch2.output: true
  scope:
    model: keysight-uxr1104b
    label: 示波器
    address: "TCPIP0::192.168.1.61::hislip0::INSTR"
wires:
  - {from: gen1.CH1, to: scope.CH1}
  - {from: gen1.CH2, to: scope.CH2}
  - {from: gen2.CH1, to: scope.CH3}
  - {from: gen2.CH2, to: scope.CH4}
run:
  seed: 3
  clock: command
  idle: "off"
layout:
  gen1: {x: 0, y: 0}
  gen2: {x: 0, y: 240}
  scope: {x: 440, y: 0}
