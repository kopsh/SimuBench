schema: simubench.instrument/1
id: lfcal-reference-scope
manufacturer: LeCroy
model: LFCAL-REFSCOPE
class: oscilloscope
version: 1
description: >-
  低频校准工作台的参考示波器：LeCroy 风格的私有命令方言（TRSE、C1:VDIV、WAVEFORM_SETUP、
  C1:INSPECT? 文本波形回读）。按主机测试程序的接口契约编写，不是按某一型号手册实现的真实型号
  （没有 reference，D42）；契约之外的命令被忽略而不报错。*IDN? 的型号段由测试台的 idn 设定
  （主机校验的型号串）。4 通道，记录长度恰为 MSIZ 点；噪声与 ADC 位数是假设值，见
  docs/lowfreq-cal.md。
identity:
  idn: "{manufacturer},{model},{serial},{firmware}"
  serial: LCRY0000001
  firmware: "9.6.0"
unknown_commands: ignore
# LeCroy 的应答：回显命令头（COMM_HEADER 切换 OFF / SHORT / LONG）、工程计数法、ON/OFF；
# 无单位的点数可带倍率后缀（MSIZ 10K、2.5MA；这里 M 是兆，点数没有毫）。
dialect:
  echo_header: $comm.header
  multipliers: {K: 1.0e3, M: 1.0e6, MA: 1.0e6, G: 1.0e9}
format:
  number: engineering
  boolean: word
  enum: short
channels:
  count: 4
  overrides:
    1: {display: {default: true}}
state:
  timebase.scale:
    type: float
    unit: S
    min: 2.0e-11
    max: 1000.0
    default: 1.0e-3
    label: 时基
    label_en: Timebase
  memory.size:
    type: int
    min: 500
    max: 50000000
    default: 10000
    label: 存储深度
    label_en: Memory size
  trigger.mode:
    type: enum
    options: [AUTO, NORMal, SINGLE, STOP]
    default: AUTO
    label: 触发方式
    label_en: Trigger mode
  trigger.type:
    type: enum
    options: [EDGE]
    default: EDGE
  trigger.source:
    type: enum
    options: [C1, C2, C3, C4, EX, EX10, LINE]
    default: C1
    label: 触发源
    label_en: Trigger source
  trigger.hold:
    type: enum
    options: ["OFF", TI, PS, PL, IS, IL, P2, I2]
    default: "OFF"
  interleaved:
    type: bool
    default: false
    label: 随机交错采样
    label_en: Random interleaved sampling
  refclock:
    type: enum
    options: [INTERNAL, EXTERNAL]
    default: INTERNAL
    label: 参考时钟
    label_en: Reference clock
  comm.header:
    type: enum
    options: ["OFF", SHORT, LONG]
    default: SHORT
  waveform.sp:
    type: int
    min: 0
    max: 50000000
    default: 0
  waveform.np:
    type: int
    min: 0
    max: 50000000
    default: 0
  waveform.fp:
    type: int
    min: 0
    max: 50000000
    default: 0
  waveform.sn:
    type: int
    min: 0
    max: 10000
    default: 0
  # PACU 的测量槽位：测量名与信源（未设信源时为空，回复中省略）。
  measure.p1.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p1.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p2.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p2.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p3.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p3.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p4.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p4.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p5.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p5.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p6.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p6.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p7.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p7.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
  measure.p8.kind: {type: enum, options: ["NULL", AMPL, PKPK, MAX, MIN, MEAN, RMS, FREQ, PER], default: "NULL"}
  measure.p8.source: {type: enum, options: [C1, C2, C3, C4], default: ""}
channel_state:
  display:
    type: bool
    default: false
    label: 显示
    label_en: Trace
  coupling:
    type: enum
    options: [A1M, D1M, D50, GND]
    default: D1M
    electrical: true
    label: 耦合
    label_en: Coupling
    option_labels: {A1M: "AC 1 MΩ", D1M: "DC 1 MΩ", D50: "DC 50 Ω", GND: "GND"}
  scale:
    type: float
    unit: V
    min: 1.0e-3
    max: 10.0
    default: 0.05
    label: 垂直档位
    label_en: Scale
  offset:
    type: float
    unit: V
    min: -100.0
    max: 100.0
    default: 0.0
    label: 偏移
    label_en: Offset
  trigger_level:
    type: float
    unit: V
    min: -100.0
    max: 100.0
    default: 0.0
    label: 触发电平
    label_en: Trigger level
  trigger_slope:
    type: enum
    options: [POSitive, NEGative]
    default: POSitive
    label: 触发沿
    label_en: Trigger slope
  probe:
    type: float
    min: 0.0001
    max: 10000.0
    default: 1.0
    label: 衰减
    label_en: Attenuation
components:
  # 示波器由模块组成（instrument-authoring.md 8.4）：采集按名称引用时基、触发、ADC 组，以及每通道的
  # 垂直与探头模块；测量在 meas 上（C<n>:PAVA?）。
  - name: sys
    type: system
  - name: acq
    type: scope_acquisition
    params:
      horizontal: timebase
      trigger: trigger
      adc: adc
      vertical: front
      probe: probe
      # TRMD：SINGLE 采集一次后变为 STOP；AUTO / NORM 下从第一点开始的读取取新的采集，后续分段读同一记录；
      # 没有记录的通道读取时按当前信号采一次（事件中记为 forced）。
      single: [SINGLE]
      stop: [STOP]
      after_single: STOP
      reacquire: on_read_start
      missing: acquire
      untriggered: record
  - name: timebase
    type: scope_timebase
    params:
      # 记录正好 MSIZ 点、覆盖 10 格（采样率 MSIZ / 10 TDIV）。
      record_length: exact
      points: $memory.size
  - name: trigger
    type: scope_trigger
    params:
      # 每个通道有自己的触发电平与触发沿（C<n>:TRLV、C<n>:TRSL）。
      level: $ch{n}.trigger_level
      slope: $ch{n}.trigger_slope
      search_windows: 2
  - name: adc
    type: scope_adc
    params:
      # 假设值（不是数据手册数值）：12 位 ADC 覆盖 ±5 格；采样率上限 20 GSa/s，不取仪器的采样率表。
      bits: 12
      divs: 10.0
      offset_sign: add
      max_rate: 2.0e10
  - name: xfer
    type: waveform_transfer
    params:
      # C<n>:INSPECT? "DATA_ARRAY_1",FLOAT：WAVEFORM_SETUP 选点（NP 0 时每次最多 30000 点，主机契约），
      # 伏特，%.6e，空格分隔；引号与命令头由命令的应答模板加上。
      first: $waveform.fp
      count: $waveform.np
      step: $waveform.sp
      max_points: 30000
      encoding: text
      values: volts
      format: "%.6e"
      separator: " "
      # C<n>:INSPECT? "WAVEDESC"：脚本缩放与定时需要的描述变量，NAME : value，空格分隔。
      descriptor:
        WAVE_ARRAY_COUNT: "{points}"
        FIRST_POINT: "{first}"
        SPARSING_FACTOR: "{step}"
        HORIZ_INTERVAL: "{dt:.9e}"
        HORIZ_OFFSET: "{x_offset:.9e}"
        VERTICAL_OFFSET: "{offset:.6e}"
        VERTICAL_GAIN: "{gain:.6e}"
        TIMEBASE: "{timebase:.6e}"
        VOLT_PER_DIV: "{scale:.6e}"
        ACQ_COUNT: "{count}"
  - name: meas
    type: scope_measurements
    params:
      record: acq
      # C<n>:PAVA? 的测量名：引擎的测量与回复的单位。
      names:
        AMPL: [VAMPlitude, V]
        PKPK: [VPP, V]
        MAX: [VMAX, V]
        MIN: [VMIN, V]
        MEAN: [VAVerage, V]
        RMS: [VRMS, V]
        FREQ: [FREQuency, HZ]
        PER: [PERiod, S]
channel_components:
  # 耦合 A1M（交流 1 MΩ）、D1M、D50（直流 50 Ω）、GND：输入阻抗与前端都由它决定。
  - name: inp
    type: input_port
    params:
      z_in: {from: $ch.coupling, map: {D50: 50.0}, default: 1.0e6}
      c_in: 1.6e-11
  - name: front
    type: scope_vertical
    params:
      coupling: {from: $ch.coupling, map: {A1M: AC, D1M: DC, D50: DC, GND: GND}}
      bandwidth: 2.5e9
      ac_corner: 10.0
      # 假设值（不是数据手册数值）：输入端 200 µV rms 白噪声（假设与档位无关，单行档位表），
      # 按采集序号取值；测试台可用 hidden 覆盖。
      noise_table: [[0.0, 2.0e-4]]
  - name: probe
    type: scope_probe
wiring:
  channel:
    - [inp.out, front.in]
    - [front.out, probe.in]
  instrument:
    - ["ch{n}.probe.out", "acq.in{n}"]
ports:
  channel:
    "CH{n}": inp.pin
display:
  template: oscilloscope
  summary: [timebase.scale, memory.size, trigger.mode, trigger.source]
  channel_summary: [display, scale, offset, coupling, trigger_level]
  actions:
    single: "TRMD SINGLE"
capabilities: [oscilloscope]
commands:
  # ---- 公共命令与系统 ----
  - {header: "*CLS", op: sys.clear_status}
  - {header: "*OPC", op: acq.opc}
  - {header: ":SYSTem:PRESet", op: sys.reset, query: false}
  - {header: "Comm_HeaDeR", state: comm.header}
  # ---- 通道：应答回显命令头与单位，C1:VDIV 200E-3 V ----
  - {header: "C<ch>:TRAce", state: ch.display}
  - {header: "C<ch>:CouPLing", state: ch.coupling}
  - {header: "C<ch>:Volt_DIV", state: ch.scale, reply: "{header} {value} V"}
  - {header: "C<ch>:OFfSeT", state: ch.offset, reply: "{header} {value} V"}
  - {header: "C<ch>:ATTeNuation", state: ch.probe}
  - {header: "C<ch>:TRig_LeVel", state: ch.trigger_level, reply: "{header} {value} V"}
  - {header: "C<ch>:TRig_SLope", state: ch.trigger_slope}
  # ---- 时基、存储深度、采集 ----
  - {header: "Time_DIV", state: timebase.scale, reply: "{header} {value} S"}
  - {header: "Memory_SIZe", state: memory.size, format: {integer: engineering}}
  - {header: "InterLeaVeD", state: interleaved}
  - {header: "Reference_CLocK", state: refclock}
  # ---- 触发与运行控制 ----
  # TRSE EDGE,SR,C1,HT,OFF：只建模边沿触发；HV（保持值）接受并忽略。
  - header: "TRig_SElect"
    params:
      - {name: type, type: enum, state: trigger.type}
      - {name: rest, type: pairs, optional: true, keys: {SR: trigger.source, HT: trigger.hold, HV: null}}
  - header: "TRig_MoDe"
    op: acq.run_mode
    reply: "{header} {value}"
    params: [{name: mode, type: enum, options: [AUTO, NORMal, SINGLE, STOP], optional: true}]
  - {header: "ARM_acquisition", op: acq.single, query: false}
  - {header: "STOP", op: acq.stop, query: false}
  - {header: "FoRce_TRigger", op: acq.force_trigger, query: false}
  - header: "WAIT"
    op: acq.wait
    query: false
    params: [{name: timeout, type: float, unit: S, optional: true}]
  # ---- 测量 ----
  - header: "PArameter_CUstom"
    params:
      - {name: slot, type: int, index: true, min: 1, max: 8}
      - {name: kind, type: enum, state: "measure.p{slot}.kind"}
      - {name: source, type: enum, state: "measure.p{slot}.source", optional: true}
  - header: "C<ch>:PArameter_VAlue"
    op: meas.named
    set: false
    reply: "{header} {kind},{value} {unit},{status}"
    params: [{name: kind, type: string}]
  # ---- 波形传输（§5.3 文本回读） ----
  - header: "WaveForm_SetUp"
    params:
      - {name: setup, type: pairs, keys: {SP: waveform.sp, NP: waveform.np, FP: waveform.fp, SN: waveform.sn}}
  # 按第一个参数区分：DATA_ARRAY_1（SIMPLE 同）回读伏特值，WAVEDESC 给出描述变量；其他名称回复 -224。
  - header: "C<ch>:INSPect"
    when: {name: DATA_ARRAY_1}
    op: xfer.data
    set: false
    reply: '{header} " {value} "'
    params:
      - {name: name, type: string}
      - {name: fmt, type: enum, options: [FLOAT], optional: true}
  - header: "C<ch>:INSPect"
    when: {name: SIMPLE}
    op: xfer.data
    set: false
    reply: '{header} " {value} "'
    params:
      - {name: name, type: string}
      - {name: fmt, type: enum, options: [FLOAT], optional: true}
  - header: "C<ch>:INSPect"
    when: {name: WAVEDESC}
    op: xfer.describe
    set: false
    reply: '{header} " {value} "'
    params: [{name: name, type: string}]
