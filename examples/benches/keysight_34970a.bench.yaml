schema: simubench.bench/2
name: keysight_34970a_scan
description: >-
  Keysight 34970A 与槽 1 的 34901A（20 通道）：三个 1 V / 2 V / 4 V 参考各经 1 MΩ 接在
  通道 101/102/103，L 端共 0 V。闭合继电器后内部 DMM 的 10 MΩ 与源内阻分压，读数约为
  设定的 10/11（INPut:IMPedance:AUTO ON 时 10 V 档改为 >10 GΩ，读数回到设定值）。
  示例脚本 examples/scripts/keysight_34970a_scan.py 按用户指南的扫描流程写，在真机和
  SimuBench 上都不改一行。
instruments:
  daq:
    model: keysight-34970a
    label: 数据采集/开关单元
    address: "GPIB0::9::INSTR"
parts:
  v1: {type: dc_supply, params: {v: 1.0, r: 1.0e6}}
  v2: {type: dc_supply, params: {v: 2.0, r: 1.0e6}}
  v3: {type: dc_supply, params: {v: 4.0, r: 1.0e6}}
  v01: {type: dc_supply, params: {v: 0.0, r: 1.0e-6}}
  v02: {type: dc_supply, params: {v: 0.0, r: 1.0e-6}}
  v03: {type: dc_supply, params: {v: 0.0, r: 1.0e-6}}
wires:
  - {from: v1.OUT, to: daq.H101}
  - {from: v2.OUT, to: daq.H102}
  - {from: v3.OUT, to: daq.H103}
  - {from: v01.OUT, to: daq.L101}
  - {from: v02.OUT, to: daq.L102}
  - {from: v03.OUT, to: daq.L103}
run:
  seed: 1
  clock: command
  idle: "off"
layout:
  daq: {x: 0, y: 80}
  v1: {x: 440, y: 0}
  v2: {x: 440, y: 100}
  v3: {x: 440, y: 200}
  v01: {x: 220, y: 300}
  v02: {x: 320, y: 300}
  v03: {x: 420, y: 300}
