[project]
name = "simubench"
dynamic = ["version"]
description = "SimuBench: software-defined virtual instrument benches"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pyvisa>=1.14",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
tui = ["textual>=8.2", "httpx>=0.27"]

[project.scripts]
simubench = "simubench.cli:main"

[project.entry-points.pytest11]
simubench = "simubench.pytest_plugin"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.6",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pyvisa-py>=0.8.1",
  "pytest-textual-snapshot>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version comes from the git history (D58): YYYY.M.D.N, the date of the newest commit and how
# many commits that day has (scripts/version.py). No tags; the commit is in _version.py instead
# (simubench version --full).
[tool.hatch.version]
source = "code"
path = "scripts/version.py"
expression = "version()"

# Writes src/simubench/_version.py: the version above and the commit it was built from (hatch_build.py).
[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/simubench", "src/pyvisa_simubench"]
# The built UI and the changelog, written by scripts/build-wheel.sh (git-ignored, so listed as
# artifacts).
artifacts = ["src/simubench/web_dist/**", "src/simubench/CHANGELOG.md"]

[tool.hatch.build.targets.sdist]
# The vendor manuals are for development only, never distributed (real-models.md 7).
exclude = ["manuals"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "refcalc"]
# Sample user scripts the scanner reads; written the way test programs are, not to our style.
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Line length is the formatter's job; long string literals (messages, docs) stay unbroken.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# Component types declare ports and defaults as class attributes typed ClassVar on the base class.
"src/simubench/library/components/*.py" = ["RUF012"]
# MCP tool parameters declare their schema with pydantic Field defaults, like FastAPI's Query.
"src/simubench/mcp_tools/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests", "acceptance"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
# A test that hangs (a socket nobody closes, a wait nobody ends) fails after this many seconds
# with the stacks of all threads, instead of holding the CI job until its 6 h limit. The slowest
# real test takes under 10 s; the margin is for a loaded Windows runner.
timeout = 120
markers = [
  # Boots a Textual app or a real server (screens, keys, snapshots, 找到跳闸): seconds per test.
  # The fast checks run `-m "not tui_boot"`; the `tui` job runs `tui_boot` on every pull request
  # (#858) and the whole set runs on main after the merge. The e2e/visual tier gates pull
  # requests too (#848) — a stale baseline is a pre-merge failure.
  "tui_boot: needs a running Textual app or server",
  "unit: pure logic, the D49 budget guard applies (<=100 ms per test)",
  # Wall-clock budgets (test_performance.py): red on a busy machine, green on an idle one.
  "load_sensitive: needs an idle machine; runs on main, not in the fast checks",
]

[tool.mypy]
python_version = "3.11"
packages = ["simubench"]
mypy_path = "src"
ignore_missing_imports = true
