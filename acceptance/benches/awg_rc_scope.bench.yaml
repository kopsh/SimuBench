schema: simubench.bench/2
name: acceptance-awg-rc-scope
instruments:
  awg: {model: sb-awg-2, address: "TCPIP0::192.168.1.20::5025::SOCKET", state: {ch1.amplitude: 2.0}}
  scope: {model: sb-dso-4, address: "TCPIP0::192.168.1.21::5025::SOCKET"}
parts:
  rc: {type: rc_lowpass, dut: true, params: {r: 1000.0, c: 1.0e-7}}
wires:
  - {from: awg.OUT1, to: rc.IN}
  - from: rc.OUT
    to: scope.CH1
    accessories: [{type: passive_probe, params: {attenuation: 10, r_tip: 1.0e7}}]
run: {seed: 7, clock: stepped}
