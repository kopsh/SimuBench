schema: simubench.bench/2
name: acceptance-rfgen
description: RF generator into a spectrum analyzer; REF_OUT to REF_IN; the generator's timebase is 2 ppm fast (hidden).
instruments:
  rf:
    model: sb-sg-1
    state: {freq.cw: 1.0e9, power.level: 0.0, output.enabled: true}
    hidden: {core: {offset_ppm: 2.0}}
  sa:
    model: sb-sa-1
    state: {freq.center: 1.0e9, freq.span: 5.0e6, display.ref_level: 10.0}
wires:
  - {from: rf.RF_OUT, to: sa.RF_IN}
  - {from: rf.REF_OUT, to: sa.REF_IN}
run: {seed: 5, clock: stepped}
