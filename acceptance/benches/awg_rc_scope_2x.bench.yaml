schema: simubench.bench/1
name: acceptance-awg-rc-scope-2x
description: The scope swapped for the two-channel SB-DSO-2X (different waveform transfer defaults); group 9.
instruments:
  awg: {model: sb-awg-2, address: "TCPIP0::192.168.1.20::5025::SOCKET", state: {ch1.amplitude: 2.0}}
  scope: {model: sb-dso-2x, address: "TCPIP0::192.168.1.21::5025::SOCKET"}
duts:
  rc: {type: rc_lowpass, params: {r: 1000.0, c: 1.0e-7}}
wires:
  - {from: awg.OUT1, to: rc.IN}
  - from: rc.OUT
    to: scope.CH1
    accessories: [{type: passive_probe, params: {attenuation: 10, r_tip: 1.0e7}}]
run: {seed: 7, clock: stepped}
