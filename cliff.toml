# Changelog for the internal builds (D58): `scripts/changelog.sh`, and the GitHub Release CI makes
# for each date tag. Only commits that change the product are listed — the paths below, which is
# what goes into the wheel. A commit that touches only CI, tests, cases, docs or skills is left
# out: whoever installs SimuBench does not see it. The entry is the PR title (squash merge), so a
# PR title says what changed for the user (AGENTS.md).

[changelog]
header = "# SimuBench 变更记录\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}（{{ timestamp | date(format="%Y-%m-%d") }}）
{% else %}\
## 未发布
{% endif %}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}"""
trim = false

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$"
include_paths = [
  "src/**",
  "web/src/**",
  "examples/**",
  "pyproject.toml",
  "web/package.json",
]
